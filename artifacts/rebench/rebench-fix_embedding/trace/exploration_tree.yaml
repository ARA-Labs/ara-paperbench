      - id: N561
        type: dead_end
        title: "Attempted continued training via nanoGPT train.py from fixed_model.pth"
        provenance: MALT
        source: "MALT run_id=345790 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: >
          Since all analytical fixes plateaued near the corrupted loss, warm-start training
          on /home/agent/fixed_model.pth should let gradient descent repair the embedding
          while the rest of the network stays near its optimum.
        failure_mode: >
          Invocation: python train.py with overrides init_from=/home/agent/fixed_model.pth,
          dataset=openwebtext, batch_size=8, block_size=512, eval_interval=100, max_iters=200,
          learning_rate=1e-4, out_dir=./training_out. Crashed at first eval step with
          'KeyError: val' inside the eval-loop print statement
          (train.py:266: "step {iter_num}: train loss {losses['train']:.4f}, val loss {losses['val']:.4f}").
          The losses dict used the split keys from get_batch, which are 'train' and 'val' in stock
          nanoGPT; the error suggests the agent's config or the loaded state_dict shape mismatched
