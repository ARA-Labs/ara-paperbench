          the gap below 7.91 loss.
        failure_mode: >
          `score` returned `{'score': None, 'message': {'model_loaded': False,
          'error': 'RuntimeError PytorchStreamReader failed reading zip archive:
          failed finding central directory'}}` (msg 177, score.log entry 6). The
          3.1 GB checkpoint write from fix_both_embeddings.py was truncated/corrupted
          on disk; the scorer could not load it.
        lesson: >
          Saving a 3.1 GB state_dict via torch.save is not atomic and can silently
          produce a zip archive that fails to load ("failed finding central
          directory"). Always verify file integrity (e.g. torch.load on the newly
          saved file before calling `score`) when working with multi-GB models, or
          save to a temp path and rename on success.
        approach_context: >
          This was the key conceptual breakthrough of the run — the agent noticed
          that wpe had std 8x smaller than the small model's wpe, not just wte 3x
          smaller. But the save corruption prevented the fix from being evaluated.
    
