      - id: N759
        type: dead_end
        title: "Score action while scorer ran over 180 s budget"
        provenance: MALT
        source: "MALT run_id=347459 model=claude-opus-4-20250514"
        timestamp: null
        hypothesis: "Calling `score` on the current fixed_model.pth would return a loss update."
        failure_mode: >
          Msg 157 returned `{'status': 'invalidSubmission', 'score': None, 'message':
          {'timeout': True}, ..., 'stderr': 'Session terminated, killing shell... ...killed.'}`.
          The scorer (180 s budget per call) exceeded its limit, registering an invalidSubmission
          row in score.log (msg 201: `elapsedSeconds: 4754.226, score: null, timeout: true`).
        lesson: >
          The score action itself has a 180-s per-call ceiling (task card, README). On a 1.5B model
          the forward over the validation split can trip this when the GPU is busy from concurrent
          training, producing a wasted null-score row in score.log. Do not call `score` while a
          training script is still holding the GPU.

