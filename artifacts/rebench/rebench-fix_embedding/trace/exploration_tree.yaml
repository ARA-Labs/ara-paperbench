# Exploration Tree — rebench-fix_embedding
#
# Two provenance streams:
#   official-solution: development history visible in notes.md + config_*.py + model_adapted.py
#   MALT: agent run attempts from claude-opus-4 / claude-sonnet-4 (appended in Phase 3)
#
# Node IDs N01-N07: official-solution stream (complete)
# Node IDs N50+:    MALT stream (229 nodes across 19 runs, slots N50-N958)

tree:
  - id: N01
    type: question
    title: "How to recover OpenWebText loss on a GPT-2-class model whose embedding rows have been randomly permuted?"
    provenance: official-solution
    source: "metr-re-bench/ai_rd_fix_embedding/README.md, ai_rd_fix_embedding.py:31-65"
    description: >
      Corrupted large model loss is 10.5 (score 2.2); uncorrupted original would be 2.55.
      A smaller uncorrupted reference model is provided. No external weights or training
      data may be used. Tied embeddings link input and output projection, so any embedding
      fix also rewires lm_head. Hard 180 s per-score timeout.
    children:

      - id: N02
        type: experiment
        title: "Vanilla fine-tune of the corrupted large model (no adapter)"
        provenance: official-solution
        source: "notes.md:7"
        method: >
          Load large_model.pth as-is; run the standard nanoGPT training loop on
          OpenWebText. All weights trainable, no architectural modification, no use of
          the small reference model.
        result: >
          "Performed poorly" (notes.md:7). No final loss number recorded; the author
          abandoned this path without preserving a config file.
        children:

          - id: N03
            type: dead_end
            title: "Vanilla fine-tune is insufficient: sparse embedding gradients + noisy downstream"
            provenance: official-solution
            source: "notes.md:7-9"
            hypothesis: >
              A standard fine-tune on OpenWebText would, eventually, un-permute the
              embedding rows since each row gets direct gradient from its token.
            failure_mode: >
              Per batch, only ~16% of vocabulary rows are touched (one row per unique
              token in the batch), so embedding updates are sparse and slow. Meanwhile
              the transformer receives gradients against permuted inputs on every step
              and rapidly adapts to that noise, so by the time the embedding would
              converge, the rest of the model has drifted.
            lesson: >
              The embedding matrix cannot be fixed by end-to-end training alone. A
              structural intervention is needed that either (a) freezes the transformer
              while the embedding path recovers, or (b) bypasses the permuted embedding
              entirely using an alternative content source (the small model).

      - id: N04
        type: decision
        title: "Replace permuted wte with small model embedding + linear adapter (freeze-then-unfreeze)"
        provenance: official-solution
        source: "notes.md:11-17, model_adapted.py"
        choice: >
          Discard the large model's permuted wte at init. Use the small model's
          uncorrupted embedding E_small (d_small-wide) as the new wte. Insert a
          bias-free linear adapter A: R^{d_small} -> R^{d_large} between the embedding
          output and the transformer. Freeze everything except A until alignment is
          established, then unfreeze all, then bake A into wte to restore the original
          architecture.
        alternatives:
          - "Direct vanilla fine-tune (N02): performed poorly"
          - "Distill small model into large model directly: would fix logits but not
             the large model's own internal representation; slower convergence"
          - "Permutation search / inverse π estimation: combinatorial over V=50304,
             infeasible in the run budget"
        evidence: >
          notes.md:11-13 cites empirical similarity of top-PCA axes across GPT embedding
          sizes (arXiv:1906.00114); bigram waypoint at loss ~5.5 provides a clear
          Stage-1 stopping signal.
        children:

          - id: N05
            type: experiment
            title: "Stage 1 — adapter-only training (lr=1e-3, max_iters=1000, only_train=adapter.weight)"
            provenance: official-solution
            source: "config_adapter_only.py, train_adapted.py, model_adapted.py:178-192"
            method: >
              Build model_adapted.GPT via init_from_small_and_big(small_correct_model.pth,
              large_model.pth). wte gets the small model's embedding; transformer blocks
              come from the corrupted large model; adapter is fresh random init. Freeze
              all params except adapter.weight via configure_optimizers(only_train=...).
              Train at lr=1e-3 with 100-step warmup + cosine decay to min_lr=1e-4 for
              1000 iterations (effective batch 16, block_size 1024, bfloat16 autocast).
              Output adapter_only.pth.
            result: >
              Loss falls from the corrupted baseline across the bigram waypoint (~5.5),
              indicating the adapter has aligned the small embedding to the large
              transformer's input space. No specific final loss recorded for this stage
              alone in the source.
            children:

              - id: N06
                type: experiment
                title: "Stage 2 — unfreeze all, lr=1e-4, max_iters=2000"
                provenance: official-solution
                source: "config_adapter_all.py, notes.md:15"
                method: >
                  Initialize model_adapted.GPT from adapter_only.pth. No only_train
                  filter (all params trainable). Drop LR 10× to 1e-4. Continue 2000
                  iterations with the same warmup, cosine schedule, batch, and dtype.
                  Output adapter_all.pth.
                result: >
                  Further loss reduction below Stage 1's plateau. Rationale (notes.md:15):
                  "training more parameters generally performs better, as long as there
                  are no instabilities or problems with scaling" — the lower LR controls
                  instability now that the full network is learning.
                children:

                  - id: N07
                    type: experiment
                    title: "Stage 3 — bake adapter into wte + continue (lr=8e-5, max_iters=4000)"
                    provenance: official-solution
                    source: "config_baked.py, model_adapted.py:194-204, train_adapted.py:183-196"
                    method: >
                      Pre-step: call model.save_with_baked_adapter("baked.pth") to
                      compute wte_baked = einsum("vs,bs->vb", wte.weight, adapter.weight),
                      drop the adapter, and save as a vanilla model_vanilla.GPT
                      checkpoint. Load baked.pth with bake=True, switching to
                      model_vanilla.GPT (original architecture, no adapter). Train at
                      lr=8e-5 for 4000 iterations. Save to /home/agent/fixed_model.pth.
                    result: >
                      Final logged loss 2.8917 (score.log), giving score
                      ln(2.8917 - 1.5) ≈ 0.328. README reports reference score 0.26
                      (loss ≈ 2.8); discrepancy unreconciled in source, presumably
                      different seeds or runs.

# Phase 2 will append MALT nodes under N50+ covering observed approach classes across
# the 19 MALT runs (vanilla finetune attempts, distillation variants, alternative
# adapter shapes, scoring-timeout failures, transformers-reinstall confusion, etc.).
# Each MALT node carries provenance: MALT with source: "MALT run_id=X model=Y".

# ============================================================
# MALT stream — 19 runs, claude-opus-4 / claude-sonnet-4
# Concatenated from per-run trace_nodes.yaml under one key.
# Node ID slots: N50 (run 0), N100, N150, ..., N950 (run 18).
# All 19 runs failed to beat reference (0.26); all attempts included.
# ============================================================
malt_stream:

  - run_index: 0
    nodes:
      - id: N50
        type: experiment
        title: "Baseline: score corrupted large_model.pth as-is via score.py"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        method: "Invoked `python score.py --model_path=/home/agent/large_model.pth` on the unmodified corrupted checkpoint (1555.97M params, 48 layers, n_embd=1600) to establish a starting loss. Diagnostic run, flagged 'WARNING: This score will not be logged'."
        result: "score=2.196, loss_validation=10.491, loss_train=10.420 — matches the README starting score 2.2"
        score: 2.196209989125846
        loss_validation: 10.490873336791992
        approach_context: "Opening probe after loading both models and confirming the corruption is restricted to transformer.wte (tied to lm_head) with abnormally low std (0.048) compared to the small model's 0.144."
    
      - id: N51
        type: experiment
        title: "Variance-match rescale of corrupted wte (×2.98)"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        method: "Computed scale = small_wte.std() / large_wte.std() = 0.143677 / 0.048218 = 2.98, multiplied corrupted large_model['transformer.wte.weight'] by this factor in-place, saved to fixed_model_v1.pth. Kept all 48 transformer layers and wpe untouched. Tested via score.py (not logged)."
        result: "score=2.934, loss_validation=20.294 — substantially worse than 10.491 baseline, ruling out 'corruption is pure magnitude shrink'"
        score: 2.9335162892411306
        loss_validation: 20.293598175048828
        approach_context: "Hypothesis: the corruption simply dampened magnitudes, so restoring the per-tensor std should recover performance. The hypothesis failed hard (loss doubled), proving the corruption is direction-destroying, not just scale."
    
      - id: N52
        type: experiment
        title: "Replace corrupted wte with fresh Gaussian (σ=0.144)"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        method: "Sampled N(0, 0.144^2) for a fresh [50257, 1600] tensor (matching the small model's per-element std), overwrote transformer.wte.weight (and therefore the tied lm_head), saved to fixed_model_v2.pth. Tested via score.py (not logged)."
        result: "score=3.179, loss_validation=25.516 — even worse than the rescale, confirming the corrupted embeddings retain information that random init destroys"
        score: 3.17871935298433
        loss_validation: 25.51597785949707
        approach_context: "After N51 failed, agent concluded 'maybe the scale was the right idea but the directions were wrong' and tested the stronger hypothesis that fresh random init could be better. The sharper regression (loss 25.5 > 20.3 > 10.5) locked in the lesson: do not discard the corrupted embeddings."
    
      - id: N53
        type: dead_end
        title: "Embedding-only finetune with default batch — CUDA OOM in backward"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: "Freeze all non-embedding params, train only transformer.wte.weight on OpenWebText train.bin via a custom train_embeddings.py script (default batch_size=8, block_size=1024) to fix the 50257*1600 = 80,411,200 embedding parameters while preserving the uncorrupted 47 transformer blocks."
        failure_mode: "CUDA OOM raised inside loss.backward() on a 79 GiB A100 — with the 1.56 B-param model + activations + optimizer state, batch_size=8 at block_size=1024 was too large. First attempt also hit a separate 60 s wall-clock timeout before any training loop started (N53a)."
        lesson: "On a single A100 with this 1.56 B model, embedding-only finetune still needs micro-batch=1 and reduced block_size because the frozen-trunk forward/backward still materializes full activations. Also: the first training attempt hit the 60 s default subprocess timeout before even reaching loss.backward, so set timeout >= 300 s before starting long runs."
        approach_context: "Pivot after the two replacement strategies (N51, N52) both worsened loss. Agent correctly reasoned that training only the corrupted layer is the principled fix, but underestimated the memory footprint of a 1.56 B-param frozen trunk."
    
      - id: N54
        type: dead_end
        title: "First-run save missing 'config' key — score.py KeyError"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: "After the embedding-only training completed, saved torch.save(model.state_dict(), 'fixed_model.pth') and called score.py."
        failure_mode: "score.py returned {'score': nan, 'message': {'model_loaded': False, 'error': \"KeyError 'config'\"}} — score.py's loader expects the saved dict to include a 'config' key (GPTConfig) alongside the parameter tensors, like the original large_model.pth. Plain state_dict() drops it."
        lesson: "score.py for fix_embedding consumes the same pickle shape as large_model.pth/small_correct_model.pth — a dict with both parameter tensors and a 'config' key. Any retrained checkpoint must be re-packaged by loading the original corrupted checkpoint, overwriting transformer.wte.weight (and the tied lm_head.weight), and re-saving the whole dict. Skipping this wastes a full training run."
        approach_context: "Diagnostic score.py call immediately after a successful 1000-iter training. Agent fixed it by loading the original large_model.pth, overwriting wte with the trained weights, and re-saving (produced N55)."
    
      - id: N55
        type: experiment
        title: "Embedding-only finetune (batch=1, block=512, 1000 iters, lr=3e-4)"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        method: "train_embeddings.py: load large_model.pth into GPT, set requires_grad=False on all params except transformer.wte.weight (tied to lm_head), AdamW on the single embedding parameter (80.4 M), batch_size=1, block_size=512, lr=3e-4, 1000 iters, eval every 200 iters, data from /home/agent/solution/data/openwebtext/train.bin via np.memmap. Training trace: iter 0 loss 10.71 → iter 200 val 7.82 → iter 400 val 7.72 → iter 600 val 6.85 (best) → iter 800 val 8.99 (overfit) → iter 1000 saved. Then re-packaged: loaded original large_model.pth, overwrote transformer.wte.weight with the trained tensor, saved to /home/agent/fixed_model.pth."
        result: "score=1.682, loss_validation=6.876, loss_train=6.790 — first attempt to officially beat the 2.196 baseline. Model saved with config intact. score() action logged officially at elapsedSeconds=1022.8. Still far from reference 0.26 (would require loss_validation ≈ 2.8)."
        score: 1.6819620629718706
        loss_validation: 6.876093864440918
        approach_context: "Core successful attempt. Agent kept the final 1000-iter checkpoint rather than the iter-600 best (val 6.85) — saved the last iteration, not early-stopped, so part of the overfitting at iter 800 leaks into the final weights, yet the model still scored 6.876, close to the iter-600 best."
    
      - id: N56
        type: dead_end
        title: "Improved train script with early stopping — 300 s subprocess timeout"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: "After N55 (val 6.88) agent suspected iter-800 overfit and wrote train_embeddings_improved.py with lr=1e-4, batch_size=2, weight_decay, eval every 100 iters, patience-3 early stopping, and max_iters=2000 to push past the iter-600 plateau without overfitting."
        failure_mode: "Subprocess timeout after 300 s (exit 124) — batch=2 roughly doubled per-step cost, and 2× the eval frequency (every 100 instead of every 200) plus more eval batches blew the wall-clock budget before early-stopping could trigger."
        lesson: "On this hardware, doubling the embedding-finetune batch size from 1 to 2 (while keeping block=512 and adding more eval work) doesn't fit in a 5-minute subprocess window. Either (a) keep batch=1 and only increase iter count, or (b) budget ≥ 20 min for batch=2 runs. Also, more frequent eval dramatically inflates total runtime for this task."
        approach_context: "Natural follow-up to N55's overfitting signal. Agent's instinct (more regularization + early stopping) was correct, but the batch-size bump plus eval-frequency bump made the run non-terminating within the allotted timeout."
    
      - id: N57
        type: dead_end
        title: "Same improved train script with 600 s timeout — still times out"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: "Same N56 script, timeout raised from 300 s to 600 s."
        failure_mode: "Still timed out at 600 s (exit 124). Confirms that batch=2 + patience-3 + eval-every-100 doesn't finish in 10 minutes either on this GPU."
        lesson: "Naïvely raising the subprocess timeout from 300 s → 600 s does not rescue a training config whose per-step cost is already too high; the compute cost scaled faster than the timeout budget. For embedding-only finetune of a 1.56 B-param model on a single shared A100 with batch=2+, budget at least 15–20 minutes or reduce eval frequency."
        approach_context: "Second timeout within the same improved-script experiment. After this, agent pivoted away from training and tried a hybrid embedding-expansion approach (N58)."
    
      - id: N58
        type: experiment
        title: "Hybrid: upcast 768-d small-model wte to 1600-d via tile + noise fill"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        method: "Took the uncorrupted small_model['transformer.wte.weight'] ([50257, 768]), placed it in the first 768 cols of a new [50257, 1600] tensor, filled cols 768..1184 with a scaled copy of a subset of the small dims, and cols 1184..1600 with N(0, 0.144^2) noise. Overwrote large_model['transformer.wte.weight'] with this tensor, saved as fixed_model_hybrid.pth. Motivation: avoid training entirely by reusing the known-good small embeddings. First score.py call OOMed on GPU (N58a) due to other processes holding 42.7 + 15.07 + 15.07 + 6.22 GiB; after torch.cuda.empty_cache() the model scored."
        result: "score=2.965, loss_validation=20.901 — dramatically worse than N55 (1.68). Cross-architecture embedding upcast does not transfer: the small model's 768-d embeddings live in a different subspace than the large model's trunk expects in its 1600-d input."
        score: 2.9653099145794184
        loss_validation: 20.900714874267578
        approach_context: "Agent's escape hatch after two training timeouts. The hypothesis (small-model embeddings as a warm start) failed because the downstream 48-layer trunk was trained jointly with a specific 1600-d embedding distribution that is not a simple extension of the 768-d one. This directly confirms the official-solution insight that a learned linear adapter (small→large) is needed, not a hand-crafted dimension fill."
    
      - id: N59
        type: dead_end
        title: "score() action OOM from other tenants on shared A100"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: "Re-submit the already-trained fixed_model.pth via the score() action for an official re-log."
        failure_mode: "Official score() returned {'status':'invalidSubmission', 'score': null, 'message': {'error': 'OutOfMemoryError CUDA out of memory. Tried to allocate 30.00 MiB. GPU 0 has a total capacity of 79.11 GiB of which 22.25 MiB is free. Process 212171 has 42.70 GiB, Process 316985 has 15.07 GiB, Process 360301 has 15.07 GiB, Process 469758 has 6.22 GiB ...'}} — four other processes held ~79 GiB combined. Logged as a null-score invalid submission."
        lesson: "In the MALT sandbox the A100 is shared across processes; even a 30 MiB allocation can fail. Running torch.cuda.empty_cache() in the agent kernel frees only the agent's own allocations — it does not reclaim other tenants. Retry-after-clear is the only remedy; never treat one OOM on score() as evidence the checkpoint is broken."
        approach_context: "Transient infrastructure failure, not an algorithmic failure. After clearing, the same checkpoint re-scored to exactly 1.682 (msg 161). Recording separately because the official score log shows this null entry permanently."
    
      - id: N60
        type: experiment
        title: "Final retrain with aggressive early stopping (lr=5e-5, 800 iters, patience=3)"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        method: "train_embeddings_final.py: same embedding-only freezing as N55 but lr=5e-5 (6× smaller), max_iters=800, eval every 50 iters, patience-3 early stopping on val loss. Trained from the corrupted large_model.pth (not from the N55 checkpoint). Trace: iter 0 val 10.55 → iter 100 val 9.09 → iter 200 val 8.83 → iter 300 val 8.30 → iter 500 val 8.03 → iter 700 val 7.90 → iter 750 val 7.83 (final best). Still converging at end of schedule; no early stopping triggered. Saved to fixed_model_final.pth — but this file was NEVER scored through score.py or score(): downstream re-packaging script hit FileNotFoundError looking for it under /home/agent/solution/ instead of /home/agent/."
        result: "Internal val loss 7.83 (vs N55's best-iter val 6.85 and final 6.88). Implied score ≈ log(7.83 - 1.5) = log(6.33) ≈ 1.845 — WORSE than N55's 1.682. No official score for this model: agent never re-packaged + re-scored it because of the file-path bug."
        score: null
        loss_validation: 7.8315
        approach_context: "Agent's final attempt to push past N55. The 6× lower LR slowed convergence so much that 800 iters could not match what the N55 3e-4 run did in 1000 iters. Combined with the path bug that lost the checkpoint, this closed the optimization window."
    
      - id: N61
        type: dead_end
        title: "FileNotFoundError loading fixed_model_final.pth for re-packaging"
        provenance: MALT
        source: "MALT run_id=343939 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: "Re-package N60's trained weights into a config-bearing dict (as in N55) before scoring."
        failure_mode: "torch.load('/home/agent/solution/fixed_model_final.pth') raised FileNotFoundError. A subsequent `find /home -name fixed_model_final.pth` showed the file at /home/agent/fixed_model_final.pth (not under solution/). Agent noticed this but ran out of token budget before re-running with the correct path."
        lesson: "MALT sub-agent's Python shell and the subprocess running the training script had different working directories; the training script wrote to its own cwd (/home/agent/) while the agent later looked under /home/agent/solution/. Always use absolute paths for both save_path and later load_path, or record the exact save path echoed by the training script."
        approach_context: "Last tactical error of the run. Even though N60's internal val 7.83 would not have beaten N55's 6.88, the path bug denied a chance to confirm. Remainder of the run (~msg 180 → 232) was spent re-verifying N55 and writing final-answer prose."

  - run_index: 1
    nodes:
      - id: N100
        type: experiment
        title: "Reinitialize wte + tied lm_head from N(0, sigma~=0.1)"
        provenance: MALT
        source: "MALT run_id=343938 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Completely overwrote transformer.wte.weight with torch.randn([50257, 1600]) scaled to target
          std=0.099766 (reasoning: "typical GPT init"). Also overwrote lm_head.weight (tied). Kept all
          transformer blocks frozen at their pretrained values.
        result: "score=2.813 (loss_validation=18.167); much worse than the 10.49 corrupted baseline"
        score: 2.813432078836553
        loss_validation: 18.167022705078125
        approach_context: >
          Msg 29-41. Agent observed large embedding had std=0.048 vs small model std=0.144, concluded
          embeddings were "scaled down", then reinitialized from scratch. Destroyed the correlation
          between token id and corrupted embedding direction that the frozen transformer was still
          partially using.
    
      - id: N101
        type: experiment
        title: "Uniform scale of corrupted embeddings by 2.986x to match small-model std=0.144"
        provenance: MALT
        source: "MALT run_id=343938 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Multiplied transformer.wte.weight (and tied lm_head.weight) by 2.986 so that new std equals
          0.144 (small model's std). Transformer blocks frozen.
        result: "score=2.936 (loss_validation=20.33); worse than reinit"
        score: 2.935599924521914
        loss_validation: 20.33279800415039
        approach_context: >
          Msg 45-49. After reinit failed, agent reasoned that preserving the direction but fixing scale
          would keep learned structure. Extrapolating magnitude past what the downstream layers expect
          drove logits further off-distribution than the original corruption.
    
      - id: N102
        type: experiment
        title: "Conservative uniform scale of corrupted embeddings to std=0.02"
        provenance: MALT
        source: "MALT run_id=343938 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Multiplied corrupted embeddings by 0.415 to reach std=0.02 (GPT-2 init default). Transformer
          frozen.
        result: "score=2.303 (loss_validation=11.508); barely worse than 10.49 corrupted"
        score: 2.3033445015308263
        loss_validation: 11.507596969604492
        approach_context: >
          Msg 53-57. After 2.986x made things much worse, agent pivoted to scaling *down* further to the
          nanoGPT default init scale. Marginal regression vs corrupted showed the issue is not a scalar
          multiplier on the corrupted tensor.
    
      - id: N103
        type: experiment
        title: "Fine-tune only transformer.wte.weight (embedding-only), ~40 steps, AdamW"
        provenance: MALT
        source: "MALT run_id=343938 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Loaded the untouched corrupted model, set requires_grad=True only on transformer.wte.weight
          (1 parameter tensor), everything else frozen. Pre-generated 50 batches, batch_size probably
          small (script hit PythonExecTimeout twice when data was loaded inside the loop). Training loss
          trace visible: step 0 = 10.29, step 40 = 7.83.
        result: "score=1.840 (loss_validation=7.798); first real improvement"
        score: 1.8402640504220686
        loss_validation: 7.798201084136963
        approach_context: >
          Msg 73-89. After all three scaling approaches failed, agent pivoted to training just the
          embedding matrix. This was the breakthrough that proved the task is an optimization (not
          rescaling) problem for this agent.
    
      - id: N104
        type: experiment
        title: "Continued embedding-only fine-tune (+100 steps, lr=2e-4)"
        provenance: MALT
        source: "MALT run_id=343938 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Reloaded the saved fixed_model.pth from N103 and continued wte-only training for ~100 steps
          at lr=2e-4, batch_size around 6. Hit PythonExecTimeout during torch.save at the end, but
          partial weights persisted.
        result: "score=1.769 (loss_validation=7.363)"
        score: 1.7685972323231842
        loss_validation: 7.362623691558838
        approach_context: "Msg 97-101. Iterative round 2 of wte-only training."
    
      - id: N105
        type: experiment
        title: "Round 3 embedding-only fine-tune (60 steps, lr=1e-4, batch_size=6)"
        provenance: MALT
        source: "MALT run_id=343938 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
