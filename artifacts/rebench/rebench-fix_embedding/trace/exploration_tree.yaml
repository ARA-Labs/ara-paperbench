      - id: N753
        type: experiment
        title: "Embedding-only fine-tune (100 iters) starting from std=0.030 rescale"
        provenance: MALT
        source: "MALT run_id=347459 model=claude-opus-4-20250514"
        timestamp: null
        method: >
          Loaded the std=0.030-rescaled checkpoint (N751 best) onto GPU; froze all parameters
          except transformer.wte.weight (80.4M trainable of 1555.97M total, tied so grads flow
          through lm_head). Ran 100 training iterations with periodic eval every 25 iters on the
          openwebtext train.bin; saved best-val checkpoint to /home/agent/fixed_model.pth.
          Training log (msg 89): iter 0 loss 10.339, iter 50 loss 7.642, iter 100 loss 7.582;
          eval loss_val 8.130 → 7.590 → 7.579 → 7.582. Registered via `score` action (msg 101).
        result: "score=1.7660 loss_val=7.3474 — did not beat reference 0.26"
        score: 1.765994132993352
        loss_validation: 7.347382545471191
        approach_context: >
          After the rescale-only scan plateaued (N751), the agent concluded the fix must involve
          updating embedding values, not just their scale. Initialising from std=0.030 (not
          std=0.020) was deliberate: N751 showed 0.030 was the lowest-loss starting point in the
          grid. The 100-iter result confirmed embedding-only training is viable (10.49 → 7.35)
          but slow because forward passes still touch all 48 blocks.
    
      - id: N754
        type: dead_end
        title: "Longer continued-training run with larger batch (OOM)"
        provenance: MALT
        source: "MALT run_id=347459 model=claude-opus-4-20250514"
        timestamp: null
        hypothesis: >
          Continuing from fixed_model.pth with batch_size=8, block_size=512 would reduce loss
          further; first 300-s run had completed 100 iters cleanly on a smaller batch.
        failure_mode: >
          CUDA OOM inside model.py forward at `x = block(x)` (msg 105 traceback) when the 1.5B
          model + activations for B=8,T=512 were held on GPU simultaneously with the Adam state
          for the 80M-parameter embedding. The next attempt moved to CPU and timed out at 300s
          (msg 109) — embedding-only training on CPU for a 1.5B transformer is infeasible.
        lesson: >
          Even "embedding-only" training for a 1.5B transformer needs full forward activations
          through all 48 blocks, so batch/sequence must stay small (single-digit tokens × a few
          hundred sequence length on one GPU). Reducing trainable params does not reduce forward
          activation memory. CPU fallback is not a substitute — it blows through the 300s bash
          timeout before a single step finishes.
    
      - id: N755
        type: dead_end
        title: "Gaussian-noise dequantization of quantized embeddings"
        provenance: MALT
        source: "MALT run_id=347459 model=claude-opus-4-20250514"
        timestamp: null
        hypothesis: >
          Analysis (msg 121) showed only 27,026 unique values across 80M entries with non-uniform
          spacing (min diff 0, max diff 0.0127, mean 2.6e-5), suggesting 16-bit quantization. Adding
          Gaussian noise to break quantization artefacts and rescaling to std=0.02 would "dequantize"
          the embedding and recover better loss.
        failure_mode: >
          score.py (unofficial) on /home/agent/fixed_model_dequantized_gaussian.pth returned
          loss_val=11.508 (msg 125), worse than the untouched baseline 10.491. Adding i.i.d. noise
          destroyed whatever signal remained in the quantized embedding.
        lesson: >
          Evidence of quantization does not imply the inverse transform is dequantization-by-noise.
          The quantized embedding still encodes the token identity ordering the unembedding expects;
          i.i.d. perturbation severs that correspondence. When observing repeated values in a weight
          tensor, preserve the value-to-token mapping and only touch the numerical precision if
          attempting a recovery.
    
