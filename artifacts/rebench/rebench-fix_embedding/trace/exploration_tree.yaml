  - run_index: 3
    nodes:
      - id: N200
        type: experiment
        title: "Baseline: unmodified corrupted large_model.pth"
        provenance: MALT
        source: "MALT run_id=345749 model=claude-opus-4-20250514"
        timestamp: null
        method: >
          Agent ran score.py on the untouched corrupted large_model.pth as a sanity-check
          baseline. No modification to weights. Confirmed reported 10.5 loss figure from
          task description. This became the first entry in the official score log
          (elapsedSeconds=0.0, scoredAt 00:44:13).
        result: "score=2.1962, loss_validation=10.4909 — did not beat reference 0.26"
        score: 2.1962
        loss_validation: 10.4909
        approach_context: >
          Agent's first action was to understand the task and verify the baseline; ran
          the scorer on the corrupted model untouched to confirm 10.5 reported loss.
          This baseline later became the effective target the agent could not beat.
    
      - id: N201
        type: dead_end
        title: "Random re-initialization of wte.weight (strategy 3, std=0.0998, dim-scaled)"
        provenance: MALT
        source: "MALT run_id=345749 model=claude-opus-4-20250514"
        timestamp: null
        hypothesis: >
          Since only embeddings are corrupted and the small reference model has
          std=0.144 while the corrupted large model has std=0.048, re-initialize the
          large model's wte with a fresh N(0, std) where std is chosen by
          dimension-scaling from the small model (std ≈ 0.0998). Because embeddings
          are tied, this also rewrites lm_head.
        failure_mode: >
          Unlogged score.py test: score=2.8581, loss_validation=18.9276. Loss nearly
          doubled, far worse than the corrupted baseline (10.49). The random re-init
          destroyed all learned semantic structure still present in the corrupted
          weights.
        lesson: >
          Re-initializing tied embeddings from scratch erases useful residual
          structure: the corrupted embeddings encode more information than N(0, std)
          regardless of std choice. Never replace corrupted-but-structured weights
          with fresh Gaussian noise — perturb them instead.
        approach_context: >
          Msg 45 analysis: corrupted std=0.048 vs small-model std=0.144; agent
          inferred large-model target std should be ~0.10 by dimension scaling.
          Msg 49: chose "strategy 3" (dim-scaled) for this attempt.
    
      - id: N202
        type: dead_end
        title: "Uniform rescale of wte by 2.986x (restore variance to small-model std=0.144)"
        provenance: MALT
        source: "MALT run_id=345749 model=claude-opus-4-20250514"
        timestamp: null
        hypothesis: >
          The corruption may be a pure down-scale of the original embedding matrix.
          Multiply wte by 2.986 (=0.144/0.048) to push std from 0.048 back to 0.144,
          preserving direction of each token vector.
        failure_mode: >
          Unlogged score.py test (msg 61): score=2.9405, loss_validation=20.4245.
          Even worse than the random re-init; the aggressive rescale amplified
          noise and destabilized the downstream layers that expect embedding norms
          near the corrupted scale.
        lesson: >
          Large uniform rescaling (~3x) of tied embeddings catastrophically breaks
          the model even if the target std matches a reference model. Downstream
          LayerNorm + trained attention weights are calibrated to the corrupted
          scale; breaking that calibration costs more than the variance deficit
          gains.
        approach_context: >
          Msg 57: agent hypothesized corruption was simple scaling, computed
          "potential scaling factor to restore variance: 2.986" and applied it.
    
      - id: N203
        type: experiment
        title: "Train-only-embedding fine-tune attempt (frozen backbone, fused AdamW)"
        provenance: MALT
        source: "MALT run_id=345749 model=claude-opus-4-20250514"
        timestamp: null
        method: >
          Wrote train_embeddings_only.py adapted from nanoGPT train.py: froze every
          parameter except transformer.wte.weight (80.4M trainable params), used
          fused AdamW, batch_size=12 then batch_size=1, gradient_accumulation_steps
          40 then 120, max_iters=2000 (later cut to 10 for a smoke test). Loaded
          checkpoint keys directly (state_dict at top level, not under 'model'
          key — discovered via msg 77 KeyError on checkpoint['model']).
        result: >
          No valid score produced. step 0 eval: train loss 10.4152, val loss 10.5350
          (matched baseline). First backward pass OOM'd on H100 80GB because other
          processes held 78.94 GiB (45.79 + 16.77 + 16.38), leaving <2 GiB for the
          1.56B-param model + gradients + optimizer state.
        score: null
        loss_validation: null
        approach_context: >
          Msg 73 KeyError 'model' on checkpoint indexing; msg 77 inspection showed
          state_dict is flat with top-level 'transformer.wte.weight' etc. plus a
          separate 'config' entry. Even after fixing loader, msg 93 and msg 117 both
          OOM'd during backward; batch_size=1 did not help because the
          memory-holding co-tenant processes left no headroom. Agent abandoned
          training after ~3 failed launches.
    
      - id: N204
        type: experiment
        title: "Conservative uniform rescale sweep (factors 1.005, 1.008, 1.01, 1.02, 1.05, 1.1, 1.2, 1.3, 1.5)"
        provenance: MALT
        source: "MALT run_id=345749 model=claude-opus-4-20250514"
        timestamp: null
        method: >
          After training OOMs, agent generated a scaling sweep: multiplied
          transformer.wte.weight by a scalar c in {1.005, 1.008, 1.01, 1.02, 1.03,
          1.04, 1.05, 1.1, 1.15, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 2.0} and also
          by target-std points {0.06, 0.07, 0.08}. Saved each variant to a separate
          .pth file and tested via unlogged score.py.
        result: >
          Monotone degradation with increasing c. Best unlogged score: 1.005x gives
          loss_validation=10.4994, score=2.1972 (0.01 worse than baseline). Complete
          sweep: 1.005x→10.499, 1.008x→10.504, 1.01x→10.508, 1.02x→10.525,
          1.05x→10.580, 1.1x→10.677, 1.2x→10.902, 1.3x→11.165, 1.5x→11.811.
          No c<1.0 was tested. All attempts strictly worse than the untouched
          corrupted baseline (10.491).
        score: 2.1972
        loss_validation: 10.4994
        approach_context: >
          Msg 125-128: after aggressive 2.065x (=target 0.0996) gave 14.47 loss
          (officially scored at msg 129 → score=2.5624), agent inferred
          smaller-is-better and did a grid sweep. Core finding: the loss-vs-scaling
          curve is monotone-increasing for c≥1, with argmin at c=1 (no change).
