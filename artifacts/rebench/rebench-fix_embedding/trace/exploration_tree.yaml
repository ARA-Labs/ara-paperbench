          process plus at least two other tenants (~35 + 41 GiB) leave <20 MiB for
          the scorer. Any training path must either (a) mixed-precision + gradient
          checkpointing + small batch so scoring fits alongside, (b) train-then-kill
          before scoring, or (c) use a small adapter to keep the trainable
          footprint tiny. A naïve `only_train=wte` script is not sufficient even
          though only 80 M of 1.56 B parameters receive gradients — optimizer state,
          activations, and the forward pass of the frozen 1.48 B tensors still
