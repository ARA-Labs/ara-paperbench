          route (msg 177).
        lesson: >
          The nanoGPT train.py expects init_from to be 'scratch'/'resume'/'gpt2*' (not a file
          path); agents must either resume from an out_dir checkpoint dict (with iter_num,
          model_args, etc.) or carefully hand-load state_dict and guarantee both 'train' and
          'val' splits are evaluated. A bare raw state_dict file triggers this exact
          "KeyError: 'val'" failure.
    
      - id: N562
        type: experiment
        title: "Float32 + permute ROWS of wte ascending by L2 norm (token-index sort)"
        provenance: MALT
        source: "MALT run_id=345790 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Computed per-token norm = wte.norm(dim=1); got sort_idx = argsort(norm); assigned
          wte_new = wte[sort_idx]. Row i of the output is now the originally-existing
          embedding with the i-th smallest L2 norm. Kept float32 + tying, saved to
          fixed_model.pth.
        result: "score=1.9297, loss_validation=8.39 — did not beat reference 0.26 (msg 189)"
        score: 1.9297113314648902
        loss_validation: 8.387521743774414
        approach_context: >
          Under the "corruption is a row permutation" hypothesis, sorting rows by a scalar
          proxy (L2 norm) drops loss 10.49 -> 8.39, the only clear improvement in the run.
          This is explicitly NOT an inverse-of-permutation result (no attempt to use the small
          model's embedding-norm order); it happens to partially align frequent tokens
          (typically small-norm) with low row indices. The agent misinterprets this as having
          identified the corruption mechanism; see insights.yaml.
    
      - id: N563
        type: experiment
        title: "Float32 + permute ROWS of wte ascending by per-row MEAN"
        provenance: MALT
        source: "MALT run_id=345790 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Same as N562 but sort key is wte.mean(dim=1) instead of wte.norm(dim=1). Row means
          span [-0.0136, 0.0014] so this sort produces a very different permutation than N562.
        result: "score=2.4779, loss_validation=13.42 — did not beat reference 0.26 (msg 197)"
        score: 2.477933445506833
        loss_validation: 13.41661262512207
        approach_context: >
          Variation of N562 to see if the L2-sort success generalizes. It doesn't: sorting by
          mean is strictly worse than the corrupted baseline. This is evidence that the N562
          improvement is not from uncovering the true permutation but from a specific
          frequency/norm alignment.
    
      - id: N564
        type: experiment
        title: "Float32 + permute ROWS of wte DESCENDING by L2 norm"
        provenance: MALT
        source: "MALT run_id=345790 model=claude-sonnet-4-20250514"
        timestamp: null
        method: >
          Same as N562 but reversed order: largest-norm tokens placed at row 0.
        result: "score=2.4802, loss_validation=13.44 — did not beat reference 0.26 (msg 205)"
        score: 2.4802114346727104
        loss_validation: 13.4437894821167
        approach_context: >
          Directly refutes the "sort-by-norm is the inverse of the corruption" theory: the
          inverse direction would not differ by 5 nats. Confirms N562 is a fortuitous
          alignment effect, not a true un-permutation.

