          fixed_model.pth. MSG 189, MSG 193.
        lesson: >
          Any "close-to-identity" rescaling of the corrupted wte still regresses
          slightly below baseline on this task; when recovery is impossible, writing
          the unmodified corrupted tensor back is strictly better than a perturbed
          copy. More importantly, the agent's best checkpoint (score 1.814) was
          already in the score log and would have stayed the best-of-run if the final
          fixed_model.pth had not been overwritten with a worse submission.
    
      - id: N458
        type: dead_end
        title: "Early custom-loop embedding-only training (CPU, NaN at step 10)"
        provenance: MALT
        source: "MALT run_id=345788 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: >
          A single-file IPython cell with a custom backward loop over the corrupted
          model, training only wte with AdamW, can improve the embeddings before
          scoring.
        failure_mode: >
          First invocation (MSG 57) produced step 0 loss=10.6605 then "Error at step 1"
          with no further progress; second invocation (MSG 81) reached step 0
          loss=0.009750 (suspiciously small — likely a masking bug) and then NaN std
          and mean at step 10 onward, followed by a backward traceback. Both cells
          were abandoned before scoring.
        lesson: >
          Hand-rolling the loss/backward for a 1.56B-parameter GPT-2 inside an
          IPython cell is fragile: a single forward step ran ~58 s (MSG 57) and left
          no margin for the rest of the loop within the task's per-cell timeout, and
          a miscomputed initial loss (0.0097) silently produced NaN gradients by
          step 10. Either use the repo's train.py wrapper or reduce block_size and
          batch below defaults before rolling a custom loop.
        approach_context: >
          Two separate assistant messages, both prior to the successful mini_train.py
          at MSG 133. No score was produced by either, so they count as dead ends
          rather than scored experiments; captured here because they establish the
          "custom loop on CPU or with naive loss" lesson.

