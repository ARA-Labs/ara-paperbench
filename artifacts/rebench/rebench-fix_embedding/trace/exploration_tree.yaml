      - id: N400
        type: dead_end
        title: "Re-initialize only wte.weight; load all other corrupted weights"
        provenance: MALT
        source: "MALT run_id=345748 model=claude-opus-4-20250514"
        timestamp: null
        hypothesis: >
          Since only the embedding layer is described as corrupted, create a fresh GPT(config)
          and copy every weight from large_model.pth except transformer.wte.weight; lm_head.weight
          is loaded normally. Re-initialized embeddings should restore the model.
        failure_mode: >
          After 'skipping' wte.weight, the model's embeddings ended up BYTE-IDENTICAL to the
          corrupted ones (mean=-0.000260, std=0.048227 matched exactly; max diff 0.0). Running
          score still returned loss_validation=10.49 / score=2.196, unchanged from corrupted
          baseline (msg 73). Debugging revealed wte.weight and lm_head.weight share the same
          Python object id (msg 129: 'wte weight id: 140395052467792, lm_head weight id:
          140395052467792, Are they the same object? True'); loading lm_head.weight
          overwrites wte.weight through the alias.
        lesson: >
          In nanoGPT GPT class, wte.weight and lm_head.weight are the SAME tensor (weight
          tying via shared reference, not via explicit tie). To actually leave embeddings
          fresh you must skip BOTH 'transformer.wte.weight' AND 'lm_head.weight' in the
          state_dict load; skipping only one silently re-corrupts via the alias.
        approach_context: >
          First attempted fix after confirming corruption (loss_val 10.49 vs expected 2.55)
          and confirming models differ in architecture (large=1600d/48L, small=768d/12L) so
          direct embedding transfer impossible. Score messages 37, 73 both reproduced the
          corrupted baseline.
    
