          additional steps. Training loss trace captured before torch.save timeout:
          step 0=8.5388, step 40=8.2699, step 80=8.4854, step 120=7.9805, step 160=6.6251.
          Model saved before the save-step timeout wrote the final weights, giving the
          run's best validation.
        result: "score=1.814 — did not beat reference 0.26 (best of run)"
        score: 1.8140837951698843
        loss_validation: 7.6354522705078125
        approach_context: >
          Direct extension of N454. Score re-measured twice (MSG 149, MSG 157) with
          identical result, confirming it is the persisted checkpoint and not a
          transient evaluation. This is the run's best result.
    
      - id: N456
        type: dead_end
        title: "Extended continue-train (lr=5e-5, batch=4, 100 iters) — save timeout corrupts pth"
        provenance: MALT
        source: "MALT run_id=345788 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: >
          Lower lr (5e-5) with a larger micro-batch (4) on top of the 7.64 checkpoint
          will push loss_validation below 7 toward the 2.55 target.
        failure_mode: >
          Training ran 100 iters (step 0=7.86, step 25=avg 7.79, step 50=avg 7.71,
          step 75=avg 7.73, final avg 7.55) but torch.save hit the python exec
          timeout mid-write, producing an incomplete zipfile. Next scoring call
          returned score=null and
          message={'model_loaded': False, 'error': 'RuntimeError PytorchStreamReader
          failed locating file data/1: file not found'}. MSG 161, MSG 165.
        lesson: >
          Saving a 1.56B-parameter state_dict (~6.2 GB) via torch.save during this
          task's execution timeout is not reliable in a single code-block call; a
          partial write leaves the target file in a state that torch.load rejects with
          "PytorchStreamReader failed locating file data/1". Use save-to-temp +
          os.rename, or checkpoint only the wte tensor and re-merge at scoring time,
          to avoid bricking the submission.
    
      - id: N457
        type: dead_end
        title: "Final 'lightweight transformation' submission (no training)"
        provenance: MALT
        source: "MALT run_id=345788 model=claude-sonnet-4-20250514"
        timestamp: null
        hypothesis: >
          With training budget exhausted by timeouts and the fixed_model.pth
          corrupted, a small deterministic perturbation of the corrupted wte (std
          moved from 0.048218 to 0.050659, mean ~-0.000273) preserves baseline
