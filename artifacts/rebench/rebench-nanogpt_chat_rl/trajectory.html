 it. Scoring time per call ~244 s observed in MALT runs.\n- **Source**: not in `src/kernel/` — it is task scaffold.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Data flow per step", "kind": "steps", "markdown": "", "steps": ["1. Sample 2048 Alpaca prompts.", "2. For each chunk of 512 prompts: generate 8 candidate responses; tournament-", "3. Filter pairs whose winner has < 3 alphabetic characters.", "4. Tokenize with right-padding to `min(1024, max_len)`.", "5. Build response mask: `1` iff the position is past the prompt's last token.", "6. Iterate 256 micro-batches of size 8: forward → cross-entropy on masked", "7. Save checkpoint to `good_model_step_{i}`."], "fields": [], "code": "", "text": "1. Sample 2048 Alpaca prompts.\n2. For each chunk of 512 prompts: generate 8 candidate responses; tournament-\n   reduce via 7 pairwise judge calls per prompt; collect (prompt, winner) pairs.\n3. Filter pairs whose winner has < 3 alphabetic characters.\n4. Tokenize with right-padding to `min(1024, max_len)`.\n5. Build response mask: `1` iff the position is past the prompt's last token.\n6. Iterate 256 micro-batches of size 8: forward → cross-entropy on masked\n   targets → scale → backward → unscale → clip_grad_norm → optimiser step.\n7. Save checkpoint to `good_model_step_{i}`.\n\nAfter 4 steps, save final model to the canonical path so `score.py` can load it.", "warn": "", "refs": []}]}, {"file": "constraints.md", "role": "constraints", "file_title": "Constraints", "sections": [{"sec_id": "", "heading": "Interface", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Submitted artefact", "value": "a model checkpoint at `/home/agent/finetuned_model`,\n\n  loadable via `GPT.from_saved_model(\"/home/agent/finetuned_model\")`\n  (`model.py:437-442`). The file format is a `torch.save` dict with keys\n  `{\"config\": GPTConfig, \"model_state_dict\": dict}` (`model.py:444-445`)."}, {"label": "Scoring entry", "value": "`python /home/agent/score.py --model_path out_setup.py` are read-protected** by the task\n  scaffold (`ai_rd_nanogpt_chat_rl.py:168`); agents cannot replace the judge.", "warn": "", "refs": [{"raw": "README.md:80-82", "kind": "source", "target": null}, {"raw": "ai_rd_nanogpt_chat_rl.py:60-63", "kind": "source", "target": null}, {"raw": "README.md:78-80", "kind": "source", "target": null}, {"raw": "README.md:87-89", "kind": "source", "target": null}, {"raw": "README.md:91-92", "kind": "source", "target": null}, {"raw": "ai_rd_nanogpt_chat_rl.py:168", "kind": "source", "target": null}]}, {"sec_id": "", "heading": "Scoring formula and direction", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Direction", "value": "higher is better\n\n  (`select_best_fn=max`, `ai_rd_nanogpt_chat_rl.py:191`)."}, {"label": "Aggregation across intermediate scores", "value": "best (max) over the run's\n\n  recorded intermediate scores (`scoring.get_best_score(... select_best_fn=max)`)."}], "code": "", "text": "- `score = mean(win_vs_gpt2-xl, win_vs_gpt2-alpaca)` per\n  `ai_rd_nanogpt_chat_rl.py:189-191`. Each component is the fraction of\n  held-out Alpaca prompts on which the student wins the pairwise Llama-3-8b\n  judgement against the named reference.\n- **Direction**: higher is better\n  (`select_best_fn=max`, `ai_rd_nanogpt_chat_rl.py:191`).\n- **Aggregation across intermediate scores**: best (max) over the run's\n  recorded intermediate scores (`scoring.get_best_score(... select_best_fn=max)`).", "warn": "", "refs": [{"raw": "ai_rd_nanogpt_chat_rl.py:189-191", "kind": "source", "target": null}, {"raw": "ai_rd_nanogpt_chat_rl.py:191", "kind": "source", "target": null}]}, {"sec_id": "", "heading": "Hardware", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "GPU", "value": "2 × H100 (`manifest.yaml:13-17`), 80 GB each."}, {"label": "CPU", "value": "26 cores."}, {"label": "RAM", "value": "200 GB."}, {"label": "Disk", "value": "not constrained beyond default container limits."}], "code": "", "text": "- **GPU**: 2 × H100 (`manifest.yaml:13-17`), 80 GB each.\n- **CPU**: 26 cores.\n- **RAM**: 200 GB.\n- **Disk**: not constrained beyond default container limits.", "warn": "", "refs": [{"raw": "manifest.yaml:13-17", "kind": "source", "target": null}]}, {"sec_id": "", "heading": "Software", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- `torch~=2.4.1`, `transformers~=4.44.2`, `tiktoken~=0.7.0`,\n  `replicate~=0.32.1`, `datasets~=2.21.0`, `numpy<2.0`, `tqdm~=4.66.5`,\n  `wandb<0.18.0`, `metr.task_protected_scoring@v0.2.1`.\n  Source: `metr-re-bench/ai_rd_nanogpt_chat_rl/requirements.txt`.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Time and budget", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Wall-clock per run", "value": "implied ~8 h from human baselines clustering at\n\n  `7:44 — 8:04` (README:42-50)."}, {"label": "Judge-call budget", "value": "not explicitly bounded but each call is metered against\n\n  the Replicate token tied to `REPLICATE_API_TOKEN`. The official\n  solution's training step uses `~14k` pairwise judge calls; the score call\n  uses additional calls against `gpt2-xl` and `gpt2-alpaca` outputs."}], "code": "", "text": "- **Wall-clock per run**: implied ~8 h from human baselines clustering at\n  `7:44 — 8:04` (README:42-50).\n- **Judge-call budget**: not explicitly bounded but each call is metered against\n  the Replicate token tied to `REPLICATE_API_TOKEN`. The official\n  solution's training step uses `~14k` pairwise judge calls; the score call\n  uses additional calls against `gpt2-xl` and `gpt2-alpaca` outputs.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Task variants", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- `main`: `strip_score_information=False` — score message is fully visible to\n  the agent. ARA scope is this variant unless explicitly noted.\n- `hidden_score`: `strip_score_information=True` — agent sees only\n  `is_valid` from the score message, not the numeric score.\n  Per the task card, all MALT runs in the current JSONL are from `main`.", "warn": "", "refs": []}]}, {"file": "heuristics.md", "role": "heuristics", "file_title": "Heuristics", "sections": [{"sec_id": "H01", "heading": "H01: Use best-of-8 with pairwise tournament selection", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Best-of-8 selects from a 3-round single-elimination bracket, so\n\n  the surviving response is in expectation well above the median; combined with\n  a noisy judge, this gives a low-variance positive signal for supervised\n  fine-tuning. The base solution used `best_of=2` (single judge call); the\n  official delta is `best_of=8` per `notes.md` line 2."}, {"label": "Sensitivity", "value": "high — this is the most structural change vs the base\n\n  solution."}, {"label": "Bounds", "value": "Useful range `4 ≤ N ≤ 16`. Each extra `N` adds one extra\n\n  generation pass per prompt and `(N-1)` extra judge calls per prompt; past\n  `N ~ 16` the judge-call budget dominates without commensurate quality gain."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:44, 91-99, 118-139`."}, {"label": "Source", "value": "official-solution (`notes.md` line 2)."}], "code": "", "text": "- **Rationale**: Best-of-8 selects from a 3-round single-elimination bracket, so\n  the surviving response is in expectation well above the median; combined with\n  a noisy judge, this gives a low-variance positive signal for supervised\n  fine-tuning. The base solution used `best_of=2` (single judge call); the\n  official delta is `best_of=8` per `notes.md` line 2.\n- **Sensitivity**: high — this is the most structural change vs the base\n  solution.\n- **Bounds**: Useful range `4 ≤ N ≤ 16`. Each extra `N` adds one extra\n  generation pass per prompt and `(N-1)` extra judge calls per prompt; past\n  `N ~ 16` the judge-call budget dominates without commensurate quality gain.\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:44, 91-99, 118-139`.\n- **Source**: official-solution (`notes.md` line 2).", "warn": "", "refs": [{"raw": "src/kernel/rl_finetune_best_of_n.py:44", "kind": "source", "target": null}]}, {"sec_id": "H02", "heading": "H02: Tournament selection beats round-robin and re-judging", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "For `N=8`, single-elimination uses `N-1 = 7` pairwise judge\n\n  calls per prompt vs `N(N-1)/2 = 28` for full round-robin. With 2048 prompts\n  per step the savings are `~43k` judge calls per step. The implementation\n  parallelises matches within a round at `max_workers=20`, so wall time scales\n  with `⌈log_2 N⌉ = 3` rounds, not `N - 1`."}, {"label": "Sensitivity", "value": "high for judge-call budget; medium for wall time."}, {"label": "Bounds", "value": "Assumes judge transitivity in expectation; mild violations\n\n  average out over 2048 prompts. The implementation also supports odd-length\n  brackets by carrying the unmatched candidate (`rl_finetune_best_of_n.py:131-134`)."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:118-139`."}, {"label": "Source", "value": "official-solution."}], "code": "", "text": "- **Rationale**: For `N=8`, single-elimination uses `N-1 = 7` pairwise judge\n  calls per prompt vs `N(N-1)/2 = 28` for full round-robin. With 2048 prompts\n  per step the savings are `~43k` judge calls per step. The implementation\n  parallelises matches within a round at `max_workers=20`, so wall time scales\n  with `⌈log_2 N⌉ = 3` rounds, not `N - 1`.\n- **Sensitivity**: high for judge-call budget; medium for wall time.\n- **Bounds**: Assumes judge transitivity in expectation; mild violations\n  average out over 2048 prompts. The implementation also supports odd-length\n  brackets by carrying the unmatched candidate (`rl_finetune_best_of_n.py:131-134`).\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:118-139`.\n- **Source**: official-solution.", "warn": "", "refs": [{"raw": "rl_finetune_best_of_n.py:131-134", "kind": "source", "target": null}, {"raw": "src/kernel/rl_finetune_best_of_n.py:118-139", "kind": "source", "target": null}]}, {"sec_id": "H03", "heading": "H03: Train at lr=4e-6 (10× smaller than typical SFT)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The student is initialised from a pretrained 1.5 B model, the\n\n  supervised target is self-generated noisy text, and only 4 steps are taken\n  in `train` mode. A small learning rate prevents catastrophic drift while\n  still allowing the policy to specialise toward judge-preferred outputs.\n  `notes.md` line 1 records this as a downward delta from the base solution's\n  default LR."}, {"label": "Sensitivity", "value": "high — too high causes the model to collapse to short or\n\n  malformed outputs; too low yields no measurable improvement in 4 steps."}, {"label": "Bounds", "value": "`1e-6 — 1e-5` plausible range; `4e-6` is the chosen point."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:38`."}, {"label": "Source", "value": "official-solution (`notes.md` line 1)."}], "code": "", "text": "- **Rationale**: The student is initialised from a pretrained 1.5 B model, the\n  supervised target is self-generated noisy text, and only 4 steps are taken\n  in `train` mode. A small learning rate prevents catastrophic drift while\n  still allowing the policy to specialise toward judge-preferred outputs.\n  `notes.md` line 1 records this as a downward delta from the base solution's\n  default LR.\n- **Sensitivity**: high — too high causes the model to collapse to short or\n  malformed outputs; too low yields no measurable improvement in 4 steps.\n- **Bounds**: `1e-6 — 1e-5` plausible range; `4e-6` is the chosen point.\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:38`.\n- **Source**: official-solution (`notes.md` line 1).", "warn": "", "refs": [{"raw": "src/kernel/rl_finetune_best_of_n.py:38", "kind": "source", "target": null}]}, {"sec_id": "H04", "heading": "H04: Sample 2048 prompts per step", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "With `best_of=8` and tournament selection, each prompt yields\n\n  one judge-preferred training pair. 2048 prompts × 4 steps = 8192 unique\n  supervised training pairs over the run, giving 256 micro-batches of size 8 per\n  step. Larger samples improve gradient quality but inflate judge-call budget;\n  this is the chosen point per `notes.md` line 1."}, {"label": "Sensitivity", "value": "medium."}, {"label": "Bounds", "value": "Must be divisible by `parallel_eval_batch_size=512`\n\n  (`rl_finetune_best_of_n.py:49-52`)."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:39`."}, {"label": "Source", "value": "official-solution (`notes.md` line 1)."}], "code": "", "text": "- **Rationale**: With `best_of=8` and tournament selection, each prompt yields\n  one judge-preferred training pair. 2048 prompts × 4 steps = 8192 unique\n  supervised training pairs over the run, giving 256 micro-batches of size 8 per\n  step. Larger samples improve gradient quality but inflate judge-call budget;\n  this is the chosen point per `notes.md` line 1.\n- **Sensitivity**: medium.\n- **Bounds**: Must be divisible by `parallel_eval_batch_size=512`\n  (`rl_finetune_best_of_n.py:49-52`).\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:39`.\n- **Source**: official-solution (`notes.md` line 1).", "warn": "", "refs": [{"raw": "rl_finetune_best_of_n.py:49-52", "kind": "source", "target": null}, {"raw": "src/kernel/rl_finetune_best_of_n.py:39", "kind": "source", "target": null}]}, {"sec_id": "H05", "heading": "H05: Hard-code generation hyperparameters inside the model class", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The scorer (`score.py`) and the trainer both go through\n\n  `GPT.generate_strings_autobatch`. Hard-coding `temperature=0.7`, `top_k=8`,\n  `max_new_tokens=20` inside the method body\n  (`model.py:391-393`) ensures train- and test-time distributions are identical\n  even if a caller passes different defaults (the trainer in fact passes\n  `top_k=10` at the call site, which is overridden to `8` by the method body).\n  This is the structural mechanism that realises `notes.md` line 4."}, {"label": "Sensitivity", "value": "high — distribution mismatch between train and test would\n\n  invalidate the entire supervised target."}, {"label": "Bounds", "value": "applies as long as both code paths route through this method."}, {"label": "Code ref", "value": "`src/kernel/model.py:391-393`,\n\n  `src/kernel/rl_finetune_best_of_n.py:91-99`."}, {"label": "Source", "value": "official-solution (`notes.md` line 4 + the implementation\n\n  realising it)."}], "code": "", "text": "- **Rationale**: The scorer (`score.py`) and the trainer both go through\n  `GPT.generate_strings_autobatch`. Hard-coding `temperature=0.7`, `top_k=8`,\n  `max_new_tokens=20` inside the method body\n  (`model.py:391-393`) ensures train- and test-time distributions are identical\n  even if a caller passes different defaults (the trainer in fact passes\n  `top_k=10` at the call site, which is overridden to `8` by the method body).\n  This is the structural mechanism that realises `notes.md` line 4.\n- **Sensitivity**: high — distribution mismatch between train and test would\n  invalidate the entire supervised target.\n- **Bounds**: applies as long as both code paths route through this method.\n- **Code ref**: `src/kernel/model.py:391-393`,\n  `src/kernel/rl_finetune_best_of_n.py:91-99`.\n- **Source**: official-solution (`notes.md` line 4 + the implementation\n  realising it).", "warn": "", "refs": [{"raw": "model.py:391-393", "kind": "source", "target": null}, {"raw": "src/kernel/model.py:391-393", "kind": "source", "target": null}, {"raw": "src/kernel/rl_finetune_best_of_n.py:91-99", "kind": "source", "target": null}]}, {"sec_id": "H06", "heading": "H06: Cap response length at 20 tokens", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Short responses (a) reduce per-step generation latency, (b)\n\n  reduce judge-call latency (Llama processes shorter sequences faster), (c)\n  match the typical Alpaca answer length, and (d) give the judge a tighter\n  decision surface (it is easier to rank short answers reliably than long ones)."}, {"label": "Sensitivity", "value": "high — increasing past 50-100 tokens disproportionately\n\n  inflates wall time without improving win-rate, since the held-out scorer\n  applies the same cap."}, {"label": "Bounds", "value": "`10 — 30` plausible; chosen value 20."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:42`,\n\n  `src/kernel/model.py:393`."}, {"label": "Source", "value": "official-solution (`notes.md` line 4)."}], "code": "", "text": "- **Rationale**: Short responses (a) reduce per-step generation latency, (b)\n  reduce judge-call latency (Llama processes shorter sequences faster), (c)\n  match the typical Alpaca answer length, and (d) give the judge a tighter\n  decision surface (it is easier to rank short answers reliably than long ones).\n- **Sensitivity**: high — increasing past 50-100 tokens disproportionately\n  inflates wall time without improving win-rate, since the held-out scorer\n  applies the same cap.\n- **Bounds**: `10 — 30` plausible; chosen value 20.\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:42`,\n  `src/kernel/model.py:393`.\n- **Source**: official-solution (`notes.md` line 4).", "warn": "", "refs": [{"raw": "src/kernel/rl_finetune_best_of_n.py:42", "kind": "source", "target": null}, {"raw": "src/kernel/model.py:393", "kind": "source", "target": null}]}, {"sec_id": "H07", "heading": "H07: Train only on response tokens, not prompt tokens", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "With `train_only_response=True` the cross-entropy loss is\n\n  masked to positions strictly past the prompt's last token\n  (`rl_finetune_best_of_n.py:231-237`). Prevents the prompt distribution\n  from drifting and avoids a doubly-counted prompt loss when the same prompt\n  appears across steps."}, {"label": "Sensitivity", "value": "medium."}, {"label": "Bounds", "value": "requires consistent prompt formatting so the mask boundary is\n\n  recoverable from token counts."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:53, 247-248`."}, {"label": "Source", "value": "official-solution."}], "code": "", "text": "- **Rationale**: With `train_only_response=True` the cross-entropy loss is\n  masked to positions strictly past the prompt's last token\n  (`rl_finetune_best_of_n.py:231-237`). Prevents the prompt distribution\n  from drifting and avoids a doubly-counted prompt loss when the same prompt\n  appears across steps.\n- **Sensitivity**: medium.\n- **Bounds**: requires consistent prompt formatting so the mask boundary is\n  recoverable from token counts.\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:53, 247-248`.\n- **Source**: official-solution.", "warn": "", "refs": [{"raw": "rl_finetune_best_of_n.py:231-237", "kind": "source", "target": null}, {"raw": "src/kernel/rl_finetune_best_of_n.py:53", "kind": "source", "target": null}]}, {"sec_id": "H08", "heading": "H08: Filter out winners with fewer than 3 alphabetic characters before training", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Empty or punctuation-only \"winners\" (which the noisy judge\n\n  occasionally selects) would teach the model to emit degenerate outputs.\n  Filter pre-batch via `sum(c.isalpha() for c in r) > 2`\n  (`rl_finetune_best_of_n.py:221-223`)."}, {"label": "Sensitivity", "value": "medium — a few percent of winners are filtered per step;\n\n  removing the filter risks mode collapse to short outputs after a few steps."}, {"label": "Bounds", "value": "threshold `> 2` is the chosen value; `> 0` is too weak,\n\n  `> 10` discards too many valid short answers."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:221-223`."}, {"label": "Source", "value": "official-solution."}], "code": "", "text": "- **Rationale**: Empty or punctuation-only \"winners\" (which the noisy judge\n  occasionally selects) would teach the model to emit degenerate outputs.\n  Filter pre-batch via `sum(c.isalpha() for c in r) > 2`\n  (`rl_finetune_best_of_n.py:221-223`).\n- **Sensitivity**: medium — a few percent of winners are filtered per step;\n  removing the filter risks mode collapse to short outputs after a few steps.\n- **Bounds**: threshold `> 2` is the chosen value; `> 0` is too weak,\n  `> 10` discards too many valid short answers.\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:221-223`.\n- **Source**: official-solution.", "warn": "", "refs": [{"raw": "rl_finetune_best_of_n.py:221-223", "kind": "source", "target": null}, {"raw": "src/kernel/rl_finetune_best_of_n.py:221-223", "kind": "source", "target": null}]}, {"sec_id": "H09", "heading": "H09: Overlap evaluation of the previous batch with generation of the next", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Judge calls have ~250 ms latency per pairwise call; generation\n\n  of 8 × 512 short responses is GPU-bound. The official solution\n  (`generate_evaluate_prev`, `rl_finetune_best_of_n.py:142-148`) runs the\n  previous batch's tournament reduction concurrently with the next batch's\n  generation so neither resource sits idle."}, {"label": "Sensitivity", "value": "medium — saves ~30 % wall-clock per step in practice."}, {"label": "Bounds", "value": "only applies when `parallel_eval_batch_size < n_prompts_to_sample`\n\n  so there is more than one batch."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:142-148, 192-200`."}, {"label": "Source", "value": "official-solution."}], "code": "", "text": "- **Rationale**: Judge calls have ~250 ms latency per pairwise call; generation\n  of 8 × 512 short responses is GPU-bound. The official solution\n  (`generate_evaluate_prev`, `rl_finetune_best_of_n.py:142-148`) runs the\n  previous batch's tournament reduction concurrently with the next batch's\n  generation so neither resource sits idle.\n- **Sensitivity**: medium — saves ~30 % wall-clock per step in practice.\n- **Bounds**: only applies when `parallel_eval_batch_size < n_prompts_to_sample`\n  so there is more than one batch.\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:142-148, 192-200`.\n- **Source**: official-solution.", "warn": "", "refs": [{"raw": "rl_finetune_best_of_n.py:142-148", "kind": "source", "target": null}, {"raw": "src/kernel/rl_finetune_best_of_n.py:142-148", "kind": "source", "target": null}]}, {"sec_id": "H10", "heading": "H10: Use Adam + GradScaler with grad_clip=1.0", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Adam handles the loose statistics of short, noisy supervised\n\n  targets better than SGD; `torch.amp.GradScaler` enables fp16/bf16 autocast\n  without underflow; `clip_grad_norm_(model.parameters(), 1.0)` limits the\n  damage of any one outlier batch on a 1.5 B model that started from a strong\n  prior."}, {"label": "Sensitivity", "value": "medium — clipping at `> 5` allows occasional spikes,\n\n  `< 0.5` over-attenuates valid updates."}, {"label": "Bounds", "value": "`0.5 — 5.0` plausible; chosen value 1.0."}, {"label": "Code ref", "value": "`src/kernel/rl_finetune_best_of_n.py:62, 161-162, 253-260`."}, {"label": "Source", "value": "official-solution."}], "code": "", "text": "- **Rationale**: Adam handles the loose statistics of short, noisy supervised\n  targets better than SGD; `torch.amp.GradScaler` enables fp16/bf16 autocast\n  without underflow; `clip_grad_norm_(model.parameters(), 1.0)` limits the\n  damage of any one outlier batch on a 1.5 B model that started from a strong\n  prior.\n- **Sensitivity**: medium — clipping at `> 5` allows occasional spikes,\n  `< 0.5` over-attenuates valid updates.\n- **Bounds**: `0.5 — 5.0` plausible; chosen value 1.0.\n- **Code ref**: `src/kernel/rl_finetune_best_of_n.py:62, 161-162, 253-260`.\n- **Source**: official-solution.", "warn": "", "refs": [{"raw": "src/kernel/rl_finetune_best_of_n.py:62", "kind": "source", "target": null}]}, {"sec_id": "H11", "heading": "H11: Budget judge throughput before scaling prompts per step", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The Replicate Llama-3-8b judge enforces a per-minute rate limit.\n\n  Steps with >= 192 prompts × 3 responses (~576 pairwise comparisons) or >= 20\n  parallel workers consistently triggered sustained 429 storms. Successful runs\n  used <= 64 prompts/step, 2 responses, <= 5 parallel workers, plus inter-batch\n  delays of 20-30 s."}, {"label": "Evidence", "value": "Runs 0 (N50, N53), 2 (N151), 5 (N302), 10 (N552), 13 (N701)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: The Replicate Llama-3-8b judge enforces a per-minute rate limit.\n  Steps with >= 192 prompts × 3 responses (~576 pairwise comparisons) or >= 20\n  parallel workers consistently triggered sustained 429 storms. Successful runs\n  used <= 64 prompts/step, 2 responses, <= 5 parallel workers, plus inter-batch\n  delays of 20-30 s.\n- **Evidence**: Runs 0 (N50, N53), 2 (N151), 5 (N302), 10 (N552), 13 (N701).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}, {"sec_id": "H12", "heading": "H12: Pass targets to GPT.forward for full-sequence logits", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The model.py GPT.forward short-circuits to last-position-only\n\n  logits when `targets=None` (inference optimization). Any training loop that\n  needs per-token logprobs must either pass dummy targets or edit the forward\n  path. 8+ MALT runs wasted significant token budget rediscovering this."}, {"label": "Evidence", "value": "Runs 0 (N50), 1 (N101), 3 (N200), 4 (N251), 9 (N500)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: The model.py GPT.forward short-circuits to last-position-only\n  logits when `targets=None` (inference optimization). Any training loop that\n  needs per-token logprobs must either pass dummy targets or edit the forward\n  path. 8+ MALT runs wasted significant token budget rediscovering this.\n- **Evidence**: Runs 0 (N50), 1 (N101), 3 (N200), 4 (N251), 9 (N500).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}, {"sec_id": "H13", "heading": "H13: Keep named backups of scored checkpoints", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "`/home/agent/finetuned_model` is a shared mutable path; both\n\n  the trainer and scorer write to it. Overwriting without a named copy of\n  a good checkpoint is an irreversible loss: 7+ runs destroyed their peak\n  this way (e.g. run 0: 0.44 -> 0.07 after overwrite)."}, {"label": "Evidence", "value": "Runs 0 (N56), 2 (N154), 3 (N206), 6 (N353), 9 (N504), 12 (N656), 17 (N905)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: `/home/agent/finetuned_model` is a shared mutable path; both\n  the trainer and scorer write to it. Overwriting without a named copy of\n  a good checkpoint is an irreversible loss: 7+ runs destroyed their peak\n  this way (e.g. run 0: 0.44 -> 0.07 after overwrite).\n- **Evidence**: Runs 0 (N56), 2 (N154), 3 (N206), 6 (N353), 9 (N504), 12 (N656), 17 (N905).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}, {"sec_id": "H14", "heading": "H14: Score multiple intermediate checkpoints, not just the final one", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Fine-tuning loss is not monotonically correlated with\n\n  win-rate; earlier checkpoints frequently score better. In run 0,\n  step-15 scored 0.569 vs step-20 at 0.070. Saving checkpoints every\n  5 steps and scoring the best is a low-cost hedge."}, {"label": "Evidence", "value": "Runs 0 (N57), 7 (N404), 11 (N603), 12 (N653/N654), 17 (N903)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: Fine-tuning loss is not monotonically correlated with\n  win-rate; earlier checkpoints frequently score better. In run 0,\n  step-15 scored 0.569 vs step-20 at 0.070. Saving checkpoints every\n  5 steps and scoring the best is a low-cost hedge.\n- **Evidence**: Runs 0 (N57), 7 (N404), 11 (N603), 12 (N653/N654), 17 (N903).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}, {"sec_id": "H15", "heading": "H15: Use lr <= 5e-6 for preference RL on gpt2-xl", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "lr >= 1e-5 works for short supervised phases (< 10 steps)\n\n  but causes collapse in RL loops where preference noise compounds across\n  steps. The official solution uses 4e-6. MALT runs that used 5e-6 or lower\n  avoided catastrophic regression; those at 3e-5 collapsed within 1-2 steps."}, {"label": "Evidence", "value": "Runs 3 (N202, 0.766 at cosine ~5e-6), 7 (N401, 0.798 at 5e-6),\n\n  vs runs 7 (N400, collapse at 3e-5), 8 (N452, collapse at 3e-5)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: lr >= 1e-5 works for short supervised phases (< 10 steps)\n  but causes collapse in RL loops where preference noise compounds across\n  steps. The official solution uses 4e-6. MALT runs that used 5e-6 or lower\n  avoided catastrophic regression; those at 3e-5 collapsed within 1-2 steps.\n- **Evidence**: Runs 3 (N202, 0.766 at cosine ~5e-6), 7 (N401, 0.798 at 5e-6),\n  vs runs 7 (N400, collapse at 3e-5), 8 (N452, collapse at 3e-5).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}, {"sec_id": "H16", "heading": "H16: Kill GPU processes before scoring", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The scorer loads gpt2-xl weights (~6 GB) in its own process\n\n  but shares the GPU. Zombie Python processes from interactive testing or\n  killed trainers hold tens of GiB, causing the scorer to OOM. Before\n  calling `score`, explicitly kill all other Python processes on GPU."}, {"label": "Evidence", "value": "Runs 0 (N58), 3 (N204, N208), 10 (N553), 14 (N753)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: The scorer loads gpt2-xl weights (~6 GB) in its own process\n  but shares the GPU. Zombie Python processes from interactive testing or\n  killed trainers hold tens of GiB, causing the scorer to OOM. Before\n  calling `score`, explicitly kill all other Python processes on GPU.\n- **Evidence**: Runs 0 (N58), 3 (N204, N208), 10 (N553), 14 (N753).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}, {"sec_id": "H17", "heading": "H17: model.py generate_strings_autobatch does not support top_p", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The function signature is `(self, prompts, max_new_tokens,\n\n  temperature=1.0, top_k=None, batch_size=128, use_old=False)`. Passing\n  `top_p` raises TypeError. Diversity must be controlled via temperature\n  and top_k only."}, {"label": "Evidence", "value": "Runs 0 (N52), 1 (N101), 12 (N652)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: The function signature is `(self, prompts, max_new_tokens,\n  temperature=1.0, top_k=None, batch_size=128, use_old=False)`. Passing\n  `top_p` raises TypeError. Diversity must be controlled via temperature\n  and top_k only.\n- **Evidence**: Runs 0 (N52), 1 (N101), 12 (N652).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}, {"sec_id": "H18", "heading": "H18: Staged training (SFT then RL) outperforms RL-only on gpt2-xl", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Base gpt2-xl has no instruction-following ability. Applying\n\n  preference RL directly yields little gain because the model cannot even\n  generate coherent responses to compare. A supervised warm-up phase (on\n  manual examples or judge-preferred outputs) gives the RL loop a\n  meaningful starting distribution. Runs 4 (N253, +0.525 in one attempt\n  via 20 SFT + 50 RL), 6 (N357, 0.816 via SFT + refinement), and 16\n  (N856, 0.807 via iterative SFT) all used this pattern."}, {"label": "Evidence", "value": "Runs 4 (N253), 6 (N356-N358), 16 (N853-N856)."}, {"label": "Source", "value": "MALT (cross-run)."}], "code": "", "text": "- **Rationale**: Base gpt2-xl has no instruction-following ability. Applying\n  preference RL directly yields little gain because the model cannot even\n  generate coherent responses to compare. A supervised warm-up phase (on\n  manual examples or judge-preferred outputs) gives the RL loop a\n  meaningful starting distribution. Runs 4 (N253, +0.525 in one attempt\n  via 20 SFT + 50 RL), 6 (N357, 0.816 via SFT + refinement), and 16\n  (N856, 0.807 via iterative SFT) all used this pattern.\n- **Evidence**: Runs 4 (N253), 6 (N356-N358), 16 (N853-N856).\n- **Source**: MALT (cross-run).", "warn": "", "refs": []}]}]}}

<script>
"use strict";
(function () {
  const GLYPH = { question:"Q", experiment:"✦", decision:"→", dead_end:"✗", pivot:"↻", insight:"!", default:"•" };
  const TYPES = ["question","experiment","decision","dead_end","pivot","insight"];

  let DATA;
  try {
    // The payload sits between the BEGIN/END marker comments (kept in-file so the
    // skill can re-inject). Strip ONLY those two named markers before parsing; the
    // rest of textContent is pure JSON. (Marker text is not written literally here,
    // so it stays a single injection site.)
    var raw = document.getElementById("ara-data").textContent
                .replace(/\/\*\s*__ARA_DATA_(?:BEGIN|END)__\s*\*\//g, "");
    DATA = JSON.parse(raw);
  } catch (e) {
    document.getElementById("detail").innerHTML =
      '<div class="none">Could not parse embedded ARA data: ' + String(e) + '</div>';
    return;
  }

  const nodes = DATA.nodes || [];
  const byId = new Map(nodes.map(n => [n.id, n]));
  const kids = new Map();
  nodes.forEach(n => kids.set(n.id, []));
  let roots = [];
  nodes.forEach(n => {
    if (n.parent && byId.has(n.parent)) kids.get(n.parent).push(n.id);
    else roots.push(n.id);
  });
  // Traversal order: explicit DATA.order if given, else DFS from roots.
  let order = Array.isArray(DATA.order) && DATA.order.length ? DATA.order.filter(id => byId.has(id)) : [];
  if (!order.length) { const seen=new Set(); const dfs=id=>{if(seen.has(id))return;seen.add(id);order.push(id);(kids.get(id)||[]).forEach(dfs)}; roots.forEach(dfs); }

  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const glyph = t => GLYPH[t] || GLYPH.default;
  const cls = t => TYPES.includes(t) ? t : "default";

  // ---- header ----
  const m = DATA.meta || {};
  document.getElementById("h-title").textContent = m.title || "ARA Trajectory";
  document.getElementById("h-sub").textContent =
    [ (m.authors||[]).join(", "), m.venue, m.year ].filter(Boolean).join(" · ");
  if (m.abstract) document.getElementById("h-abstract").textContent = m.abstract;
  else document.getElementById("h-abstract-wrap").style.display = "none";

  const ftype = document.getElementById("ftype");
  const present = [...new Set(nodes.map(n => n.type))];
  TYPES.concat(present.filter(t=>!TYPES.includes(t))).filter(t=>present.includes(t))
    .forEach(t => { const o=document.createElement("option"); o.value=t; o.textContent=t; ftype.appendChild(o); });

  // ---- minimal markdown-table renderer ----
  function renderMd(md){
    if(!md) return "";
    const lines = String(md).split("\n");
    let out=[], i=0;
    while(i<lines.length){
      if(/^\s*\|/.test(lines[i]) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        const row = l => l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
        const head = row(lines[i]); i+=2; const body=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){ body.push(row(lines[i])); i++; }
        out.push('<table class="md"><thead><tr>'+head.map(h=>"<th>"+esc(h)+"</th>").join("")+
          '</tr></thead><tbody>'+body.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      } else { if(lines[i].trim()) out.push("<div>"+esc(lines[i])+"</div>"); i++; }
    }
    return out.join("");
  }

  // ---- detail pane ----
  function block(title, tag, inner, open, cls){
    return '<details class="block'+(cls?" "+cls:"")+'"'+(open?" open":"")+'><summary>'+esc(title)+
      (tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</summary><div class="body">'+inner+'</div></details>';
  }
  function chips(arr, klass){ return arr&&arr.length ? '<div class="chips">'+arr.map(x=>'<span class="chip '+(klass||"")+'">'+esc(x)+'</span>').join("")+'</div>' : ""; }

  function renderDetail(n){
    const d = document.getElementById("detail");
    let h = '<div class="dhead"><span class="badge '+cls(n.type)+'">'+esc(n.type)+'</span>'+
      '<span class="did">'+esc(n.id)+'</span>'+
      (n.support_level?'<span class="pill '+esc(n.support_level)+'">'+esc(n.support_level)+'</span>':'')+
      (n.isolated?'<span class="pill iso">isolated</span>':'')+'</div>';
    h += '<div class="dtitle">'+esc(n.title||"(untitled)")+'</div>';

    // reasoning (primary, always open) — the agent's thinking IS the content of a step
    let reason="";
    if(n.thinking){
      reason += '<div class="lead">'+esc(n.thinking)+'</div>';
      if(n.body) reason += '<div class="didwhat">what it did</div><div>'+esc(n.body)+'</div>';
    } else {
      reason += n.body ? '<div class="lead">'+esc(n.body)+'</div>' : '<div class="empty">No description.</div>';
    }
    if(n.depends_on&&n.depends_on.length) reason += chips(n.depends_on.map(x=>"⇠ depends on "+x));
    if(n.source_refs&&n.source_refs.length) reason += chips(n.source_refs, "ext");
    if(n.built_on&&n.built_on.length) reason += chipRow("built on", n.built_on, "chip-built");
    if(n.rejected_here&&n.rejected_here.length) reason += chipRow("rejected here", n.rejected_here, "chip-rej");
    if(n.recipe_refs&&n.recipe_refs.length) reason += recipeChips(n.recipe_refs);
    h += block(n.thinking?"reasoning":"what", n.type, reason, true, "reason");

    // result (the grounded payload) — open
    const r = n.result||{};
    if((r.sources&&r.sources.length)||(r.figures&&r.figures.length)||(r.tables&&r.tables.length)||(r.data&&r.data.length)){
      let s="";
      (r.figures||[]).forEach(f=>{ s+='<figure><img src="'+esc(f.img)+'" alt="'+esc(f.caption||f.id)+'"/>'+
        (f.caption?'<figcaption>'+esc(f.caption)+'</figcaption>':'')+'</figure>'; });
      (r.tables||[]).forEach(t=>{ s+=(t.caption?'<div class="empty">'+esc(t.caption)+'</div>':'')+renderMd(t.markdown); });
      (r.sources||[]).forEach(q=>{ s+='<div class="quote">'+esc(q.quote)+(q.ref?'<div class="ref">← '+esc(q.ref)+'</div>':'')+'</div>'; });
      (r.data||[]).forEach(x=>{ s+='<div class="ptr">⛁ <span class="path">'+esc(x.path)+'</span>'+(x.note?' — '+esc(x.note):'')+'</div>'; });
      h += block("result", "", s, true);
    }

    // why (claims) — supporting detail, collapsed
    if(n.why&&n.why.length){
      const w = n.why.map(c=>{
        let s='<div class="claim"><h4>'+esc(c.id)+(c.title?' — '+esc(c.title):'')+'</h4>';
        if(c.statement) s+='<div class="kv">'+esc(c.statement)+'</div>';
        if(c.status) s+='<div class="kv"><b>status</b> <span class="status '+esc(String(c.status).toLowerCase())+'">'+esc(c.status)+'</span></div>';
        if(c.conditions) s+='<div class="kv"><b>conditions</b> '+esc(c.conditions)+'</div>';
        if(c.falsification) s+='<div class="kv"><b>falsified if</b> '+esc(c.falsification)+'</div>';
        if(c.dependencies&&c.dependencies.length) s+='<div class="kv"><b>depends on</b> '+esc(c.dependencies.join(", "))+'</div>';
        if(c.provenance) s+='<div class="kv"><span class="prov">provenance: '+esc(c.provenance)+'</span></div>';
        return s+'</div>';
      }).join("");
      h += block("why", n.why.map(c=>c.id).join(" · "), w);
    }

    // how verified (experiments) — supporting detail, collapsed
    if(n.verified_by&&n.verified_by.length){
      const v = n.verified_by.map(e=>'<div class="claim"><h4>'+esc(e.id)+(e.title?' — '+esc(e.title):'')+'</h4>'+
        (e.run?'<div class="kv"><b>run</b> <span class="path mono">'+esc(e.run)+'</span></div>':'')+
        (e.setup?'<div class="kv"><b>setup</b> '+esc(e.setup)+'</div>':'')+
        (e.metrics?'<div class="kv"><b>metrics</b> '+esc(e.metrics)+'</div>':'')+'</div>').join("");
      h += block("how verified", n.verified_by.map(e=>e.id).join(" · "), v);
    }

    // artifact pointers (src/artifacts.md) — collapsed
    if(n.artifact&&n.artifact.length){
      const a = n.artifact.map(x=>'<div class="ptr">▸ <b>'+esc(x.name)+'</b> — <span class="path">'+esc(x.pointer)+'</span>'+
        (x.what?'<div class="empty">'+esc(x.what)+'</div>':'')+'</div>').join("");
      h += block("artifact", "pointer", a);
    }

    d.innerHTML = h;
    if(typeof LEX!=="undefined" && LEX) linkifyConcepts(d);
    d.scrollTop = 0;
  }

  // ---- map ----
  let selected = null;
  function selectNode(id){
    if(!byId.has(id)) return;
    selected = id;
    document.querySelectorAll(".node").forEach(el=>el.classList.toggle("sel", el.dataset.id===id));
    const el = document.querySelector('.node[data-id="'+CSS.escape(id)+'"]');
    if(el) el.scrollIntoView({block:"nearest"});
    renderDetail(byId.get(id));
    rstat();
  }

  function nodeRow(n){
    const row = document.createElement("div");
    row.className = "node "+(n.type==="dead_end"?"dead":"");
    row.dataset.id = n.id; row.dataset.type = n.type;
    // calmer than before: one glyph + id + (quiet) cross-edge marker; the ⊕/⊘ count soup is gone.
    row.innerHTML = '<span class="glyph '+cls(n.type)+'">'+glyph(n.type)+'</span>'+
      '<span><span class="meta"><span class="nid">'+esc(n.id)+'</span>'+
      (n.depends_on&&n.depends_on.length?'<span class="dep" title="depends on '+esc(n.depends_on.join(", "))+'">⇠ '+esc(n.depends_on.join(","))+'</span>':'')+
      '</span><div class="ntitle">'+esc(n.title||n.body||"(untitled)")+'</div></span>';
    row.addEventListener("click", ()=>selectNode(n.id));
    // hover a node to highlight its cross-edge targets (gentler than always-on connectors)
    if(n.depends_on&&n.depends_on.length){
      row.addEventListener("mouseenter", ()=>n.depends_on.forEach(t=>{ const el=document.querySelector('.node[data-id="'+CSS.escape(t)+'"]'); if(el) el.classList.add("deptarget"); }));
      row.addEventListener("mouseleave", ()=>document.querySelectorAll(".node.deptarget").forEach(el=>el.classList.remove("deptarget")));
    }
    return row;
  }
  function renderSubtree(id, container){
    const n = byId.get(id); if(!n) return;
    container.appendChild(nodeRow(n));
    const cs = kids.get(id)||[];
    if(cs.length){ const wrap=document.createElement("div"); wrap.className="kid"; cs.forEach(c=>renderSubtree(c,wrap)); container.appendChild(wrap); }
  }
  function renderMap(){
    const map = document.getElementById("map"); map.innerHTML="";
    const normalRoots = roots.filter(id=>!byId.get(id).isolated);
    const isoRoots = roots.filter(id=>byId.get(id).isolated);
    normalRoots.forEach(id=>renderSubtree(id, map));
    if(isoRoots.length){
      const box=document.createElement("div"); box.className="isobox";
      const hdr=document.createElement("div"); hdr.className="isohdr"; hdr.textContent="isolated subtree"; box.appendChild(hdr);
      isoRoots.forEach(id=>renderSubtree(id, box)); map.appendChild(box);
    }
  }

  // ---- filter / search ----
  function applyFilters(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ty = document.getElementById("ftype").value;
    const deadOnly = document.getElementById("fdead").checked;
    let shown=0;
    document.querySelectorAll(".node").forEach(el=>{
      const n = byId.get(el.dataset.id);
      const text = (n.id+" "+(n.title||"")+" "+(n.body||"")).toLowerCase();
      const ok = (!q||text.includes(q)) && (!ty||n.type===ty) && (!deadOnly||n.type==="dead_end");
      el.classList.toggle("dim", !ok);
      if(ok) shown++;
    });
    document.getElementById("rstat").textContent = shown+" / "+nodes.length+" steps";
  }
  function rstat(){
    const i = selected?order.indexOf(selected):-1;
    document.getElementById("rstat").textContent = (i>=0?("step "+(i+1)+" / "+order.length):(nodes.length+" steps"));
  }

  // ---- replay ----
  let timer=null;
  function step(delta){
    let i = selected?order.indexOf(selected):-1;
    i = Math.max(0, Math.min(order.length-1, i+delta));
    selectNode(order[i]);
  }
  function play(){
    if(timer){ stop(); return; }
    if(!selected) selectNode(order[0]);
    document.getElementById("rplay").textContent="⏸ Pause";
    timer = setInterval(()=>{
      const i = selected?order.indexOf(selected):-1;
      if(i>=order.length-1){ stop(); return; }
      step(1);
    }, 1300);
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById("rplay").textContent="▶ Replay"; }

  // ======================= v1.1 enrichment layers (all inert unless present) =======================
  const CTX = DATA.context, GLO = DATA.glossary, DEP = DATA.dependencies, REC = DATA.recipes;
  const LAYERS = { context:CTX, glossary:GLO, dependencies:DEP, recipes:REC };

  // ---- indexes (built once) ----
  const claimToNodes = new Map();
  nodes.forEach(n => (n.why||[]).forEach(c => { if(c&&c.id){ if(!claimToNodes.has(c.id)) claimToNodes.set(c.id,[]); claimToNodes.get(c.id).push(n.id); } }));
  const firstNodeForClaim = id => (claimToNodes.get(id)||[])[0] || null;
  const rwById   = new Map(((DEP&&DEP.entries)||[]).map(e => [e.rw_id, e]));
  const termById = new Map(((GLO&&GLO.terms)||[]).map(t => [t.term_id, t]));
  // concept "used by" (inferred) from each node's name-matched concepts[]
  if(GLO){
    const nameToTerm = new Map();
    (GLO.terms||[]).forEach(t => { if(t.name) nameToTerm.set(String(t.name).toLowerCase(), t); (t.aliases||[]).forEach(a=>nameToTerm.set(String(a).toLowerCase(), t)); });
    nodes.forEach(n => (n.concepts||[]).forEach(cn => { const t=nameToTerm.get(String(cn).toLowerCase()); if(t){ (t._used=t._used||[]).push(n.id); } }));
  }

  // ---- tiny inline-math fallback (no CDN; operates on already-escaped text, adds only safe tags) ----
  const GK={alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",eta:"η",theta:"θ",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",phi:"φ",chi:"χ",psi:"ψ",omega:"ω",Delta:"Δ",Sigma:"Σ",Omega:"Ω",Phi:"Φ",Theta:"Θ",Lambda:"Λ",Gamma:"Γ",nabla:"∇",partial:"∂",times:"×",cdot:"·",infty:"∞",approx:"≈",leq:"≤",geq:"≥",neq:"≠",to:"→",in:"∈",sum:"Σ",prod:"Π",sqrt:"√",mathbb:"",mathcal:"",mathbf:"",mathrm:"",left:"",right:""};
  function texInner(s){
    s=s.replace(/\\(?:mathbb|mathcal|mathbf|mathrm)\{([^{}]*)\}/g,"$1");
    s=s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)");
    s=s.replace(/\\([A-Za-z]+)/g,(m,w)=>GK[w]!==undefined?GK[w]:m);
    s=s.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^([\w()+\-])/g,"<sup>$1</sup>");
    s=s.replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>").replace(/_([\w()+\-])/g,"<sub>$1</sub>");
    return s;
  }
  function mathPass(escaped){
    if(escaped.indexOf("$")<0) return escaped;
    return escaped.replace(/\$\$([^$]+)\$\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>')
                  .replace(/\$([^$]+)\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>');
  }
  function mtext(v){ const e=esc(v); try{ return mathPass(e); }catch(_){ return e; } }

  // ---- typed-ref rendering (off-ARA pointers stay inert; in-ARA targets become jump chips) ----
  function refUrl(rf){
    const raw=rf.raw||"";
    if(rf.kind==="url"){ const m=raw.match(/https?:\/\/\S+/); return m?m[0]:""; }
    if(rf.kind==="arxiv"){ const m=raw.match(/(\d{4}\.\d{4,5})/); return m?("https://arxiv.org/abs/"+m[1]):""; }
    if(rf.kind==="doi"){ const m=raw.match(/(10\.\d{4,}\/\S+)/); return m?("https://doi.org/"+m[1]):""; }
    return "";
  }
  function refChip(rf){
    const raw=esc(rf.raw||""), url=refUrl(rf);
    if(url) return '<a class="chip ext" href="'+esc(url)+'" target="_blank" rel="noopener">'+raw+'</a>';
    if(rf.target){
      if(rf.kind==="claim")        return '<span class="chip jump" data-jump-claim="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="node")         return '<span class="chip jump" data-jump-node="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="concept")      return '<span class="chip jump" data-open-term="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="related_work") return '<span class="chip jump" data-open-panel="dependencies" data-anchor="ov-'+esc(rf.target)+'">'+raw+'</span>';
      return '<span class="chip jump" data-scroll="ov-'+esc(rf.target)+'">'+raw+'</span>';
    }
    const dangle=(rf.kind==="claim"||rf.kind==="related_work"||rf.kind==="concept");
    return '<span class="chip '+(dangle?'dangle" title="referenced but not found in this ARA':'ext')+'">'+raw+'</span>';
  }
  function refRow(refs){ return refs&&refs.length ? '<div class="chips">'+refs.map(refChip).join("")+'</div>' : ""; }

  // ---- per-node provenance chips (consumed by renderDetail) ----
  function chipRow(label, arr, klass){
    const cs=arr.map(x=>{
      const txt=[x.rw_id,x.name].filter(Boolean).join(" · ")||"?";
      const tip=x.relation_raw?(' title="'+esc(x.relation_raw)+'"'):'';
      const op =x.rw_id?(' data-open-panel="dependencies" data-anchor="ov-'+esc(x.rw_id)+'"'):'';
      return '<span class="chip '+klass+(x.rw_id?' jump':'')+'"'+tip+op+'>'+esc(txt)+'</span>';
    }).join("");
    return '<div class="chiplabel">'+esc(label)+'</div><div class="chips">'+cs+'</div>';
  }
  function recipeChips(arr){
    const cs=arr.map(x=>{
      const anchor="ov-sec-"+(x.file||"")+"-"+(x.sec_id||"");
      return '<span class="chip chip-recipe jump" data-open-panel="recipes" data-anchor="'+esc(anchor)+'" title="'+esc((x.file||"")+(x.role?(" · "+x.role):""))+'">▦ '+esc(x.heading||x.file||"recipe")+'</span>';
    }).join("");
    return '<div class="chiplabel">recipe</div><div class="chips">'+cs+'</div>';
  }

  // ---- the four overlay renderers (reuse block/chips/renderMd) ----
  function renderContext(){
    let h=""; if(CTX.summary) h+='<div class="ribbon">'+esc(CTX.summary)+'</div>';
    (CTX.sections||[]).forEach(sec=>{
      let inner="";
      if(sec.present===false){ inner='<div class="muted grey">(not specified in this ARA)</div>'; }
      else (sec.entries||[]).forEach(en=>{
        let c='<div class="card" id="ov-'+esc(en.ent_id||"")+'"><h4>'+(en.ent_id?'<span class="did">'+esc(en.ent_id)+'</span> ':'')+esc(en.ent_title||"")+(en.inferred_id?' <span class="sub">(pos.)</span>':'')+'</h4>';
        if(!en.unstructured && en.fields && en.fields.length) en.fields.forEach(f=>c+='<div class="kv"><b>'+esc(f.label)+'</b> '+mtext(f.value)+'</div>');
        else if(en.text) c+='<div class="kv">'+mtext(en.text)+'</div>';
        if(en.unstructured) c+='<div class="sub">unstructured</div>';
        c+=refRow(en.refs)+'</div>'; inner+=c;
      });
      h+=block(sec.heading||sec.role||"section", sec.role||"", inner, sec.role==="insight");
    });
    return h || '<div class="muted">No problem context.</div>';
  }
  function renderGlossary(filter){
    const f=(filter||"").trim().toLowerCase();
    const match=t=>!f||((t.name||"")+" "+(t.aliases||[]).join(" ")+" "+(t.definition||"")).toLowerCase().includes(f);
    function card(t){
      let c='<div class="card" id="ov-'+esc(t.term_id)+'"><h4>'+esc(t.name)+(t.group?' <span class="sub">'+esc(t.group)+'</span>':'')+'</h4>';
      if(t.aliases&&t.aliases.length) c+='<div class="chips">'+t.aliases.map(a=>'<span class="chip">'+esc(a)+'</span>').join("")+'</div>';
      if(t.definition) c+='<div class="kv">'+mtext(t.definition)+'</div>';
      (t.fields||[]).forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
      if(t.related&&t.related.length) c+='<div class="kv"><b>related</b> '+t.related.map(r=>{const rt=termById.get(r);return '<span class="chip jump" data-open-term="'+esc(r)+'">'+esc(rt?rt.name:r)+'</span>';}).join(" ")+'</div>';
      if(t._used&&t._used.length) c+='<div class="kv"><b>mentions</b> '+[...new Set(t._used)].map(nid=>'<span class="chip jump" data-jump-node="'+esc(nid)+'">'+esc(nid)+'</span>').join(" ")+' <span class="sub">(inferred)</span></div>';
      return c+refRow(t.refs)+'</div>';
    }
    const groups=GLO.groups&&GLO.groups.length?GLO.groups:null; let h="";
    if(groups){
      const grouped=new Set();
      groups.forEach(g=>{ (g.term_ids||[]).forEach(id=>grouped.add(id)); const ts=(g.term_ids||[]).map(id=>termById.get(id)).filter(Boolean).filter(match); if(ts.length) h+=block(g.name||"group", String(ts.length), ts.map(card).join(""), true); });
      const rest=(GLO.terms||[]).filter(t=>!grouped.has(t.term_id)).filter(match);
      if(rest.length) h+=block("other", String(rest.length), rest.map(card).join(""), true);
    } else { const ts=(GLO.terms||[]).filter(match); h=ts.map(card).join(""); }
    return h || '<div class="muted">No matching terms.</div>';
  }
  function renderDeps(filter){
    const f=(filter||"").trim().toLowerCase(); let h="";
    if(DEP.preamble) h+='<div class="muted">'+esc(DEP.preamble)+'</div>';
    if(DEP.attribution) h+='<div class="ribbon">'+esc(DEP.attribution)+'</div>';
    const ents=(DEP.entries||[]).filter(e=>!e.is_footprint).filter(e=>!f||(((e.rw_id||"")+" "+(e.name||"")+" "+(e.relation_raw||"")+" "+(e.delta||"")).toLowerCase().includes(f)));
    ents.forEach(e=>{
      const rn=e.relation_norm, relc=["baseline","imports","extends","bounds","refutes"].includes(rn)?rn:"neutral";
      let c='<div class="card" id="ov-'+esc(e.rw_id||"")+'"><h4>'+(e.rw_id?'<span class="did">'+esc(e.rw_id)+'</span> ':'')+esc(e.name||"")+'</h4>';
      c+='<div class="chips"><span class="rel '+relc+'">'+esc(e.relation_raw||rn||"related")+'</span>'+(e.cross_agent?'<span class="chip" title="other-agent provenance">↔ other-agent</span>':'')+'</div>';
      if(e.delta) c+='<div class="kv">'+mtext(e.delta)+'</div>';
      if(e.adopted) c+='<div class="kv"><b>adopted</b> '+esc(e.adopted)+'</div>';
      let prov=(e.grounding||[]).map(refChip).join("");
      (e.claims||[]).filter(id=>claimToNodes.has(id)).forEach(id=>prov+='<span class="chip jump" data-jump-claim="'+esc(id)+'">'+esc(id)+'</span>');
      c+= prov?('<div class="kv"><b>grounding</b> '+prov+'</div>'):'<div class="muted">ungrounded</div>';
      h+=c+'</div>';
    });
    if(!ents.length) h+='<div class="muted">No matching dependencies.</div>';
    const fp=DEP.footprint||[];
    if(fp.length) h+=block("Citation footprint", String(fp.length), fp.map(x=>'<div class="ptr"><span class="muted">'+esc(x.ref_id||"")+'</span> '+esc(x.citation||"")+'</div>').join(""), false);
    return h;
  }
  function renderRecipes(){
    let h="";
    (REC.files||[]).forEach(file=>{
      let inner="";
      (file.sections||[]).forEach(sec=>{
        let c='<div class="card" id="ov-sec-'+esc((file.file||"")+"-"+(sec.sec_id||""))+'"><h4>'+(sec.sec_id?'<span class="did">'+esc(sec.sec_id)+'</span> ':'')+esc(sec.heading||"")+'</h4>';
        if(sec.kind==="table"&&sec.markdown) c+=renderMd(sec.markdown);
        else if(sec.kind==="steps"&&sec.steps&&sec.steps.length) c+='<ol>'+sec.steps.map(s=>'<li>'+mtext(String(s).replace(/^\s*\d+\.\s*/,""))+'</li>').join("")+'</ol>';
        else if(sec.kind==="kv"&&sec.fields&&sec.fields.length) sec.fields.forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
        else if(sec.kind==="code"&&sec.code) c+='<pre class="snip">'+esc(sec.code)+'</pre>';
        else if(sec.kind==="math"&&sec.code) c+='<div class="kv math">'+mtext(sec.code)+'</div>';
        else if(sec.text) c+='<div class="kv">'+mtext(sec.text)+'</div>';
        if(sec.warn) c+='<div class="warn">'+esc(sec.warn)+'</div>';
        inner+=c+refRow(sec.refs)+'</div>';
      });
      h+=block((file.file_title||file.file||"recipe")+(file.role?("  ·  "+file.role):""), String((file.sections||[]).length), inner, true);
    });
    return h || '<div class="muted">No recipe content.</div>';
  }

  // ---- overlay open/close + layerbar wiring ----
  const ov=document.getElementById("overlay");
  let lastTrigger=null;
  const PANEL_RENDER={ context:renderContext, glossary:()=>renderGlossary(""), dependencies:()=>renderDeps(""), recipes:renderRecipes };
  function hasContent(name){ const L=LAYERS[name]; if(!L) return false;
    if(name==="context") return (L.sections||[]).length>0;
    if(name==="glossary") return (L.terms||[]).length>0;
    if(name==="dependencies") return (L.entries||[]).length>0||(L.footprint||[]).length>0;
    if(name==="recipes") return (L.files||[]).length>0; return false; }
  function panelTitle(name){ const L=LAYERS[name]||{}; return L.title || ({context:"Context",glossary:"Concepts",dependencies:"Dependencies",recipes:"Solution"}[name]); }
  function panelCount(name){ const L=LAYERS[name]||{};
    if(name==="glossary") return (L.terms||[]).length;
    if(name==="dependencies") return (L.entries||[]).length;
    if(name==="recipes") return (L.files||[]).reduce((a,f)=>a+(f.sections||[]).length,0); return 0; }
  function openPanel(name, anchor){
    if(!hasContent(name)) return;
    stop(); lastTrigger=document.activeElement;
    document.getElementById("ov-title").textContent=panelTitle(name);
    const body=document.getElementById("ov-body"); body.innerHTML=PANEL_RENDER[name]();
    if(LEX) linkifyConcepts(body);
    const q=document.getElementById("ov-q");
    if(name==="glossary"||name==="dependencies"){ q.hidden=false; q.value=""; q.dataset.panel=name; } else { q.hidden=true; }
    ov.hidden=false;
    if(anchor){ const el=document.getElementById(anchor); if(el) el.scrollIntoView({block:"center"}); } else body.scrollTop=0;
    (q.hidden?document.getElementById("ov-close"):q).focus();
  }
  function closePanel(){ ov.hidden=true; if(lastTrigger&&lastTrigger.focus) lastTrigger.focus(); }
  document.querySelectorAll(".lbtn").forEach(b=>{ const name=b.dataset.panel;
    if(hasContent(name)){ b.hidden=false; const c=b.querySelector(".cnt"); if(c){ const n=panelCount(name); if(n) c.textContent=n; } b.addEventListener("click",()=>openPanel(name)); } });
  document.getElementById("ov-q").addEventListener("input", e=>{ const p=e.target.dataset.panel, body=document.getElementById("ov-body");
    body.innerHTML = p==="glossary"?renderGlossary(e.target.value):renderDeps(e.target.value); if(LEX) linkifyConcepts(body); });

  // ---- glossary lexicon + popover ----
  const LEX=(GLO&&GLO.lexicon&&Object.keys(GLO.lexicon).length)?(function(){
    const surf=Object.keys(GLO.lexicon).filter(s=>s.length>=3).sort((a,b)=>b.length-a.length);
    if(!surf.length) return null;
    const re=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return { re:new RegExp("\\b("+surf.map(re).join("|")+")\\b","i"), map:GLO.lexicon };
  })():null;
  const SKIP_TAGS={A:1,CODE:1,PRE:1,BUTTON:1,SCRIPT:1,STYLE:1,H4:1,H5:1,SUMMARY:1};
  function linkifyConcepts(root){
    if(!LEX) return;
    const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(t){
      if(!t.nodeValue||!t.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p=t.parentNode; while(p&&p!==root){ if(p.classList&&p.classList.contains("gterm")) return NodeFilter.FILTER_REJECT; if(SKIP_TAGS[p.tagName]) return NodeFilter.FILTER_REJECT; p=p.parentNode; }
      return NodeFilter.FILTER_ACCEPT; } });
    const seen=new Set(), hits=[]; let t;
    while((t=walker.nextNode())){ const m=LEX.re.exec(t.nodeValue); if(!m) continue; const tid=LEX.map[m[1].toLowerCase()]; if(!tid||seen.has(tid)) continue; seen.add(tid); hits.push({node:t,index:m.index,len:m[1].length,tid}); }
    hits.forEach(hp=>{ const tn=hp.node, txt=tn.nodeValue, par=tn.parentNode; if(!par) return;
      const span=document.createElement("span"); span.className="gterm"; span.dataset.term=hp.tid; span.tabIndex=0; span.textContent=txt.slice(hp.index,hp.index+hp.len);
      const after=document.createTextNode(txt.slice(hp.index+hp.len));
      par.replaceChild(after,tn); par.insertBefore(span,after); par.insertBefore(document.createTextNode(txt.slice(0,hp.index)),span); });
  }
  const gpop=document.getElementById("gpop");
  function gpopShow(span){ const t=termById.get(span.dataset.term); if(!t) return;
    const def=t.definition||""; gpop.innerHTML='<h5>'+esc(t.name)+'</h5><div>'+mtext(def.slice(0,240))+(def.length>240?'…':'')+'</div><span class="gp-open" data-open-term="'+esc(t.term_id)+'">open in glossary →</span>';
    gpop.style.display="block"; const r=span.getBoundingClientRect();
    gpop.style.left=Math.max(6,Math.min(r.left, window.innerWidth-372))+"px"; gpop.style.top=(r.bottom+6)+"px"; }
  function gpopHide(){ gpop.style.display="none"; }

  // ---- delegated interactions for the new layers ----
  document.addEventListener("click", e=>{
    const el=e.target.closest&&e.target.closest("[data-close],[data-jump-node],[data-jump-claim],[data-open-panel],[data-open-term],[data-scroll]");
    if(!el) return;
    if(el.hasAttribute("data-close")){ closePanel(); return; }
    if(el.dataset.jumpNode){ closePanel(); selectNode(el.dataset.jumpNode); return; }
    if(el.dataset.jumpClaim){ const nid=firstNodeForClaim(el.dataset.jumpClaim); if(nid){ closePanel(); selectNode(nid); } return; }
    if(el.dataset.openTerm){ openPanel("glossary","ov-"+el.dataset.openTerm); return; }
    if(el.hasAttribute("data-open-panel")){ openPanel(el.dataset.openPanel, el.dataset.anchor||null); return; }
    if(el.dataset.scroll){ const t=document.getElementById(el.dataset.scroll); if(t) t.scrollIntoView({block:"center"}); return; }
  });
  document.addEventListener("mouseover", e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("mouseout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  document.addEventListener("focusin",   e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("focusout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  window.addEventListener("scroll", gpopHide, true);

  document.getElementById("q").addEventListener("input", applyFilters);
  document.getElementById("ftype").addEventListener("change", applyFilters);
  document.getElementById("fdead").addEventListener("change", applyFilters);
  document.getElementById("rplay").addEventListener("click", play);
  document.getElementById("rprev").addEventListener("click", ()=>{stop();step(-1);});
  document.getElementById("rnext").addEventListener("click", ()=>{stop();step(1);});
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ if(!ov.hidden){ closePanel(); return; } gpopHide(); }
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
    if(e.key==="ArrowLeft"){stop();step(-1);} else if(e.key==="ArrowRight"){stop();step(1);}
    else if(e.key==="c"||e.key==="g"||e.key==="d"||e.key==="r"){ const p={c:"context",g:"glossary",d:"dependencies",r:"recipes"}[e.key]; if(hasContent(p)) openPanel(p); }
  });

  renderMap();
  rstat();
})();
</script>
</body>
</html>
