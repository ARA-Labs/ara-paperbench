      method: 'Pure PyTorch: pos_mask = (x > 0).to(int32); pos_cumsum = cumsum(pos_mask); count_before = shift-right
        by 1; include_mask = (count_before & 1) == 1; masked = x * include_mask; y = cumsum(masked, dtype=int64).to(int32).
        Four cumulative passes over the 100M-element array.'
