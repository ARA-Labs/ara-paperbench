        nested loop to literally execute the formula Y_i = sum_{j<=i} x_j * [count_pos(<j) odd]. Score submissions
        at MSG 45 and MSG 81/89 all timed out; intermediate compile attempts raised AssertionError / ''unsupported
        AST node type: Continue''.

        '
      failure_mode: 'Triton AssertionError during ast_to_ttir: array subscript assignment (count[i] = ...)
        is not a supported AST node in Triton 2.3.1. Subsequent attempts hit ''unsupported AST node type:
        Continue'' and ''UnsupportedLanguageConstruct: break'' because the agent tried to use continue/break
        inside the range loop. Fixed versions that avoided continue/break still timed out at score time (submission
        killed, shell terminated) because the algorithm was O(n^2) per output row on n=100,000,000 elements.

        '
      hypothesis: 'Write a single Triton kernel that, for each output index i, iterates j from 0..i, accumulates
        a running positive-count, and conditionally adds x[j] to the sum when that count is odd. Use array-subscript
        writes (count[i] = ...) to track state.

        '
      id: N710
      lesson: 'Triton 2.3.1 forbids python-level control constructs ''continue'' and ''break'' inside jit
        kernels, and does not allow subscript-assignment into Triton tensors (count[i] = ...). An O(n^2) double-loop
        over 1e8 elements exceeds the scoring timeout regardless of kernel correctness; decompose the problem
        into multiple O(n) passes (positive-mask cumsum, parity mask, masked cumsum) before writing any kernel.

        '
