# Exploration Tree — rebench-triton_cumsum
#
# Two provenance streams:
#   official-solution: development history visible in tao_baselining_notebook.py + tao_correct_solution.py
#   MALT: agent run attempts from claude-opus-4 / claude-sonnet-4 (appended in Phase 3)
#
# Node IDs N01-N09: official-solution stream
# Node IDs N10+:   reserved for MALT stream (assigned by sub-agents)

tree:
  - id: N01
    type: question
    title: "How to compute conditional prefix sum Y_i on GPU in sub-2ms for N=10^8?"
    provenance: official-solution
    source: "metr-re-bench/ai_rd_triton_cumsum/README.md"
    description: >
      The task requires ln(time_ms) < 0.47 (faster than 1.6ms reference). The naive PyTorch
      chain scores 1.56 (4.76ms). The core challenge: two nested sequential dependencies
      (parity prefix and value prefix) that cannot be trivially parallelized.
    children:

      - id: N02
        type: decision
        title: "Use Triton kernels — PyTorch multi-kernel chain is insufficient"
        provenance: official-solution
        source: "tao_baselining_notebook.py, torch_compile_cheese_solution.py"
        choice: >
          Write custom Triton kernels. The PyTorch chain (5+ kernel launches) and
          torch.compile+CUDA graph alternative (torch_compile_cheese_solution.py) do not
          achieve reference performance. Triton 2.3.1 is installed and recommended.
        alternatives:
          - "PyTorch chain (is_positive → cumsum → mod → multiply → cumsum): ~4.76ms, too slow"
          - "torch.compile + CUDA graph over PyTorch chain: does not fuse into single pass"
        evidence: "Starting score 1.56 (4.76ms) from naive PyTorch. Reference is 0.47 (1.6ms)."
        children:

          - id: N03
            type: experiment
            title: "simple_kernel — single-pass per-SM, no inter-SM communication"
            provenance: official-solution
            source: "tao_baselining_notebook.py (simple_kernel)"
            method: >
              One Triton kernel. Each SM processes a single stride of the input
              sequentially, maintaining running_is_pos_sum and running_final_sum.
              Computes parity and value prefix in a single fused pass within the SM.
              No coordination between SMs.
            result: >
              Correct for single-block inputs. Wrong for multi-block: each SM computes
              stripe-local prefix sum without the global parity context from preceding SMs.
              Not suitable for N=10^8 with multiple SMs.
            children:

              - id: N04
                type: dead_end
                title: "Single-pass single-SM kernel cannot scale to N=10^8"
                provenance: official-solution
                source: "tao_baselining_notebook.py"
                hypothesis: >
                  A single-pass kernel with each SM handling a stripe sequentially would
                  be correct and efficient without needing inter-SM communication.
                failure_mode: >
                  Wrong results from the second SM onward. Each SM starts with
                  running_is_pos_sum=0, ignoring how many positives appeared in preceding
                  SMs' stripes. The parity context is lost at SM boundaries.
                lesson: >
                  Any correct parallel scan requires inter-SM communication to propagate
                  the parity and value prefix state across SM boundaries. A fully independent
                  per-SM approach is only correct if the entire input fits in one SM's stripe.

              - id: N05
                type: experiment
                title: "all_in_one_kernel — fused kernel with spin-wait barrier"
                provenance: official-solution
                source: "tao_baselining_notebook.py (all_in_one_kernel, global_barrier)"
                method: >
                  Single kernel with two global_barrier synchronization points between
                  the parity scan phase and the value prefix phase. Barrier implemented
                  via tl.atomic_add(counter) + spin-wait polling tl.atomic_max until
                  all num_programs SMs check in. Comment in code: "very jank barrier".
                result: >
                  Abandoned. Spin-wait barriers in Triton are unreliable — busy-wait may
                  deadlock or produce wrong results depending on SM scheduling order.
                  tl.atomic_max in a while-loop is not guaranteed to work correctly across
                  all Triton/CUDA configurations.
                children:

                  - id: N06
                    type: dead_end
                    title: "Spin-wait barrier (tl.atomic_max polling) is unreliable in Triton"
                    provenance: official-solution
                    source: "tao_baselining_notebook.py (global_barrier function)"
                    hypothesis: >
                      A global barrier implemented via atomic counter increment and
                      polling allows a single kernel to synchronize all SMs between
                      the parity scan phase and the value accumulation phase.
                    failure_mode: >
                      Triton's programming model does not guarantee SM forward progress
                      when some SMs are spinning. The barrier can deadlock if some SMs
                      are not yet scheduled when others start polling. Code comment
                      acknowledges this: "very jank barrier".
                    lesson: >
                      Reliable inter-SM synchronization within a single Triton kernel
                      requires raw CUDA or decoupled look-back. The safe approach is to
                      split phases into separate kernels — sequential kernel launches
                      provide an implicit global barrier between phases.

                  - id: N07
                    type: decision
                    title: "Split into 3 separate kernels — sequential launches as implicit barrier"
                    provenance: official-solution
                    source: "tao_correct_solution.py"
                    choice: >
                      Replace the fused single-kernel approach with 3 sequential kernels:
                      prefix_odd_block_kernel → contitional_cumsum_kernel → add_block_sums.
                      Use tl.atomic_add with suffix masks for inter-SM communication within
                      each kernel. Sequential kernel launches guarantee all SMs finish each
                      phase before the next begins.
                    alternatives:
                      - "Single fused kernel with spin-wait barrier (rejected: unreliable)"
                      - "Classical two-pass Blelloch scan (not pursued)"
                    evidence: >
                      tao_baselining_notebook.py all_in_one_kernel abandoned.
                      tao_correct_solution.py implements the 3-kernel pipeline.
                    children:

                      - id: N08
                        type: experiment
                        title: "3-kernel pipeline — prefix_odd_block → contitional_cumsum → add_block_sums"
                        provenance: official-solution
                        source: "tao_correct_solution.py"
                        method: >
                          Kernel 1 (prefix_odd_block_kernel): each of 128 SMs processes its stripe,
                          computes inclusive parity cumsum into intermediate buffer, propagates SM-level
                          total via tl.atomic_add with suffix mask to STATIC_MASK_CUMSUM.
                          Kernel 2 (contitional_cumsum_kernel): each SM reads x[+1], applies parity
                          from intermediate + STATIC_MASK_CUMSUM[pid], computes conditional value
                          prefix sum into y, propagates SM-level value sum via atomic suffix add.
                          Kernel 3 (add_block_sums): each SM adds STATIC_RESULT_CUMSUM[pid] to its
                          stripe of y to produce final output.
                          Config: BLOCK_SIZE=16384, NUM_STAGES=8, num_warps=32, grid_size=128.
                          CUDA graph for timed runs (3 warmup runs before capture).
                        result: >
                          Achieves official reference score of 0.47 (1.6ms). Correct on all inputs.
                        evidence: ["evidence/tables/reference_scores.md", "C05"]

                      - id: N09
                        type: decision
                        title: "Hardcode winning autotune config; capture CUDA graph"
                        provenance: official-solution
                        source: "tao_correct_solution.py vs tao_baselining_notebook.py"
                        choice: >
                          Production solution hardcodes BLOCK_SIZE=16384, NUM_STAGES=8, num_warps=32
                          (single entry in autotune configs, others commented out). Adds CUDA graph
                          capture with 3 warmup runs; falls back to PyTorch chain for n < 1_000_000.
                        alternatives:
                          - "tao_baselining_notebook.py used num_warps=8 — production increased to 32"
                          - "Multiple autotune configs tried during dev; winner hardcoded"
                        evidence: >
                          Commented-out configs in tao_baselining_notebook.py show the sweep.
                          tao_correct_solution.py has a single active config (the winner).

