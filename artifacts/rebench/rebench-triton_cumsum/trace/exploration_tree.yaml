        \ offset error growing from 2565 at block 227 to 5118 at block 253. Block sums themselves matched\
        \ PyTorch; the error was in the per-block offset accumulation / application.\n"
      hypothesis: 'Per-block local cumsum + Python-side cumsum of per-block sums + an add_block_sums kernel
        that adds the cumulative offset to each subsequent block would implement a correct global parallel
        prefix sum and replace torch.cumsum for the two cumsums.

        '
      id: N163
      lesson: 'Computing per-block offsets by having each block sequentially sum all earlier block sums inside
        the kernel is both slow and numerically fragile — the O(num_blocks^2) loop is where correctness was
