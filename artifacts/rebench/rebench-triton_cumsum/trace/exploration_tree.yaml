      lesson: In Triton, a vectorized tl.load(ptr + idx - 1, mask=valid & (idx!=0), other=0) does not just
        patch idx=0; it replaces the requested element with 0 for any masked-off lane, so mixing bounds masking
        and an idx==0 guard in a single vector load silently corrupts neighbors. Compute count-before via
        an explicit shifted indicator (pos_cumsum - pos_indicators) or a padded scratch buffer instead of
        a negative-offset masked load.
