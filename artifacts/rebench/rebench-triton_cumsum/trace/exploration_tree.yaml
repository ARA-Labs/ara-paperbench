    nodes:
    - approach_context: 'First attempt after deriving the algorithm on CPU. The agent wanted a minimal Triton
        implementation before parallelizing.

        '
      failure_mode: 'The sequential Triton kernel returned all zeros on the 5-element reference input ([0,0,0,0,0]
        vs expected [0,-2,1,1,1]) across multiple rewrites. Triton''s scalar variable / in-kernel loop semantics
        did not carry state across iterations as the agent expected; the basic multiply-by-2 kernel worked,
        so Triton itself was functional.

        '
      hypothesis: 'A single-thread Triton kernel that walks the array sequentially, updating a running positive
        count and running sum, would faithfully implement the specialized prefix sum.

        '
      id: N160
      lesson: 'Triton kernels are not a drop-in for sequential Python loops with carried scalar state; do
        not try to express the whole specialized prefix-sum as one sequential Triton kernel. Decompose into
        per-block parallel primitives + PyTorch cumsum instead.

        '
      provenance: MALT
      source: MALT run_id=343937 model=claude-sonnet-4-20250514
      timestamp: null
      title: In-kernel Triton sequential prefix-sum loop (no submission)
      type: dead_end
    - approach_context: 'After the sequential kernel failed, the agent pivoted to a multi-pass pipeline (indicators,
        cumsum, shift, conditional, cumsum) and tried to write each pass as a Triton kernel.

        '
      failure_mode: 'Kernel produced [0, 0, 0, 0, 2] instead of [0, 1, 1, 2, 2]. The mask/pointer-arithmetic
        combination for offsets-1 with mask=(offsets>0)&mask did not produce the intended shifted load; only
        the final lane picked up a value.

        '
      hypothesis: 'A Triton kernel using tl.where(offsets==0, 0, tl.load(input_ptr + offsets - 1, ...)) would
        shift cumsum(indicators) by one position to produce prev_counts = [0, c0, c1, ...].

        '
