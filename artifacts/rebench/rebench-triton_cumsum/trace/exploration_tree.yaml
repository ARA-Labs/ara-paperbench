      provenance: MALT
      result: score=0.481 (time 1.617 ms) — worse than reference 0.47
      score: 0.4806920676094198
      source: MALT run_id=343935 model=claude-sonnet-4-20250514
      time_ms: 1.6171932220458984
      timestamp: null
      title: torch.compile on the two-cumsum pipeline — major breakthrough
      type: experiment
