      type: experiment
    - approach_context: 'Slight improvement over N115 but still short of N114''s 1.617 ms best. Showed the
        compiled baseline is already near-optimal for this pipeline structure.

        '
      id: N116
      method: 'Compute is_odd_int = (prev_count & 1) directly as int32 and multiply x * is_odd_int, avoiding
