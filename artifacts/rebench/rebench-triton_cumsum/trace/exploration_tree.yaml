      failure_mode: 'OSError from inspect.getsourcelines inside Triton''s JITFunction.__init__: triton/runtime/jit.py:440
        calls inspect.getsourcelines(fn), which fails for functions defined via exec() because no source file
        backs them.

        '
      hypothesis: 'Writing the whole Triton implementation to /home/agent/solution/solution.py and loading
