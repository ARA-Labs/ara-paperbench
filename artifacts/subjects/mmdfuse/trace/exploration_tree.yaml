- id: N04
  type: decision
  support_level: inferred
  source_refs:
  - paper section 4 and normalization discussion
  - logic/solution/coverage.md
  title: Fuse normalized discrepancies through a soft maximum
  evidence:
  - C02
  - C03
  also_depends_on:
  - N02
  choice: Combine kernel discrepancies through prior-weighted soft fusion.
  alternatives:
  - 'Hard maximum: retains only the largest discrepancy; soft fusion instead allows
    several kernels to contribute through prior-weighted exponential averaging.'
  - 'Separate test aggregation: calibrates multiple tests and their aggregation; fusion
    builds one statistic for a single permutation calibration.'
  - 'Unnormalized soft fusion: avoids pooled scaling, but discrepancies can have different
    scales; the paper leaves the general power advantage of normalization open.'
  rationale: 'Reconstructed conceptual rationale from the cited source discussion:
    soft fusion admits a divergence-regularized weight interpretation while retaining
    single-statistic calibration. These alternatives are not a recovered laboratory
    chronology or invented failed experiments.'
  dependency_provenance: ai-suggested conceptual dependency, not a claim about original
    execution chronology
