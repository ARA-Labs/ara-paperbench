- id: N02
  type: decision
  support_level: explicit
  source_refs:
  - paper section 3
  title: Use pooled permutation-invariant selection
  evidence:
  - C01
  - C03
  also_depends_on:
  - N01
  choice: Select parameters from the unordered pool rather than original sample labels.
  alternatives:
  - Data splitting or per-permutation selection, discussed by the paper as alternatives;
    no failed run is invented.
  rationale: 'Source-attributed tradeoff: splitting reduces observations available
    to the final test; repeating expensive parameter selection for each permutation
    adds computation. Pooled invariant selection retains observations while reusing
    the selection. This reconstructed rationale is not original laboratory chronology.'
