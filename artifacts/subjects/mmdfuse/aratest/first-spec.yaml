format_version: 7
evidence:
  evidence/figures/figure1.md:
    metric: {name: rejection_proportion}
    axes: {Method: method, column: sample_size, section: panel}
claims:
  - claim_id: C08
    properties:
      - kind: consistency
        metric: rejection_proportion
        treatment: {method: MMD-D}
        baseline: {method: MMD-FUSE}
        where: {panel: 'Galaxy: sample size'}
        comparator: gt
        over: sample_size
        in_scope: ['500', '1000', '1500', '2000', '2500']
        min_pass: 1
    provenance:
      author: direct-annotation-assistant
      model: openai-codex/gpt-6-astra
  - claim_id: C12
    properties:
      - kind: invariant
        metric: rejection_proportion
        statistic: mean
        include_reference: false
        band: {lower: 0.13, upper: 0.23}
        controls:
          - rule: paired_shift
            control_id: label_permutation
            direction: decrease
            min_shift: 0.05
            reference_within: {lower: 0.13, upper: 0.23}
            control_within: {lower: 0.0, upper: 0.1}
    provenance:
      author: direct-annotation-assistant
      model: openai-codex/gpt-6-astra
