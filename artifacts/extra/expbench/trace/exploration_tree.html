<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — 2505.24785</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — 2505.24785</h1>
  <p>Research DAG &middot; EXP-Bench: Can AI Conduct AI Research Experiments?</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "Can AI agents autonomously conduct end-to-end AI research experiments?",
    "description": "The central question driving EXP-Bench: given a research question, method description, and starter code from a real peer-reviewed paper, can current AI agents design, implement, execute, and interpret results from that experiment without human assistance?",
    "children": [
      {
        "id": "N02",
        "type": "question",
        "title": "What benchmark infrastructure is needed to evaluate this capability?",
        "description": "Sub-question: what task format, evaluation metrics, and dataset scale are required to rigorously and systematically assess agent performance on AI research experimentation?",
        "children": [
          {
            "id": "N03",
            "type": "experiment",
            "title": "Attempt: manually curate research tasks from papers",
            "result": "Manual curation required ~2 hours per paper for full read-through, task extraction, verification, and pipeline correction. Cannot scale to hundreds of tasks.",
            "evidence": [
              "App. F",
              "Table 7"
            ],
            "children": [
              {
                "id": "N04",
                "type": "dead_end",
                "title": "Full manual curation is not scalable",
                "hypothesis": "Human experts can efficiently extract verified research tasks from papers",
                "failure_mode": "Key experimental details are scattered across paper body, appendix, supplementary, and codebase; interpreting them requires deep domain expertise; 2 hrs/paper × 51 papers = unsustainable for large-scale benchmark creation",
                "lesson": "Motivated development of semi-automated pipeline with LLM extraction + lightweight human verification; human burden reduced to ~20 min/paper after pipeline finalization"
              },
              {
                "id": "N05",
                "type": "pivot",
                "from": "Full manual curation",
                "to": "Semi-automated pipeline with multi-pass LLM extraction + execution validation",
                "trigger": "Manual curation infeasible at scale; LLMs (o3-mini, Claude-3.7 Sonnet) capable of multi-modal PDF extraction and code understanding; open-source codebases provide ground truth to validate extractions",
                "children": [
                  {
                    "id": "N06",
                    "type": "decision",
                    "title": "Design multi-pass vs. single-pass extraction strategy",
                    "choice": "Three-pass RAG extraction (high-level → subsection → full-paper re-query)",
                    "alternatives": [
                      "Single-pass extraction over full paper text",
                      "Manual section identification followed by LLM extraction"
                    ],
                    "evidence": "Single-pass extraction missed details scattered across sections and appendices (observed in early pipeline prototypes; documented failure types in Table 7); multi-pass with accumulated context substantially improved completeness",
                    "children": [
                      {
                        "id": "N07",
                        "type": "experiment",
                        "title": "Validate extraction pipeline produces executable tasks",
                        "result": "Pipeline produced 461 tasks from 51 papers; extraction issues identified and patched iteratively (Table 7); pipeline cost ~$60 USD/paper average",
                        "evidence": [
                          "§3.1",
                          "§3.2",
                          "App. F",
                          "Table 7"
                        ],
                        "children": [
                          {
                            "id": "N08",
                            "type": "decision",
                            "title": "Choose evaluation metric structure: individual vs. conjunctive",
                            "choice": "Conjunctive multi-phase evaluation (D, I, C, E individually + I·E, C·D, All✓, All·E✓ conjunctions) as primary evaluation framework",
                            "alternatives": [
                              "Single overall score (e.g., pass/fail per task)",
                              "Individual phase scores only (D, I, C, E separately)",
                              "Human expert score comparison only (as in RE-Bench)"
                            ],
                            "evidence": "Individual metrics (especially C and E) exhibit high variance and can be gamed by agents producing plausible-but-unfounded outputs; single scores mask partial capability; conjunctions reduce variance and reveal brittleness (Fig. 5, Fig. 6b)",
                            "children": [
                              {
                                "id": "N09",
                                "type": "experiment",
                                "title": "Evaluate 7 agent configurations on all 461 EXP-Bench tasks",
                                "result": "Best agent (OH+o3-mini) achieves All·E✓=0.5%; individual phase scores reach 20-35%; conjunctive score collapses from 20.6% (M) to 0.2% (M·C·D·I·E); 3,238 raw failure insights across 361 unique types",
                                "evidence": [
                                  "C01",
                                  "C02",
                                  "C03",
                                  "Table 1",
                                  "Figure 6b",
                                  "§4.1"
                                ],
                                "children": [
                                  {
                                    "id": "N10",
                                    "type": "experiment",
                                    "title": "Failure pattern analysis via two-pass open-ended categorization",
                                    "also_depends_on": [
                                      "N09"
                                    ],
                                    "result": "Dominant failure: missing essential implementation components (39.71%); execution failures driven by env/dependency errors (29.38%) and script errors (23.84%); conclusion failures dominated by missing content (26.18%) and incorrect interpretation (19.66%)",
                                    "evidence": [
                                      "C04",
                                      "C05",
                                      "Table 2",
                                      "Table 8",
                                      "§4.3"
                                    ],
                                    "children": [
                                      {
                                        "id": "N11",
                                        "type": "decision",
                                        "title": "Identify top bottleneck for future improvement",
                                        "choice": "Implementation completeness is the most impactful target: 39.71% missing components vs. 29.38% env errors. Future work: RL with verifiable rewards to train agents on EXP-Bench dataset",
                                        "alternatives": [
                                          "Focus on execution environment reproducibility",
                                          "Focus on experimental design variable classification",
                                          "Focus on conclusion derivation and interpretation"
                                        ],
                                        "evidence": "Table 2, §4.3, §5 Future Directions"
                                      }
                                    ]
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "id": "N12",
        "type": "dead_end",
        "title": "Existing benchmarks insufficient for end-to-end AI experimentation evaluation",
        "hypothesis": "Existing benchmarks (MLE-Bench, RE-Bench, PaperBench, ScienceAgentBench) can serve as evaluation infrastructure for end-to-end AI research experimentation",
        "failure_mode": "MLE-Bench: constrained Kaggle environment, simplified metrics; RE-Bench: 7 tasks, insufficient scale; PaperBench: focuses on script execution not implementation; ScienceAgentBench: isolates analysis, no actual execution; none capture full design→implementation→execution→conclusion pipeline",
        "lesson": "Dedicated benchmark needed that sources tasks from real peer-reviewed papers, requires agents to generate (not just run) implementations, and uses conjunctive multi-phase evaluation; motivated EXP-Bench design"
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
