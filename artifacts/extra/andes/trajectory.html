ry or orthogonal)"}], "attribution": "", "entries": [{"rw_id": "RW01", "inferred_id": false, "name": "Kwon et al., 2023 (vLLM)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Andes adds QoE-aware token-level preemptive scheduling on top of vLLM's continuous batching and PagedAttention.\nWhy: vLLM uses FCFS scheduling which causes head-of-line blocking and QoE degradation.", "adopted": "Continuous batching, PagedAttention KV cache management, preemption mechanisms (recomputation/swapping). Andes implemented as an alternative scheduler within vLLM v0.6.1.", "grounding": [], "claims": ["C02", "C03", "C04", "C07", "C08"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW02", "inferred_id": false, "name": "Agrawal et al., 2024 (Sarathi-Serve)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Andes uses QoE-aware priority scheduling; Sarathi-Serve uses chunked prefill with FCFS.\nWhy: Sarathi-Serve optimizes throughput-latency tradeoff but not QoE; chunked prefill can interfere with prefill stage and increase TTFT.", "adopted": "Preemption overhead predictability insight; preemption mechanism characterization.", "grounding": [], "claims": ["C02", "C03", "C08"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW03", "inferred_id": false, "name": "Yu et al., 2022 (Orca)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Andes adds token-level preemptive scheduling; Orca introduced iteration-level batching.\nWhy: Iteration-level batching is a prerequisite for token-level control.", "adopted": "Iteration-level (continuous) batching paradigm.", "grounding": [], "claims": ["C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW04", "inferred_id": false, "name": "Patel et al., 2024 (Splitwise)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Splitwise optimizes prefill/decode separation; Andes focuses on QoE-aware scheduling without changing the prefill/decode split.\nWhy: Splitwise uses FCFS and does not optimize for user-facing QoE.", "adopted": "None directly.", "grounding": [], "claims": ["C08"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW05", "inferred_id": false, "name": "Zhong et al., 2024 (DistServe)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: DistServe disaggregates prefill and decoding; Andes is orthogonal, focusing on scheduling within a serving instance.\nWhy: DistServe optimizes goodput but not user QoE.", "adopted": "None directly.", "grounding": [], "claims": ["C08"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW06", "inferred_id": false, "name": "Wu et al., 2024 (LoongServe)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: LoongServe targets long-context sequences with elastic sequence parallelism; Andes targets QoE-aware scheduling for text streaming.\nWhy: Different optimization objective; LoongServe uses FCFS.", "adopted": "None directly.", "grounding": [], "claims": ["C08"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW07", "inferred_id": false, "name": "Sheng et al., 2024 (VTC — Fairness in LLM Serving)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: VTC proposes non-preemptive fairness-based scheduling; Andes uses preemptive QoE-based scheduling.\nWhy: Fairness != QoE; VTC does not account for user consumption speed or TTFT targets.", "adopted": "Insight that request scheduling beyond FCFS is valuable.", "grounding": [], "claims": ["C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW08", "inferred_id": false, "name": "Sun et al., 2024 (Llumnix)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Llumnix proposes cluster-wide live migration for load balancing; Andes operates within a single instance.\nWhy: Complementary scope; Andes assumes cluster-level load balancing is handled externally.", "adopted": "Cluster-level concerns explicitly excluded from Andes scope.", "grounding": [], "claims": ["C08"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW09", "inferred_id": false, "name": "Liu et al., 2024 (CacheGen)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: CacheGen streams KV cache entries incrementally; Andes focuses on token generation scheduling.\nWhy: Orthogonal optimization; CacheGen addresses KV reuse, Andes addresses scheduling policy.", "adopted": "None.", "grounding": [], "claims": [], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW10", "inferred_id": false, "name": "Wang et al., 2024 (BurstGPT)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: BurstGPT provides real-world LLM serving traces; Andes uses these traces for evaluation.\nWhy: Realistic workload characterization; validates that burst patterns (3/hour, 7 min avg, 2x rate) are realistic.", "adopted": "One-hour trace slice for end-to-end evaluation; burst statistics for cyclic burst load pattern design.", "grounding": [{"raw": "arXiv:2401.17644", "kind": "arxiv", "target": null}], "claims": ["C04", "C07"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW11", "inferred_id": false, "name": "Kellerer et al., 2004 (Knapsack Problems)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Andes uses a variant of the 0/1 knapsack problem where item values depend on total items selected (batch size B); solves with greedy approximation.\nWhy: Standard knapsack is NP-Hard; the B-dependent variant is harder but still tractable via greedy.", "adopted": "Knapsack problem formulation; weak NP-hardness result; pseudo-polynomial DP solution concept.", "grounding": [], "claims": ["C02", "C06"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW12", "inferred_id": false, "name": "Video Streaming QoE (Dobrian et al. 2011, Jiang et al. 2016, et al.)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Andes adapts QoE concepts from video streaming (startup time, buffering) to text streaming (TTFT, token consumption pacing). Key differences: video is network-constrained; text is GPU compute/memory constrained. Video QoE factors (bitrate, buffering ratio) differ from text QoE factors.\nWhy: Text streaming has unique QoE challenges not addressed by video streaming literature.", "adopted": "QoE as an optimization objective; inspiration for startup delay and buffering concepts.", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}], "footprint": []}, "recipes": {"title": "Solution", "files": [{"file": "algorithm.md", "role": "algorithm", "file_title": "Algorithm", "sections": [{"sec_id": "qoe-def", "heading": "QoE Definition", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "S_delay (Eq. 1) = sum_{i=1}^{n} (T_actual_i - T_ideal_i)\nS_whole (Eq. 2) = sum_{i=1}^{n} (T_actual_i - T_ideal_start)\nQoE (Eq. 3) = 1 - S_delay / S_whole   [range: QoE in [0,1]; QoE=1 perfect; QoE=0 no tokens delivered]", "text": "S_delay (Equation 1): S_delay = sum_{i=1}^{n}(T_actual_i - T_ideal_i), where T_actual_i is the actual consumption timestamp of token i, T_ideal_i is the ideal consumption timestamp, and n is total tokens consumed. S_whole (Equation 2): S_whole = sum_{i=1}^{n}(T_actual_i - T_ideal_start), where T_ideal_start is the request submission time; S_whole covers both S_delay and the area below the Actual Consumption Timeline. QoE (Equation 3): QoE = 1 - S_delay/S_whole. Range: QoE in [0, 1]. QoE = 1: perfect. QoE = 0: no tokens delivered.", "warn": "", "refs": []}, {"sec_id": "qoe-gain", "heading": "QoE Gain (Equation 4)", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "Delta_Q_i = Q_serve,i(B) - Q_wait,i", "text": "Delta Q_i = Q_serve,i(B) - Q_wait,i, where Q_serve,i(B) is the estimated QoE of request i if served in batch size B for the next Delta-t seconds, and Q_wait,i is the estimated QoE if not served for Delta-t.", "warn": "", "refs": []}, {"sec_id": "sched-problem", "heading": "Scheduling Problem (Equation 5)", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "max_x sum_{i=1}^{N} (Q_serve,i(B) - Q_wait,i) . x_i\nsubject to: x_i in {0,1}; sum x_i = B; sum l_i x_i <= M", "text": "Solved for all B in [B_min, B_max]; the x achieving the maximum across all B is selected. Problem hardness: Weakly NP-Hard (variant of 0/1 knapsack where item values depend on total items selected).", "warn": "", "refs": []}, {"sec_id": "priority-score", "heading": "Priority Score (Equation 6)", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "pi_i = (Q_serve,i(B) - Q_wait,i) / l_i", "text": "Priority Score (Equation 6): pi_i = (Q_serve,i(B) - Q_wait,i) / l_i.", "warn": "", "refs": []}, {"sec_id": null, "heading": "Algorithm 1: Priority-Based Greedy Packing", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "for all i in [1, N]:\n    p[i] <- q[i] / l[i]           # priority = QoE gain per memory unit\n\nM_current <- 0\nN_current <- 0\nx[N] <- all zeros\n\nfor all i in [1, N] sorted by p[i] descending:\n    if M_current + l[i] <= M and N_current + 1 <= B:\n        x[i] <- 1\n        M_current <- M_current + l[i]\n        N_current <- N_current + 1\n    else:\n        break\n\nreturn x", "text": "Input: N (number of requests), M (memory capacity), l[N] (context lengths), q[N] (QoE gains), B (target batch size). Output: x[N] (scheduling decision: 1=serve, 0=wait). Complexity: O(N log N). Run for all B in [B_min, B_max]; select x* achieving maximum total QoE gain across all B.", "warn": "", "refs": []}, {"sec_id": null, "heading": "Algorithm 2: 3D Dynamic Programming (Optimal, Pseudo-Polynomial)", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Initialize dp[N+1][B+1][M+1] <- -inf\nInitialize choice[N+1][B+1][M+1] <- 0\ndp[0][0][0] <- 0\n\nfor i = 1 to N:\n    for b = 0 to min(i, B):\n        for m = 0 to M:\n            if dp[i][b][m] < dp[i-1][b][m]:\n                dp[i][b][m] <- dp[i-1][b][m]; choice[i][b][m] <- 0\n            if b >= 1 and m >= l[i]:\n                if dp[i-1][b-1][m-l[i]] + q[i] > dp[i][b][m]:\n                    dp[i][b][m] <- dp[i-1][b-1][m-l[i]] + q[i]; choice[i][b][m] <- 1\n\nQ_max <- max(dp[N][B][:])\n... backtrack via choice[][][] ...\nreturn x[1:]", "text": "Input: N, M, l[N], q[N], B. Output: x[N]. Complexity: O(M . N^2) (pseudo-polynomial; N^2 from solving for all B in [1, N]).", "warn": "", "refs": []}, {"sec_id": null, "heading": "Overhead-Aware Refiner (Algorithm, Informal)", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "for r_admit in A_proposed (highest priority first):\n    find r_preempt in P_proposed with minimum resources to accommodate r_admit\n    overhead <- estimate_latency(preempt r_preempt, admit r_admit)\n    QoE_gain <- Q_serve(r_admit) - Q_wait(r_admit)\n    QoE_loss <- sum over all ongoing r of QoE_loss(r, overhead)\n    if QoE_gain > QoE_loss:\n        A' <- A' + {r_admit}; P' <- P' + {r_preempt}\n    else:\n        break\nreturn (A', P')", "text": "Input: greedy decision (A_proposed, P_proposed) sorted by priority. Output: refined decision (A', P').", "warn": "", "refs": []}, {"sec_id": null, "heading": "Alternative Objective Functions (Appendix A)", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "Max-min QoE (Eq. 7): item value = max(Q_min - Q_wait,i, 0)\nMaximize requests with perfect QoE (Eq. 8): item value = [1(Q_serve,i=1) - 1(Q_wait,i=1)] . 1(Q_current,i=1)", "text": "Max-min QoE (Equation 7): Item value for request i = max(Q_min - Q_wait,i, 0). Maximize requests with perfect QoE (Equation 8): Item value = [1(Q_serve,i=1) - 1(Q_wait,i=1)] . 1(Q_current,i=1).", "warn": "", "refs": []}, {"sec_id": null, "heading": "Token Generation Latency Model", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Token generation latency modeled as function of batch size B only, justified by Pearson correlation coefficient of 0.997 between batch size and total context length in a batch (Figure 21, Multi-Round ShareGPT dataset). Eliminates need to track total context length separately.", "warn": "", "refs": [{"raw": "Figure 21", "kind": "figure", "target": null}]}]}, {"file": "architecture.md", "role": "architecture", "file_title": "Architecture", "sections": [{"sec_id": null, "heading": "System Overview", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "[User] <-> [Token Pacer (Client)] <-> [Server]\n                                       |-- Request Tracker\n                                       |-- Token-Level Request Scheduler\n                                       |     |-- Priority-Based Greedy Packer\n                                       |     +-- Overhead-Aware Refiner\n                                       |-- Executor (LLM Inference Engine)\n                                       +-- KV Cache", "text": "Andes co-designs the LLM inference server and the application client. The server handles all scheduling and token generation; the client smooths token delivery to users.", "warn": "", "refs": []}, {"sec_id": null, "heading": "Component: Request Tracker", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Maintains the complete control state for each active request (waiting or running)."}, {"label": "Inputs", "value": "Request arrival events (prompt, QoE parameters), token generation events from Executor, preemption/admit decisions from Scheduler."}, {"label": "Outputs", "value": "Per-request state to the Scheduler (context length, accumulated QoE state, token timestamps, QoE parameters)."}, {"label": "State per request", "value": "QoE parameters (target TTFT, r_user); prompt and partial response text; timestamps of each generated token (T_delivery array); current context length l_i; current resource usage; current QoE value (recomputed incrementally)."}, {"label": "Design choices", "value": "Continuously updated on every token generation event; enables real-time QoE gain estimation for scheduler."}, {"label": "Code ref", "value": "src/execution/qoe.py (QoE computation, RequestState class)"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": null, "heading": "Component: Token-Level Request Scheduler", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "At each scheduling quantum, decides which requests to admit/resume and which to preempt to maximize aggregate QoE."}, {"label": "Inputs", "value": "Full request state from Request Tracker (context lengths, QoE gains, resource usage), token generation latency profile (function of batch size B), preemption overhead profiles."}, {"label": "Outputs", "value": "Admit/resume set A', Preempt set P' for the Executor."}, {"label": "Subcomponents", "value": "1. Priority-Based Greedy Packer (Sec. 4.2): assigns priority pi_i = (Q_serve,i(B) - Q_wait,i)/l_i, sorts descending, greedily packs respecting memory constraint M and batch size B; run for all B in [B_min, B_max], O(N log N) per B value. 2. Overhead-Aware Refiner (Sec. 4.3): post-processes the greedy decision, iterates over (admit, preempt) pairs in priority order, estimates net QoE change, prunes pairs with non-positive net QoE."}, {"label": "Selective Triggering", "value": "Algorithm only invoked when GPU KV cache occupancy > 90% (memory-bound) or token generation latency exceeds the most stringent user consumption speed requirement (compute-bound)."}, {"label": "Batch size search space", "value": "B in [B_min, B_max]; B_max = max feasible batch by context length; B_min = largest batch generating tokens faster than most stringent r_user."}, {"label": "Design choices", "value": "Approximate greedy over exact DP because greedy is ~20x faster and achieves slightly better real-time QoE. Overhead-aware refiner is critical (ablation in Sec. 6.4)."}, {"label": "Code ref", "value": "src/execution/scheduler.py"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": null, "heading": "Component: Executor", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Executes LLM inference using continuous batching; generates one token per iteration for each request in the current batch."}, {"label": "Inputs", "value": "Admit/preempt decisions from Scheduler, KV cache state."}, {"label": "Outputs", "value": "Generated tokens (pushed immediately to client Token Pacer via push-based streaming); updated KV cache."}, {"label": "Design choices", "value": "Push-based streaming (not pull) because tokens for a single user are streamed only to that user, and the server needs to deallocate request state quickly to free memory."}, {"label": "Interactions", "value": "Reads/writes KV Cache; sends tokens to Token Pacer via server-push streaming."}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": null, "heading": "Component: KV Cache", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Stores key-value attention tensors for all tokens in the context of running requests."}, {"label": "Inputs", "value": "Requests admitted by Scheduler; preemption events (trigger eviction or swap)."}, {"label": "Outputs", "value": "KV tensors to Executor during inference; swapped data to/from CPU RAM during preemption."}, {"label": "Memory constraint", "value": "Total KV cache entries across all running requests <= M (GPU memory capacity)."}, {"label": "Preemption modes", "value": "Recomputation (drop cache, recompute on resumption) or Swapping (copy GPU<->CPU RAM, restore on resumption). Andes offline-profiles both and selects the faster."}, {"label": "Design choices", "value": "Managed by the Scheduler via context length tracking; no modification needed to standard KV cache implementations."}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": null, "heading": "Component: Token Pacer (Client-Side)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Buffers tokens received from the server (potentially in bursts faster than r_user) and delivers them to the user precisely at the Ideal Consumption Timeline rate."}, {"label": "Inputs", "value": "Tokens pushed from server; QoE parameters (target TTFT, r_user) set at request submission."}, {"label": "Outputs", "value": "Token stream to user at rate r_user aligned to Ideal Consumption Timeline."}, {"label": "State", "value": "Buffer of received-but-not-yet-delivered tokens; current pacer size B_pacer(t)."}, {"label": "Server awareness", "value": "Server monitors pacer buffer state (inferred from token timestamps and consumption speed) and resumes preempted requests before the buffer runs dry."}, {"label": "Design choices", "value": "Client-side buffering allows server to preempt more aggressively without the user perceiving pauses. Absorbs generation fluctuations and preemption gaps."}, {"label": "Code ref", "value": "src/execution/token_pacer.py"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": null, "heading": "Request Lifecycle", "kind": "steps", "markdown": "", "steps": ["User submits request through application client; Token Pacer is initialized with QoE parameters.", "Request enters server queue; Request Tracker initializes state.", "Scheduler admits request when resources are available; Executor generates tokens.", "Server pushes tokens immediately to Token Pacer (push-based streaming).", "Token Pacer buffers excess tokens; delivers at r_user aligned to Ideal Consumption Timeline.", "If Scheduler preempts request: KV cache is saved (swap) or dropped (recompute); Token Pacer continues delivering buffered tokens to user.", "When Scheduler resumes request: KV cache is restored; Executor resumes token generation.", "Request completes when all output tokens are generated and delivered."], "fields": [], "code": "", "text": "", "warn": "", "refs": []}]}, {"file": "constraints.md", "role": "constraints", "file_title": "Constraints", "sections": [{"sec_id": "BC1", "heading": "BC1: Memory Constraint", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The sum of context lengths (KV cache entries) for all concurrently served requests must not exceed the GPU's KV cache capacity M: Sigma(l_i . x_i) <= M. Batch size is also bounded by memory: B_max is the largest batch achievable before M is exceeded when filling with shortest-context requests.", "warn": "", "refs": []}, {"sec_id": "BC2", "heading": "BC2: Compute Constraint", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Larger batch size B increases token generation latency. B_min is set as the largest B where all served requests still generate tokens faster than the most stringent user consumption speed r_user_min across all requests. If B > some threshold, TDS drops below r_user, causing QoE degradation for served requests.", "warn": "", "refs": []}, {"sec_id": "BC3", "heading": "BC3: Online Setting — No Future Knowledge", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Andes operates in a fully online setting: request arrival times, input lengths, output lengths, and QoE parameters are not known in advance. QoE gain estimation uses a look-ahead window Delta-t; the best Delta-t depends on model and workload and requires pre-deployment tuning.", "warn": "", "refs": []}, {"sec_id": "BC4", "heading": "BC4: QoE = 0 is Worst Case (No Tokens)", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "QoE is undefined when S_whole = 0 (no tokens expected). When no tokens are delivered at all, S_delay = S_whole and QoE = 0. QoE cannot be computed before any tokens have been consumed.", "warn": "", "refs": []}, {"sec_id": "BC5", "heading": "BC5: Token Pacer Buffer Depletion", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "If the server fails to resume a preempted request before the client-side pacer buffer drains, the user experiences a pause and QoE degrades. The server must track pacer buffer state to avoid this.", "warn": "", "refs": []}, {"sec_id": "BC6", "heading": "BC6: Cluster-Level Concerns Out of Scope", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Andes's scheduler manages requests within a single vLLM instance. Cluster-level load balancing and fault tolerance are assumed to be handled separately.", "warn": "", "refs": []}, {"sec_id": "BC7", "heading": "BC7: Preemption Overhead Predictability Assumption", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The overhead-aware refiner assumes preemption overhead is predictable from offline profiles. If hardware or load conditions cause overhead to be highly variable, refiner estimates may be inaccurate.", "warn": "If hardware or load conditions cause overhead to be highly variable, refiner estimates may be inaccurate.", "refs": []}, {"sec_id": "L1", "heading": "L1: Output Length Unknown", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Since output lengths are unknown a priori, QoE gain estimation (Q_serve,i(B)) can only project forward by Delta-t, introducing uncertainty. The choice of Delta-t affects performance and must be tuned per deployment.", "warn": "", "refs": []}, {"sec_id": "L2", "heading": "L2: Single-Instance Scope", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Andes does not address multi-instance load balancing or cross-machine scheduling. It assumes the system receiving requests is a single serving unit.", "warn": "", "refs": []}, {"sec_id": "L3", "heading": "L3: Greedy Solver Sub-Optimality", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The greedy solver is an approximation to the NP-Hard knapsack problem. While empirically it matches or exceeds the 3D DP solver due to real-time speed advantages, it does not provide optimality guarantees.", "warn": "", "refs": []}, {"sec_id": "L4", "heading": "L4: QoE Parameters Must Be Known at Request Time", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Target TTFT and user consumption speed must be specified at request submission. In real deployments, these may need to be inferred or set via API tiers.", "warn": "", "refs": []}, {"sec_id": "L5", "heading": "L5: Preemption Mechanism Availability", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Andes requires the underlying serving system to support continuous batching and at least one preemption mechanism (swapping or recomputation). Systems lacking these cannot integrate Andes's scheduler.", "warn": "", "refs": []}, {"sec_id": "L6", "heading": "L6: Context Length as Sole Memory Proxy", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The memory constraint uses context length as the proxy for KV cache size. Actual memory usage also includes model weights and intermediate tensors, which are treated as fixed overhead.", "warn": "", "refs": []}]}, {"file": "heuristics.md", "role": "heuristics", "file_title": "Heuristics", "sections": [{"sec_id": "H01", "heading": "H01: Priority = QoE Gain per Memory Unit (l_i denominator)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Dividing QoE gain by context length l_i balances QoE improvement against GPU memory cost. A request with large l_i consuming much memory but small QoE gain should yield to requests with smaller l_i and larger QoE gain. This also means long-context requests are naturally preempted first, freeing enough memory to potentially admit multiple new short-context requests (more efficient than preempting multiple short ones)."}, {"label": "Sensitivity", "value": "high — the denominator l_i directly controls preemption decisions for memory-heavy requests."}, {"label": "Bounds", "value": "pi_i > 0 when the request would gain QoE from being served; pi_i <= 0 when already ahead of ideal timeline (no gain from serving)."}, {"label": "Code ref", "value": "src/execution/scheduler.py"}, {"label": "Source", "value": "Section 4.2, Equation 6"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "H02", "heading": "H02: Selective Triggering via KV Cache Watermark (90%) and Latency Threshold", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Under normal load, running the knapsack solver every iteration is unnecessary overhead. Triggering only when the system is resource-constrained (memory occupancy > 90% or token latency exceeds the most stringent r_user) avoids wasted computation while ensuring the scheduler acts exactly when QoE is at risk."}, {"label": "Sensitivity", "value": "medium — a lower watermark triggers more frequently (more overhead), a higher watermark risks missing early QoE degradation."}, {"label": "Bounds", "value": "Memory watermark set at 90% of KV cache capacity. Latency threshold = 1/r_user_min for the most stringent request."}, {"label": "Code ref", "value": "src/execution/scheduler.py"}, {"label": "Source", "value": "Section 4.2, \"Selective Triggering\""}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "H03", "heading": "H03: Batch Size Search Space Pruning [B_min, B_max]", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Exploring all B in [1, N] is unnecessary. B_max is set by packing the shortest-context requests until memory M is reached (maximum feasible batch). B_min is set as the largest B that still generates tokens faster than the most stringent user consumption speed — below B_min, TDS > r_user for all requests and serving fewer requests only wastes potential concurrency without QoE benefit."}, {"label": "Sensitivity", "value": "medium — incorrect B_min/B_max bounds can exclude the optimal batch size."}, {"label": "Bounds", "value": "1 <= B_min <= B_max <= N; B_max determined by memory capacity; B_min determined by token generation latency profile."}, {"label": "Code ref", "value": "src/execution/scheduler.py"}, {"label": "Source", "value": "Section 4.2, \"Batch Size Search Space Pruning\""}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "H04", "heading": "H04: Overhead-Aware Refiner — Stop When Net QoE Change is Non-Positive", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The greedy scheduler's admission list is sorted by priority. Once a lower-priority (admit, preempt) pair produces non-positive net QoE (gain < overhead cost), all subsequent pairs in priority order will also fail (since they have lower gain). This allows early termination, making the refiner efficient."}, {"label": "Sensitivity", "value": "high — without this stopping criterion, the refiner could admit preemptions that net-degrade QoE."}, {"label": "Bounds", "value": "Net QoE threshold = 0. If QoE_gain(r_admit) − QoE_loss_all_ongoing(overhead) <= 0, stop."}, {"label": "Code ref", "value": "src/execution/scheduler.py"}, {"label": "Source", "value": "Section 4.3, \"Balancing QoE Gain and Overhead\""}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "H05", "heading": "H05: Token Pacer — Server-Side Buffer Awareness for Preemption Timing", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The server pushes tokens as they are generated. When a request has accumulated sufficient tokens in the pacer buffer (actual delivery timeline well above ideal), the server can afford to preempt it. The server tracks pacer state via token delivery timestamps and consumption speed, resuming preempted requests before the buffer depletes to zero."}, {"label": "Sensitivity", "value": "high — if the server resumes too late, the user experiences a pause (QoE degradation). Too early, and the preemption benefit is lost."}, {"label": "Bounds", "value": "Resume request when estimated pacer buffer < safety margin (enough tokens for overhead duration at r_user). Safety margin = preemption/resumption latency x r_user."}, {"label": "Code ref", "value": "src/execution/token_pacer.py"}, {"label": "Source", "value": "Section 5, Figure 10"}], "code": "", "text": "", "warn": "", "refs": []}]}]}}
/* __ARA_DATA_END__ */
</script>

<script>
"use strict";
(function () {
  const GLYPH = { question:"Q", experiment:"✦", decision:"→", dead_end:"✗", pivot:"↻", insight:"!", default:"•" };
  const TYPES = ["question","experiment","decision","dead_end","pivot","insight"];

  let DATA;
  try {
    // The payload sits between the BEGIN/END marker comments (kept in-file so the
    // skill can re-inject). Strip ONLY those two named markers before parsing; the
    // rest of textContent is pure JSON. (Marker text is not written literally here,
    // so it stays a single injection site.)
    var raw = document.getElementById("ara-data").textContent
                .replace(/\/\*\s*__ARA_DATA_(?:BEGIN|END)__\s*\*\//g, "");
    DATA = JSON.parse(raw);
  } catch (e) {
    document.getElementById("detail").innerHTML =
      '<div class="none">Could not parse embedded ARA data: ' + String(e) + '</div>';
    return;
  }

  const nodes = DATA.nodes || [];
  const byId = new Map(nodes.map(n => [n.id, n]));
  const kids = new Map();
  nodes.forEach(n => kids.set(n.id, []));
  let roots = [];
  nodes.forEach(n => {
    if (n.parent && byId.has(n.parent)) kids.get(n.parent).push(n.id);
    else roots.push(n.id);
  });
  // Traversal order: explicit DATA.order if given, else DFS from roots.
  let order = Array.isArray(DATA.order) && DATA.order.length ? DATA.order.filter(id => byId.has(id)) : [];
  if (!order.length) { const seen=new Set(); const dfs=id=>{if(seen.has(id))return;seen.add(id);order.push(id);(kids.get(id)||[]).forEach(dfs)}; roots.forEach(dfs); }

  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const glyph = t => GLYPH[t] || GLYPH.default;
  const cls = t => TYPES.includes(t) ? t : "default";

  // ---- header ----
  const m = DATA.meta || {};
  document.getElementById("h-title").textContent = m.title || "ARA Trajectory";
  document.getElementById("h-sub").textContent =
    [ (m.authors||[]).join(", "), m.venue, m.year ].filter(Boolean).join(" · ");
  if (m.abstract) document.getElementById("h-abstract").textContent = m.abstract;
  else document.getElementById("h-abstract-wrap").style.display = "none";

  const ftype = document.getElementById("ftype");
  const present = [...new Set(nodes.map(n => n.type))];
  TYPES.concat(present.filter(t=>!TYPES.includes(t))).filter(t=>present.includes(t))
    .forEach(t => { const o=document.createElement("option"); o.value=t; o.textContent=t; ftype.appendChild(o); });

  // ---- minimal markdown-table renderer ----
  function renderMd(md){
    if(!md) return "";
    const lines = String(md).split("\n");
    let out=[], i=0;
    while(i<lines.length){
      if(/^\s*\|/.test(lines[i]) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        const row = l => l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
        const head = row(lines[i]); i+=2; const body=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){ body.push(row(lines[i])); i++; }
        out.push('<table class="md"><thead><tr>'+head.map(h=>"<th>"+esc(h)+"</th>").join("")+
          '</tr></thead><tbody>'+body.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      } else { if(lines[i].trim()) out.push("<div>"+esc(lines[i])+"</div>"); i++; }
    }
    return out.join("");
  }

  // ---- detail pane ----
  function block(title, tag, inner, open, cls){
    return '<details class="block'+(cls?" "+cls:"")+'"'+(open?" open":"")+'><summary>'+esc(title)+
      (tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</summary><div class="body">'+inner+'</div></details>';
  }
  function chips(arr, klass){ return arr&&arr.length ? '<div class="chips">'+arr.map(x=>'<span class="chip '+(klass||"")+'">'+esc(x)+'</span>').join("")+'</div>' : ""; }

  function renderDetail(n){
    const d = document.getElementById("detail");
    let h = '<div class="dhead"><span class="badge '+cls(n.type)+'">'+esc(n.type)+'</span>'+
      '<span class="did">'+esc(n.id)+'</span>'+
      (n.support_level?'<span class="pill '+esc(n.support_level)+'">'+esc(n.support_level)+'</span>':'')+
      (n.isolated?'<span class="pill iso">isolated</span>':'')+'</div>';
    h += '<div class="dtitle">'+esc(n.title||"(untitled)")+'</div>';

    // reasoning (primary, always open) — the agent's thinking IS the content of a step
    let reason="";
    if(n.thinking){
      reason += '<div class="lead">'+esc(n.thinking)+'</div>';
      if(n.body) reason += '<div class="didwhat">what it did</div><div>'+esc(n.body)+'</div>';
    } else {
      reason += n.body ? '<div class="lead">'+esc(n.body)+'</div>' : '<div class="empty">No description.</div>';
    }
    if(n.depends_on&&n.depends_on.length) reason += chips(n.depends_on.map(x=>"⇠ depends on "+x));
    if(n.source_refs&&n.source_refs.length) reason += chips(n.source_refs, "ext");
    if(n.built_on&&n.built_on.length) reason += chipRow("built on", n.built_on, "chip-built");
    if(n.rejected_here&&n.rejected_here.length) reason += chipRow("rejected here", n.rejected_here, "chip-rej");
    if(n.recipe_refs&&n.recipe_refs.length) reason += recipeChips(n.recipe_refs);
    h += block(n.thinking?"reasoning":"what", n.type, reason, true, "reason");

    // result (the grounded payload) — open
    const r = n.result||{};
    if((r.sources&&r.sources.length)||(r.figures&&r.figures.length)||(r.tables&&r.tables.length)||(r.data&&r.data.length)){
      let s="";
      (r.figures||[]).forEach(f=>{ s+='<figure><img src="'+esc(f.img)+'" alt="'+esc(f.caption||f.id)+'"/>'+
        (f.caption?'<figcaption>'+esc(f.caption)+'</figcaption>':'')+'</figure>'; });
      (r.tables||[]).forEach(t=>{ s+=(t.caption?'<div class="empty">'+esc(t.caption)+'</div>':'')+renderMd(t.markdown); });
      (r.sources||[]).forEach(q=>{ s+='<div class="quote">'+esc(q.quote)+(q.ref?'<div class="ref">← '+esc(q.ref)+'</div>':'')+'</div>'; });
      (r.data||[]).forEach(x=>{ s+='<div class="ptr">⛁ <span class="path">'+esc(x.path)+'</span>'+(x.note?' — '+esc(x.note):'')+'</div>'; });
      h += block("result", "", s, true);
    }

    // why (claims) — supporting detail, collapsed
    if(n.why&&n.why.length){
      const w = n.why.map(c=>{
        let s='<div class="claim"><h4>'+esc(c.id)+(c.title?' — '+esc(c.title):'')+'</h4>';
        if(c.statement) s+='<div class="kv">'+esc(c.statement)+'</div>';
        if(c.status) s+='<div class="kv"><b>status</b> <span class="status '+esc(String(c.status).toLowerCase())+'">'+esc(c.status)+'</span></div>';
        if(c.conditions) s+='<div class="kv"><b>conditions</b> '+esc(c.conditions)+'</div>';
        if(c.falsification) s+='<div class="kv"><b>falsified if</b> '+esc(c.falsification)+'</div>';
        if(c.dependencies&&c.dependencies.length) s+='<div class="kv"><b>depends on</b> '+esc(c.dependencies.join(", "))+'</div>';
        if(c.provenance) s+='<div class="kv"><span class="prov">provenance: '+esc(c.provenance)+'</span></div>';
        return s+'</div>';
      }).join("");
      h += block("why", n.why.map(c=>c.id).join(" · "), w);
    }

    // how verified (experiments) — supporting detail, collapsed
    if(n.verified_by&&n.verified_by.length){
      const v = n.verified_by.map(e=>'<div class="claim"><h4>'+esc(e.id)+(e.title?' — '+esc(e.title):'')+'</h4>'+
        (e.run?'<div class="kv"><b>run</b> <span class="path mono">'+esc(e.run)+'</span></div>':'')+
        (e.setup?'<div class="kv"><b>setup</b> '+esc(e.setup)+'</div>':'')+
        (e.metrics?'<div class="kv"><b>metrics</b> '+esc(e.metrics)+'</div>':'')+'</div>').join("");
      h += block("how verified", n.verified_by.map(e=>e.id).join(" · "), v);
    }

    // artifact pointers (src/artifacts.md) — collapsed
    if(n.artifact&&n.artifact.length){
      const a = n.artifact.map(x=>'<div class="ptr">▸ <b>'+esc(x.name)+'</b> — <span class="path">'+esc(x.pointer)+'</span>'+
        (x.what?'<div class="empty">'+esc(x.what)+'</div>':'')+'</div>').join("");
      h += block("artifact", "pointer", a);
    }

    d.innerHTML = h;
    if(typeof LEX!=="undefined" && LEX) linkifyConcepts(d);
    d.scrollTop = 0;
  }

  // ---- map ----
  let selected = null;
  function selectNode(id){
    if(!byId.has(id)) return;
    selected = id;
    document.querySelectorAll(".node").forEach(el=>el.classList.toggle("sel", el.dataset.id===id));
    const el = document.querySelector('.node[data-id="'+CSS.escape(id)+'"]');
    if(el) el.scrollIntoView({block:"nearest"});
    renderDetail(byId.get(id));
    rstat();
  }

  function nodeRow(n){
    const row = document.createElement("div");
    row.className = "node "+(n.type==="dead_end"?"dead":"");
    row.dataset.id = n.id; row.dataset.type = n.type;
    // calmer than before: one glyph + id + (quiet) cross-edge marker; the ⊕/⊘ count soup is gone.
    row.innerHTML = '<span class="glyph '+cls(n.type)+'">'+glyph(n.type)+'</span>'+
      '<span><span class="meta"><span class="nid">'+esc(n.id)+'</span>'+
      (n.depends_on&&n.depends_on.length?'<span class="dep" title="depends on '+esc(n.depends_on.join(", "))+'">⇠ '+esc(n.depends_on.join(","))+'</span>':'')+
      '</span><div class="ntitle">'+esc(n.title||n.body||"(untitled)")+'</div></span>';
    row.addEventListener("click", ()=>selectNode(n.id));
    // hover a node to highlight its cross-edge targets (gentler than always-on connectors)
    if(n.depends_on&&n.depends_on.length){
      row.addEventListener("mouseenter", ()=>n.depends_on.forEach(t=>{ const el=document.querySelector('.node[data-id="'+CSS.escape(t)+'"]'); if(el) el.classList.add("deptarget"); }));
      row.addEventListener("mouseleave", ()=>document.querySelectorAll(".node.deptarget").forEach(el=>el.classList.remove("deptarget")));
    }
    return row;
  }
  function renderSubtree(id, container){
    const n = byId.get(id); if(!n) return;
    container.appendChild(nodeRow(n));
    const cs = kids.get(id)||[];
    if(cs.length){ const wrap=document.createElement("div"); wrap.className="kid"; cs.forEach(c=>renderSubtree(c,wrap)); container.appendChild(wrap); }
  }
  function renderMap(){
    const map = document.getElementById("map"); map.innerHTML="";
    const normalRoots = roots.filter(id=>!byId.get(id).isolated);
    const isoRoots = roots.filter(id=>byId.get(id).isolated);
    normalRoots.forEach(id=>renderSubtree(id, map));
    if(isoRoots.length){
      const box=document.createElement("div"); box.className="isobox";
      const hdr=document.createElement("div"); hdr.className="isohdr"; hdr.textContent="isolated subtree"; box.appendChild(hdr);
      isoRoots.forEach(id=>renderSubtree(id, box)); map.appendChild(box);
    }
  }

  // ---- filter / search ----
  function applyFilters(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ty = document.getElementById("ftype").value;
    const deadOnly = document.getElementById("fdead").checked;
    let shown=0;
    document.querySelectorAll(".node").forEach(el=>{
      const n = byId.get(el.dataset.id);
      const text = (n.id+" "+(n.title||"")+" "+(n.body||"")).toLowerCase();
      const ok = (!q||text.includes(q)) && (!ty||n.type===ty) && (!deadOnly||n.type==="dead_end");
      el.classList.toggle("dim", !ok);
      if(ok) shown++;
    });
    document.getElementById("rstat").textContent = shown+" / "+nodes.length+" steps";
  }
  function rstat(){
    const i = selected?order.indexOf(selected):-1;
    document.getElementById("rstat").textContent = (i>=0?("step "+(i+1)+" / "+order.length):(nodes.length+" steps"));
  }

  // ---- replay ----
  let timer=null;
  function step(delta){
    let i = selected?order.indexOf(selected):-1;
    i = Math.max(0, Math.min(order.length-1, i+delta));
    selectNode(order[i]);
  }
  function play(){
    if(timer){ stop(); return; }
    if(!selected) selectNode(order[0]);
    document.getElementById("rplay").textContent="⏸ Pause";
    timer = setInterval(()=>{
      const i = selected?order.indexOf(selected):-1;
      if(i>=order.length-1){ stop(); return; }
      step(1);
    }, 1300);
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById("rplay").textContent="▶ Replay"; }

  // ======================= v1.1 enrichment layers (all inert unless present) =======================
  const CTX = DATA.context, GLO = DATA.glossary, DEP = DATA.dependencies, REC = DATA.recipes;
  const LAYERS = { context:CTX, glossary:GLO, dependencies:DEP, recipes:REC };

  // ---- indexes (built once) ----
  const claimToNodes = new Map();
  nodes.forEach(n => (n.why||[]).forEach(c => { if(c&&c.id){ if(!claimToNodes.has(c.id)) claimToNodes.set(c.id,[]); claimToNodes.get(c.id).push(n.id); } }));
  const firstNodeForClaim = id => (claimToNodes.get(id)||[])[0] || null;
  const rwById   = new Map(((DEP&&DEP.entries)||[]).map(e => [e.rw_id, e]));
  const termById = new Map(((GLO&&GLO.terms)||[]).map(t => [t.term_id, t]));
  // concept "used by" (inferred) from each node's name-matched concepts[]
  if(GLO){
    const nameToTerm = new Map();
    (GLO.terms||[]).forEach(t => { if(t.name) nameToTerm.set(String(t.name).toLowerCase(), t); (t.aliases||[]).forEach(a=>nameToTerm.set(String(a).toLowerCase(), t)); });
    nodes.forEach(n => (n.concepts||[]).forEach(cn => { const t=nameToTerm.get(String(cn).toLowerCase()); if(t){ (t._used=t._used||[]).push(n.id); } }));
  }

  // ---- tiny inline-math fallback (no CDN; operates on already-escaped text, adds only safe tags) ----
  const GK={alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",eta:"η",theta:"θ",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",phi:"φ",chi:"χ",psi:"ψ",omega:"ω",Delta:"Δ",Sigma:"Σ",Omega:"Ω",Phi:"Φ",Theta:"Θ",Lambda:"Λ",Gamma:"Γ",nabla:"∇",partial:"∂",times:"×",cdot:"·",infty:"∞",approx:"≈",leq:"≤",geq:"≥",neq:"≠",to:"→",in:"∈",sum:"Σ",prod:"Π",sqrt:"√",mathbb:"",mathcal:"",mathbf:"",mathrm:"",left:"",right:""};
  function texInner(s){
    s=s.replace(/\\(?:mathbb|mathcal|mathbf|mathrm)\{([^{}]*)\}/g,"$1");
    s=s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)");
    s=s.replace(/\\([A-Za-z]+)/g,(m,w)=>GK[w]!==undefined?GK[w]:m);
    s=s.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^([\w()+\-])/g,"<sup>$1</sup>");
    s=s.replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>").replace(/_([\w()+\-])/g,"<sub>$1</sub>");
    return s;
  }
  function mathPass(escaped){
    if(escaped.indexOf("$")<0) return escaped;
    return escaped.replace(/\$\$([^$]+)\$\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>')
                  .replace(/\$([^$]+)\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>');
  }
  function mtext(v){ const e=esc(v); try{ return mathPass(e); }catch(_){ return e; } }

  // ---- typed-ref rendering (off-ARA pointers stay inert; in-ARA targets become jump chips) ----
  function refUrl(rf){
    const raw=rf.raw||"";
    if(rf.kind==="url"){ const m=raw.match(/https?:\/\/\S+/); return m?m[0]:""; }
    if(rf.kind==="arxiv"){ const m=raw.match(/(\d{4}\.\d{4,5})/); return m?("https://arxiv.org/abs/"+m[1]):""; }
    if(rf.kind==="doi"){ const m=raw.match(/(10\.\d{4,}\/\S+)/); return m?("https://doi.org/"+m[1]):""; }
    return "";
  }
  function refChip(rf){
    const raw=esc(rf.raw||""), url=refUrl(rf);
    if(url) return '<a class="chip ext" href="'+esc(url)+'" target="_blank" rel="noopener">'+raw+'</a>';
    if(rf.target){
      if(rf.kind==="claim")        return '<span class="chip jump" data-jump-claim="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="node")         return '<span class="chip jump" data-jump-node="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="concept")      return '<span class="chip jump" data-open-term="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="related_work") return '<span class="chip jump" data-open-panel="dependencies" data-anchor="ov-'+esc(rf.target)+'">'+raw+'</span>';
      return '<span class="chip jump" data-scroll="ov-'+esc(rf.target)+'">'+raw+'</span>';
    }
    const dangle=(rf.kind==="claim"||rf.kind==="related_work"||rf.kind==="concept");
    return '<span class="chip '+(dangle?'dangle" title="referenced but not found in this ARA':'ext')+'">'+raw+'</span>';
  }
  function refRow(refs){ return refs&&refs.length ? '<div class="chips">'+refs.map(refChip).join("")+'</div>' : ""; }

  // ---- per-node provenance chips (consumed by renderDetail) ----
  function chipRow(label, arr, klass){
    const cs=arr.map(x=>{
      const txt=[x.rw_id,x.name].filter(Boolean).join(" · ")||"?";
      const tip=x.relation_raw?(' title="'+esc(x.relation_raw)+'"'):'';
      const op =x.rw_id?(' data-open-panel="dependencies" data-anchor="ov-'+esc(x.rw_id)+'"'):'';
      return '<span class="chip '+klass+(x.rw_id?' jump':'')+'"'+tip+op+'>'+esc(txt)+'</span>';
    }).join("");
    return '<div class="chiplabel">'+esc(label)+'</div><div class="chips">'+cs+'</div>';
  }
  function recipeChips(arr){
    const cs=arr.map(x=>{
      const anchor="ov-sec-"+(x.file||"")+"-"+(x.sec_id||"");
      return '<span class="chip chip-recipe jump" data-open-panel="recipes" data-anchor="'+esc(anchor)+'" title="'+esc((x.file||"")+(x.role?(" · "+x.role):""))+'">▦ '+esc(x.heading||x.file||"recipe")+'</span>';
    }).join("");
    return '<div class="chiplabel">recipe</div><div class="chips">'+cs+'</div>';
  }

  // ---- the four overlay renderers (reuse block/chips/renderMd) ----
  function renderContext(){
    let h=""; if(CTX.summary) h+='<div class="ribbon">'+esc(CTX.summary)+'</div>';
    (CTX.sections||[]).forEach(sec=>{
      let inner="";
      if(sec.present===false){ inner='<div class="muted grey">(not specified in this ARA)</div>'; }
      else (sec.entries||[]).forEach(en=>{
        let c='<div class="card" id="ov-'+esc(en.ent_id||"")+'"><h4>'+(en.ent_id?'<span class="did">'+esc(en.ent_id)+'</span> ':'')+esc(en.ent_title||"")+(en.inferred_id?' <span class="sub">(pos.)</span>':'')+'</h4>';
        if(!en.unstructured && en.fields && en.fields.length) en.fields.forEach(f=>c+='<div class="kv"><b>'+esc(f.label)+'</b> '+mtext(f.value)+'</div>');
        else if(en.text) c+='<div class="kv">'+mtext(en.text)+'</div>';
        if(en.unstructured) c+='<div class="sub">unstructured</div>';
        c+=refRow(en.refs)+'</div>'; inner+=c;
      });
      h+=block(sec.heading||sec.role||"section", sec.role||"", inner, sec.role==="insight");
    });
    return h || '<div class="muted">No problem context.</div>';
  }
  function renderGlossary(filter){
    const f=(filter||"").trim().toLowerCase();
    const match=t=>!f||((t.name||"")+" "+(t.aliases||[]).join(" ")+" "+(t.definition||"")).toLowerCase().includes(f);
    function card(t){
      let c='<div class="card" id="ov-'+esc(t.term_id)+'"><h4>'+esc(t.name)+(t.group?' <span class="sub">'+esc(t.group)+'</span>':'')+'</h4>';
      if(t.aliases&&t.aliases.length) c+='<div class="chips">'+t.aliases.map(a=>'<span class="chip">'+esc(a)+'</span>').join("")+'</div>';
      if(t.definition) c+='<div class="kv">'+mtext(t.definition)+'</div>';
      (t.fields||[]).forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
      if(t.related&&t.related.length) c+='<div class="kv"><b>related</b> '+t.related.map(r=>{const rt=termById.get(r);return '<span class="chip jump" data-open-term="'+esc(r)+'">'+esc(rt?rt.name:r)+'</span>';}).join(" ")+'</div>';
      if(t._used&&t._used.length) c+='<div class="kv"><b>mentions</b> '+[...new Set(t._used)].map(nid=>'<span class="chip jump" data-jump-node="'+esc(nid)+'">'+esc(nid)+'</span>').join(" ")+' <span class="sub">(inferred)</span></div>';
      return c+refRow(t.refs)+'</div>';
    }
    const groups=GLO.groups&&GLO.groups.length?GLO.groups:null; let h="";
    if(groups){
      const grouped=new Set();
      groups.forEach(g=>{ (g.term_ids||[]).forEach(id=>grouped.add(id)); const ts=(g.term_ids||[]).map(id=>termById.get(id)).filter(Boolean).filter(match); if(ts.length) h+=block(g.name||"group", String(ts.length), ts.map(card).join(""), true); });
      const rest=(GLO.terms||[]).filter(t=>!grouped.has(t.term_id)).filter(match);
      if(rest.length) h+=block("other", String(rest.length), rest.map(card).join(""), true);
    } else { const ts=(GLO.terms||[]).filter(match); h=ts.map(card).join(""); }
    return h || '<div class="muted">No matching terms.</div>';
  }
  function renderDeps(filter){
    const f=(filter||"").trim().toLowerCase(); let h="";
    if(DEP.preamble) h+='<div class="muted">'+esc(DEP.preamble)+'</div>';
    if(DEP.attribution) h+='<div class="ribbon">'+esc(DEP.attribution)+'</div>';
    const ents=(DEP.entries||[]).filter(e=>!e.is_footprint).filter(e=>!f||(((e.rw_id||"")+" "+(e.name||"")+" "+(e.relation_raw||"")+" "+(e.delta||"")).toLowerCase().includes(f)));
    ents.forEach(e=>{
      const rn=e.relation_norm, relc=["baseline","imports","extends","bounds","refutes"].includes(rn)?rn:"neutral";
      let c='<div class="card" id="ov-'+esc(e.rw_id||"")+'"><h4>'+(e.rw_id?'<span class="did">'+esc(e.rw_id)+'</span> ':'')+esc(e.name||"")+'</h4>';
      c+='<div class="chips"><span class="rel '+relc+'">'+esc(e.relation_raw||rn||"related")+'</span>'+(e.cross_agent?'<span class="chip" title="other-agent provenance">↔ other-agent</span>':'')+'</div>';
      if(e.delta) c+='<div class="kv">'+mtext(e.delta)+'</div>';
      if(e.adopted) c+='<div class="kv"><b>adopted</b> '+esc(e.adopted)+'</div>';
      let prov=(e.grounding||[]).map(refChip).join("");
      (e.claims||[]).filter(id=>claimToNodes.has(id)).forEach(id=>prov+='<span class="chip jump" data-jump-claim="'+esc(id)+'">'+esc(id)+'</span>');
      c+= prov?('<div class="kv"><b>grounding</b> '+prov+'</div>'):'<div class="muted">ungrounded</div>';
      h+=c+'</div>';
    });
    if(!ents.length) h+='<div class="muted">No matching dependencies.</div>';
    const fp=DEP.footprint||[];
    if(fp.length) h+=block("Citation footprint", String(fp.length), fp.map(x=>'<div class="ptr"><span class="muted">'+esc(x.ref_id||"")+'</span> '+esc(x.citation||"")+'</div>').join(""), false);
    return h;
  }
  function renderRecipes(){
    let h="";
    (REC.files||[]).forEach(file=>{
      let inner="";
      (file.sections||[]).forEach(sec=>{
        let c='<div class="card" id="ov-sec-'+esc((file.file||"")+"-"+(sec.sec_id||""))+'"><h4>'+(sec.sec_id?'<span class="did">'+esc(sec.sec_id)+'</span> ':'')+esc(sec.heading||"")+'</h4>';
        if(sec.kind==="table"&&sec.markdown) c+=renderMd(sec.markdown);
        else if(sec.kind==="steps"&&sec.steps&&sec.steps.length) c+='<ol>'+sec.steps.map(s=>'<li>'+mtext(String(s).replace(/^\s*\d+\.\s*/,""))+'</li>').join("")+'</ol>';
        else if(sec.kind==="kv"&&sec.fields&&sec.fields.length) sec.fields.forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
        else if(sec.kind==="code"&&sec.code) c+='<pre class="snip">'+esc(sec.code)+'</pre>';
        else if(sec.kind==="math"&&sec.code) c+='<div class="kv math">'+mtext(sec.code)+'</div>';
        else if(sec.text) c+='<div class="kv">'+mtext(sec.text)+'</div>';
        if(sec.warn) c+='<div class="warn">'+esc(sec.warn)+'</div>';
        inner+=c+refRow(sec.refs)+'</div>';
      });
      h+=block((file.file_title||file.file||"recipe")+(file.role?("  ·  "+file.role):""), String((file.sections||[]).length), inner, true);
    });
    return h || '<div class="muted">No recipe content.</div>';
  }

  // ---- overlay open/close + layerbar wiring ----
  const ov=document.getElementById("overlay");
  let lastTrigger=null;
  const PANEL_RENDER={ context:renderContext, glossary:()=>renderGlossary(""), dependencies:()=>renderDeps(""), recipes:renderRecipes };
  function hasContent(name){ const L=LAYERS[name]; if(!L) return false;
    if(name==="context") return (L.sections||[]).length>0;
    if(name==="glossary") return (L.terms||[]).length>0;
    if(name==="dependencies") return (L.entries||[]).length>0||(L.footprint||[]).length>0;
    if(name==="recipes") return (L.files||[]).length>0; return false; }
  function panelTitle(name){ const L=LAYERS[name]||{}; return L.title || ({context:"Context",glossary:"Concepts",dependencies:"Dependencies",recipes:"Solution"}[name]); }
  function panelCount(name){ const L=LAYERS[name]||{};
    if(name==="glossary") return (L.terms||[]).length;
    if(name==="dependencies") return (L.entries||[]).length;
    if(name==="recipes") return (L.files||[]).reduce((a,f)=>a+(f.sections||[]).length,0); return 0; }
  function openPanel(name, anchor){
    if(!hasContent(name)) return;
    stop(); lastTrigger=document.activeElement;
    document.getElementById("ov-title").textContent=panelTitle(name);
    const body=document.getElementById("ov-body"); body.innerHTML=PANEL_RENDER[name]();
    if(LEX) linkifyConcepts(body);
    const q=document.getElementById("ov-q");
    if(name==="glossary"||name==="dependencies"){ q.hidden=false; q.value=""; q.dataset.panel=name; } else { q.hidden=true; }
    ov.hidden=false;
    if(anchor){ const el=document.getElementById(anchor); if(el) el.scrollIntoView({block:"center"}); } else body.scrollTop=0;
    (q.hidden?document.getElementById("ov-close"):q).focus();
  }
  function closePanel(){ ov.hidden=true; if(lastTrigger&&lastTrigger.focus) lastTrigger.focus(); }
  document.querySelectorAll(".lbtn").forEach(b=>{ const name=b.dataset.panel;
    if(hasContent(name)){ b.hidden=false; const c=b.querySelector(".cnt"); if(c){ const n=panelCount(name); if(n) c.textContent=n; } b.addEventListener("click",()=>openPanel(name)); } });
  document.getElementById("ov-q").addEventListener("input", e=>{ const p=e.target.dataset.panel, body=document.getElementById("ov-body");
    body.innerHTML = p==="glossary"?renderGlossary(e.target.value):renderDeps(e.target.value); if(LEX) linkifyConcepts(body); });

  // ---- glossary lexicon + popover ----
  const LEX=(GLO&&GLO.lexicon&&Object.keys(GLO.lexicon).length)?(function(){
    const surf=Object.keys(GLO.lexicon).filter(s=>s.length>=3).sort((a,b)=>b.length-a.length);
    if(!surf.length) return null;
    const re=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return { re:new RegExp("\\b("+surf.map(re).join("|")+")\\b","i"), map:GLO.lexicon };
  })():null;
  const SKIP_TAGS={A:1,CODE:1,PRE:1,BUTTON:1,SCRIPT:1,STYLE:1,H4:1,H5:1,SUMMARY:1};
  function linkifyConcepts(root){
    if(!LEX) return;
    const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(t){
      if(!t.nodeValue||!t.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p=t.parentNode; while(p&&p!==root){ if(p.classList&&p.classList.contains("gterm")) return NodeFilter.FILTER_REJECT; if(SKIP_TAGS[p.tagName]) return NodeFilter.FILTER_REJECT; p=p.parentNode; }
      return NodeFilter.FILTER_ACCEPT; } });
    const seen=new Set(), hits=[]; let t;
    while((t=walker.nextNode())){ const m=LEX.re.exec(t.nodeValue); if(!m) continue; const tid=LEX.map[m[1].toLowerCase()]; if(!tid||seen.has(tid)) continue; seen.add(tid); hits.push({node:t,index:m.index,len:m[1].length,tid}); }
    hits.forEach(hp=>{ const tn=hp.node, txt=tn.nodeValue, par=tn.parentNode; if(!par) return;
      const span=document.createElement("span"); span.className="gterm"; span.dataset.term=hp.tid; span.tabIndex=0; span.textContent=txt.slice(hp.index,hp.index+hp.len);
      const after=document.createTextNode(txt.slice(hp.index+hp.len));
      par.replaceChild(after,tn); par.insertBefore(span,after); par.insertBefore(document.createTextNode(txt.slice(0,hp.index)),span); });
  }
  const gpop=document.getElementById("gpop");
  function gpopShow(span){ const t=termById.get(span.dataset.term); if(!t) return;
    const def=t.definition||""; gpop.innerHTML='<h5>'+esc(t.name)+'</h5><div>'+mtext(def.slice(0,240))+(def.length>240?'…':'')+'</div><span class="gp-open" data-open-term="'+esc(t.term_id)+'">open in glossary →</span>';
    gpop.style.display="block"; const r=span.getBoundingClientRect();
    gpop.style.left=Math.max(6,Math.min(r.left, window.innerWidth-372))+"px"; gpop.style.top=(r.bottom+6)+"px"; }
  function gpopHide(){ gpop.style.display="none"; }

  // ---- delegated interactions for the new layers ----
  document.addEventListener("click", e=>{
    const el=e.target.closest&&e.target.closest("[data-close],[data-jump-node],[data-jump-claim],[data-open-panel],[data-open-term],[data-scroll]");
    if(!el) return;
    if(el.hasAttribute("data-close")){ closePanel(); return; }
    if(el.dataset.jumpNode){ closePanel(); selectNode(el.dataset.jumpNode); return; }
    if(el.dataset.jumpClaim){ const nid=firstNodeForClaim(el.dataset.jumpClaim); if(nid){ closePanel(); selectNode(nid); } return; }
    if(el.dataset.openTerm){ openPanel("glossary","ov-"+el.dataset.openTerm); return; }
    if(el.hasAttribute("data-open-panel")){ openPanel(el.dataset.openPanel, el.dataset.anchor||null); return; }
    if(el.dataset.scroll){ const t=document.getElementById(el.dataset.scroll); if(t) t.scrollIntoView({block:"center"}); return; }
  });
  document.addEventListener("mouseover", e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("mouseout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  document.addEventListener("focusin",   e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("focusout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  window.addEventListener("scroll", gpopHide, true);

  document.getElementById("q").addEventListener("input", applyFilters);
  document.getElementById("ftype").addEventListener("change", applyFilters);
  document.getElementById("fdead").addEventListener("change", applyFilters);
  document.getElementById("rplay").addEventListener("click", play);
  document.getElementById("rprev").addEventListener("click", ()=>{stop();step(-1);});
  document.getElementById("rnext").addEventListener("click", ()=>{stop();step(1);});
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ if(!ov.hidden){ closePanel(); return; } gpopHide(); }
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
    if(e.key==="ArrowLeft"){stop();step(-1);} else if(e.key==="ArrowRight"){stop();step(1);}
    else if(e.key==="c"||e.key==="g"||e.key==="d"||e.key==="r"){ const p={c:"context",g:"glossary",d:"dependencies",r:"recipes"}[e.key]; if(hasContent(p)) openPanel(p); }
  });

  renderMap();
  rstat();
})();
</script>
</body>
</html>
