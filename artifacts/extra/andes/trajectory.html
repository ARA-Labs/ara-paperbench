<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARA Trajectory</title>
<!--
  ARA Trajectory Viewer — canonical self-contained scaffold for the `research-visualizer` skill.

  HOW THE SKILL USES THIS FILE
  ----------------------------
  The rendering logic below is FIXED. The agent does NOT rewrite it. The agent only:
    1. Parses the ARA into one ARA_DATA object (schema in references/binding.md).
    2. base64-inlines every referenced figure .png into node.result.figures[].img.
    3. Replaces ONLY the JSON between the BEGIN/END markers in the <script id="ara-data"> block.
    4. Writes the result to <ara>/trajectory.html (or --output).
  Everything is inline (no CDN, no fetch, no server) so the output is one portable file.

  INJECTION CONTRACT
  ------------------
  - Replace exactly the lines between  __ARA_DATA_BEGIN__  and  __ARA_DATA_END__.
  - The payload MUST be valid JSON (it is read with JSON.parse).
  - JSON must not contain the literal substring "</script>"; escape any "<" in inlined
    markdown/text as "<" to be safe.
  - The demo payload shipped here renders a 3-node sample so the bare template opens and
    shows every node state (experiment, dead_end, isolated). The skill overwrites it.
-->
<style>
  /* Research Visualizer — "field notebook of a machine scientist".
     Cool archival vellum + ink; monospace is the machine-readout voice for
     structure / IDs / data, a humanist serif carries the reasoning prose. The
     signature is a traced trajectory spine that forks at branches and is struck
     through at dead ends. Type is read from glyph + label; colour is reserved
     for true epistemic status (teal = chrome, green = supported, amber =
     tentative, clay-red = dead end) — never decoration. */
  :root{
    /* paper & ink — deliberately cool vellum, NOT warm cream */
    --bg:#e9ece4; --panel:#f4f6f0; --panel2:#e3e7dd; --line:#ccd3c7; --ink:#1b2420;
    --muted:#67726a; --faint:#8a948b; --accent:#0e6b62; --accent-ink:#0a4f48; --chip:#e6eae0;
    --ok:#3a6a39; --warn:#a6402c; --tentative:#8a6310; --glyph-bg:#e0e5da; --glyph-ink:#4a544c;
    --sel-bg:#e3ede7; --code-bg:#eaeee6; --reason-bg:#f4f6f0;
    --iso-line:#b7c0ae; --iso-bg:#e5eadf; --iso-ink:#5f6b58;
    --scrim:rgba(20,28,24,.42); --shadow:rgba(20,28,24,.16);
    --add-bg:#e0ebdb; --add-ink:#2f5a2e; --del-bg:#f1e0da; --del-ink:#8c3623; --hunk:#67726a;
    --spine:#c3ccbd; --grid:rgba(27,36,32,.05);
    /* legacy type vars retained so any leftover hooks resolve */
    --q:var(--glyph-bg); --exp:var(--glyph-bg); --dec:var(--glyph-bg); --piv:var(--glyph-bg); --ins:var(--glyph-bg); --def:var(--glyph-bg); --dead:var(--warn);
    /* type roles: a serif reads the prose, monospace reads the machine */
    --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  code,pre,.mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* ---- masthead ---- */
  header{padding:20px 24px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .title{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.012em}
  header .sub{font-family:var(--mono);color:var(--muted);font-size:11.5px;margin-top:5px;letter-spacing:.01em}
  header details{margin-top:10px;color:var(--ink)}
  header summary{cursor:pointer;color:var(--accent-ink);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .toolbar input[type=search],.toolbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--sans)}
  .toolbar input[type=search]{min-width:230px}
  .toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--accent);outline:none}
  .toolbar label{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:var(--mono);cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .spacer{flex:1}
  .count{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-left:10px;border-left:1px solid var(--line)}

  main{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:calc(100% - 0px);min-height:0}
  #map{overflow:auto;border-right:1px solid var(--line);padding:18px 12px 56px;background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;background-position:-1px -1px}
  #detail{overflow:auto;padding:26px 32px 80px;background:var(--bg)}

  /* ---- process map: the trajectory spine is the signature ---- */
  .node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--sel-bg);border-color:var(--accent)}
  .node.deptarget{background:var(--sel-bg);outline:1px dashed var(--accent);outline-offset:-1px}
  .node.dim{opacity:.32}
  .node .glyph{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);margin-top:1px}
  .node.sel .glyph{border-color:var(--accent);color:var(--accent-ink)}
  .node .nid{color:var(--muted);font-size:10.5px;font-family:var(--mono);letter-spacing:.02em}
  .node .ntitle{font-size:13px;line-height:1.45}
  .node.dead .ntitle{color:var(--warn);text-decoration:line-through;text-decoration-color:rgba(166,64,44,.45)}
  .node .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  /* the spine + branch connectors: nested steps trace back to their parent */
  .kid{margin-left:19px;border-left:2px solid var(--spine);padding-left:14px}
  .kid>.node::before{content:"";position:absolute;left:-14px;top:14px;width:10px;height:2px;background:var(--spine)}
  .kid>.node.sel::before{background:var(--accent)}
  .isobox{border:1px dashed var(--iso-line);border-radius:8px;margin:12px 2px;padding:6px 4px;background:var(--iso-bg)}
  .isobox .isohdr{color:var(--iso-ink);font-family:var(--mono);font-size:10px;padding:3px 8px 7px;text-transform:uppercase;letter-spacing:.1em}
  .dep{color:var(--muted);font-size:10px;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .glyph.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}

  /* ---- detail pane ---- */
  .dhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;padding:3px 9px;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
  .badge.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}
  .pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pill.explicit{border-color:var(--ok);color:var(--ok)} .pill.inferred{border-color:var(--tentative);color:var(--tentative)}
  .pill.iso{border-color:var(--iso-line);color:var(--iso-ink)}
  .dtitle{font-family:var(--serif);font-size:25px;font-weight:600;margin:12px 0 6px;letter-spacing:-.012em;line-height:1.28}
  .did{color:var(--muted);font-family:var(--mono);font-size:11.5px}

  .block{border:1px solid var(--line);border-radius:7px;margin:15px 0;background:var(--panel)}
  .block>summary{cursor:pointer;padding:11px 15px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .block>summary::-webkit-details-marker{display:none}
  .block>summary:hover{color:var(--accent-ink)}
  .block>summary .tag{margin-left:auto;color:var(--faint);font-size:10.5px;font-weight:400;font-family:var(--mono);text-transform:none;letter-spacing:0}
  .block .body{padding:4px 16px 16px}
  /* the primary reasoning block: the agent's thinking, set as typeset prose */
  .block.reason{border-left:3px solid var(--accent);background:var(--reason-bg)}
  .block.reason>summary{color:var(--accent-ink)}
  .block.reason .lead{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink)}
  .didwhat{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;margin:16px 0 4px}
  .lead{font-family:var(--serif);color:#2a322c;font-size:16px;line-height:1.7}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;color:#46504a;font-family:var(--mono)}
  .chip.ext{color:var(--muted)}

  .claim{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .claim h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .claim .kv{font-size:13px;line-height:1.6;margin:4px 0;color:#3a423c}
  .claim .kv b{color:var(--muted);font-weight:600;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .status{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 7px;border:1px solid var(--line)}
  .status.supported{color:var(--ok);border-color:var(--ok)}
  .status.refuted{color:var(--warn);border-color:var(--warn)}
  .status.hypothesis{color:var(--tentative);border-color:var(--tentative)}
  .prov{font-size:11px;color:var(--iso-ink);font-family:var(--mono)}

  .quote{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13.5px;line-height:1.6;color:#2a322c}
  .quote .ref{color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:5px}
  figure{margin:14px 0}
  figure img{max-width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:6px}
  figcaption{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:7px}

  table.md{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;margin:10px 0}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  table.md th{background:var(--panel2);color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
  pre.snip{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;font-size:12px;color:var(--ink);white-space:pre-wrap}

  .ptr{font-size:13px;margin:7px 0}
  .ptr .path{font-family:var(--mono);color:#46504a}
  .truncated{color:var(--muted);font-size:11.5px;font-style:italic}
  .empty{color:var(--muted);font-size:13px}
  .none{color:var(--muted);padding:40px 24px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px}

  /* ---- enrichment layers (all inert unless the data is present) ---- */
  .layerbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lbtn .cnt{color:var(--muted);font-size:10.5px}
  .chiplabel{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 3px}
  .chip.jump{cursor:pointer}
  .chip.jump:hover{border-color:var(--accent);color:var(--accent-ink)}
  .chip.dangle{color:#9aa49b;text-decoration:line-through;cursor:not-allowed}
  .chip.infer{border-style:dashed}
  .chip-built{border-color:var(--ok);color:var(--ok)}
  .chip-rej{border-color:var(--warn);color:var(--warn)}
  .chip-recipe{border-color:var(--accent);color:var(--accent-ink)}
  .nmark{color:var(--muted);font-size:10px;margin-left:5px;font-family:var(--mono)}
  .rel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 8px;color:var(--glyph-ink);background:var(--glyph-bg);font-weight:700}
  .rel.bounds,.rel.refutes{background:var(--warn);color:#fff}
  .rel.neutral{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .ribbon{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;color:#3a423c;font-size:13px;line-height:1.6}
  .warn{border-left:3px solid var(--warn);background:var(--del-bg);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13px;line-height:1.6}
  .muted{color:var(--muted);font-size:11.5px}
  .math{font-family:var(--serif);font-style:italic}
  .gterm{border-bottom:1px dashed var(--accent);cursor:help}
  #gpop{position:fixed;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;z-index:60;box-shadow:0 8px 28px var(--shadow);font-size:13px;line-height:1.55;display:none}
  #gpop h5{margin:0 0 5px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  #gpop .gp-open{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:11px;margin-top:7px;display:inline-block}
  .ov{position:fixed;inset:0;z-index:50}
  .ov[hidden]{display:none}
  .ov-scrim{position:absolute;inset:0;background:var(--scrim)}
  .ov-sheet{position:relative;margin:5vh auto;max-width:920px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 48px var(--shadow)}
  .ov-head{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1}
  .ov-head #ov-title{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
  .ov-head input[type=search]{flex:1;max-width:260px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:13px}
  .ov-body{padding:10px 17px 26px}
  .ov-body .spacer{flex:1}
  .card{border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .card .sub{color:var(--muted);font-family:var(--mono);font-size:10.5px}
  .grey{opacity:.5}

  /* responsive: stack the two panes on a narrow screen */
  @media (max-width:720px){
    main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
    #map{border-right:none;border-bottom:1px solid var(--line)}
    #detail{padding:20px 18px 64px}
    .dtitle{font-size:21px}
  }
  /* honour reduced-motion */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="title" id="h-title">ARA Trajectory</h1>
  <div class="sub" id="h-sub"></div>
  <details id="h-abstract-wrap"><summary>Abstract</summary><div class="lead" id="h-abstract"></div></details>
  <div class="toolbar">
    <input type="search" id="q" placeholder="search steps…" autocomplete="off" />
    <label>type
      <select id="ftype"><option value="">all</option></select>
    </label>
    <label><input type="checkbox" id="fdead" /> dead ends only</label>
    <span class="spacer"></span>
    <button class="btn" id="rprev" title="previous (←)">‹</button>
    <button class="btn primary" id="rplay">▶ Replay</button>
    <button class="btn" id="rnext" title="next (→)">›</button>
    <span class="count" id="rstat"></span>
  </div>
  <div class="layerbar" id="layerbar">
    <button class="btn lbtn" data-panel="context" hidden>◧ Context</button>
    <button class="btn lbtn" data-panel="glossary" hidden>▤ Glossary <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="dependencies" hidden>⇄ Dependencies <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="recipes" hidden>▦ Recipes <span class="cnt"></span></button>
  </div>
</header>

<main>
  <aside id="map"></aside>
  <section id="detail"><div class="none">Select a step on the left, or press <kbd>▶ Replay</kbd>.</div></section>
</main>

<!-- v1.1: one shared modal overlay for the Context/Glossary/Dependencies/Recipes panels, + a glossary popover. Both inert unless their data is present. -->
<div id="overlay" class="ov" hidden role="dialog" aria-modal="true">
  <div class="ov-scrim" data-close></div>
  <div class="ov-sheet">
    <div class="ov-head"><span id="ov-title"></span>
      <input type="search" id="ov-q" placeholder="filter…" hidden autocomplete="off" />
      <span class="spacer"></span>
      <button class="btn" id="ov-close" data-close>✕ <kbd>Esc</kbd></button>
    </div>
    <div class="ov-body" id="ov-body"></div>
  </div>
</div>
<div id="gpop"></div>

{"meta": {"title": "Andes: Defining and Enhancing Quality-of-Experience in LLM-Based Text Streaming Services", "authors": ["Jiachen Liu", "Jae-Won Chung", "Zhiyu Wu", "Fan Lai", "Myungjin Lee", "Mosharaf Chowdhury"], "year": "2024", "venue": "arXiv", "ara_dir": "andes", "abstract": "Large language models (LLMs) are now at the core of conversational AI services such as real-time translation and chatbots, which provide live user interaction by incrementally streaming text to the user. However, existing LLM serving systems fail to provide good user experience because their optimization metrics are not always aligned with user experience. In this paper, we first introduce and define the notion of Quality-of-Experience (QoE) for text streaming services by considering each user's end-to-end interaction timeline. Based on this, we propose Andes, a QoE-aware LLM serving system that enhances user experience by ensuring that users receive the first token promptly and subsequent tokens at a smooth, digestible pace, even during surge periods. This is enabled by Andes's preemptive request scheduler that dynamically prioritizes requests at the token granularity based on each request's expected QoE gain and GPU resource usage. Our evaluations demonstrate that, compared to state-of-the-art LLM serving systems, Andes improves the average QoE by up to 4.7x given the same GPU resource, or saves up to 61% GPU resources while maintaining the same high QoE."}, "order": ["N01", "N02", "N04", "N05", "N07", "N08", "N06", "N09", "N10", "N11", "N12", "N03"], "nodes": [{"id": "N01", "type": "question", "parent": null, "title": "What metric should optimize LLM serving for conversational AI?", "body": "Existing LLM serving metrics (throughput, TTFT, TPOT) are widely used, but do they align with actual user experience in text streaming? If not, what is the right metric?", "thinking": "The project starts from a gap between how serving systems are graded and what users actually feel. Throughput, time-to-first-token, and time-per-output-token are the metrics everyone optimizes for, but none of them was ever checked against the lived experience of someone watching text stream in. That mismatch is the opening question: is there a better, user-centered way to measure quality of service for conversational AI, and if the existing metrics fall short, what should replace them?", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": []}, {"id": "N02", "type": "experiment", "parent": "N01", "title": "Observe mismatch between TDS and user consumption speed in vLLM", "body": "Measuring vLLM directly on the BurstGPT trace showed the server pushing tokens far faster than anyone could read or listen to them: average token delivery speed (TDS) of 11.2 tokens/s against a human reading speed of 4.8 tokens/s and a listening speed of 3.3 tokens/s, and that gap persisted even under severe load surges. At the same time, average time-to-first-token (TTFT) inflated to 10.4s under BurstGPT, well past what a user would tolerate before the first word even appears.", "thinking": "The first concrete measurement targets vLLM's own behavior: how fast does it actually stream tokens, and how fast do people actually consume them? The answer is a large and wasteful gap. The server generates far more tokens per second than a reader or listener can absorb, meaning GPU cycles are being spent on speed nobody benefits from. Worse, that same server is slow where it matters most: getting the very first token out during a burst. This is the seed observation the whole project builds on: there is slack in how fast tokens are pushed, and that slack is being spent in the wrong place.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["Figure 3 (referenced, no evidence file indexed in this ARA)", "§2.2"], "why": [{"id": "C04", "title": "Andes achieves QoE >= 0.95 for 97% of requests on real-world BurstGPT traces", "statement": "On a one-hour BurstGPT trace replay, 97% of requests served by Andes achieve QoE >= 0.95, compared to only 75% under vLLM. Andes raises average QoE from 0.88 to 0.99 and reduces average TTFT from 10.5s to 1.8s.", "status": "supported", "conditions": "", "falsification": "Fewer than 97% of Andes-served requests achieve QoE >= 0.95 on the BurstGPT one-hour trace, or average TTFT is not reduced to 1.8s.", "dependencies": ["C01", "C02"], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure4", "caption": "Figure 4 (Sec. 2.2) — vLLM average TTFT and TDS vs burst duration (20-minute trace, Phi-3.5-MoE 16x3.8B, 8xA100).", "markdown": "| Reference line | Value | Description |\n|---|---|---|\n| Target TTFT | 1.3 s | Google web-page-loading recommendation |\n| Reading speed | 4.8 tokens/s | User reading speed reference |\n| Listening speed | 3.3 tokens/s | User listening speed reference |\n\n| Observation | Value |\n|---|---|\n| vLLM TDS at moderate burst (10 min duration) | ~11 tokens/s |\n| Ideal preemption multiplier at 10-min burst | 2.3x (11/4.8) |"}, {"id": "Table1", "caption": "Table 1 (Sec. 6.1) — Models and hardware configurations.", "markdown": "| Model | Architecture | Memory | Hardware |\n|---|---|---|---|\n| Phi-3-mini 3.8B | Dense, MHA | 7 GB | A100x4 |\n| Command R 32B | Dense, GQA | 61 GB | A100x8 |\n| Phi-3.5-MoE 16x3.8B | MoE, GQA | 80 GB | A100x8 |\n| Llama 3.1 70B | Dense, GQA | 132 GB | A100x8 |"}, {"id": "Figure11", "caption": "Figure 11 (Sec. 6.2) — QoE / TTFT / TDS CDFs on the one-hour BurstGPT trace (Phi-3.5-MoE 16x3.8B, 8xA100).", "markdown": "| System | Average QoE | % requests QoE >= 0.95 | Average TTFT (s) | Average TDS (tokens/s) |\n|---|---|---|---|---|\n| Andes | 0.99 | 97% | 1.8 | 10.9 |\n| vLLM | 0.88 | 75% | 10.5 | 11.2 |"}], "data": []}, "verified_by": [{"id": "E01", "title": "End-to-End QoE Improvement on Real-World BurstGPT Trace", "run": "Replay the one-hour BurstGPT trace through vLLM (FCFS) and through Andes; record per-request token delivery timestamps for both.", "setup": "Model: Phi-3.5-MoE 16x3.8B; Hardware: 8x NVIDIA A100 SXM4 40GB (AWS p4d.24xlarge, tensor parallelism); Dataset: Multi-Round ShareGPT + one-hour BurstGPT trace slice; target TTFT = max(input_length/5000, 1) s; baseline vLLM v0.6.1 (FCFS).", "metrics": "Average QoE, CDF of QoE at threshold 0.95, average TTFT (s), average TDS (tokens/s), peak waiting queue length, GPU memory utilization (%)."}], "artifact": [], "built_on": [{"rw_id": "RW01", "name": "Kwon et al., 2023 (vLLM)", "relation_raw": "baseline"}, {"rw_id": "RW10", "name": "Wang et al., 2024 (BurstGPT)", "relation_raw": "imports"}], "concepts": ["TDS"]}, {"id": "N04", "type": "decision", "parent": "N02", "title": "Define QoE formally as deviation from Ideal Consumption Timeline", "body": "Decision: QoE = 1 - S_delay/S_whole, where S_delay measures cumulative delay relative to the ideal timeline and S_whole normalizes by the whole area under the actual timeline, diluting the weight of early delays as more tokens are generated. Alternatives considered and set aside: a simple startup-delay metric (TTFT only), an average-delay metric across all tokens (which ignores cascading delay), and percentile TPOT.", "thinking": "Once it was clear that TDS and TTFT alone were missing something, the next step was to design a metric that actually tracks the user's whole experience, not just one moment in it. The guiding evidence was twofold: N02 showed that every single token's timing matters, not just the first one, and four foundational cases sketched out on paper (Figure 5) exposed exactly which failure modes a good metric has to catch, especially delivery that looks fine on average but pauses badly in the middle. That pushed the design toward a normalization term, S_whole, that dilutes the weight of an early delay as more tokens stream in, rather than letting one bad moment dominate the whole score. TTFT-only, plain average delay, and percentile TPOT were all considered and rejected because each one collapses the full delivery timeline down to a single number that can hide exactly the failure the project cares about.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["Figure 5 (referenced, no evidence file indexed in this ARA)"], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "QoE metric implementation", "pointer": "src/execution/qoe.py", "what": "QoEComputer / RequestState — implements Equations 1-3 (S_delay, S_whole, QoE) exactly as decided here."}, {"name": "QoE mathematical formulation", "pointer": "logic/solution/algorithm.md § Mathematical Formulation → QoE Definition", "what": "recipe section (Equations 1-3)"}], "concepts": ["QoE", "Ideal Consumption Timeline"]}, {"id": "N05", "type": "decision", "parent": "N04", "title": "Design preemptive token-level scheduler to maximize QoE", "body": "Decision: schedule at token granularity with preemption, choosing which requests to interrupt mid-generation based on each request's QoE gain relative to the GPU resources it consumes. Alternatives considered and set aside: request-level preemption (too coarse to control QoE precisely), plain FCFS (already confirmed bad by N02/N03), and fairness-based scheduling like VTC (which does not account for how fast a user is actually consuming tokens).", "thinking": "With QoE defined, the natural next question is how to actually act on it. N02 had already shown that the server generates tokens faster than users consume them, which means there is slack in every request's delivery timeline. The insight here is to spend that slack deliberately: preempt a request mid-generation, exactly at the token level, whenever doing so lets the system serve a new or more urgent arrival without the preempted user ever noticing a pause. Coarser request-level preemption could not exploit this slack precisely enough, FCFS had already been ruled out, and fairness-based approaches like VTC optimize for something adjacent to QoE but not QoE itself, since they ignore each user's actual consumption speed.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "Token-level scheduler", "pointer": "src/execution/scheduler.py", "what": "AndesScheduler / PriorityGreedyScheduler / OverheadAwareRefiner — the scheduler this decision commits to building."}, {"name": "Scheduler architecture", "pointer": "logic/solution/architecture.md § Component: Token-Level Request Scheduler", "what": "recipe section describing the component this decision specifies"}], "concepts": ["QoE"]}, {"id": "N07", "type": "experiment", "parent": "N05", "title": "Attempt exact 3D Dynamic Programming solution", "body": "The exact solver (3D DP over requests, batch size, and memory) runs in O(MN^2) pseudo-polynomial time. With M in the thousands and N in the hundreds, each scheduling decision is prohibitively slow for a real-time system. The greedy solver that was tried alongside it is about 20x faster and, because it can be re-run more often, actually achieves slightly better QoE than the DP solution.", "thinking": "Before settling for an approximation, the obvious first move is to try to solve the scheduling problem exactly. The 3D DP formulation guarantees optimal packing for any fixed batch size, but its running time scales with both memory capacity and number of requests squared, which turns out to be far too slow to run at the pace live scheduling requires. The surprising twist is that being fast wins on more than just latency: because the cheaper greedy solver can be invoked far more frequently, it reacts to changing conditions sooner and ends up with slightly higher QoE than the theoretically optimal but sluggish DP solver.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["Appendix C (Algorithm 2) (referenced, no evidence file indexed in this ARA)"], "why": [{"id": "C06", "title": "The greedy knapsack solver achieves near-optimal QoE while being ~20x faster than 3D DP", "statement": "The O(N log N) greedy solver achieves slightly better average QoE than the optimal O(MN^2) 3D DP solver in real-time settings because its speed enables more frequent scheduling decisions. It runs approximately 20x faster than the DP solver.", "status": "supported", "conditions": "", "falsification": "The greedy solver achieves substantially lower QoE than the 3D DP solver, or the speed advantage is less than 2x.", "dependencies": ["C02"], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure18", "caption": "Figure 18 (Sec. 6.4) — Knapsack solver comparison, greedy vs 3D DP (Llama 3.1 70B, 8xA100).", "markdown": "| Metric | Value |\n|---|---|\n| Greedy solver speedup over 3D DP | ~20x |\n| Greedy vs DP QoE at longer burst durations | Greedy slightly better |\n| Greedy vs DP QoE at higher burst intensities | Greedy slightly better |\n| Reason greedy outperforms DP | Faster per-decision runtime enables more frequent scheduling |"}], "data": []}, "verified_by": [{"id": "E05", "title": "Comparison of Greedy vs 3D Dynamic Programming Knapsack Solver", "run": "Implement both Algorithm 1 (greedy, O(N log N)) and Algorithm 2 (3D DP, O(MN^2)) inside Andes; run each across the burst-intensity and burst-duration sweeps; measure average QoE and per-scheduling-decision runtime for each.", "setup": "Model: Llama 3.1 70B; Hardware: 8x A100 SXM4 40GB; Dataset: Multi-Round ShareGPT; burst intensity in [1.5, 2.0, 2.5] (left panel), burst duration swept (right panel).", "metrics": "Average QoE, per-decision solver runtime (ms), speedup ratio (DP runtime / greedy runtime)."}], "artifact": [{"name": "3D DP baseline (not shipped)", "pointer": "logic/solution/algorithm.md § Algorithm 2: 3D Dynamic Programming (Optimal, Pseudo-Polynomial)", "what": "recipe section — the exact solver this experiment tested; no src/execution/ implementation exists (superseded by the greedy solver)."}], "built_on": [{"rw_id": "RW11", "name": "Kellerer et al., 2004 (Knapsack Problems)", "relation_raw": "imports"}], "concepts": ["QoE"]}, {"id": "N08", "type": "experiment", "parent": "N05", "title": "Implement LQSF (Least QoE Slack First) as intermediate baseline", "body": "LQSF prioritizes whichever requests are most at risk of QoE degradation, without weighting by how much GPU resource they consume. It shows a slight improvement over FCFS but is not sufficient on its own: because it ignores context length (resource usage), high-resource requests are free to starve out everyone else.", "thinking": "Before landing on the final priority function, it is worth checking whether urgency alone, without accounting for cost, is enough. LQSF tests exactly that: rank requests purely by how close they are to losing QoE, ignoring how much memory or compute each one occupies. It does beat plain FCFS, so urgency does matter, but it is not sufficient by itself. Because it never looks at context length, a handful of large, resource-hungry requests can dominate the schedule and starve smaller ones, which points directly at the need for a priority function that divides QoE gain by resource cost.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["§6.3"], "why": [{"id": "C02", "title": "Andes improves average QoE by up to 4.7x compared to vLLM under bursty load", "statement": "On synthetic cyclic burst traces across four model architectures and three datasets, Andes achieves up to 4.7x higher average QoE than vLLM (FCFS) when burst intensity is varied.", "status": "supported", "conditions": "", "falsification": "On the same hardware/models/traces, Andes achieves <=1x average QoE improvement relative to vLLM.", "dependencies": ["C01"], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure15", "caption": "Figure 15 (Sec. 6.3) — Average QoE vs burst intensity, 4 models x 3 datasets, Andes/vLLM/LQSF/Sarathi-Serve.", "markdown": "| Metric | Value |\n|---|---|\n| Andes max QoE improvement vs vLLM | up to 4.7x |\n| Andes max burst intensity vs vLLM at QoE = 0.95 | up to 2.6x higher |\n| GPU savings (Andes vs vLLM at QoE = 0.95) | up to 61% |"}, {"id": "Figure16", "caption": "Figure 16 (Sec. 6.3) — Average QoE vs burst duration, 4 models x 3 datasets.", "markdown": "| Metric | Value |\n|---|---|\n| Andes max QoE improvement vs vLLM under varying burst duration | up to 3.5x |\n| Andes consistency | Higher average QoE across all models and datasets |"}], "data": []}, "verified_by": [{"id": "E02", "title": "QoE and Resource Savings Under Synthetic Cyclic Burst Load (Varying Intensity)", "run": "For each (model, dataset, burst intensity) combination, generate a one-cycle synthetic cyclic-burst trace and serve it with Andes, vLLM (FCFS), Sarathi-Serve, and LQSF; compute average QoE and the maximum sustainable burst intensity at QoE >= 0.95.", "setup": "Models: Phi-3-mini 3.8B (4xA100), Command R 32B (8xA100), Phi-3.5-MoE 16x3.8B (8xA100), Llama 3.1 70B (8xA100); Datasets: Multi-Round ShareGPT, ArXiv Summarization, Coding Challenges; cyclic burst load, default duration 35%, intensity in [1.5, 2.0, 2.5]; average request rate = no-burst system throughput; Poisson arrivals within each phase.", "metrics": "Average QoE per configuration, maximum sustainable burst intensity at QoE >= 0.95, GPU resource savings (%)."}], "artifact": [], "built_on": [{"rw_id": "RW01", "name": "Kwon et al., 2023 (vLLM)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Agrawal et al., 2024 (Sarathi-Serve)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Yu et al., 2022 (Orca)", "relation_raw": "imports"}, {"rw_id": "RW11", "name": "Kellerer et al., 2004 (Knapsack Problems)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW07", "name": "Sheng et al., 2024 (VTC — Fairness in LLM Serving)", "relation_raw": "bounds"}], "concepts": ["QoE"]}, {"id": "N06", "type": "decision", "parent": "N04", "title": "Formulate scheduling as knapsack problem", "body": "Decision: cast request selection as a 0/1 knapsack problem where items are requests, weights are context lengths (l_i), and values are QoE gains that themselves depend on the chosen batch size B; solve for every B in [B_min, B_max]. Alternatives considered and set aside: a simple priority queue with no memory constraint, an RL-based scheduler, and an LP relaxation of the knapsack.", "thinking": "Scheduling under a hard GPU-memory ceiling, where every request's value depends on how many other requests share the batch, is structurally a knapsack problem: the memory budget is the capacity, each request's KV-cache footprint is its weight, and its QoE gain is its value. What makes this variant novel is that the value itself is a function of the batch size B, since token latency changes with B, so the problem has to be solved across the whole feasible range of B rather than for one fixed capacity. A priority queue with no memory awareness would let the schedule blow past the GPU's memory, an RL-based scheduler was judged too complex and unpredictable for this setting, and a plain LP relaxation would not respect the strict 0/1 nature of admitting a whole request or not.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "Knapsack formulation", "pointer": "logic/solution/algorithm.md § Mathematical Formulation → Scheduling Problem (Equation 5)", "what": "recipe section formalizing the knapsack cast this decision commits to"}]}, {"id": "N09", "type": "decision", "parent": "N06", "title": "Approximate with greedy packing; add batch size search space pruning", "body": "Decision: use O(N log N) greedy packing with priority = QoE gain / context length l_i, and prune the batch size search space to [B_min, B_max]. Only trigger the scheduler when the KV cache watermark exceeds 90% or latency exceeds the most stringent user's required rate. Alternatives considered and set aside: exploring every B in [1, N] (too slow) and using a single fixed batch size (which throws away the QoE-versus-B tradeoff).", "thinking": "N07 already showed the exact DP solver is too slow for real-time use, so the practical path is a fast approximation. Dividing QoE gain by context length as the priority score naturally does two useful things at once: it preempts memory-heavy requests first, and it auto-deprioritizes any request that has already accumulated enough buffered tokens, which prevents starvation without any extra bookkeeping. Searching every possible batch size from 1 to N would defeat the purpose of being fast, so the search space is pruned to a realistic [B_min, B_max] window, and the whole scheduler is only invoked when the system is actually under memory or latency pressure rather than on every iteration.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "Priority-based greedy packer", "pointer": "src/execution/scheduler.py", "what": "PriorityGreedyScheduler.greedy_pack / compute_batch_size_bounds / should_trigger — implements the greedy algorithm and pruning decided here."}, {"name": "Greedy packing algorithm", "pointer": "logic/solution/algorithm.md § Algorithm 1: Priority-Based Greedy Packing", "what": "recipe section (pseudocode)"}, {"name": "Priority heuristic", "pointer": "logic/solution/heuristics.md § H01: Priority = QoE Gain per Memory Unit (l_i denominator)", "what": "recipe section"}, {"name": "Batch size pruning heuristic", "pointer": "logic/solution/heuristics.md § H03: Batch Size Search Space Pruning [B_min, B_max]", "what": "recipe section"}, {"name": "Selective triggering heuristic", "pointer": "logic/solution/heuristics.md § H02: Selective Triggering via KV Cache Watermark (90%) and Latency Threshold", "what": "recipe section"}], "concepts": ["QoE"]}, {"id": "N10", "type": "experiment", "parent": "N09", "depends_on": ["N07", "N08"], "title": "Discover excessive preemptions degrade QoE — need overhead awareness", "body": "Running the greedy scheduler without any awareness of preemption cost, as burst duration grows longer, it triggers many preemptions. Each one carries a real cost, hundreds of milliseconds to seconds, and that cumulative overhead ends up delaying token generation for every other ongoing request, significantly degrading QoE in aggregate even though each individual preemption decision looked locally correct.", "thinking": "With the greedy packer in place, the natural next check is to see how it behaves under sustained load. It reveals a blind spot: the greedy priority score is myopic, it only looks at the QoE gain from the preemption it is about to make, never at the cost that preemption imposes on everyone else already running. As bursts last longer, the scheduler keeps making individually reasonable swaps that add up to a lot of paused generation across the whole system, and aggregate QoE collapses. This directly draws on both earlier branches, the DP-vs-greedy comparison (N07) and the LQSF baseline (N08), both of which used a scheduler with no notion of preemption cost.", "support_level": "explicit", "isolated": false, "source_refs": [], "why": [{"id": "C05", "title": "The overhead-aware refiner is necessary for high QoE; removing it causes QoE collapse", "statement": "Andes without the overhead-aware refiner incurs excessive preemptions as burst duration increases, significantly degrading average QoE compared to Andes with the refiner.", "status": "supported", "conditions": "", "falsification": "Andes without overhead awareness achieves equivalent or higher average QoE compared to Andes with overhead awareness across all burst durations tested.", "dependencies": ["C02"], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure17", "caption": "Figure 17 (Sec. 6.4) — Overhead-aware refiner ablation (Llama 3.1 70B, 8xA100, Multi-Round ShareGPT).", "markdown": "| Observation | Value |\n|---|---|\n| Burst duration range tested | 25%, 30%, 35%, 40%, 45% |\n| Andes without overhead: preemptions per request | Increases steeply with burst duration |\n| Andes with overhead: QoE | Consistently high across all durations |\n| Andes without overhead: QoE | Degrades significantly as burst duration increases |\n| vLLM: QoE | Low baseline across all durations |"}], "data": []}, "verified_by": [{"id": "E04", "title": "Ablation — Overhead-Aware Refiner vs No Overhead Awareness", "run": "Run Andes (with refiner), Andes-no-overhead (greedy scheduler only), and vLLM across burst durations [25%, 30%, 35%, 40%, 45%]; record average QoE and average preemptions per request for each.", "setup": "Model: Llama 3.1 70B; Hardware: 8x A100 SXM4 40GB; Dataset: Multi-Round ShareGPT; cyclic burst load, default intensity 2x.", "metrics": "Average QoE, average preemptions per request."}], "artifact": [{"name": "Greedy-only scheduler (overhead-unaware configuration under test)", "pointer": "src/execution/scheduler.py", "what": "PriorityGreedyScheduler run without OverheadAwareRefiner — the exact configuration whose failure this experiment documents."}], "concepts": ["QoE"]}, {"id": "N11", "type": "decision", "parent": "N10", "title": "Add Overhead-Aware Refiner to greedy scheduler", "body": "Decision: post-process every greedy (admit, preempt) pair by estimating its net QoE change, QoE gain from admitting minus the summed QoE loss the preemption's overhead latency inflicts on all currently running requests, and stop admitting as soon as that net change turns non-positive. Alternatives considered and set aside: a fixed preemption rate limit, a cooldown timer between preemptions, and simply not correcting for overhead at all.", "thinking": "N10 made the problem concrete: the greedy scheduler needs a way to know when a preemption is no longer worth its cost. The fix layered on top is a refiner that walks the greedy decision list in priority order and, for each candidate swap, weighs the QoE it would gain against the QoE it would cost every other running request during the preemption's overhead window, stopping the moment that trade turns unfavorable. This is workable because preemption overhead itself is predictable: offline profiling gives a reliable estimate of how long a recompute-or-swap operation takes, an idea grounded in prior work showing DNN-serving overhead is stable enough to predict ahead of time. A flat rate limit or a fixed cooldown were both rejected because neither adapts to how much QoE is actually at stake in a given moment; only estimating the real cost each time does that.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "Overhead-aware refiner", "pointer": "src/execution/overhead_refiner.py", "what": "refine_scheduling_decision / select_preemption_mechanism / lookup_preemption_overhead — the refiner this decision adds."}, {"name": "Overhead-aware refiner (scheduler-integrated)", "pointer": "src/execution/scheduler.py", "what": "OverheadAwareRefiner class, invoked from AndesScheduler.step()"}, {"name": "Refiner algorithm", "pointer": "logic/solution/algorithm.md § Overhead-Aware Refiner (Algorithm, Informal)", "what": "recipe section (pseudocode)"}, {"name": "Early-stopping heuristic", "pointer": "logic/solution/heuristics.md § H04: Overhead-Aware Refiner — Stop When Net QoE Change is Non-Positive", "what": "recipe section"}], "concepts": ["Overhead-Aware Refiner", "QoE"]}, {"id": "N12", "type": "experiment", "parent": "N11", "title": "Validate Andes end-to-end on BurstGPT + synthetic traces", "body": "With the full system assembled, Andes achieves up to 4.7x QoE improvement, 61% GPU savings, and 97% of requests at QoE >= 0.95 (versus 75% for vLLM); TTFT drops from 10.5s to 1.8s and peak queue length is reduced by 85%. These results hold across 4 model architectures, 3 datasets, varying burst intensity and duration, and Poisson arrivals.", "thinking": "This is the payoff step: every prior decision, from defining QoE through to the overhead-aware refiner, gets tested together as one system against the real BurstGPT trace and a battery of synthetic workloads. The result confirms the whole chain of reasoning holds up under load: not only does the headline QoE number improve substantially, but the system also uses meaningfully less GPU capacity to hit the same quality bar, first tokens arrive much sooner, and queues no longer pile up during surges. Testing across four different model architectures, three datasets, and multiple burst patterns (including plain Poisson arrivals with no burst structure at all) checks that none of this is an artifact of one specific setup.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["Figure 13 (referenced, no evidence file indexed in this ARA)"], "why": [{"id": "C02", "title": "Andes improves average QoE by up to 4.7x compared to vLLM under bursty load", "statement": "On synthetic cyclic burst traces across four model architectures and three datasets, Andes achieves up to 4.7x higher average QoE than vLLM (FCFS) when burst intensity is varied.", "status": "supported", "conditions": "", "falsification": "On the same hardware/models/traces, Andes achieves <=1x average QoE improvement relative to vLLM.", "dependencies": ["C01"], "provenance": null}, {"id": "C03", "title": "Andes saves up to 61% GPU resources while maintaining average QoE >= 0.95", "statement": "To maintain average QoE >= 0.95, Andes requires up to 61% fewer GPUs compared to vLLM, or equivalently handles up to 2.6x more burst intensity with the same GPU count.", "status": "supported", "conditions": "", "falsification": "Andes requires >=61% of vLLM's GPU resources (no savings) to maintain QoE >= 0.95 under the same load patterns.", "dependencies": ["C01", "C02"], "provenance": null}, {"id": "C04", "title": "Andes achieves QoE >= 0.95 for 97% of requests on real-world BurstGPT traces", "statement": "On a one-hour BurstGPT trace replay, 97% of requests served by Andes achieve QoE >= 0.95, compared to only 75% under vLLM. Andes raises average QoE from 0.88 to 0.99 and reduces average TTFT from 10.5s to 1.8s.", "status": "supported", "conditions": "", "falsification": "Fewer than 97% of Andes-served requests achieve QoE >= 0.95 on the BurstGPT one-hour trace, or average TTFT is not reduced to 1.8s.", "dependencies": ["C01", "C02"], "provenance": null}, {"id": "C07", "title": "Andes reduces peak queue length by 85% compared to vLLM on BurstGPT", "statement": "Under the one-hour BurstGPT trace, Andes reduces peak waiting queue length during load surges by 85% through token-level preemptive scheduling.", "status": "supported", "conditions": "", "falsification": "Peak queue length reduction is less than 85% under the same BurstGPT trace and hardware configuration.", "dependencies": ["C04"], "provenance": null}, {"id": "C08", "title": "Andes's QoE improvement is robust across model architectures, datasets, and arrival distributions", "statement": "Andes consistently outperforms vLLM, Sarathi-Serve, and LQSF in average QoE across Dense/MoE architectures, MHA/GQA attention, three input/output datasets, varying burst intensities, burst durations, and Poisson arrival patterns.", "status": "supported", "conditions": "", "falsification": "There exists a tested model/dataset/arrival-pattern combination where Andes does not outperform all baselines in average QoE.", "dependencies": ["C02", "C03"], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure11", "caption": "Figure 11 (Sec. 6.2) — QoE / TTFT / TDS CDFs on the one-hour BurstGPT trace (Phi-3.5-MoE 16x3.8B, 8xA100).", "markdown": "| System | Average QoE | % requests QoE >= 0.95 | Average TTFT (s) | Average TDS (tokens/s) |\n|---|---|---|---|---|\n| Andes | 0.99 | 97% | 1.8 | 10.9 |\n| vLLM | 0.88 | 75% | 10.5 | 11.2 |"}, {"id": "Figure15", "caption": "Figure 15 (Sec. 6.3) — Average QoE vs burst intensity, 4 models x 3 datasets, Andes/vLLM/LQSF/Sarathi-Serve.", "markdown": "| Metric | Value |\n|---|---|\n| Andes max QoE improvement vs vLLM | up to 4.7x |\n| Andes max burst intensity vs vLLM at QoE = 0.95 | up to 2.6x higher |\n| GPU savings (Andes vs vLLM at QoE = 0.95) | up to 61% |"}, {"id": "Figure16", "caption": "Figure 16 (Sec. 6.3) — Average QoE vs burst duration, 4 models x 3 datasets.", "markdown": "| Metric | Value |\n|---|---|\n| Andes max QoE improvement vs vLLM under varying burst duration | up to 3.5x |\n| Andes consistency | Higher average QoE across all models and datasets |"}, {"id": "Figure19", "caption": "Figure 19 (Sec. 6.4) — Sensitivity of Andes to the QoE-gain look-ahead window Delta-t.", "markdown": "| Observation | Value |\n|---|---|\n| Andes QoE sensitivity to Delta-t | Roughly consistent for various Delta-t values |\n| Andes vs baselines | Significantly outperforms all baselines across all Delta-t values |\n| Tuning recommendation | Best Delta-t depends on model and I/O distribution; requires pre-deployment tuning |"}, {"id": "Figure20", "caption": "Figure 20 (Sec. 6.4) — Average QoE vs request rate under Poisson arrivals (Llama 3.1 70B, 8xA100).", "markdown": "| Request rate (req/s) | Andes | vLLM | LQSF | Sarathi-Serve |\n|---|---|---|---|---|\n| 1.0 | high | lower | lower | lower |\n| 1.2 | high | lower | lower | lower |\n| 1.4 | high | lower | lower | lower |"}, {"id": "Table1", "caption": "Table 1 (Sec. 6.1) — Models and hardware configurations.", "markdown": "| Model | Architecture | Memory | Hardware |\n|---|---|---|---|\n| Phi-3-mini 3.8B | Dense, MHA | 7 GB | A100x4 |\n| Command R 32B | Dense, GQA | 61 GB | A100x8 |\n| Phi-3.5-MoE 16x3.8B | MoE, GQA | 80 GB | A100x8 |\n| Llama 3.1 70B | Dense, GQA | 132 GB | A100x8 |"}, {"id": "Table2", "caption": "Table 2 (Sec. 6.1) — Request dataset statistics.", "markdown": "| Dataset | Input Length Mean (tokens) | Input Length Std (tokens) | Output Length Mean (tokens) | Output Length Std (tokens) |\n|---|---|---|---|---|\n| Multi-Round ShareGPT | 3171 | 7943 | Not specified in paper | Not specified in paper |\n| ArXiv Summarization | 17855 | 11401 | Not specified in paper | Not specified in paper |\n| Coding Challenges | 1552 | 5423 | 21293 | Not specified in paper |"}], "data": []}, "verified_by": [{"id": "E01", "title": "End-to-End QoE Improvement on Real-World BurstGPT Trace", "run": "Replay the one-hour BurstGPT trace through vLLM (FCFS) and through Andes; record per-request token delivery timestamps for both.", "setup": "Model: Phi-3.5-MoE 16x3.8B; Hardware: 8x NVIDIA A100 SXM4 40GB (AWS p4d.24xlarge, tensor parallelism); Dataset: Multi-Round ShareGPT + one-hour BurstGPT trace slice; target TTFT = max(input_length/5000, 1) s; baseline vLLM v0.6.1 (FCFS).", "metrics": "Average QoE, CDF of QoE at threshold 0.95, average TTFT (s), average TDS (tokens/s), peak waiting queue length, GPU memory utilization (%)."}, {"id": "E02", "title": "QoE and Resource Savings Under Synthetic Cyclic Burst Load (Varying Intensity)", "run": "For each (model, dataset, burst intensity) combination, generate a one-cycle synthetic cyclic-burst trace and serve it with Andes, vLLM (FCFS), Sarathi-Serve, and LQSF; compute average QoE and the maximum sustainable burst intensity at QoE >= 0.95.", "setup": "Models: Phi-3-mini 3.8B (4xA100), Command R 32B (8xA100), Phi-3.5-MoE 16x3.8B (8xA100), Llama 3.1 70B (8xA100); Datasets: Multi-Round ShareGPT, ArXiv Summarization, Coding Challenges; cyclic burst load, default duration 35%, intensity in [1.5, 2.0, 2.5]; average request rate = no-burst system throughput; Poisson arrivals within each phase.", "metrics": "Average QoE per configuration, maximum sustainable burst intensity at QoE >= 0.95, GPU resource savings (%)."}, {"id": "E03", "title": "QoE Under Synthetic Cyclic Burst Load (Varying Duration)", "run": "For each (model, dataset, burst duration) combination, generate a cyclic-burst synthetic trace and serve it with Andes, vLLM, Sarathi-Serve, LQSF; compute average QoE per configuration.", "setup": "Models/hardware/datasets as in E02; default burst intensity = 2x; burst duration varied.", "metrics": "Average QoE per configuration."}, {"id": "E06", "title": "Robustness Under Poisson Arrival Distribution", "run": "Generate traces with Poisson arrivals at request rates from 1.0 to 1.4 req/s over a 20-minute duration; serve with Andes, vLLM, Sarathi-Serve, LQSF; compute average QoE per system per rate.", "setup": "Model: Llama 3.1 70B; Hardware: 8x A100 SXM4 40GB; Dataset: Multi-Round ShareGPT; no burst pattern, pure Poisson arrivals.", "metrics": "Average QoE vs request rate (req/s)."}], "artifact": [{"name": "Top-level Andes scheduler", "pointer": "src/execution/scheduler.py", "what": "AndesScheduler.step() — combines the greedy packer and overhead-aware refiner into the system validated here."}, {"name": "Client-side token pacer", "pointer": "src/execution/token_pacer.py", "what": "TokenPacer — smooths delivery on the client side, part of the end-to-end system under test."}, {"name": "Request tracker", "pointer": "src/execution/request_tracker.py", "what": "RequestTracker / RequestInfo — maintains per-request state feeding the scheduler during evaluation."}, {"name": "System architecture", "pointer": "logic/solution/architecture.md § Request Lifecycle", "what": "recipe section describing the full pipeline exercised by this validation"}], "built_on": [{"rw_id": "RW01", "name": "Kwon et al., 2023 (vLLM)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Agrawal et al., 2024 (Sarathi-Serve)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Yu et al., 2022 (Orca)", "relation_raw": "imports"}, {"rw_id": "RW10", "name": "Wang et al., 2024 (BurstGPT)", "relation_raw": "imports"}, {"rw_id": "RW11", "name": "Kellerer et al., 2004 (Knapsack Problems)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Patel et al., 2024 (Splitwise)", "relation_raw": "baseline"}, {"rw_id": "RW05", "name": "Zhong et al., 2024 (DistServe)", "relation_raw": "baseline"}, {"rw_id": "RW06", "name": "Wu et al., 2024 (LoongServe)", "relation_raw": "baseline"}], "rejected_here": [{"rw_id": "RW07", "name": "Sheng et al., 2024 (VTC — Fairness in LLM Serving)", "relation_raw": "bounds"}, {"rw_id": "RW08", "name": "Sun et al., 2024 (Llumnix)", "relation_raw": "bounds"}], "concepts": ["QoE"]}, {"id": "N03", "type": "dead_end", "parent": "N01", "title": "Can existing metrics (TTFT, P90/P99 TPOT) fully characterize user experience?", "body": "Hypothesis tested: TTFT together with average/P90/P99 TPOT is sufficient to capture user experience. It failed: TPOT misses mid-stream pauses (Figure 5d) where both TTFT and the last-token latency look completely normal even though the user experiences a long pause in the middle of the response, and cascading delays from early tokens are invisible to an average TPOT number. Lesson: a metric has to span the full token consumption timeline, not sample it at a few points, which is what motivated the QoE definition.", "thinking": "Before inventing a new metric, the cheaper option is to check whether the standard toolbox, TTFT plus average or tail-percentile TPOT, already covers what matters. It does not survive scrutiny: constructing a scenario with a pause in the middle of generation shows that TTFT and even the last token's latency can both look perfectly normal while the user still experiences an unacceptable stall, because none of these metrics look at the whole timeline, only isolated points on it. That failure is the direct reason the project moves to a metric spanning the entire consumption timeline rather than patching together more point-samples.", "support_level": "inferred", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["QoE"]}], "context": {"title": "Problem", "summary": "Because servers generate tokens faster than users can consume them, there exists a \"slack buffer\" in each request's token delivery timeline.", "sections": [{"role": "setting", "heading": "Setting", "present": false, "entries": []}, {"role": "observations", "heading": "Observations", "present": true, "entries": [{"ent_id": "O1", "inferred_id": false, "ent_title": "Token generation speed vastly exceeds user consumption speed", "text": "Statement: Under real BurstGPT traces, vLLM's average token delivery speed (TDS) is 11.2 tokens/s, while human reading speed is 4.8 tokens/s and listening speed is 3.3 tokens/s. TDS exceeds any reasonable user consumption speed even under severe load surges.\nEvidence: Figure 4b; Section 2.2; Figure 2 demographic data\nImplication: Compute is wasted over-generating tokens that users cannot consume, creating slack that could be redirected to reduce TTFT for other users.", "unstructured": false, "fields": [{"label": "Statement", "value": "Under real BurstGPT traces, vLLM's average token delivery speed (TDS) is 11.2 tokens/s, while human reading speed is 4.8 tokens/s and listening speed is 3.3 tokens/s. TDS exceeds any reasonable user consumption speed even under severe load surges."}, {"label": "Evidence", "value": "Figure 4b; Section 2.2; Figure 2 demographic data"}, {"label": "Implication", "value": "Compute is wasted over-generating tokens that users cannot consume, creating slack that could be redirected to reduce TTFT for other users."}], "refs": [{"raw": "Figure 4b", "kind": "figure", "target": null}, {"raw": "Figure 2", "kind": "figure", "target": null}]}, {"ent_id": "O2", "inferred_id": false, "ent_title": "FCFS scheduling causes severe head-of-line blocking and TTFT inflation", "text": "Statement: On a one-hour BurstGPT trace with vLLM serving Phi-3.5-MoE 16x3.8B on 8xA100 GPUs, average TTFT is 10.4 seconds, far exceeding the 1.3s web-page patience threshold recommended by Google.\nEvidence: Section 2.2; Figure 3; Figure 4a\nImplication: FCFS causes queuing delay during load surges; users abandon sessions before receiving any tokens.", "unstructured": false, "fields": [{"label": "Statement", "value": "On a one-hour BurstGPT trace with vLLM serving Phi-3.5-MoE 16x3.8B on 8xA100 GPUs, average TTFT is 10.4 seconds, far exceeding the 1.3s web-page patience threshold recommended by Google."}, {"label": "Evidence", "value": "Section 2.2; Figure 3; Figure 4a"}, {"label": "Implication", "value": "FCFS causes queuing delay during load surges; users abandon sessions before receiving any tokens."}], "refs": [{"raw": "Figure 3", "kind": "figure", "target": null}, {"raw": "Figure 4a", "kind": "figure", "target": null}]}, {"ent_id": "O3", "inferred_id": false, "ent_title": "GPU memory is underutilized during non-surge periods", "text": "Statement: vLLM's GPU memory utilization fluctuates significantly and remains underutilized during normal load even while building long queues during surges (Figure 3).\nEvidence: Figure 3 (GPU Mem. Util. row)\nImplication: The system lacks a mechanism to pre-emptively use idle memory to serve waiting requests at token granularity.", "unstructured": false, "fields": [{"label": "Statement", "value": "vLLM's GPU memory utilization fluctuates significantly and remains underutilized during normal load even while building long queues during surges (Figure 3)."}, {"label": "Evidence", "value": "Figure 3 (GPU Mem. Util. row)"}, {"label": "Implication", "value": "The system lacks a mechanism to pre-emptively use idle memory to serve waiting requests at token granularity."}], "refs": [{"raw": "Figure 3", "kind": "figure", "target": null}]}, {"ent_id": "O4", "inferred_id": false, "ent_title": "Existing metrics miss mid-stream pauses and cascading delays", "text": "Statement: TTFT captures only the first token; average/P90/P99 TPOT can miss long pauses in the middle of generation (Figure 5d) where both TTFT and last-token latency appear normal.\nEvidence: Section 3.1; Figure 5d\nImplication: A metric spanning the full token consumption timeline is needed.", "unstructured": false, "fields": [{"label": "Statement", "value": "TTFT captures only the first token; average/P90/P99 TPOT can miss long pauses in the middle of generation (Figure 5d) where both TTFT and last-token latency appear normal."}, {"label": "Evidence", "value": "Section 3.1; Figure 5d"}, {"label": "Implication", "value": "A metric spanning the full token consumption timeline is needed."}], "refs": [{"raw": "Figure 5d", "kind": "figure", "target": null}]}, {"ent_id": "O5", "inferred_id": false, "ent_title": "Conversational AI drives >60% of LLM applications and is growing rapidly", "text": "Statement: Conversational AI drives over 60% of LLM-backed applications; ChatGPT has 300 million weekly active users.\nEvidence: Section 1; citations [14], [13]\nImplication: Poor user experience at this scale has enormous business impact.", "unstructured": false, "fields": [{"label": "Statement", "value": "Conversational AI drives over 60% of LLM-backed applications; ChatGPT has 300 million weekly active users."}, {"label": "Evidence", "value": "Section 1; citations [14], [13]"}, {"label": "Implication", "value": "Poor user experience at this scale has enormous business impact."}], "refs": []}]}, {"role": "gaps", "heading": "Gaps", "present": true, "entries": [{"ent_id": "G1", "inferred_id": false, "ent_title": "No QoE metric for text streaming services exists", "text": "Statement: There is no formal, end-to-end QoE definition tailored to text streaming that captures TTFT, streaming pace, pauses, and cascading delays simultaneously.\nCaused by: O4\nExisting attempts: TTFT, average/P90/P99 TPOT, token generation throughput\nWhy they fail: They measure subsets of the timeline or server-centric aggregates, missing middle pauses (Figure 5d) and cascading effects of early delays.", "unstructured": false, "fields": [{"label": "Statement", "value": "There is no formal, end-to-end QoE definition tailored to text streaming that captures TTFT, streaming pace, pauses, and cascading delays simultaneously."}, {"label": "Caused by", "value": "O4"}, {"label": "Existing attempts", "value": "TTFT, average/P90/P99 TPOT, token generation throughput"}, {"label": "Why they fail", "value": "They measure subsets of the timeline or server-centric aggregates, missing middle pauses (Figure 5d) and cascading effects of early delays."}], "refs": [{"raw": "O4", "kind": "observation", "target": "O4"}]}, {"ent_id": "G2", "inferred_id": false, "ent_title": "Existing schedulers cannot exploit the TDS-consumption-speed gap", "text": "Statement: Existing LLM serving systems (vLLM, Sarathi-Serve, Orca) use FCFS and have no mechanism to preempt at token granularity based on user consumption state.\nCaused by: O1, O2, O3\nExisting attempts: Iteration-level batching (Orca), PagedAttention (vLLM), chunked-prefill (Sarathi-Serve)\nWhy they fail: Optimized for throughput/latency, not user-facing QoE; FCFS cannot redistribute compute to requests most in need.", "unstructured": false, "fields": [{"label": "Statement", "value": "Existing LLM serving systems (vLLM, Sarathi-Serve, Orca) use FCFS and have no mechanism to preempt at token granularity based on user consumption state."}, {"label": "Caused by", "value": "O1, O2, O3"}, {"label": "Existing attempts", "value": "Iteration-level batching (Orca), PagedAttention (vLLM), chunked-prefill (Sarathi-Serve)"}, {"label": "Why they fail", "value": "Optimized for throughput/latency, not user-facing QoE; FCFS cannot redistribute compute to requests most in need."}], "refs": [{"raw": "O1", "kind": "observation", "target": "O1"}, {"raw": "O2", "kind": "observation", "target": "O2"}, {"raw": "O3", "kind": "observation", "target": "O3"}]}, {"ent_id": "G3", "inferred_id": false, "ent_title": "Preemption overhead is unaccounted for in scheduling decisions", "text": "Statement: Naive token-level preemption (recomputation or KV-cache swapping) introduces hundreds of milliseconds to seconds of overhead. Without overhead awareness, excessive preemptions degrade aggregate QoE.\nCaused by: G2\nExisting attempts: None specifically address preemption overhead balancing for QoE.\nWhy they fail: Scheduling decisions are made without estimating cumulative overhead impact on all ongoing requests.", "unstructured": false, "fields": [{"label": "Statement", "value": "Naive token-level preemption (recomputation or KV-cache swapping) introduces hundreds of milliseconds to seconds of overhead. Without overhead awareness, excessive preemptions degrade aggregate QoE."}, {"label": "Caused by", "value": "G2"}, {"label": "Existing attempts", "value": "None specifically address preemption overhead balancing for QoE."}, {"label": "Why they fail", "value": "Scheduling decisions are made without estimating cumulative overhead impact on all ongoing requests."}], "refs": [{"raw": "G2", "kind": "gap", "target": "G2"}]}]}, {"role": "insight", "heading": "Key Insight", "present": true, "entries": [{"ent_id": "KeyInsight", "inferred_id": true, "ent_title": "Key Insight", "text": "Insight: Because servers generate tokens faster than users can consume them, there exists a \"slack buffer\" in each request's token delivery timeline. This slack can be exploited by a preemptive token-level scheduler to serve new or higher-priority requests without affecting the consuming user's perceived experience, as long as the pacer buffer does not run dry.\nDerived from: O1, O2, O3\nEnables: Token-level preemptive scheduling that maximizes QoE across all users, plus a client-side token pacer that absorbs generation bursts to maintain smooth delivery.", "unstructured": false, "fields": [{"label": "Insight", "value": "Because servers generate tokens faster than users can consume them, there exists a \"slack buffer\" in each request's token delivery timeline. This slack can be exploited by a preemptive token-level scheduler to serve new or higher-priority requests without affecting the consuming user's perceived experience, as long as the pacer buffer does not run dry."}, {"label": "Derived from", "value": "O1, O2, O3"}, {"label": "Enables", "value": "Token-level preemptive scheduling that maximizes QoE across all users, plus a client-side token pacer that absorbs generation bursts to maintain smooth delivery."}], "refs": [{"raw": "O1", "kind": "observation", "target": "O1"}, {"raw": "O2", "kind": "observation", "target": "O2"}, {"raw": "O3", "kind": "observation", "target": "O3"}]}]}, {"role": "assumptions", "heading": "Assumptions", "present": true, "entries": [{"ent_id": "A1", "inferred_id": false, "ent_title": "Users consume tokens at a fixed reading/listening speed that is known or estimable per request.", "text": "A1: Users consume tokens at a fixed reading/listening speed that is known or estimable per request.", "unstructured": false, "fields": [], "refs": []}, {"ent_id": "A2", "inferred_id": false, "ent_title": "Token generation latency is a predictable function of batch size (Pearson r = 0.997 between batch size and total context length).", "text": "A2: Token generation latency is a predictable function of batch size (Pearson r = 0.997 between batch size and total context length).", "unstructured": false, "fields": [], "refs": [{"raw": "Figure 21", "kind": "figure", "target": null}]}, {"ent_id": "A3", "inferred_id": false, "ent_title": "Preemption overhead (recomputation or KV-cache swapping) is offline-profilable and sufficiently stable to be used for runtime estimation.", "text": "A3: Preemption overhead (recomputation or KV-cache swapping) is offline-profilable and sufficiently stable to be used for runtime estimation.", "unstructured": false, "fields": [], "refs": []}, {"ent_id": "A4", "inferred_id": false, "ent_title": "The server is the primary bottleneck; network conditions are not the dominant source of text streaming degradation.", "text": "A4: The server is the primary bottleneck; network conditions are not the dominant source of text streaming degradation.", "unstructured": false, "fields": [], "refs": []}, {"ent_id": "A5", "inferred_id": false, "ent_title": "Request output lengths are not known in advance; scheduling decisions are made online.", "text": "A5: Request output lengths are not known in advance; scheduling decisions are made online.", "unstructured": false, "fields": [], "refs": []}]}]}, "glossary": {"title": "Concepts", "groups": [], "terms": [{"term_id": "G01", "name": "Quality-of-Experience", "aliases": ["QoE"], "group": "", "definition": "A scalar in [0, 1] measuring how closely a user's Actual Consumption Timeline follows their Ideal Consumption Timeline. `S_delay = Σᵢ(T_actual_i − T_ideal_i)` for all consumed tokens i=1..n, summing the area between the Actual and Ideal consumption timelines. `S_whole` covers `S_delay` plus the area below the Actual Consumption Timeline, always >= S_delay. QoE = 1 denotes perfect experience (no delays); QoE = 0 denotes worst experience (no tokens delivered).", "fields": [{"label": "Notation", "value": "QoE = 1 - S_delay / S_whole"}, {"label": "Boundary conditions", "value": "Defined only when at least one token has been delivered. QoE can be computed for queued, running, or finished requests. Delivering tokens earlier than ideal does NOT improve QoE (capped at the user's consumption speed). Delays only worsen QoE monotonically."}], "related": ["G02", "G03", "G04"], "refs": []}, {"term_id": "G02", "name": "Ideal Consumption Timeline", "aliases": ["T_ideal"], "group": "", "definition": "The timeline along which a user expects to receive tokens: the i-th token should arrive at the TTFT target plus `(i-1)` token intervals at the user's consumption speed `r_user` (tokens/s). The slope of the line equals the user's reading or listening speed.", "fields": [{"label": "Notation", "value": "T_ideal_i = T_target_TTFT + (i-1) / r_user"}, {"label": "Boundary conditions", "value": "Fixed per request once QoE parameters (target TTFT, consumption speed) are set at request submission. Does not change based on server state."}], "related": ["G01", "G03", "G04", "G06"], "refs": []}, {"term_id": "G03", "name": "Actual Consumption Timeline", "aliases": ["T_actual"], "group": "", "definition": "The timestamp at which the user actually consumes the i-th token. Equals `max(T_delivery_i, T_actual_{i-1} + 1/r_user)`, where `T_delivery_i` is when the token arrives. When delivery is ahead of schedule, T_actual follows the ideal; when delivery falls behind, T_actual lags, creating cascading delays on all subsequent tokens.", "fields": [{"label": "Notation", "value": "T_actual_i"}, {"label": "Boundary conditions", "value": "Always >= T_ideal_i when any delay has occurred (cascading). Equals T_ideal when delivery is ahead of schedule."}], "related": ["G02", "G01"], "refs": []}, {"term_id": "G04", "name": "Token Delivery Speed", "aliases": ["TDS"], "group": "", "definition": "The rate at which the server generates and pushes tokens to the client for a given request. Determined by the token generation latency, which is a function of batch size B. Generating TDS > r_user does not improve QoE but creates slack that can be exploited for preemption.", "fields": [{"label": "Notation", "value": "TDS (tokens/s)"}, {"label": "Boundary conditions", "value": "TDS > r_user is wasteful for QoE of that request but enables preemption slack. TDS < r_user degrades QoE. Modeled as a function of batch size B only (Pearson r = 0.997 between batch size and total context length)."}], "related": ["G02", "G01", "G06"], "refs": []}, {"term_id": "G05", "name": "Priority Score", "aliases": ["π_i"], "group": "", "definition": "The scheduling priority of request i, defined as its expected QoE gain if served (at batch size B) divided by its context length l_i. Q_serve,i(B) is the estimated QoE of request i if served in a batch of size B for the next Delta-t seconds; Q_wait,i is the estimated QoE if not served for Delta-t seconds. Dividing by l_i penalizes memory-heavy requests, implementing a QoE-per-memory-unit heuristic.", "fields": [{"label": "Notation", "value": "π_i = (Q_serve,i(B) − Q_wait,i) / l_i"}, {"label": "Boundary conditions", "value": "Priority is dynamic: increases as a request waits (growing QoE gain from waiting), decreases as context length grows (auto-deprioritization after sufficient tokens are buffered). Prevents starvation."}], "related": ["G01", "G09"], "refs": []}, {"term_id": "G06", "name": "Token Pacer", "aliases": [], "group": "", "definition": "A client-side component that receives tokens from the server via push-based streaming (potentially faster than consumption speed), buffers them, and delivers them to the user precisely at the user's Ideal Consumption Timeline rate r_user. Absorbs server-side generation bursts and pauses (during preemption) to provide smooth delivery.", "fields": [{"label": "Notation", "value": "Client-side buffer of size B_pacer(t) tokens"}, {"label": "Boundary conditions", "value": "If the pacer buffer drains to zero (no tokens buffered and server not generating), the user experiences a pause and QoE degrades. The server monitors pacer state and resumes preempted requests before the buffer runs out."}], "related": ["G02", "G04", "G01"], "refs": []}, {"term_id": "G07", "name": "Cyclic Burst Load Pattern", "aliases": [], "group": "", "definition": "A synthetic request arrival pattern alternating between burst and non-burst phases following a Poisson process. Default parameters: intensity = 2x, duration = 35% of cycle. The average request rate equals system throughput under no burstiness to prevent indefinite queue growth. Models real BurstGPT behavior (~3 bursts/hour, ~7 min avg duration, ~2x higher rate during bursts).", "fields": [{"label": "Notation", "value": "Characterized by intensity r (ratio of burst to average request rate) and duration d (fraction of time in burst phase)"}, {"label": "Boundary conditions", "value": "Valid when intensity > 1 and 0 < duration < 1. At intensity = 1 there is no burst. At duration = 1 the system is permanently overloaded."}], "related": ["G01"], "refs": []}, {"term_id": "G08", "name": "KV Cache Context Length", "aliases": ["l_i"], "group": "", "definition": "The total number of tokens (prompt + generated so far) occupying KV cache entries in GPU memory for request i. Each token in a request's context consumes one KV cache entry. Acts as the \"weight\" in the knapsack formulation; the memory constraint requires Sigma(l_i . x_i) <= M.", "fields": [{"label": "Notation", "value": "l_i (tokens)"}, {"label": "Boundary conditions", "value": "Grows over time as more tokens are generated, automatically increasing the memory cost and decreasing priority. GPU memory M bounds total feasible context."}], "related": ["G05"], "refs": []}, {"term_id": "G09", "name": "Overhead-Aware Refiner", "aliases": [], "group": "", "definition": "A post-processing step that iterates over the admission list A (sorted by priority descending) from the greedy scheduler and checks whether admitting request r_admit by preempting request r_preempt produces net positive QoE change. For each candidate admission, it estimates: QoE gain of admission minus QoE loss of overhead on all ongoing requests. Stops when net QoE change becomes non-positive.", "fields": [{"label": "Notation", "value": "Refines scheduling decision (A, P) -> (A', P') where A' subset A, P' subset P"}, {"label": "Boundary conditions", "value": "Operates after the greedy scheduler produces an initial decision. Preemption overhead (recomputation or KV-swap latency) is estimated from offline profiles. Becomes critical at high burst durations where many preemptions would otherwise be triggered."}], "related": ["G05", "G10"], "refs": []}, {"term_id": "G10", "name": "Preemption Mechanisms", "aliases": [], "group": "", "definition": "Two mechanisms for pausing a running request. Recomputation: drop the KV cache on preemption (zero preemption cost), recompute from scratch on resumption (overhead ~= one prefill). Swapping: copy KV cache to CPU RAM on preemption and back on resumption (overhead proportional to KV cache size). Andes offline-profiles both and selects the faster per context length.", "fields": [{"label": "Notation", "value": "Recomputation (drop KV cache, recompute on resumption) or Swapping (move KV cache GPU<->CPU)"}, {"label": "Boundary conditions", "value": "Overhead ranges from hundreds of milliseconds to seconds. Both mechanisms interrupt the entire token generation pipeline for all requests in the current batch. Overhead is predictable and stable enough for runtime estimation."}], "related": ["G09", "G08"], "refs": []}], "lexicon": {"quality-of-experience": "G01", "qoe": "G01", "ideal consumption timeline": "G02", "t_ideal": "G02", "actual consumption timeline": "G03", "t_actual": "G03", "token delivery speed": "G04", "tds": "G04", "priority score": "G05", "π_i": "G05", "token pacer": "G06", "cyclic burst load pattern": "G07", "kv cache context length": "G08", "l_i": "G08", "overhead-aware refiner": "G09", "preemption mechanisms": "G10"}}, "dependencies": {"title": "Related Work / Dependencies", "preamble": "", "legend": [{"type": "baseline", "gloss": "a system Andes is directly compared against"}, {"type": "imports", "gloss": "a technique or dataset Andes adopts/builds on"}, {"type": "bounds", "gloss": "a system that bounds/limits Andes's claimed scope (complementa
