uling delay). Adaptive tier thresholds are set based on previous-round participant hardware profiles. First-round jobs skip tier matching (cold-start profiling)."}], "related": ["G03", "G02"], "refs": []}, {"term_id": "G08", "name": "Starvation Prevention (Fairness Knob ε)", "aliases": ["Fairness Knob ε"], "group": "", "definition": "A fairness mechanism applied on top of IRS. The fair-share JCT for job $J_i$ is $T_i = M \\cdot sd_i$, where $M$ is the number of simultaneous CL jobs and $sd_i$ is the JCT without contention. Each job's effective demand and each group's effective queue length are adjusted by the ratio of actual usage to fair-share usage, raised to the power $\\varepsilon \\in [0, \\infty)$. At $\\varepsilon=0$: pure IRS. As $\\varepsilon \\to \\infty$: max-min fairness.", "fields": [{"label": "Notation", "value": "$d'_i = d_i \\cdot (t_i / T_i)^\\varepsilon$; $q'_j = q_j \\cdot (\\sum_{J_i \\in G_j} T_i / \\sum_{J_i \\in G_j} t_i)^\\varepsilon$; $T_i = M \\cdot sd_i$"}, {"label": "Boundary conditions", "value": "Effective only when jobs have heterogeneous demands. $\\varepsilon=2$ yields 69% of jobs meeting their fair-share JCT in experiments. Higher $\\varepsilon$ reduces average JCT improvement."}], "related": ["G06"], "refs": []}, {"term_id": "G09", "name": "Collaborative Learning Job (CL Job)", "aliases": ["CL Job"], "group": "", "definition": "A distributed ML training task where an aggregation server coordinates edge devices. In each round, the server requests $D_i$ eligible devices; devices download the model, perform local training, and upload results. A round succeeds when at least 80% of $D_i$ target participants respond within a deadline (5–15 min). Each job in production requires 1,000–10,000 participants per round and takes 4–8 days to complete.", "fields": [{"label": "Notation", "value": "$J_i$; demand $D_i$; eligibility $f(J_i) = S_k$"}, {"label": "Boundary conditions", "value": "Paper focuses on synchronous CL. Asynchronous CL is noted as compatible since scheduling depends only on remaining resource demand. Does not include server-side aggregation in the JCT model."}], "related": ["G02", "G03"], "refs": []}], "lexicon": {"job completion time (jct)": "G01", "jct": "G01", "scheduling delay": "G02", "response collection time": "G03", "intersection resource scheduling (irs)": "G04", "irs": "G04", "resource-homogeneous job group": "G05", "contention-aware scheduling": "G06", "tier-based device matching": "G07", "starvation prevention (fairness knob ε)": "G08", "fairness knob ε": "G08", "collaborative learning job (cl job)": "G09", "cl job": "G09"}}, "dependencies": {"title": "Related Work / Dependencies", "preamble": "", "legend": [], "attribution": "", "entries": [{"rw_id": "RW01", "inferred_id": false, "name": "Bonawitz et al., 2019 (Google FL at Scale)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Venn replaces Google's job-driven random client sampling with contention-aware IRS scheduling. Why: Random matching fails under resource contention; scheduling delay is ignored.", "adopted": "CL system model (check-in/dispatch/report lifecycle); overcommit design pattern delegated to jobs.", "grounding": [], "claims": ["C01", "C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW02", "inferred_id": false, "name": "Huba et al., 2022 (Meta Papaya)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Venn replaces centralized random client-to-job matching with IRS + tier-based matching. Why: Centralized random matching is suboptimal under contention.", "adopted": "Centralized resource manager architecture that sits above all CL jobs.", "grounding": [], "claims": ["C01", "C02", "C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW03", "inferred_id": false, "name": "Paulik et al., 2021 (Apple FL Infrastructure)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Venn uses a centralized scheduler vs. Apple's client-driven sampling from a job list. Why: Client-driven sampling cannot implement contention-aware cross-job scheduling.", "adopted": "Concept of per-job device eligibility requirements.", "grounding": [{"raw": "arXiv:2102.08503", "kind": "arxiv", "target": null}], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW04", "inferred_id": false, "name": "Lai et al., 2021b (Oort)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Venn extends single-job client selection to multi-job resource scheduling; adds scheduling delay optimization. Why: Oort assumes sufficient devices are always available for a single job; it does not model inter-job contention.", "adopted": "FedScale device traces (Lai et al., 2021a) used for evaluation; participant selection based on system utility.", "grounding": [], "claims": ["C02", "C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW05", "inferred_id": false, "name": "Lai et al., 2021a (FedScale Benchmark)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: FedScale provides the 180M-item device availability and hardware trace used in Venn's evaluation. Why: Real-world trace needed to emulate diurnal availability and hardware heterogeneity.", "adopted": "Device availability trace; hardware profile data; simulation framework.", "grounding": [{"raw": "arXiv:2105.11367", "kind": "arxiv", "target": null}], "claims": ["C01", "C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW06", "inferred_id": false, "name": "Balakrishnan et al., 2022 (Diverse Client Selection)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Venn addresses multi-job resource contention; Balakrishnan et al. optimize participant diversity for a single job. Why: Submodular client selection ignores scheduling delay and inter-job competition.", "adopted": "Motivation for participant diversity in CL training.", "grounding": [], "claims": ["C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW07", "inferred_id": false, "name": "Even et al., 1975 (MCF Complexity)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Venn acknowledges the NP-hardness of the exact IRS formulation and proposes a tractable heuristic. Why: Exact integer MCF is computationally infeasible at CL scale.", "adopted": "Complexity lower bound justifying the heuristic approach.", "grounding": [], "claims": ["C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW08", "inferred_id": false, "name": "Garey et al., 1976 (Flowshop Scheduling)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Venn applies the SRPT-style insight (smallest remaining demand first) within job groups, citing Garey et al. as justification. Why: Proven effectiveness of priority-based scheduling for minimizing average completion time.", "adopted": "Smallest-remaining-demand-first ordering principle for intra-group scheduling.", "grounding": [], "claims": ["C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW09", "inferred_id": false, "name": "Wang et al., 2023 (Flint)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Venn uses the log-normal device response time model from Wang et al. for tier speed-up factor computation. Why: Empirically validated distribution model for CL device response times.", "adopted": "Log-normal response time distribution; 95th-percentile tail latency metric.", "grounding": [], "claims": ["C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW10", "inferred_id": false, "name": "He et al., 2023 (GlueFL)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Venn manages scheduling delay at the multi-job level; GlueFL optimizes bandwidth for a single job via model masking and client sampling. Why: Single-job response collection time optimization is insufficient at scale.", "adopted": "Motivation for straggler mitigation in CL response collection.", "grounding": [], "claims": ["C01", "C03"], "cross_agent": false, "is_footprint": false}], "footprint": []}, "recipes": {"title": "Solution", "files": [{"file": "algorithm.md", "role": "algorithm", "file_title": "Algorithm", "sections": [{"sec_id": "", "heading": "Problem: Intersection Resource Scheduling (IRS)", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "**Variables:**\n- $J = \\{J_1, \\ldots, J_m\\}$: set of $m$ CL jobs\n- $D = \\{D_1, \\ldots, D_m\\}$: resource demands (number of devices per round)\n- $S = S_1 \\cup \\cdots \\cup S_n$: device pool partitioned into eligibility subsets\n- $f(J_i) = S_k$: maps job $J_i$ to its eligible device subset\n- $e_{ij} \\in \\{0,1\\}$: eligibility matrix ($e_{ij}=1$ iff device $i$ is eligible for job $j$)\n- $x_{ij} \\in \\{0,1\\}$: assignment ($x_{ij}=1$ iff device $i$ is assigned to job $j$)\n- Devices arrive at times $t_1, t_2, \\ldots, t_q$\n\n**ILP Constraints (Appendix B):**\n$$\\sum_{j=1}^{m} x_{ij} \\leq 1, \\quad \\forall i \\in [1,q] \\quad \\text{(each device assigned to at most one job)}$$\n$$\\sum_{j=1}^{m} x_{ij} \\cdot e_{ij} \\leq 1, \\quad \\forall i \\in [1,q] \\quad \\text{(eligibility respected)}$$\n$$\\sum_{i=0}^{q} x_{ij} = D_j, \\quad \\forall j \\in [1,m] \\quad \\text{(demand satisfied)}$$\n\n**Objective (minimize average scheduling delay):**\n$$\\min \\sum_{j=1}^{m} T_j, \\quad T_j = \\max_i (x_{ij} \\cdot t_i)$$\n\nThis is NP-hard (reduces to integer multi-commodity flow, Even et al., 1975).", "text": "Formal ILP formulation of Intersection Resource Scheduling: variables, constraints, and the scheduling-delay-minimizing objective. NP-hard (reduces to integer multi-commodity flow, Even et al., 1975).", "warn": "", "refs": []}, {"sec_id": "", "heading": "Tier-Based Matching Condition", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "Apply tier-based matching to job $J_i$ if and only if:\n$$1 + c_i > V + c_i \\cdot g_u$$\nwhere $c_i = T_{\\text{resp}} / T_{\\text{sched}}$, $V$ is the number of tiers, and $g_u = t_u / t_0$ is the speed-up factor for tier $u$ (95th-percentile response time ratio).", "text": "The gating condition for Algorithm 2: tier restriction is applied only when it reduces total JCT.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Starvation Prevention", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "Fair-share JCT: $T_i = M \\cdot sd_i$\n\nAdjusted demand: $d'_i = d_i \\cdot \\left(\\frac{t_i}{T_i}\\right)^\\varepsilon$\n\nAdjusted group queue length: $q'_j = q_j \\cdot \\left(\\frac{\\sum_{J_i \\in G_j} T_i}{\\sum_{J_i \\in G_j} t_i}\\right)^\\varepsilon$", "text": "Fairness-knob adjustment formulas applied to per-job demand and per-group queue length before scheduling.", "warn": "", "refs": []}, {"sec_id": "Algorithm 1", "heading": "Algorithm 1: Intersection Resource Scheduling (Venn-Sched)", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Input: Job Groups G = {G1, ..., Gn}, Devices S\n\n// Step 1: Sort within each job group by ascending remaining demand\nfor Gj in G:\n    sort Ji ∈ Gj by Di in ascending order\n\n// Step 2: Generate initial allocation (scarcest group first)\nS = union of all Sj\nsort Gj by |Sj| in ascending order  // scarcest group first\nfor Gj in G:\n    S'j = S ∩ Sj\n    S = S \\ S'j  // remove allocated devices\n\n// Step 3: Greedily reallocate intersected resources\nsort Gj by |Sj| in descending order  // most abundant group first\nfor Gj in G:\n    if |S'j| > 0:\n        for Gk in G where |Sk| < |Sj| and Sk ∩ Sj ≠ ∅:\n            m'j, m'k = get-queue-len()\n            if m'j / |S'j| > m'k / |S'k|:\n                S'j = S'j ∪ (Sj ∩ Sk)\n                S'k = S'k - S'j\n            else:\n                break\n\nReturn {Gj[0], S'j} for all j  // first job in each group + its allocated devices", "text": "Pseudocode for the two-level scheduling heuristic: intra-group sort, scarcest-first initial allocation, then greedy cross-group reallocation.", "warn": "", "refs": []}, {"sec_id": "Algorithm 2", "heading": "Algorithm 2: Device Matching (Venn-Match)", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Input: Jobs Ji, Devices S'j from Venn-Sched(G, S)\n\n// Partition devices into V tiers by hardware capability\nS = {S1, S2, ..., SV}  // evenly partition by hardware score\n\n// Compute speed-up factors from profiling\ngv = tv / t0 for v in [1, V]  // 95th-percentile response time ratio\n\nFunction Venn-Match(Job Ji, Resource S'j):\n    ci = T_response / T_schedule  // from previous round profile\n\n    // Randomly select a tier\n    u = randint(0, V)\n\n    // Apply tier-based matching only if it reduces JCT\n    if V + gu * ci < ci + 1:\n        S'j = S'j ∩ Su  // restrict to tier u devices\n    \n    Return {Ji, S'j}", "text": "Pseudocode for tier-based device matching: partition into V tiers, randomly pick a tier, restrict only if the JCT condition holds.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Step-by-Step Explanation", "kind": "steps", "markdown": "", "steps": ["Algorithm 1 — Intra-group sort: Within each group, smallest-remaining-demand jobs go first. This is proven optimal for average scheduling delay within a group (analogous to Shortest Remaining Processing Time).", "Algorithm 1 — Initial allocation: Allocate resources starting from the group with the fewest eligible devices (scarcest). This ensures scarce-resource groups get first pick, preventing starvation of high-demand-diversity jobs.", "Algorithm 1 — Cross-group reallocation: For groups with abundant resources, check if acquiring intersected resources from scarcer groups reduces average scheduling delay. The ratio $m'_j / |S'_j|$ measures the \"pressure\" (affected jobs per allocated device). If the requesting group has higher pressure than the donor group, reallocation helps average JCT.", "Algorithm 2 — Tier partitioning groups devices by hardware score into V equal buckets.", "Algorithm 2 — Speed-up profiling uses 95th-percentile tail latency to represent response collection time per tier.", "Algorithm 2 — The condition gates tier assignment: tier-based matching increases scheduling delay by factor $V$ but reduces response time by factor $g$. It is applied only when the net effect is a JCT reduction.", "Algorithm 2 — Randomized tier selection (vs. always picking the best tier) ensures each job sees device diversity across rounds, avoiding model bias toward data from high-end devices."], "fields": [], "code": "", "text": "Algorithm 1: 1) intra-group sort; 2) initial allocation from scarcest group; 3) cross-group reallocation by pressure ratio. Algorithm 2: 1) tier partitioning; 2) speed-up profiling; 3) gating condition; 4) randomized tier selection.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Complexity Analysis", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Algorithm 1", "value": "$\\max(O(m \\log m), O(n^2))$ where $m$ = number of jobs, $n$ = number of job groups — $O(m \\log m)$: sorting jobs within groups; $O(n^2)$: pairwise comparison of job groups in cross-group reallocation"}, {"label": "Algorithm 2", "value": "$O(V)$ per job (tier profiling and assignment)"}, {"label": "Overall", "value": "Linear in the number of jobs (per scheduling event), scalable to 1000+ jobs with sub-millisecond latency (Figure 10)"}], "code": "", "text": "Algorithm 1 max(O(m log m), O(n^2)); Algorithm 2 O(V) per job; overall linear in job count, sub-millisecond at 1000+ jobs (Figure 10).", "warn": "", "refs": []}]}, {"file": "architecture.md", "role": "architecture", "file_title": "System Architecture", "sections": [{"sec_id": "", "heading": "Overview", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Venn is a standalone, centralized CL resource manager that operates as a layer above all CL jobs. It receives device check-ins and job resource requests, runs its scheduling and matching algorithms, and assigns each device to exactly one job per check-in event.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component Graph", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "[CL Job i]  ---(resource request: requirements + demand Di)---> [Venn Server]\n[Edge Device] ---(check-in)---> [Venn Server]\n[Venn Server] ---(assignment)---> [Edge Device]\n[Edge Device] ---(participate)---> [CL Job i]\n[CL Job i] ---(dispatch computation plan)---> [Edge Device]\n[Edge Device] ---(report results)---> [CL Job i]", "text": "Component graph: CL jobs and edge devices both talk to the Venn Server, which brokers assignments; devices then participate directly with the job.", "warn": "", "refs": []}, {"sec_id": "1", "heading": "1. Request Handler", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Receives resource requests from CL jobs and check-ins from devices."}, {"label": "Inputs", "value": "Job resource request (device requirements: min CPU, memory, software version, data type; resource demand: $D_i$ devices per round). Device check-in (device ID, hardware profile, eligibility tags)."}, {"label": "Outputs", "value": "Updated job queue $J$; updated device pool $S$."}, {"label": "Key design choice", "value": "Venn triggers re-scheduling on both job arrival and job completion events, not on a fixed polling interval."}], "code": "", "text": "Purpose: Receives resource requests from CL jobs and check-ins from devices.\nInputs: Job resource request (device requirements: min CPU, memory, software version, data type; resource demand: $D_i$ devices per round). Device check-in (device ID, hardware profile, eligibility tags).\nOutputs: Updated job queue $J$; updated device pool $S$.\nKey design choice: Venn triggers re-scheduling on both job arrival and job completion events, not on a fixed polling interval.", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "2", "heading": "2. Eligibility Mapper", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Maps each job to its eligible device subset based on declared requirements."}, {"label": "Inputs", "value": "Device hardware profiles (CPU score, memory score, software version, data availability); job requirements."}, {"label": "Outputs", "value": "Eligibility function $f(J_i) = S_k$; job groups $G = \\{G_1, \\ldots, G_n\\}$ (Resource-Homogeneous Job Groups)."}, {"label": "Key design choice", "value": "Devices are stratified into 4 hardware categories (General, Compute-Rich, Memory-Rich, High-Performance) based on CPU and memory thresholds (Figure 8a)."}], "code": "", "text": "Purpose: Maps each job to its eligible device subset based on declared requirements.\nInputs: Device hardware profiles (CPU score, memory score, software version, data availability); job requirements.\nOutputs: Eligibility function $f(J_i) = S_k$; job groups $G = \\{G_1, \\ldots, G_n\\}$ (Resource-Homogeneous Job Groups).\nKey design choice: Devices are stratified into 4 hardware categories (General, Compute-Rich, Memory-Rich, High-Performance) based on CPU and memory thresholds (Figure 8a).", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "3", "heading": "3. Contention-Aware Scheduler (IRS — Algorithm 1)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Determines a job scheduling order that minimizes average scheduling delay by accounting for overlapping device eligibility sets."}, {"label": "Inputs", "value": "Job groups $G$; current device pool $S$; queue lengths per group."}, {"label": "Outputs", "value": "Prioritized scheduling order per group; resource allocation plan $\\{G_j[0], S'_j\\}$ for each group."}, {"label": "Key design choice", "value": "Two-level decomposition — intra-group sorting by ascending remaining demand; inter-group allocation starting from the scarcest group, then greedy reallocation based on queue-length-to-allocated-resource ratio."}, {"label": "Interaction", "value": "Invoked by the Request Handler on job arrival/completion; outputs feed the Device Matcher."}], "code": "", "text": "Purpose: Determines a job scheduling order that minimizes average scheduling delay by accounting for overlapping device eligibility sets.\nInputs: Job groups $G$; current device pool $S$; queue lengths per group.\nOutputs: Prioritized scheduling order per group; resource allocation plan $\\{G_j[0], S'_j\\}$ for each group.\nKey design choice: Two-level decomposition — intra-group sorting by ascending remaining demand; inter-group allocation starting from the scarcest group, then greedy reallocation based on queue-length-to-allocated-resource ratio.\nInteraction: Invoked by the Request Handler on job arrival/completion; outputs feed the Device Matcher.", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "4", "heading": "4. Resource-Aware Device Matcher (Algorithm 2)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "For each served job, decides whether to restrict device assignment to a single hardware tier to reduce response collection time."}, {"label": "Inputs", "value": "Jobs currently being served; device tier assignments $\\{S_1, \\ldots, S_V\\}$; per-tier speed-up factors $g_v = t_v / t_0$; ratio $c_i = T_{\\text{resp}} / T_{\\text{sched}}$ from previous round profile."}, {"label": "Outputs", "value": "Refined device assignment $\\{J_i, S'_j \\cap S_u\\}$ for each served job."}, {"label": "Key design choice", "value": "Condition $1 + c_i > V + c_i g_u$ gates tier-based matching so it is applied only when the JCT reduction from faster response outweighs the JCT increase from higher scheduling delay (factor $V$). Randomized tier selection exposes jobs to device diversity."}, {"label": "Interaction", "value": "Receives output of Algorithm 1; sends final assignments to the Request Handler for dispatch."}], "code": "", "text": "Purpose: For each served job, decides whether to restrict device assignment to a single hardware tier to reduce response collection time.\nInputs: Jobs currently being served; device tier assignments $\\{S_1, \\ldots, S_V\\}$; per-tier speed-up factors $g_v = t_v / t_0$; ratio $c_i = T_{\\text{resp}} / T_{\\text{sched}}$ from previous round profile.\nOutputs: Refined device assignment $\\{J_i, S'_j \\cap S_u\\}$ for each served job.\nKey design choice: Condition $1 + c_i > V + c_i g_u$ gates tier-based matching so it is applied only when the JCT reduction from faster response outweighs the JCT increase from higher scheduling delay (factor $V$). Randomized tier selection exposes jobs to device diversity.\nInteraction: Receives output of Algorithm 1; sends final assignments to the Request Handler for dispatch.", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "5", "heading": "5. Time-Series Eligibility Database", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Tracks historical device eligibility rates to handle diurnal availability patterns."}, {"label": "Inputs", "value": "Real-time device check-in events with timestamps."}, {"label": "Outputs", "value": "24-hour averaged eligibility rates per device category for input to Algorithm 1."}, {"label": "Key design choice", "value": "24-hour averaging window makes the scheduler robust to intra-day fluctuations while remaining accurate for multi-day CL jobs."}], "code": "", "text": "Purpose: Tracks historical device eligibility rates to handle diurnal availability patterns.\nInputs: Real-time device check-in events with timestamps.\nOutputs: 24-hour averaged eligibility rates per device category for input to Algorithm 1.\nKey design choice: 24-hour averaging window makes the scheduler robust to intra-day fluctuations while remaining accurate for multi-day CL jobs.", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "6", "heading": "6. Starvation Prevention Module", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Applies the fairness knob $\\varepsilon$ to prevent large jobs from being indefinitely starved."}, {"label": "Inputs", "value": "Per-job usage time $t_i$; fair-share JCT $T_i = M \\cdot sd_i$; fairness parameter $\\varepsilon$."}, {"label": "Outputs", "value": "Adjusted effective demand $d'_i$ and group queue lengths $q'_j$ fed to Algorithm 1."}, {"label": "Interaction", "value": "Active in production deployments (all evaluation results in §5 use starvation prevention)."}], "code": "", "text": "Purpose: Applies the fairness knob $\\varepsilon$ to prevent large jobs from being indefinitely starved.\nInputs: Per-job usage time $t_i$; fair-share JCT $T_i = M \\cdot sd_i$; fairness parameter $\\varepsilon$.\nOutputs: Adjusted effective demand $d'_i$ and group queue lengths $q'_j$ fed to Algorithm 1.\nInteraction: Active in production deployments (all evaluation results in §5 use starvation prevention).", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "", "heading": "Workflow (Per Scheduling Event)", "kind": "steps", "markdown": "", "steps": ["Device checks in → Eligibility Mapper tags device → device added to pool $S$.", "Job submits request → Request Handler queues job → Eligibility Mapper assigns to group $G_j$.", "Contention-Aware Scheduler (Algorithm 1) runs → produces per-group scheduling order and initial allocation.", "Resource-Aware Device Matcher (Algorithm 2) refines assignment for currently served jobs.", "Assignments dispatched to devices → devices participate in assigned CL job.", "Devices report results to CL job server directly (standard CL protocol, not through Venn)."], "fields": [], "code": "", "text": "Six-step per-scheduling-event workflow from device check-in through result reporting.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Responsibility Delegation", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Venn explicitly delegates the following to individual CL jobs:\n- Device fault tolerance and overcommit decisions\n- Custom device selection criteria\n- Privacy mechanisms (secure aggregation, differential privacy)", "warn": "", "refs": []}]}, {"file": "constraints.md", "role": "constraints", "file_title": "Constraints and Limitations", "sections": [{"sec_id": "BC1", "heading": "BC1: Centralized Scheduler Assumption", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Venn requires a centralized server that all devices check in to and that has global visibility of all active CL jobs. This is analogous to the centralized designs of Meta (Huba et al., 2022) but differs from Apple's client-driven design (Paulik et al., 2021)."}, {"label": "When it holds", "value": "Cloud-managed CL deployments (Google, Meta production systems)."}, {"label": "When it fails", "value": "Fully decentralized CL where there is no central coordinator."}], "code": "", "text": "Description: Venn requires a centralized server that all devices check in to and that has global visibility of all active CL jobs. This is analogous to the centralized designs of Meta (Huba et al., 2022) but differs from Apple's client-driven design (Paulik et al., 2021).\nWhen it holds: Cloud-managed CL deployments (Google, Meta production systems).\nWhen it fails: Fully decentralized CL where there is no central coordinator.", "warn": "", "refs": []}, {"sec_id": "BC2", "heading": "BC2: Synchronous CL Assumption (Primary Focus)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "The paper primarily evaluates synchronous CL where each round requires at least 80% of target participants to respond within a 5–15 min deadline. Scheduling decisions depend on \"remaining resource demand.\""}, {"label": "When it holds", "value": "Standard synchronous federated learning (Yang et al., 2018; Bonawitz et al., 2019)."}, {"label": "When it fails", "value": "Asynchronous CL where participation windows overlap. The paper notes asynchronous CL is compatible with Venn's scheduling decisions (which depend only on remaining resource demand, not submission timing), but does not evaluate it."}], "code": "", "text": "Description: The paper primarily evaluates synchronous CL where each round requires at least 80% of target participants to respond within a 5–15 min deadline. Scheduling decisions depend on \"remaining resource demand.\"\nWhen it holds: Standard synchronous federated learning (Yang et al., 2018; Bonawitz et al., 2019).\nWhen it fails: Asynchronous CL where participation windows overlap. The paper notes asynchronous CL is compatible with Venn's scheduling decisions (which depend only on remaining resource demand, not submission timing), but does not evaluate it.", "warn": "", "refs": []}, {"sec_id": "BC3", "heading": "BC3: Discrete Eligibility Categories", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "The evaluation stratifies devices into 4 discrete categories (General, Compute-Rich, Memory-Rich, High-Performance) based on CPU/memory thresholds. The IRS formulation assumes discrete job groups."}, {"label": "When it holds", "value": "When hardware requirements create natural thresholds."}, {"label": "When it fails", "value": "Continuous or high-dimensional device eligibility spaces (e.g., fine-grained numerical thresholds on dozens of features)."}], "code": "", "text": "Description: The evaluation stratifies devices into 4 discrete categories (General, Compute-Rich, Memory-Rich, High-Performance) based on CPU/memory thresholds. The IRS formulation assumes discrete job groups.\nWhen it holds: When hardware requirements create natural thresholds.\nWhen it fails: Continuous or high-dimensional device eligibility spaces (e.g., fine-grained numerical thresholds on dozens of features).", "warn": "", "refs": []}, {"sec_id": "BC4", "heading": "BC4: Tier-Based Matching Requires Historical Profile Data", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Algorithm 2 requires per-tier response time profiles from previous rounds ($g_v = t_v / t_0$). First-round jobs skip tier-based matching."}, {"label": "When it holds", "value": "Multi-round CL jobs that have completed at least one round."}, {"label": "When it fails", "value": "Single-round jobs or first-round of any new CL job (cold start)."}], "code": "", "text": "Description: Algorithm 2 requires per-tier response time profiles from previous rounds ($g_v = t_v / t_0$). First-round jobs skip tier-based matching.\nWhen it holds: Multi-round CL jobs that have completed at least one round.\nWhen it fails: Single-round jobs or first-round of any new CL job (cold start).", "warn": "", "refs": []}, {"sec_id": "BC5", "heading": "BC5: Log-Normal Response Time Distribution", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Venn models device response time as log-normally distributed and uses the 95th percentile as tail latency for tier speed-up computation."}, {"label": "When it holds", "value": "Consistent with empirical CL deployment data (Wang et al., 2023)."}, {"label": "When it fails", "value": "Highly bimodal or heavy-tailed response distributions beyond log-normal."}], "code": "", "text": "Description: Venn models device response time as log-normally distributed and uses the 95th percentile as tail latency for tier speed-up computation.\nWhen it holds: Consistent with empirical CL deployment data (Wang et al., 2023).\nWhen it fails: Highly bimodal or heavy-tailed response distributions beyond log-normal.", "warn": "", "refs": []}, {"sec_id": "L1", "heading": "L1: Scheduling Optimality Guarantee is Limited to Two Job Groups", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Lemma 2 proves optimality of Venn's inter-group scheduling only for the two-group case. For $n > 2$ groups, Venn applies a greedy pairwise comparison that is not proven globally optimal."}, {"label": "Impact", "value": "Near-optimal in practice (as shown by simulation results) but no formal bound for general $n$."}], "code": "", "text": "Description: Lemma 2 proves optimality of Venn's inter-group scheduling only for the two-group case. For $n > 2$ groups, Venn applies a greedy pairwise comparison that is not proven globally optimal.\nImpact: Near-optimal in practice (as shown by simulation results) but no formal bound for general $n$.", "warn": "", "refs": []}, {"sec_id": "L2", "heading": "L2: Starvation Prevention Trades JCT for Fairness", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Enabling starvation prevention (any $\\varepsilon > 0$) reduces average JCT improvement. At $\\varepsilon=2$, 69% of jobs meet fair-share JCT, but average JCT speedup decreases compared to $\\varepsilon=0$."}, {"label": "Impact", "value": "Operators must tune $\\varepsilon$ based on their JCT vs. fairness tradeoff requirements."}], "code": "", "text": "Description: Enabling starvation prevention (any $\\varepsilon > 0$) reduces average JCT improvement. At $\\varepsilon=2$, 69% of jobs meet fair-share JCT, but average JCT speedup decreases compared to $\\varepsilon=0$.\nImpact: Operators must tune $\\varepsilon$ based on their JCT vs. fairness tradeoff requirements.", "warn": "", "refs": []}, {"sec_id": "L3", "heading": "L3: Device Fault Tolerance Delegated to CL Jobs", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Venn does not handle device dropouts during training. This responsibility is delegated to individual CL jobs (e.g., overcommit decisions)."}, {"label": "Impact", "value": "If a CL job's fault tolerance policy is suboptimal, Venn's assignments may not translate to completed rounds."}], "code": "", "text": "Description: Venn does not handle device dropouts during training. This responsibility is delegated to individual CL jobs (e.g., overcommit decisions).\nImpact: If a CL job's fault tolerance policy is suboptimal, Venn's assignments may not translate to completed rounds.", "warn": "", "refs": []}, {"sec_id": "L4", "heading": "L4: No Cross-Round Global Optimization", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Venn optimizes per-round scheduling independently. It does not jointly optimize JCT across multiple rounds of the same job (e.g., no lookahead for future device availability)."}, {"label": "Impact", "value": "Multi-round efficiency is approximated by using 24-hour averaged eligibility rates, not exact future predictions."}], "code": "", "text": "Description: Venn optimizes per-round scheduling independently. It does not jointly optimize JCT across multiple rounds of the same job (e.g., no lookahead for future device availability).\nImpact: Multi-round efficiency is approximated by using 24-hour averaged eligibility rates, not exact future predictions.", "warn": "", "refs": []}, {"sec_id": "L5", "heading": "L5: Evaluation Scale", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Description", "value": "Simulation uses up to 50 jobs; real testbed uses 20 jobs. Production CL systems may handle hundreds of concurrent jobs."}, {"label": "Impact", "value": "$O(n^2)$ inter-group complexity may become a bottleneck if the number of distinct eligibility categories grows very large."}], "code": "", "text": "Description: Simulation uses up to 50 jobs; real testbed uses 20 jobs. Production CL systems may handle hundreds of concurrent jobs.\nImpact: $O(n^2)$ inter-group complexity may become a bottleneck if the number of distinct eligibility categories grows very large.", "warn": "", "refs": []}]}, {"file": "heuristics.md", "role": "heuristics", "file_title": "Heuristics", "sections": [{"sec_id": "H01", "heading": "H01: Smallest Remaining Demand First (Intra-Group)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Within a job group (same eligibility), prioritizing jobs with fewer remaining device needs minimizes average scheduling delay. Analogous to Shortest Remaining Processing Time (SRPT) proven optimal for minimizing average completion time in single-machine scheduling (Garey et al., 1976). Lemma 1 + Appendix C prove this is also globally optimal when combined with the inter-group step."}, {"label": "Sensitivity", "value": "low — this is a provably optimal strategy for within-group scheduling."}, {"label": "Bounds", "value": "\"Remaining resource demand\" defaults to current round's unmet demand $D_i$; can optionally use total remaining rounds × demand if future demand is known."}, {"label": "Source", "value": "§4.2.1, Algorithm 1 line 3, Appendix C"}], "code": "", "text": "Rationale: Within a job group (same eligibility), prioritizing jobs with fewer remaining device needs minimizes average scheduling delay. Analogous to Shortest Remaining Processing Time (SRPT) proven optimal for minimizing average completion time in single-machine scheduling (Garey et al., 1976). Lemma 1 + Appendix C prove this is also globally optimal when combined with the inter-group step.\nSensitivity: low — this is a provably optimal strategy for within-group scheduling.\nBounds: \"Remaining resource demand\" defaults to current round's unmet demand $D_i$; can optionally use total remaining rounds × demand if future demand is known.\nSource: §4.2.1, Algorithm 1 line 3, Appendix C", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "H02", "heading": "H02: Scarcest Group First (Initial Inter-Group Allocation)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Allocating devices to the job group with the fewest eligible devices first prevents resource-rich groups from monopolizing intersection resources and starving resource-scarce groups. This mirrors max-min fairness intuitions but applied to device eligibility rather than bandwidth."}, {"label": "Sensitivity", "value": "medium — effectiveness depends on how skewed eligibility distributions are; most impactful when one group is severely resource-constrained."}, {"label": "Bounds", "value": "Applied once per scheduling invocation as the initialization step; subsequent cross-group reallocation can override the initial allocation."}, {"label": "Source", "value": "§4.2.2, Algorithm 1 lines 5–9"}], "code": "", "text": "Rationale: Allocating devices to the job group with the fewest eligible devices first prevents resource-rich groups from monopolizing intersection resources and starving resource-scarce groups. This mirrors max-min fairness intuitions but applied to device eligibility rather than bandwidth.\nSensitivity: medium — effectiveness depends on how skewed eligibility distributions are; most impactful when one group is severely resource-constrained.\nBounds: Applied once per scheduling invocation as the initialization step; subsequent cross-group reallocation can override the initial allocation.\nSource: §4.2.2, Algorithm 1 lines 5–9", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "H03", "heading": "H03: Queue-Length-to-Allocated-Resource Ratio for Cross-Group Reallocation", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "When reallocating intersected resources from a scarce group to an abundant group, the ratio $m'_j / |S'_j|$ measures how much scheduling delay improvement can be achieved per device transferred. Transferring resources from a group with lower ratio to one with higher ratio reduces average scheduling delay (proven for two groups in Lemma 2; extended greedily to $n$ groups)."}, {"label": "Sensitivity", "value": "high — the quality of the $m'$ (affected queue length) estimate directly affects scheduling quality; approximating $m'$ as the group queue length is simpler but may miss cross-group effects."}, {"label": "Bounds", "value": "Reallocation stops when the ratio condition fails (Algorithm 1 line 18–19), preventing over-allocation to any single group."}, {"label": "Source", "value": "§4.2.2, Algorithm 1 lines 10–23, Appendix D (Lemma 2)"}], "code": "", "text": "Rationale: When reallocating intersected resources from a scarce group to an abundant group, the ratio $m'_j / |S'_j|$ measures how much scheduling delay improvement can be achieved per device transferred. Transferring resources from a group with lower ratio to one with higher ratio reduces average scheduling delay (proven for two groups in Lemma 2; extended greedily to $n$ groups).\nSensitivity: high — the quality of the $m'$ (affected queue length) estimate directly affects scheduling quality; approximating $m'$ as the group queue length is simpler but may miss cross-group effects.\nBounds: Reallocation stops when the ratio condition fails (Algorithm 1 line 18–19), preventing over-allocation to any single group.\nSource: §4.2.2, Algorithm 1 lines 10–23, Appendix D (Lemma 2)", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "H04", "heading": "H04: Conditional Tier-Based Matching (JCT Reduction Condition)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Tier-based matching reduces response time by restricting devices to a homogeneous-capacity tier but increases scheduling delay by factor $V$ (fewer devices to choose from). The condition $1 + c_i > V + c_i g_u$ ensures tier-based matching is applied only when the response time savings outweigh the scheduling delay cost. This avoids worsening JCT under high contention (when scheduling delay dominates)."}, {"label": "Sensitivity", "value": "high — sensitive to the accuracy of $c_i = T_{\\text{resp}} / T_{\\text{sched}}$ estimates from previous rounds and to $g_v$ tier speed-up profiles; cold-start jobs (first round) bypass matching entirely."}, {"label": "Bounds", "value": "$V$ should be tuned based on resource pool size; Figure 13 shows gains plateau beyond a certain tier count. Randomized tier selection (rather than always best tier) prevents convergence to a subset of devices."}, {"label": "Source", "value": "§4.3, Algorithm 2 lines 6–8, Figure 7, Figure 13"}], "code": "", "text": "Rationale: Tier-based matching reduces response time by restricting devices to a homogeneous-capacity tier but increases scheduling delay by factor $V$ (fewer devices to choose from). The condition $1 + c_i > V + c_i g_u$ ensures tier-based matching is applied only when the response time savings outweigh the scheduling delay cost. This avoids worsening JCT under high contention (when scheduling delay dominates).\nSensitivity: high — sensitive to the accuracy of $c_i = T_{\\text{resp}} / T_{\\text{sched}}$ estimates from previous rounds and to $g_v$ tier speed-up profiles; cold-start jobs (first round) bypass matching entirely.\nBounds: $V$ should be tuned based on resource pool size; Figure 13 shows gains plateau beyond a certain tier count. Randomized tier selection (rather than always best tier) prevents convergence to a subset of devices.\nSource: §4.3, Algorithm 2 lines 6–8, Figure 7, Figure 13", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}, {"sec_id": "H05", "heading": "H05: 24-Hour Eligibility Rate Averaging for Dynamic Supply", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Device availability follows a diurnal pattern (Figure 2a). Using instantaneous eligibility rates as input to the scheduler leads to oscillating decisions. Averaging over the past 24 hours smooths the signal while preserving the day-level trend, making the scheduler \"farsighted\" for multi-day CL jobs."}, {"label": "Sensitivity", "value": "medium — window length of 24 hours is chosen to match the diurnal period; shorter windows increase variance, longer windows lag behind secular trends."}, {"label": "Bounds", "value": "24-hour window assumed fixed; eligibility history stored in a time-series database queried by the scheduler."}, {"label": "Source", "value": "§4.4 (Dynamic resource supply), Figure 2a"}], "code": "", "text": "Rationale: Device availability follows a diurnal pattern (Figure 2a). Using instantaneous eligibility rates as input to the scheduler leads to oscillating decisions. Averaging over the past 24 hours smooths the signal while preserving the day-level trend, making the scheduler \"farsighted\" for multi-day CL jobs.\nSensitivity: medium — window length of 24 hours is chosen to match the diurnal period; shorter windows increase variance, longer windows lag behind secular trends.\nBounds: 24-hour window assumed fixed; eligibility history stored in a time-series database queried by the scheduler.\nSource: §4.4 (Dynamic resource supply), Figure 2a", "warn": "", "refs": [{"raw": "src/execution/venn_scheduler.py", "kind": "source", "target": null}]}]}]}}

<script>
"use strict";
(function () {
  const GLYPH = { question:"Q", experiment:"✦", decision:"→", dead_end:"✗", pivot:"↻", insight:"!", default:"•" };
  const TYPES = ["question","experiment","decision","dead_end","pivot","insight"];

  let DATA;
  try {
    // The payload sits between the BEGIN/END marker comments (kept in-file so the
    // skill can re-inject). Strip ONLY those two named markers before parsing; the
    // rest of textContent is pure JSON. (Marker text is not written literally here,
    // so it stays a single injection site.)
    var raw = document.getElementById("ara-data").textContent
                .replace(/\/\*\s*__ARA_DATA_(?:BEGIN|END)__\s*\*\//g, "");
    DATA = JSON.parse(raw);
  } catch (e) {
    document.getElementById("detail").innerHTML =
      '<div class="none">Could not parse embedded ARA data: ' + String(e) + '</div>';
    return;
  }

  const nodes = DATA.nodes || [];
  const byId = new Map(nodes.map(n => [n.id, n]));
  const kids = new Map();
  nodes.forEach(n => kids.set(n.id, []));
  let roots = [];
  nodes.forEach(n => {
    if (n.parent && byId.has(n.parent)) kids.get(n.parent).push(n.id);
    else roots.push(n.id);
  });
  // Traversal order: explicit DATA.order if given, else DFS from roots.
  let order = Array.isArray(DATA.order) && DATA.order.length ? DATA.order.filter(id => byId.has(id)) : [];
  if (!order.length) { const seen=new Set(); const dfs=id=>{if(seen.has(id))return;seen.add(id);order.push(id);(kids.get(id)||[]).forEach(dfs)}; roots.forEach(dfs); }

  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const glyph = t => GLYPH[t] || GLYPH.default;
  const cls = t => TYPES.includes(t) ? t : "default";

  // ---- header ----
  const m = DATA.meta || {};
  document.getElementById("h-title").textContent = m.title || "ARA Trajectory";
  document.getElementById("h-sub").textContent =
    [ (m.authors||[]).join(", "), m.venue, m.year ].filter(Boolean).join(" · ");
  if (m.abstract) document.getElementById("h-abstract").textContent = m.abstract;
  else document.getElementById("h-abstract-wrap").style.display = "none";

  const ftype = document.getElementById("ftype");
  const present = [...new Set(nodes.map(n => n.type))];
  TYPES.concat(present.filter(t=>!TYPES.includes(t))).filter(t=>present.includes(t))
    .forEach(t => { const o=document.createElement("option"); o.value=t; o.textContent=t; ftype.appendChild(o); });

  // ---- minimal markdown-table renderer ----
  function renderMd(md){
    if(!md) return "";
    const lines = String(md).split("\n");
    let out=[], i=0;
    while(i<lines.length){
      if(/^\s*\|/.test(lines[i]) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        const row = l => l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
        const head = row(lines[i]); i+=2; const body=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){ body.push(row(lines[i])); i++; }
        out.push('<table class="md"><thead><tr>'+head.map(h=>"<th>"+esc(h)+"</th>").join("")+
          '</tr></thead><tbody>'+body.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      } else { if(lines[i].trim()) out.push("<div>"+esc(lines[i])+"</div>"); i++; }
    }
    return out.join("");
  }

  // ---- detail pane ----
  function block(title, tag, inner, open, cls){
    return '<details class="block'+(cls?" "+cls:"")+'"'+(open?" open":"")+'><summary>'+esc(title)+
      (tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</summary><div class="body">'+inner+'</div></details>';
  }
  function chips(arr, klass){ return arr&&arr.length ? '<div class="chips">'+arr.map(x=>'<span class="chip '+(klass||"")+'">'+esc(x)+'</span>').join("")+'</div>' : ""; }

  function renderDetail(n){
    const d = document.getElementById("detail");
    let h = '<div class="dhead"><span class="badge '+cls(n.type)+'">'+esc(n.type)+'</span>'+
      '<span class="did">'+esc(n.id)+'</span>'+
      (n.support_level?'<span class="pill '+esc(n.support_level)+'">'+esc(n.support_level)+'</span>':'')+
      (n.isolated?'<span class="pill iso">isolated</span>':'')+'</div>';
    h += '<div class="dtitle">'+esc(n.title||"(untitled)")+'</div>';

    // reasoning (primary, always open) — the agent's thinking IS the content of a step
    let reason="";
    if(n.thinking){
      reason += '<div class="lead">'+esc(n.thinking)+'</div>';
      if(n.body) reason += '<div class="didwhat">what it did</div><div>'+esc(n.body)+'</div>';
    } else {
      reason += n.body ? '<div class="lead">'+esc(n.body)+'</div>' : '<div class="empty">No description.</div>';
    }
    if(n.depends_on&&n.depends_on.length) reason += chips(n.depends_on.map(x=>"⇠ depends on "+x));
    if(n.source_refs&&n.source_refs.length) reason += chips(n.source_refs, "ext");
    if(n.built_on&&n.built_on.length) reason += chipRow("built on", n.built_on, "chip-built");
    if(n.rejected_here&&n.rejected_here.length) reason += chipRow("rejected here", n.rejected_here, "chip-rej");
    if(n.recipe_refs&&n.recipe_refs.length) reason += recipeChips(n.recipe_refs);
    h += block(n.thinking?"reasoning":"what", n.type, reason, true, "reason");

    // result (the grounded payload) — open
    const r = n.result||{};
    if((r.sources&&r.sources.length)||(r.figures&&r.figures.length)||(r.tables&&r.tables.length)||(r.data&&r.data.length)){
      let s="";
      (r.figures||[]).forEach(f=>{ s+='<figure><img src="'+esc(f.img)+'" alt="'+esc(f.caption||f.id)+'"/>'+
        (f.caption?'<figcaption>'+esc(f.caption)+'</figcaption>':'')+'</figure>'; });
      (r.tables||[]).forEach(t=>{ s+=(t.caption?'<div class="empty">'+esc(t.caption)+'</div>':'')+renderMd(t.markdown); });
      (r.sources||[]).forEach(q=>{ s+='<div class="quote">'+esc(q.quote)+(q.ref?'<div class="ref">← '+esc(q.ref)+'</div>':'')+'</div>'; });
      (r.data||[]).forEach(x=>{ s+='<div class="ptr">⛁ <span class="path">'+esc(x.path)+'</span>'+(x.note?' — '+esc(x.note):'')+'</div>'; });
      h += block("result", "", s, true);
    }

    // why (claims) — supporting detail, collapsed
    if(n.why&&n.why.length){
      const w = n.why.map(c=>{
        let s='<div class="claim"><h4>'+esc(c.id)+(c.title?' — '+esc(c.title):'')+'</h4>';
        if(c.statement) s+='<div class="kv">'+esc(c.statement)+'</div>';
        if(c.status) s+='<div class="kv"><b>status</b> <span class="status '+esc(String(c.status).toLowerCase())+'">'+esc(c.status)+'</span></div>';
        if(c.conditions) s+='<div class="kv"><b>conditions</b> '+esc(c.conditions)+'</div>';
        if(c.falsification) s+='<div class="kv"><b>falsified if</b> '+esc(c.falsification)+'</div>';
        if(c.dependencies&&c.dependencies.length) s+='<div class="kv"><b>depends on</b> '+esc(c.dependencies.join(", "))+'</div>';
        if(c.provenance) s+='<div class="kv"><span class="prov">provenance: '+esc(c.provenance)+'</span></div>';
        return s+'</div>';
      }).join("");
      h += block("why", n.why.map(c=>c.id).join(" · "), w);
    }

    // how verified (experiments) — supporting detail, collapsed
    if(n.verified_by&&n.verified_by.length){
      const v = n.verified_by.map(e=>'<div class="claim"><h4>'+esc(e.id)+(e.title?' — '+esc(e.title):'')+'</h4>'+
        (e.run?'<div class="kv"><b>run</b> <span class="path mono">'+esc(e.run)+'</span></div>':'')+
        (e.setup?'<div class="kv"><b>setup</b> '+esc(e.setup)+'</div>':'')+
        (e.metrics?'<div class="kv"><b>metrics</b> '+esc(e.metrics)+'</div>':'')+'</div>').join("");
      h += block("how verified", n.verified_by.map(e=>e.id).join(" · "), v);
    }

    // artifact pointers (src/artifacts.md) — collapsed
    if(n.artifact&&n.artifact.length){
      const a = n.artifact.map(x=>'<div class="ptr">▸ <b>'+esc(x.name)+'</b> — <span class="path">'+esc(x.pointer)+'</span>'+
        (x.what?'<div class="empty">'+esc(x.what)+'</div>':'')+'</div>').join("");
      h += block("artifact", "pointer", a);
    }

    d.innerHTML = h;
    if(typeof LEX!=="undefined" && LEX) linkifyConcepts(d);
    d.scrollTop = 0;
  }

  // ---- map ----
  let selected = null;
  function selectNode(id){
    if(!byId.has(id)) return;
    selected = id;
    document.querySelectorAll(".node").forEach(el=>el.classList.toggle("sel", el.dataset.id===id));
    const el = document.querySelector('.node[data-id="'+CSS.escape(id)+'"]');
    if(el) el.scrollIntoView({block:"nearest"});
    renderDetail(byId.get(id));
    rstat();
  }

  function nodeRow(n){
    const row = document.createElement("div");
    row.className = "node "+(n.type==="dead_end"?"dead":"");
    row.dataset.id = n.id; row.dataset.type = n.type;
    // calmer than before: one glyph + id + (quiet) cross-edge marker; the ⊕/⊘ count soup is gone.
    row.innerHTML = '<span class="glyph '+cls(n.type)+'">'+glyph(n.type)+'</span>'+
      '<span><span class="meta"><span class="nid">'+esc(n.id)+'</span>'+
      (n.depends_on&&n.depends_on.length?'<span class="dep" title="depends on '+esc(n.depends_on.join(", "))+'">⇠ '+esc(n.depends_on.join(","))+'</span>':'')+
      '</span><div class="ntitle">'+esc(n.title||n.body||"(untitled)")+'</div></span>';
    row.addEventListener("click", ()=>selectNode(n.id));
    // hover a node to highlight its cross-edge targets (gentler than always-on connectors)
    if(n.depends_on&&n.depends_on.length){
      row.addEventListener("mouseenter", ()=>n.depends_on.forEach(t=>{ const el=document.querySelector('.node[data-id="'+CSS.escape(t)+'"]'); if(el) el.classList.add("deptarget"); }));
      row.addEventListener("mouseleave", ()=>document.querySelectorAll(".node.deptarget").forEach(el=>el.classList.remove("deptarget")));
    }
    return row;
  }
  function renderSubtree(id, container){
    const n = byId.get(id); if(!n) return;
    container.appendChild(nodeRow(n));
    const cs = kids.get(id)||[];
    if(cs.length){ const wrap=document.createElement("div"); wrap.className="kid"; cs.forEach(c=>renderSubtree(c,wrap)); container.appendChild(wrap); }
  }
  function renderMap(){
    const map = document.getElementById("map"); map.innerHTML="";
    const normalRoots = roots.filter(id=>!byId.get(id).isolated);
    const isoRoots = roots.filter(id=>byId.get(id).isolated);
    normalRoots.forEach(id=>renderSubtree(id, map));
    if(isoRoots.length){
      const box=document.createElement("div"); box.className="isobox";
      const hdr=document.createElement("div"); hdr.className="isohdr"; hdr.textContent="isolated subtree"; box.appendChild(hdr);
      isoRoots.forEach(id=>renderSubtree(id, box)); map.appendChild(box);
    }
  }

  // ---- filter / search ----
  function applyFilters(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ty = document.getElementById("ftype").value;
    const deadOnly = document.getElementById("fdead").checked;
    let shown=0;
    document.querySelectorAll(".node").forEach(el=>{
      const n = byId.get(el.dataset.id);
      const text = (n.id+" "+(n.title||"")+" "+(n.body||"")).toLowerCase();
      const ok = (!q||text.includes(q)) && (!ty||n.type===ty) && (!deadOnly||n.type==="dead_end");
      el.classList.toggle("dim", !ok);
      if(ok) shown++;
    });
    document.getElementById("rstat").textContent = shown+" / "+nodes.length+" steps";
  }
  function rstat(){
    const i = selected?order.indexOf(selected):-1;
    document.getElementById("rstat").textContent = (i>=0?("step "+(i+1)+" / "+order.length):(nodes.length+" steps"));
  }

  // ---- replay ----
  let timer=null;
  function step(delta){
    let i = selected?order.indexOf(selected):-1;
    i = Math.max(0, Math.min(order.length-1, i+delta));
    selectNode(order[i]);
  }
  function play(){
    if(timer){ stop(); return; }
    if(!selected) selectNode(order[0]);
    document.getElementById("rplay").textContent="⏸ Pause";
    timer = setInterval(()=>{
      const i = selected?order.indexOf(selected):-1;
      if(i>=order.length-1){ stop(); return; }
      step(1);
    }, 1300);
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById("rplay").textContent="▶ Replay"; }

  // ======================= v1.1 enrichment layers (all inert unless present) =======================
  const CTX = DATA.context, GLO = DATA.glossary, DEP = DATA.dependencies, REC = DATA.recipes;
  const LAYERS = { context:CTX, glossary:GLO, dependencies:DEP, recipes:REC };

  // ---- indexes (built once) ----
  const claimToNodes = new Map();
  nodes.forEach(n => (n.why||[]).forEach(c => { if(c&&c.id){ if(!claimToNodes.has(c.id)) claimToNodes.set(c.id,[]); claimToNodes.get(c.id).push(n.id); } }));
  const firstNodeForClaim = id => (claimToNodes.get(id)||[])[0] || null;
  const rwById   = new Map(((DEP&&DEP.entries)||[]).map(e => [e.rw_id, e]));
  const termById = new Map(((GLO&&GLO.terms)||[]).map(t => [t.term_id, t]));
  // concept "used by" (inferred) from each node's name-matched concepts[]
  if(GLO){
    const nameToTerm = new Map();
    (GLO.terms||[]).forEach(t => { if(t.name) nameToTerm.set(String(t.name).toLowerCase(), t); (t.aliases||[]).forEach(a=>nameToTerm.set(String(a).toLowerCase(), t)); });
    nodes.forEach(n => (n.concepts||[]).forEach(cn => { const t=nameToTerm.get(String(cn).toLowerCase()); if(t){ (t._used=t._used||[]).push(n.id); } }));
  }

  // ---- tiny inline-math fallback (no CDN; operates on already-escaped text, adds only safe tags) ----
  const GK={alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",eta:"η",theta:"θ",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",phi:"φ",chi:"χ",psi:"ψ",omega:"ω",Delta:"Δ",Sigma:"Σ",Omega:"Ω",Phi:"Φ",Theta:"Θ",Lambda:"Λ",Gamma:"Γ",nabla:"∇",partial:"∂",times:"×",cdot:"·",infty:"∞",approx:"≈",leq:"≤",geq:"≥",neq:"≠",to:"→",in:"∈",sum:"Σ",prod:"Π",sqrt:"√",mathbb:"",mathcal:"",mathbf:"",mathrm:"",left:"",right:""};
  function texInner(s){
    s=s.replace(/\\(?:mathbb|mathcal|mathbf|mathrm)\{([^{}]*)\}/g,"$1");
    s=s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)");
    s=s.replace(/\\([A-Za-z]+)/g,(m,w)=>GK[w]!==undefined?GK[w]:m);
    s=s.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^([\w()+\-])/g,"<sup>$1</sup>");
    s=s.replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>").replace(/_([\w()+\-])/g,"<sub>$1</sub>");
    return s;
  }
  function mathPass(escaped){
    if(escaped.indexOf("$")<0) return escaped;
    return escaped.replace(/\$\$([^$]+)\$\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>')
                  .replace(/\$([^$]+)\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>');
  }
  function mtext(v){ const e=esc(v); try{ return mathPass(e); }catch(_){ return e; } }

  // ---- typed-ref rendering (off-ARA pointers stay inert; in-ARA targets become jump chips) ----
  function refUrl(rf){
    const raw=rf.raw||"";
    if(rf.kind==="url"){ const m=raw.match(/https?:\/\/\S+/); return m?m[0]:""; }
    if(rf.kind==="arxiv"){ const m=raw.match(/(\d{4}\.\d{4,5})/); return m?("https://arxiv.org/abs/"+m[1]):""; }
    if(rf.kind==="doi"){ const m=raw.match(/(10\.\d{4,}\/\S+)/); return m?("https://doi.org/"+m[1]):""; }
    return "";
  }
  function refChip(rf){
    const raw=esc(rf.raw||""), url=refUrl(rf);
    if(url) return '<a class="chip ext" href="'+esc(url)+'" target="_blank" rel="noopener">'+raw+'</a>';
    if(rf.target){
      if(rf.kind==="claim")        return '<span class="chip jump" data-jump-claim="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="node")         return '<span class="chip jump" data-jump-node="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="concept")      return '<span class="chip jump" data-open-term="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="related_work") return '<span class="chip jump" data-open-panel="dependencies" data-anchor="ov-'+esc(rf.target)+'">'+raw+'</span>';
      return '<span class="chip jump" data-scroll="ov-'+esc(rf.target)+'">'+raw+'</span>';
    }
    const dangle=(rf.kind==="claim"||rf.kind==="related_work"||rf.kind==="concept");
    return '<span class="chip '+(dangle?'dangle" title="referenced but not found in this ARA':'ext')+'">'+raw+'</span>';
  }
  function refRow(refs){ return refs&&refs.length ? '<div class="chips">'+refs.map(refChip).join("")+'</div>' : ""; }

  // ---- per-node provenance chips (consumed by renderDetail) ----
  function chipRow(label, arr, klass){
    const cs=arr.map(x=>{
      const txt=[x.rw_id,x.name].filter(Boolean).join(" · ")||"?";
      const tip=x.relation_raw?(' title="'+esc(x.relation_raw)+'"'):'';
      const op =x.rw_id?(' data-open-panel="dependencies" data-anchor="ov-'+esc(x.rw_id)+'"'):'';
      return '<span class="chip '+klass+(x.rw_id?' jump':'')+'"'+tip+op+'>'+esc(txt)+'</span>';
    }).join("");
    return '<div class="chiplabel">'+esc(label)+'</div><div class="chips">'+cs+'</div>';
  }
  function recipeChips(arr){
    const cs=arr.map(x=>{
      const anchor="ov-sec-"+(x.file||"")+"-"+(x.sec_id||"");
      return '<span class="chip chip-recipe jump" data-open-panel="recipes" data-anchor="'+esc(anchor)+'" title="'+esc((x.file||"")+(x.role?(" · "+x.role):""))+'">▦ '+esc(x.heading||x.file||"recipe")+'</span>';
    }).join("");
    return '<div class="chiplabel">recipe</div><div class="chips">'+cs+'</div>';
  }

  // ---- the four overlay renderers (reuse block/chips/renderMd) ----
  function renderContext(){
    let h=""; if(CTX.summary) h+='<div class="ribbon">'+esc(CTX.summary)+'</div>';
    (CTX.sections||[]).forEach(sec=>{
      let inner="";
      if(sec.present===false){ inner='<div class="muted grey">(not specified in this ARA)</div>'; }
      else (sec.entries||[]).forEach(en=>{
        let c='<div class="card" id="ov-'+esc(en.ent_id||"")+'"><h4>'+(en.ent_id?'<span class="did">'+esc(en.ent_id)+'</span> ':'')+esc(en.ent_title||"")+(en.inferred_id?' <span class="sub">(pos.)</span>':'')+'</h4>';
        if(!en.unstructured && en.fields && en.fields.length) en.fields.forEach(f=>c+='<div class="kv"><b>'+esc(f.label)+'</b> '+mtext(f.value)+'</div>');
        else if(en.text) c+='<div class="kv">'+mtext(en.text)+'</div>';
        if(en.unstructured) c+='<div class="sub">unstructured</div>';
        c+=refRow(en.refs)+'</div>'; inner+=c;
      });
      h+=block(sec.heading||sec.role||"section", sec.role||"", inner, sec.role==="insight");
    });
    return h || '<div class="muted">No problem context.</div>';
  }
  function renderGlossary(filter){
    const f=(filter||"").trim().toLowerCase();
    const match=t=>!f||((t.name||"")+" "+(t.aliases||[]).join(" ")+" "+(t.definition||"")).toLowerCase().includes(f);
    function card(t){
      let c='<div class="card" id="ov-'+esc(t.term_id)+'"><h4>'+esc(t.name)+(t.group?' <span class="sub">'+esc(t.group)+'</span>':'')+'</h4>';
      if(t.aliases&&t.aliases.length) c+='<div class="chips">'+t.aliases.map(a=>'<span class="chip">'+esc(a)+'</span>').join("")+'</div>';
      if(t.definition) c+='<div class="kv">'+mtext(t.definition)+'</div>';
      (t.fields||[]).forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
      if(t.related&&t.related.length) c+='<div class="kv"><b>related</b> '+t.related.map(r=>{const rt=termById.get(r);return '<span class="chip jump" data-open-term="'+esc(r)+'">'+esc(rt?rt.name:r)+'</span>';}).join(" ")+'</div>';
      if(t._used&&t._used.length) c+='<div class="kv"><b>mentions</b> '+[...new Set(t._used)].map(nid=>'<span class="chip jump" data-jump-node="'+esc(nid)+'">'+esc(nid)+'</span>').join(" ")+' <span class="sub">(inferred)</span></div>';
      return c+refRow(t.refs)+'</div>';
    }
    const groups=GLO.groups&&GLO.groups.length?GLO.groups:null; let h="";
    if(groups){
      const grouped=new Set();
      groups.forEach(g=>{ (g.term_ids||[]).forEach(id=>grouped.add(id)); const ts=(g.term_ids||[]).map(id=>termById.get(id)).filter(Boolean).filter(match); if(ts.length) h+=block(g.name||"group", String(ts.length), ts.map(card).join(""), true); });
      const rest=(GLO.terms||[]).filter(t=>!grouped.has(t.term_id)).filter(match);
      if(rest.length) h+=block("other", String(rest.length), rest.map(card).join(""), true);
    } else { const ts=(GLO.terms||[]).filter(match); h=ts.map(card).join(""); }
    return h || '<div class="muted">No matching terms.</div>';
  }
  function renderDeps(filter){
    const f=(filter||"").trim().toLowerCase(); let h="";
    if(DEP.preamble) h+='<div class="muted">'+esc(DEP.preamble)+'</div>';
    if(DEP.attribution) h+='<div class="ribbon">'+esc(DEP.attribution)+'</div>';
    const ents=(DEP.entries||[]).filter(e=>!e.is_footprint).filter(e=>!f||(((e.rw_id||"")+" "+(e.name||"")+" "+(e.relation_raw||"")+" "+(e.delta||"")).toLowerCase().includes(f)));
    ents.forEach(e=>{
      const rn=e.relation_norm, relc=["baseline","imports","extends","bounds","refutes"].includes(rn)?rn:"neutral";
      let c='<div class="card" id="ov-'+esc(e.rw_id||"")+'"><h4>'+(e.rw_id?'<span class="did">'+esc(e.rw_id)+'</span> ':'')+esc(e.name||"")+'</h4>';
      c+='<div class="chips"><span class="rel '+relc+'">'+esc(e.relation_raw||rn||"related")+'</span>'+(e.cross_agent?'<span class="chip" title="other-agent provenance">↔ other-agent</span>':'')+'</div>';
      if(e.delta) c+='<div class="kv">'+mtext(e.delta)+'</div>';
      if(e.adopted) c+='<div class="kv"><b>adopted</b> '+esc(e.adopted)+'</div>';
      let prov=(e.grounding||[]).map(refChip).join("");
      (e.claims||[]).filter(id=>claimToNodes.has(id)).forEach(id=>prov+='<span class="chip jump" data-jump-claim="'+esc(id)+'">'+esc(id)+'</span>');
      c+= prov?('<div class="kv"><b>grounding</b> '+prov+'</div>'):'<div class="muted">ungrounded</div>';
      h+=c+'</div>';
    });
    if(!ents.length) h+='<div class="muted">No matching dependencies.</div>';
    const fp=DEP.footprint||[];
    if(fp.length) h+=block("Citation footprint", String(fp.length), fp.map(x=>'<div class="ptr"><span class="muted">'+esc(x.ref_id||"")+'</span> '+esc(x.citation||"")+'</div>').join(""), false);
    return h;
  }
  function renderRecipes(){
    let h="";
    (REC.files||[]).forEach(file=>{
      let inner="";
      (file.sections||[]).forEach(sec=>{
        let c='<div class="card" id="ov-sec-'+esc((file.file||"")+"-"+(sec.sec_id||""))+'"><h4>'+(sec.sec_id?'<span class="did">'+esc(sec.sec_id)+'</span> ':'')+esc(sec.heading||"")+'</h4>';
        if(sec.kind==="table"&&sec.markdown) c+=renderMd(sec.markdown);
        else if(sec.kind==="steps"&&sec.steps&&sec.steps.length) c+='<ol>'+sec.steps.map(s=>'<li>'+mtext(String(s).replace(/^\s*\d+\.\s*/,""))+'</li>').join("")+'</ol>';
        else if(sec.kind==="kv"&&sec.fields&&sec.fields.length) sec.fields.forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
        else if(sec.kind==="code"&&sec.code) c+='<pre class="snip">'+esc(sec.code)+'</pre>';
        else if(sec.kind==="math"&&sec.code) c+='<div class="kv math">'+mtext(sec.code)+'</div>';
        else if(sec.text) c+='<div class="kv">'+mtext(sec.text)+'</div>';
        if(sec.warn) c+='<div class="warn">'+esc(sec.warn)+'</div>';
        inner+=c+refRow(sec.refs)+'</div>';
      });
      h+=block((file.file_title||file.file||"recipe")+(file.role?("  ·  "+file.role):""), String((file.sections||[]).length), inner, true);
    });
    return h || '<div class="muted">No recipe content.</div>';
  }

  // ---- overlay open/close + layerbar wiring ----
  const ov=document.getElementById("overlay");
  let lastTrigger=null;
  const PANEL_RENDER={ context:renderContext, glossary:()=>renderGlossary(""), dependencies:()=>renderDeps(""), recipes:renderRecipes };
  function hasContent(name){ const L=LAYERS[name]; if(!L) return false;
    if(name==="context") return (L.sections||[]).length>0;
    if(name==="glossary") return (L.terms||[]).length>0;
    if(name==="dependencies") return (L.entries||[]).length>0||(L.footprint||[]).length>0;
    if(name==="recipes") return (L.files||[]).length>0; return false; }
  function panelTitle(name){ const L=LAYERS[name]||{}; return L.title || ({context:"Context",glossary:"Concepts",dependencies:"Dependencies",recipes:"Solution"}[name]); }
  function panelCount(name){ const L=LAYERS[name]||{};
    if(name==="glossary") return (L.terms||[]).length;
    if(name==="dependencies") return (L.entries||[]).length;
    if(name==="recipes") return (L.files||[]).reduce((a,f)=>a+(f.sections||[]).length,0); return 0; }
  function openPanel(name, anchor){
    if(!hasContent(name)) return;
    stop(); lastTrigger=document.activeElement;
    document.getElementById("ov-title").textContent=panelTitle(name);
    const body=document.getElementById("ov-body"); body.innerHTML=PANEL_RENDER[name]();
    if(LEX) linkifyConcepts(body);
    const q=document.getElementById("ov-q");
    if(name==="glossary"||name==="dependencies"){ q.hidden=false; q.value=""; q.dataset.panel=name; } else { q.hidden=true; }
    ov.hidden=false;
    if(anchor){ const el=document.getElementById(anchor); if(el) el.scrollIntoView({block:"center"}); } else body.scrollTop=0;
    (q.hidden?document.getElementById("ov-close"):q).focus();
  }
  function closePanel(){ ov.hidden=true; if(lastTrigger&&lastTrigger.focus) lastTrigger.focus(); }
  document.querySelectorAll(".lbtn").forEach(b=>{ const name=b.dataset.panel;
    if(hasContent(name)){ b.hidden=false; const c=b.querySelector(".cnt"); if(c){ const n=panelCount(name); if(n) c.textContent=n; } b.addEventListener("click",()=>openPanel(name)); } });
  document.getElementById("ov-q").addEventListener("input", e=>{ const p=e.target.dataset.panel, body=document.getElementById("ov-body");
    body.innerHTML = p==="glossary"?renderGlossary(e.target.value):renderDeps(e.target.value); if(LEX) linkifyConcepts(body); });

  // ---- glossary lexicon + popover ----
  const LEX=(GLO&&GLO.lexicon&&Object.keys(GLO.lexicon).length)?(function(){
    const surf=Object.keys(GLO.lexicon).filter(s=>s.length>=3).sort((a,b)=>b.length-a.length);
    if(!surf.length) return null;
    const re=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return { re:new RegExp("\\b("+surf.map(re).join("|")+")\\b","i"), map:GLO.lexicon };
  })():null;
  const SKIP_TAGS={A:1,CODE:1,PRE:1,BUTTON:1,SCRIPT:1,STYLE:1,H4:1,H5:1,SUMMARY:1};
  function linkifyConcepts(root){
    if(!LEX) return;
    const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(t){
      if(!t.nodeValue||!t.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p=t.parentNode; while(p&&p!==root){ if(p.classList&&p.classList.contains("gterm")) return NodeFilter.FILTER_REJECT; if(SKIP_TAGS[p.tagName]) return NodeFilter.FILTER_REJECT; p=p.parentNode; }
      return NodeFilter.FILTER_ACCEPT; } });
    const seen=new Set(), hits=[]; let t;
    while((t=walker.nextNode())){ const m=LEX.re.exec(t.nodeValue); if(!m) continue; const tid=LEX.map[m[1].toLowerCase()]; if(!tid||seen.has(tid)) continue; seen.add(tid); hits.push({node:t,index:m.index,len:m[1].length,tid}); }
    hits.forEach(hp=>{ const tn=hp.node, txt=tn.nodeValue, par=tn.parentNode; if(!par) return;
      const span=document.createElement("span"); span.className="gterm"; span.dataset.term=hp.tid; span.tabIndex=0; span.textContent=txt.slice(hp.index,hp.index+hp.len);
      const after=document.createTextNode(txt.slice(hp.index+hp.len));
      par.replaceChild(after,tn); par.insertBefore(span,after); par.insertBefore(document.createTextNode(txt.slice(0,hp.index)),span); });
  }
  const gpop=document.getElementById("gpop");
  function gpopShow(span){ const t=termById.get(span.dataset.term); if(!t) return;
    const def=t.definition||""; gpop.innerHTML='<h5>'+esc(t.name)+'</h5><div>'+mtext(def.slice(0,240))+(def.length>240?'…':'')+'</div><span class="gp-open" data-open-term="'+esc(t.term_id)+'">open in glossary →</span>';
    gpop.style.display="block"; const r=span.getBoundingClientRect();
    gpop.style.left=Math.max(6,Math.min(r.left, window.innerWidth-372))+"px"; gpop.style.top=(r.bottom+6)+"px"; }
  function gpopHide(){ gpop.style.display="none"; }

  // ---- delegated interactions for the new layers ----
  document.addEventListener("click", e=>{
    const el=e.target.closest&&e.target.closest("[data-close],[data-jump-node],[data-jump-claim],[data-open-panel],[data-open-term],[data-scroll]");
    if(!el) return;
    if(el.hasAttribute("data-close")){ closePanel(); return; }
    if(el.dataset.jumpNode){ closePanel(); selectNode(el.dataset.jumpNode); return; }
    if(el.dataset.jumpClaim){ const nid=firstNodeForClaim(el.dataset.jumpClaim); if(nid){ closePanel(); selectNode(nid); } return; }
    if(el.dataset.openTerm){ openPanel("glossary","ov-"+el.dataset.openTerm); return; }
    if(el.hasAttribute("data-open-panel")){ openPanel(el.dataset.openPanel, el.dataset.anchor||null); return; }
    if(el.dataset.scroll){ const t=document.getElementById(el.dataset.scroll); if(t) t.scrollIntoView({block:"center"}); return; }
  });
  document.addEventListener("mouseover", e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("mouseout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  document.addEventListener("focusin",   e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("focusout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  window.addEventListener("scroll", gpopHide, true);

  document.getElementById("q").addEventListener("input", applyFilters);
  document.getElementById("ftype").addEventListener("change", applyFilters);
  document.getElementById("fdead").addEventListener("change", applyFilters);
  document.getElementById("rplay").addEventListener("click", play);
  document.getElementById("rprev").addEventListener("click", ()=>{stop();step(-1);});
  document.getElementById("rnext").addEventListener("click", ()=>{stop();step(1);});
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ if(!ov.hidden){ closePanel(); return; } gpopHide(); }
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
    if(e.key==="ArrowLeft"){stop();step(-1);} else if(e.key==="ArrowRight"){stop();step(1);}
    else if(e.key==="c"||e.key==="g"||e.key==="d"||e.key==="r"){ const p={c:"context",g:"glossary",d:"dependencies",r:"recipes"}[e.key]; if(hasContent(p)) openPanel(p); }
  });

  renderMap();
  rstat();
})();
</script>
</body>
</html>
