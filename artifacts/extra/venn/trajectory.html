<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARA Trajectory</title>
<!--
  ARA Trajectory Viewer — canonical self-contained scaffold for the `research-visualizer` skill.

  HOW THE SKILL USES THIS FILE
  ----------------------------
  The rendering logic below is FIXED. The agent does NOT rewrite it. The agent only:
    1. Parses the ARA into one ARA_DATA object (schema in references/binding.md).
    2. base64-inlines every referenced figure .png into node.result.figures[].img.
    3. Replaces ONLY the JSON between the BEGIN/END markers in the <script id="ara-data"> block.
    4. Writes the result to <ara>/trajectory.html (or --output).
  Everything is inline (no CDN, no fetch, no server) so the output is one portable file.

  INJECTION CONTRACT
  ------------------
  - Replace exactly the lines between  __ARA_DATA_BEGIN__  and  __ARA_DATA_END__.
  - The payload MUST be valid JSON (it is read with JSON.parse).
  - JSON must not contain the literal substring "</script>"; escape any "<" in inlined
    markdown/text as "<" to be safe.
  - The demo payload shipped here renders a 3-node sample so the bare template opens and
    shows every node state (experiment, dead_end, isolated). The skill overwrites it.
-->
<style>
  /* Research Visualizer — "field notebook of a machine scientist".
     Cool archival vellum + ink; monospace is the machine-readout voice for
     structure / IDs / data, a humanist serif carries the reasoning prose. The
     signature is a traced trajectory spine that forks at branches and is struck
     through at dead ends. Type is read from glyph + label; colour is reserved
     for true epistemic status (teal = chrome, green = supported, amber =
     tentative, clay-red = dead end) — never decoration. */
  :root{
    /* paper & ink — deliberately cool vellum, NOT warm cream */
    --bg:#e9ece4; --panel:#f4f6f0; --panel2:#e3e7dd; --line:#ccd3c7; --ink:#1b2420;
    --muted:#67726a; --faint:#8a948b; --accent:#0e6b62; --accent-ink:#0a4f48; --chip:#e6eae0;
    --ok:#3a6a39; --warn:#a6402c; --tentative:#8a6310; --glyph-bg:#e0e5da; --glyph-ink:#4a544c;
    --sel-bg:#e3ede7; --code-bg:#eaeee6; --reason-bg:#f4f6f0;
    --iso-line:#b7c0ae; --iso-bg:#e5eadf; --iso-ink:#5f6b58;
    --scrim:rgba(20,28,24,.42); --shadow:rgba(20,28,24,.16);
    --add-bg:#e0ebdb; --add-ink:#2f5a2e; --del-bg:#f1e0da; --del-ink:#8c3623; --hunk:#67726a;
    --spine:#c3ccbd; --grid:rgba(27,36,32,.05);
    /* legacy type vars retained so any leftover hooks resolve */
    --q:var(--glyph-bg); --exp:var(--glyph-bg); --dec:var(--glyph-bg); --piv:var(--glyph-bg); --ins:var(--glyph-bg); --def:var(--glyph-bg); --dead:var(--warn);
    /* type roles: a serif reads the prose, monospace reads the machine */
    --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  code,pre,.mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* ---- masthead ---- */
  header{padding:20px 24px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .title{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.012em}
  header .sub{font-family:var(--mono);color:var(--muted);font-size:11.5px;margin-top:5px;letter-spacing:.01em}
  header details{margin-top:10px;color:var(--ink)}
  header summary{cursor:pointer;color:var(--accent-ink);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .toolbar input[type=search],.toolbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--sans)}
  .toolbar input[type=search]{min-width:230px}
  .toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--accent);outline:none}
  .toolbar label{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:var(--mono);cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .spacer{flex:1}
  .count{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-left:10px;border-left:1px solid var(--line)}

  main{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:calc(100% - 0px);min-height:0}
  #map{overflow:auto;border-right:1px solid var(--line);padding:18px 12px 56px;background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;background-position:-1px -1px}
  #detail{overflow:auto;padding:26px 32px 80px;background:var(--bg)}

  /* ---- process map: the trajectory spine is the signature ---- */
  .node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--sel-bg);border-color:var(--accent)}
  .node.deptarget{background:var(--sel-bg);outline:1px dashed var(--accent);outline-offset:-1px}
  .node.dim{opacity:.32}
  .node .glyph{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);margin-top:1px}
  .node.sel .glyph{border-color:var(--accent);color:var(--accent-ink)}
  .node .nid{color:var(--muted);font-size:10.5px;font-family:var(--mono);letter-spacing:.02em}
  .node .ntitle{font-size:13px;line-height:1.45}
  .node.dead .ntitle{color:var(--warn);text-decoration:line-through;text-decoration-color:rgba(166,64,44,.45)}
  .node .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  /* the spine + branch connectors: nested steps trace back to their parent */
  .kid{margin-left:19px;border-left:2px solid var(--spine);padding-left:14px}
  .kid>.node::before{content:"";position:absolute;left:-14px;top:14px;width:10px;height:2px;background:var(--spine)}
  .kid>.node.sel::before{background:var(--accent)}
  .isobox{border:1px dashed var(--iso-line);border-radius:8px;margin:12px 2px;padding:6px 4px;background:var(--iso-bg)}
  .isobox .isohdr{color:var(--iso-ink);font-family:var(--mono);font-size:10px;padding:3px 8px 7px;text-transform:uppercase;letter-spacing:.1em}
  .dep{color:var(--muted);font-size:10px;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .glyph.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}

  /* ---- detail pane ---- */
  .dhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;padding:3px 9px;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
  .badge.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}
  .pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pill.explicit{border-color:var(--ok);color:var(--ok)} .pill.inferred{border-color:var(--tentative);color:var(--tentative)}
  .pill.iso{border-color:var(--iso-line);color:var(--iso-ink)}
  .dtitle{font-family:var(--serif);font-size:25px;font-weight:600;margin:12px 0 6px;letter-spacing:-.012em;line-height:1.28}
  .did{color:var(--muted);font-family:var(--mono);font-size:11.5px}

  .block{border:1px solid var(--line);border-radius:7px;margin:15px 0;background:var(--panel)}
  .block>summary{cursor:pointer;padding:11px 15px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .block>summary::-webkit-details-marker{display:none}
  .block>summary:hover{color:var(--accent-ink)}
  .block>summary .tag{margin-left:auto;color:var(--faint);font-size:10.5px;font-weight:400;font-family:var(--mono);text-transform:none;letter-spacing:0}
  .block .body{padding:4px 16px 16px}
  /* the primary reasoning block: the agent's thinking, set as typeset prose */
  .block.reason{border-left:3px solid var(--accent);background:var(--reason-bg)}
  .block.reason>summary{color:var(--accent-ink)}
  .block.reason .lead{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink)}
  .didwhat{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;margin:16px 0 4px}
  .lead{font-family:var(--serif);color:#2a322c;font-size:16px;line-height:1.7}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;color:#46504a;font-family:var(--mono)}
  .chip.ext{color:var(--muted)}

  .claim{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .claim h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .claim .kv{font-size:13px;line-height:1.6;margin:4px 0;color:#3a423c}
  .claim .kv b{color:var(--muted);font-weight:600;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .status{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 7px;border:1px solid var(--line)}
  .status.supported{color:var(--ok);border-color:var(--ok)}
  .status.refuted{color:var(--warn);border-color:var(--warn)}
  .status.hypothesis{color:var(--tentative);border-color:var(--tentative)}
  .prov{font-size:11px;color:var(--iso-ink);font-family:var(--mono)}

  .quote{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13.5px;line-height:1.6;color:#2a322c}
  .quote .ref{color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:5px}
  figure{margin:14px 0}
  figure img{max-width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:6px}
  figcaption{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:7px}

  table.md{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;margin:10px 0}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  table.md th{background:var(--panel2);color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
  pre.snip{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;font-size:12px;color:var(--ink);white-space:pre-wrap}

  .ptr{font-size:13px;margin:7px 0}
  .ptr .path{font-family:var(--mono);color:#46504a}
  .truncated{color:var(--muted);font-size:11.5px;font-style:italic}
  .empty{color:var(--muted);font-size:13px}
  .none{color:var(--muted);padding:40px 24px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px}

  /* ---- enrichment layers (all inert unless the data is present) ---- */
  .layerbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lbtn .cnt{color:var(--muted);font-size:10.5px}
  .chiplabel{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 3px}
  .chip.jump{cursor:pointer}
  .chip.jump:hover{border-color:var(--accent);color:var(--accent-ink)}
  .chip.dangle{color:#9aa49b;text-decoration:line-through;cursor:not-allowed}
  .chip.infer{border-style:dashed}
  .chip-built{border-color:var(--ok);color:var(--ok)}
  .chip-rej{border-color:var(--warn);color:var(--warn)}
  .chip-recipe{border-color:var(--accent);color:var(--accent-ink)}
  .nmark{color:var(--muted);font-size:10px;margin-left:5px;font-family:var(--mono)}
  .rel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 8px;color:var(--glyph-ink);background:var(--glyph-bg);font-weight:700}
  .rel.bounds,.rel.refutes{background:var(--warn);color:#fff}
  .rel.neutral{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .ribbon{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;color:#3a423c;font-size:13px;line-height:1.6}
  .warn{border-left:3px solid var(--warn);background:var(--del-bg);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13px;line-height:1.6}
  .muted{color:var(--muted);font-size:11.5px}
  .math{font-family:var(--serif);font-style:italic}
  .gterm{border-bottom:1px dashed var(--accent);cursor:help}
  #gpop{position:fixed;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;z-index:60;box-shadow:0 8px 28px var(--shadow);font-size:13px;line-height:1.55;display:none}
  #gpop h5{margin:0 0 5px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  #gpop .gp-open{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:11px;margin-top:7px;display:inline-block}
  .ov{position:fixed;inset:0;z-index:50}
  .ov[hidden]{display:none}
  .ov-scrim{position:absolute;inset:0;background:var(--scrim)}
  .ov-sheet{position:relative;margin:5vh auto;max-width:920px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 48px var(--shadow)}
  .ov-head{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1}
  .ov-head #ov-title{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
  .ov-head input[type=search]{flex:1;max-width:260px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:13px}
  .ov-body{padding:10px 17px 26px}
  .ov-body .spacer{flex:1}
  .card{border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .card .sub{color:var(--muted);font-family:var(--mono);font-size:10.5px}
  .grey{opacity:.5}

  /* responsive: stack the two panes on a narrow screen */
  @media (max-width:720px){
    main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
    #map{border-right:none;border-bottom:1px solid var(--line)}
    #detail{padding:20px 18px 64px}
    .dtitle{font-size:21px}
  }
  /* honour reduced-motion */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="title" id="h-title">ARA Trajectory</h1>
  <div class="sub" id="h-sub"></div>
  <details id="h-abstract-wrap"><summary>Abstract</summary><div class="lead" id="h-abstract"></div></details>
  <div class="toolbar">
    <input type="search" id="q" placeholder="search steps…" autocomplete="off" />
    <label>type
      <select id="ftype"><option value="">all</option></select>
    </label>
    <label><input type="checkbox" id="fdead" /> dead ends only</label>
    <span class="spacer"></span>
    <button class="btn" id="rprev" title="previous (←)">‹</button>
    <button class="btn primary" id="rplay">▶ Replay</button>
    <button class="btn" id="rnext" title="next (→)">›</button>
    <span class="count" id="rstat"></span>
  </div>
  <div class="layerbar" id="layerbar">
    <button class="btn lbtn" data-panel="context" hidden>◧ Context</button>
    <button class="btn lbtn" data-panel="glossary" hidden>▤ Glossary <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="dependencies" hidden>⇄ Dependencies <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="recipes" hidden>▦ Recipes <span class="cnt"></span></button>
  </div>
</header>

<main>
  <aside id="map"></aside>
  <section id="detail"><div class="none">Select a step on the left, or press <kbd>▶ Replay</kbd>.</div></section>
</main>

<!-- v1.1: one shared modal overlay for the Context/Glossary/Dependencies/Recipes panels, + a glossary popover. Both inert unless their data is present. -->
<div id="overlay" class="ov" hidden role="dialog" aria-modal="true">
  <div class="ov-scrim" data-close></div>
  <div class="ov-sheet">
    <div class="ov-head"><span id="ov-title"></span>
      <input type="search" id="ov-q" placeholder="filter…" hidden autocomplete="off" />
      <span class="spacer"></span>
      <button class="btn" id="ov-close" data-close>✕ <kbd>Esc</kbd></button>
    </div>
    <div class="ov-body" id="ov-body"></div>
  </div>
</div>
<div id="gpop"></div>

<!-- The skill replaces ONLY the JSON between the two markers below. -->
<script id="ara-data" type="application/json">
/* __ARA_DATA_BEGIN__ */
{"meta": {"title": "Venn: Resource Management for Collaborative Learning Jobs", "authors": ["Jiachen Liu", "Fan Lai", "Ding Ding", "Yiwen Zhang", "Mosharaf Chowdhury"], "year": "2025", "venue": "MLSys 2025", "ara_dir": "venn", "abstract": "In recent years, collaborative learning (CL) has emerged as a promising approach for machine learning (ML) and data science across distributed edge devices. As the deployment of CL jobs increases, they inevitably contend for limited resources. However, efficient resource scheduling in this context is challenging because of the ephemeral nature and resource heterogeneity of devices, coupled with the overlapping resource requirements of diverse CL jobs. Existing resource managers often assign devices to CL jobs randomly for simplicity and scalability, but this approach compromises job efficiency. In this paper, we present Venn, a CL resource manager that efficiently schedules ephemeral, heterogeneous devices among multiple CL jobs to reduce the average job completion time (JCT). Venn formulates the Intersection Resource Scheduling (IRS) problem to identify complex resource contention among multiple CL jobs. It then proposes a contention-aware scheduling heuristic to minimize the average scheduling delay. Furthermore, it proposes a resource-aware device-to-job matching heuristic to optimize response collection time by mitigating stragglers. Our evaluation shows that, compared to the state-of-the-art CL resource managers, Venn improves the average JCT by up to 1.88×."}, "order": ["N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10", "N11", "N12", "N13"], "nodes": [{"id": "N01", "type": "question", "parent": null, "title": "How to efficiently manage multiple concurrent CL jobs competing for heterogeneous edge devices?", "body": "Edge devices are ephemeral, heterogeneous, and have overlapping eligibility sets across CL jobs. Existing managers use random matching, which is suboptimal under contention. Can we do better while remaining computationally tractable at planetary scale?", "thinking": "Collaborative learning (CL) jobs train models by borrowing spare compute from edge devices like phones, but those devices come and go unpredictably and differ widely in hardware capability. When many CL jobs run at once, they end up competing for overlapping pools of eligible devices. The resource managers used in production today (Apple, Meta, Google) just hand out devices randomly, which is simple but wasteful once contention sets in. The opening question this research chases: can a resource manager do meaningfully better than random matching, while staying cheap enough to run at planetary scale with thousands of devices and hundreds of jobs?", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": []}, {"id": "N02", "type": "experiment", "parent": "N01", "title": "Measure impact of resource contention on CL job accuracy and JCT", "body": "Increasing concurrent jobs (1→5→10→20) significantly degrades round-to-accuracy performance. Scheduling delay grows to dominate JCT (Figure 5). Even partitioning is no better than shared pool.", "thinking": "Before designing a fix, the first step is to confirm contention is actually a problem worth solving. Running 1, 5, 10, and 20 CL jobs at once and watching what happens shows two things going wrong together: model accuracy per training round gets worse as more jobs compete for the same devices, and the time each job spends just waiting to acquire enough devices (scheduling delay) balloons until it dominates total job completion time. Even the seemingly fair fix of statically partitioning the device pool across jobs doesn't help; it performs no better than a shared free-for-all pool. That rules out the easy answer and confirms contention needs an explicit scheduling solution.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Figure 5", "§2.3"], "why": [], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure 4", "caption": "Figure 4 (§2.3): Average test accuracy vs. training round for 1, 5, 10, and 20 concurrent CL jobs sharing a device pool, showing accuracy degradation with contention. Conditions: ResNet-18, 100 clients/round, FEMNIST; device pool evenly partitioned; random device-to-job matching.", "markdown": "| Number of Jobs | Approximate Final Accuracy (after sufficient rounds) |\n|----------------|------------------------------------------------------|\n| 1 job | ≈ 0.80 |\n| 5 jobs | ≈ 0.72 |\n| 10 jobs | ≈ 0.65 |\n| 20 jobs | ≈ 0.57 |\n\nKey finding: as the number of concurrent CL jobs increases from 1 to 20, final test accuracy degrades by approximately 0.23 accuracy points (≈29% relative degradation). Values marked ≈ are best-effort readings from the figure, not tabulated in the paper."}], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Job Completion Time (JCT)", "Scheduling Delay", "Collaborative Learning Job (CL Job)"]}, {"id": "N03", "type": "decision", "parent": "N02", "title": "Decompose JCT into scheduling delay + response collection time", "body": "Optimize both components separately: (1) job ordering for scheduling delay, (2) device matching for response collection time\nAlternatives: Optimize only response collection time (existing single-job work approach); Joint optimization of all assignments via ILP (exact solution)", "thinking": "Job completion time turns out to be the sum of two very different quantities: how long a job waits to acquire enough devices (scheduling delay) and how long it then waits for those devices to finish training and report back (response collection time). Prior single-job systems only tuned the second half, implicitly assuming devices are always available. With N02 showing scheduling delay is the piece that grows out of control under contention, the natural move is to split the problem into two separately-optimizable pieces: an ordering/scheduling problem for who gets devices first, and a matching problem for which devices a job gets. Solving everything jointly as one exact integer program was considered and rejected, since (as later confirmed) that formulation is NP-hard and won't scale.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Figure 1 shows both components; Figure 5 shows scheduling delay dominates under contention; exact ILP is NP-hard (Even et al., 1975)"], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Job Completion Time (JCT)", "Scheduling Delay", "Response Collection Time"]}, {"id": "N04", "type": "question", "parent": "N03", "title": "How to minimize scheduling delay across multiple CL jobs with overlapping eligibility sets?", "body": "Random matching and SRSF waste scarce resources on jobs with abundant alternatives (Figure 3). An ILP formulation exists but is intractable at scale.", "thinking": "With scheduling delay identified as the dominant, unsolved half of the problem, the question becomes concrete: given that different CL jobs are eligible for overlapping (not identical) sets of devices, how should the scheduler decide who gets which devices first? Both random matching and SRSF (borrowed from cluster scheduling) turn out to waste scarce, narrowly-eligible devices on jobs that actually have plenty of other options. An exact integer program could in principle find the optimal answer, but it doesn't scale to the device and job counts this system needs to handle.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Scheduling Delay"]}, {"id": "N05", "type": "dead_end", "parent": "N04", "title": "Direct ILP/MCF exact formulation", "body": "Hypothesis: Formulate IRS as integer multi-commodity flow and solve exactly.\nFailure mode: NP-hard (Even et al., 1975); computationally infeasible at planetary scale with thousands of devices and hundreds of jobs.\nLesson: Need a tractable heuristic; decompose by resource homogeneity to reduce problem size.", "thinking": "The first idea tried was to take the scheduling problem at face value and solve it exactly, formulating it as an integer multi-commodity flow problem. That is mathematically clean but a known dead end: multi-commodity flow is NP-hard (a result dating to Even et al., 1975), so an exact solver is computationally infeasible once the device pool reaches planetary scale. The lesson carried forward is that only a tractable heuristic will work, and the way to get there is to decompose the problem by grouping jobs with the same resource requirements, shrinking what needs to be solved exactly.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Intersection Resource Scheduling (IRS)"]}, {"id": "N06", "type": "dead_end", "parent": "N04", "title": "Apply SRSF (Shortest Remaining Service First) from cluster scheduling", "body": "Hypothesis: SRSF from datacenter scheduling minimizes average JCT.\nFailure mode: SRSF does not account for overlapping eligibility sets across job groups; wastes scarce Emoji-eligible devices on Keyboard job (Figure 3, avg JCT=11 vs optimal 9.3).\nLesson: Need a scheduler that explicitly models device eligibility intersection structure.", "thinking": "A second, cheaper idea was to just borrow Shortest Remaining Service First (SRSF), a well-known cluster-scheduling heuristic, and apply it directly. It also falls short: SRSF has no notion of overlapping device eligibility across job groups, so in the toy example it hands scarce devices that are only eligible for 'Emoji' jobs to a 'Keyboard' job that could have used almost any device, pushing average JCT to 11 versus an optimal 9.3. The takeaway is that whatever scheduler gets built next has to explicitly reason about how device eligibility sets intersect across jobs, not just about job size or arrival order.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Job Completion Time (JCT)"]}, {"id": "N07", "type": "decision", "parent": "N04", "title": "Introduce Resource-Homogeneous Job Groups and two-level decomposition", "body": "Group jobs by identical eligibility requirements; solve intra-group (SRDF) then inter-group (scarcity + queue-length ratio) separately\nAlternatives: Single-level sorting across all jobs (SRSF ignoring groups); Per-group independent scheduling ignoring cross-group contention", "thinking": "Having ruled out both an exact ILP (N05) and a naive SRSF port (N06), the fix that sticks is to first group jobs that need exactly the same set of devices into Resource-Homogeneous Job Groups, and then solve the problem at two levels: within a group, order jobs by smallest remaining demand first; across groups, start with the scarcest group and greedily reallocate devices toward groups under more scheduling pressure. Two rejected alternatives make the reasoning explicit: sorting all jobs together in one flat list ignores the eligibility structure that caused SRSF to fail, and scheduling each group in isolation ignores the cross-group contention that is the whole point of the problem. A proof (Lemma 1) shows this two-level decomposition is globally optimal for JCT when each level is solved optimally, and a second proof (Lemma 2) shows the inter-group heuristic itself is optimal in the two-group case.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Lemma 1 proves two-level decomposition gives globally optimal JCT when each step is optimal. Lemma 2 proves inter-group heuristic is optimal for two-group case."], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "venn_sched — Algorithm 1 (Intersection Resource Scheduling)", "pointer": "src/execution/venn_scheduler.py", "what": "Transcribed reference implementation of the IRS two-level scheduling heuristic (RequestHandler -> venn_sched)."}, {"name": "Algorithm 1 pseudocode & complexity", "pointer": "logic/solution/algorithm.md — Algorithm 1: Intersection Resource Scheduling (Venn-Sched)", "what": "Recipe section: pseudocode and complexity analysis for the scheduling heuristic."}]}, {"id": "N08", "type": "experiment", "parent": "N07", "title": "Validate IRS heuristic across 5 workload scenarios", "body": "Venn achieves 1.63×–1.88× JCT improvement over random matching. SRSF achieves 1.41×–1.69×. FIFO achieves 1.38×–1.64×. (Table 1)", "thinking": "With the two-level Intersection Resource Scheduling (IRS) heuristic designed, the next step is to check it actually works end to end, across five different workload shapes (Even, Small, Large, Low, High demand). It does: Venn's full scheduling-plus-matching pipeline improves average job completion time by 1.63x to 1.88x over the optimized-random-matching baseline, consistently beating both SRSF (1.41x-1.69x) and FIFO (1.38x-1.64x) on every workload tested.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["§5.2"], "why": [{"id": "C01", "title": "Venn reduces average JCT by up to 1.88× over random matching across diverse CL workloads", "statement": "Across five workload types (Even, Small, Large, Low, High) in event-driven simulation with 50 jobs and Poisson arrival (30-min average inter-arrival), Venn achieves average JCT speedups of 1.87×, 1.78×, 1.72×, 1.88×, and 1.63× respectively over optimized random matching.", "status": "supported", "falsification": "Venn's average JCT speedup over random matching falls below 1.63× on any of the five standard workloads under the same experimental setup.", "dependencies": ["C02", "C03"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "Table 1", "caption": "Table 1 (§5.2): Average JCT speedup (×) over random matching for FIFO, SRSF, and Venn across five workload scenarios.", "markdown": "| Workload | FIFO | SRSF | Venn |\n|----------|------|------|------|\n| Even | 1.38× | 1.69× | 1.87× |\n| Small | 1.48× | 1.68× | 1.78× |\n| Large | 1.64× | 1.57× | 1.72× |\n| Low | 1.55× | 1.66× | 1.88× |\n| High | 1.42× | 1.41× | 1.63× |\n\nBaseline = optimized random matching (1.0×). Even: sampled from all jobs. Small: below-average total demand. Large: above-average total demand. Low: below-average per-round demand. High: above-average per-round demand."}, {"id": "Table 2", "caption": "Table 2 (§5.3): Venn's average JCT improvement broken down by job total-demand percentile (25th, 50th, 75th) across five workloads.", "markdown": "| Workload | 25th percentile | 50th percentile | 75th percentile |\n|----------|-----------------|-----------------|-----------------|\n| Even | 11.5× | 7.2× | 5.6× |\n| Small | 6.8× | 5.2× | 4.3× |\n| Large | 3.7× | 2.9× | 2.7× |\n| Low | 11.6× | 7.5× | 4.7× |\n| High | 5.1× | 3.3× | 3.1× |\n\nEach cell = Venn's JCT improvement for jobs with total demand at or below the stated percentile. Jobs with smaller total demand benefit disproportionately from Venn's scheduling."}, {"id": "Table 3", "caption": "Table 3 (§5.3): Venn's average JCT improvement broken down by device eligibility type across five workloads.", "markdown": "| Workload | General | Compute-rich | Memory-rich | High-performance |\n|----------|---------|--------------|-------------|------------------|\n| Even | 1.5× | 7.2× | 5.3× | 3.9× |\n| Small | 0.9× | 6.0× | 2.8× | 2.6× |\n| Large | 0.9× | 3.7× | 1.8× | 2.6× |\n| Low | 0.8× | 3.4× | 2.1× | 8.7× |\n| High | 0.8× | 2.2× | 2.2× | 5.6× |\n\nGeneral resources are the most abundant (all devices eligible), so Venn provides little or no benefit there. High-performance and Compute-rich resources are scarcer; Venn provides the largest improvements for jobs requiring them."}, {"id": "Table 4", "caption": "Table 4 (§5.4): Average JCT improvement for FIFO, SRSF, and Venn on four biased workloads where job resource requirements are skewed toward one category.", "markdown": "| Workload | FIFO | SRSF | Venn |\n|-----------------|-------|-------|-------|\n| General | 1.46× | 1.78× | 1.94× |\n| Compute-heavy | 1.73× | 2.08× | 2.23× |\n| Memory-heavy | 1.68× | 2.05× | 2.27× |\n| Resource-heavy | 1.65× | 1.90× | 2.01× |\n\nBaseline = optimized random matching (1.0×). Biased workloads create longer queues in one resource category, making contention-aware scheduling more impactful. \"Resource-heavy\" workload has jobs skewed toward High-performance resources."}, {"id": "Figure 4", "caption": "Figure 4 (§2.3): Average test accuracy vs. training round for 1, 5, 10, and 20 concurrent CL jobs sharing a device pool, showing accuracy degradation with contention. Conditions: ResNet-18, 100 clients/round, FEMNIST; device pool evenly partitioned; random device-to-job matching.", "markdown": "| Number of Jobs | Approximate Final Accuracy (after sufficient rounds) |\n|----------------|------------------------------------------------------|\n| 1 job | ≈ 0.80 |\n| 5 jobs | ≈ 0.72 |\n| 10 jobs | ≈ 0.65 |\n| 20 jobs | ≈ 0.57 |\n\nKey finding: as the number of concurrent CL jobs increases from 1 to 20, final test accuracy degrades by approximately 0.23 accuracy points (≈29% relative degradation). Values marked ≈ are best-effort readings from the figure, not tabulated in the paper."}], "data": []}, "verified_by": [{"id": "E01", "title": "End-to-End JCT Improvement Across Five Workloads", "setup": "Model: ResNet-18 (He et al., 2016) and MobileNet-V2 (Sandler et al., 2018) for real experiments; simulation uses job demand traces from Figure 8b. Hardware: Event-driven simulator (large scale); real CL testbed (small scale). Dataset: FEMNIST (Cohen et al., 2017) for real experiments; FedScale device traces (Lai et al., 2021a) + AI Benchmark (Ignatov et al., 2019) for simulation. System: 50 concurrent CL jobs (simulation); 20 concurrent jobs (real); Poisson arrivals with 30-min average inter-arrival; 5 workload types: Even (all jobs), Small (below-average demand), Large (above-average demand), Low (below-average per-round demand), High (above-average per-round demand); device eligibility stratified into 4 categories (General, Compute-Rich, Memory-Rich, High-Performance)", "metrics": "Average JCT speedup (×) over optimized random matching; reported per workload scenario and per scheduler."}], "artifact": [{"name": "venn_sched — Algorithm 1 (Intersection Resource Scheduling)", "pointer": "src/execution/venn_scheduler.py", "what": "Transcribed reference implementation of the IRS two-level scheduling heuristic (RequestHandler -> venn_sched)."}, {"name": "Algorithm 1 pseudocode & complexity", "pointer": "logic/solution/algorithm.md — Algorithm 1: Intersection Resource Scheduling (Venn-Sched)", "what": "Recipe section: pseudocode and complexity analysis for the scheduling heuristic."}], "concepts": ["Intersection Resource Scheduling (IRS)", "Job Completion Time (JCT)"], "built_on": [{"rw_id": "RW01", "name": "Bonawitz et al., 2019 (Google FL at Scale)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Huba et al., 2022 (Meta Papaya)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Paulik et al., 2021 (Apple FL Infrastructure)", "relation_raw": "baseline"}, {"rw_id": "RW05", "name": "Lai et al., 2021a (FedScale Benchmark)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW10", "name": "He et al., 2023 (GlueFL)", "relation_raw": "bounds"}]}, {"id": "N09", "type": "experiment", "parent": "N08", "title": "Ablation: IRS-only vs. matching-only vs. full Venn", "body": "IRS scheduling alone (Venn w/o match) gives 1.79× on Low, 1.63× on High. Matching alone (Venn w/o sched) gives 1.62× on Low, 1.42× on High. Full Venn: 1.88× Low, 1.63× High.", "thinking": "The end-to-end win is real, but it's worth knowing which half of Venn is doing the work: the IRS scheduling component or the tier-based device matching component. Turning each piece off in isolation answers that. Under the Low-contention workload, scheduling alone reaches 1.79x and matching alone reaches 1.62x, while the full system reaches 1.88x, so both pieces contribute but scheduling contributes more. Under the High-contention workload the gap widens further: scheduling alone already reaches 1.63x, matching alone lags at 1.42x, and adding matching on top of scheduling adds essentially nothing (full Venn stays at 1.63x). Contention-aware scheduling is doing most of the heavy lifting, and device matching mainly helps when contention is mild.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["§5.3"], "why": [{"id": "C02", "title": "Contention-aware IRS scheduling is the primary driver of JCT improvement under high contention", "statement": "The IRS scheduling component alone (Venn w/o matching) achieves 1.79× average JCT improvement in the Low workload; without scheduling (Venn w/o sched / FIFO), improvement is only 1.62×. Under High workload, IRS yields 1.63× and matching adds no further gain.", "status": "supported", "falsification": "Removing the IRS scheduling component does not reduce average JCT improvement by more than 5% relative to full Venn in any tested workload.", "dependencies": ["C01"]}, {"id": "C03", "title": "Tier-based device matching reduces JCT primarily under low resource contention", "statement": "The matching component alone (Venn w/o sched) achieves 1.62× JCT improvement in the Low workload versus FIFO's 1.55×, but under High workload both Venn w/o sched and FIFO achieve 1.42× — matching provides no benefit when contention is high.", "status": "supported", "falsification": "The matching component provides statistically significant JCT improvement over FIFO in the High contention workload.", "dependencies": ["C01"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "Table 2", "caption": "Table 2 (§5.3): Venn's average JCT improvement broken down by job total-demand percentile (25th, 50th, 75th) across five workloads.", "markdown": "| Workload | 25th percentile | 50th percentile | 75th percentile |\n|----------|-----------------|-----------------|-----------------|\n| Even | 11.5× | 7.2× | 5.6× |\n| Small | 6.8× | 5.2× | 4.3× |\n| Large | 3.7× | 2.9× | 2.7× |\n| Low | 11.6× | 7.5× | 4.7× |\n| High | 5.1× | 3.3× | 3.1× |\n\nEach cell = Venn's JCT improvement for jobs with total demand at or below the stated percentile. Jobs with smaller total demand benefit disproportionately from Venn's scheduling."}, {"id": "Table 3", "caption": "Table 3 (§5.3): Venn's average JCT improvement broken down by device eligibility type across five workloads.", "markdown": "| Workload | General | Compute-rich | Memory-rich | High-performance |\n|----------|---------|--------------|-------------|------------------|\n| Even | 1.5× | 7.2× | 5.3× | 3.9× |\n| Small | 0.9× | 6.0× | 2.8× | 2.6× |\n| Large | 0.9× | 3.7× | 1.8× | 2.6× |\n| Low | 0.8× | 3.4× | 2.1× | 8.7× |\n| High | 0.8× | 2.2× | 2.2× | 5.6× |\n\nGeneral resources are the most abundant (all devices eligible), so Venn provides little or no benefit there. High-performance and Compute-rich resources are scarcer; Venn provides the largest improvements for jobs requiring them."}, {"id": "Table 4", "caption": "Table 4 (§5.4): Average JCT improvement for FIFO, SRSF, and Venn on four biased workloads where job resource requirements are skewed toward one category.", "markdown": "| Workload | FIFO | SRSF | Venn |\n|-----------------|-------|-------|-------|\n| General | 1.46× | 1.78× | 1.94× |\n| Compute-heavy | 1.73× | 2.08× | 2.23× |\n| Memory-heavy | 1.68× | 2.05× | 2.27× |\n| Resource-heavy | 1.65× | 1.90× | 2.01× |\n\nBaseline = optimized random matching (1.0×). Biased workloads create longer queues in one resource category, making contention-aware scheduling more impactful. \"Resource-heavy\" workload has jobs skewed toward High-performance resources."}, {"id": "Figure 3", "caption": "Figure 3 (§2.3): Toy example comparing Random Matching (avg JCT=12), SRSF (avg JCT=11), and Optimal (avg JCT=9.3) scheduling for 3 CL jobs with overlapping eligibility.", "markdown": "### Setup\n\n| Job | Training Data | # Devices Required |\n|-----|--------------|-------------------|\n| Job 1 (Keyboard) | Keyboard | 100% eligible devices |\n| Job 2 (Emoji) | Emoji | 50% eligible devices |\n| Job 3 (Emoji) | Emoji | 50% eligible devices |\n\n### Average JCT Results\n\n| Strategy | Average JCT |\n|----------|-------------|\n| Random Matching | 12 (time units) |\n| SRSF (Shortest Remaining Service First) | 11 (time units) |\n| Optimal | 9.3 (time units) |\n\nKey finding: Random Matching and SRSF inefficiently allocate scarce Emoji-eligible devices to Job 1 (Keyboard), which has ample alternatives. Optimal schedule reserves scarce Emoji devices for Jobs 2 and 3, achieving 23% lower avg JCT than random."}, {"id": "Figure 11", "caption": "Figure 11 (§5.3): Average JCT improvement breakdown — per-component ablation for Low and High workloads: Random, FIFO, Venn w/o sched, Venn w/o match, Venn.", "markdown": "### (a) Low Workload\n\n| Scheduler Variant | Avg. JCT Improvement |\n|-------------------|---------------------|\n| Random | 1.0 |\n| FIFO | 1.55 |\n| Venn w/o sched | 1.62 |\n| Venn w/o match | 1.79 |\n| Venn (full) | 1.88 |\n\n### (b) High Workload\n\n| Scheduler Variant | Avg. JCT Improvement |\n|-------------------|---------------------|\n| Random | 1.0 |\n| FIFO | 1.42 |\n| Venn w/o sched | 1.42 |\n| Venn w/o match | 1.63 |\n| Venn (full) | 1.63 |\n\nKey findings: IRS scheduling (Venn w/o match) provides the larger share of improvement in both workloads. Tier-based matching (the difference between Venn w/o match and full Venn) adds +0.09× under Low contention but +0.00× under High contention, confirming C03. Under High contention, matching is not beneficial."}], "data": []}, "verified_by": [{"id": "E02", "title": "Ablation — Component-Level JCT Improvement Breakdown", "setup": "Model: Same as E01 (simulation). Hardware: Event-driven simulator. Dataset: FedScale + AI Benchmark device traces. System: Low workload and High workload scenarios from E01; compare four variants: Random (baseline), FIFO, Venn w/o sched (only matching + FIFO), Venn w/o match (only IRS scheduling), Venn (full)", "metrics": "Average JCT improvement (×) over random matching, per variant, per workload."}], "artifact": [{"name": "venn_sched — Algorithm 1 (Intersection Resource Scheduling)", "pointer": "src/execution/venn_scheduler.py", "what": "Transcribed reference implementation of the IRS two-level scheduling heuristic (RequestHandler -> venn_sched)."}, {"name": "Algorithm 1 pseudocode & complexity", "pointer": "logic/solution/algorithm.md — Algorithm 1: Intersection Resource Scheduling (Venn-Sched)", "what": "Recipe section: pseudocode and complexity analysis for the scheduling heuristic."}, {"name": "venn_match — Algorithm 2 (Tier-Based Device Matching)", "pointer": "src/execution/venn_scheduler.py", "what": "Transcribed reference implementation of the conditional tier-based device matcher (venn_match)."}, {"name": "Algorithm 2 pseudocode & condition", "pointer": "logic/solution/algorithm.md — Algorithm 2: Device Matching (Venn-Match)", "what": "Recipe section: pseudocode and the JCT-reduction gating condition."}], "concepts": ["Intersection Resource Scheduling (IRS)"], "built_on": [{"rw_id": "RW01", "name": "Bonawitz et al., 2019 (Google FL at Scale)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Huba et al., 2022 (Meta Papaya)", "relation_raw": "baseline"}, {"rw_id": "RW08", "name": "Garey et al., 1976 (Flowshop Scheduling)", "relation_raw": "imports"}, {"rw_id": "RW09", "name": "Wang et al., 2023 (Flint)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW04", "name": "Lai et al., 2021b (Oort)", "relation_raw": "bounds"}, {"rw_id": "RW06", "name": "Balakrishnan et al., 2022 (Diverse Client Selection)", "relation_raw": "bounds"}, {"rw_id": "RW10", "name": "He et al., 2023 (GlueFL)", "relation_raw": "bounds"}]}, {"id": "N10", "type": "question", "parent": "N03", "title": "How to reduce response collection time through device-to-job matching?", "body": "Response collection time is determined by the slowest device. Assigning homogeneous-capacity devices reduces tail latency but reduces the eligible pool, increasing scheduling delay.", "thinking": "Scheduling delay is now handled, but N03's decomposition also called out a second, independent lever: response collection time, the wait for the slowest assigned device to finish and report back. The natural fix is to hand a job only devices of similar (fast) hardware capability, which shrinks tail latency. But that immediately creates a tension with the scheduling side of the problem: restricting a job to a narrower, homogeneous slice of the device pool shrinks its eligible pool and can drive scheduling delay back up. This question inherits directly from the two-way split introduced in N03, hence the explicit dependency back to that decision.", "support_level": null, "isolated": false, "depends_on": ["N03"], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Response Collection Time", "Scheduling Delay"]}, {"id": "N11", "type": "dead_end", "parent": "N10", "title": "Always assign highest-tier (fastest) devices to every job", "body": "Hypothesis: Consistently assigning top-tier devices minimizes response collection time.\nFailure mode: Restricts device pool (fewer devices available), significantly increasing scheduling delay under contention. Also reduces participant diversity, potentially harming model quality.\nLesson: Tier-based matching must be conditional on the JCT tradeoff (c_i ratio); always-top-tier is harmful under high contention.", "thinking": "The most obvious first attempt at matching is to always hand every job the fastest, top-tier devices available, on the logic that faster devices report back sooner. That backfires: always restricting to top-tier devices shrinks the usable device pool for every job, which drives up scheduling delay exactly when contention is already high, and it also narrows participant diversity in a way that risks hurting model quality. The lesson is that tier restriction can't be an unconditional rule; it has to be applied only when the tradeoff between scheduling delay and response time (captured by the ratio c_i) actually favors it, since always-top-tier actively hurts JCT under high contention.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Response Collection Time", "Scheduling Delay", "Job Completion Time (JCT)"]}, {"id": "N12", "type": "decision", "parent": "N10", "title": "Conditional tier-based matching with randomized tier selection", "body": "Apply tier restriction only when 1 + c_i > V + g_u * c_i; select tier randomly to preserve device diversity\nAlternatives: Always assign top tier (rejected: see N11); No tier-based matching at all (FIFO/SRSF baseline); Deterministic tier assignment (always same tier) — rejected: reduces participant diversity", "thinking": "The fix for N11's failure is to make tier restriction conditional rather than automatic: only route a job to a single hardware tier when the math says it will actually shrink total JCT, via the condition 1 + c_i > V + g_u * c_i, which weighs the scheduling-delay cost of a narrower pool against the response-time savings of faster devices. When the condition does fire, the tier itself is picked at random rather than always choosing the fastest tier, which keeps device diversity intact across rounds instead of converging on the same subset of devices every time. Three alternatives were considered and set aside: always assigning the top tier (already shown to fail in N11), skipping tier-based matching entirely (the FIFO/SRSF baseline), and deterministically always picking the same tier (which would reintroduce the diversity problem).", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Figure 7 (condition visualization); Figure 13 (optimal V; gains plateau); Figure 11 (matching helps under low contention only)"], "why": [], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure 11", "caption": "Figure 11 (§5.3): Average JCT improvement breakdown — per-component ablation for Low and High workloads: Random, FIFO, Venn w/o sched, Venn w/o match, Venn.", "markdown": "### (a) Low Workload\n\n| Scheduler Variant | Avg. JCT Improvement |\n|-------------------|---------------------|\n| Random | 1.0 |\n| FIFO | 1.55 |\n| Venn w/o sched | 1.62 |\n| Venn w/o match | 1.79 |\n| Venn (full) | 1.88 |\n\n### (b) High Workload\n\n| Scheduler Variant | Avg. JCT Improvement |\n|-------------------|---------------------|\n| Random | 1.0 |\n| FIFO | 1.42 |\n| Venn w/o sched | 1.42 |\n| Venn w/o match | 1.63 |\n| Venn (full) | 1.63 |\n\nKey findings: IRS scheduling (Venn w/o match) provides the larger share of improvement in both workloads. Tier-based matching (the difference between Venn w/o match and full Venn) adds +0.09× under Low contention but +0.00× under High contention, confirming C03. Under High contention, matching is not beneficial."}], "data": []}, "verified_by": [], "artifact": [{"name": "venn_match — Algorithm 2 (Tier-Based Device Matching)", "pointer": "src/execution/venn_scheduler.py", "what": "Transcribed reference implementation of the conditional tier-based device matcher (venn_match)."}, {"name": "Algorithm 2 pseudocode & condition", "pointer": "logic/solution/algorithm.md — Algorithm 2: Device Matching (Venn-Match)", "what": "Recipe section: pseudocode and the JCT-reduction gating condition."}]}, {"id": "N13", "type": "experiment", "parent": "N12", "title": "Validate full Venn on biased workloads and real testbed", "body": "On biased workloads: Venn achieves up to 2.27× (Memory-heavy) over random. On real testbed with ResNet-18+MobileNet-V2 on FEMNIST: Venn converges faster without hurting final accuracy (Figure 9). Overhead <1ms for 1000 jobs (Figure 10).", "thinking": "With both the scheduling and matching pieces validated separately, the last step is to stress-test the complete system under harder conditions and on real hardware. On workloads deliberately skewed so most jobs compete for one scarce resource category, Venn's advantage grows further, up to 2.27x over random matching on a memory-heavy workload. On an actual CL testbed training ResNet-18 and MobileNet-V2 on FEMNIST, Venn reaches the same final accuracy as the FIFO and SRSF baselines but gets there faster, so the scheduling gains aren't coming at the cost of model quality. And practically, the scheduler itself stays cheap to run: under 1 millisecond of overhead even at 1000 concurrent jobs.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Figure 9", "§5.2", "§5.4"], "why": [{"id": "C04", "title": "Venn achieves logarithmic-linear time complexity and introduces negligible scheduling overhead", "statement": "Venn's scheduling algorithm has time complexity max(O(m log m), O(n²)) where m is the number of jobs and n is the number of job groups. Empirically, scheduling latency remains below ~1 ms for up to 1000 jobs and 100 job groups.", "status": "supported", "falsification": "Scheduling latency exceeds 10 ms for 1000 jobs or 100 job groups in the overhead evaluation.", "dependencies": []}, {"id": "C05", "title": "Venn does not adversely affect CL model accuracy while speeding up convergence", "statement": "In real CL system experiments (ResNet-18 + MobileNet-V2 on FEMNIST, 20 jobs), Venn and its baselines (FIFO, SRSF) converge to the same final average test accuracy (~0.75), but Venn reaches this accuracy faster.", "status": "supported", "falsification": "Venn's final model accuracy is more than 1 percentage point below that of random matching under the same number of rounds.", "dependencies": ["C01"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "Figure 10", "caption": "Figure 10 (§5.2): Venn scheduling latency (ms) vs. number of jobs (up to 1000) and job groups (up to 100), demonstrating negligible overhead.", "markdown": "### Latency vs. Number of Jobs\n\n| Number of Jobs | Latency (ms) |\n|----------------|-------------|\n| 100 | ≈ 0.2 |\n| 250 | ≈ 0.3 |\n| 500 | ≈ 0.5 |\n| 750 | ≈ 0.7 |\n| 1000 | ≈ 1.0 |\n\n### Latency vs. Number of Job Groups\n\n| Number of Job Groups | Latency (ms) |\n|---------------------|-------------|\n| 10 | ≈ 0.2 |\n| 25 | ≈ 0.3 |\n| 50 | ≈ 0.5 |\n| 80 | ≈ 0.8 |\n| 100 | ≈ 1.0 |\n\nKey finding: scheduling latency grows sub-linearly (consistent with max(O(m log m), O(n²)) complexity) and stays below ~1 ms even at 1000 jobs and 100 job groups. Values marked ≈ (best-effort readings from figure)."}, {"id": "Table 4", "caption": "Table 4 (§5.4): Average JCT improvement for FIFO, SRSF, and Venn on four biased workloads where job resource requirements are skewed toward one category.", "markdown": "| Workload | FIFO | SRSF | Venn |\n|-----------------|-------|-------|-------|\n| General | 1.46× | 1.78× | 1.94× |\n| Compute-heavy | 1.73× | 2.08× | 2.23× |\n| Memory-heavy | 1.68× | 2.05× | 2.27× |\n| Resource-heavy | 1.65× | 1.90× | 2.01× |\n\nBaseline = optimized random matching (1.0×). Biased workloads create longer queues in one resource category, making contention-aware scheduling more impactful. \"Resource-heavy\" workload has jobs skewed toward High-performance resources."}], "data": []}, "verified_by": [{"id": "E03", "title": "Scheduling Overhead Scalability", "setup": "Model: N/A (scheduling overhead only, no ML training). Hardware: Not specified in paper. Dataset: Synthetic; vary number of jobs from 100 to 1000 and number of job groups from 10 to 100. System: Venn scheduler invoked once (one-time trigger); measure wall-clock latency", "metrics": "Scheduling latency (ms); qualitative shape (should be sub-linear relative to job count consistent with max(O(m log m), O(n²)))."}, {"id": "E04", "title": "Model Accuracy — Venn Does Not Hurt Convergence", "setup": "Model: ResNet-18 (He et al., 2016) and MobileNet-V2 (Sandler et al., 2018). Hardware: Real CL testbed (small scale). Dataset: FEMNIST (Cohen et al., 2017). System: 20 concurrent CL jobs; real CL system execution; compare FIFO, SRSF, Venn", "metrics": "Average test accuracy (y-axis 0.60–0.75) vs. wall-clock time (seconds, x-axis 0–25000s)."}], "artifact": [{"name": "venn_sched — Algorithm 1 (Intersection Resource Scheduling)", "pointer": "src/execution/venn_scheduler.py", "what": "Transcribed reference implementation of the IRS two-level scheduling heuristic (RequestHandler -> venn_sched)."}, {"name": "venn_match — Algorithm 2 (Tier-Based Device Matching)", "pointer": "src/execution/venn_scheduler.py", "what": "Transcribed reference implementation of the conditional tier-based device matcher (venn_match)."}, {"name": "System architecture", "pointer": "logic/solution/architecture.md", "what": "Recipe: full component graph and per-scheduling-event workflow exercised end to end."}], "built_on": [{"rw_id": "RW05", "name": "Lai et al., 2021a (FedScale Benchmark)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW07", "name": "Even et al., 1975 (MCF Complexity)", "relation_raw": "bounds"}]}], "context": {"title": "Problem", "summary": "By grouping jobs with identical device requirements into Resource-Homogeneous Job Groups and decoupling the scheduling problem into (1) intra-group ordering by smallest-remaining-demand and (2) inter-group ordering by scarcity + queue-length ratio, Venn reduces the NP-hard MCF problem to a tractable max(O(m log m), O(n²)) heuristic that achieves near-optimal average JCT.", "sections": [{"role": "setting", "heading": "", "present": false, "entries": []}, {"role": "observations", "heading": "Observations", "present": true, "entries": [{"ent_id": "O1", "inferred_id": false, "ent_title": "CL devices exhibit diurnal availability patterns", "text": "Statement: Real-world CL device availability (devices that are charging and connected to WiFi) fluctuates significantly over time following a diurnal pattern. A real-world client availability trace (FedScale) encompasses 180 million trace items of device behavior over a week.\nEvidence: Figure 2a (diurnal availability plot); FedScale trace (Lai et al., 2021a)\nImplication: CL jobs cannot assume on-demand resource availability; they must wait for devices to become available, causing inherent scheduling delays.", "unstructured": false, "fields": [{"label": "Statement", "value": "Real-world CL device availability (devices that are charging and connected to WiFi) fluctuates significantly over time following a diurnal pattern. A real-world client availability trace (FedScale) encompasses 180 million trace items of device behavior over a week."}, {"label": "Evidence", "value": "Figure 2a (diurnal availability plot); FedScale trace (Lai et al., 2021a)"}, {"label": "Implication", "value": "CL jobs cannot assume on-demand resource availability; they must wait for devices to become available, causing inherent scheduling delays."}], "refs": []}, {"ent_id": "O2", "inferred_id": false, "ent_title": "Edge devices are highly heterogeneous in hardware capacity", "text": "Statement: Edge devices in CL vary widely in CPU and memory capacities. For example, different models (MobileNet, VideoSR, MobileBERT) have different minimum hardware requirements, and many devices fall below the threshold for higher-demand models.\nEvidence: Figure 2b (CPU vs. Memory score scatter plot from AI Benchmark, Ignatov et al., 2019)\nImplication: Jobs can only use a subset of the available device pool; this subset varies per job based on hardware requirements.", "unstructured": false, "fields": [{"label": "Statement", "value": "Edge devices in CL vary widely in CPU and memory capacities. For example, different models (MobileNet, VideoSR, MobileBERT) have different minimum hardware requirements, and many devices fall below the threshold for higher-demand models."}, {"label": "Evidence", "value": "Figure 2b (CPU vs. Memory score scatter plot from AI Benchmark, Ignatov et al., 2019)"}, {"label": "Implication", "value": "Jobs can only use a subset of the available device pool; this subset varies per job based on hardware requirements."}], "refs": []}, {"ent_id": "O3", "inferred_id": false, "ent_title": "Multiple CL jobs compete for overlapping device subsets", "text": "Statement: CL jobs require specific device subsets (based on hardware, data, software version). These subsets can overlap, nest, or be mutually exclusive, creating complex multi-resource contentions.\nEvidence: Figure 3 toy example; Figure 8a (device stratification into 4 categories); §2.1\nImplication: Assigning a device to the wrong job wastes a scarce resource and prolongs another job's scheduling delay.", "unstructured": false, "fields": [{"label": "Statement", "value": "CL jobs require specific device subsets (based on hardware, data, software version). These subsets can overlap, nest, or be mutually exclusive, creating complex multi-resource contentions."}, {"label": "Evidence", "value": "Figure 3 toy example; Figure 8a (device stratification into 4 categories); §2.1"}, {"label": "Implication", "value": "Assigning a device to the wrong job wastes a scarce resource and prolongs another job's scheduling delay."}], "refs": []}, {"ent_id": "O4", "inferred_id": false, "ent_title": "Scheduling delay is a significant and neglected JCT component", "text": "Statement: When multiple CL jobs compete for devices, scheduling delay (time to acquire enough devices) grows substantially and can dominate total JCT. In experiments with 1–20 concurrent jobs (ResNet-18, 100 clients/round, FEMNIST), scheduling delay increases sharply as job count rises.\nEvidence: Figure 5 (JCT breakdown: scheduling delay vs. response collection time vs. job count); §2.3\nImplication: Optimizing only response collection time (as most prior work does) leaves major JCT savings on the table.", "unstructured": false, "fields": [{"label": "Statement", "value": "When multiple CL jobs compete for devices, scheduling delay (time to acquire enough devices) grows substantially and can dominate total JCT. In experiments with 1–20 concurrent jobs (ResNet-18, 100 clients/round, FEMNIST), scheduling delay increases sharply as job count rises."}, {"label": "Evidence", "value": "Figure 5 (JCT breakdown: scheduling delay vs. response collection time vs. job count); §2.3"}, {"label": "Implication", "value": "Optimizing only response collection time (as most prior work does) leaves major JCT savings on the table."}], "refs": []}, {"ent_id": "O5", "inferred_id": false, "ent_title": "Existing CL resource managers all use random device-to-job matching", "text": "Statement: Apple (Paulik et al., 2021), Meta (Huba et al., 2022), and Google (Bonawitz et al., 2019) use random matching in various forms (client-driven sampling, centralized random matching, job-driven random sampling).\nEvidence: §2.2; cited implementations\nImplication: Random matching is suboptimal under resource contention; it wastes scarce resources on jobs that have plentiful alternatives.", "unstructured": false, "fields": [{"label": "Statement", "value": "Apple (Paulik et al., 2021), Meta (Huba et al., 2022), and Google (Bonawitz et al., 2019) use random matching in various forms (client-driven sampling, centralized random matching, job-driven random sampling)."}, {"label": "Evidence", "value": "§2.2; cited implementations"}, {"label": "Implication", "value": "Random matching is suboptimal under resource contention; it wastes scarce resources on jobs that have plentiful alternatives."}], "refs": []}, {"ent_id": "O6", "inferred_id": false, "ent_title": "Resource contention degrades model accuracy", "text": "Statement: Evenly partitioning a device pool across 1, 5, 10, and 20 concurrent CL jobs causes noticeable degradation in round-to-accuracy performance (ResNet-18, 100 clients/round, FEMNIST).\nEvidence: Figure 4 (average test accuracy vs. round for different numbers of jobs)\nImplication: Participant diversity is reduced under contention; smart scheduling can recover this diversity.", "unstructured": false, "fields": [{"label": "Statement", "value": "Evenly partitioning a device pool across 1, 5, 10, and 20 concurrent CL jobs causes noticeable degradation in round-to-accuracy performance (ResNet-18, 100 clients/round, FEMNIST)."}, {"label": "Evidence", "value": "Figure 4 (average test accuracy vs. round for different numbers of jobs)"}, {"label": "Implication", "value": "Participant diversity is reduced under contention; smart scheduling can recover this diversity."}], "refs": []}]}, {"role": "gaps", "heading": "Gaps", "present": true, "entries": [{"ent_id": "G1", "inferred_id": false, "ent_title": "No existing CL resource manager accounts for inter-job resource contention", "text": "Statement: Existing single-job optimizations (Oort, FedScale, GlueFL) assume sufficient devices are always available. Multi-job managers (Apple, Meta, Google) use random matching and do not model overlapping eligibility sets.\nCaused by: O3, O5\nExisting attempts: Client selection heuristics (Lai et al., 2021b; Balakrishnan et al., 2022); quantization (Reisizadeh et al., 2020)\nWhy they fail: They operate at the single-job level and do not coordinate device assignment across competing jobs.", "unstructured": false, "fields": [{"label": "Statement", "value": "Existing single-job optimizations (Oort, FedScale, GlueFL) assume sufficient devices are always available. Multi-job managers (Apple, Meta, Google) use random matching and do not model overlapping eligibility sets."}, {"label": "Caused by", "value": "O3, O5"}, {"label": "Existing attempts", "value": "Client selection heuristics (Lai et al., 2021b; Balakrishnan et al., 2022); quantization (Reisizadeh et al., 2020)"}, {"label": "Why they fail", "value": "They operate at the single-job level and do not coordinate device assignment across competing jobs."}], "refs": [{"raw": "O3", "kind": "observation", "target": null}, {"raw": "O5", "kind": "observation", "target": null}]}, {"ent_id": "G2", "inferred_id": false, "ent_title": "Scheduling delay is not modeled or minimized by prior work", "text": "Statement: Prior work on CL optimization focuses exclusively on response collection time (model convergence, straggler mitigation). Scheduling delay is ignored as a JCT factor.\nCaused by: O4, O5\nExisting attempts: SRSF, FIFO — borrowed from cluster scheduling, not designed for CL's overlapping eligibility structure\nWhy they fail: SRSF and FIFO do not account for the intersection structure of device eligibility sets across jobs; they can waste scarce resources on jobs that have abundant alternatives (Figure 3).", "unstructured": false, "fields": [{"label": "Statement", "value": "Prior work on CL optimization focuses exclusively on response collection time (model convergence, straggler mitigation). Scheduling delay is ignored as a JCT factor."}, {"label": "Caused by", "value": "O4, O5"}, {"label": "Existing attempts", "value": "SRSF, FIFO — borrowed from cluster scheduling, not designed for CL's overlapping eligibility structure"}, {"label": "Why they fail", "value": "SRSF and FIFO do not account for the intersection structure of device eligibility sets across jobs; they can waste scarce resources on jobs that have abundant alternatives (Figure 3)."}], "refs": [{"raw": "O4", "kind": "observation", "target": null}, {"raw": "O5", "kind": "observation", "target": null}]}, {"ent_id": "G3", "inferred_id": false, "ent_title": "No efficient algorithm exists for multi-CL-job resource scheduling at planetary scale", "text": "Statement: The exact multi-commodity flow (MCF) problem is NP-hard (Even et al., 1975). Even linear approximations are computationally infeasible given millions of devices and hundreds of jobs.\nCaused by: O1, O2, O3\nExisting attempts: ILP formulations (Appendix B of paper)\nWhy they fail: Computational complexity is exacerbated by device scale and diverse eligibility constraints.", "unstructured": false, "fields": [{"label": "Statement", "value": "The exact multi-commodity flow (MCF) problem is NP-hard (Even et al., 1975). Even linear approximations are computationally infeasible given millions of devices and hundreds of jobs."}, {"label": "Caused by", "value": "O1, O2, O3"}, {"label": "Existing attempts", "value": "ILP formulations (Appendix B of paper)"}, {"label": "Why they fail", "value": "Computational complexity is exacerbated by device scale and diverse eligibility constraints."}], "refs": [{"raw": "O1", "kind": "observation", "target": null}, {"raw": "O2", "kind": "observation", "target": null}, {"raw": "O3", "kind": "observation", "target": null}]}]}, {"role": "insight", "heading": "Key Insight", "present": true, "entries": [{"ent_id": "1", "inferred_id": true, "ent_title": "Insight", "text": "By grouping jobs with identical device requirements into Resource-Homogeneous Job Groups and decoupling the scheduling problem into (1) intra-group ordering by smallest-remaining-demand and (2) inter-group ordering by scarcity + queue-length ratio, Venn reduces the NP-hard MCF problem to a tractable max(O(m log m), O(n²)) heuristic that achieves near-optimal average JCT.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "2", "inferred_id": true, "ent_title": "Derived from", "text": "O3, O4, G1, G2, G3", "unstructured": true, "fields": [], "refs": [{"raw": "O3", "kind": "observation", "target": null}, {"raw": "O4", "kind": "observation", "target": null}, {"raw": "G1", "kind": "gap", "target": null}, {"raw": "G2", "kind": "gap", "target": null}, {"raw": "G3", "kind": "gap", "target": null}]}, {"ent_id": "3", "inferred_id": true, "ent_title": "Enables", "text": "Contention-aware scheduling (IRS, Algorithm 1) and tier-based device matching (Algorithm 2) that jointly minimize average JCT across competing CL jobs.", "unstructured": true, "fields": [], "refs": []}]}, {"role": "assumptions", "heading": "Assumptions", "present": true, "entries": [{"ent_id": "A1", "inferred_id": false, "ent_title": "Devices check in to a centralized Venn scheduler before being assigned to jobs", "text": "A1: Devices check in to a centralized Venn scheduler before being assigned to jobs.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A2", "inferred_id": false, "ent_title": "Each device is assigned to at most one CL job per check-in", "text": "A2: Each device is assigned to at most one CL job per check-in.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A3", "inferred_id": false, "ent_title": "Device eligibility is deterministic and known at scheduling time (based on hardware capacity, data, software version)", "text": "A3: Device eligibility is deterministic and known at scheduling time (based on hardware capacity, data, software version).", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A4", "inferred_id": false, "ent_title": "Device response time distribution follows a log-normal distribution", "text": "A4: Device response time distribution follows a log-normal distribution.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A5", "inferred_id": false, "ent_title": "CL jobs are synchronous (each round requires a minimum fraction of target participants); asynchronous extensions are noted but not the primary focus", "text": "A5: CL jobs are synchronous (each round requires a minimum fraction of target participants); asynchronous extensions are noted but not the primary focus.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A6", "inferred_id": false, "ent_title": "Resource arrival patterns have a 24-hour periodicity (diurnal), making 24-hour averaging of eligibility rates robust", "text": "A6: Resource arrival patterns have a 24-hour periodicity (diurnal), making 24-hour averaging of eligibility rates robust.", "unstructured": true, "fields": [], "refs": []}]}]}, "glossary": {"title": "Concepts", "groups": [], "terms": [{"term_id": "G01", "name": "Job Completion Time (JCT)", "aliases": ["JCT"], "group": "", "definition": "The total time for a CL job to complete one training round. Composed of two parts: scheduling delay ($T_{\\text{sched}}$) — the time from job request submission until sufficient devices are acquired — and response collection time ($T_{\\text{resp}}$) — the time from task dispatch until the required fraction of devices submit training results.", "fields": [{"label": "Notation", "value": "$\\text{JCT}_i = T_{\\text{sched},i} + T_{\\text{resp},i}$"}, {"label": "Boundary conditions", "value": "Applies per-round; multi-round JCT sums individual round JCTs. Not applicable to asynchronous CL jobs where rounds are not synchronized."}], "related": ["G02", "G03"], "refs": []}, {"term_id": "G02", "name": "Scheduling Delay", "aliases": [], "group": "", "definition": "The time elapsed from when a job submits a resource request to when it has collected sufficient devices to begin computation. Determined by the arrival time of the last needed device under the scheduling assignment.", "fields": [{"label": "Notation", "value": "$T_{\\text{sched},i} = \\max_s (x_{ij} \\cdot t_s)$ where $x_{ij}=1$ if device $s$ is assigned to job $J_i$"}, {"label": "Boundary conditions", "value": "Dominates JCT when resource contention is high (supply < demand). Negligible when devices are plentiful."}], "related": ["G05"], "refs": []}, {"term_id": "G03", "name": "Response Collection Time", "aliases": [], "group": "", "definition": "The time from when assigned devices receive their computation tasks until the job server collects the required minimum number of responses (80% of target participants in the paper's default setup). Determined by the slowest (95th-percentile tail latency) responding device among participants.", "fields": [{"label": "Notation", "value": "$T_{\\text{resp},i}$"}, {"label": "Boundary conditions", "value": "Dominates JCT when resource contention is low. Modeled using the 95th percentile of a log-normal response time distribution."}], "related": ["G02", "G07"], "refs": []}, {"term_id": "G04", "name": "Intersection Resource Scheduling (IRS)", "aliases": ["IRS"], "group": "", "definition": "A scheduling problem formulation that explicitly models the intersection structure of device eligibility sets across CL jobs. Each job $J_i$ requires devices from an eligible subset $S_k = f(J_i)$; these subsets may overlap, nest, or be disjoint. The IRS objective is $\\min \\sum_{j=1}^{m} T_j$ where $T_j = \\max_i(x_{ij} \\cdot t_i)$, subject to each device being assigned to at most one job and each job receiving exactly $D_j$ devices.", "fields": [{"label": "Notation", "value": "IRS; formalized as an integer multi-commodity flow (MCF) problem"}, {"label": "Boundary conditions", "value": "NP-hard in general (reduces to integer MCF). Venn solves it via a two-step heuristic. The exact ILP formulation is given in Appendix B of the paper."}], "related": ["G05", "G02", "G06"], "refs": []}, {"term_id": "G05", "name": "Resource-Homogeneous Job Group", "aliases": [], "group": "", "definition": "A group of CL jobs that share identical device eligibility requirements (i.e., they all require devices from the same subset $S_j$). Grouping by resource homogeneity reduces the IRS complexity from a joint over all jobs to intra-group + inter-group subproblems.", "fields": [{"label": "Notation", "value": "$G_j = \\{J_i \\mid f(J_i) = S_j, \\forall J_i \\in J\\}_{i=1}^{m_j}$"}, {"label": "Boundary conditions", "value": "Effective when jobs have discrete, categorical device requirements. Less applicable when eligibility requirements form a continuum."}], "related": ["G06"], "refs": []}, {"term_id": "G06", "name": "Contention-Aware Scheduling", "aliases": [], "group": "", "definition": "Venn's two-level scheduling heuristic. Intra-group: sort jobs within each group by remaining demand in ascending order (Shortest Remaining Demand First). Inter-group: initialize allocation to the scarcest group first; then greedily reallocate intersected resources from resource-rich groups to groups with higher queue-length-to-allocated-resource ratios ($m'_j / |S'_j| > m'_k / |S'_k|$). Complexity: $\\max(O(m \\log m), O(n^2))$.", "fields": [{"label": "Notation", "value": "Algorithm 1 (Venn-Sched)"}, {"label": "Boundary conditions", "value": "Invoked on job arrival and completion. Assumes resource eligibility is known at scheduling time. Approximates optimal for the two-group case (proven in Lemma 2) and generalizes greedily to $n$ groups."}], "related": ["G05", "G02"], "refs": []}, {"term_id": "G07", "name": "Tier-Based Device Matching", "aliases": [], "group": "", "definition": "Devices are partitioned into $V$ hardware-capacity tiers. For each served job $J_i$, a random tier $S_u$ is selected. Tier-based matching is applied only if $1 + c_i > V + c_i g_u$, where $c_i = T_{\\text{resp}} / T_{\\text{sched}}$ is the ratio of response collection time to scheduling delay. If the condition holds, the job is assigned only devices from tier $S_u$, reducing response time at the cost of a factor-$V$ scheduling delay increase.", "fields": [{"label": "Notation", "value": "Algorithm 2 (Venn-Match); tiers $S_1, \\ldots, S_V$; speed-up factor $g_v = t_v / t_0$"}, {"label": "Boundary conditions", "value": "Only beneficial when $c_i$ is large (response time dominates sched
