<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — self-expansion</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — self-expansion</h1>
  <p>Research DAG &middot; Self-Expansion of Pre-trained Models with Mixture of Adapters for Continual Learning</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "How to achieve on-demand expansion for PTM-based CL?",
    "description": "Can a PTM-based CL method automatically determine when and where to add new modules, achieving sub-linear growth while maintaining competitive accuracy?",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Fixed adapter pool (ADAM-style) with first-session-only adaptation",
        "result": "Adapter frozen after Task 1; adapts well to tasks similar to Task 1 but shows insufficient plasticity for highly novel distributions",
        "evidence": [
          "C03",
          "Table 2: No Exp.",
          "§4.3"
        ],
        "children": [
          {
            "id": "N03",
            "type": "dead_end",
            "title": "Fixed single adapter per layer (No Expansion)",
            "hypothesis": "One adapter trained on Task 1 would generalize to all future tasks via the frozen PTM's representations",
            "failure_mode": "Accuracy drops significantly on tasks with large distribution shifts (e.g., ImageNet-A: 61.20% vs SEMA 64.53%); insufficient plasticity for novel patterns",
            "lesson": "Fixed capacity is inadequate; expansion is necessary for diverse task streams"
          },
          {
            "id": "N04",
            "type": "pivot",
            "from": "Fixed adapter pool",
            "to": "On-demand expansion: add adapters only when distribution shift is detected",
            "trigger": "Observation that tasks with similar distributions (e.g., cats→dogs) should reuse existing adapters, while tasks with novel patterns (cats→food) require new adapters",
            "children": [
              {
                "id": "N05",
                "type": "question",
                "title": "How to detect layer-wise distribution shift without class labels?",
                "description": "Need a per-layer novelty detector that works without knowing task identity or class labels",
                "children": [
                  {
                    "id": "N06",
                    "type": "dead_end",
                    "title": "Hard selection via RD reconstruction error for adapter routing",
                    "hypothesis": "Using the RD with lowest reconstruction error to select the single most appropriate adapter (hard routing) would be sufficient",
                    "failure_mode": "Hard selection is unreliable for individual samples; batch-level statistics needed (cf. [55]); limits applicability in CL inference. RD-based routing still works (Table 7, ~2% gap) but underperforms learned soft router",
                    "lesson": "Hard RD routing is a valid but suboptimal strategy; a learned soft router is superior"
                  },
                  {
                    "id": "N07",
                    "type": "decision",
                    "title": "Use AE-based RD with z-score expansion signal",
                    "choice": "Train an autoencoder as the representation descriptor; use z-score of reconstruction error as the expansion trigger; maintain 500-sample running stats buffer",
                    "alternatives": [
                      "VAE-based RD (mentioned as option; not used in default)",
                      "Prototype-distance based novelty detection",
                      "Direct reconstruction error thresholding (without z-score normalization)"
                    ],
                    "evidence": "Z-score normalization removes scale differences across tasks/adapters; Fig. 6 confirms insensitivity to threshold τ in range 1.0-2.0",
                    "children": [
                      {
                        "id": "N08",
                        "type": "experiment",
                        "title": "Expansion threshold sensitivity analysis on ImageNet-A and VTAB",
                        "result": "Accuracy remains stable across τ ∈ [1.0, 2.0] (ImageNet-A) confirming z-score robustness; VTAB shows expected accuracy-efficiency trade-off at very high τ",
                        "evidence": [
                          "C03",
                          "Fig. 6",
                          "§4.3"
                        ],
                        "children": [
                          {
                            "id": "N09",
                            "type": "decision",
                            "title": "Task-oriented expansion: at most one adapter per layer per task",
                            "choice": "Restrict expansion to CIL task boundaries; add at most one adapter per eligible layer per task; scan shallow-to-deep",
                            "alternatives": [
                              "Fully online expansion (per sample or per batch)",
                              "Expansion at every task regardless of z-score (Expansion by Task)"
                            ],
                            "evidence": "Task-oriented expansion improves parameter efficiency; expansion-by-task uses more params with lower accuracy (Table 5)",
                            "children": [
                              {
                                "id": "N10",
                                "type": "experiment",
                                "title": "Comparison with Expansion-by-Task variant",
                                "result": "SEMA (on-demand) uses fewer parameters while achieving higher accuracy on CIFAR-100, ImageNet-R, ImageNet-A, VTAB (Table 5)",
                                "evidence": [
                                  "C02",
                                  "C03",
                                  "Table 5",
                                  "Fig. 8"
                                ],
                                "also_depends_on": [
                                  "N07"
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "id": "N11",
        "type": "question",
        "title": "How to compose multiple adapters at inference without task ID?",
        "description": "When multiple adapters exist at a layer, how should they be combined for a given input without knowing which task it belongs to?",
        "children": [
          {
            "id": "N12",
            "type": "dead_end",
            "title": "Average weighting / Random weighting of adapters",
            "hypothesis": "Uniform or random mixing would be sufficient since all adapters contribute useful representations",
            "failure_mode": "Avg. W. degrades significantly (ImageNet-A: 56.88% vs SEMA 64.53%); Rand. W. intermediate but still worse; neither learns to direct samples to the most relevant adapter",
            "lesson": "Adapter composition requires a learned routing function, not just uniform or random mixing"
          },
          {
            "id": "N13",
            "type": "decision",
            "title": "Learn expandable soft weighting router jointly with adapters",
            "choice": "Linear(d → K) + Softmax router; only new column of W_mix is trainable when expanding; existing columns frozen",
            "alternatives": [
              "Average weighting (Avg. W.) — no learned routing",
              "Random weighting (Rand. W.) per sample",
              "Top-1 hard selection using router weights",
              "RD-based hard routing using reconstruction error"
            ],
            "evidence": "Table 2 shows learned router outperforms all alternatives on both ImageNet-A and VTAB; Table 7 confirms learned router > RD-based routing",
            "children": [
              {
                "id": "N14",
                "type": "experiment",
                "title": "Multi-layer expansion range ablation",
                "result": "Expanding layers 10-12 (last 3) provides best accuracy-efficiency tradeoff; layers 9-12 adds more adapters with diminishing returns (Fig. 7)",
                "evidence": [
                  "C02",
                  "C03",
                  "Fig. 7",
                  "§4.3"
                ],
                "also_depends_on": [
                  "N09"
                ]
              }
            ]
          }
        ]
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
