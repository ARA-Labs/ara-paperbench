<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — bridging-data-gaps</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — bridging-data-gaps</h1>
  <p>Research DAG &middot; Efficient Transfer Learning in Diffusion Models via Adversarial Noise</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "How can we perform efficient few-shot transfer learning for Diffusion Probabilistic Models?",
    "description": "DPMs require large data but transfer methods from GANs cannot be directly applied. Can we design a DPM-specific transfer learning method that works with only 10 target images?",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Can GAN-based transfer methods (CDC, DCL) be directly applied to DPMs?",
        "result": "No — GAN methods require comparing final clean generated images with target images; DPMs cannot produce clean images during training, only blurry intermediate predictions at timestep t",
        "evidence": [
          "§1",
          "§2.2",
          "Figure 3"
        ],
        "children": [
          {
            "id": "N03",
            "type": "dead_end",
            "title": "DDPM-PA approach: substitute blurry predicted image for clean target image",
            "hypothesis": "Using the blurry predicted final image at intermediate timestep as a proxy for the clean target image would enable domain comparison",
            "failure_mode": "The predicted blurry image does not accurately represent the target domain distribution; comparison with sharp target images produces inaccurate gradients leading to fuzzy/distorted generated images",
            "lesson": "Domain gap must be estimated without relying on comparing any form of generated image with the target; an indirect measure is needed"
          },
          {
            "id": "N04",
            "type": "decision",
            "title": "Use classifier gradients on noised images to estimate domain gap",
            "choice": "Use a binary classifier pϕ trained to distinguish source vs. target domain images at timestep t; use its gradient ∇xt log pϕ(y=T|xt) as an indirect similarity measure — no clean image comparison needed",
            "alternatives": [
              "Direct comparison of generated images with target images (rejected: impossible during DPM training)",
              "DDPM-PA blurry image substitution (rejected: inaccurate, produces distorted results)",
              "Perceptual loss on intermediate predictions (not explored)"
            ],
            "evidence": "Derived from Dhariwal & Nichol [5] classifier guidance formulation and KL divergence analysis (Eq. 5); similarity guidance circumvents need for clean image comparison",
            "children": [
              {
                "id": "N05",
                "type": "experiment",
                "title": "Verify that classifier gradient signal provides useful domain transfer direction on 2D toy data",
                "result": "Similarity-guided training (sienna line in Figure 2a) reduces angular deviation from reference gradient compared to vanilla DDPM (dark blue), confirming the classifier gradient provides a useful correction signal",
                "evidence": [
                  "C04",
                  "Figure 2a",
                  "§5.1"
                ],
                "children": [
                  {
                    "id": "N06",
                    "type": "question",
                    "title": "Is the transfer direction alone sufficient, or is the noise mechanism also a problem?",
                    "description": "Even with correct transfer direction from similarity guidance, does the standard random Gaussian noise mechanism in DPMs cause issues for few-shot transfer?",
                    "children": [
                      {
                        "id": "N07",
                        "type": "experiment",
                        "title": "Observe per-sample transfer divergence with standard Gaussian noise (Figure 1)",
                        "result": "When training DDPM from FFHQ → 10-shot Sunglasses, different images transfer at drastically different rates: one image successfully transfers while another severely overfits at the same training iteration. LPIPS values range from 0.394–0.589 across images.",
                        "evidence": [
                          "O3",
                          "Figure 1",
                          "§1"
                        ],
                        "children": [
                          {
                            "id": "N08",
                            "type": "dead_end",
                            "title": "Use more training iterations to ensure all images transfer",
                            "hypothesis": "Training for more iterations (e.g., 5000) will eventually transfer all images successfully",
                            "failure_mode": "With only 10 training images, more iterations cause overfitting on already-transferred images before the harder ones converge; diversity collapses",
                            "lesson": "The root cause is that standard Gaussian noise is non-targeted — some noise types are already easily denoised in the target domain while others are not; selectively targeting hard noise is needed"
                          },
                          {
                            "id": "N09",
                            "type": "decision",
                            "title": "Adopt adversarial noise selection: find worst-case noise via PGD",
                            "choice": "Use projected gradient descent (PGD) to find the worst-case Gaussian noise ε* that the current model fails most to denoise on target data; minimize loss under ε* (which subsumes all easier noise variants)",
                            "alternatives": [
                              "Standard random Gaussian noise (rejected: non-targeted, unbalanced per-sample transfer)",
                              "Fixed adversarial perturbations (not targeted to current model state)",
                              "Data augmentation (ADA-style, GAN-specific, not directly applicable)"
                            ],
                            "evidence": "PGD inner maximization (Eq. 7-8); worst-case noise in Figure 2a forms ellipse aligned with gradient principal axis rather than circle (standard Gaussian)",
                            "children": [
                              {
                                "id": "N10",
                                "type": "experiment",
                                "title": "Verify adversarial noise distribution shift and gradient correction on toy data",
                                "also_depends_on": [
                                  "N05"
                                ],
                                "result": "Adversarial noise distribution shifts from circle (standard Gaussian) to ellipse aligned with gradient principal axis (Figure 2a red points). DDPM-TAN gradient (orange) is closest to reference direction. DDPM-TAN heatmap (Figure 2c) shows brighter central highlight near target mode vs. baseline (Figure 2b).",
                                "evidence": [
                                  "C04",
                                  "Figure 2a",
                                  "Figure 2b",
                                  "Figure 2c",
                                  "§5.1"
                                ],
                                "children": [
                                  {
                                    "id": "N11",
                                    "type": "decision",
                                    "title": "Combine adversarial noise with adaptor module for parameter efficiency",
                                    "choice": "Add lightweight adaptor layers ψl (1.3%/1.6% of params, initialized to zero) parallel to frozen U-Net layers; train only adaptors with combined similarity-guided + adversarial noise objective (Eq. 9)",
                                    "alternatives": [
                                      "Full fine-tuning of all DPM parameters (100% params, 20 GB memory, 7.5 GPU hours — too expensive)",
                                      "LoRA-style low-rank updates (not explored in paper)",
                                      "Fine-tuning only top layers (not explored)"
                                    ],
                                    "evidence": "Houlsby et al. [10] NLP adaptor applied to U-Net; ablation (Figure 4) shows adaptor-only already competitive with full fine-tuning at 300 iterations",
                                    "children": [
                                      {
                                        "id": "N12",
                                        "type": "experiment",
                                        "title": "Full evaluation of DDPM-TAN and LDM-TAN on 7 target domains (Tables 1-3)",
                                        "result": "DDPM-TAN (1.3% params) surpasses all baselines on most Intra-LPIPS tasks; LDM-TAN (1.6% params) achieves best overall Intra-LPIPS. TAN achieves FID=20.06 on FFHQ→Sunglasses vs. 34.75 (DDPM-PA). Only 300 iterations, 3 GPU hours, 9 GB memory.",
                                        "evidence": [
                                          "C01",
                                          "C02",
                                          "C03",
                                          "Table 1",
                                          "Table 2",
                                          "Table 3",
                                          "§5.3"
                                        ]
                                      }
                                    ]
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
