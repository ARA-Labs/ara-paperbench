    comparator: lt
  - kind: comparative
    metric: fid
    over: task
    in_scope:
    - FFHQ→10-shot Sunglasses
    where:
      iterations: '300'
      section: Extracted Data Points
    subject:
      variant: DPMs-TAN (full method)
    reference:
      variant: DPMs-TAN w/o A (w/o adversarial noise)
    comparator: lt
