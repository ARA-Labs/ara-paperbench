    min_pass: 3
  - kind: best_baseline_consistency
    metric: table1_reported_value
    over: measure
    in_scope: *id001
    treatment:
      method: LDM-TAN
    baseline_axis: method
    exclude:
    - DDPM-TAN
    comparator: gt
    min_pass: 3
- claim_id: C05
  provenance: *id002
  properties:
  - kind: comparative
    metric: fid
    over: task
    in_scope:
    - FFHQ→10-shot Sunglasses
    where:
      iterations: '300'
