<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARA Trajectory</title>
<!--
  ARA Trajectory Viewer — canonical self-contained scaffold for the `research-visualizer` skill.

  HOW THE SKILL USES THIS FILE
  ----------------------------
  The rendering logic below is FIXED. The agent does NOT rewrite it. The agent only:
    1. Parses the ARA into one ARA_DATA object (schema in references/binding.md).
    2. base64-inlines every referenced figure .png into node.result.figures[].img.
    3. Replaces ONLY the JSON between the BEGIN/END markers in the <script id="ara-data"> block.
    4. Writes the result to <ara>/trajectory.html (or --output).
  Everything is inline (no CDN, no fetch, no server) so the output is one portable file.

  INJECTION CONTRACT
  ------------------
  - Replace exactly the lines between  __ARA_DATA_BEGIN__  and  __ARA_DATA_END__.
  - The payload MUST be valid JSON (it is read with JSON.parse).
  - JSON must not contain the literal substring "</script>"; escape any "<" in inlined
    markdown/text as "<" to be safe.
  - The demo payload shipped here renders a 3-node sample so the bare template opens and
    shows every node state (experiment, dead_end, isolated). The skill overwrites it.
-->
<style>
  /* Research Visualizer — "field notebook of a machine scientist".
     Cool archival vellum + ink; monospace is the machine-readout voice for
     structure / IDs / data, a humanist serif carries the reasoning prose. The
     signature is a traced trajectory spine that forks at branches and is struck
     through at dead ends. Type is read from glyph + label; colour is reserved
     for true epistemic status (teal = chrome, green = supported, amber =
     tentative, clay-red = dead end) — never decoration. */
  :root{
    /* paper & ink — deliberately cool vellum, NOT warm cream */
    --bg:#e9ece4; --panel:#f4f6f0; --panel2:#e3e7dd; --line:#ccd3c7; --ink:#1b2420;
    --muted:#67726a; --faint:#8a948b; --accent:#0e6b62; --accent-ink:#0a4f48; --chip:#e6eae0;
    --ok:#3a6a39; --warn:#a6402c; --tentative:#8a6310; --glyph-bg:#e0e5da; --glyph-ink:#4a544c;
    --sel-bg:#e3ede7; --code-bg:#eaeee6; --reason-bg:#f4f6f0;
    --iso-line:#b7c0ae; --iso-bg:#e5eadf; --iso-ink:#5f6b58;
    --scrim:rgba(20,28,24,.42); --shadow:rgba(20,28,24,.16);
    --add-bg:#e0ebdb; --add-ink:#2f5a2e; --del-bg:#f1e0da; --del-ink:#8c3623; --hunk:#67726a;
    --spine:#c3ccbd; --grid:rgba(27,36,32,.05);
    /* legacy type vars retained so any leftover hooks resolve */
    --q:var(--glyph-bg); --exp:var(--glyph-bg); --dec:var(--glyph-bg); --piv:var(--glyph-bg); --ins:var(--glyph-bg); --def:var(--glyph-bg); --dead:var(--warn);
    /* type roles: a serif reads the prose, monospace reads the machine */
    --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  code,pre,.mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* ---- masthead ---- */
  header{padding:20px 24px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .title{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.012em}
  header .sub{font-family:var(--mono);color:var(--muted);font-size:11.5px;margin-top:5px;letter-spacing:.01em}
  header details{margin-top:10px;color:var(--ink)}
  header summary{cursor:pointer;color:var(--accent-ink);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .toolbar input[type=search],.toolbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--sans)}
  .toolbar input[type=search]{min-width:230px}
  .toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--accent);outline:none}
  .toolbar label{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:var(--mono);cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .spacer{flex:1}
  .count{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-left:10px;border-left:1px solid var(--line)}

  main{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:calc(100% - 0px);min-height:0}
  #map{overflow:auto;border-right:1px solid var(--line);padding:18px 12px 56px;background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;background-position:-1px -1px}
  #detail{overflow:auto;padding:26px 32px 80px;background:var(--bg)}

  /* ---- process map: the trajectory spine is the signature ---- */
  .node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--sel-bg);border-color:var(--accent)}
  .node.deptarget{background:var(--sel-bg);outline:1px dashed var(--accent);outline-offset:-1px}
  .node.dim{opacity:.32}
  .node .glyph{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);margin-top:1px}
  .node.sel .glyph{border-color:var(--accent);color:var(--accent-ink)}
  .node .nid{color:var(--muted);font-size:10.5px;font-family:var(--mono);letter-spacing:.02em}
  .node .ntitle{font-size:13px;line-height:1.45}
  .node.dead .ntitle{color:var(--warn);text-decoration:line-through;text-decoration-color:rgba(166,64,44,.45)}
  .node .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  /* the spine + branch connectors: nested steps trace back to their parent */
  .kid{margin-left:19px;border-left:2px solid var(--spine);padding-left:14px}
  .kid>.node::before{content:"";position:absolute;left:-14px;top:14px;width:10px;height:2px;background:var(--spine)}
  .kid>.node.sel::before{background:var(--accent)}
  .isobox{border:1px dashed var(--iso-line);border-radius:8px;margin:12px 2px;padding:6px 4px;background:var(--iso-bg)}
  .isobox .isohdr{color:var(--iso-ink);font-family:var(--mono);font-size:10px;padding:3px 8px 7px;text-transform:uppercase;letter-spacing:.1em}
  .dep{color:var(--muted);font-size:10px;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .glyph.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}

  /* ---- detail pane ---- */
  .dhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;padding:3px 9px;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
  .badge.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}
  .pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pill.explicit{border-color:var(--ok);color:var(--ok)} .pill.inferred{border-color:var(--tentative);color:var(--tentative)}
  .pill.iso{border-color:var(--iso-line);color:var(--iso-ink)}
  .dtitle{font-family:var(--serif);font-size:25px;font-weight:600;margin:12px 0 6px;letter-spacing:-.012em;line-height:1.28}
  .did{color:var(--muted);font-family:var(--mono);font-size:11.5px}

  .block{border:1px solid var(--line);border-radius:7px;margin:15px 0;background:var(--panel)}
  .block>summary{cursor:pointer;padding:11px 15px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .block>summary::-webkit-details-marker{display:none}
  .block>summary:hover{color:var(--accent-ink)}
  .block>summary .tag{margin-left:auto;color:var(--faint);font-size:10.5px;font-weight:400;font-family:var(--mono);text-transform:none;letter-spacing:0}
  .block .body{padding:4px 16px 16px}
  /* the primary reasoning block: the agent's thinking, set as typeset prose */
  .block.reason{border-left:3px solid var(--accent);background:var(--reason-bg)}
  .block.reason>summary{color:var(--accent-ink)}
  .block.reason .lead{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink)}
  .didwhat{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;margin:16px 0 4px}
  .lead{font-family:var(--serif);color:#2a322c;font-size:16px;line-height:1.7}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;color:#46504a;font-family:var(--mono)}
  .chip.ext{color:var(--muted)}

  .claim{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .claim h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .claim .kv{font-size:13px;line-height:1.6;margin:4px 0;color:#3a423c}
  .claim .kv b{color:var(--muted);font-weight:600;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .status{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 7px;border:1px solid var(--line)}
  .status.supported{color:var(--ok);border-color:var(--ok)}
  .status.refuted{color:var(--warn);border-color:var(--warn)}
  .status.hypothesis{color:var(--tentative);border-color:var(--tentative)}
  .prov{font-size:11px;color:var(--iso-ink);font-family:var(--mono)}

  .quote{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13.5px;line-height:1.6;color:#2a322c}
  .quote .ref{color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:5px}
  figure{margin:14px 0}
  figure img{max-width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:6px}
  figcaption{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:7px}

  table.md{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;margin:10px 0}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  table.md th{background:var(--panel2);color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
  pre.snip{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;font-size:12px;color:var(--ink);white-space:pre-wrap}

  .ptr{font-size:13px;margin:7px 0}
  .ptr .path{font-family:var(--mono);color:#46504a}
  .truncated{color:var(--muted);font-size:11.5px;font-style:italic}
  .empty{color:var(--muted);font-size:13px}
  .none{color:var(--muted);padding:40px 24px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px}

  /* ---- enrichment layers (all inert unless the data is present) ---- */
  .layerbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lbtn .cnt{color:var(--muted);font-size:10.5px}
  .chiplabel{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 3px}
  .chip.jump{cursor:pointer}
  .chip.jump:hover{border-color:var(--accent);color:var(--accent-ink)}
  .chip.dangle{color:#9aa49b;text-decoration:line-through;cursor:not-allowed}
  .chip.infer{border-style:dashed}
  .chip-built{border-color:var(--ok);color:var(--ok)}
  .chip-rej{border-color:var(--warn);color:var(--warn)}
  .chip-recipe{border-color:var(--accent);color:var(--accent-ink)}
  .nmark{color:var(--muted);font-size:10px;margin-left:5px;font-family:var(--mono)}
  .rel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 8px;color:var(--glyph-ink);background:var(--glyph-bg);font-weight:700}
  .rel.bounds,.rel.refutes{background:var(--warn);color:#fff}
  .rel.neutral{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .ribbon{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;color:#3a423c;font-size:13px;line-height:1.6}
  .warn{border-left:3px solid var(--warn);background:var(--del-bg);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13px;line-height:1.6}
  .muted{color:var(--muted);font-size:11.5px}
  .math{font-family:var(--serif);font-style:italic}
  .gterm{border-bottom:1px dashed var(--accent);cursor:help}
  #gpop{position:fixed;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;z-index:60;box-shadow:0 8px 28px var(--shadow);font-size:13px;line-height:1.55;display:none}
  #gpop h5{margin:0 0 5px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  #gpop .gp-open{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:11px;margin-top:7px;display:inline-block}
  .ov{position:fixed;inset:0;z-index:50}
  .ov[hidden]{display:none}
  .ov-scrim{position:absolute;inset:0;background:var(--scrim)}
  .ov-sheet{position:relative;margin:5vh auto;max-width:920px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 48px var(--shadow)}
  .ov-head{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1}
  .ov-head #ov-title{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
  .ov-head input[type=search]{flex:1;max-width:260px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:13px}
  .ov-body{padding:10px 17px 26px}
  .ov-body .spacer{flex:1}
  .card{border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .card .sub{color:var(--muted);font-family:var(--mono);font-size:10.5px}
  .grey{opacity:.5}

  /* responsive: stack the two panes on a narrow screen */
  @media (max-width:720px){
    main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
    #map{border-right:none;border-bottom:1px solid var(--line)}
    #detail{padding:20px 18px 64px}
    .dtitle{font-size:21px}
  }
  /* honour reduced-motion */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="title" id="h-title">ARA Trajectory</h1>
  <div class="sub" id="h-sub"></div>
  <details id="h-abstract-wrap"><summary>Abstract</summary><div class="lead" id="h-abstract"></div></details>
  <div class="toolbar">
    <input type="search" id="q" placeholder="search steps…" autocomplete="off" />
    <label>type
      <select id="ftype"><option value="">all</option></select>
    </label>
    <label><input type="checkbox" id="fdead" /> dead ends only</label>
    <span class="spacer"></span>
    <button class="btn" id="rprev" title="previous (←)">‹</button>
    <button class="btn primary" id="rplay">▶ Replay</button>
    <button class="btn" id="rnext" title="next (→)">›</button>
    <span class="count" id="rstat"></span>
  </div>
  <div class="layerbar" id="layerbar">
    <button class="btn lbtn" data-panel="context" hidden>◧ Context</button>
    <button class="btn lbtn" data-panel="glossary" hidden>▤ Glossary <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="dependencies" hidden>⇄ Dependencies <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="recipes" hidden>▦ Recipes <span class="cnt"></span></button>
  </div>
</header>

<main>
  <aside id="map"></aside>
  <section id="detail"><div class="none">Select a step on the left, or press <kbd>▶ Replay</kbd>.</div></section>
</main>

<!-- v1.1: one shared modal overlay for the Context/Glossary/Dependencies/Recipes panels, + a glossary popover. Both inert unless their data is present. -->
<div id="overlay" class="ov" hidden role="dialog" aria-modal="true">
  <div class="ov-scrim" data-close></div>
  <div class="ov-sheet">
    <div class="ov-head"><span id="ov-title"></span>
      <input type="search" id="ov-q" placeholder="filter…" hidden autocomplete="off" />
      <span class="spacer"></span>
      <button class="btn" id="ov-close" data-close>✕ <kbd>Esc</kbd></button>
    </div>
    <div class="ov-body" id="ov-body"></div>
  </div>
</div>
<div id="gpop"></div>

<script id="ara-data" type="application/json">

{"meta": {"title": "Challenges in Training PINNs: A Loss Landscape Perspective", "authors": ["Pratik Rathore", "Weimu Lei", "Zachary Frangella", "Lu Lu", "Madeleine Udell"], "year": "2024", "venue": "Proceedings of the 41st International Conference on Machine Learning (ICML)", "ara_dir": "pinn", "abstract": "This paper explores challenges in training Physics-Informed Neural Networks (PINNs), emphasizing the role of the loss landscape in the training process. We examine difficulties in minimizing the PINN loss function, particularly due to ill-conditioning caused by differential operators in the residual term. We compare gradient-based optimizers Adam, L-BFGS, and their combination Adam+L-BFGS, showing the superiority of Adam+L-BFGS, and introduce a novel second-order optimizer, NysNewton-CG (NNCG), which significantly improves PINN performance. Theoretically, our work elucidates the connection between ill-conditioned differential operators and ill-conditioning in the PINN loss and shows the benefits of combining first- and second-order optimization methods. Our work presents valuable insights and more powerful optimization strategies for training PINNs, which could improve the utility of PINNs for solving difficult partial differential equations."}, "order": ["N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10", "N11", "N12"], "nodes": [{"id": "N01", "type": "question", "parent": null, "title": "Why is PINN training so difficult, especially for challenging PDEs?", "body": "PINNs often fail to learn PDE solutions even in simple settings. What optimization properties of the PINN loss cause this, and how can they be addressed?", "thinking": "This is the motivating question behind the whole investigation: physics-informed neural networks are supposed to solve PDEs by folding the governing equations into the loss function, yet in practice they often fail to converge to an accurate solution, even for simple PDEs. The question that opens the investigation is what specifically about the PINN loss's optimization landscape makes it hard to train, and whether that structure can be diagnosed and fixed rather than just worked around.", "depends_on": [], "isolated": false, "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": []}, {"id": "N02", "type": "experiment", "parent": "N01", "title": "Is near-zero loss actually needed for accurate PINN solutions?", "body": "Yes — confirmed strong correlation between loss and L2RE; loss must reach ~1e-5 for L2RE ~1e-2. But trivial solutions (constant u satisfying residual) can give loss ~0 with L2RE ~1.", "thinking": "Before trying to fix PINN training, it's worth checking a basic assumption: does getting the training loss very close to zero actually matter for solution accuracy, or would a merely small loss already be good enough? Plotting final loss against final L2 relative error across many training runs and PDEs answers this directly: the two track each other closely, but only once loss gets extremely small, around 1e-5, does the relative error become acceptably low. There is also a cautionary wrinkle: a few runs reach loss near zero without actually solving the PDE at all, because a trivial constant function can satisfy the residual term while completely missing the boundary conditions. A low loss number alone isn't a reliable stopping signal.", "depends_on": [], "isolated": false, "source_refs": ["§4"], "why": [{"id": "C01", "title": "Near-zero training loss is necessary for accurate PINN solutions", "statement": "For PINNs, there is a monotone but nonlinear relationship between training loss and L2 relative error (L2RE): achieving acceptably low L2RE (e.g., &lt;0.1) requires training loss to be in the range 10^-5 or smaller, depending on the PDE. Instances exist where loss ≈ 0 but L2RE ≈ 1 (trivial solutions).", "status": "supported", "falsification": "A PINN achieving L2RE &lt; 0.05 with training loss > 10^-3 would refute this claim.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [{"id": "fig2_loss_vs_l2re", "caption": "---", "markdown": "# Figure 2: Final Loss vs. Final L2RE Across All Runs\n\n- **Source**: Figure 2, Section 4\n- **Caption**: \"We plot the final L2RE against the final loss for each combination of network width, optimization strategy, and random seed. Across all three PDEs, a lower loss generally corresponds to a lower L2RE.\"\n- **Axis labels**: X-axis: Loss (log scale); Y-axis: L2RE (log scale)\n- **Conditions**: All (width, optimizer, lr, seed) combinations; 41000 iterations; Convection β=40, Reaction ρ=5, Wave β=5\n\n## Extracted Data Points (approximate readings from log-scale axes)\n\n### Convection (β=40)\n| Loss Range | L2RE Range | Notes |\n|-----------|-----------|-------|\n| ~1e-1 | ~3e-1 to 1 | High loss, high error (mostly Adam runs) |\n| ~1e-3 | ~1e-1 | Moderate loss |\n| ~1e-4 | ~5e-2 to 1e-1 | — |\n| ~1e-5 | ~1e-2 to 5e-2 | Best Adam+L-BFGS runs |\n| ~5e-6 | ~4e-3 | Best run (Adam+L-BFGS, lowest) |\n| near 0 | ≈1 | Trivial solutions (constant u) |\n\n### Reaction (ρ=5)\n| Loss Range | L2RE Range | Notes |\n|-----------|-----------|-------|\n| ~1e-4 to 1e-2 | ~1e-1 | Moderate runs |\n| ~1e-6 | ~1e-2 | Best runs |\n| ~5e-9 to 1e-7 | ≈1 | Trivial solutions (u=0 or u=1) |\n\n### Wave (β=5)\n| Loss Range | L2RE Range | Notes |\n|-----------|-----------|-------|\n| ~1e-1 | ~3e-1 | Worst Adam runs |\n| ~1e-2 | ~3e-1 | Most L-BFGS/Adam runs |\n| ~1e-3 | ~5e-2 | Best Adam+L-BFGS runs |\n| ~1.1e-3 | ~5.5e-2 | Best overall (Adam+L-BFGS) |\n\n## Key Observations\n1. Monotone trend: lower loss → lower L2RE across all PDEs\n2. On convection: loss ~1e-3 → L2RE ~1e-1; loss ~1e-5 → L2RE ~1e-2 (100× loss reduction → 10× L2RE improvement)\n3. On reaction and convection: instances where loss ≈ 0 but L2RE ≈ 1 exist (trivial constant solutions)\n4. Data points colored by optimizer type (see Figure 2 legend: Adam, L-BFGS, Adam+L-BFGS(1k), Adam+L-BFGS(11k), Adam+L-BFGS(31k))"}, {"id": "figure2_loss_vs_l2re", "caption": "Figure 2: Final Loss vs. L2RE Across All Optimizer/Width/Seed Combinations", "markdown": "- **Source**: Figure 2, Section 4\n- **Caption**: \"We plot the final L2RE against the final loss for each combination of network width, optimization strategy, and random seed. Across all three PDEs, a lower loss generally corresponds to a lower L2RE.\"\n- **Axis labels**: x-axis = Final Loss (log scale); y-axis = Final L2RE (log scale)\n- **Series**: Adam, L-BFGS, Adam+L-BFGS(1k), Adam+L-BFGS(11k), Adam+L-BFGS(31k)\n- **Experimental conditions**: All combinations of 4 widths × 5 learning rates (for Adam/Adam+L-BFGS) or 1 setting (L-BFGS) × 5 seeds × 3 switch points; all 3 PDEs shown\n\n## Key Data Points (Approximate from Figure)\n\n### Convection (β=40)\n| Loss Range | L2RE Range | Notes |\n|-----------|-----------|-------|\n| ≈1e-4 to 1e-5 | ≈1e-1 to 5e-2 | Adam cluster |\n| ≈1e-5 to 5e-6 | ≈1e-2 to 5e-3 | L-BFGS + Adam+L-BFGS cluster |\n| ≈1e-3 to 1e-2 | ≈1e-1 | Some L-BFGS runs (worse) |\n| ≈1e-7 to 1e-6 | ≈1e-3 | Best Adam+L-BFGS runs |\n\n### Reaction (ρ=5)\n| Loss Range | L2RE Range | Notes |\n|-----------|-----------|-------|\n| ≈1e-6 to 1e-4 | ≈1e-1 to 1e-2 | Scattered; some points with loss≈0, L2RE≈1 (trivial solutions) |\n| ≈1e-6 | ≈2e-2 | Best Adam and Adam+L-BFGS |\n\n### Wave (β=5)\n| Loss Range | L2RE Range | Notes |\n|-----------|-----------|-------|\n| ≈1e-2 to 1e-3 | ≈3e-1 | Adam and L-BFGS cluster |\n| ≈1e-3 | ≈5e-2 | Best Adam+L-BFGS |\n| ≈1e-1 | ≈1e-1 | Worst runs |\n\n**Key observations**:\n- Strong positive correlation (lower loss → lower L2RE) in log-log space across all PDEs\n- Some reaction runs at loss≈0 have L2RE≈1 (trivial constant solutions satisfying residual but not BC)\n- Adam+L-BFGS variants systematically in the lower-left (better) region"}], "data": []}, "verified_by": [{"id": "E01", "title": "Loss vs. L2RE correlation across PDEs", "setup": "Model: MLP with 3 hidden layers, widths {50, 100, 200, 400}, tanh activations, Xavier normal init. Hardware: Single NVIDIA Titan V GPU. Dataset: Convection (β=40), Reaction (ρ=5), Wave (β=5) from Appendix A.1-A.3. System: All optimizer combinations (Adam, L-BFGS, Adam+L-BFGS with 1k/11k/31k switch points).", "metrics": "Final training loss, final L2RE, presence of trivial solution cases"}], "artifact": [{"name": "pinn_model.py", "pointer": "src/execution/pinn_model.py", "what": "MLP model, PINN loss, L2RE metric (C01, C02) — pointer index entry (not resolved in v1)"}], "built_on": [{"rw_id": "RW01", "name": "Raissi et al., 2019", "relation_raw": "imports"}], "concepts": ["L2 Relative Error"]}, {"id": "N03", "type": "decision", "parent": "N02", "title": "Focus on achieving interpolation (L=0) as the training objective", "body": "Design optimizers and training pipelines that drive loss to near-zero rather than acceptable convergence. alternatives: Relax accuracy requirement and accept L2RE ~0.1; Use regularization to avoid trivial solutions", "thinking": "Given that only near-zero loss reliably produces an accurate solution, the investigation has to pick a target to optimize toward. One option would be to simply accept a looser accuracy bar and stop worrying about extreme convergence; another would be to add regularization that steers the optimizer away from the trivial, loss-satisfying-but-wrong solutions. Both are sidesteps rather than fixes. The decision here is to commit to the harder goal directly: build optimizers and training pipelines whose job is to drive the loss all the way to near-zero (interpolation), since that is what the loss-versus-accuracy relationship measured in the previous step actually demands.", "depends_on": [], "isolated": false, "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["L2 Relative Error"]}, {"id": "N04", "type": "experiment", "parent": "N03", "title": "Characterize Hessian spectral structure of PINN loss", "body": "PINN Hessian is severely ill-conditioned: condition numbers >10^4 (convection >10^4, reaction >10^3, wave >10^5). Large outlier eigenvalues + spectral density near 0.", "thinking": "With the target set (drive loss to zero), the next step is to understand why first-order optimizers struggle to get there. The natural diagnostic is the loss's Hessian: if its eigenvalues are wildly spread out, gradient-descent-style methods will need many iterations to make progress in the worst-conditioned directions. Computing the Hessian spectral density for a well-trained model on each of the three benchmark PDEs confirms this directly: the condition number exceeds 10^4 on convection, 10^3 on reaction, and 10^5 on wave, with large outlier eigenvalues and a dense cluster of near-zero eigenvalues. The PINN loss landscape is severely ill-conditioned, a structural obstacle to first-order training rather than an incidental one.", "depends_on": [], "isolated": false, "source_refs": ["§5.1"], "why": [{"id": "C02", "title": "PINN loss is ill-conditioned with condition number >10^4", "statement": "After training with Adam+L-BFGS for 41000 iterations, the Hessian of the PINN loss shows large outlier eigenvalues (>10^4 for convection, >10^3 for reaction, >10^5 for wave) and significant spectral density near 0, indicating ill-conditioning that impedes first-order optimizer convergence.", "status": "supported", "falsification": "A PINN Hessian with condition number &lt; 100 on these benchmark problems would refute this.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [{"id": "fig3_hessian_spectral", "caption": "---", "markdown": "# Figure 3 & Figure 7: Hessian Spectral Density Before and After L-BFGS Preconditioning\n\n- **Source**: Figure 3 (§5.1, §5.2, §5.3) + Figure 7 (Appendix C)\n- **Caption**: Figure 3: \"(Top) Spectral density of the Hessian and the preconditioned Hessian after 41000 iterations of Adam+L-BFGS. The plots show that the PINN loss is ill-conditioned and that L-BFGS improves the conditioning, reducing the top eigenvalue by 10^3 or more. (Bottom) Spectral density of the Hessian and the preconditioned Hessian of each loss component after 41000 iterations of Adam+L-BFGS for convection.\"\n- **Axis labels**: X-axis: Eigenvalue; Y-axis: Density (log scale ~1e-10 to 1e-1)\n- **Conditions**: Best Adam+L-BFGS run per PDE (width and lr with lowest L2RE at 41000 iterations)\n\n## Top Row: Total Loss Hessian Spectral Density\n\n### Convection (β=40)\n| | Unpreconditioned | Preconditioned |\n|--|--|--|\n| Max eigenvalue (approximate) | >10^4 | ~10 |\n| Spectral range | ~[-10^1, 10^4] | ~[-1, 10^1] |\n| Density near 0 | High (significant) | Lower |\n| Condition number | >10^4 | Much reduced |\n\n### Reaction (ρ=5)\n| | Unpreconditioned | Preconditioned |\n|--|--|--|\n| Max eigenvalue | >10^3 | ~1 |\n| Spectral range | ~[0, 10^3] | ~[0, 1] |\n| Density near 0 | High | Lower |\n| Condition number | >10^3 | Much reduced |\n\n### Wave (β=5)\n| | Unpreconditioned | Preconditioned |\n|--|--|--|\n| Max eigenvalue | >10^5 | ~10^2 |\n| Spectral range | ~[-10^2, 10^5] | ~[-10^1, 10^2] |\n| Density near 0 | High (significant) | Lower |\n| Condition number | >10^5 | Much reduced |\n\n## Bottom Row: Loss Component Spectral Density (Convection β=40)\n\n| Component | Unpreconditioned Max | Preconditioned Max | Most ill-conditioned? |\n|-----------|---------------------|-------------------|----------------------|\n| Residual | ~10^4 (largest) | ~10 | YES |\n| Initial Condition | ~10^2 | ~1 | No |\n| Boundary Condition | ~10^1 | ~0.1 | No (least) |\n\n## Figure 7: Loss Component Spectral Density (Reaction, Wave)\n\n### Reaction (ρ=5) — Component Spectral Density\n| Component | Unpreconditioned Max | Preconditioned Max |\n|-----------|---------------------|-------------------|\n| Residual | ~10^3 (largest) | ~1 |\n| Initial Condition | ~10^2 | ~0.1 |\n| Boundary Condition | ~10^1 | ~0.1 |\n\n### Wave (β=5) — Component Spectral Density\n| Component | Unpreconditioned Max | Preconditioned Max |\n|-----------|---------------------|-------------------|\n| Residual | ~10^5 (largest, note: includes negative eigenvalues) | ~10^2 |\n| Initial Condition | ~10^3 | ~10^1 |\n| Boundary Condition | ~10^2 | ~1 |\n\n## Key Observations\n1. All total losses show significant spectral density near eigenvalue 0 (many near-zero eigenvalues) — indicates flat directions\n2. Preconditioned Hessian reduces top eigenvalue by ≥1000× for all three PDEs\n3. Residual component is consistently the most ill-conditioned across all PDEs\n4. Preconditioning also reduces condition number of each individual component\n5. Wave residual shows negative eigenvalues in the spectrum (indefinite Hessian near solution)"}, {"id": "figure3_hessian_spectral", "caption": "Figure 3: Hessian and Preconditioned Hessian Spectral Densities", "markdown": "- **Source**: Figure 3, Sections 5.1–5.3\n- **Caption**: \"(Top) Spectral density of the Hessian and the preconditioned Hessian after 41000 iterations of Adam+L-BFGS. The plots show that the PINN loss is ill-conditioned and that L-BFGS improves the conditioning, reducing the top eigenvalue by 10^3 or more. (Bottom) Spectral density of the Hessian and the preconditioned Hessian of each loss component after 41000 iterations of Adam+L-BFGS for convection. The plots show that each component loss is ill-conditioned and that the conditioning is improved by L-BFGS.\"\n- **Experimental conditions**: Best Adam+L-BFGS (11k) model for each PDE; spectral density estimated via stochastic Lanczos quadrature; preconditioned Hessian computed via Algorithm 2+3 (Appendix C.2); memory m=100\n\n## Top Row: Total Loss Spectral Density\n\n### Convection (β=40)\n| Hessian | Max Eigenvalue (≈) | Bulk location | Condition number estimate |\n|---------|-------------------|---------------|--------------------------|\n| Raw H_L | >10^4 (outliers at 10^4–10^5) | Near 0 (dense) | >10^4 |\n| Preconditioned | ~10^1 (much smaller outliers) | Near 0 (still present but compressed) | ≈10–100× improvement |\n\n### Reaction (ρ=5)\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L | >10^3 | Smaller outliers than convection/wave |\n| Preconditioned | ~10^0 | Significant improvement |\n\n### Wave (β=5)\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L | >10^5 | Largest outliers of all three PDEs |\n| Preconditioned | ~10^2 | Still larger than convection after preconditioning; 10^3× reduction |\n\n## Bottom Row: Loss Component Spectral Density (Convection β=40)\n\n### Residual Loss Component\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L (residual) | >10^4 | Most ill-conditioned component |\n| Preconditioned | Reduced by ≥10^3 | Largest improvement |\n\n### Initial Condition Component\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L (IC) | ~10^1–10^2 | Much less ill-conditioned than residual |\n| Preconditioned | ~1 | Good improvement |\n\n### Boundary Condition Component\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L (BC) | ~10^1 | Least ill-conditioned component |\n| Preconditioned | ~1 | Good improvement |\n\n**Key observation**: Residual component has largest outlier eigenvalues, confirming D is the source of ill-conditioning. L-BFGS reduces max eigenvalue by ≥10^3 across all PDEs and all components.\n\n**Note**: Figure 7 (Appendix) shows the same analysis for Reaction and Wave component losses; qualitatively similar results with residual component most ill-conditioned."}, {"id": "figure3_hessian_spectral_density", "caption": "Figure 3: Hessian Spectral Density and Preconditioning Effect", "markdown": "**Source**: Figure 3, Section 5\n**Caption**: (Top) Spectral density of the Hessian and preconditioned Hessian after 41000 iterations of Adam+L-BFGS. The plots show that the PINN loss is ill-conditioned and that L-BFGS improves the conditioning, reducing the top eigenvalue by 10^3 or more. (Bottom) Spectral density of Hessian and preconditioned Hessian of each loss component after 41000 iterations for convection.\n\n## Key Quantitative Data (from paper text)\n\n### Top Eigenvalue Magnitudes (Hessian, unpreconditioned)\n| PDE | Top Eigenvalue Magnitude |\n|-----|--------------------------|\n| Convection (β=40) | > 10^4 |\n| Reaction (ρ=5) | > 10^3 |\n| Wave (β=5) | > 10^5 |\n\n### Preconditioning Effect\n- For ALL three PDEs: L-BFGS preconditioning reduces magnitude of top eigenvalue by at least **10^3×**\n- Spectral density near 0: significant for all PDEs (indicating ill-conditioning)\n\n### Loss Component Analysis (Convection, Figure 3 bottom)\n- Residual component: most ill-conditioned (largest eigenvalue outliers)\n- Initial condition component: comparatively less ill-conditioned\n- Boundary condition component: comparatively less ill-conditioned\n\n### Observation from §6.2\n- Convection: largest eigenvalue ~10^4\n- Reaction: largest eigenvalue ~10^3 (least ill-conditioned — explains why Adam ≈ Adam+L-BFGS on reaction)\n- Wave: largest eigenvalue ~10^5 (most ill-conditioned)\n\n## Method\n- Stochastic Lanczos Quadrature (SLQ) via PyHessian (Yao et al., 2020)\n- Preconditioned Hessian: H̃ᵀ H_L H̃ computed via Algorithm 2+3 (L-BFGS unrolling)\n- Memory size m=100 used for L-BFGS"}], "data": []}, "verified_by": [{"id": "E02", "title": "Hessian spectral analysis before and after L-BFGS preconditioning", "setup": "Model: Best model from Adam+L-BFGS training sweep (width with best final L2RE, best learning rate). Hardware: Single NVIDIA Titan V GPU. Dataset: Convection, Reaction, Wave. System: 41000 iterations Adam+L-BFGS; Stochastic Lanczos Quadrature (SLQ) for spectral density estimation.", "metrics": "Maximum eigenvalue, spectral density near zero, visual comparison of component spectra"}], "artifact": [{"name": "pinn_model.py", "pointer": "src/execution/pinn_model.py", "what": "MLP model, PINN loss, L2RE metric (C01, C02) — pointer index entry (not resolved in v1)"}], "built_on": [{"rw_id": "RW01", "name": "Raissi et al., 2019", "relation_raw": "imports"}, {"rw_id": "RW02", "name": "Krishnapriyan et al., 2021 (NeurIPS)", "relation_raw": "baseline"}, {"rw_id": "RW04", "name": "Wang et al., 2022b (When and why PINNs fail to train)", "relation_raw": "baseline"}, {"rw_id": "RW07", "name": "Wang et al., 2021a (Understanding gradient pathologies)", "relation_raw": "baseline"}, {"rw_id": "RW09", "name": "Yao et al., 2020 (PyHessian)", "relation_raw": "imports"}], "concepts": ["Condition Number"]}, {"id": "N05", "type": "experiment", "parent": "N04", "title": "Which loss component drives ill-conditioning?", "body": "Residual loss (containing differential operator D) is most ill-conditioned. IC and BC components are comparatively well-conditioned.", "thinking": "The PINN loss isn't one homogeneous term: it sums a PDE residual term, an initial-condition term, and a boundary-condition term. If the ill-conditioning found upstream is concentrated in just one of these, that narrows down what needs fixing. Breaking the Hessian spectral density out by component shows the residual term, the one containing the differential operator, is consistently the worst offender across all three PDEs, while the initial- and boundary-condition terms are comparatively well-behaved. That points squarely at the differential operator itself as the source of the ill-conditioning, not at the boundary terms or the network architecture.", "depends_on": [], "isolated": false, "source_refs": ["§5.2"], "why": [{"id": "C03", "title": "Residual loss (differential operator term) is the dominant source of ill-conditioning", "statement": "Among the three components of PINN loss (residual, initial condition, boundary condition), the residual component containing the differential operator D is the most ill-conditioned. This is both empirically observed and theoretically predicted.", "status": "supported", "falsification": "Another component (IC or BC) having larger or equal maximum Hessian eigenvalue would refute this claim.", "dependencies": ["C02"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "fig3_hessian_spectral", "caption": "---", "markdown": "# Figure 3 & Figure 7: Hessian Spectral Density Before and After L-BFGS Preconditioning\n\n- **Source**: Figure 3 (§5.1, §5.2, §5.3) + Figure 7 (Appendix C)\n- **Caption**: Figure 3: \"(Top) Spectral density of the Hessian and the preconditioned Hessian after 41000 iterations of Adam+L-BFGS. The plots show that the PINN loss is ill-conditioned and that L-BFGS improves the conditioning, reducing the top eigenvalue by 10^3 or more. (Bottom) Spectral density of the Hessian and the preconditioned Hessian of each loss component after 41000 iterations of Adam+L-BFGS for convection.\"\n- **Axis labels**: X-axis: Eigenvalue; Y-axis: Density (log scale ~1e-10 to 1e-1)\n- **Conditions**: Best Adam+L-BFGS run per PDE (width and lr with lowest L2RE at 41000 iterations)\n\n## Top Row: Total Loss Hessian Spectral Density\n\n### Convection (β=40)\n| | Unpreconditioned | Preconditioned |\n|--|--|--|\n| Max eigenvalue (approximate) | >10^4 | ~10 |\n| Spectral range | ~[-10^1, 10^4] | ~[-1, 10^1] |\n| Density near 0 | High (significant) | Lower |\n| Condition number | >10^4 | Much reduced |\n\n### Reaction (ρ=5)\n| | Unpreconditioned | Preconditioned |\n|--|--|--|\n| Max eigenvalue | >10^3 | ~1 |\n| Spectral range | ~[0, 10^3] | ~[0, 1] |\n| Density near 0 | High | Lower |\n| Condition number | >10^3 | Much reduced |\n\n### Wave (β=5)\n| | Unpreconditioned | Preconditioned |\n|--|--|--|\n| Max eigenvalue | >10^5 | ~10^2 |\n| Spectral range | ~[-10^2, 10^5] | ~[-10^1, 10^2] |\n| Density near 0 | High (significant) | Lower |\n| Condition number | >10^5 | Much reduced |\n\n## Bottom Row: Loss Component Spectral Density (Convection β=40)\n\n| Component | Unpreconditioned Max | Preconditioned Max | Most ill-conditioned? |\n|-----------|---------------------|-------------------|----------------------|\n| Residual | ~10^4 (largest) | ~10 | YES |\n| Initial Condition | ~10^2 | ~1 | No |\n| Boundary Condition | ~10^1 | ~0.1 | No (least) |\n\n## Figure 7: Loss Component Spectral Density (Reaction, Wave)\n\n### Reaction (ρ=5) — Component Spectral Density\n| Component | Unpreconditioned Max | Preconditioned Max |\n|-----------|---------------------|-------------------|\n| Residual | ~10^3 (largest) | ~1 |\n| Initial Condition | ~10^2 | ~0.1 |\n| Boundary Condition | ~10^1 | ~0.1 |\n\n### Wave (β=5) — Component Spectral Density\n| Component | Unpreconditioned Max | Preconditioned Max |\n|-----------|---------------------|-------------------|\n| Residual | ~10^5 (largest, note: includes negative eigenvalues) | ~10^2 |\n| Initial Condition | ~10^3 | ~10^1 |\n| Boundary Condition | ~10^2 | ~1 |\n\n## Key Observations\n1. All total losses show significant spectral density near eigenvalue 0 (many near-zero eigenvalues) — indicates flat directions\n2. Preconditioned Hessian reduces top eigenvalue by ≥1000× for all three PDEs\n3. Residual component is consistently the most ill-conditioned across all PDEs\n4. Preconditioning also reduces condition number of each individual component\n5. Wave residual shows negative eigenvalues in the spectrum (indefinite Hessian near solution)"}, {"id": "figure3_hessian_spectral", "caption": "Figure 3: Hessian and Preconditioned Hessian Spectral Densities", "markdown": "- **Source**: Figure 3, Sections 5.1–5.3\n- **Caption**: \"(Top) Spectral density of the Hessian and the preconditioned Hessian after 41000 iterations of Adam+L-BFGS. The plots show that the PINN loss is ill-conditioned and that L-BFGS improves the conditioning, reducing the top eigenvalue by 10^3 or more. (Bottom) Spectral density of the Hessian and the preconditioned Hessian of each loss component after 41000 iterations of Adam+L-BFGS for convection. The plots show that each component loss is ill-conditioned and that the conditioning is improved by L-BFGS.\"\n- **Experimental conditions**: Best Adam+L-BFGS (11k) model for each PDE; spectral density estimated via stochastic Lanczos quadrature; preconditioned Hessian computed via Algorithm 2+3 (Appendix C.2); memory m=100\n\n## Top Row: Total Loss Spectral Density\n\n### Convection (β=40)\n| Hessian | Max Eigenvalue (≈) | Bulk location | Condition number estimate |\n|---------|-------------------|---------------|--------------------------|\n| Raw H_L | >10^4 (outliers at 10^4–10^5) | Near 0 (dense) | >10^4 |\n| Preconditioned | ~10^1 (much smaller outliers) | Near 0 (still present but compressed) | ≈10–100× improvement |\n\n### Reaction (ρ=5)\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L | >10^3 | Smaller outliers than convection/wave |\n| Preconditioned | ~10^0 | Significant improvement |\n\n### Wave (β=5)\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L | >10^5 | Largest outliers of all three PDEs |\n| Preconditioned | ~10^2 | Still larger than convection after preconditioning; 10^3× reduction |\n\n## Bottom Row: Loss Component Spectral Density (Convection β=40)\n\n### Residual Loss Component\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L (residual) | >10^4 | Most ill-conditioned component |\n| Preconditioned | Reduced by ≥10^3 | Largest improvement |\n\n### Initial Condition Component\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L (IC) | ~10^1–10^2 | Much less ill-conditioned than residual |\n| Preconditioned | ~1 | Good improvement |\n\n### Boundary Condition Component\n| Hessian | Max Eigenvalue (≈) | Notes |\n|---------|-------------------|-------|\n| Raw H_L (BC) | ~10^1 | Least ill-conditioned component |\n| Preconditioned | ~1 | Good improvement |\n\n**Key observation**: Residual component has largest outlier eigenvalues, confirming D is the source of ill-conditioning. L-BFGS reduces max eigenvalue by ≥10^3 across all PDEs and all components.\n\n**Note**: Figure 7 (Appendix) shows the same analysis for Reaction and Wave component losses; qualitatively similar results with residual component most ill-conditioned."}, {"id": "figure3_hessian_spectral_density", "caption": "Figure 3: Hessian Spectral Density and Preconditioning Effect", "markdown": "**Source**: Figure 3, Section 5\n**Caption**: (Top) Spectral density of the Hessian and preconditioned Hessian after 41000 iterations of Adam+L-BFGS. The plots show that the PINN loss is ill-conditioned and that L-BFGS improves the conditioning, reducing the top eigenvalue by 10^3 or more. (Bottom) Spectral density of Hessian and preconditioned Hessian of each loss component after 41000 iterations for convection.\n\n## Key Quantitative Data (from paper text)\n\n### Top Eigenvalue Magnitudes (Hessian, unpreconditioned)\n| PDE | Top Eigenvalue Magnitude |\n|-----|--------------------------|\n| Convection (β=40) | > 10^4 |\n| Reaction (ρ=5) | > 10^3 |\n| Wave (β=5) | > 10^5 |\n\n### Preconditioning Effect\n- For ALL three PDEs: L-BFGS preconditioning reduces magnitude of top eigenvalue by at least **10^3×**\n- Spectral density near 0: significant for all PDEs (indicating ill-conditioning)\n\n### Loss Component Analysis (Convection, Figure 3 bottom)\n- Residual component: most ill-conditioned (largest eigenvalue outliers)\n- Initial condition component: comparatively less ill-conditioned\n- Boundary condition component: comparatively less ill-conditioned\n\n### Observation from §6.2\n- Convection: largest eigenvalue ~10^4\n- Reaction: largest eigenvalue ~10^3 (least ill-conditioned — explains why Adam ≈ Adam+L-BFGS on reaction)\n- Wave: largest eigenvalue ~10^5 (most ill-conditioned)\n\n## Method\n- Stochastic Lanczos Quadrature (SLQ) via PyHessian (Yao et al., 2020)\n- Preconditioned Hessian: H̃ᵀ H_L H̃ computed via Algorithm 2+3 (L-BFGS unrolling)\n- Memory size m=100 used for L-BFGS"}], "data": []}, "verified_by": [{"id": "E02", "title": "Hessian spectral analysis before and after L-BFGS preconditioning", "setup": "Model: Best model from Adam+L-BFGS training sweep (width with best final L2RE, best learning rate). Hardware: Single NVIDIA Titan V GPU. Dataset: Convection, Reaction, Wave. System: 41000 iterations Adam+L-BFGS; Stochastic Lanczos Quadrature (SLQ) for spectral density estimation.", "metrics": "Maximum eigenvalue, spectral density near zero, visual comparison of component spectra"}], "artifact": [{"name": "preconditioned_hessian.py", "pointer": "src/execution/preconditioned_hessian.py", "what": "L-BFGS preconditioned Hessian spectral density (C03, C04) — pointer index entry (not resolved in v1)"}], "built_on": [{"rw_id": "RW02", "name": "Krishnapriyan et al., 2021 (NeurIPS)", "relation_raw": "baseline"}, {"rw_id": "RW04", "name": "Wang et al., 2022b (When and why PINNs fail to train)", "relation_raw": "baseline"}, {"rw_id": "RW09", "name": "Yao et al., 2020 (PyHessian)", "relation_raw": "imports"}], "concepts": ["Condition Number"]}, {"id": "N06", "type": "decision", "parent": "N05", "title": "Target residual ill-conditioning via preconditioning", "body": "Use quasi-Newton (L-BFGS) preconditioning to reduce condition number of the loss landscape. alternatives: Loss reweighting to balance residual vs BC/IC terms; Spectral bias mitigation via Fourier features", "thinking": "Knowing that the residual term is the ill-conditioning culprit still leaves a choice of remedy. One option is to reweight the loss so the residual term doesn't dominate; another is to change the network's spectral bias with something like Fourier features. Neither actually changes the conditioning of the underlying optimization problem, they just rebalance or reparameterize around it. The decision instead is to attack the ill-conditioning directly with quasi-Newton preconditioning: since the problem is a badly-scaled Hessian, the natural fix is a method that builds a curvature-aware preconditioner from the optimization trajectory itself, namely L-BFGS.", "depends_on": [], "isolated": false, "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Condition Number"]}, {"id": "N07", "type": "experiment", "parent": "N06", "title": "Does L-BFGS preconditioning reduce condition number?", "body": "Yes — L-BFGS preconditioned Hessian shows ≥1000× reduction in top eigenvalue for all three PDEs and all loss components.", "thinking": "This step is the direct test of the previous decision: does building an L-BFGS-based preconditioner actually shrink the ill-conditioning that was diagnosed? Comparing the raw Hessian spectral density against the preconditioned version shows a large improvement: the top eigenvalue drops by a factor of at least 1000 across all three PDEs and every loss component, not just the residual term the preconditioner was aimed at. Quasi-Newton preconditioning works as a fix for the ill-conditioning, not just in theory but as measured directly on these problems.", "depends_on": [], "isolated": false, "source_refs": ["§5.3"], "why": [{"id": "C04", "title": "L-BFGS preconditioning reduces the condition number by ≥1000×", "statement": "The L-BFGS preconditioned Hessian (H_k · H_L) has top eigenvalue reduced by at least 10^3 compared to the unpreconditioned Hessian, for all three studied PDEs and all individual loss components.", "status": "supported", "falsification": "Preconditioned Hessian with top eigenvalue reduction &lt; 100× on these problems would refute this.", "dependencies": ["C02"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "fig3_hessian_spectral", "caption": "---", "markdown": "# Figure 3 & Figure 7: Hessian Spectral Density Before a
