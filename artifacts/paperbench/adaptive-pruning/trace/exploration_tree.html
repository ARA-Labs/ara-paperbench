<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — adaptive-pruning</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — adaptive-pruning</h1>
  <p>Research DAG &middot; APT: Adaptive Pruning and Tuning Pretrained Language Models for Efficient Training and Inference</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "Can a single method improve both training AND inference efficiency for LM fine-tuning?",
    "description": "Existing PEFT methods (LoRA, AdaLoRA) reduce training costs but leave inference unchanged. Structured pruning improves inference but worsens training. Is there a unified approach?",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Baseline: Naive combination of LoRA + structured pruning (LoRA+Prune)",
        "result": "Severe performance degradation (84.0/93.0 MNLI/SST2 vs 87.6/94.8 FT) and 6534.6% relative training time — far worse than either approach alone.",
        "evidence": [
          "C01",
          "Table 2",
          "§1",
          "§2.3"
        ],
        "children": [
          {
            "id": "N03",
            "type": "dead_end",
            "title": "Static LoRA ranks + post-training structured pruning (CPET approach)",
            "hypothesis": "Static LoRA adapters can compensate for parameters removed by structured pruning",
            "failure_mode": "Static tuning parameters cannot adapt to the dynamically changing parameter space during pruning; results in noticeable performance loss and extra training costs",
            "lesson": "Tuning parameters must be dynamic and co-adapted with pruning decisions; a new adapter architecture is needed"
          },
          {
            "id": "N04",
            "type": "decision",
            "title": "Design choice: dynamic adapter architecture that controls both pruning AND tuning",
            "choice": "APT adapter with binary pruning masks (m_i, m_o) and dynamic rank (r_apt) built over LoRA",
            "alternatives": [
              "HAdapters / Prefix-tuning (non-linear adapters) — rejected: cannot be merged at inference",
              "Separate pruning module without adapter integration — rejected: cannot co-optimize",
              "Quantization instead of pruning — rejected: requires specialized hardware support for speedup"
            ],
            "evidence": "LoRA mergeability enables zero inference overhead; binary masks enable structured pruning; dynamic rank enables adaptive tuning",
            "children": [
              {
                "id": "N05",
                "type": "question",
                "title": "How to compute salience for frozen parameters inaccessible in PEFT?",
                "description": "Standard weight-gradient salience (Sanh et al., 2020) requires frozen weight gradients, which are unavailable in PEFT. How to score frozen parameter blocks?",
                "children": [
                  {
                    "id": "N06",
                    "type": "dead_end",
                    "title": "Use only tuning parameter salience (LRP approach)",
                    "hypothesis": "Salience of LoRA matrices W_A, W_B suffices to proxy frozen weight importance",
                    "failure_mode": "Misses frozen weight contribution; leads to sub-optimal block selection; LRP results confirm performance gap vs APT",
                    "lesson": "Block-wise salience must combine both frozen weight proxy and tuning weight salience (Equation 9)"
                  },
                  {
                    "id": "N07",
                    "type": "experiment",
                    "title": "Activation-gradient product as proxy for frozen weight-gradient salience",
                    "result": "Activation × gradient computable from forward/backward hooks; summing over batch reduces memory; provides valid salience proxy.",
                    "evidence": [
                      "§4.2",
                      "Equation 4",
                      "Appendix B"
                    ],
                    "children": [
                      {
                        "id": "N08",
                        "type": "question",
                        "title": "Does block-level averaging of salience miss outlier parameters?",
                        "description": "Quantization literature (Dettmers et al., 2022) shows outliers are critical for LM capabilities. Will activation-gradient salience alone preserve them?",
                        "children": [
                          {
                            "id": "N09",
                            "type": "experiment",
                            "title": "Ablation: salience with and without kurtosis term for LLaMA pruning",
                            "result": "Removing kurtosis: LLaMA2-7B avg drops from 50.0 to 38.1 at 30% sparsity — a 23.8% degradation. Critical for large LMs.",
                            "evidence": [
                              "C04",
                              "Table 5",
                              "§5.6"
                            ],
                            "children": [
                              {
                                "id": "N10",
                                "type": "decision",
                                "title": "Add kurtosis of activation to salience score (outlier-aware salience)",
                                "choice": "Ŝ(W_{:,j}) = S̃(W_{:,j}) + Kurt(O_{j,:})^{1/2}",
                                "alternatives": [
                                  "Max activation magnitude instead of kurtosis — not explored in paper",
                                  "Standard deviation of activation — would also capture spread but less sensitive to outliers"
                                ],
                                "evidence": "Kurtosis captures tail heaviness (outlier density); kurtosis ablation shows 24% performance drop for LLaMA",
                                "children": []
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "id": "N11",
                "type": "experiment",
                "title": "Block selection: latency-saliency knapsack vs binary search over salience density",
                "result": "Binary search over salience-density-sorted blocks is O(log N) vs full knapsack. Monotone parameter count function enables exact binary search. Equivalent quality.",
                "evidence": [
                  "§4.2",
                  "Appendix C",
                  "Algorithm 1"
                ],
                "children": [
                  {
                    "id": "N12",
                    "type": "decision",
                    "title": "Use salience density (salience/param_count) + binary search for block selection",
                    "choice": "Sort blocks by ρ(b) = Ŝ(b)/C(b), binary search for budget-feasible top-i",
                    "alternatives": [
                      "Full knapsack DP — O(N·C_total) too expensive per training step",
                      "Greedy salience threshold — misses parameter count weighting"
                    ],
                    "evidence": "Parameter count is monotonically increasing in number of retained blocks; enables exact binary search",
                    "children": []
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "id": "N13",
        "type": "experiment",
        "title": "Adaptive tuning: static vs dynamic rank growth in salient adapters",
        "result": "APT w/o AT: SST2 93.2, MNLI 84.5 (vs APT: 94.5, 86.4); 16% slower convergence. Dynamic rank growth in top-half salient adapters recovers ~2 points accuracy and speeds training.",
        "evidence": [
          "C05",
          "Table 4",
          "§5.6"
        ],
        "children": [
          {
            "id": "N14",
            "type": "dead_end",
            "title": "Uniformly increasing ranks across all adapter layers",
            "hypothesis": "Adding tuning parameters uniformly across all layers recovers pruned model performance equally well",
            "failure_mode": "Uniform rank increase achieves only 84.4 on MNLI (vs 86.4 with salience-based allocation); wastes budget on low-importance layers",
            "lesson": "Tuning budget must be concentrated in task-sensitive layers identified by adapter importance I(H_apt)"
          }
        ]
      }
    ]
  },
  {
    "id": "N15",
    "type": "experiment",
    "title": "Self-distillation: separate teacher vs shared frozen parameters",
    "also_depends_on": [
      "N04"
    ],
    "result": "FT teacher: 111.8% memory, 7.9% training speed. APT self-distillation: 70.1% memory, 16.9% training speed. Self-distillation 2× faster and uses ~40% less memory than FT teacher approach.",
    "evidence": [
      "C03",
      "Table 10",
      "§4.4",
      "§G"
    ],
    "children": [
      {
        "id": "N16",
        "type": "decision",
        "title": "Use shared frozen parameters + duplicated tuning layers as teacher (self-distillation)",
        "choice": "Teacher shares frozen weights with student; only tuning layers are duplicated; random layer mapping per epoch from RAIL-KD",
        "alternatives": [
          "LoRA teacher (separately trained LoRA model): extremely slow training (1.7% speed), 96.1% memory",
          "Separate FT teacher: 111.8% training memory — requires extra GPU for teacher model",
          "No distillation: faster (20.7% speed) but 1.7 accuracy points worse"
        ],
        "evidence": "Shared frozen params avoid doubling ~95% of model memory; self-distillation achieves near-FT-teacher quality at fraction of cost",
        "children": []
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
