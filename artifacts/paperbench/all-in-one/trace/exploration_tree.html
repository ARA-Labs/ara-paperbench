<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — all-in-one</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — all-in-one</h1>
  <p>Research DAG &middot; All-in-one simulation-based inference</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "Can a single amortized model perform all SBI inference tasks?",
    "description": "Is it possible to train a single neural network that can sample any conditional of the joint distribution p(theta, x), including posterior, likelihood, and arbitrary parameter/data conditionals, without requiring retraining for each specific task?",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Test whether standard amortized methods can be generalized to all conditionals",
        "result": "NPE, NLE, NRE each specialize to one conditional; no existing method handles arbitrary conditionals within a single network",
        "evidence": [
          "O1",
          "O3",
          "§1"
        ],
        "children": [
          {
            "id": "N03",
            "type": "decision",
            "title": "Choose generative model for joint distribution p(theta, x)",
            "choice": "Score-based diffusion model trained on joint distribution with random condition masks",
            "alternatives": [
              "Normalizing flows (fast sampling but fixed posterior/likelihood target)",
              "VAE-based approaches (limited expressiveness)",
              "GANs (training instability, no density evaluation)"
            ],
            "evidence": "Diffusion models can be conditioned post-hoc via score modification; score decomposes additively for i.i.d. data (Geffner et al., 2023)",
            "children": [
              {
                "id": "N04",
                "type": "question",
                "title": "What neural architecture can handle variable-length token sequences with dependency masks?",
                "description": "Need architecture that (1) processes any subset of variables, (2) encodes known dependency structure, (3) supports function-valued parameters",
                "children": [
                  {
                    "id": "N05",
                    "type": "decision",
                    "title": "Choose transformer over MLP for score network",
                    "choice": "Encoder-only transformer with attention mask encoding dependency structure (Weilbach et al., 2023)",
                    "alternatives": [
                      "Conditional MLP (NPSE baseline — fixed input size, no structured attention)",
                      "Graph Neural Network (requires fixed graph at inference)",
                      "Recurrent networks (sequential bias, not permutation invariant)"
                    ],
                    "evidence": "Transformers natively handle variable-length sequences; attention masks can encode graphical model structure; Weilbach et al. (2023) demonstrated this for structured diffusion models",
                    "children": [
                      {
                        "id": "N06",
                        "type": "experiment",
                        "title": "Validate Simformer tokenizer design for SBI",
                        "result": "Tokenizing each variable as (id_embed, value_repeat, metadata_fourier, cond_state_embed) allows flexible conditioning on arbitrary subsets; random condition masks during training provide all-in-one capability",
                        "evidence": [
                          "C03",
                          "§3.1",
                          "Fig 2"
                        ],
                        "children": [
                          {
                            "id": "N07",
                            "type": "experiment",
                            "title": "Benchmark Simformer (dense mask) against NPE on SBIBM tasks",
                            "result": "Simformer outperforms NPE on 3/4 tasks; requires ~10x fewer simulations on average; sharp C2ST improvement at >50 reverse SDE steps",
                            "evidence": [
                              "C01",
                              "C02",
                              "Fig 4a",
                              "Fig A7"
                            ],
                            "children": [
                              {
                                "id": "N08",
                                "type": "decision",
                                "title": "Validate structured attention masks for efficiency gains",
                                "choice": "Undirected and directed attention masks based on simulator graphical model; dynamic mask update (Webb et al., 2018) for directed case",
                                "alternatives": [
                                  "Fixed dense attention mask (simpler but ignores structure)",
                                  "Masking MLP weights (MADE-style — not dynamically adaptable)"
                                ],
                                "evidence": "Structured masks substantially improve performance on Linear Gaussian (fully factorized) and SLCP (4 i.i.d. obs); directed mask requires algorithmic update per condition",
                                "children": [
                                  {
                                    "id": "N09",
                                    "type": "experiment",
                                    "title": "Validate arbitrary conditional estimation (Tree, HMM tasks)",
                                    "result": "Simformer accurately models all 100 randomly sampled conditionals per task when trained on 10^5 simulations; training on all conditionals does not hurt posterior-only performance",
                                    "evidence": [
                                      "C03",
                                      "C06",
                                      "Fig 4b"
                                    ],
                                    "children": [
                                      {
                                        "id": "N10",
                                        "type": "experiment",
                                        "title": "Test Simformer on Lotka-Volterra with unstructured/missing data",
                                        "result": "Simformer handles irregular observations (4 prey, then 9 additional predator); posterior predictives realistic; C2ST posterior < 0.65 at 10^5 sims",
                                        "evidence": [
                                          "C04",
                                          "Fig 5"
                                        ],
                                        "also_depends_on": [
                                          "N06"
                                        ],
                                        "children": [
                                          {
                                            "id": "N11",
                                            "type": "experiment",
                                            "title": "Test Simformer on SIRD with infinite-dimensional (function-valued) contact rate",
                                            "result": "Simformer correctly recovers time-varying contact rate with appropriate uncertainty; handles parameter conditioning (scenario B) with well-calibrated expected coverage",
                                            "evidence": [
                                              "C04",
                                              "Fig 6",
                                              "Fig A13"
                                            ],
                                            "children": [
                                              {
                                                "id": "N12",
                                                "type": "question",
                                                "title": "Can Simformer condition on intervals (not just exact values)?",
                                                "description": "Energy-efficient parameter identification requires conditioning on inequality constraints (energy < threshold), which cannot be done with standard conditioning",
                                                "children": [
                                                  {
                                                    "id": "N13",
                                                    "type": "decision",
                                                    "title": "Use guided diffusion with sigmoid-penalized constraint function",
                                                    "choice": "General guidance (Bansal et al., 2023) with s(t)=1/sigma(t)^2 and optional self-recurrence r; constraint c(x)=x-u for upper bound",
                                                    "alternatives": [
                                                      "RePaint method (Lugmayr et al., 2022) — only applies to normal conditioning, not general constraints",
                                                      "Classifier guidance (Dhariwal & Nichol, 2021) — requires separately trained classifier",
                                                      "Hard rejection sampling — exponentially inefficient in high dimensions"
                                                    ],
                                                    "evidence": "Bansal et al. (2023) demonstrated universal guidance; self-recurrence r=5 markedly improves accuracy at 5x cost (Fig A15, A16)",
                                                    "children": [
                                                      {
                                                        "id": "N14",
                                                        "type": "experiment",
                                                        "title": "Validate guided diffusion on Hodgkin-Huxley with energy constraint",
                                                        "result": "Energy-constrained posterior significantly constrains gNa, gK; energy of predictive samples lies below 10% quantile threshold; voltage traces remain consistent with observations",
                                                        "evidence": [
                                                          "C05",
                                                          "Fig 7",
                                                          "Fig A15"
                                                        ]
                                                      }
                                                    ]
                                                  }
                                                ]
                                              }
                                            ]
                                          }
                                        ]
                                      }
                                    ]
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "id": "N03b",
        "type": "dead_end",
        "title": "Training solely on posterior mask as an ablation",
        "hypothesis": "Training only on posterior mask (like NPSE) should achieve best posterior C2ST since it specializes",
        "failure_mode": "Training on all conditionals achieves similar or better posterior C2ST compared to posterior-only training; no meaningful gain from specialization",
        "lesson": "The all-in-one training objective is 'free' — estimating all conditionals does not hurt and can even help (e.g., SLCP where simple likelihood structure benefits posterior estimation)"
      },
      {
        "id": "N03c",
        "type": "dead_end",
        "title": "Attempting strict conditional independence enforcement with undirected graphs",
        "hypothesis": "Undirected attention masks would enforce exact conditional independencies between variables",
        "failure_mode": "Undirected graphs connect all nodes within components given enough transformer layers; cannot enforce specific independencies beyond disconnected components (only directed graphs can)",
        "lesson": "Undirected masks improve efficiency via soft structural biases but cannot guarantee independence; directed masks provide exact structure at t=0 but need dynamic updates and have limitations at t>0"
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
