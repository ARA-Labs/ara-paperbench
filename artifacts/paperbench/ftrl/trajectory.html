y"], "built_on": [{"rw_id": "RW01", "name": "Tuyls et al., 2023", "relation_raw": "baseline"}, {"rw_id": "RW05", "name": "Wołczyk et al., 2021", "relation_raw": "imports"}, {"rw_id": "RW06", "name": "Baker et al., 2022 (VPT)", "relation_raw": "extends"}, {"rw_id": "RW09", "name": "Petrenko et al., 2020 (Sample Factory)", "relation_raw": "imports"}, {"rw_id": "RW08", "name": "Haarnoja et al., 2018a", "relation_raw": "imports"}, {"rw_id": "RW10", "name": "Burda et al., 2018 (RND)", "relation_raw": "imports"}, {"rw_id": "RW02", "name": "Kirkpatrick et al., 2017", "relation_raw": "imports"}, {"rw_id": "RW03", "name": "Schmitt et al., 2018", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Rebuffi et al., 2017", "relation_raw": "imports"}, {"rw_id": "RW11", "name": "Hambro et al., 2022 (Dungeons and Data)", "relation_raw": "baseline"}], "rejected_here": [{"rw_id": "RW07", "name": "Wulfmeier et al., 2023", "relation_raw": "bounds"}]}, {"id": "N12", "type": "experiment", "parent": "N11", "title": "Log-likelihood and PCA analysis: irreversibility of forgetting", "body": "The log-likelihood of the pre-trained expert's push-wall trajectories collapses by 100K steps, matching the point where success rate drops to zero. Even after the agent re-learns the task by around 4M steps and success climbs back above 80%, the log-likelihoods never recover to their original values. The fine-tuned policy that re-solves the task is qualitatively different from the pre-trained one; the forgetting is not simply undone by further training.", "thinking": "RoboticSequence showed that vanilla fine-tuning collapses on the far stages and then partially recovers as training continues. That recovery raises a follow-up question: when the agent eventually re-learns push-wall, does it recover the original pre-trained policy, or does it find a different solution to the same task? Measuring the log-likelihood the fine-tuned policy assigns to the pre-trained expert's own trajectories, plus a PCA projection of the state space, is a way to check whether the 'same' behavior is really the same policy underneath.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Figure 20", "Appendix F"], "why": [{"id": "C06", "title": "Forgetting is irreversible under vanilla fine-tuning — the re-learned policy is qualitatively different from the pre-trained one", "statement": "After the fine-tuned agent eventually revisits FAR states, the policy it re-learns is qualitatively different from the pre-trained policy (log-likelihoods of pre-trained expert trajectories under the fine-tuned policy do not recover to original values), indicating that transfer benefits are permanently lost under vanilla fine-tuning.", "status": "supported", "falsification": "Log-likelihood of pre-trained expert trajectories under the fine-tuned policy recovers to within 10% of original values after re-visiting FAR states.", "dependencies": ["C01", "C02"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "fig8_pushwall_loglikelihood", "caption": "Figure 8: Push-wall Log-likelihood Analysis", "markdown": "# Figure 8: Push-wall Log-likelihood Analysis\n\n**Source**: Figure 8, §5\n**Claims**: C01, C02\n\n## Description\nLog-likelihood under the fine-tuned policy of trajectories collected using π* on push-wall, i.e., state-action pairs (s, a*) where a* ~ π*(s). Top row: overall push-wall success rates at each checkpoint. Bottom row: 2D PCA projections of the state space, color-coded by log-likelihood values.\n\n## Push-wall Success Rate (Top Row)\n\n| Checkpoint | Success Rate |\n|-----------|-------------|\n| 0 steps (pre-trained π*) | ~1.0 (100%) |\n| 100K steps | ~0.0 (collapsed) |\n| 500K steps | ~0.0 (still collapsed) |\n| ~4M steps (recovered) | ~0.8 (recovered but different policy) |\n\n## Log-likelihood (Bottom Row — PCA Projections)\n- **0 steps**: High log-likelihood (bright colors) uniformly across state space PCA projection\n- **100K steps**: High probability assigned to some correct actions in part of state space; overall success rate already collapsed to 0 — \"even partial forgetting in the initial stages significantly impacts performance\"\n- **500K steps**: Log-likelihood values collapse on all expert trajectories; PCA projection shows low values everywhere\n- **~4M steps** (recovered): Some regions show recovered log-likelihoods, but values do not reach original levels; fine-tuned agent learned a DIFFERENT policy from π*\n\n## Key Observations\n- Rapid collapse: success rate drops to 0 between 0 and 100K steps\n- Partial log-likelihood (at 100K) is insufficient to maintain any success — the missing portions matter\n- Recovery does not return to original values — irreversible representation change\n- This demonstrates that vanilla fine-tuning cannot recover FPC and learns an alternative solution"}], "data": []}, "verified_by": [{"id": "E06", "title": "Log-Likelihood and Representation Analysis of Forgetting in RoboticSequence", "setup": "Model: SAC policy for RoboticSequence (same as E03) | Hardware: 8 CPU cores, 30GB RAM | Dataset: Trajectories collected from π* (pre-trained on peg-unplug-side, push-wall) | System: Evaluate vanilla fine-tuned policy; compute log-likelihoods and CKA at checkpoints 0, 100K, 500K, and during re-learning", "metrics": "Log-likelihood of expert trajectories under fine-tuned policy; CKA similarity per layer between pre-trained and fine-tuned activations"}], "artifact": [{"name": "fpc_analysis.py", "pointer": "src/execution/fpc_analysis.py", "what": "FPC analysis utilities: CKA-based representation drift measurement, CLOSE/FAR state partitioning analysis, and log-likelihood analysis of expert trajectories."}], "concepts": [], "built_on": [{"rw_id": "RW12", "name": "Kornblith et al., 2019 (CKA)", "relation_raw": "imports"}], "rejected_here": []}, {"id": "N13", "type": "dead_end", "parent": "N11", "title": "Kickstarting fails on RoboticSequence (state coverage gap)", "body": "It is the same failure mode as Montezuma's Revenge: Kickstarting forces a KL match against π* on the close states (hammer and push), which the pre-trained policy was never trained on, so there is no meaningful distribution to match against. The consistent lesson across both state coverage gap environments is that Kickstarting is strictly limited to the imperfect cloning gap setting; pinning down and documenting exactly where it breaks is one of the paper's key contributions.", "thinking": "Given that RoboticSequence is another state-coverage-gap setting, it is worth checking whether Kickstarting fails here the same way it failed on Montezuma's Revenge, to see whether the earlier failure was a one-off or a general pattern.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Kickstarting", "State Coverage Gap", "Imperfect Cloning Gap"]}, {"id": "N14", "type": "decision", "parent": "N05", "title": "Method recommendation: use BC as default, KS for imperfect cloning gap", "body": "The recommendation is to use Behavioral Cloning as the robust default, since it worked well across every environment and FPC type tested. Kickstarting is recommended specifically for the imperfect cloning gap, where it was shown to work well on NetHack but not elsewhere. Episodic Memory is recommended when an off-policy algorithm is already available, and EWC is positioned as the cheapest fallback computationally, despite being dominated by the other methods in the direct comparisons. The alternatives considered and set aside were always defaulting to BC regardless of FPC type, defaulting to EWC purely because it is the cheapest, or building an automatic detector that would classify the FPC type and switch methods automatically.", "thinking": "With results across all three environments and two dead ends pinning down exactly when Kickstarting breaks, the project's job shifts from diagnosis to a practical recommendation practitioners can actually use. The choice comes down to matching a method's assumptions to the FPC type it is being asked to fix, rather than picking one method and hoping it generalizes everywhere.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Empirical results across 3 environments; theoretical analysis of KS failure mode on SCG (N10, N13)"], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Behavioral Cloning Loss", "Kickstarting", "Imperfect Cloning Gap", "Episodic Memory", "Elastic Weight Consolidation"]}], "context": {"title": "Problem", "summary": "The interplay between actions and observations in RL creates a non-stationary data distribution during fine-tuning that mimics the task-sequence non-stationarity studied in continual learning.", "sections": [{"role": "setting", "heading": "", "present": false, "entries": []}, {"role": "observations", "heading": "Observations", "present": true, "entries": [{"ent_id": "O1", "inferred_id": false, "ent_title": "Fine-tuning RL models frequently fails to leverage pre-trained knowledge", "text": "### O1: Fine-tuning RL models frequently fails to leverage pre-trained knowledge\n- **Statement**: Unlike supervised learning where fine-tuning reliably transfers knowledge, vanilla fine-tuning in RL often results in performance equal to or worse than training from scratch. In NetHack, vanilla fine-tuning achieves only ~1K average return by end of training versus ~5K for the frozen pre-trained model.\n- **Evidence**: Figure 3a (NetHack performance curves), Table 4 (Fine-tuning score 7756 vs. From scratch 6696 at last checkpoint, but training curves show early collapse below the pre-trained baseline)\n- **Implication**: RL fine-tuning has a structural problem not present in supervised learning; the standard recommendation to \"just fine-tune\" does not transfer from NLP/CV.", "unstructured": false, "fields": [{"label": "Statement", "value": "Unlike supervised learning where fine-tuning reliably transfers knowledge, vanilla fine-tuning in RL often results in performance equal to or worse than training from scratch. In NetHack, vanilla fine-tuning achieves only ~1K average return by end of training versus ~5K for the frozen pre-trained model."}, {"label": "Evidence", "value": "Figure 3a (NetHack performance curves), Table 4 (Fine-tuning score 7756 vs. From scratch 6696 at last checkpoint, but training curves show early collapse below the pre-trained baseline)"}, {"label": "Implication", "value": "RL fine-tuning has a structural problem not present in supervised learning; the standard recommendation to \"just fine-tune\" does not transfer from NLP/CV."}], "refs": [{"raw": "O1", "kind": "observation", "target": null}, {"raw": "Table 4", "kind": "figure", "target": null}, {"raw": "Figure 3a", "kind": "figure", "target": null}]}, {"ent_id": "O2", "inferred_id": false, "ent_title": "The RL feedback loop creates non-stationary state visitation during fine-tuning", "text": "### O2: The RL feedback loop creates non-stationary state visitation during fine-tuning\n- **Statement**: In RL, the states visited by the agent depend on its current policy. When fine-tuning on a downstream task, the agent initially visits only easy \"CLOSE\" states. States in \"FAR\" (reachable only after mastering CLOSE) are not visited early, even if the pre-trained policy was competent there.\n- **Evidence**: Figure 4 (density plots showing pre-trained policy π* rarely leaves Level 1 of NetHack, while AutoAscend expert visits many levels); Section 2, conceptual analysis\n- **Implication**: Gradient updates on CLOSE states interfere with the function approximator's representation for FAR states, causing forgetting even though the downstream task's stationary distribution includes FAR.", "unstructured": false, "fields": [{"label": "Statement", "value": "In RL, the states visited by the agent depend on its current policy. When fine-tuning on a downstream task, the agent initially visits only easy \"CLOSE\" states. States in \"FAR\" (reachable only after mastering CLOSE) are not visited early, even if the pre-trained policy was competent there."}, {"label": "Evidence", "value": "Figure 4 (density plots showing pre-trained policy π* rarely leaves Level 1 of NetHack, while AutoAscend expert visits many levels); Section 2, conceptual analysis"}, {"label": "Implication", "value": "Gradient updates on CLOSE states interfere with the function approximator's representation for FAR states, causing forgetting even though the downstream task's stationary distribution includes FAR."}], "refs": [{"raw": "O2", "kind": "observation", "target": null}, {"raw": "Figure 4", "kind": "figure", "target": null}]}, {"ent_id": "O3", "inferred_id": false, "ent_title": "Forgetting of FAR-state behavior is rapid and often catastrophic", "text": "### O3: Forgetting of FAR-state behavior is rapid and often catastrophic\n- **Statement**: In RoboticSequence, the success rate on FAR stages (peg-unplug-side, push-wall) collapses to 0% within the first 100K fine-tuning steps. In Montezuma's Revenge, Room 7 success rate drops significantly within the first 20M steps of vanilla fine-tuning.\n- **Evidence**: Figure 7 (RoboticSequence per-stage success rates), Figure 6 (Montezuma Room 7 success rate), Figure 8 (log-likelihood collapse on push-wall trajectories)\n- **Implication**: The forgetting is not gradual degradation but catastrophic collapse, making recovery difficult.", "unstructured": false, "fields": [{"label": "Statement", "value": "In RoboticSequence, the success rate on FAR stages (peg-unplug-side, push-wall) collapses to 0% within the first 100K fine-tuning steps. In Montezuma's Revenge, Room 7 success rate drops significantly within the first 20M steps of vanilla fine-tuning."}, {"label": "Evidence", "value": "Figure 7 (RoboticSequence per-stage success rates), Figure 6 (Montezuma Room 7 success rate), Figure 8 (log-likelihood collapse on push-wall trajectories)"}, {"label": "Implication", "value": "The forgetting is not gradual degradation but catastrophic collapse, making recovery difficult."}], "refs": [{"raw": "O3", "kind": "observation", "target": null}, {"raw": "Figure 7", "kind": "figure", "target": null}, {"raw": "Figure 6", "kind": "figure", "target": null}, {"raw": "Figure 8", "kind": "figure", "target": null}]}, {"ent_id": "O4", "inferred_id": false, "ent_title": "Even after re-learning, the final policy differs from the pre-trained one", "text": "### O4: Even after re-learning, the final policy differs from the pre-trained one\n- **Statement**: Log-likelihood of expert trajectories under the fine-tuned policy on push-wall does not recover to original values even after the policy re-learns the task. This indicates the agent learned a qualitatively different policy rather than recovering the pre-trained one.\n- **Evidence**: Figure 8 (log-likelihood PCA projections at 0, 100K, 500K steps), Appendix F analysis\n- **Implication**: FPC is irreversible under vanilla fine-tuning; transfer benefits are permanently lost.", "unstructured": false, "fields": [{"label": "Statement", "value": "Log-likelihood of expert trajectories under the fine-tuned policy on push-wall does not recover to original values even after the policy re-learns the task. This indicates the agent learned a qualitatively different policy rather than recovering the pre-trained one."}, {"label": "Evidence", "value": "Figure 8 (log-likelihood PCA projections at 0, 100K, 500K steps), Appendix F analysis"}, {"label": "Implication", "value": "FPC is irreversible under vanilla fine-tuning; transfer benefits are permanently lost."}], "refs": [{"raw": "O4", "kind": "observation", "target": null}, {"raw": "Figure 8", "kind": "figure", "target": null}]}, {"ent_id": "O5", "inferred_id": false, "ent_title": "FPC occurs even in simple 2-state MDPs", "text": "### O5: FPC occurs even in simple 2-state MDPs\n- **Statement**: Toy 2-state MDPs with specific parameterizations exhibit both state coverage gap and imperfect cloning gap, showing FPC is a fundamental property of gradient-based optimization on parametric policies, not an artifact of deep networks.\n- **Evidence**: Figure 9 (toy MDP analysis), Appendix A (APPLERETRIEVAL gridworld experiments)\n- **Implication**: The problem has a theoretical basis rooted in function approximator interference, independent of scale.", "unstructured": false, "fields": [{"label": "Statement", "value": "Toy 2-state MDPs with specific parameterizations exhibit both state coverage gap and imperfect cloning gap, showing FPC is a fundamental property of gradient-based optimization on parametric policies, not an artifact of deep networks."}, {"label": "Evidence", "value": "Figure 9 (toy MDP analysis), Appendix A (APPLERETRIEVAL gridworld experiments)"}, {"label": "Implication", "value": "The problem has a theoretical basis rooted in function approximator interference, independent of scale."}], "refs": [{"raw": "O5", "kind": "observation", "target": null}, {"raw": "Figure 9", "kind": "figure", "target": null}]}]}, {"role": "gaps", "heading": "Gaps", "present": true, "entries": [{"ent_id": "G1", "inferred_id": false, "ent_title": "Lack of conceptualization of FPC in the RL fine-tuning literature", "text": "### G1: Lack of conceptualization of FPC in the RL fine-tuning literature\n- **Statement**: Prior work on RL fine-tuning (Baker et al. 2022, Kumar et al. 2022, Seo et al. 2022) implicitly uses knowledge retention but does not identify FPC as the root cause, nor systematically study it.\n- **Caused by**: O1, O2\n- **Existing attempts**: Baker et al. (2022) adds a regularization term; Kumar et al. (2022) mixes old and new data; Seo et al. (2022) uses modularity\n- **Why they fail**: These are ad-hoc solutions not informed by the underlying mechanism; practitioners don't know when or why to apply them.", "unstructured": false, "fields": [{"label": "Statement", "value": "Prior work on RL fine-tuning (Baker et al. 2022, Kumar et al. 2022, Seo et al. 2022) implicitly uses knowledge retention but does not identify FPC as the root cause, nor systematically study it."}, {"label": "Caused by", "value": "O1, O2"}, {"label": "Existing attempts", "value": "Baker et al. (2022) adds a regularization term; Kumar et al. (2022) mixes old and new data; Seo et al. (2022) uses modularity"}, {"label": "Why they fail", "value": "These are ad-hoc solutions not informed by the underlying mechanism; practitioners don't know when or why to apply them."}], "refs": [{"raw": "G1", "kind": "observation", "target": null}, {"raw": "O1", "kind": "observation", "target": null}, {"raw": "O2", "kind": "observation", "target": null}]}, {"ent_id": "G2", "inferred_id": false, "ent_title": "No systematic evaluation of knowledge retention methods for RL fine-tuning", "text": "### G2: No systematic evaluation of knowledge retention methods for RL fine-tuning\n- **Statement**: No prior work comprehensively compares EWC, BC, KS, and EM specifically for the fine-tuning transfer scenario across multiple RL environments.\n- **Caused by**: O1, G1\n- **Existing attempts**: Individual continual RL papers test methods for multi-task sequences, not single-task fine-tuning\n- **Why they fail**: Continual RL assumes we care about all tasks; fine-tuning only cares about the downstream task—different objective.", "unstructured": false, "fields": [{"label": "Statement", "value": "No prior work comprehensively compares EWC, BC, KS, and EM specifically for the fine-tuning transfer scenario across multiple RL environments."}, {"label": "Caused by", "value": "O1, G1"}, {"label": "Existing attempts", "value": "Individual continual RL papers test methods for multi-task sequences, not single-task fine-tuning"}, {"label": "Why they fail", "value": "Continual RL assumes we care about all tasks; fine-tuning only cares about the downstream task—different objective."}], "refs": [{"raw": "G2", "kind": "observation", "target": null}, {"raw": "O1", "kind": "observation", "target": null}, {"raw": "G1", "kind": "observation", "target": null}]}]}, {"role": "insight", "heading": "Key Insight", "present": true, "entries": [{"ent_id": "", "inferred_id": false, "ent_title": "Key Insight", "text": "- **Insight**: The interplay between actions and observations in RL creates a non-stationary data distribution during fine-tuning that mimics the task-sequence non-stationarity studied in continual learning. Therefore, continual learning's knowledge retention methods directly address the root cause of poor RL fine-tuning.\n- **Derived from**: O1, O2, O3\n- **Enables**: Directly applying EWC, behavioral cloning loss, kickstarting, and episodic memory from the continual learning literature to RL fine-tuning, achieving SOTA results with minimal implementation overhead.", "unstructured": false, "fields": [{"label": "Insight", "value": "The interplay between actions and observations in RL creates a non-stationary data distribution during fine-tuning that mimics the task-sequence non-stationarity studied in continual learning. Therefore, continual learning's knowledge retention methods directly address the root cause of poor RL fine-tuning."}, {"label": "Derived from", "value": "O1, O2, O3"}, {"label": "Enables", "value": "Directly applying EWC, behavioral cloning loss, kickstarting, and episodic memory from the continual learning literature to RL fine-tuning, achieving SOTA results with minimal implementation overhead."}], "refs": [{"raw": "O1", "kind": "observation", "target": null}, {"raw": "O2", "kind": "observation", "target": null}, {"raw": "O3", "kind": "observation", "target": null}]}]}, {"role": "assumptions", "heading": "Assumptions", "present": true, "entries": [{"ent_id": "A1", "inferred_id": false, "ent_title": "The downstream task's state space can be approximately partitioned into CLOSE (reachable early) and FAR (reachable only after mastering CLOSE) subsets.", "text": "The downstream task's state space can be approximately partitioned into CLOSE (reachable early) and FAR (reachable only after mastering CLOSE) subsets.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A2", "inferred_id": false, "ent_title": "The pre-trained policy has meaningful competence on FAR states that would be beneficial for the downstream task.", "text": "The pre-trained policy has meaningful competence on FAR states that would be beneficial for the downstream task.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A3", "inferred_id": false, "ent_title": "Knowledge retention methods are applied only to the actor (policy network), not the critic.", "text": "Knowledge retention methods are applied only to the actor (policy network), not the critic.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A4", "inferred_id": false, "ent_title": "The downstream task is a single stationary MDP (not a sequence of tasks).", "text": "The downstream task is a single stationary MDP (not a sequence of tasks).", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A5", "inferred_id": false, "ent_title": "Models are not extremely large (>1B parameters); parameter-efficient fine-tuning methods like LoRA are out of scope.", "text": "Models are not extremely large (>1B parameters); parameter-efficient fine-tuning methods like LoRA are out of scope.", "unstructured": true, "fields": [], "refs": []}]}]}, "glossary": {"title": "Concepts", "groups": [], "terms": [{"term_id": "G01", "name": "Forgetting of Pre-trained Capabilities", "aliases": ["FPC"], "group": "", "definition": "The phenomenon by which a pre-trained RL agent loses its competence on parts of the state space not visited during the initial phase of fine-tuning, due to gradient interference in the function approximator when training on initially-visited states. Formally: let π* be the pre-trained policy, πθ(t) the fine-tuned policy at time t. FPC occurs when ∃S_FAR ⊆ S such that J(πθ(t), S_FAR) &lt; J(π*, S_FAR) for t > 0 during the early fine-tuning phase, where J measures performance on a state subset.", "fields": [{"label": "Notation", "value": "FPC"}, {"label": "Boundary conditions", "value": "Requires a feedback loop between policy and state visitation (RL setting). Does not occur in i.i.d. supervised learning if only downstream performance is evaluated."}], "refs": [], "related": ["G02", "G03"]}, {"term_id": "G02", "name": "State Coverage Gap", "aliases": [], "group": "", "definition": "A specific instance of FPC where the pre-trained policy π* is competent on FAR states but not on CLOSE states (i.e., π* was trained only on FAR). During fine-tuning where the agent must first traverse CLOSE to reach FAR, gradient updates on CLOSE cause π* to lose its FAR competence before it can be utilized.", "fields": [{"label": "Notation", "value": "SCG"}, {"label": "Boundary conditions", "value": "Requires that the pre-trained policy was trained on a subset of the downstream task's state space (specifically FAR), and that CLOSE states must be mastered before FAR states are reachable."}], "refs": [], "related": ["G01", "G03"]}, {"term_id": "G03", "name": "Imperfect Cloning Gap", "aliases": [], "group": "", "definition": "A specific instance of FPC where the pre-trained policy π* is a perturbed or approximate version of an optimal policy, causing slight suboptimality on CLOSE states. This slight suboptimality creates a compounding distribution shift: the agent visits CLOSE far more frequently than FAR, and gradient updates on CLOSE cause forgetting of FAR competence.", "fields": [{"label": "Notation", "value": "ICG"}, {"label": "Boundary conditions", "value": "Occurs when pre-training uses behavioral cloning from a superior agent (e.g., rule-based bot), offline datasets, or reward structure differs between pre-training and fine-tuning. More severe when the approximation error (cloning gap) is larger."}], "refs": [], "related": ["G01", "G02"]}, {"term_id": "G04", "name": "CLOSE / FAR State Partition", "aliases": [], "group": "", "definition": "An approximate partition of the downstream task's state space into CLOSE (states reachable from the initial state distribution with high probability early in training) and FAR (states reachable only after mastering CLOSE). In NetHack: CLOSE = Level 1 states; FAR = Level 2+ states. In Montezuma's Revenge: CLOSE = Rooms 1–6; FAR = Room 7+. In RoboticSequence: CLOSE = {hammer, push} stages; FAR = {peg-unplug-side, push-wall} stages.", "fields": [{"label": "Notation", "value": "S_CLOSE, S_FAR where S = S_CLOSE ∪ S_FAR"}, {"label": "Boundary conditions", "value": "Partition is approximate and task-dependent. In procedurally generated environments (NetHack), it is a statistical characterization, not a strict partition."}], "refs": [], "related": ["G02", "G03"]}, {"term_id": "G05", "name": "Elastic Weight Consolidation", "aliases": ["EWC"], "group": "", "definition": "A regularization-based knowledge retention method that penalizes changes to parameters deemed important for prior tasks, weighted by the diagonal of the Fisher Information Matrix F. θ* are the pre-trained weights, θ are the current weights, and Fᵢ = 𝔼[(∂ℓ/∂θᵢ)²] estimated from the pre-training data.", "fields": [{"label": "Notation", "value": "L_EWC(θ) = Σᵢ Fᵢ(θ*ᵢ - θᵢ)²"}, {"label": "Boundary conditions", "value": "Applied only to actor parameters (not critic). Fisher matrix computed over 10,000 batches from NLD-AA for NetHack, or 2,560 examples from replay buffer for RoboticSequence. Regularization coefficient 2×10⁶ for NetHack, 100 for RoboticSequence."}], "refs": [], "related": ["G06", "G07"]}, {"term_id": "G06", "name": "Behavioral Cloning Loss", "aliases": ["BC"], "group": "", "definition": "A distillation-based knowledge retention method that minimizes the KL divergence between the pre-trained policy π* and current policy πθ, computed over a static buffer B_BC = {(s, π*(s)) : s ∈ S_BC} of states from the pre-training environment. Unlike KS, the expectation is over a static pre-training data buffer, not online data.", "fields": [{"label": "Notation", "value": "L_BC(θ) = 𝔼_{s~B_BC}[D_KL(π*(s) ‖ πθ(s))]"}, {"label": "Boundary conditions", "value": "Requires access to pre-training data. Applied only to actor. KL coefficient: 2.0 for NetHack (no decay); tuned per-environment for others. Actor reg coefficient: 1.0 for RoboticSequence."}], "refs": [], "related": ["G07", "G05", "G08"]}, {"term_id": "G07", "name": "Kickstarting", "aliases": ["KS"], "group": "", "definition": "A distillation-based knowledge retention method similar to BC but with the expectation computed over data gathered by the current online policy πθ (not a static buffer). This means KS only enforces that the current policy matches π* on states the current policy currently visits.", "fields": [{"label": "Notation", "value": "L_KS(θ) = 𝔼_{s~πθ}[D_KL(π*(s) ‖ πθ(s))]"}, {"label": "Boundary conditions", "value": "Effective for imperfect cloning gap (e.g., NetHack) where FAR states are eventually visited by the fine-tuned policy. Fails for state coverage gap because it applies the KL loss on CLOSE states that π* was never trained on, interfering with CLOSE learning. Scaled by 0.5 with exponential decay 0.99998 per train step in NetHack."}], "refs": [], "related": ["G06", "G03", "G02"]}, {"term_id": "G08", "name": "Episodic Memory", "aliases": ["EM"], "group": "", "definition": "A replay-based knowledge retention method that populates the RL replay buffer with trajectories from the pre-training environment and protects them from being overwritten during fine-tuning. Old samples constitute 10% of the total replay buffer. Only applicable with off-policy algorithms (SAC).", "fields": [{"label": "Notation", "value": "B_EM ⊂ B_replay, |B_EM| = 0.1 × |B_replay|"}, {"label": "Boundary conditions", "value": "Only compatible with off-policy RL algorithms that maintain a replay buffer (SAC). Cannot be trivially applied to on-policy algorithms (PPO, APPO) as they may become unstable with off-policy data. Replay buffer size: 100K; EM size: 10K samples."}], "refs": [], "related": ["G06"]}, {"term_id": "G09", "name": "Asynchronous Proximal Policy Optimization", "aliases": ["APPO"], "group": "", "definition": "A highly parallelizable, asynchronous variant of PPO used for NetHack training. Enables >500M environment steps in 24 hours on a single A100 GPU. Key hyperparameters: clip_policy=0.1, clip_baseline=1.0, discounting=0.999999, entropy_cost=0.001, hidden_dim=1738 (LSTM), batch_size=128, unroll_length=32.", "fields": [{"label": "Notation", "value": "APPO"}, {"label": "Boundary conditions", "value": "On-policy algorithm; episodic memory cannot be directly applied. KS uses online data buffer B_θ."}], "refs": [], "related": ["G07", "G06"]}, {"term_id": "G10", "name": "Forward Transfer", "aliases": [], "group": "", "definition": "A metric quantifying how much faster a fine-tuned model learns compared to a randomly initialized model. AUC is the area under the success rate curve for the fine-tuned model; AUC_b is the corresponding area for a model trained from scratch. FT > 0 means fine-tuning helps; FT = 0 means no benefit over scratch; FT &lt; 0 means fine-tuning hurts.", "fields": [{"label": "Notation", "value": "FT = (AUC - AUC_b) / (1 - AUC_b), where AUC = (1/T)∫₀ᵀ p(t)dt"}, {"label": "Boundary conditions", "value": "Defined for RoboticSequence experiments in the paper. Measures speed of learning, not final performance."}], "refs": [], "related": ["G01"]}, {"term_id": "G11", "name": "Central Kernel Alignment", "aliases": ["CKA"], "group": "", "definition": "A similarity metric for comparing neural network representations. Given activation matrices X ∈ ℝⁿˣᵖ¹ and Y ∈ ℝⁿˣᵖ², CKA computes normalized HSIC (Hilbert-Schmidt Independence Criterion) with linear kernels. Used to quantify how much the fine-tuned network's internal representations drift from the pre-trained network's representations at each layer.", "fields": [{"label": "Notation", "value": "CKA(K, L) = HSIC(K, L) / √(HSIC(K,K) · HSIC(L,L))"}, {"label": "Boundary conditions", "value": "Linear kernel used in all paper experiments. Higher CKA = more similar representations. Early layers change less than late layers (consistent with prior supervised learning studies)."}], "refs": [], "related": ["G01"]}], "lexicon": {"forgetting of pre-trained capabilities": "G01", "fpc": "G01", "state coverage gap": "G02", "imperfect cloning gap": "G03", "close / far state partition": "G04", "elastic weight consolidation": "G05", "ewc": "G05", "behavioral cloning loss": "G06", "kickstarting": "G07", "episodic memory": "G08", "asynchronous proximal policy optimization": "G09", "appo": "G09", "forward transfer": "G10", "central kernel alignment": "G11", "cka": "G11"}}, "dependencies": {"title": "Related Work / Dependencies", "preamble": "", "legend": [], "attribution": "", "entries": [{"rw_id": "RW01", "inferred_id": false, "name": "Tuyls et al., 2023", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: This work fine-tunes the model from Tuyls et al. (2023) with knowledge retention; Tuyls et al. report only offline BC pre-training (5218 ± - on Human Monk) Why: Show that online fine-tuning with KR can 2× the offline-only SOTA", "adopted": "33M LSTM architecture, pre-trained weights, NLD-AA dataset, Human Monk evaluation protocol", "grounding": [{"raw": "arXiv:2307.09423", "kind": "arxiv", "target": null}], "claims": ["C01", "C03", "C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW02", "inferred_id": false, "name": "Kirkpatrick et al., 2017", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: EWC was proposed for supervised continual learning; this paper applies it to RL fine-tuning actor-only Why: EWC is a natural baseline for parameter regularization-based retention", "adopted": "Fisher-diagonal-weighted L2 regularization formula, concept of parameter importance", "grounding": [], "claims": ["C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW03", "inferred_id": false, "name": "Schmitt et al., 2018", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Kickstarting originally applied KL from a teacher policy to accelerate learning (not preserve prior knowledge); this paper uses it as a knowledge retention method during fine-tuning Why: KS naturally prevents the policy from deviating from π* on states the online policy visits", "adopted": "KL divergence auxiliary loss on online data; teacher-student distillation framework", "grounding": [{"raw": "arXiv:1803.03835", "kind": "arxiv", "target": null}], "claims": ["C04", "C05"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW04", "inferred_id": false, "name": "Rebuffi et al., 2017", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: iCaRL proposed replay-based continual learning for classification; this paper uses the BC-style replay (buffer of (s, π*(s)) pairs) for RL actor retention Why: Replay is a proven effective retention strategy; adapting it to RL requires using action distributions instead of class labels", "adopted": "Replay buffer structure; behavioral cloning on stored examples", "grounding": [], "claims": ["C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW05", "inferred_id": false, "name": "Wołczyk et al., 2021", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Continual World focuses on multi-task continual RL (retaining performance on all tasks); this paper focuses on single-task fine-tuning (only downstream task performance matters) Why: Provides the RoboticSequence environment infrastructure, SAC implementation, EWC/BC implementations, and forward transfer metric", "adopted": "Meta-World task sequences, SAC with CL methods, forward transfer metric definition, actor-only regularization principle", "grounding": [], "claims": ["C01", "C02", "C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW06", "inferred_id": false, "name": "Baker et al., 2022 (VPT)", "relation_raw": "extends", "relation_norm": "extends", "delta": "What changed: VPT uses a regularization term during fine-tuning but doesn't analyze it as FPC mitigation; pre-trains on video data using inverse dynamics model Why: Related to imperfect cloning gap (pre-training on passive video then fine-tuning with RL)", "adopted": "Conceptual motivation for retention during RL fine-tuning; disabling entropy during fine-tuning", "grounding": [{"raw": "arXiv:2206.11795", "kind": "arxiv", "target": null}], "claims": ["C01", "C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW07", "inferred_id": false, "name": "Wulfmeier et al., 2023", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Wulfmeier et al. claim (§3.5) that forgetting is not a factor in standard transfer RL; this paper shows the opposite empirically Why: The claim is based on supervised learning intuition; RL's feedback loop changes the dynamics", "adopted": "Taxonomy of knowledge modalities in transfer RL; motivation for studying fine-tuning", "grounding": [], "claims": ["C01", "C05"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW08", "inferred_id": false, "name": "Haarnoja et al., 2018a", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Standard SAC used as the base RL algorithm for RoboticSequence experiments Why: SAC is off-policy (enables EM) and well-suited for continuous control", "adopted": "SAC algorithm, automatic entropy tuning, replay buffer training", "grounding": [], "claims": ["C02", "C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW09", "inferred_id": false, "name": "Petrenko et al., 2020 (Sample Factory)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: APPO implementation used for NetHack fine-tuning; enables >500M steps/day on single A100 Why: NetHack requires massive sample efficiency; APPO provides the throughput", "adopted": "APPO algorithm, asynchronous training infrastructure, hyperparameter defaults (Table 6 in Petrenko et al.)", "grounding": [{"raw": "arXiv:2006.11751", "kind": "arxiv", "target": null}], "claims": ["C01", "C03", "C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW10", "inferred_id": false, "name": "Burda et al., 2018 (RND)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: RND is used as an exploration bonus for Montezuma's Revenge; critical for solving the sparse-reward environment Why: Without intrinsic motivation, PPO cannot explore beyond the first few rooms", "adopted": "Random network distillation architecture (target + predictor), intrinsic motivation via prediction error", "grounding": [], "claims": ["C02", "C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW11", "inferred_id": false, "name": "Hambro et al., 2022 (Dungeons and Data)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Provides NLD-AA dataset used for BC pre-training in NetHack; also provides prior baselines (From Scratch + KS: 2090, From Scratch + BC: 2809) to compare against Why: Establishes evaluation protocol and baseline methods for NetHack", "adopted": "NLD-AA dataset, evaluation protocol, baseline results for comparison", "grounding": [], "claims": ["C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW12", "inferred_id": false, "name": "Kornblith et al., 2019 (CKA)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: CKA used to measure representation drift during fine-tuning; previously used in supervised continual learning analysis Why: Provides a quantitative measure of how much internal representations change, enabling analysis of where and when forgetting occurs in the network", "adopted": "CKA formula with linear kernel, layer-wise representation similarity analysis", "grounding": [], "claims": ["C06"], "cross_agent": false, "is_footprint": false}], "footprint": []}, "recipes": {"title": "Solution", "files": [{"file": "constraints.md", "role": "constraints", "file_title": "Constraints and Boundary Conditions", "sections": [{"sec_id": "BC1", "heading": "BC1: FPC requires an RL feedback loop", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "FPC only occurs when the agent's actions determine future state visitation. In i.i.d. supervised learning, the data distribution is fixed; forgetting of non-training-distribution examples does not affect downstream performance."}, {"label": "Implication", "value": "The paper's findings are specific to RL; the supervised learning conventional wisdom (forgetting doesn't matter for downstream performance) does not apply."}], "code": "", "text": "- **Condition**: FPC only occurs when the agent's actions determine future state visitation. In i.i.d. supervised learning, the data distribution is fixed; forgetting of non-training-distribution examples does not affect downstream performance.\n- **Implication**: The paper's findings are specific to RL; the supervised learning conventional wisdom (forgetting doesn't matter for downstream performance) does not apply.", "warn": "", "refs": []}, {"sec_id": "BC2", "heading": "BC2: FAR states must be reachable only through CLOSE", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "The CLOSE/FAR partition is meaningful only when FAR states are not directly accessible at training start. If FAR states are visited from the beginning (e.g., when pre-trained skills are needed from step 1), no forgetting occurs and vanilla fine-tuning works."}, {"label": "Evidence", "value": "Figure 24 (RoboticSequence with known tasks at the start) shows no FPC when FAR = first tasks in sequence."}], "code": "", "text": "- **Condition**: The CLOSE/FAR partition is meaningful only when FAR states are not directly accessible at training start. If FAR states are visited from the beginning (e.g., when pre-trained skills are needed from step 1), no forgetting occurs and vanilla fine-tuning works.\n- **Evidence**: Figure 24 (RoboticSequence with known tasks at the start) shows no FPC when FAR = first tasks in sequence.", "warn": "", "refs": []}, {"sec_id": "BC3", "heading": "BC3: Episodic Memory (EM) requires an off-policy replay buffer", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "EM can only be trivially applied with off-policy algorithms (SAC, DQN). PPO and APPO (on-policy) cannot use EM without significant instability."}, {"label": "Implication", "value": "EM is reported only for RoboticSequence (SAC); not reported for Montezuma (PPO) or NetHack (APPO)."}], "code": "", "text": "- **Condition**: EM can only be trivially applied with off-policy algorithms (SAC, DQN). PPO and APPO (on-policy) cannot use EM without significant instability.\n- **Implication**: EM is reported only for RoboticSequence (SAC); not reported for Montezuma (PPO) or NetHack (APPO).", "warn": "", "refs": []}, {"sec_id": "BC4", "heading": "BC4: KS fails for State Coverage Gap", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "Kickstarting applies the KL divergence on states visited by the current online policy. When state coverage gap is present, the online policy initially visits CLOSE states on which π* was never trained, making KL(π*(s) ‖ πθ(s)) undefined or harmful."}, {"label": "Implication", "value": "KS is not reported for Montezuma's Revenge or RoboticSequence."}], "code": "", "text": "- **Condition**: Kickstarting applies the KL divergence on states visited by the current online policy. When state coverage gap is present, the online policy initially visits CLOSE states on which π* was never trained, making KL(π*(s) ‖ πθ(s)) undefined or harmful.\n- **Implication**: KS is not reported for Montezuma's Revenge or RoboticSequence.", "warn": "", "refs": []}, {"sec_id": "BC5", "heading": "BC5: Knowledge retention is applied only to the actor, not the critic", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "All retention methods (EWC, BC, KS) are applied only to the policy (actor) network parameters. The critic is not regularized."}, {"label": "Rationale", "value": "Only actor behavior on FAR states matters for downstream performance; critic forgetting doesn't directly impact policy rollouts."}], "code": "", "text": "- **Condition**: All retention methods (EWC, BC, KS) are applied only to the policy (actor) network parameters. The critic is not regularized.\n- **Rationale**: Only actor behavior on FAR states matters for downstream performance; critic forgetting doesn't directly impact policy rollouts.", "warn": "", "refs": []}, {"sec_id": "L1", "heading": "L1: Simple retention methods used", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- The paper uses standard first-generation retention methods. More sophisticated continual learning methods (parameter isolation, modular networks, memory-aware synapses) may achieve better results.", "warn": "", "refs": []}, {"sec_id": "L2", "heading": "L2: Knowledge retention can harm if pre-trained policy is suboptimal on FAR", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- If the pre-trained policy is actually suboptimal on FAR states (or if FAR state behavior should be unlearned), retention methods will prevent the policy from improving there. No mechanism to selectively preserve only beneficial pre-trained behaviors is studied.", "warn": "", "refs": []}, {"sec_id": "L3", "heading": "L3: No study of very large models", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- The paper focuses on models up to 33M parameters. Parameter-efficient fine-tuning (LoRA, adapter layers) for models >1B parameters is out of scope.", "warn": "", "refs": []}, {"sec_id": "L4", "heading": "L4: Focus on two specific FPC scenarios", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- Only SCG and ICG are studied. Real-world settings may exhibit other forms of distribution shift not covered.", "warn": "", "refs": []}, {"sec_id": "L5", "heading": "L5: Single-task fine-tuning only", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- The paper studies fine-tuning to a single stationary downstream task. Multi-task fine-tuning and generalization to unseen goals are not the primary focus.", "warn": "", "refs": []}, {"sec_id": "L6", "heading": "L6: NetHack experiments limited to Human Monk character", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- Due to computational constraints, only the Human Monk scenario is studied. Generalization to other NetHack roles is untested.", "warn": "", "refs": []}, {"sec_id": "L7", "heading": "L7: Network size effects are complex in RL", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "- Unlike supervised continual learning where larger networks forget less, no clear correlation between network size and forgetting is found for RL (Appendix F, Figure 27). EWC tends to fail with very small (2-layer) networks.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Assumptions for FPC to be Severe", "kind": "steps", "markdown": "", "steps": ["The size of CLOSE (amount of time before FAR is reached) is large enough that significant gradient interference accumulates", "FAR and CLOSE states share enough representational overlap that CLOSE-gradient updates interfere with FAR representations", "The distribution gap between FAR and CLOSE states is in the intermediate range (Lee et al., 2021: intermediate similarity causes most forgetting)"], "fields": [], "code": "", "text": "1. The size of CLOSE (amount of time before FAR is reached) is large enough that significant gradient interference accumulates\n2. FAR and CLOSE states share enough representational overlap that CLOSE-gradient updates interfere with FAR representations\n3. The distribution gap between FAR and CLOSE states is in the intermediate range (Lee et al., 2021: intermediate similarity causes most forgetting)", "warn": "", "refs": []}]}, {"file": "algorithm.md", "role": "algorithm", "file_title": "Algorithm: Knowledge Retention for RL Fine-tuning", "sections": [{"sec_id": "", "heading": "Mathematical Formulation", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "### Total Training Objective\n$$\\mathcal{L}(\\theta) = \\mathcal{L}_{RL}(\\theta) + \\lambda \\cdot \\mathcal{L}_{retention}(\\theta)$$\n\nwhere $\\mathcal{L}_{RL}$ is the base RL loss (APPO/PPO/SAC objective) and $\\mathcal{L}_{retention}$ is one of four knowledge retention losses.\n\n### EWC Auxiliary Loss\n$$\\mathcal{L}_{EWC}(\\theta) = \\sum_i F^i (\\theta^{*i} - \\theta^i)^2$$\n\nwhere:\n- $\\theta^*$ = pre-trained weights (frozen)\n- $\\theta$ = current weights\n- $F^i$ = $i$-th diagonal element of Fisher Information Matrix\n- $F_{ii} = \\mathbb{E}\\left[\\left(\\frac{\\partial \\ell}{\\partial \\theta_i}\\right)^2\\right]$\n\n**NetHack**: $\\lambda = 2 \\times 10^6$, F estimated over 10,000 batches from NLD-AA  \n**RoboticSequence**: $\\lambda = 100$ (actor), $\\lambda = 0$ (critic)\n\n### Behavioral Cloning (BC) Auxiliary Loss\n$$\\mathcal{L}_{BC}(\\theta) = \\mathbb{E}_{s \\sim \\mathcal{B}_{BC}}\\left[D_{KL}(\\pi^*(s) \\| \\pi_\\theta(s))\\right]$$\n\n$$\\mathcal{B}_{BC} = \\{(s, \\pi^*(s)) : s \\in \\mathcal{S}_{BC}\\}$$\n\n**NetHack**: $\\lambda_{BC} = 2.0$, no decay; states from NLD-AA (8000 Human Monk games)  \n**RoboticSequence**: actor_coeff = 1, critic_coeff = 0  \n**Montezuma**: KL weight coefficient tuned (see Figure 13)\n\n### Kickstarting (KS) Auxiliary Loss\n$$\\mathcal{L}_{KS}(\\theta) = \\mathbb{E}_{s \\sim \\mathcal{B}_\\theta}\\left[D_{KL}(\\pi^*(s) \\| \\pi_\\theta(s))\\right]$$\n\nwhere $\\mathcal{B}_\\theta$ is the buffer of states gathered by the **current online policy** $\\pi_\\theta$.\n\n**NetHack**: $\\lambda_{KS} = 0.5 \\cdot (0.99998)^t$ where $t$ is the training step\n\n### Episodic Memory (EM)\n$$\\mathcal{B}_{replay} = \\mathcal{B}_{online} \\cup \\mathcal{B}_{EM}$$\n$$|\\mathcal{B}_{EM}| = 0.1 \\times |\\mathcal{B}_{replay}| = 10,000 \\text{ samples}$$\n\nSamples from $\\mathcal{B}_{EM}$ are protected (not overwritten during fine-tuning). SAC trains on mini-batches sampled from the combined buffer.\n\n### RoboticSequence Augmented Reward\n$$r'_t = \\beta \\cdot r_t \\cdot (T - t), \\quad \\beta = 1.5, \\quad T = 200$$\n\nApplied only when the episode ends with success; encourages early task completion.", "text": "### Total Training Objective\n$$\\mathcal{L}(\\theta) = \\mathcal{L}_{RL}(\\theta) + \\lambda \\cdot \\mathcal{L}_{retention}(\\theta)$$\n\nwhere $\\mathcal{L}_{RL}$ is the base RL loss (APPO/PPO/SAC objective) and $\\mathcal{L}_{retention}$ is one of four knowledge retention losses.\n\n### EWC Auxiliary Loss\n$$\\mathcal{L}_{EWC}(\\theta) = \\sum_i F^i (\\theta^{*i} - \\theta^i)^2$$\n\nwhere:\n- $\\theta^*$ = pre-trained weights (frozen)\n- $\\theta$ = current weights\n- $F^i$ = $i$-th diagonal element of Fisher Information Matrix\n- $F_{ii} = \\mathbb{E}\\left[\\left(\\frac{\\partial \\ell}{\\partial \\theta_i}\\right)^2\\right]$\n\n**NetHack**: $\\lambda = 2 \\times 10^6$, F estimated over 10,000 batches from NLD-AA  \n**RoboticSequence**: $\\lambda = 100$ (actor), $\\lambda = 0$ (critic)\n\n### Behavioral Cloning (BC) Auxiliary Loss\n$$\\mathcal{L}_{BC}(\\theta) = \\mathbb{E}_{s \\sim \\mathcal{B}_{BC}}\\left[D_{KL}(\\pi^*(s) \\| \\pi_\\theta(s))\\right]$$\n\n$$\\mathcal{B}_{BC} = \\{(s, \\pi^*(s)) : s \\in \\mathcal{S}_{BC}\\}$$\n\n**NetHack**: $\\lambda_{BC} = 2.0$, no decay; states from NLD-AA (8000 Human Monk games)  \n**RoboticSequence**: actor_coeff = 1, critic_coeff = 0  \n**Montezuma**: KL weight coefficient tuned (see Figure 13)\n\n### Kickstarting (KS) Auxiliary Loss\n$$\\mathcal{L}_{KS}(\\theta) = \\mathbb{E}_{s \\sim \\mathcal{B}_\\theta}\\left[D_{KL}(\\pi^*(s) \\| \\pi_\\theta(s))\\right]$$\n\nwhere $\\mathcal{B}_\\theta$ is the buffer of states gathered by the **current online policy** $\\pi_\\theta$.\n\n**NetHack**: $\\lambda_{KS} = 0.5 \\cdot (0.99998)^t$ where $t$ is the training step\n\n### Episodic Memory (EM)\n$$\\mathcal{B}_{replay} = \\mathcal{B}_{online} \\cup \\mathcal{B}_{EM}$$\n$$|\\mathcal{B}_{EM}| = 0.1 \\times |\\mathcal{B}_{replay}| = 10,000 \\text{ samples}$$\n\nSamples from $\\mathcal{B}_{EM}$ are protected (not overwritten during fine-tuning). SAC trains on mini-batches sampled from the combined buffer.\n\n### RoboticSequence Augmented Reward\n$$r'_t = \\beta \\cdot r_t \\cdot (T - t), \\quad \\beta = 1.5, \\quad T = 200$$\n\nApplied only when the episode ends with success; encourages early task completion.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Pseudocode", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Algorithm: Knowledge-Retention RL Fine-tuning\n\nInput: pre-trained policy π* (weights θ*), RL environment E,\n       retention method M ∈ {EWC, BC, KS, EM},\n       replay buffer B_BC from pre-training\n\n# Preprocessing (NetHack only)\nif environment == NetHack:\n    freeze all parameters except critic head\n    train critic head for 500M steps\n    unfreeze all parameters except encoders\n\n# Compute Fisher matrix (if M == EWC)\nif M == EWC:\n    F = compute_fisher(π*, training_data)\n    F = clip(F, min=1e-5)  # RoboticSequence only\n\n# Initialize fine-tuned policy\nθ ← θ*\n\n# Fine-tuning loop\nfor each training step t:\n    # Collect experience with current policy πθ\n    trajectories ← rollout(πθ, E)\n    \n    # Compute base RL loss\n    L_RL ← compute_rl_loss(trajectories)  # PPO/APPO/SAC loss\n    \n    # Compute retention loss\n    if M == EWC:\n        L_ret ← Σᵢ Fᵢ(θ*ᵢ - θᵢ)²\n    elif M == BC:\n        batch ← sample(B_BC)\n        L_ret ← E_{(s,a*)∈batch}[KL(π*(s) ‖ πθ(s))]\n        λ = λ_BC  # fixed coefficient (2.0 for NetHack, no decay)\n    elif M == KS:\n        λ_t = λ_KS * 0.99998^t  # exponential decay (NetHack)\n        L_ret ← E_{s∈trajectories}[KL(π*(s) ‖ πθ(s))]\n    elif M == EM:\n        # EM is implicit: B_replay contains B_EM (protected)\n        L_ret ← 0  # no explicit aux loss; handled by replay buffer\n    \n    # Total loss (actor only for L_ret)\n    L_total ← L_RL + λ · L_ret\n    \n    # Update parameters (actor + critic for L_RL; actor only for L_ret)\n    θ ← θ - α · ∇_θ L_total\n\nreturn πθ", "text": "```\nAlgorithm: Knowledge-Retention RL Fine-tuning\n\nInput: pre-trained policy π* (weights θ*), RL environment E,\n       retention method M ∈ {EWC, BC, KS, EM},\n       replay buffer B_BC from pre-training\n\n# Preprocessing (NetHack only)\nif environment == NetHack:\n    freeze all parameters except critic head\n    train critic head for 500M steps\n    unfreeze all parameters except encoders\n\n# Compute Fisher matrix (if M == EWC)\nif M == EWC:\n    F = compute_fisher(π*, training_data)\n    F = clip(F, min=1e-5)  # RoboticSequence only\n\n# Initialize fine-tuned policy\nθ ← θ*\n\n# Fine-tuning loop\nfor each training step t:\n    # Collect experience with current policy πθ\n    trajectories ← rollout(πθ, E)\n    \n    # Compute base RL loss\n    L_RL ← compute_rl_loss(trajectories)  # PPO/APPO/SAC loss\n    \n    # Compute retention loss\n    if M == EWC:\n        L_ret ← Σᵢ Fᵢ(θ*ᵢ - θᵢ)²\n    elif M == BC:\n        batch ← sample(B_BC)\n        L_ret ← E_{(s,a*)∈batch}[KL(π*(s) ‖ πθ(s))]\n        λ = λ_BC  # fixed coefficient (2.0 for NetHack, no decay)\n    elif M == KS:\n        λ_t = λ_KS * 0.99998^t  # exponential decay (NetHack)\n        L_ret ← E_{s∈trajectories}[KL(π*(s) ‖ πθ(s))]\n    elif M == EM:\n        # EM is implicit: B_replay contains B_EM (protected)\n        L_ret ← 0  # no explicit aux loss; handled by replay buffer\n    \n    # Total loss (actor only for L_ret)\n    L_total ← L_RL + λ · L_ret\n    \n    # Update parameters (actor + critic for L_RL; actor only for L_ret)\n    θ ← θ - α · ∇_θ L_total\n\nreturn πθ\n```", "warn": "", "refs": []}, {"sec_id": "", "heading": "Complexity Analysis", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "EWC", "value": "O(|θ|) extra memory for Fisher diagonal and θ*; O(|θ|) extra computation per step for regularization term"}, {"label": "BC", "value": "O(|B_BC|) extra memory; O(|batch|) extra forward passes per step through frozen π*"}, {"label": "KS", "value": "Same as BC but uses online data; no extra memory for buffer"}, {"label": "EM", "value": "O(|B_EM|) extra memory (10K samples ≈ 10% of replay buffer); no extra computation"}, {"label": "Training time (NetHack)", "value": ">500M environment steps per 24 hours on A100 GPU"}], "code": "", "text": "- **EWC**: O(|θ|) extra memory for Fisher diagonal and θ*; O(|θ|) extra computation per step for regularization term\n- **BC**: O(|B_BC|) extra memory; O(|batch|) extra forward passes per step through frozen π*\n- **KS**: Same as BC but uses online data; no extra memory for buffer\n- **EM**: O(|B_EM|) extra memory (10K samples ≈ 10% of replay buffer); no extra computation\n- **Training time (NetHack)**: >500M environment steps per 24 hours on A100 GPU", "warn": "", "refs": []}, {"sec_id": "", "heading": "RoboticSequence Algorithm (Sequential Task)", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Algorithm 1 (RoboticSequence):\nInput: list of N environments E_k, policy π, time limit T\nReturns: number of solved environments\n\ni = 1; t = 1  {initialize env index, timestep counter}\nwhile i ≤ N and t ≤ T do:\n    take step in E_i using π\n    if E_i is solved:\n        i = i + 1; t = 1  {move to next env, reset timestep}\nreturn i - 1", "text": "```\nAlgorithm 1 (RoboticSequence):\nInput: list of N environments E_k, policy π, time limit T\nReturns: number of solved environments\n\ni = 1; t = 1  {initialize env index, timestep counter}\nwhile i ≤ N and t ≤ T do:\n    take step in E_i using π\n    if E_i is solved:\n        i = i + 1; t = 1  {move to next env, reset timestep}\nreturn i - 1\n```", "warn": "", "refs": []}]}, {"file": "architecture.md", "role": "architecture", "file_title": "System Architecture: Knowledge-Retention-Augmented RL Fine-tuning", "sections": [{"sec_id": "", "heading": "Overview", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The system augments standard RL fine-tuning with an auxiliary retention loss applied only to the actor (policy) network. The architecture is modular: any base RL algorithm (APPO, PPO+RND, SAC) can be used, with the retention module added as an additional loss term.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component Graph", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "┌─────────────────────────────────────────────────────────────┐\n│                Pre-training Phase                            │\n│  ┌──────────────┐     Behavioral Cloning      ┌──────────┐  │\n│  │  Expert Data │ ─────────────────────────→  │  π* (θ*)  │  │\n│  │  (NLD-AA /   │                             │  Actor   │  │\n│  │  PPO agent / │                             │  Critic  │  │\n│  │  SAC agent)  │                             └──────────┘  │\n└─────────────────────────────────────────────────────────────┘\n                              │\n                         Initialize θ ← θ*\n                              │\n                              ▼\n┌─────────────────────────────────────────────────────────────┐\n│                Fine-tuning Phase                             │\n│                                                              │\n│  ┌─
