<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — ftrl</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — ftrl</h1>
  <p>Research DAG &middot; Fine-tuning Reinforcement Learning Models is Secretly a Forgetting Mitigation Problem</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "Why does fine-tuning RL models fail to leverage pre-trained knowledge?",
    "description": "RL fine-tuning is substantially less successful than in supervised learning. What is the structural cause, and can it be fixed with existing techniques?",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Toy 2-state MDP analysis of FPC",
        "result": "Both state coverage gap and imperfect cloning gap cause convergence to suboptimal policies even in 2-state MDPs; FPC is a fundamental property of gradient-based optimization on parametric policies",
        "evidence": [
          "Figure 9",
          "Appendix A",
          "§2"
        ],
        "children": [
          {
            "id": "N03",
            "type": "decision",
            "title": "Formalize two specific FPC instances: SCG and ICG",
            "choice": "Define State Coverage Gap (pre-trained on FAR only) and Imperfect Cloning Gap (perturbed expert with distribution shift) as the two primary FPC instances",
            "alternatives": [
              "Treat FPC as a single undifferentiated phenomenon without sub-typing",
              "Focus only on the distribution shift explanation without the function approximator interference perspective"
            ],
            "evidence": "Toy MDP analysis (N02) shows two distinct parameterization-driven failure modes",
            "children": [
              {
                "id": "N04",
                "type": "experiment",
                "title": "APPLERETRIEVAL gridworld: verify FPC with linear function approximators",
                "result": "Forgetting increases with M (distance to apple); c parameter controls |b|/|w| ratio governing interference; linear model exhibits FPC confirming it is not a deep learning artifact",
                "evidence": [
                  "Figure 10",
                  "Figure 11",
                  "Appendix A.2"
                ],
                "children": [
                  {
                    "id": "N05",
                    "type": "decision",
                    "title": "Apply continual learning knowledge retention methods to RL fine-tuning",
                    "choice": "Treat FPC as analogous to catastrophic forgetting in continual learning; directly apply EWC, BC, KS, and EM as mitigation methods",
                    "alternatives": [
                      "Design a new RL-specific retention method",
                      "Use curriculum learning to gradually expose FAR states",
                      "Use parameter isolation (Progressive Networks) to separate CLOSE and FAR representations"
                    ],
                    "evidence": "FPC behaves identically to task-switching forgetting in CL; standard CL methods are off-the-shelf solutions",
                    "children": [
                      {
                        "id": "N06",
                        "type": "experiment",
                        "title": "NetHack: Fine-tuning with EWC, BC, KS vs. vanilla FT",
                        "result": "KS achieves ~11K (2× prior SOTA of 5K); BC second best; EWC deteriorates after some training; vanilla FT collapses to ~1K average return",
                        "evidence": [
                          "C01",
                          "C03",
                          "C04",
                          "Figure 3a",
                          "Table 4",
                          "Table 5"
                        ],
                        "children": [
                          {
                            "id": "N07",
                            "type": "experiment",
                            "title": "NetHack per-level analysis: Level 4 and Sokoban",
                            "result": "KS and BC maintain/improve Level 4 performance; KS struggles on Sokoban (deep levels not visited online); BC maintains Sokoban score; vanilla FT forgets both; confirms imperfect cloning gap",
                            "evidence": [
                              "C03",
                              "C06",
                              "Figure 5",
                              "Figure 4",
                              "§5"
                            ],
                            "children": []
                          },
                          {
                            "id": "N08",
                            "type": "dead_end",
                            "title": "EWC on NetHack: performance deteriorates after initial improvement",
                            "hypothesis": "EWC would maintain performance on FAR states by preventing parameter change on Fisher-important weights",
                            "failure_mode": "EWC is too conservative, eventually preventing the policy from improving on the downstream task; the Fisher diagonal from offline BC data may not accurately reflect online RL importance",
                            "lesson": "EWC is not the best choice for NetHack; still outperforms vanilla FT but is dominated by KS and BC"
                          }
                        ]
                      },
                      {
                        "id": "N09",
                        "type": "experiment",
                        "title": "Montezuma's Revenge: FT with BC and EWC (state coverage gap)",
                        "result": "BC achieves highest return (~6000); EWC converges faster than vanilla FT but saturates lower; Room 7 success rate maintained by BC/EWC but drops sharply for vanilla FT at ~20M steps",
                        "evidence": [
                          "C01",
                          "C02",
                          "C04",
                          "Figure 3b",
                          "Figure 6",
                          "§4, §5"
                        ],
                        "children": [
                          {
                            "id": "N10",
                            "type": "dead_end",
                            "title": "Kickstarting fails on Montezuma's Revenge (state coverage gap)",
                            "hypothesis": "KS would maintain Room 7 performance because it prevents the policy from deviating from π*",
                            "failure_mode": "KS applies KL on CLOSE states (Rooms 1-6) where π* was never trained; forcing KL(π*(s_CLOSE) ‖ πθ(s_CLOSE)) corrupts CLOSE learning because π* has no meaningful distribution on CLOSE states",
                            "lesson": "KS fundamentally cannot be used for state coverage gap; BC is the right choice because it uses a static pre-training buffer that only contains FAR state examples"
                          }
                        ]
                      },
                      {
                        "id": "N11",
                        "type": "experiment",
                        "title": "RoboticSequence: FT with BC, EM, EWC on 4-stage robotic sequence",
                        "result": "BC achieves ~80% overall success; EM close second; EWC above vanilla FT; vanilla FT ≈ from scratch; FAR stages collapse to 0% success within 100K steps under vanilla FT",
                        "evidence": [
                          "C01",
                          "C02",
                          "C04",
                          "Figure 3c",
                          "Figure 7",
                          "Figure 8",
                          "§4, §5"
                        ],
                        "also_depends_on": [
                          "N03"
                        ],
                        "children": [
                          {
                            "id": "N12",
                            "type": "experiment",
                            "title": "Log-likelihood and PCA analysis: irreversibility of forgetting",
                            "result": "Log-likelihood of pre-trained expert trajectories collapses at 100K steps (success → 0%); even after re-learning at ~4M steps (success >80%), log-likelihoods don't recover to original values; policy is qualitatively different after fine-tuning",
                            "evidence": [
                              "C06",
                              "Figure 8",
                              "Figure 20",
                              "Appendix F"
                            ],
                            "children": []
                          },
                          {
                            "id": "N13",
                            "type": "dead_end",
                            "title": "Kickstarting fails on RoboticSequence (state coverage gap)",
                            "hypothesis": "KS would help maintain FAR stage performance while learning hammer/push",
                            "failure_mode": "Same failure mode as Montezuma's Revenge: KS forces KL on CLOSE states (hammer, push) where π* was only pre-trained on FAR stages; impossible to compute meaningful KL",
                            "lesson": "KS is strictly limited to imperfect cloning gap scenarios; documentation of this limitation is a key contribution of the paper"
                          }
                        ]
                      },
                      {
                        "id": "N14",
                        "type": "decision",
                        "title": "Method recommendation: use BC as default, KS for imperfect cloning gap",
                        "choice": "BC is the robust default; KS for imperfect cloning gap (NetHack); EM when off-policy algorithm available; EWC as computationally cheapest fallback",
                        "alternatives": [
                          "Always use BC regardless of FPC type",
                          "Use EWC as the universal default (cheapest)",
                          "Design an automatic FPC-type detector to switch methods"
                        ],
                        "evidence": "Empirical results across 3 environments; theoretical analysis of KS failure mode on SCG (N10, N13)",
                        "children": []
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
