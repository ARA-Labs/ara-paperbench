<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARA Trajectory</title>
<!--
  ARA Trajectory Viewer — canonical self-contained scaffold for the `research-visualizer` skill.

  HOW THE SKILL USES THIS FILE
  ----------------------------
  The rendering logic below is FIXED. The agent does NOT rewrite it. The agent only:
    1. Parses the ARA into one ARA_DATA object (schema in references/binding.md).
    2. base64-inlines every referenced figure .png into node.result.figures[].img.
    3. Replaces ONLY the JSON between the BEGIN/END markers in the <script id="ara-data"> block.
    4. Writes the result to <ara>/trajectory.html (or --output).
  Everything is inline (no CDN, no fetch, no server) so the output is one portable file.

  INJECTION CONTRACT
  ------------------
  - Replace exactly the lines between  __ARA_DATA_BEGIN__  and  __ARA_DATA_END__.
  - The payload MUST be valid JSON (it is read with JSON.parse).
  - JSON must not contain the literal substring "</script>"; escape any "<" in inlined
    markdown/text as "<" to be safe.
  - The demo payload shipped here renders a 3-node sample so the bare template opens and
    shows every node state (experiment, dead_end, isolated). The skill overwrites it.
-->
<style>
  /* Research Visualizer — "field notebook of a machine scientist".
     Cool archival vellum + ink; monospace is the machine-readout voice for
     structure / IDs / data, a humanist serif carries the reasoning prose. The
     signature is a traced trajectory spine that forks at branches and is struck
     through at dead ends. Type is read from glyph + label; colour is reserved
     for true epistemic status (teal = chrome, green = supported, amber =
     tentative, clay-red = dead end) — never decoration. */
  :root{
    /* paper & ink — deliberately cool vellum, NOT warm cream */
    --bg:#e9ece4; --panel:#f4f6f0; --panel2:#e3e7dd; --line:#ccd3c7; --ink:#1b2420;
    --muted:#67726a; --faint:#8a948b; --accent:#0e6b62; --accent-ink:#0a4f48; --chip:#e6eae0;
    --ok:#3a6a39; --warn:#a6402c; --tentative:#8a6310; --glyph-bg:#e0e5da; --glyph-ink:#4a544c;
    --sel-bg:#e3ede7; --code-bg:#eaeee6; --reason-bg:#f4f6f0;
    --iso-line:#b7c0ae; --iso-bg:#e5eadf; --iso-ink:#5f6b58;
    --scrim:rgba(20,28,24,.42); --shadow:rgba(20,28,24,.16);
    --add-bg:#e0ebdb; --add-ink:#2f5a2e; --del-bg:#f1e0da; --del-ink:#8c3623; --hunk:#67726a;
    --spine:#c3ccbd; --grid:rgba(27,36,32,.05);
    /* legacy type vars retained so any leftover hooks resolve */
    --q:var(--glyph-bg); --exp:var(--glyph-bg); --dec:var(--glyph-bg); --piv:var(--glyph-bg); --ins:var(--glyph-bg); --def:var(--glyph-bg); --dead:var(--warn);
    /* type roles: a serif reads the prose, monospace reads the machine */
    --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  code,pre,.mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* ---- masthead ---- */
  header{padding:20px 24px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .title{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.012em}
  header .sub{font-family:var(--mono);color:var(--muted);font-size:11.5px;margin-top:5px;letter-spacing:.01em}
  header details{margin-top:10px;color:var(--ink)}
  header summary{cursor:pointer;color:var(--accent-ink);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .toolbar input[type=search],.toolbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--sans)}
  .toolbar input[type=search]{min-width:230px}
  .toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--accent);outline:none}
  .toolbar label{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:var(--mono);cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .spacer{flex:1}
  .count{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-left:10px;border-left:1px solid var(--line)}

  main{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:calc(100% - 0px);min-height:0}
  #map{overflow:auto;border-right:1px solid var(--line);padding:18px 12px 56px;background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;background-position:-1px -1px}
  #detail{overflow:auto;padding:26px 32px 80px;background:var(--bg)}

  /* ---- process map: the trajectory spine is the signature ---- */
  .node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--sel-bg);border-color:var(--accent)}
  .node.deptarget{background:var(--sel-bg);outline:1px dashed var(--accent);outline-offset:-1px}
  .node.dim{opacity:.32}
  .node .glyph{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);margin-top:1px}
  .node.sel .glyph{border-color:var(--accent);color:var(--accent-ink)}
  .node .nid{color:var(--muted);font-size:10.5px;font-family:var(--mono);letter-spacing:.02em}
  .node .ntitle{font-size:13px;line-height:1.45}
  .node.dead .ntitle{color:var(--warn);text-decoration:line-through;text-decoration-color:rgba(166,64,44,.45)}
  .node .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  /* the spine + branch connectors: nested steps trace back to their parent */
  .kid{margin-left:19px;border-left:2px solid var(--spine);padding-left:14px}
  .kid>.node::before{content:"";position:absolute;left:-14px;top:14px;width:10px;height:2px;background:var(--spine)}
  .kid>.node.sel::before{background:var(--accent)}
  .isobox{border:1px dashed var(--iso-line);border-radius:8px;margin:12px 2px;padding:6px 4px;background:var(--iso-bg)}
  .isobox .isohdr{color:var(--iso-ink);font-family:var(--mono);font-size:10px;padding:3px 8px 7px;text-transform:uppercase;letter-spacing:.1em}
  .dep{color:var(--muted);font-size:10px;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .glyph.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}

  /* ---- detail pane ---- */
  .dhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;padding:3px 9px;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
  .badge.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}
  .pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pill.explicit{border-color:var(--ok);color:var(--ok)} .pill.inferred{border-color:var(--tentative);color:var(--tentative)}
  .pill.iso{border-color:var(--iso-line);color:var(--iso-ink)}
  .dtitle{font-family:var(--serif);font-size:25px;font-weight:600;margin:12px 0 6px;letter-spacing:-.012em;line-height:1.28}
  .did{color:var(--muted);font-family:var(--mono);font-size:11.5px}

  .block{border:1px solid var(--line);border-radius:7px;margin:15px 0;background:var(--panel)}
  .block>summary{cursor:pointer;padding:11px 15px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .block>summary::-webkit-details-marker{display:none}
  .block>summary:hover{color:var(--accent-ink)}
  .block>summary .tag{margin-left:auto;color:var(--faint);font-size:10.5px;font-weight:400;font-family:var(--mono);text-transform:none;letter-spacing:0}
  .block .body{padding:4px 16px 16px}
  /* the primary reasoning block: the agent's thinking, set as typeset prose */
  .block.reason{border-left:3px solid var(--accent);background:var(--reason-bg)}
  .block.reason>summary{color:var(--accent-ink)}
  .block.reason .lead{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink)}
  .didwhat{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;margin:16px 0 4px}
  .lead{font-family:var(--serif);color:#2a322c;font-size:16px;line-height:1.7}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;color:#46504a;font-family:var(--mono)}
  .chip.ext{color:var(--muted)}

  .claim{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .claim h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .claim .kv{font-size:13px;line-height:1.6;margin:4px 0;color:#3a423c}
  .claim .kv b{color:var(--muted);font-weight:600;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .status{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 7px;border:1px solid var(--line)}
  .status.supported{color:var(--ok);border-color:var(--ok)}
  .status.refuted{color:var(--warn);border-color:var(--warn)}
  .status.hypothesis{color:var(--tentative);border-color:var(--tentative)}
  .prov{font-size:11px;color:var(--iso-ink);font-family:var(--mono)}

  .quote{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13.5px;line-height:1.6;color:#2a322c}
  .quote .ref{color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:5px}
  figure{margin:14px 0}
  figure img{max-width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:6px}
  figcaption{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:7px}

  table.md{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;margin:10px 0}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  table.md th{background:var(--panel2);color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
  pre.snip{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;font-size:12px;color:var(--ink);white-space:pre-wrap}

  .ptr{font-size:13px;margin:7px 0}
  .ptr .path{font-family:var(--mono);color:#46504a}
  .truncated{color:var(--muted);font-size:11.5px;font-style:italic}
  .empty{color:var(--muted);font-size:13px}
  .none{color:var(--muted);padding:40px 24px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px}

  /* ---- enrichment layers (all inert unless the data is present) ---- */
  .layerbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lbtn .cnt{color:var(--muted);font-size:10.5px}
  .chiplabel{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 3px}
  .chip.jump{cursor:pointer}
  .chip.jump:hover{border-color:var(--accent);color:var(--accent-ink)}
  .chip.dangle{color:#9aa49b;text-decoration:line-through;cursor:not-allowed}
  .chip.infer{border-style:dashed}
  .chip-built{border-color:var(--ok);color:var(--ok)}
  .chip-rej{border-color:var(--warn);color:var(--warn)}
  .chip-recipe{border-color:var(--accent);color:var(--accent-ink)}
  .nmark{color:var(--muted);font-size:10px;margin-left:5px;font-family:var(--mono)}
  .rel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 8px;color:var(--glyph-ink);background:var(--glyph-bg);font-weight:700}
  .rel.bounds,.rel.refutes{background:var(--warn);color:#fff}
  .rel.neutral{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .ribbon{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;color:#3a423c;font-size:13px;line-height:1.6}
  .warn{border-left:3px solid var(--warn);background:var(--del-bg);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13px;line-height:1.6}
  .muted{color:var(--muted);font-size:11.5px}
  .math{font-family:var(--serif);font-style:italic}
  .gterm{border-bottom:1px dashed var(--accent);cursor:help}
  #gpop{position:fixed;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;z-index:60;box-shadow:0 8px 28px var(--shadow);font-size:13px;line-height:1.55;display:none}
  #gpop h5{margin:0 0 5px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  #gpop .gp-open{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:11px;margin-top:7px;display:inline-block}
  .ov{position:fixed;inset:0;z-index:50}
  .ov[hidden]{display:none}
  .ov-scrim{position:absolute;inset:0;background:var(--scrim)}
  .ov-sheet{position:relative;margin:5vh auto;max-width:920px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 48px var(--shadow)}
  .ov-head{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1}
  .ov-head #ov-title{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
  .ov-head input[type=search]{flex:1;max-width:260px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:13px}
  .ov-body{padding:10px 17px 26px}
  .ov-body .spacer{flex:1}
  .card{border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .card .sub{color:var(--muted);font-family:var(--mono);font-size:10.5px}
  .grey{opacity:.5}

  /* responsive: stack the two panes on a narrow screen */
  @media (max-width:720px){
    main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
    #map{border-right:none;border-bottom:1px solid var(--line)}
    #detail{padding:20px 18px 64px}
    .dtitle{font-size:21px}
  }
  /* honour reduced-motion */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="title" id="h-title">ARA Trajectory</h1>
  <div class="sub" id="h-sub"></div>
  <details id="h-abstract-wrap"><summary>Abstract</summary><div class="lead" id="h-abstract"></div></details>
  <div class="toolbar">
    <input type="search" id="q" placeholder="search steps…" autocomplete="off" />
    <label>type
      <select id="ftype"><option value="">all</option></select>
    </label>
    <label><input type="checkbox" id="fdead" /> dead ends only</label>
    <span class="spacer"></span>
    <button class="btn" id="rprev" title="previous (←)">‹</button>
    <button class="btn primary" id="rplay">▶ Replay</button>
    <button class="btn" id="rnext" title="next (→)">›</button>
    <span class="count" id="rstat"></span>
  </div>
  <div class="layerbar" id="layerbar">
    <button class="btn lbtn" data-panel="context" hidden>◧ Context</button>
    <button class="btn lbtn" data-panel="glossary" hidden>▤ Glossary <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="dependencies" hidden>⇄ Dependencies <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="recipes" hidden>▦ Recipes <span class="cnt"></span></button>
  </div>
</header>

<main>
  <aside id="map"></aside>
  <section id="detail"><div class="none">Select a step on the left, or press <kbd>▶ Replay</kbd>.</div></section>
</main>

<!-- v1.1: one shared modal overlay for the Context/Glossary/Dependencies/Recipes panels, + a glossary popover. Both inert unless their data is present. -->
<div id="overlay" class="ov" hidden role="dialog" aria-modal="true">
  <div class="ov-scrim" data-close></div>
  <div class="ov-sheet">
    <div class="ov-head"><span id="ov-title"></span>
      <input type="search" id="ov-q" placeholder="filter…" hidden autocomplete="off" />
      <span class="spacer"></span>
      <button class="btn" id="ov-close" data-close>✕ <kbd>Esc</kbd></button>
    </div>
    <div class="ov-body" id="ov-body"></div>
  </div>
</div>
<div id="gpop"></div>

<!-- The skill replaces ONLY the JSON between the two markers below. -->
<script id="ara-data" type="application/json">
/* __ARA_DATA_BEGIN__ */
{"meta": {"title": "LCA-on-the-Line: Benchmarking Out-of-Distribution Generalization with Class Taxonomies", "authors": ["Jia Shi", "Gautam Gare", "Jinjin Tian", "Siqi Chai", "Zhiqiu Lin", "Arun Vasudevan", "Di Feng", "Francesco Ferroni", "Shu Kong"], "year": "2024", "venue": "ICML 2024 (Proceedings of the 41st International Conference on Machine Learning)", "ara_dir": "lca-on-the-line", "abstract": "We tackle the challenge of predicting models' Out-of-Distribution (OOD) performance using in-distribution (ID) measurements without requiring OOD data. Existing evaluations with \"Effective Robustness\", which use ID accuracy as an indicator of OOD accuracy, encounter limitations when models are trained with diverse supervision and distributions, such as class labels (Vision Models, VMs, on ImageNet) and textual descriptions (Visual-Language Models, VLMs, on LAION). VLMs often generalize better to OOD data than VMs despite having similar or lower ID performance. To improve the prediction of models' OOD performance from ID measurements, we introduce the Lowest Common Ancestor (LCA)-on-the-Line framework. This approach revisits the established concept of LCA distance, which measures the hierarchical distance between labels and predictions within a predefined class hierarchy, such as WordNet. We assess 75 models using ImageNet as the ID dataset and five significantly shifted OOD variants, uncovering a strong linear correlation between ID LCA distance and OOD top-1 accuracy. Our method provides a compelling alternative for understanding why VLMs tend to generalize better. Additionally, we propose a technique to construct a taxonomic hierarchy on any dataset using K-means clustering, demonstrating that LCA distance is robust to the constructed taxonomic hierarchy. Moreover, we demonstrate that aligning model predictions with class taxonomies, through soft labels or prompt engineering, can enhance model generalization."}, "order": ["N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10", "N11", "N12", "N13"], "nodes": [{"id": "N01", "type": "question", "parent": null, "title": "How can we predict OOD performance from ID measurements for both VMs and VLMs?", "body": "The core research question: existing Accuracy-on-the-Line works within each model family but fails to unify Vision Models (VMs) and Vision-Language Models (VLMs). Can we find a single ID metric that predicts OOD performance for both?", "thinking": "This project sets out to answer a basic evaluation question: once you know how a model performs on data it was trained for, can you predict how it will perform on data it has never seen, and can one single rule do this for both ordinary vision classifiers trained on labeled images and vision-language models trained on image-caption pairs? Prior \"accuracy predicts accuracy\" recipes worked inside a single model family but broke down the moment vision models and vision-language models were compared side by side, so the open question driving the whole investigation is whether a different in-distribution measurement could unify both families under one predictive line.", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": [], "built_on": [], "rejected_here": [], "recipe_refs": []}, {"id": "N02", "type": "experiment", "parent": "N01", "title": "Test Accuracy-on-the-Line across VM and VLM families", "body": "ID Top-1 accuracy produces two separate linear trends (one for VMs, one for VLMs). VLMs achieve higher OOD accuracy than their ID accuracy predicts — the 'effective robustness' gap. R² drops to ~0 for ImageNet-A across combined modalities.", "thinking": "The first move was to test whether the standard recipe, using in-distribution Top-1 accuracy to predict out-of-distribution accuracy, actually holds once vision models and vision-language models are pooled together. It does not: plotting ID accuracy against OOD accuracy produces two separate trend lines instead of one, and the correlation nearly disappears (R² near zero) on the hardest shift, ImageNet-A. Vision-language models systematically beat what their ID accuracy would predict, the so-called \"effective robustness\" gap, showing that accuracy alone is blind to whatever it is that lets these models generalize better.", "isolated": false, "depends_on": [], "source_refs": [], "why": [{"id": "C01", "title": "LCA-on-the-Line — ID LCA distance linearly predicts OOD accuracy across VMs and VLMs", "statement": "The in-distribution LCA distance (using information content) on ImageNet strongly and linearly correlates with OOD Top-1 accuracy for both VMs and VLMs combined (R²>0.7, PEA>0.7) on all four severely shifted OOD datasets (ImageNet-S, ImageNet-R, ImageNet-A, ObjectNet), while in-distribution Top-1 accuracy fails to unify both families (R²≈0 on ImageNet-A for all 75 models combined).", "status": "supported", "falsification": "If the Pearson correlation (|PEA|) between ID LCA distance and OOD Top-1 accuracy falls below 0.7 for any of the four severely shifted OOD datasets when evaluated on 75 mixed VM+VLM models, or if ID Top-1 accuracy shows comparable or higher correlation than LCA on those same datasets, this claim is refuted.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [{"id": "Table 2", "caption": "Correlation measurement by R² and PEA of ID LCA/Top1 with OOD Top1/Top5 across 75 models (36 VMs and 39 VLMs) as shown in Figure 5. We demonstrate that LCA has a strong correlation with OOD performance on all listed datasets (except ImageNet-v2). We take the absolute value of all correlations for simplicity. Full table containing results of VMs-only and VLMs-only in Table 11. Measurements from the KEN and SPE show a similar trend as seen in Section F.", "markdown": "| Element | OOD | ImgN-v2 R² | ImgN-v2 PEA | ImgN-S R² | ImgN-S PEA | ImgN-R R² | ImgN-R PEA | ImgN-A R² | ImgN-A PEA | ObjNet R² | ObjNet PEA |\n|---------|-----|------------|------------|----------|----------|----------|----------|----------|----------|----------|----------|\n| Top1 | Top1 | 0.962 | 0.980 | 0.075 | 0.275 | 0.020 | 0.140 | 0.009 | 0.094 | 0.273 | 0.522 |\n| LCA | Top1 | 0.339 | 0.582 | 0.816 | 0.903 | 0.779 | 0.883 | 0.704 | 0.839 | 0.915 | 0.956 |\n| Top1 | Top5 | 0.889 | 0.943 | 0.052 | 0.229 | 0.004 | 0.060 | 0.013 | 0.115 | 0.262 | 0.512 |\n| LCA | Top5 | 0.445 | 0.667 | 0.811 | 0.901 | 0.738 | 0.859 | 0.799 | 0.894 | 0.924 | 0.961 |"}, {"id": "Figure 5", "caption": "Correlating OOD Top-1/Top-5 accuracy (VM+VLM, 75 models) on 4 ImageNet-OOD datasets visualizing Table 2. The plots clearly demonstrate that the in-distribution LCA distance has a stronger correlation with the model's OOD performance across all OOD datasets than accuracy-on-the-line. Each plot's x-axis represents the OOD dataset metric and y-axis represents ImageNet ID test Top-1 accuracy (left) and LCA (right); Red line (Pink dots: VMs and Red dots: VLMs) represents in-distribution classification accuracy (Top-1); Green line (Green dots: VMs and Blue dots: VLMs) denotes in-distribution taxonomic distance (LCA).", "markdown": "Panel layout: 8 panels (2 rows × 4 columns). Row 1 (OOD Top-1 on X-axis): ImageNet-S, ImageNet-R, ImageNet-A, ObjectNet. Row 2 (OOD Top-5 on X-axis): ImageNet-S, ImageNet-R, ImageNet-A, ObjectNet. For each panel: Y-axis = ImageNet ID Top-1 (red line) OR ImageNet ID LCA (green line).\n\n**Quantitative Summary (from Table 2) — OOD Top-1 Panels**\n\n| OOD Dataset | ID Top-1 R² | ID Top-1 PEA | ID LCA R² | ID LCA PEA |\n|------------|------------|-------------|----------|-----------|\n| ImageNet-S | 0.075 | 0.275 | 0.816 | 0.903 |\n| ImageNet-R | 0.020 | 0.140 | 0.779 | 0.883 |\n| ImageNet-A | 0.009 | 0.094 | 0.704 | 0.839 |\n| ObjectNet | 0.273 | 0.522 | 0.915 | 0.956 |\n\n**OOD Top-5 Panels**\n\n| OOD Dataset | ID Top-1 R² | ID Top-1 PEA | ID LCA R² | ID LCA PEA |\n|------------|------------|-------------|----------|-----------|\n| ImageNet-S | 0.052 | 0.229 | 0.811 | 0.901 |\n| ImageNet-R | 0.004 | 0.060 | 0.738 | 0.859 |\n| ImageNet-A | 0.013 | 0.115 | 0.799 | 0.894 |\n| ObjectNet | 0.262 | 0.512 | 0.924 | 0.961 |\n\n(Exact per-model scatter plot coordinates for all 75 models are not tabulated in paper. The figure shows qualitative clustering of VM (pink/green dots) vs. VLM (red/blue dots) populations.)"}], "data": []}, "verified_by": [{"id": "E01", "title": "LCA-on-the-Line Correlation Study", "setup": "Model: 75 pretrained models (36 VMs: AlexNet, ConvNeXt, DenseNet variants, EfficientNet, GoogLeNet, InceptionV3, MnasNet variants, MobileNetV3, RegNet, WideResNet, ResNet variants, ShuffleNet, SqueezeNet, Swin-B, VGG variants, ViT-B/L; 39 VLMs: ALBEF, BLIP, CLIP variants (RN50/101/50x4/ViT-B-32/B-16/L-14/L-14-336px), OpenCLIP variants (31 models)). Hardware: Standard GPU inference (no specific hardware requirement for evaluation). Dataset: ImageNet (ID), ImageNet-v2, ImageNet-Sketch, ImageNet-Rendition, ImageNet-Adversarial, ObjectNet (OOD). System: WordNet hierarchy for LCA computation; information content scoring.", "metrics": "R² (coefficient of determination), PEA (Pearson correlation coefficient), across all 75 models combined, VMs only, and VLMs only"}], "artifact": [{"name": "model.md", "pointer": "src/configs/model.md", "what": "Model roster: 36 Vision Models (torchvision) and 39 Vision-Language Models (CLIP/OpenCLIP) evaluated in this step."}], "concepts": ["Effective Robustness", "LCA Distance"], "built_on": [{"rw_id": "RW01", "name": "Miller et al., 2021 (Accuracy-on-the-Line)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Baek et al., 2022 (Agreement-on-the-Line)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Taori et al., 2020 (Effective Robustness)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Bertinetto et al., 2020 (Making Better Mistakes)", "relation_raw": "imports"}, {"rw_id": "RW05", "name": "Valmadre, 2022 (Hierarchical classification at multiple operating points)", "relation_raw": "imports"}, {"rw_id": "RW06", "name": "Deng et al., 2009 (ImageNet)", "relation_raw": "imports"}, {"rw_id": "RW07", "name": "Radford et al., 2021 (CLIP)", "relation_raw": "baseline"}, {"rw_id": "RW08", "name": "Cherti et al., 2023 (OpenCLIP Scaling Laws)", "relation_raw": "baseline"}, {"rw_id": "RW12", "name": "Hendrycks et al., 2021 (ImageNet-R/A)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW11", "name": "Fang et al., 2022 (Data diversity in CLIP)", "relation_raw": "bounds"}], "recipe_refs": []}, {"id": "N03", "type": "dead_end", "parent": "N02", "title": "Use multiple ID test sets (Shi et al., 2023) to bridge the VM/VLM gap", "body": "Hypothesis: Evaluating on multiple ID test sets would provide a more stable predictor that works across modalities. Failure mode: Requires multiple evaluation runs; not a single unified measurement. Computationally expensive. Does not capture why VLMs generalize better in a mechanistic sense. Lesson: Need a single ID metric that captures intrinsic model property — quality of feature alignment — rather than just accuracy on multiple datasets.", "thinking": "One natural fix was to stop relying on a single ID measurement and instead evaluate models across several different in-distribution test sets, hoping that pattern would transfer to unseen data. This was abandoned: it requires running many separate evaluations rather than producing one clean measurement, it is computationally expensive, and, most importantly, it never explains why vision-language models generalize better in the first place, it just re-measures the same symptom from more angles. The lesson carried forward was to look for one intrinsic property of a model, not more accuracy readings.", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": [], "built_on": [], "rejected_here": [], "recipe_refs": []}, {"id": "N04", "type": "question", "parent": "N02", "title": "What property of models actually correlates with OOD generalization across modalities?", "body": "If Top-1 accuracy fails, what does distinguish good generalizers (VLMs) from poor generalizers (VMs with similar ID accuracy)?", "thinking": "If raw accuracy cannot tell VLMs and VMs apart, the question becomes what actually separates the models that generalize well from the models that do not, given that they can look identical on ID accuracy alone.", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": [], "built_on": [], "rejected_here": [], "recipe_refs": []}, {"id": "N05", "type": "experiment", "parent": "N04", "title": "Revisit LCA distance as a measure of misprediction quality", "body": "LCA distance measured on ID data strongly correlates with OOD accuracy for BOTH VMs and VLMs — a single linear trend. R²>0.7, PEA>0.7 on 4/5 OOD datasets. VLMs have systematically lower LCA distance (better mistakes) than VMs with similar ID accuracy.", "thinking": "Returning to an older, largely abandoned idea, the LCA (lowest common ancestor) distance, which scores how semantically far a wrong prediction is from the truth in a class hierarchy, rather than just whether the prediction is right or wrong. Measuring this on in-distribution data turns out to unify both model families into a single linear trend against OOD accuracy, with correlations above 0.7 on four of five shifted datasets. Critically, vision-language models have systematically lower LCA distance than vision models of similar ID accuracy, meaning they make \"better mistakes\", predicting semantically closer wrong classes rather than wildly incorrect ones, and this pattern is exactly what raw accuracy could not see.", "isolated": false, "depends_on": [], "source_refs": [], "why": [{"id": "C01", "title": "LCA-on-the-Line — ID LCA distance linearly predicts OOD accuracy across VMs and VLMs", "statement": "The in-distribution LCA distance (using information content) on ImageNet strongly and linearly correlates with OOD Top-1 accuracy for both VMs and VLMs combined (R²>0.7, PEA>0.7) on all four severely shifted OOD datasets (ImageNet-S, ImageNet-R, ImageNet-A, ObjectNet), while in-distribution Top-1 accuracy fails to unify both families (R²≈0 on ImageNet-A for all 75 models combined).", "status": "supported", "falsification": "If the Pearson correlation (|PEA|) between ID LCA distance and OOD Top-1 accuracy falls below 0.7 for any of the four severely shifted OOD datasets when evaluated on 75 mixed VM+VLM models, or if ID Top-1 accuracy shows comparable or higher correlation than LCA on those same datasets, this claim is refuted.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [{"id": "Table 2 (alt)", "caption": "Correlation measurement by R² and PEA of ID LCA/Top1 with OOD Top1/Top5 across 75 models (36 VMs and 39 VLMs) as shown in Figure 5. We demonstrate that LCA has a strong correlation with OOD performance on all listed datasets (except ImageNet-v2). We take the absolute value of all correlations for simplicity. Full table containing results of VMs-only and VLMs-only in Table 11.", "markdown": "| Element (ID → OOD) | ImgN-v2 R² | ImgN-v2 PEA | ImgN-S R² | ImgN-S PEA | ImgN-R R² | ImgN-R PEA | ImgN-A R² | ImgN-A PEA | ObjNet R² | ObjNet PEA |\n|-------------------|-----------|------------|----------|-----------|----------|-----------|----------|-----------|----------|-----------|\n| Top1 → Top1 | 0.962 | 0.980 | 0.075 | 0.275 | 0.020 | 0.140 | 0.009 | 0.094 | 0.273 | 0.522 |\n| LCA → Top1 | 0.339 | 0.582 | 0.816 | 0.903 | 0.779 | 0.883 | 0.704 | 0.839 | 0.915 | 0.956 |\n| Top1 → Top5 | 0.889 | 0.943 | 0.052 | 0.229 | 0.004 | 0.060 | 0.013 | 0.115 | 0.262 | 0.512 |\n| LCA → Top5 | 0.445 | 0.667 | 0.811 | 0.901 | 0.738 | 0.859 | 0.799 | 0.894 | 0.924 | 0.961 |"}, {"id": "Figure 1", "caption": "Correlation between LCA distance and out-of-distribution (OOD) performance in Vision and Vision-Language Models (VLMs). In both panels, the X-axis represents the top-1 accuracy on ObjectNet (OOD test dataset). The Y-axes depict the top-1 accuracy (left-axis) and LCA distance (right-axis) on ImageNet (ID test dataset). The left plot reveals a divergent trend where Vision Models (VMs) show a trade-off between OOD and ID accuracy, while VLMs tend to maintain higher OOD accuracy regardless of ID performance. The right plot demonstrates a unified, strong positive correlation between LCA distance and OOD accuracy for both VMs and VLMs.", "markdown": "Axis labels: X-axis (both panels) = ImageNet-ObjectNet Top-1 OOD accuracy; Y-axis (left panel) = ImageNet ID Top-1 accuracy; Y-axis (right panel) = ImageNet ID LCA distance.\n\n**Left Panel (Accuracy-on-the-Line, two separate trends)** — scatter plot showing two distinct linear trends (one for VMs, one for VLMs) when plotting ImageNet ID Top-1 accuracy vs ObjectNet OOD Top-1 accuracy. Exact scatter coordinates not tabulated in paper; representative points from Table 1:\n\n| Model | ObjectNet Top1 (OOD) | ImageNet Top1 (ID) | Family |\n|-------|---------------------|-------------------|--------|\n| ResNet18 | 0.272 | 0.698 | VM |\n| ResNet50 | 0.316 | 0.733 | VM |\n| CLIP_RN50 | 0.398 | 0.579 | VLM |\n| CLIP_RN50x4 | 0.504 | 0.641 | VLM |\n\nKey observation: VLMs (right cluster) achieve higher ObjectNet accuracy than VMs with similar or higher ImageNet accuracy → two divergent trends.\n\n**Right Panel (LCA-on-the-Line, unified single trend)** — scatter plot showing a single unified downward-sloping linear trend when plotting ImageNet ID LCA distance vs ObjectNet OOD Top-1 accuracy. Representative points from Table 1:\n\n| Model | ObjectNet Top1 (OOD) | ImageNet LCA distance (ID) | Family |\n|-------|---------------------|--------------------------|--------|\n| ResNet18 | 0.272 | 6.643 | VM |\n| ResNet50 | 0.316 | 6.539 | VM |\n| CLIP_RN50 | 0.398 | 6.327 | VLM |\n| CLIP_RN50x4 | 0.504 | 6.166 | VLM |\n\nKey observation: All 75 models (VMs and VLMs) fall on a single negative-slope line — lower LCA distance (better mistakes) → higher OOD accuracy. R²=0.915, PEA=0.956 (from Table 2, ObjNet column)."}, {"id": "Figure 1 (alt)", "caption": "Correlation between LCA distance and out-of-distribution (OOD) performance in Vision and Vision-Language Models (VLMs). In both panels, the X-axis represents the top-1 accuracy on ObjectNet (OOD test dataset). The Y-axes depict the top-1 accuracy (left-axis) and LCA distance (right-axis) on ImageNet (ID test dataset). The left plot reveals a divergent trend where Vision Models (VMs) show a trade-off between OOD and ID accuracy, while VLMs tend to maintain higher OOD accuracy regardless of ID performance. The right plot demonstrates a unified, strong positive correlation between LCA distance and OOD accuracy.", "markdown": "Axis labels: X-axis = ObjectNet Top-1 accuracy; Left Y-axis = ImageNet Top-1 accuracy; Right Y-axis = ImageNet LCA distance.\n\nKey observations: Left panel (ID Top-1 vs. OOD) — VMs form one linear cluster (positive slope); VLMs form a separate cluster above and to the right (higher OOD at similar or lower ID accuracy), two separate trends. Right panel (ID LCA vs. OOD) — both VMs and VLMs align on a single negative-slope line (lower LCA = higher OOD accuracy), a unified trend.\n\n**Extracted Data Points (Table 1 models, ObjectNet OOD axis)**\n\n| Model | Family | ObjectNet Top1 (X) | ImageNet Top1 (Y_left) | ImageNet LCA (Y_right) |\n|-------|--------|--------------------|------------------------|------------------------|\n| ResNet18 | VM | 0.272 | 0.698 | 6.643 |\n| ResNet50 | VM | 0.316 | 0.733 | 6.539 |\n| CLIP_RN50 | VLM | 0.398 | 0.579 | 6.327 |\n| CLIP_RN50x4 | VLM | 0.504 | 0.641 | 6.166 |\n\n(Full 75-model scatter plot Robustness)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Bertinetto et al., 2020 (Making Better Mistakes)", "relation_raw": "imports"}, {"rw_id": "RW05", "name": "Valmadre, 2022 (Hierarchical classification at multiple operating points)", "relation_raw": "imports"}, {"rw_id": "RW06", "name": "Deng et al., 2009 (ImageNet)", "relation_raw": "imports"}, {"rw_id": "RW07", "name": "Radford et al., 2021 (CLIP)", "relation_raw": "baseline"}, {"rw_id": "RW08", "name": "Cherti et al., 2023 (OpenCLIP Scaling Laws)", "relation_raw": "baseline"}, {"rw_id": "RW12", "name": "Hendrycks et al., 2021 (ImageNet-R/A)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW11", "name": "Fang et al., 2022 (Data diversity in CLIP)", "relation_raw": "bounds"}], "recipe_refs": []}, {"id": "N06", "type": "decision", "parent": "N05", "title": "Choose information content vs. tree depth for LCA scoring function", "body": "Choice: Information content: I(v) = -log2(p(v)) with uniform leaf probabilities (D^I_LCA); alternatives: Tree depth P(v): simple but susceptible to tree imbalance; Mixed: use depth for soft labels (D^P_LCA), IC for main correlation experiments. Information content more robust to imbalanced hierarchies; tree depth used for soft label construction where normalization handles imbalance.", "thinking": "With LCA distance established as the promising signal, a design choice remained: how to score how \"important\" a node in the class hierarchy is when computing the distance. Two options were on the table: use tree depth, which is simple but easily distorted by an unevenly branching hierarchy, or use information content, a probability-based score that weights specific classes more than general ones and is more robust to that imbalance. Information content was chosen as the primary scoring function for the main correlation results, while tree depth was kept for a different purpose, building the soft labels used later in training, where a separate normalization step handles the imbalance problem.", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["Information Content", "LCA Tree Depth Distance"], "built_on": [], "rejected_here": [], "recipe_refs": []}, {"id": "N07", "type": "experiment", "parent": "N06", "title": "Validate LCA correlation across 75 models and 5 OOD datasets", "body": "Strong linear LCA-on-the-Line established. R²(LCA→ImgN-S)=0.816, R²(LCA→ImgN-R)=0.779, R²(LCA→ImgN-A)=0.704, R²(LCA→ObjNet)=0.915. ID Top1 achieves R²≈0 on ImgN-A combined. LCA also superior predictor by MAE in Table 3.", "thinking": "Scaling the single promising result from a handful of models up to the full evaluation, 75 models across both families and five out-of-distribution datasets, confirmed that the LCA-on-the-Line pattern holds broadly: R² ranges from 0.704 to 0.915 across ImageNet-S/R/A and ObjectNet, while plain ID Top-1 accuracy collapses to near zero on ImageNet-A when both families are combined. LCA distance also beat every baseline by mean absolute error when predicting OOD accuracy, cementing it as a genuinely better predictor, not just a lucky correlation in a small sample.", "isolated": false, "depends_on": [], "source_refs": [], "why": [{"id": "C01", "title": "LCA-on-the-Line — ID LCA distance linearly predicts OOD accuracy across VMs and VLMs", "statement": "The in-distribution LCA distance (using information content) on ImageNet strongly and linearly correlates with OOD Top-1 accuracy for both VMs and VLMs combined (R²>0.7, PEA>0.7) on all four severely shifted OOD datasets (ImageNet-S, ImageNet-R, ImageNet-A, ObjectNet), while in-distribution Top-1 accuracy fails to unify both families (R²≈0 on ImageNet-A for all 75 models combined).", "status": "supported", "falsification": "If the Pearson correlation (|PEA|) between ID LCA distance and OOD Top-1 accuracy falls below 0.7 for any of the four s  0.121 | 0.270 | 0.167 | 0.409 | 0.265 |\n| Aline-S (Baek et al., 2022) | 0.072 | 0.143 | 0.201 | 0.165 | 0.131 |\n| (Ours) ID LCA | 0.162 | **0.093** | **0.114** | **0.103** | **0.048** |"}, {"id": "Figure 5 (alt)", "caption": "Correlating OOD Top-1/Top-5 accuracy (VM+VLM, 75 models) on 4 ImageNet-OOD datasets visualizing Table 2. The plots clearly demonstrate that the in-distribution LCA distance has a stronger correlation with the model's OOD performance across all OOD datasets than accuracy-on-the-line (Miller et al., 2021). Each plot's x-axis represents the OOD dataset metric (with OOD Top-1 in the top row, and OOD Top-5 accuracy in the bottom row) and y-axis represents ImageNet ID test Top-1 accuracy (left) and LCA (right); Red line (Pink dots: VMs and Red dots: VLMs) represents in-distribution classification accuracy (Top-1); Green line (Green dots: VMs and Blue dots: VLMs) denotes in-distribution taxonomic distance (LCA). As interpreted in Figure 1, accuracy-on-the-line only explains generalization of models within similar settings (VMs or VLMs), but does not unify both settings.", "markdown": "Axis labels: Columns = ImageNet-Sketch, ImageNet-Rendition, ImageNet-Adversarial, ObjectNet. Rows = OOD Top-1 accuracy, OOD Top-5 accuracy. Y-axis = ImageNet ID Top-1 accuracy (red line) or ID LCA distance (green line).\n\n**Extracted Correlation Values (from Table 2) — all values are absolute correlations (R², PEA) for 75 combined VM+VLM models**\n\nOOD Top-1 Accuracy\n\n| ID Metric | ImgN-S R² | ImgN-S PEA | ImgN-R R² | ImgN-R PEA | ImgN-A R² | ImgN-A PEA | ObjNet R² | ObjNet PEA |\n|-----------|---------|----------|---------|----------|---------|----------|---------|----------|\n| ID Top-1 (red line) | 0.075 | 0.275 | 0.020 | 0.140 | 0.009 | 0.094 | 0.273 | 0.522 |\n| ID LCA (green line) | 0.816 | 0.903 | 0.779 | 0.883 | 0.704 | 0.839 | 0.915 | 0.956 |\n\nOOD Top-5 Accuracy\n\n| ID Metric | ImgN-S R² | ImgN-S PEA | ImgN-R R² | ImgN-R PEA | ImgN-A R² | ImgN-A PEA | ObjNet R² | ObjNet PEA |\n|-----------|---------|----------|---------|----------|---------|----------|---------|----------|\n| ID Top-1 (red line) | 0.052 | 0.229 | 0.004 | 0.060 | 0.013 | 0.115 | 0.262 | 0.512 |\n| ID LCA (green line) | 0.811 | 0.901 | 0.738 | 0.859 | 0.799 | 0.894 | 0.924 | 0.961 |\n\nKey finding: In every cell, ID LCA dramatically outperforms ID Top-1 in correlation with OOD accuracy (except for ImageNet-v2, not shown here)."}], "data": []}, "verified_by": [{"id": "E01", "title": "LCA-on-the-Line Correlation Study", "setup": "Model: 75 pretrained models (36 VMs: AlexNet, ConvNeXt, DenseNet variants, EfficientNet, GoogLeNet, InceptionV3, MnasNet variants, MobileNetV3, RegNet, WideResNet, ResNet variants, ShuffleNet, SqueezeNet, Swin-B, VGG variants, ViT-B/L; 39 VLMs: ALBEF, BLIP, CLIP variants (RN50/101/50x4/ViT-B-32/B-16/L-14/L-14-336px), OpenCLIP variants (31 models)). Hardware: Standard GPU inference (no specific hardware requirement for evaluation). Dataset: ImageNet (ID), ImageNet-v2, ImageNet-Sketch, ImageNet-Rendition, ImageNet-Adversarial, ObjectNet (OOD). System: WordNet hierarchy for LCA computation; information content scoring.", "metrics": "R² (coefficient of determination), PEA (Pearson correlation coefficient), across all 75 models combined, VMs only, and VLMs only"}], "artifact": [{"name": "eval_metrics.py", "pointer": "src/execution/eval_metrics.py", "what": "Correlation metrics (R², PEA, KEN, SPE) and MAE prediction used to validate LCA-on-the-Line across all 75 models."}, {"name": "inference_engine.py", "pointer": "src/execution/inference_engine.py", "what": "Unified inference engine producing per-sample predictions/logits for both VMs and VLMs across the 75-model evaluation."}], "concepts": ["LCA Distance"], "built_on": [{"rw_id": "RW01", "name": "Miller et al., 2021 (Accuracy-on-the-Line)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Baek et al., 2022 (Agreement-on-the-Line)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Taori et al., 2020 (Effective Robustness)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Bertinetto et al., 2020 (Making Better Mistakes)", "relation_raw": "imports"}, {"rw_id": "RW05", "name": "Valmadre, 2022 (Hierarchical classification at multiple operating points)", "relation_raw": "imports"}, {"rw_id": "RW06", "name": "Deng et al., 2009 (ImageNet)", "relation_raw": "imports"}, {"rw_id": "RW07", "name": "Radford et al., 2021 (CLIP)", "relation_raw": "baseline"}, {"rw_id": "RW08", "name": "Cherti et al., 2023 (OpenCLIP Scaling Laws)", "relation_raw": "baseline"}, {"rw_id": "RW12", "name": "Hendrycks et al., 2021 (ImageNet-R/A)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW11", "name": "Fang et al., 2022 (Data diversity in CLIP)", "relation_raw": "bounds"}], "recipe_refs": []}, {"id": "N08", "type": "decision", "parent": "N07", "title": "Extend to datasets without predefined hierarchies", "body": "Choice: Construct latent hierarchy via 9-layer K-means clustering on per-class average features from a pretrained model; alternatives: Manual hierarchy construction (too labor intensive); Use cosine similarity matrix directly as proxy for distance (loses hierarchical structure). K-means produces hierarchical organization; results in Table 4 show robust PEA across 75 source models.", "thinking": "LCA distance is only usable where a predefined class hierarchy like WordNet already exists, which rules out most datasets beyond ImageNet. Rather than hand-build a taxonomy for every new dataset, which is too labor-intensive, or fall back to a raw similarity matrix between classes, which throws away the hierarchical structure that makes LCA meaningful, the decision was to construct a hierarchy automatically: run K-means clustering hierarchically, nine layers deep, on each class's average feature vector from a pretrained model, and use that induced structure as the taxonomy.", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["OOD Correlation Metrics"], "built_on": [], "rejected_here": [], "recipe_refs": []}, {"id": "N09", "type": "experiment", "parent": "N08", "title": "K-means latent hierarchy robustness study (Table 4)", "body": "Mean PEA from latent hierarchies: 0.815 (ImgN-v2), 0.773 (ImgN-S), 0.712 (ImgN-R), 0.662 (ImgN-A), 0.930 (ObjNet). Std very low (~0.02-0.03). VLM-sourced hierarchies better quality than VM-sourced.", "thinking": "Testing whether this automatically constructed hierarchy actually works, and whether the choice of which pretrained model builds it matters, across 75 different source models used to build 75 different latent hierarchies. The resulting correlation with OOD accuracy stays strong and remarkably stable across all 75 choices of source model (standard deviation only around 0.02-0.03), meaning the method does not depend on picking exactly the right model to build the hierarchy from. Hierarchies built from vision-language models produced consistently better quality than those built from vision models, mirroring the earlier VLM-vs-VM gap in LCA distance itself.", "isolated": false, "depends_on": [], "source_refs": [], "why": [{"id": "C02", "title": "Latent hierarchies via K-means clustering provide robust LCA-based OOD predictors", "statement": "Class taxonomies constructed from pretrained model features using 9-layer K-means clustering yield LCA distances that still correlate with OOD performance (mean PEA > 0.66 across 75 source models on ImageNet-S/R/A/ObjectNet), though slightly lower than WordNet-based LCA. This enables LCA evaluation on datasets without predefined hierarchies.", "status": "supported", "falsification": "If the mean PEA between latent-hierarchy LCA distance and OOD Top-1 accuracy across 75 source models falls below 0.5 on more than one of the four severely shifted OOD datasets, or if the variance is so high that the minimum PEA falls below 0.3, this claim is refuted.", "dependencies": ["C01"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "Table 4", "caption": "Correlation measurement (PEA) between LCA/Top1 and OOD Top1 across 75 latent hierarchies derived from K-means. Our latent hierarchy construction is robust across 75 different source pretrained models: For each source model, we extracted average class features and applied K-means clustering to construct a latent hierarchy. We then calculated the LCA distance based on each hierarchy, and aggregated the statistical metric of the 75 groups' Pearson correlation coefficient (PEA) to OOD performance (essentially 75 groups of data from Table 2). We observe that LCA reliably tracks OOD performance even when using different class taxonomies.", "markdown": "| Element | OOD | ImgN-v2 PEA | ImgN-S PEA | ImgN-R PEA | ImgN-A PEA | ObjNet PEA |\n|---------|-----|------------|----------|----------|----------|----------|\n| Baseline Top1 | Top1 | 0.980 | 0.275 | 0.140 | 0.094 | 0.522 |\n| WordNet LCA | Top1 | 0.582 | 0.903 | 0.883 | 0.839 | 0.956 |\n| LCA Mean (75 latent hierarchies) | Top1 | 0.815 | 0.773 | 0.712 | 0.662 | 0.930 |\n| LCA Min (75 latent hierarchies) | Top1 | 0.721 | 0.715 | 0.646 | 0.577 | 0.890 |\n| LCA Max (75 latent hierarchies) | Top1 | 0.863 | 0.829 | 0.780 | 0.717 | 0.952 |\n| LCA Std (75 latent hierarchies) | Top1 | 0.028 | 0.022 | 0.027 | 0.025 | 0.010 |"}, {"id": "Table 4 (alt)", "caption": "Correlation measurement (PEA) between LCA/Top1 and OOD Top1 across 75 latent hierarchies derived from K-means. Our latent hierarchy construction is robust across 75 different source pretrained models.", "markdown": "| Element | Source | ImgN-v2 PEA | ImgN-S PEA | ImgN-R PEA | ImgN-A PEA | ObjNet PEA |\n|---------|--------|------------|-----------|-----------|-----------|-----------|\n| Baseline | Top1 → Top1 | 0.980 | 0.275 | 0.140 | 0.094 | 0.522 |\n| WordNet | LCA → Top1 | 0.582 | 0.903 | 0.883 | 0.839 | 0.956 |\n| Mean (75 latent hierarchies) | LCA → Top1 | 0.815 | 0.773 | 0.712 | 0.662 | 0.930 |\n| Min (75 latent hierarchies) | LCA → Top1 | 0.721 | 0.715 | 0.646 | 0.577 | 0.890 |\n| Max (75 latent hierarchies) | LCA → Top1 | 0.863 | 0.829 | 0.780 | 0.717 | 0.952 |\n| Std (75 latent hierarchies) | LCA → Top1 | 0.028 | 0.022 | 0.027 | 0.025 | 0.010 |"}], "data": []}, "verified_by": [{"id": "E03", "title": "K-means Latent Hierarchy Robustness", "setup": "Model: All 75 pretrained models as source models for hierarchy construction; all 75 as evaluation models. Hardware: Standard GPU for feature extraction. Dataset: ImageNet test set for feature extraction; all 5 OOD datasets for evaluation. System: 9-layer K-means hierarchical clustering on per-class average features.", "metrics": "PEA statistics (mean, min, max, std) over 75 source hierarchies; comparison to WordNet PEA"}], "artifact": [{"name": "kmeans_hierarchy.py", "pointer": "src/execution/kmeans_hierarchy.py", "what": "9-layer K-means latent hierarchy construction used to build the 75 source hierarchies tested in this step."}], "concepts": ["K-means Latent Hierarchy", "OOD Correlation Metrics"], "built_on": [{"rw_id": "RW05", "name": "Valmadre, 2022 (Hierarchical classification at multiple operating points)", "relation_raw": "imports"}, {"rw_id": "RW08", "name": "Cherti et al., 2023 (OpenCLIP Scaling Laws)", "relation_raw": "baseline"}], "rejected_here": [], "recipe_refs": []}, {"id": "N10", "type": "decision", "parent": "N07", "title": "Apply LCA insight to improve generalization (not just measure it)", "body": "Choice: Augment CE loss with LCA soft label auxiliary loss for linear probing; alternatives: Full end-to-end training with LCA loss (not reported in main paper); Use LCA distance as a filtering criterion to select training data; Modify architecture to encourage hierarchical representations. Linear probing is computationally efficient; weight interpolation allows tunable ID/OOD trade-off.", "thinking": "Having shown that LCA distance predicts generalization, the next step was to see whether it could also be used to improve generalization, not just measure it. Several options existed, training an entire model end-to-end with an LCA-based loss, using LCA distance to filter which training examples to keep, or redesigning the architecture to encourage hierarchical representations, but the simplest and most tractable path was chosen instead: keep the backbone frozen, train only a linear probe with a cross-entropy loss augmented by an LCA-derived soft label loss, and use weight interpolation to trade off ID accuracy against OOD gains after training. This choice builds directly on the K-means hierarchy result, since it needed a way to construct soft labels even without WordNet.", "isolated": false, "depends_on": ["N09"], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": [], "built_on": [], "rejected_here": [], "recipe_refs": []}, {"id": "N11", "type": "experiment", "parent": "N10", "title": "LCA soft labels for linear probing (Table 5, 6)", "body": "Consistent OOD improvements across all 6 backbones with WordNet soft labels. ResNet-50: +6.0% on ImgN-R, +5.9% on ImgN-A. VLM-sourced latent hierarchies also improve OOD performance, with WordNet being best.", "thinking": "Testing the LCA soft label loss on linear probes across six different backbone architectures, from ResNet to Vision Transformers to Swin Transformer, using WordNet-derived soft labels. Every backbone improved on out-of-distribution accuracy, with the largest gains on ResNet-50 (about 6% on both ImageNet-R and ImageNet-A), and none of them lost meaningful ID accuracy in the process. Swapping in the automatically constructed K-means hierarchies from the earlier step also improved OOD performance, just by a smaller margin than the hand-curated WordNet hierarchy, showing the two pieces of the framework, measurement and improvement, reinforce each other.", "isolated": false, "depends_on": [], "source_refs": [], "why": [{"id": "C03", "title": "LCA soft labels improve OOD generalization without sacrificing ID accuracy", "statement": "Augmenting the standard cross-entropy loss with an auxiliary LCA soft label loss (and applying linear weight interpolation) consistently improves OOD Top-1 accuracy across all tested backbones (ResNet-18/50, ViT-B/L, ConvNext, Swin Transformer) on at least 3/4 severely shifted OOD datasets without reducing ID ImageNet Top-1 accuracy compared to cross-entropy-only baseline.", "status": "supported", "falsification": "If any backbone shows degraded OOD performance on 2 or more OOD datasets compared to the CE-only baseline when using the \"no ID accuracy drop\" setting, this claim is refuted. If ID accuracy consistently drops (>0.5%) when maintaining OOD improvements, this claim is weakened.", "dependencies": ["C01"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "Table 5", "caption": "Soft labeling with WordNet for Linear Probing. Baseline: Trained with Cross Entropy only; Ours: Trained with Cross Entropy + LCA soft loss + weight linear interpolation of (CE, CE + soft loss) (Wortsman et al., 2022). Results show that integrating soft loss consistently improves model OOD performance, without compromising ID accuracy. Note that in Table 9 of ablation study in pro-OOD setting, we demonstrate that it's possible to further enhance OOD performance at the cost of a slight ID accuracy drop.", "markdown": "| Backbone Models | ImgNet Baseline | ImgNet Ours | ImgNet-V2 Baseline | ImgNet-V2 Ours | ImgNet-S Baseline | ImgNet-S Ours | ImgNet-R Baseline | ImgNet-R Ours | ImgNet-A Baseline | ImgNet-A Ours | ObjectNet Baseline | ObjectNet Ours |\n|-----------------|----------------|------------|-------------------|---------------|------------------|--------------|------------------|--------------|------------------|--------------|-------------------|---------------|
