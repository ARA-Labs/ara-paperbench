curacy drop) | 83.2 | 71.9 | 31.4 | 45.3 | 32.7 | 49.5 |\n| Swin Transformer | (Ours) CE + Soft Loss + interpolation (pro-OOD) | 83.0 | 71.8 | 31.6 | 45.5 | 33.3 | 49.4 |"}], "data": []}, "verified_by": [{"id": "E04", "title": "LCA Soft Labels for Linear Probing", "setup": "Model: 6 backbone models (ResNet-18, ResNet-50, ViT-B, ViT-L, ConvNext-Tiny, Swin-B). Hardware: Single NVIDIA GeForce GTX 1080 Ti GPU. Dataset: ImageNet (train/val/test), ImageNet-v2, ImageNet-Sketch, ImageNet-Rendition, ImageNet-Adversarial, ObjectNet. System: Linear probe on frozen backbone features; WordNet LCA soft labels or K-means latent hierarchy soft labels.", "metrics": "Top-1 accuracy on all 6 datasets (ImageNet, ImageNet-v2, ImageNet-S/R/A, ObjectNet)"}], "artifact": [{"name": "lca_alignment_loss.py", "pointer": "src/execution/lca_alignment_loss.py", "what": "LCA alignment loss (Algorithm 1) combining cross-entropy with an LCA soft-label loss, used for the linear probing experiments in this step."}, {"name": "soft_label_loss.py", "pointer": "src/execution/soft_label_loss.py", "what": "Alternate implementation of the Algorithm 1 soft-label loss (lambda=0.03, temperature=25, CE mode) used for linear probing."}, {"name": "training.md", "pointer": "src/configs/training.md", "what": "Linear probing hyperparameters (lr=0.001, batch_size=1024, AdamW, 50 epochs, lambda=0.03, temperature=25) used in this step."}], "concepts": [], "built_on": [{"rw_id": "RW10", "name": "Wortsman et al., 2022 (WiSE-FT)", "relation_raw": "imports"}], "rejected_here": [], "recipe_refs": []}, {"id": "N12", "type": "experiment", "parent": "N10", "title": "Taxonomy-aligned prompts for VLMs (Table 14)", "body": "Taxonomy Parent prompt ('A, which is a type of B, which is a type of C') achieves highest Top-1 and lowest CE across all datasets. Shuffle Parent (wrong hierarchy) degrades performance vs correct hierarchy. Stack Parent (no relational structure) performs worst.", "thinking": "A separate way to put the taxonomy to work, this time for vision-language models at zero-shot inference time rather than through training: instead of feeding CLIP just the class name, spell out its place in the hierarchy directly in the text prompt, naming the parent and grandparent categories with explicit relational language (\"which is a type of\"). This taxonomy-aware prompt beat every alternative: a plain baseline, a version listing the hierarchy without relational language, and a version with a deliberately scrambled (wrong) hierarchy, which performed worse than the correct hierarchy but still slightly better than the no-relational-language version, confirming both that the hierarchy needs to be correct and that stating the relationship explicitly matters, not just naming the ancestor classes.", "isolated": false, "depends_on": [], "source_refs": [], "why": [{"id": "C05", "title": "Taxonomy-aligned prompt engineering for VLMs improves OOD generalization", "statement": "For zero-shot VLM prediction, providing the full hierarchical taxonomy relationship in the prompt (e.g., \"A, which is a type of B, which is a type of C\") significantly improves Top-1 accuracy and reduces cross-entropy loss on all tested OOD datasets compared to baseline prompts that only name the class, and outperforms partial hierarchy information (Stack Parent) or incorrect hierarchy information (Shuffle Parent).", "status": "supported", "falsification": "If the Taxonomy Parent prompt does not outperform Baseline (class-name only) on at least 4/5 datasets (including OOD), or if Shuffle Parent performs comparably to Taxonomy Parent, this claim is refuted.", "dependencies": ["C01"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "Table 14", "caption": "Accuracy on OOD dataset by enforcing class taxonomy: Baseline: &lt;dalmatian>; Stack Parent: &lt;dalmatian, dog, animal>; Taxonomy Parent:&lt;dalmatian, which is type of a dog, which is type of an animal>; Shuffle Parent: &lt;dalmatian, which is type of an organism, which is type of a seabird>; The Taxonomy Parent method, which includes the full hierarchical relationship, yields the best performance.", "markdown": "| Model | ImgN Top1 | ImgN Test CE | ImgN-v2 Top1 | ImgN-v2 Test CE | ImgN-S Top1 | ImgN-S Test CE | ImgN-R Top1 | ImgN-R Test CE | ImgN-A Top1 | ImgN-A Test CE | ObjNet Top1 | ObjNet Test CE |\n|-------|----------|------------|-------------|----------------|-----------|--------------|-----------|--------------|-----------|--------------|-----------|--------------|\n| Baseline | 0.589 | 9.322 | 0.517 | 9.384 | 0.379 | 9.378 | 0.667 | 8.790 | 0.294 | 9.358 | 0.394 | 8.576 |\n| Stack Parent | 0.381 | 9.389 | 0.347 | 9.395 | 0.219 | 9.561 | 0.438 | 9.258 | 0.223 | 9.364 | 0.148 | 9.076 |\n| Shuffle Parent | 0.483 | 9.679 | 0.432 | 9.696 | 0.329 | 9.718 | 0.557 | 9.281 | 0.236 | 9.586 | 0.329 | 8.785 |\n| Taxonomy Parent | 0.626 | 9.102 | 0.553 | 9.165 | 0.419 | 9.319 | 0.685 | 8.658 | 0.319 | 9.171 | 0.431 | 8.515 |"}], "data": []}, "verified_by": [{"id": "E05", "title": "Taxonomy-Aligned Prompt Engineering for VLMs", "setup": "Model: CLIP-ViT32 (Radford et al., 2021). Hardware: Standard GPU. Dataset: ImageNet, ImageNet-v2, ImageNet-Sketch, ImageNet-Rendition, ImageNet-Adversarial, ObjectNet. System: Zero-shot evaluation with 4 prompt variants.", "metrics": "Top-1 accuracy, test-time Cross-Entropy (CE) on all 6 datasets"}], "artifact": [], "concepts": [], "built_on": [{"rw_id": "RW07", "name": "Radford et al., 2021 (CLIP)", "relation_raw": "baseline"}], "rejected_here": [], "recipe_refs": []}, {"id": "N13", "type": "dead_end", "parent": "N01", "title": "Use data diversity metrics to explain VLM generalization", "body": "Hypothesis: VLMs generalize better because LAION has more diverse training data; measuring data diversity would predict OOD performance. Failure mode: Data diversity is difficult to measure; does not explain differences within CLIP variants with same training data; requires knowing training dataset composition which is unavailable for many VLMs. Lesson: Need a model-intrinsic metric (like LCA distance) that works regardless of training data knowledge.", "thinking": "An alternative explanation for why VLMs generalize better was that their training data, scraped broadly from LAION, is simply more diverse than ImageNet, and that measuring this diversity would predict OOD performance. This was abandoned because data diversity is hard to quantify in the first place, it cannot explain performance differences between CLIP variants that were trained on the very same data, and for many VLMs the training data composition is not even known, making the metric impossible to compute in practice. The takeaway reinforced the same lesson as the other dead end: what is needed is a metric intrinsic to the model itself, like LCA distance, that does not require knowledge of how or on what it was trained.", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "concepts": ["LCA Distance"], "built_on": [], "rejected_here": [], "recipe_refs": []}], "context": {"title": "Problem", "summary": "A model that consistently makes “better mistakes”—predicting semantically closer classes in the hierarchy when wrong—has learned more transferable (causal) features rather than spurious correlations.", "sections": [{"role": "setting", "heading": "Setting", "present": false, "entries": []}, {"role": "observations", "heading": "Observations", "present": true, "entries": [{"ent_id": "O1", "inferred_id": false, "ent_title": "VLMs outperform VMs on severely shifted OOD datasets despite lower ID accuracy", "text": "Vision-Language Models (VLMs) trained on LAION with contrastive loss achieve higher OOD Top-1 accuracy on ImageNet-R, ImageNet-S, ImageNet-A, and ObjectNet compared to Vision Models (VMs) with comparable or higher ImageNet ID accuracy. For example, CLIP_RN50 (ID Top1=0.579) achieves 0.218 on ImageNet-A vs ResNet50 (ID Top1=0.733) achieving 0.018.", "unstructured": false, "fields": [{"label": "Statement", "value": "Vision-Language Models (VLMs) trained on LAION with contrastive loss achieve higher OOD Top-1 accuracy on ImageNet-R, ImageNet-S, ImageNet-A, and ObjectNet compared to Vision Models (VMs) with comparable or higher ImageNet ID accuracy. For example, CLIP_RN50 (ID Top1=0.579) achieves 0.218 on ImageNet-A vs ResNet50 (ID Top1=0.733) achieving 0.018."}, {"label": "Evidence", "value": "Table 1 (main paper); Figure 1 (left panel shows two divergent linear trends)"}, {"label": "Implication", "value": "ID Top-1 accuracy is insufficient to explain OOD generalization across different model families."}], "refs": [{"raw": "Table 1", "kind": "figure", "target": null}, {"raw": "Figure 1", "kind": "figure", "target": null}]}, {"ent_id": "O2", "inferred_id": false, "ent_title": "Accuracy-on-the-Line (Miller et al., 2021) breaks down across model modalities", "text": "The established linear relationship between ID and OOD accuracy holds within VMs or within VLMs separately, but breaks down when both families are considered together. For severely shifted datasets (ImageNet-S/R/A/ObjectNet), R²(Top1→OOD Top1) ≈ 0.075, 0.020, 0.009, 0.273 respectively (across all 75 models).", "unstructured": false, "fields": [{"label": "Statement", "value": "The established linear relationship between ID and OOD accuracy holds within VMs or within VLMs separately, but breaks down when both families are considered together. For severely shifted datasets (ImageNet-S/R/A/ObjectNet), R²(Top1→OOD Top1) ≈ 0.075, 0.020, 0.009, 0.273 respectively (across all 75 models)."}, {"label": "Evidence", "value": "Table 2, Figure 5 (red line showing two separate trends for VMs vs VLMs)"}, {"label": "Implication", "value": "A unified metric for cross-modality OOD prediction is needed."}], "refs": [{"raw": "Table 2", "kind": "figure", "target": null}, {"raw": "Figure 5", "kind": "figure", "target": null}]}, {"ent_id": "O3", "inferred_id": false, "ent_title": "LCA distance correlates strongly with OOD accuracy across both model families", "text": "In-distribution LCA distance (information content) on ImageNet strongly correlates with OOD Top-1 accuracy across all 75 models on 4/5 OOD datasets: R²(LCA→ImgN-S Top1)=0.816, R²(LCA→ImgN-R Top1)=0.779, R²(LCA→ImgN-A Top1)=0.704, R²(LCA→ObjNet Top1)=0.915. PEA values: 0.903, 0.883, 0.839, 0.956 respectively.", "unstructured": false, "fields": [{"label": "Statement", "value": "In-distribution LCA distance (information content) on ImageNet strongly correlates with OOD Top-1 accuracy across all 75 models on 4/5 OOD datasets: R²(LCA→ImgN-S Top1)=0.816, R²(LCA→ImgN-R Top1)=0.779, R²(LCA→ImgN-A Top1)=0.704, R²(LCA→ObjNet Top1)=0.915. PEA values: 0.903, 0.883, 0.839, 0.956 respectively."}, {"label": "Evidence", "value": "Table 2; Figure 1 (right panel showing unified linear trend)"}, {"label": "Implication", "value": "Semantic severity of mispredictions (LCA distance) is a better proxy for transferable feature learning than top-1 accuracy."}], "refs": [{"raw": "Table 2", "kind": "figure", "target": null}, {"raw": "Figure 1", "kind": "figure", "target": null}]}, {"ent_id": "O4", "inferred_id": false, "ent_title": "ImageNet-v2 behaves more like ID than OOD for VMs", "text": "ImageNet-v2 shows R²(Top1→ImgN-v2 Top1)=0.962 (high), while R²(LCA→ImgN-v2 Top1)=0.339 (low), reversing the pattern seen in other OOD datasets.", "unstructured": false, "fields": [{"label": "Statement", "value": "ImageNet-v2 shows R²(Top1→ImgN-v2 Top1)=0.962 (high), while R²(LCA→ImgN-v2 Top1)=0.339 (low), reversing the pattern seen in other OOD datasets."}, {"label": "Evidence", "value": "Table 2, Section 4.1, Appendix B"}, {"label": "Implication", "value": "ImageNet-v2 is a recollection of ImageNet with minimal external intervention; spurious correlations from ImageNet training transfer to ImageNet-v2, inflating VM ID accuracy measures."}], "refs": [{"raw": "Table 2", "kind": "figure", "target": null}]}]}, {"role": "gaps", "heading": "Gaps", "present": true, "entries": [{"ent_id": "G1", "inferred_id": false, "ent_title": "No unified OOD predictor across VM and VLM families", "text": "Existing \"X-on-the-Line\" methods (Accuracy, Agreement) fail to provide a single linear function that predicts OOD performance for both VMs and VLMs simultaneously.", "unstructured": false, "fields": [{"label": "Statement", "value": "Existing \"X-on-the-Line\" methods (Accuracy, Agreement) fail to provide a single linear function that predicts OOD performance for both VMs and VLMs simultaneously."}, {"label": "Caused by", "value": "O1, O2"}, {"label": "Existing attempts", "value": "Accuracy-on-the-Line (Miller et al., 2021); Agreement-on-the-Line (Baek et al., 2022)"}, {"label": "Why they fail", "value": "VMs trained on ImageNet inflate ID Top-1 through spurious correlations that don't transfer to severely shifted OOD datasets; these methods treat both families separately."}], "refs": [{"raw": "O1", "kind": "observation", "target": "O1"}, {"raw": "O2", "kind": "observation", "target": "O2"}]}, {"ent_id": "G2", "inferred_id": false, "ent_title": "LCA distance dismissed as redundant with Top-1 accuracy", "text": "Prior work (Deng et al., 2009; Bertinetto et al., 2020) assumed LCA distance follows the same ordering as Top-1 accuracy, making it uninformative. This belief was not tested across different model modalities.", "unstructured": false, "fields": [{"label": "Statement", "value": "Prior work (Deng et al., 2009; Bertinetto et al., 2020) assumed LCA distance follows the same ordering as Top-1 accuracy, making it uninformative. This belief was not tested across different model modalities."}, {"label": "Caused by", "value": "O1, O3"}, {"label": "Existing attempts", "value": "LCA used in early ImageNet challenge evaluations; later abandoned."}, {"label": "Why they fail", "value": "The correlation between LCA and Top-1 is weak when mixing VM and VLM families on ID datasets (PEA=0.174 on ImageNet for all 75 models), revealing LCA carries independent information."}], "refs": [{"raw": "O1", "kind": "observation", "target": "O1"}, {"raw": "O3", "kind": "observation", "target": "O3"}]}, {"ent_id": "G3", "inferred_id": false, "ent_title": "No hierarchy available for arbitrary datasets", "text": "WordNet is only available for ImageNet-like datasets; no principled method existed to construct class taxonomies for arbitrary datasets to enable LCA-based evaluation.", "unstructured": false, "fields": [{"label": "Statement", "value": "WordNet is only available for ImageNet-like datasets; no principled method existed to construct class taxonomies for arbitrary datasets to enable LCA-based evaluation."}, {"label": "Caused by", "value": "O3"}, {"label": "Existing attempts", "value": "Manual hierarchy construction (iNaturalist, ImageNet)"}, {"label": "Why they fail", "value": "Labor-intensive, domain-specific, not scalable."}], "refs": [{"raw": "O3", "kind": "observation", "target": "O3"}]}]}, {"role": "insight", "heading": "Key Insight", "present": true, "entries": [{"ent_id": "1", "inferred_id": true, "ent_title": "Insight", "text": "Insight: A model that consistently makes \"better mistakes\"—predicting semantically closer classes in the hierarchy when wrong—has learned more transferable (causal) features rather than spurious correlations. The LCA distance on in-distribution data serves as a proxy for this feature quality and is invariant to the training modality (class labels vs. captions), thereby providing a unified cross-modal OOD predictor. Derived from: O1, O2, O3. Enables: The LCA-on-the-Line framework: a single linear function mapping ID LCA distance to OOD Top-1 accuracy that works for both VMs and VLMs.", "unstructured": false, "fields": [{"label": "Insight", "value": "A model that consistently makes \"better mistakes\"—predicting semantically closer classes in the hierarchy when wrong—has learned more transferable (causal) features rather than spurious correlations. The LCA distance on in-distribution data serves as a proxy for this feature quality and is invariant to the training modality (class labels vs. captions), thereby providing a unified cross-modal OOD predictor."}, {"label": "Derived from", "value": "O1, O2, O3"}, {"label": "Enables", "value": "The LCA-on-the-Line framework: a single linear function mapping ID LCA distance to OOD Top-1 accuracy that works for both VMs and VLMs."}], "refs": [{"raw": "O1", "kind": "observation", "target": "O1"}, {"raw": "O2", "kind": "observation", "target": "O2"}, {"raw": "O3", "kind": "observation", "target": "O3"}]}]}, {"role": "assumptions", "heading": "Assumptions", "present": true, "entries": [{"ent_id": "A1", "inferred_id": false, "ent_title": "", "text": "WordNet hierarchy approximates invariant inter-class relationships that remain stable across ID and OOD environments.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A2", "inferred_id": false, "ent_title": "", "text": "Models that learn transferable features tend to predict semantically nearby classes when making errors (i.e., lower LCA distance implies better feature alignment with class ontology).", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A3", "inferred_id": false, "ent_title": "", "text": "The \"on-the-line\" linear relationship generalizes across architectures, training objectives (CE vs. contrastive), and training data distributions (ImageNet class labels vs. LAION captions).", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A4", "inferred_id": false, "ent_title": "", "text": "Class hierarchies (WordNet) serve as a valid approximation of invariant causal relationships between classes across environments, as in invariant risk minimization.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A5", "inferred_id": false, "ent_title": "", "text": "ImageNet serves as a valid reference anchor dataset for evaluating generalization, even for VLMs not trained on it.", "unstructured": true, "fields": [], "refs": []}]}]}, "glossary": {"title": "Concepts", "groups": [], "terms": [{"term_id": "G01", "name": "LCA Distance", "aliases": ["D_LCA"], "group": "", "definition": "The taxonomic distance between a model's predicted class $y'$ and the ground-truth class $y$ in a predefined class hierarchy (e.g., WordNet). $N_{LCA}(y, y')$ is the lowest common ancestor node of $y$ and $y'$. $f(\\cdot)$ is a node scoring function (either information content or tree depth). The average LCA distance over a dataset is computed only over incorrectly classified samples: $D_{LCA}(\\text{model}, \\mathcal{M}) := \\frac{1}{n}\\sum_{i=1}^{n} D_{LCA}(\\hat{y}_i, y_i) \\Leftrightarrow y_i \\neq \\hat{y}_i$.", "fields": [{"label": "Notation", "value": "$D_{LCA}(y', y) := f(y) - f(N_{LCA}(y, y'))$"}, {"label": "Boundary conditions", "value": "Requires a predefined class hierarchy. Only computed for misclassified samples (correct predictions contribute 0 by convention). Lower LCA distance indicates \"better mistakes\" (semantically closer predictions). Not comparable across modalities using ELCA (sensitive to logit temperature)."}], "related": ["G02", "G03", "G05", "G06"], "refs": []}, {"term_id": "G02", "name": "Information Content", "aliases": ["I"], "group": "", "definition": "The negative log-probability of a node in the class hierarchy, where leaf nodes receive uniform probability ($p(\\text{leaf}) = 1/K$ for $K$ total classes) and internal nodes receive probability equal to the sum of their descendants' probabilities. Used as the scoring function $f(\\cdot)$ in the primary LCA distance variant ($D^I_{LCA}$).", "fields": [{"label": "Notation", "value": "$I(\\text{node}) := -\\log_2(p(\\text{node}))$"}, {"label": "Boundary conditions", "value": "Assigns more weight to specific (deep) nodes than general (shallow) ones. More robust to tree imbalance than depth-based scoring. Used for the main correlation experiments."}], "related": ["G01", "G05"], "refs": []}, {"term_id": "G03", "name": "ELCA Distance", "aliases": ["D_ELCA"], "group": "", "definition": "The Expected LCA Distance, a generalization of LCA distance that considers the full predicted probability distribution over all $K$ classes (weighted by softmax probabilities). Extends cross-entropy to incorporate hierarchical class relationships.", "fields": [{"label": "Notation", "value": "$D_{ELCA}(\\text{model}, \\mathcal{M}) := \\frac{1}{n}\\sum_{i=1}^{n}\\sum_{k=1}^{K} \\hat{p}_{k,i} \\cdot D_{LCA}(k, y_i)$"}, {"label": "Boundary conditions", "value": "Should NOT be compared across modalities (sensitive to logit temperature calibration). Combines aspects of Top-1 accuracy, LCA distance, and cross-entropy. Computed using softmax probabilities."}], "related": ["G01", "G02"], "refs": []}, {"term_id": "G04", "name": "LCA Tree Depth Distance", "aliases": ["D^P_LCA"], "group": "", "definition": "LCA distance computed using tree depth $P(\\cdot)$ as the node scoring function, rather than information content. The additive term $(P(y') - P(N_{LCA}))$ is included to counter tree imbalance. Used in linear probing experiments (not the main correlation experiments).", "fields": [{"label": "Notation", "value": "$D^P_{LCA}(y', y) := (P(y) - P(N_{LCA}(y', y))) + (P(y') - P(N_{LCA}(y', y)))$"}, {"label": "Boundary conditions", "value": "Susceptible to tree imbalance (unlike information content variant). Used for constructing soft labels in the linear probing experiments. Defined in Appendix D.2.1."}], "related": ["G01", "G02"], "refs": []}, {"term_id": "G05", "name": "WordNet Hierarchy", "aliases": [], "group": "", "definition": "A large-scale lexical database organized as a tree hierarchy encoding semantic relationships between English words/concepts. ImageNet classes are mapped to WordNet synsets, making WordNet the standard hierarchy for ImageNet-based LCA computation. Serves as the primary class taxonomy in this paper.", "fields": [{"label": "Notation", "value": "$\\mathcal{H}_{WN}$"}, {"label": "Boundary conditions", "value": "Available for ImageNet and related datasets. Not available for arbitrary datasets (motivating K-means latent hierarchy). Encodes human semantic knowledge approximating invariant class relationships across environments."}], "related": ["G06", "G01"], "refs": []}, {"term_id": "G06", "name": "K-means Latent Hierarchy", "aliases": [], "group": "", "definition": "A class taxonomy constructed by applying K-means clustering hierarchically to per-class average feature representations extracted from a pretrained model. For ImageNet (1000 classes), 9 levels of clustering are performed with $2^i$ cluster centers ($i = 1, 2, \\ldots, 9$, since $2^9 &lt; 1000$). The LCA height for a class pair is determined by the deepest level at which both classes share a cluster.", "fields": [{"label": "Notation", "value": "$\\mathcal{H}_{KM}$"}, {"label": "Boundary conditions", "value": "Applicable to any dataset with a pretrained model. Quality depends on the source model (VLMs produce better hierarchies). All classes share a base cluster level of 10 by convention. Results in mean PEA correlations slightly lower than WordNet but still substantial."}], "related": ["G05", "G01"], "refs": []}, {"term_id": "G07", "name": "Effective Robustness", "aliases": [], "group": "", "definition": "The concept (from Taori et al., 2020) that OOD performance should be predictable from ID performance via a linear function. A model has high \"effective robustness\" if it exceeds the expected OOD performance given its ID performance. VLMs exhibit high effective robustness under Accuracy-on-the-Line (unexpectedly high OOD given their ID Top-1).", "fields": [{"label": "Notation", "value": "Not formally defined; refers to excess OOD performance beyond what ID performance predicts via the linear fit from Accuracy-on-the-Line."}, {"label": "Boundary conditions", "value": "VLMs appear to have high effective robustness under Top-1 based evaluation, but this is explained by LCA distance — VLMs have lower LCA distance which correctly predicts their higher OOD performance."}], "related": ["G01", "Accuracy-on-the-Line"], "refs": []}, {"term_id": "G08", "name": "LCA Alignment Loss", "aliases": [], "group": "", "definition": "A composite training loss combining standard cross-entropy ($L_{CE}$) with an auxiliary soft label loss ($L_{soft\\_lca}$). The soft labels are derived from the reverse normalized LCA distance matrix: $M_{LCA} = \\text{MinMax}(M^T)$, where $M[i,k] = D_{LCA}(i,k)$ and $T$ is the temperature. The reverse is $1 - M_{LCA}$. Loss can be BCE or CE mode. Lambda weights the standard CE loss.", "fields": [{"label": "Notation", "value": "$L = \\lambda \\cdot L_{CE} + L_{soft\\_lca}$"}, {"label": "Boundary conditions", "value": "Requires precomputed LCA distance matrix (n×n, where n = number of classes). Temperature T controls smoothness of soft labels. Lambda balances ID accuracy preservation vs. OOD improvement. Used for linear probing experiments only (not full end-to-end training reported in main paper)."}], "related": ["G01", "G04", "G06"], "refs": []}, {"term_id": "G09", "name": "OOD Correlation Metrics", "aliases": ["PEA", "KEN", "SPE"], "group": "", "definition": "Four correlation metrics used to measure the relationship between ID metrics (LCA or Top-1) and OOD accuracy across 75 models. R² (coefficient of determination) measures predictability; PEA (Pearson) measures linear correlation; KEN (Kendall's $\\tau$) and SPE (Spearman's $\\rho$) measure rank correlations. All use min-max scaling for preprocessing.", "fields": [{"label": "Notation", "value": "$R^2$, $r$ (PEA), $\\tau$ (KEN), $\\rho$ (SPE)"}, {"label": "Boundary conditions", "value": "All metrics take absolute values for simplicity (direction not reported). Min-max scaling applied since LCA does not fall in [0,1]. Used to assess \"on-the-line\" behavior rather than just point correlations."}], "related": ["G01", "G07"], "refs": []}], "lexicon": {"lca distance": "G01", "d_lca": "G01", "information content": "G02", "elca distance": "G03", "d_elca": "G03", "lca tree depth distance": "G04", "d^p_lca": "G04", "wordnet hierarchy": "G05", "k-means latent hierarchy": "G06", "effective robustness": "G07", "lca alignment loss": "G08", "ood correlation metrics": "G09", "pea": "G09", "ken": "G09", "spe": "G09"}}, "dependencies": {"title": "Related Work / Dependencies", "preamble": "", "legend": [], "attribution": "", "entries": [{"rw_id": "RW01", "inferred_id": false, "name": "Miller et al., 2021 (Accuracy-on-the-Line)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: LCA-on-the-Line replaces Top-1 ID accuracy with LCA distance as the OOD predictor. Why: Top-1 accuracy fails to unify VM and VLM families (two separate linear trends); LCA provides a single unified trend.", "adopted": "The \"on-the-line\" evaluation framework concept; use of ImageNet as ID reference anchor; same 5 OOD datasets", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW02", "inferred_id": false, "name": "Baek et al., 2022 (Agreement-on-the-Line)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: LCA-on-the-Line uses a single-model in-distribution metric (no model pairs needed); does not require OOD data or multiple models. Why: Agreement-on-the-Line requires computing consensus between model pairs on OOD benchmarks (computationally expensive), fails for cross-modality comparison.", "adopted": "Comparison methodology; Aline-D and Aline-S baselines for MAE comparison", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW03", "inferred_id": false, "name": "Taori et al., 2020 (Effective Robustness)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: LCA provides a better explanation of why VLMs appear to have \"high effective robustness\" — they simply have lower LCA distance. Why: Effective robustness framework lacks a mechanism to explain cross-modal differences.", "adopted": "Concept of effective robustness; motivation for predicting OOD from ID measurements", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW04", "inferred_id": false, "name": "Bertinetto et al., 2020 (Making Better Mistakes)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: LCA-on-the-Line uses LCA distance as a generalization predictor rather than just an evaluation metric; demonstrates LCA and Top-1 do NOT always align (especially across modalities). Why: Bertinetto et al. established LCA as a quality metric but dismissed it as correlated with Top-1 accuracy.", "adopted": "LCA distance definition; WordNet hierarchy usage; information content formulation; the concept of \"making better mistakes\"", "grounding": [], "claims": ["C01", "C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW05", "inferred_id": false, "name": "Valmadre, 2022 (Hierarchical classification at multiple operating points)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: This paper directly uses Valmadre's information content formulation for LCA computation. Why: Information content is more robust to tree imbalance than simple tree depth.", "adopted": "Information content node scoring function I(v) = -log2(p(v)) where p is computed recursively", "grounding": [{"raw": "arXiv:2210.10929", "kind": "arxiv", "target": null}], "claims": ["C01", "C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW06", "inferred_id": false, "name": "Deng et al., 2009 (ImageNet)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: LCA-on-the-Line revives the LCA metric from early ImageNet challenge evaluations. Why: LCA was used in early ImageNet benchmarking but abandoned as Top-1 became dominant.", "adopted": "ImageNet hierarchy structure; WordNet synset mapping", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW07", "inferred_id": false, "name": "Radford et al., 2021 (CLIP)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: CLIP models are analyzed through the LCA lens; LCA explains why CLIP generalizes better than VMs. Why: CLIP's generalization was previously attributed to data diversity but LCA provides a unified feature-quality explanation.", "adopted": "7 CLIP model variants included in the 75-model evaluation", "grounding": [], "claims": ["C01", "C05"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW08", "inferred_id": false, "name": "Cherti et al., 2023 (OpenCLIP Scaling Laws)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: 31 OpenCLIP variants included in the 75-model evaluation; confirms that VLMs show higher OOD accuracy than expected from ID accuracy. Why: Cherti et al. found VLMs show separate OOD trends from VMs; LCA provides the unified explanation.", "adopted": "OpenCLIP model weights and architecture variants", "grounding": [], "claims": ["C01", "C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW09", "inferred_id": false, "name": "Arjovsky et al., 2019 (Invariant Risk Minimization)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: LCA provides a practical, interpretable proxy for measuring invariant feature learning. Why: IRM requires domain labels and structural assumptions; LCA needs only a class hierarchy.", "adopted": "Conceptual framework: features invariant across environments lead to better OOD generalization; causal/confounding feature distinction", "grounding": [{"raw": "arXiv:1907.02893", "kind": "arxiv", "target": null}], "claims": ["C04"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW10", "inferred_id": false, "name": "Wortsman et al., 2022 (WiSE-FT)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Adapts the weight interpolation technique to combine CE-only and CE+soft probes. Why: Weight interpolation allows smooth trade-off between ID and OOD performance without OOD data.", "adopted": "Linear weight interpolation: W_interp = alpha*W_1 + (1-alpha)*W_2; selected on ID validation set", "grounding": [], "claims": ["C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW11", "inferred_id": false, "name": "Fang et al., 2022 (Data diversity in CLIP)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: LCA offers a model-intrinsic explanation for VLM generalization that complements the data diversity perspective. Why: Data diversity is hard to measure and doesn't explain differences within CLIP variants.", "adopted": "Motivation for studying VLM vs VM generalization gap", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW12", "inferred_id": false, "name": "Hendrycks et al., 2021 (ImageNet-R/A)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: ImageNet-R and ImageNet-A are used as key OOD benchmarks in LCA-on-the-Line. Why: These datasets represent severe, natural distribution shifts that reveal meaningful generalization differences.", "adopted": "ImageNet-Rendition and ImageNet-Adversarial datasets as OOD evaluation benchmarks", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}], "footprint": []}, "recipes": {"title": "Solution", "files": [{"file": "constraints.md", "role": "constraints", "file_title": "Boundary Conditions and Limitations", "sections": [{"sec_id": "BC01", "heading": "BC01: LCA ineffective for visually similar OOD datasets", "kind": "kv", "fields": [{"label": "Condition", "value": "LCA distance is NOT a reliable OOD predictor for datasets with minimal visual shift from the ID dataset."}, {"label": "Affected dataset", "value": "ImageNet-v2 (recollection of ImageNet)"}, {"label": "Reason", "value": "VMs inflate ID accuracy on ImageNet-v2 because spurious correlations from ImageNet training transfer successfully to this collection (minimal external intervention). This disrupts the unbiased linear relationship that LCA establishes on truly shifted datasets."}, {"label": "Evidence", "value": "R²(LCA→ImgN-v2 Top1)=0.339 vs R²(Top1→ImgN-v2 Top1)=0.962 (Table 2)"}, {"label": "Workaround", "value": "Use ID Top-1 accuracy for ImageNet-v2 style datasets; use LCA for severely shifted datasets."}], "text": "", "warn": "", "refs": []}, {"sec_id": "BC02", "heading": "BC02: ELCA not comparable across model modalities", "kind": "kv", "fields": [{"label": "Condition", "value": "ELCA distance should NOT be used to compare VMs and VLMs."}, {"label": "Reason", "value": "ELCA is sensitive to logit temperature calibration. VLMs typically output logits with different temperature characteristics than VMs trained with cross-entropy on class labels."}, {"label": "Evidence", "value": "Stated explicitly in paper (Table 8 note)"}], "text": "", "warn": "", "refs": []}, {"sec_id": "BC03", "heading": "BC03: LCA weaker discriminator for datasets with few classes", "kind": "kv", "fields": [{"label": "Condition", "value": "LCA distance has reduced discriminative power when the dataset has a small number of classes (e.g., CIFAR-10 with 10 classes)."}, {"label": "Reason", "value": "With few classes, the semantic distance space is compressed and fewer hierarchy levels exist, reducing variation in LCA distances across models."}, {"label": "Evidence", "value": "Stated in Limitations section"}], "text": "", "warn": "", "refs": []}, {"sec_id": "BC04", "heading": "BC04: Adversarial LCA models theoretically possible", "kind": "kv", "fields": [{"label": "Condition", "value": "A model could achieve low LCA distance with zero Top-1 accuracy (adversarially designed to always predict the semantically nearest wrong class)."}, {"label": "Reason", "value": "The relationship between LCA and Top-1 is correlational, not causal."}, {"label": "Evidence", "value": "Discussed in Appendix B (\"Is it Possible for a Semantically-Aware (Low LCA) Model to Have Low Top 1 Accuracy?\")"}], "text": "", "warn": "", "refs": []}, {"sec_id": "BC05", "heading": "BC05: K-means hierarchy quality depends on source model", "kind": "kv", "fields": [{"label": "Condition", "value": "Latent hierarchies constructed from VMs produce lower-quality soft labels than those from VLMs."}, {"label": "Reason", "value": "VLMs have more regularized feature spaces over class centroids (as suggested by their lower LCA distance), so their feature clustering better approximates the WordNet semantic structure."}, {"label": "Evidence", "value": "Table 6 shows OpenCLIP(vit-l-14) produces better soft labels than MnasNet or ResNet-18"}], "text": "", "warn": "", "refs": []}, {"sec_id": "BC06", "heading": "BC06: Linear probing does not represent full fine-tuning", "kind": "kv", "fields": [{"label": "Condition", "value": "Results in Table 5/6 are for linear probes (frozen backbone + trained linear head), not for full model fine-tuning."}, {"label": "Reason", "value": "The paper does not report end-to-end training with the LCA loss, only linear probing experiments."}, {"label": "Scope", "value": "The \"pro-OOD\" setting allows slight ID accuracy drops to achieve larger OOD gains."}], "text": "", "warn": "", "refs": []}, {"sec_id": "BC07", "heading": "BC07: LCA assumes ID data as reference anchor", "kind": "kv", "fields": [{"label": "Condition", "value": "The framework uses ImageNet as a fixed reference anchor, even for VLMs not trained on ImageNet."}, {"label": "Reason", "value": "To ensure fair comparison, all models are evaluated on the same ID dataset regardless of their training data."}, {"label": "Evidence", "value": "Section 4 explicitly notes that \"ID\" and \"OOD\" are not model-specific in this context."}], "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Known Limitations (from paper)", "kind": "prose", "fields": [], "text": "No theoretical justification for the LCA-on-the-Line framework\nFuture work: causal discovery on ImageNet to construct causal class graphs\nLCA is not an effective indicator for datasets visually similar to ID data", "warn": "", "refs": []}]}, {"file": "algorithm.md", "role": "algorithm", "file_title": "Algorithm Specification", "sections": [{"sec_id": "1", "heading": "1. Information Content Node Score", "kind": "code", "code": "Algorithm: Compute Information Content\n1. For each leaf node y: p(y) = 1/K  (uniform distribution)\n2. For each internal node v (bottom-up):\n     p(v) = sum of p(children of v)\n3. For each node v:\n     I(v) = -log2(p(v))", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "2", "heading": "2. LCA Distance (Information Content Variant, D^I_LCA)", "kind": "math", "code": "$$D^I_{LCA}(y', y) := I(y) - I(N_{LCA}(y, y'))$$\nwhere $N_{LCA}(y, y')$ is the lowest common ancestor of $y$ and $y'$ in $\\mathcal{H}$.\n\nAverage over dataset:\n$$D_{LCA}(\\text{model}, \\mathcal{M}) := \\frac{1}{n}\\sum_{i=1}^{n} D^I_{LCA}(\\hat{y}_i, y_i) \\Leftrightarrow y_i \\neq \\hat{y}_i$$", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "3", "heading": "3. LCA Distance (Tree Depth Variant, D^P_LCA)", "kind": "math", "code": "$$D^P_{LCA}(y', y) := (P(y) - P(N_{LCA}(y', y))) + (P(y') - P(N_{LCA}(y', y)))$$\nThe second term compensates for tree imbalance.", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "4", "heading": "4. ELCA Distance", "kind": "math", "code": "$$D_{ELCA}(\\text{model}, \\mathcal{M}) := \\frac{1}{n}\\sum_{i=1}^{n}\\sum_{k=1}^{K} \\hat{p}_{k,i} \\cdot D_{LCA}(k, y_i)$$", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "5", "heading": "5. K-means Latent Hierarchy Construction", "kind": "code", "code": "Algorithm: Build Latent Hierarchy\nInput: Pretrained model M, dataset (X, Y), K classes, n=9 levels\n1. Compute per-class average features:\n   kX[c] = mean(M.features(X[Y==c])) for c in 0..K-1\n2. For i = 1 to 9:\n   clusters[i] = KMeans(n_clusters=2^i).fit(kX)\n3. For each class pair (c1, c2):\n   lca_height[c1, c2] = min level i where clusters[i].label(c1) == clusters[i].label(c2)\n   if no shared cluster found: lca_height[c1, c2] = 10  (base level)\n4. Return lca_height as the latent hierarchy distance matrix", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "6", "heading": "6. LCA Alignment Loss (Algorithm 1 from paper)", "kind": "code", "code": "def LCA_ALIGNMENT_LOSS(logits, targets, alignment_mode, LCA_matrix, lambda_weight=0.03):\n    # Step 1: Compute reverse LCA matrix\n    reverse_LCA_matrix = 1 - LCA_matrix\n\n    # Step 2: Compute predicted probabilities\n    probs = softmax(logits, dim=1)\n\n    # Step 3: One-hot encode targets\n    one_hot_targets = one_hot(targets, num_classes=K)\n\n    # Step 4: Standard cross-entropy loss\n    standard_loss = -sum(one_hot_targets * log(probs), dim=1)\n\n    # Step 5-10: Soft loss based on alignment_mode\n    if alignment_mode == 'BCE':\n        soft_loss = mean(BCEWithLogitsLoss(logits, reverse_LCA_matrix[targets]), dim=1)\n    elif alignment_mode == 'CE':\n        soft_loss = -mean(reverse_LCA_matrix[targets] * log(probs), dim=1)\n\n    # Step 11-12: Combine losses\n    total_loss = lambda_weight * standard_loss + soft_loss\n\n    return mean(total_loss)\n\n# Soft label construction (preprocessing, before training):\n# M_LCA = MinMax(M^T) where M[i,k] = D^P_LCA(i,k) and T=25.", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "7", "heading": "7. Weight Interpolation for Linear Probes", "kind": "math", "code": "$$W_{interp} = \\alpha \\cdot W_{CE} + (1-\\alpha) \\cdot W_{CE+soft}$$\nwhere $\\alpha \\in \\{0.0, 0.1, 0.2, \\ldots, 1.0\\}$ is selected to maximize Top-1 accuracy on ImageNet validation set.", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "8", "heading": "8. Correlation Metrics", "kind": "math", "code": "$$R^2 = 1 - \\frac{\\sum_i (y_i - f(x_i))^2}{\\sum_i (y_i - \\bar{y})^2}$$\n\n$$r_{PEA} = \\frac{\\sum_i (x_i - \\bar{x})(y_i - \\bar{y})}{\\sqrt{\\sum_i (x_i - \\bar{x})^2} \\sqrt{\\sum_i (y_i - \\bar{y})^2}}$$\n\n$$\\tau_{KEN} = \\frac{\\text{concordant pairs} - \\text{discordant pairs}}{\\frac{1}{2}n(n-1)}$$\n\n$$\\rho_{SPE} = 1 - \\frac{6\\sum_i d_i^2}{n(n^2 - 1)}$$\nwhere $d_i$ = rank difference for observation $i$. All metrics apply min-max scaling to inputs.", "text": "", "fields": [], "warn": "", "refs": []}]}, {"file": "architecture.md", "role": "architecture", "file_title": "System Architecture: LCA-on-the-Line Framework", "sections": [{"sec_id": "", "heading": "Overview", "kind": "code", "code": "[Pretrained Models] → [Feature/Prediction Extraction] → [LCA Computation] → [Correlation Analysis]\n                                                              ↓\n                                                    [Soft Label Generation]\n                                                              ↓\n                                                    [Linear Probe Training]", "text": "", "fields": [], "warn": "", "refs": []}, {"sec_id": "", "heading": "Component 1: Model Zoo", "kind": "kv", "fields": [{"label": "Purpose", "value": "Provide a diverse set of pretrained models spanning different architectures, training objectives, and data sources"}, {"label": "Inputs", "value": "Model weights from public repositories (torchvision, OpenCLIP, CLIP)"}, {"label": "Outputs", "value": "Per-sample (logit vector, prediction class, ground-truth class) tuples"}, {"label": "Sub-components", "value": "Vision Models (VMs): 36 models from torchvision pretrained on ImageNet with cross-entropy loss (AlexNet, ConvNeXt, DenseNet, EfficientNet, GoogLeNet, InceptionV3, MnasNet, MobileNetV3, RegNet, WideResNet, ResNet, ShuffleNet, SqueezeNet, Swin-B, VGG+BN variants, ViT-B/L); Vision-Language Models (VLMs): 39 models (ALBEF, BLIP, CLIP RN50/101/50x4/ViT variants, OpenCLIP 31 variants with different backbones and pretraining datasets)"}, {"label": "Interactions", "value": "Feeds into LCA Computation and Correlation Analysis"}], "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component 2: Class Hierarchy", "kind": "kv", "fields": [{"label": "Purpose", "value": "Encode inter-class semantic relationships as a tree structure for LCA computation"}, {"label": "Inputs", "value": "ImageNet class synsets"}, {"label": "Outputs", "value": "n×n pairwise LCA distance matrix, node information content values"}, {"label": "Sub-components", "value": "WordNet Hierarchy: standard lexical database, primary hierarchy used in main experiments; K-means Latent Hierarchy: constructed from pretrained model features, 9-layer hierarchical clustering with 2^i clusters per level (i=1..9), LCA height determined by first shared cluster level"}], "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component 3: LCA Distance Computation", "kind": "kv", "fields": [{"label": "Purpose", "value": "Quantify the semantic severity of model mispredictions"}, {"label": "Inputs", "value": "Per-sample (prediction, ground-truth) pairs; class hierarchy"}, {"label": "Outputs", "value": "Per-model average LCA distance (scalar)"}, {"label": "Key design choices", "value": "Use information content f(y) = -log2(p(y)) as primary node scoring function (robust to tree imbalance); use tree depth P(y) as secondary scoring for linear probing experiments; average ONLY over misclassified samples (y_i ≠ ŷ_i); generalized ELCA computes expected LCA over full predicted distribution"}], "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component 4: Correlation Analysis", "kind": "kv", "fields": [{"label": "Purpose", "value": "Establish the \"on-the-line\" linear relationship between ID LCA and OOD accuracy"}, {"label": "Inputs", "value": "Per-model ID LCA distances, per-model OOD Top-1/Top-5 accuracies (across 5 OOD datasets)"}, {"label": "Outputs", "value": "R², PEA, KEN, SPE correlation coefficients; MAE prediction errors"}, {"label": "Key design choices", "value": "Min-max scaling applied to LCA (not in [0,1]) before regression; no probit transform (unlike Miller et al. and Baek et al.); uses min-max scaling; absolute values of correlations reported"}], "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component 5: Soft Label Generation", "kind": "kv", "fields": [{"label": "Purpose", "value": "Transform class hierarchies into training signal for improved generalization"}, {"label": "Inputs", "value": "n×n LCA distance matrix (depth-based), temperature T=25"}, {"label": "Outputs", "value": "n×n normalized soft label matrix M_LCA = MinMax(M^T); reverse matrix 1 - M_LCA"}, {"label": "Key design choices", "value": "Reverse LCA matrix ensures ground truth class has highest soft label weight (=1); temperature controls smoothness: higher T → more emphasis on semantic neighbors"}], "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component 6: Linear Probe Training", "kind": "kv", "fields": [{"label": "Purpose", "value": "Demonstrate that LCA-guided supervision improves OOD generalization"}, {"label": "Inputs", "value": "Frozen backbone features, ImageNet training set, soft label matrix"}, {"label": "Outputs", "value": "Trained linear probe weights (CE baseline and CE+soft); optimal interpolation weight alpha"}, {"label": "Key design choices", "value": "Probe replaces original classifier (linear layer on pre-penultimate features → 1000 classes); weight interpolation: W_interp = αW_CE + (1-α)W_CE+soft, alpha selected to maximize ID val accuracy; AdamW optimizer with cosine LR schedule and linear warm-up"}], "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Data Flow", "kind": "steps", "steps": ["For each model: extract (logits, top-1 prediction, ground truth) on ImageNet → compute ID Top-1 accuracy and ID LCA distance", "For each model: compute OOD Top-1/Top-5 on all 5 OOD datasets", "Compute correlations between ID metrics and OOD metrics across 75 models", "(Generalization improvement path): Compute LCA soft labels → train linear probe → evaluate on all 6 datasets"], "text": "", "fields": [], "warn": "", "refs": []}]}, {"file": "heuristics.md", "role": "heuristics", "file_title": "Heuristics and Convergence Tricks", "sections": [{"sec_id": "H01", "heading": "H01: Temperature T=25 for soft label construction", "kind": "kv", "fields": [{"label": "Rationale", "value": "A large temperature value assigns higher likelihood to semantically closer classes in the soft label matrix, boosting OOD generalization. Lower temperatures produce harder (more one-hot-like) soft labels that lose hierarchical signal. T=25 was found empirically to work well."}, {"label": "Sensitivity", "value": "high"}, {"label": "Bounds", "value": "T must be positive. Higher T → softer labels → more hierarchical regularization but less ID accuracy signal. The paper uses T=25 specifically."}, {"label": "Code ref", "value": "src/execution/lca_alignment_loss.py"}, {"label": "Source", "value": "Appendix E.2"}], "text": "", "warn": "", "refs": []}, {"sec_id": "H02", "heading": "H02: Lambda=0.03 for balancing CE and soft loss", "kind": "kv", "fields": [{"label": "Rationale", "value": "A smaller lambda scales down the standard cross-entropy loss relative to the soft LCA loss. This effectively gives more weight to the taxonomy alignment signal. Very small lambda prevents the CE loss from dominating and allows the model to learn from the full soft label distribution."}, {"label": "Sensitivity", "value": "high"}, {"label": "Bounds", "value": "lambda ∈ (0, 1). Paper uses lambda=0.03. Note: total_loss = lambda * standard_loss + soft_loss, so lambda &lt; 1 means soft_loss dominates numerically."}, {"label": "Code ref", "value": "src/execution/lca_alignment_loss.py"}, {"label": "Source", "value": "Appendix E.2"}], "text": "", "warn": "", "refs": []}, {"sec_id": "H03", "heading": "H03: Alpha interpolation for ID/OOD trade-off", "kind": "kv", "fields": [{"label": "Rationale", "value": "Linear interpolation between CE-only weights and CE+soft weights allows selecting the optimal balance between ID accuracy preservation and OOD improvement. Alpha is selected on the ID validation set to avoid OOD data dependency."}, {"label": "Sensitivity", "value": "medium"}, {"label": "Bounds", "value": "alpha ∈ {0.0, 0.1, 0.2, ..., 1.0}. alpha=1.0 corresponds to CE-only; alpha=0.0 corresponds to CE+soft only. The \"no ID accuracy drop\" setting uses the alpha that maximizes ID val Top-1; the \"pro-OOD\" setting may accept slight ID drops."}, {"label": "Code ref", "value": "src/execution/lca_alignment_loss.py"}, {"label": "Source", "value": "Section 4.3.2, Table 9 (Appendix)"}], "text": "", "warn": "", "refs": []}, {"sec_id": "H04", "heading": "H04: 9-layer K-means hierarchy (2^i clusters, i=1..9)", "kind": "kv", "fields": [{"label": "Rationale", "value": "For 1000 ImageNet classes, 9 levels suffice since 2^9=512 &lt; 1000 &lt; 2^10=1024. Using hierarchical K-means (rather than full Ward-linkage) is computationally efficient and produces robust hierarchies. All class pairs share a base cluster level of 10 by default."}, {"label": "Sensitivity", "value": "low"}, {"label": "Bounds", "value": "Number of levels n must satisfy 2^n &lt; K (number of classes). For ImageNet: n=9. This produces a 9-level binary tree approximation of class relationships."}, {"label": "Code ref", "value": "src/execution/kmeans_hierarchy.py"}, {"label": "Source", "value": "Appendix E.1"}], "text": "", "warn": "", "refs": []}, {"sec_id": "H05", "heading": "H05: Min-max scaling for LCA before linear regression", "kind": "kv", "fields": [{"label": "Rationale", "value": "LCA distance values are not bounded to [0,1] (unlike Top-1 accuracy). Min-max scaling is applied before fitting linear regressions to make the scale comparable and avoid artifacts. The paper uses min-max instead of the probit transform used by Miller et al. and Baek et al."}, {"label": "Sensitivity", "value": "low"}, {"label": "Bounds", "value": "Applied only to LCA distance, not to Top-1 accuracy (already in [0,1]). Standard min-max: (x - min)/(max - min)."}, {"label": "Code ref", "value": "src/execution/eval_metrics.py"}, {"label": "Source", "value": "Section 4.2"}], "text": "", "warn": "", "refs": []}]}]}}
