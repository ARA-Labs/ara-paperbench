<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — fre</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — fre</h1>
  <p>Research DAG &middot; Unsupervised Zero-Shot Reinforcement Learning via Functional Reward Encodings</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "Can a generalist agent be pre-trained zero-shot from unlabeled offline data?",
    "description": "The central question: given only state-action trajectories (no reward labels), can we pre-train a single policy that can immediately solve any new reward-specified task at test time using a tiny sample of reward annotations, without any fine-tuning?",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Do successor feature methods generalize to arbitrary reward functions?",
        "result": "No — SF/FB methods are limited to the linear span of pre-defined state features. They fail on directional, simplex, and path tasks that require nonlinear reward representations.",
        "evidence": [
          "C02",
          "Table 1",
          "§2 Related Work"
        ],
        "children": [
          {
            "id": "N03",
            "type": "dead_end",
            "title": "Use linear reward structure (SF/FB) for zero-shot generalization",
            "hypothesis": "A linearized value function over learned features can cover the full space of downstream rewards",
            "failure_mode": "Tasks outside the linear span of features (directional movement, random simplex rewards, structured path tasks) receive near-zero performance; the approach is fundamentally limited to linear reward families.",
            "lesson": "General zero-shot RL requires moving beyond linear reward structure; we need a functional representation that can encode arbitrary reward functions."
          },
          {
            "id": "N04",
            "type": "decision",
            "title": "Encode reward functions directly by their functional output on states",
            "choice": "Learn a latent z from (state, reward) samples that compresses the reward function using a permutation-invariant encoder + information bottleneck",
            "alternatives": [
              "SF/FB: linearized value functions over pre-specified features",
              "Goal-conditioned RL: restrict to goal-reaching reward family",
              "Meta-RL: require compartmentalized per-task datasets (not available)"
            ],
            "evidence": "The functional form of any η can be approximated by a lookup table over (state, reward) pairs; encoding this set provides a universal task descriptor.",
            "children": [
              {
                "id": "N05",
                "type": "experiment",
                "title": "Can a VAE over (state, reward) sets encode diverse reward functions?",
                "result": "Yes — a transformer VAE trained with an information bottleneck loss learns compact latent representations that accurately decode rewards on held-out states.",
                "evidence": [
                  "C01",
                  "Figure 3",
                  "§4.1",
                  "Eq. 6"
                ],
                "children": [
                  {
                    "id": "N06",
                    "type": "decision",
                    "title": "Choose encoder architecture: transformer vs. RNN vs. DeepSets",
                    "choice": "Permutation-invariant transformer (no causal mask, no positional encoding) with 4 layers, 256 hidden dim, mean pooling",
                    "alternatives": [
                      "RNN/LSTM: would impose a sequential ordering on the unordered set",
                      "DeepSets: simpler but less expressive than full attention",
                      "Deterministic neural process: no information bottleneck regularization"
                    ],
                    "evidence": "Permutation invariance is required since (state, reward) pairs are an unordered set; transformers with full attention provide this naturally.",
                    "children": [
                      {
                        "id": "N07",
                        "type": "experiment",
                        "title": "What prior reward distribution should FRE train on?",
                        "result": "A mixture of singleton goal-reaching, random linear, and random MLP rewards (each 1/3) provides broad coverage without domain knowledge.",
                        "evidence": [
                          "C04",
                          "Table 4",
                          "§4.2",
                          "§5.3"
                        ],
                        "children": [
                          {
                            "id": "N08",
                            "type": "dead_end",
                            "title": "Use purely random functions (e.g., white noise) as reward prior",
                            "hypothesis": "Maximally diverse random rewards would span all possible tasks",
                            "failure_mode": "No Free Lunch theorem: purely random functions produce incompressible representations; the encoder cannot learn useful structure.",
                            "lesson": "The prior needs structured (but domain-agnostic) components; goal-reaching and polynomial-like functions provide useful inductive biases."
                          },
                          {
                            "id": "N09",
                            "type": "decision",
                            "title": "Use uniform mixture of three random reward families (FRE-all)",
                            "choice": "1/3 singleton goal-reaching (HER), 1/3 sparse random linear, 1/3 random 2-layer MLP",
                            "alternatives": [
                              "FRE-goals only: specializes to goal-reaching, fails on other tasks",
                              "FRE-lin only: specializes to directional, fails on goal-reaching",
                              "FRE-mlp only: covers complex rewards but struggles with sparse goal rewards",
                              "Adversarial reward generation: too complex, adds hyperparameters"
                            ],
                            "evidence": "Table 4: FRE-all achieves highest total score across all AntMaze task families compared to any single-family or pairwise mixture.",
                            "children": [
                              {
                                "id": "N10",
                                "type": "decision",
                                "title": "Strided vs. joint training of encoder and policy",
                                "choice": "Strided: train FRE encoder-decoder to convergence, then freeze encoder and train IQL policy with frozen z",
                                "alternatives": [
                                  "Joint end-to-end training: unstable due to non-stationarity of TD targets when encoder changes",
                                  "Alternating updates: partial stability improvement but still non-stationary"
                                ],
                                "evidence": "Empirical finding: joint training leads to unstable Q-value estimation; freezing encoder ensures stationary reward-to-z mapping.",
                                "children": [
                                  {
                                    "id": "N11",
                                    "type": "experiment",
                                    "title": "Main zero-shot comparison on AntMaze, ExORL, Kitchen",
                                    "result": "FRE (FRE-all) achieves competitive or superior performance vs. FB, SF, GC-IQL, GC-BC, OPAL across all domain/task combinations.",
                                    "evidence": [
                                      "C01",
                                      "C02",
                                      "C03",
                                      "Table 1",
                                      "§5.2"
                                    ],
                                    "children": [
                                      {
                                        "id": "N12",
                                        "type": "experiment",
                                        "title": "Domain knowledge augmentation (FRE-hint)",
                                        "result": "Augmenting the prior with domain-specific reward families (directional for AntMaze, velocity for ExORL) further improves performance on targeted tasks without algorithmic changes.",
                                        "evidence": [
                                          "C05",
                                          "Figure 6",
                                          "§5.4"
                                        ],
                                        "also_depends_on": [
                                          "N09"
                                        ]
                                      }
                                    ]
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
