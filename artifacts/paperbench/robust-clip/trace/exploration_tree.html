<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — robust-clip</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — robust-clip</h1>
  <p>Research DAG &middot; Robust CLIP: Unsupervised Adversarial Fine-Tuning of Vision Embeddings for Robust Large Vision-Language Models</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "How can we make CLIP-based LVLMs robust to adversarial vision attacks?",
    "description": "LVLMs like LLaVA and OpenFlamingo share CLIP as a frozen vision encoder. Can a single robust CLIP replacement make all downstream LVLMs robust without retraining them?",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Characterize vulnerability of original CLIP and CLIP-based LVLMs",
        "result": "Original CLIP achieves 0% robust accuracy at ε=2/255 across all zero-shot datasets. CLIP-based LLaVA is vulnerable to 100% of targeted attacks at ε=2/255 and ε=4/255.",
        "evidence": [
          "C02",
          "Table 4 ℓ∞=2/255 row",
          "Table 3 CLIP column",
          "§4.1"
        ],
        "children": [
          {
            "id": "N03",
            "type": "question",
            "title": "Can supervised adversarial fine-tuning of CLIP (TeCoA) solve the problem?",
            "description": "TeCoA (Mao et al. 2023) uses ImageNet cross-entropy loss on CLIP zero-shot logits for adversarial training.",
            "children": [
              {
                "id": "N04",
                "type": "experiment",
                "title": "Evaluate TeCoA on LVLM downstream tasks and zero-shot classification",
                "result": "TeCoA achieves robustness but drops clean average zero-shot accuracy from 73.1% to 60.0% (TeCoA2) and 54.2% (TeCoA4). LVLM captioning (COCO) drops from 115.5 to 98.4 (TeCoA2) and 88.3 (TeCoA4).",
                "evidence": [
                  "C01",
                  "Table 4 clean row",
                  "Table 1 LLaVA clean column"
                ],
                "children": [
                  {
                    "id": "N05",
                    "type": "dead_end",
                    "title": "TeCoA cosine-similarity loss ignores radial embedding direction",
                    "hypothesis": "Cross-entropy on cosine similarities would produce a broadly useful robust encoder",
                    "failure_mode": "Cosine similarity is invariant to radial rescaling: the loss can be minimized while arbitrarily distorting the unnormalized embedding, which LVLMs use directly. Mean clean embedding loss of 236.9 (TeCoA2) vs 0.0 (CLIP).",
                    "lesson": "Need a loss that explicitly preserves the unnormalized embedding, not just its direction on the hypersphere. Led to the FARE embedding preservation objective."
                  },
                  {
                    "id": "N06",
                    "type": "dead_end",
                    "title": "TeCoA trained only on ImageNet class labels — poor generalization",
                    "hypothesis": "ImageNet class text embeddings would provide sufficient coverage for robust generalization",
                    "failure_mode": "Fine-tuning only on 1000 ImageNet classes causes heavy distortion for unseen classes. Average zero-shot drop of 13.1% (TeCoA2) vs CLIP on 13 non-ImageNet datasets.",
                    "lesson": "Supervised fine-tuning creates a gap between in-distribution (ImageNet) and out-of-distribution (everything else) performance. Motivates a label-free approach."
                  }
                ]
              }
            ]
          },
          {
            "id": "N07",
            "type": "decision",
            "title": "Choose fine-tuning objective: unsupervised embedding preservation",
            "choice": "Minimize max_{||z-x||∞≤ε} ||phi(z) - phi_Org(x)||²₂ — preserve unnormalized embeddings under adversarial perturbation, no labels",
            "alternatives": [
              "Contrastive loss (SimCLR-style, Kim et al. 2020, Jiang et al. 2020): requires label-free contrastive pairs but does not preserve original embedding for zero-shot transfer",
              "BYOL-style self-supervised adversarial training (Gowal et al. 2020): requires linear head for classification, cannot be used zero-shot",
              "TeCoA supervised loss: fails as shown in N05, N06"
            ],
            "evidence": "Preserving ||phi(z) - phi_Org(x)||₂ → 0 drives phi(x) → phi_Org(x) on clean inputs (zero-shot preserved) AND forces phi(z) ≈ phi_Org(x) under adversarial z (robustness). Theorem 3.1 formalizes the connection to cosine similarity preservation.",
            "children": [
              {
                "id": "N08",
                "type": "experiment",
                "title": "Ablation: class token vs all tokens in FARE loss",
                "result": "Using only the class token for FARE loss achieves comparable downstream LVLM performance to using all tokens, while requiring less memory and compute.",
                "evidence": [
                  "Appendix B.1"
                ],
                "children": [
                  {
                    "id": "N09",
                    "type": "decision",
                    "title": "Use class token only for FARE loss computation",
                    "choice": "Compute FARE loss on class token output of ViT-L/14 only",
                    "alternatives": [
                      "All token outputs: higher memory/compute, no improvement"
                    ],
                    "evidence": "Early experiments (Appendix B.1)",
                    "children": []
                  }
                ]
              },
              {
                "id": "N10",
                "type": "experiment",
                "title": "Ablate ℓ₁ vs squared ℓ₂ norm in FARE loss",
                "result": "ℓ₁ and ℓ₂² yield essentially the same performance (48.6/33.7/21.9 vs 48.6/33.9/21.9 on avg. zero-shot clean/2/4). ℓ₂² chosen for theoretical connection to cosine similarity.",
                "evidence": [
                  "Table 9",
                  "Appendix B.4"
                ],
                "children": [
                  {
                    "id": "N11",
                    "type": "decision",
                    "title": "Use squared ℓ₂ norm for FARE loss",
                    "choice": "||phi(z) - phi_Org(x)||²₂ using squared ℓ₂ norm",
                    "alternatives": [
                      "ℓ₁ norm: comparable empirically, but sparse residuals have no theoretical motivation here"
                    ],
                    "evidence": "Table 9 ablation; theoretical connection: ||u/||u||₂ - v/||v||₂||²₂ = 2 - 2cos(u,v)",
                    "children": []
                  }
                ]
              },
              {
                "id": "N12",
                "type": "experiment",
                "title": "Ablate learning rate and weight decay (ViT-B/32 proxy)",
                "result": "LR=1e-5 yields +4.2% clean zero-shot performance vs LR=1e-4 at cost of ~5% lower ImageNet robustness. WD has negligible impact. LR=1e-5, WD=1e-4 chosen.",
                "evidence": [
                  "Table 8",
                  "Appendix B.3"
                ],
                "children": [
                  {
                    "id": "N13",
                    "type": "decision",
                    "title": "Select LR=1e-5, WD=1e-4 for FARE fine-tuning",
                    "choice": "Peak LR = 1e-5, weight decay = 1e-4, cosine schedule with 7% warmup",
                    "alternatives": [
                      "LR=1e-4: +5% ImageNet robustness but -4.2% zero-shot generalization — violates FARE's goal",
                      "LR=1e-5, WD=1e-3: identical to WD=1e-4 (no sensitivity)"
                    ],
                    "evidence": "Table 8 ablation; primary goal is preserving generalization to non-ImageNet tasks",
                    "children": []
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "id": "N14",
        "type": "experiment",
        "title": "Final evaluation: FARE vs TeCoA on all downstream tasks",
        "also_depends_on": [
          "N07",
          "N09",
          "N11",
          "N13"
        ],
        "result": "FARE2 and FARE4 outperform TeCoA2/TeCoA4 on average LVLM performance (Table 1), targeted attack robustness (Table 3), zero-shot classification on 13 non-ImageNet datasets (Table 4), hallucination (Table 5), and chain-of-thought (Table 6). Both FARE and TeCoA comparably reduce jailbreaking (Table 7).",
        "evidence": [
          "C01",
          "C02",
          "C03",
          "C04",
          "C05",
          "C06",
          "C07",
          "Tables 1-7"
        ],
        "children": []
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
