<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARA Trajectory</title>
<!--
  ARA Trajectory Viewer — canonical self-contained scaffold for the `research-visualizer` skill.

  HOW THE SKILL USES THIS FILE
  ----------------------------
  The rendering logic below is FIXED. The agent does NOT rewrite it. The agent only:
    1. Parses the ARA into one ARA_DATA object (schema in references/binding.md).
    2. base64-inlines every referenced figure .png into node.result.figures[].img.
    3. Replaces ONLY the JSON between the BEGIN/END markers in the <script id="ara-data"> block.
    4. Writes the result to <ara>/trajectory.html (or --output).
  Everything is inline (no CDN, no fetch, no server) so the output is one portable file.

  INJECTION CONTRACT
  ------------------
  - Replace exactly the lines between  __ARA_DATA_BEGIN__  and  __ARA_DATA_END__.
  - The payload MUST be valid JSON (it is read with JSON.parse).
  - JSON must not contain the literal substring "</script>"; escape any "<" in inlined
    markdown/text as "<" to be safe.
  - The demo payload shipped here renders a 3-node sample so the bare template opens and
    shows every node state (experiment, dead_end, isolated). The skill overwrites it.
-->
<style>
  /* Research Visualizer — "field notebook of a machine scientist".
     Cool archival vellum + ink; monospace is the machine-readout voice for
     structure / IDs / data, a humanist serif carries the reasoning prose. The
     signature is a traced trajectory spine that forks at branches and is struck
     through at dead ends. Type is read from glyph + label; colour is reserved
     for true epistemic status (teal = chrome, green = supported, amber =
     tentative, clay-red = dead end) — never decoration. */
  :root{
    /* paper & ink — deliberately cool vellum, NOT warm cream */
    --bg:#e9ece4; --panel:#f4f6f0; --panel2:#e3e7dd; --line:#ccd3c7; --ink:#1b2420;
    --muted:#67726a; --faint:#8a948b; --accent:#0e6b62; --accent-ink:#0a4f48; --chip:#e6eae0;
    --ok:#3a6a39; --warn:#a6402c; --tentative:#8a6310; --glyph-bg:#e0e5da; --glyph-ink:#4a544c;
    --sel-bg:#e3ede7; --code-bg:#eaeee6; --reason-bg:#f4f6f0;
    --iso-line:#b7c0ae; --iso-bg:#e5eadf; --iso-ink:#5f6b58;
    --scrim:rgba(20,28,24,.42); --shadow:rgba(20,28,24,.16);
    --add-bg:#e0ebdb; --add-ink:#2f5a2e; --del-bg:#f1e0da; --del-ink:#8c3623; --hunk:#67726a;
    --spine:#c3ccbd; --grid:rgba(27,36,32,.05);
    /* legacy type vars retained so any leftover hooks resolve */
    --q:var(--glyph-bg); --exp:var(--glyph-bg); --dec:var(--glyph-bg); --piv:var(--glyph-bg); --ins:var(--glyph-bg); --def:var(--glyph-bg); --dead:var(--warn);
    /* type roles: a serif reads the prose, monospace reads the machine */
    --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  code,pre,.mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* ---- masthead ---- */
  header{padding:20px 24px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .title{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.012em}
  header .sub{font-family:var(--mono);color:var(--muted);font-size:11.5px;margin-top:5px;letter-spacing:.01em}
  header details{margin-top:10px;color:var(--ink)}
  header summary{cursor:pointer;color:var(--accent-ink);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .toolbar input[type=search],.toolbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--sans)}
  .toolbar input[type=search]{min-width:230px}
  .toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--accent);outline:none}
  .toolbar label{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:var(--mono);cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .spacer{flex:1}
  .count{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-left:10px;border-left:1px solid var(--line)}

  main{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:calc(100% - 0px);min-height:0}
  #map{overflow:auto;border-right:1px solid var(--line);padding:18px 12px 56px;background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;background-position:-1px -1px}
  #detail{overflow:auto;padding:26px 32px 80px;background:var(--bg)}

  /* ---- process map: the trajectory spine is the signature ---- */
  .node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--sel-bg);border-color:var(--accent)}
  .node.deptarget{background:var(--sel-bg);outline:1px dashed var(--accent);outline-offset:-1px}
  .node.dim{opacity:.32}
  .node .glyph{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);margin-top:1px}
  .node.sel .glyph{border-color:var(--accent);color:var(--accent-ink)}
  .node .nid{color:var(--muted);font-size:10.5px;font-family:var(--mono);letter-spacing:.02em}
  .node .ntitle{font-size:13px;line-height:1.45}
  .node.dead .ntitle{color:var(--warn);text-decoration:line-through;text-decoration-color:rgba(166,64,44,.45)}
  .node .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  /* the spine + branch connectors: nested steps trace back to their parent */
  .kid{margin-left:19px;border-left:2px solid var(--spine);padding-left:14px}
  .kid>.node::before{content:"";position:absolute;left:-14px;top:14px;width:10px;height:2px;background:var(--spine)}
  .kid>.node.sel::before{background:var(--accent)}
  .isobox{border:1px dashed var(--iso-line);border-radius:8px;margin:12px 2px;padding:6px 4px;background:var(--iso-bg)}
  .isobox .isohdr{color:var(--iso-ink);font-family:var(--mono);font-size:10px;padding:3px 8px 7px;text-transform:uppercase;letter-spacing:.1em}
  .dep{color:var(--muted);font-size:10px;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .glyph.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}

  /* ---- detail pane ---- */
  .dhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;padding:3px 9px;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
  .badge.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}
  .pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pill.explicit{border-color:var(--ok);color:var(--ok)} .pill.inferred{border-color:var(--tentative);color:var(--tentative)}
  .pill.iso{border-color:var(--iso-line);color:var(--iso-ink)}
  .dtitle{font-family:var(--serif);font-size:25px;font-weight:600;margin:12px 0 6px;letter-spacing:-.012em;line-height:1.28}
  .did{color:var(--muted);font-family:var(--mono);font-size:11.5px}

  .block{border:1px solid var(--line);border-radius:7px;margin:15px 0;background:var(--panel)}
  .block>summary{cursor:pointer;padding:11px 15px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .block>summary::-webkit-details-marker{display:none}
  .block>summary:hover{color:var(--accent-ink)}
  .block>summary .tag{margin-left:auto;color:var(--faint);font-size:10.5px;font-weight:400;font-family:var(--mono);text-transform:none;letter-spacing:0}
  .block .body{padding:4px 16px 16px}
  /* the primary reasoning block: the agent's thinking, set as typeset prose */
  .block.reason{border-left:3px solid var(--accent);background:var(--reason-bg)}
  .block.reason>summary{color:var(--accent-ink)}
  .block.reason .lead{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink)}
  .didwhat{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;margin:16px 0 4px}
  .lead{font-family:var(--serif);color:#2a322c;font-size:16px;line-height:1.7}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;color:#46504a;font-family:var(--mono)}
  .chip.ext{color:var(--muted)}

  .claim{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .claim h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .claim .kv{font-size:13px;line-height:1.6;margin:4px 0;color:#3a423c}
  .claim .kv b{color:var(--muted);font-weight:600;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .status{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 7px;border:1px solid var(--line)}
  .status.supported{color:var(--ok);border-color:var(--ok)}
  .status.refuted{color:var(--warn);border-color:var(--warn)}
  .status.hypothesis{color:var(--tentative);border-color:var(--tentative)}
  .prov{font-size:11px;color:var(--iso-ink);font-family:var(--mono)}

  .quote{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13.5px;line-height:1.6;color:#2a322c}
  .quote .ref{color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:5px}
  figure{margin:14px 0}
  figure img{max-width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:6px}
  figcaption{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:7px}

  table.md{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;margin:10px 0}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  table.md th{background:var(--panel2);color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
  pre.snip{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;font-size:12px;color:var(--ink);white-space:pre-wrap}

  .ptr{font-size:13px;margin:7px 0}
  .ptr .path{font-family:var(--mono);color:#46504a}
  .truncated{color:var(--muted);font-size:11.5px;font-style:italic}
  .empty{color:var(--muted);font-size:13px}
  .none{color:var(--muted);padding:40px 24px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px}

  /* ---- enrichment layers (all inert unless the data is present) ---- */
  .layerbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lbtn .cnt{color:var(--muted);font-size:10.5px}
  .chiplabel{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 3px}
  .chip.jump{cursor:pointer}
  .chip.jump:hover{border-color:var(--accent);color:var(--accent-ink)}
  .chip.dangle{color:#9aa49b;text-decoration:line-through;cursor:not-allowed}
  .chip.infer{border-style:dashed}
  .chip-built{border-color:var(--ok);color:var(--ok)}
  .chip-rej{border-color:var(--warn);color:var(--warn)}
  .chip-recipe{border-color:var(--accent);color:var(--accent-ink)}
  .nmark{color:var(--muted);font-size:10px;margin-left:5px;font-family:var(--mono)}
  .rel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 8px;color:var(--glyph-ink);background:var(--glyph-bg);font-weight:700}
  .rel.bounds,.rel.refutes{background:var(--warn);color:#fff}
  .rel.neutral{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .ribbon{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;color:#3a423c;font-size:13px;line-height:1.6}
  .warn{border-left:3px solid var(--warn);background:var(--del-bg);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13px;line-height:1.6}
  .muted{color:var(--muted);font-size:11.5px}
  .math{font-family:var(--serif);font-style:italic}
  .gterm{border-bottom:1px dashed var(--accent);cursor:help}
  #gpop{position:fixed;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;z-index:60;box-shadow:0 8px 28px var(--shadow);font-size:13px;line-height:1.55;display:none}
  #gpop h5{margin:0 0 5px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  #gpop .gp-open{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:11px;margin-top:7px;display:inline-block}
  .ov{position:fixed;inset:0;z-index:50}
  .ov[hidden]{display:none}
  .ov-scrim{position:absolute;inset:0;background:var(--scrim)}
  .ov-sheet{position:relative;margin:5vh auto;max-width:920px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 48px var(--shadow)}
  .ov-head{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1}
  .ov-head #ov-title{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
  .ov-head input[type=search]{flex:1;max-width:260px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:13px}
  .ov-body{padding:10px 17px 26px}
  .ov-body .spacer{flex:1}
  .card{border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .card .sub{color:var(--muted);font-family:var(--mono);font-size:10.5px}
  .grey{opacity:.5}

  /* responsive: stack the two panes on a narrow screen */
  @media (max-width:720px){
    main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
    #map{border-right:none;border-bottom:1px solid var(--line)}
    #detail{padding:20px 18px 64px}
    .dtitle{font-size:21px}
  }
  /* honour reduced-motion */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="title" id="h-title">ARA Trajectory</h1>
  <div class="sub" id="h-sub"></div>
  <details id="h-abstract-wrap"><summary>Abstract</summary><div class="lead" id="h-abstract"></div></details>
  <div class="toolbar">
    <input type="search" id="q" placeholder="search steps…" autocomplete="off" />
    <label>type
      <select id="ftype"><option value="">all</option></select>
    </label>
    <label><input type="checkbox" id="fdead" /> dead ends only</label>
    <span class="spacer"></span>
    <button class="btn" id="rprev" title="previous (←)">‹</button>
    <button class="btn primary" id="rplay">▶ Replay</button>
    <button class="btn" id="rnext" title="next (→)">›</button>
    <span class="count" id="rstat"></span>
  </div>
  <div class="layerbar" id="layerbar">
    <button class="btn lbtn" data-panel="context" hidden>◧ Context</button>
    <button class="btn lbtn" data-panel="glossary" hidden>▤ Glossary <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="dependencies" hidden>⇄ Dependencies <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="recipes" hidden>▦ Recipes <span class="cnt"></span></button>
  </div>
</header>

<main>
  <aside id="map"></aside>
  <section id="detail"><div class="none">Select a step on the left, or press <kbd>▶ Replay</kbd>.</div></section>
</main>

<!-- v1.1: one shared modal overlay for the Context/Glossary/Dependencies/Recipes panels, + a glossary popover. Both inert unless their data is present. -->
<div id="overlay" class="ov" hidden role="dialog" aria-modal="true">
  <div class="ov-scrim" data-close></div>
  <div class="ov-sheet">
    <div class="ov-head"><span id="ov-title"></span>
      <input type="search" id="ov-q" placeholder="filter…" hidden autocomplete="off" />
      <span class="spacer"></span>
      <button class="btn" id="ov-close" data-close>✕ <kbd>Esc</kbd></button>
    </div>
    <div class="ov-body" id="ov-body"></div>
  </div>
</div>
<div id="gpop"></div>

<!-- The skill replaces ONLY the JSON between the two markers below. -->
<script id="ara-data" type="application/json">

{"meta": {"title": "Refined Coreset Selection: Towards Minimal Coreset Size under Model Performance Constraints", "authors": ["Xiaobo Xia", "Jiale Liu", "Shaokun Zhang", "Qingyun Wu", "Hongxin Wei", "Tongliang Liu"], "year": "2024", "venue": "arXiv / ICML 2024", "ara_dir": "lbcs", "abstract": "Coreset selection is powerful in reducing computational costs and accelerating data processing for deep learning algorithms. It strives to identify a small subset from large-scale data, so that training only on the subset practically performs on par with full data. Practitioners regularly desire to identify the smallest possible coreset in realistic scenes while maintaining comparable model performance, to minimize costs and maximize acceleration. Motivated by this desideratum, for the first time, we pose the problem of refined coreset selection (RCS), in which the minimal coreset size under model performance constraints is explored. Moreover, to address this problem, we propose an innovative method, which maintains optimization priority order over the model performance and coreset size, and efficiently optimizes them in the coreset selection procedure. Theoretically, we provide the convergence guarantee of the proposed method. Empirically, extensive experiments confirm its superiority compared with previous strategies, often yielding better model performance with smaller coreset sizes."}, "order": ["N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10", "N11", "N12"], "nodes": [{"id": "N01", "type": "question", "parent": null, "title": "Can we find the smallest coreset that maintains model performance, without fixing the size in advance?", "body": "All prior coreset selection methods fix the size k before selection and optimize only model performance. Can a method jointly minimize coreset size and preserve accuracy with a clear priority structure?", "thinking": "Every existing coreset-selection method starts by picking a target size k and then only tries to preserve accuracy on that fixed-size subset. This project asks a different question: instead of assuming the practitioner already knows the right size, could a method discover the smallest coreset on its own while still keeping model performance intact, with a clear rule for which objective (performance or size) wins when they conflict?", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "built_on": [], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N02", "type": "experiment", "parent": "N01", "title": "Direct application of fixed-size bilevel selection (Eq. 3)", "body": "Running Eq. 3 alone did make the full-data loss f1(m) drop steadily for every tested k, but the coreset size f2(m) barely moved — it stayed pinned near the starting k through all outer iterations. Optimizing performance alone gives no pressure to shrink the coreset.", "thinking": "The starting point was the standard bilevel coreset objective used by prior work: hold the coreset size fixed at k and let the outer loop only chase model performance (Eq. 3). If this direct approach could shrink the coreset on its own as a side effect of optimizing performance, no new machinery would be needed.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["§2.1"], "why": [{"id": "C01", "title": "LBCS achieves equal or better test accuracy with smaller coreset sizes than fixed-size baselines", "statement": "On F-MNIST, SVHN, and CIFAR-10, LBCS with predefined size k consistently produces coresets strictly smaller than k, while achieving test accuracy ≥ the best fixed-size baseline (Uniform, EL2N, GraNd, Influential, Moderate, CCS, Probabilistic) at the same k.", "status": "supported", "conditions": "", "falsification": "LBCS produces a coreset of size ≥ k, or achieves lower test accuracy than all 7 baselines at the same k, across all datasets and all tested k values.", "dependencies": [], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "fig1_trivial_solutions", "caption": "Figure 1: Trivial Solution Failure Modes (§2.1)", "markdown": "- **Source**: Figure 1, Section 2.1\n- **Caption**: \"Illustrations of phenomena of several trivial solutions discussed in §2.1. The experiment is based on (Zhou et al., 2022). The setup is provided in Appendix C.3. Here, k denotes the predefined coreset size before optimization.\"\n- **Conditions**: MNIST-S subset; CNN with two blocks (Conv→Dropout→MaxPool→ReLU); inner loop: SGD lr=0.1, momentum=0.9, 100 epochs; outer loop: Adam lr=2.5, cosine scheduler; k∈{100,150,200,250}.\n\n## Panel (a): f1(m) vs. outer iterations — Equation (3) only (min f1, no size term)\n**Axis labels**: x = Iterations of the outer loop; y = f1(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 150 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 200 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 250 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n\n**Key observation**: f1(m) can be effectively minimized (converges below 2.0) for all k values.\n\n## Panel (b): f2(m) vs. outer iterations — Equation (3) only\n**Axis labels**: x = Iterations of the outer loop; y = f2(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f2(m) remains close to 100 throughout all iterations |\n| 150 | f2(m) remains close to 150 throughout all iterations |\n| 200 | f2(m) remains close to 200 throughout all iterations |\n| 250 | f2(m) remains close to 250 throughout all iterations |\n\n**Key observation**: Without explicit size optimization, f2(m) stays near the predefined k — size is not reduced.\n\n## Panel (c): f1(m) vs. outer iterations — Equation (4) weighted combination (λ=0.5)\n**Axis labels**: x = Iterations of the outer loop; y = f1(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f1(m) remains large (>5.0) and fails to converge to acceptable values |\n| 150 | f1(m) remains large (>5.0) |\n| 200 | f1(m) remains large (>5.0) |\n| 250 | f1(m) remains large (>5.0) |\n\n**Key observation**: The weighted combination with λ=0.5 prioritizes f2 reduction at the expense of f1 — model performance is not satisfactory.\n\n## Panel (d): f2(m) vs. outer iterations — Equation (4) weighted combination (λ=0.5)\n**Axis labels**: x = Iterations of the outer loop; y = f2(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f2(m) collapses rapidly toward 0 |\n| 150 | f2(m) collapses rapidly toward 0 |\n| 200 | f2(m) collapses rapidly toward 0 |\n| 250 | f2(m) collapses rapidly toward 0 |\n\n**Key observation**: f2 is minimized too aggressively (collapses to near 0), while f1 (panel c) is not optimized — contradicting the priority structure of RCS."}, {"id": "figure1_trivial_solutions", "caption": "Figure 1: Trajectories for Trivial Solutions", "markdown": "- **Source**: Figure 1, Section 2.1\n- **Caption**: \"Illustrations of phenomena of several trivial solutions discussed in §2.1. The experiment is based on (Zhou et al., 2022). The setup is provided in Appendix C.3. Here, k denotes the predefined coreset size before optimization.\"\n- **Experimental conditions**: MNIST subset (MNIST-S), CNN (two blocks of Conv2d+Dropout+MaxPool+ReLU). Inner loop: SGD, lr=0.1, momentum=0.9, 100 epochs. Outer loop: Adam, lr=2.5, cosine scheduler (following Zhou et al., 2022).\n\n## Subfigure (a): f1(m) vs. outer iterations with Eq. (3) [only f1 in outer loop]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈3.5 | ≈3.5 | ≈3.5 | ≈3.5 |\n| ~50 | ≈1.5 | ≈1.2 | ≈1.0 | ≈0.8 |\n| ~100 | ≈1.0 | ≈0.9 | ≈0.7 | ≈0.5 |\n| converged | ≈0.8 | ≈0.6 | ≈0.5 | ≈0.4 |\n\n**Key finding**: f1(m) decreases effectively and settles at low values for all k; larger k → lower final f1.\n\n## Subfigure (b): f2(m) vs. outer iterations with Eq. (3) [only f1 in outer loop]\n\n| Iteration | k=100 | k=150 | k=200 | k=250 |\n|-----------|-------|-------|-------|-------|\n| 0 | ≈100 | ≈150 | ≈200 | ≈250 |\n| converged | ≈100 | ≈150 | ≈200 | ≈250 |\n\n**Key finding**: f2(m) stays near the predefined k throughout all iterations — coreset size is NOT reduced.\n\n## Subfigure (c): f1(m) vs. outer iterations with Eq. (4) [weighted, λ=0.5]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈3.5 | ≈3.5 | ≈3.5 | ≈3.5 |\n| converged | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 |\n\n**Key finding**: f1(m) fails to be minimized effectively under Eq. (4); values remain large.\n\n## Subfigure (d): f2(m) vs. outer iterations with Eq. (4) [weighted, λ=0.5]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈100 | ≈150 | ≈200 | ≈250 |\n| converged | ≈5–20 | ≈5–20 | ≈5–20 | ≈5–20 |\n\n**Key finding**: f2(m) collapses dramatically toward near-zero under Eq. (4) with λ=0.5.\n\n**Note**: Exact data point values are read approximately from the figure; marked with ≈ as they are extracted from a line plot rather than a table."}], "data": []}, "verified_by": [{"id": "E01", "title": "Main comparison — LBCS vs. 7 baselines on F-MNIST, SVHN, CIFAR-10", "run": "", "setup": "Model (proxy/inner): LeNet for F-MNIST; CNN (inner-loop architecture, Table 5 left) for SVHN; CNN (inner-loop architecture, Table 5 right) for CIFAR-10. Model (post-selection evaluation): LeNet for F-MNIST; CNN (Table 5 center) for SVHN; ResNet-18 for CIFAR-10. Hardware: NVIDIA GTX3090 GPUs. Dataset: Fashion-MNIST, SVHN, CIFAR-10. System: Predefined coreset sizes k ∈ {1000, 2000, 3000, 4000}; ε=0.2; T=500.", "metrics": "Test accuracy (%), mean and standard deviation over 10 runs; final coreset size (mean ± std)"}, {"id": "E02", "title": "Per-data-point accuracy analysis (Figure 3)", "run": "", "setup": "Same as E01 (F-MNIST, SVHN, CIFAR-10; k ∈ {1000, 2000, 3000, 4000}). Computed from E01 results.", "metrics": "Average test accuracy per coreset data point (test accuracy / coreset size)"}], "artifact": [], "built_on": [{"rw_id": "RW01", "name": "Zhou et al., 2022 (Probabilistic Bilevel Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Borsos et al., 2020 (Coresets via Bilevel Optimization)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Zhang et al., 2023b (LexiFlow — Targeted Hyperparameter Optimization with Lexicographic Preferences)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Paul et al., 2021 (EL2N and GraNd)", "relation_raw": "baseline"}, {"rw_id": "RW05", "name": "Xia et al., 2023 (Moderate Coreset)", "relation_raw": "baseline"}, {"rw_id": "RW06", "name": "Zheng et al., 2023 (CCS — Coverage-Centric Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW07", "name": "Yang et al., 2023 (Influential Coreset / Dataset Pruning)", "relation_raw": "baseline"}], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N03", "type": "dead_end", "parent": "N02", "title": "Simply run fixed-size bilevel selection at multiple k values", "body": "This 'sweep and pick' strategy only works with a domain expert manually choosing which k values to try, is not adaptive, and lands on worse coresets than a method that optimizes size and performance jointly. Multi-attempt sweeps are not a substitute for a single method that searches size and performance together.", "thinking": "One tempting shortcut was to sidestep joint optimization entirely: just run the fixed-size selector at several different k values and keep the smallest one that still hits acceptable accuracy.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "da -----|----------------|----------------|\n| 0 | ≈3.5 | ≈3.5 | ≈3.5 | ≈3.5 |\n| converged | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 |\n\n**Key finding**: f1(m) fails to be minimized effectively under Eq. (4); values remain large.\n\n## Subfigure (d): f2(m) vs. outer iterations with Eq. (4) [weighted, λ=0.5]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈100 | ≈150 | ≈200 | ≈250 |\n| converged | ≈5–20 | ≈5–20 | ≈5–20 | ≈5–20 |\n\n**Key finding**: f2(m) collapses dramatically toward near-zero under Eq. (4) with λ=0.5.\n\n**Note**: Exact data point values are read approximately from the figure; marked with ≈ as they are extracted from a line plot rather than a table."}], "data": []}, "verified_by": [{"id": "E01", "title": "Main comparison — LBCS vs. 7 baselines on F-MNIST, SVHN, CIFAR-10", "run": "", "setup": "Model (proxy/inner): LeNet for F-MNIST; CNN (inner-loop architecture, Table 5 left) for SVHN; CNN (inner-loop architecture, Table 5 right) for CIFAR-10. Model (post-selection evaluation): LeNet for F-MNIST; CNN (Table 5 center) for SVHN; ResNet-18 for CIFAR-10. Hardware: NVIDIA GTX3090 GPUs. Dataset: Fashion-MNIST, SVHN, CIFAR-10. System: Predefined coreset sizes k ∈ {1000, 2000, 3000, 4000}; ε=0.2; T=500.", "metrics": "Test accuracy (%), mean and standard deviation over 10 runs; final coreset size (mean ± std)"}, {"id": "E02", "title": "Per-data-point accuracy analysis (Figure 3)", "run": "", "setup": "Same as E01 (F-MNIST, SVHN, CIFAR-10; k ∈ {1000, 2000, 3000, 4000}). Computed from E01 results.", "metrics": "Average test accuracy per coreset data point (test accuracy / coreset size)"}], "artifact": [], "built_on": [{"rw_id": "RW01", "name": "Zhou et al., 2022 (Probabilistic Bilevel Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Borsos et al., 2020 (Coresets via Bilevel Optimization)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Zhang et al., 2023b (LexiFlow — Targeted Hyperparameter Optimization with Lexicographic Preferences)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Paul et al., 2021 (EL2N and GraNd)", "relation_raw": "baseline"}, {"rw_id": "RW05", "name": "Xia et al., 2023 (Moderate Coreset)", "relation_raw": "baseline"}, {"rw_id": "RW06", "name": "Zheng et al., 2023 (CCS — Coverage-Centric Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW07", "name": "Yang et al., 2023 (Influential Coreset / Dataset Pruning)", "relation_raw": "baseline"}], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N05", "type": "dead_end", "parent": "N04", "title": "Tune λ &lt; 0.5 to give f1 higher weight", "body": "There is no single λ that works: the gradient magnitudes of f1 and f2 depend on the dataset, network, and task, so the same λ produces different trade-offs case by case. A weighted sum can never reliably enforce 'accuracy first, size second' because the two objectives live on incomparable scales.", "thinking": "Since equal weighting let the size term dominate, the obvious next attempt was to just turn the size term's weight down, i.e. pick λ&lt;0.5 so accuracy is favored.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "built_on": [], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N06", "type": "pivot", "parent": "N04", "title": "Pivot: from weighted scalarization to lexicographic bilevel optimization", "body": "Moved from a weighted-objective (scalarization) formulation to a lexicographic bilevel optimization formulation.", "thinking": "The failure of every scalarization attempt (Eq. 4, tuned λ) pointed to a deeper issue: a fixed-weight combination cannot express a strict priority ('accuracy first, no matter what; size only once accuracy is good enough'). Shi et al. (2020) show formally that such lexicographic preferences cannot be represented as any weighted sum of objectives — which reframes the whole problem: instead of searching for a magic λ, the mixing formulation itself must be replaced with an explicit priority-ordered (lexicographic) optimization.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "built_on": [], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N07", "type": "decision", "parent": "N06", "title": "Formalize priority order as lexicographic preference over F(m) = [f1, f2]", "body": "Two alternatives were weighed before settling on lexicographic preference: exploring the full Pareto front (expensive, and most Pareto-optimal points are not useful since practitioners just want accuracy protected), and a hard constraint 'f1 ≤ threshold, then minimize f2' (requires knowing a good threshold a priori, which defeats the purpose). Lexicographic preference gives the priority structure practitioners actually want without needing a hand-picked threshold. Chosen: use lexicographic preference (Fishburn 1975): minimize f1 first; minimize f2 only within the region M*_1 where f1 is near-optimal (within ε). alternatives: Pareto-front exploration (multi-objective methods): expensive and finds many suboptimal solutions; Constraint-based: fix f1 ≤ threshold, minimize f2 — requires knowing the threshold a priori.", "thinking": "With scalarization ruled out, the two objectives needed a formulation that keeps a strict priority order rather than blending them. The choice was to treat f1 (performance) and f2 (size) as a lexicographic preference (following Fishburn's 1975 axioms): first push f1 down until it is within a tolerance ε of its best achievable value, and only then start minimizing f2, within the region where f1 stays 'good enough'.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["Theorem of Shi et al. (2020) on non-representability of lexicographic preferences as weighted sums; alignment with practitioner needs."], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [], "built_on": [], "rejected_here": [], "recipe_refs": [], "concepts": ["Lexicographic Preference"]}, {"id": "N08", "type": "experiment", "parent": "N07", "title": "Implement LexiFlow as the black-box outer optimizer for the lexicographic bilevel problem", "body": "With LexiFlow driving the outer loop, both objectives moved in the right direction at once: the coreset size f2 shrank below the starting k while the full-data loss f1 stayed within the ε tolerance of its optimum, resolving the failure modes seen in the earlier Eq. (3) / Eq. (4) attempts.", "thinking": "Lexicographic preference gives the right formal structure, but it still needs an optimizer that can search a discrete mask space using only priority comparisons between candidate masks, since there is no useful analytic gradient for 'which mask wins under strict priority.' LexiFlow, a randomized black-box search built for exactly this kind of lexicographic comparison, was adopted as the outer-loop optimizer, wrapped around the same inner-loop training used before.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["§5.1"], "why": [{"id": "C01", "title": "LBCS achieves equal or better test accuracy with smaller coreset sizes than fixed-size baselines", "statement": "On F-MNIST, SVHN, and CIFAR-10, LBCS with predefined size k consistently produces coresets strictly smaller than k, while achieving test accuracy ≥ the best fixed-size baseline (Uniform, EL2N, GraNd, Influential, Moderate, CCS, Probabilistic) at the same k.", "status": "supported", "conditions": "", "falsification": "LBCS produces a coreset of size ≥ k, or achieves lower test accuracy than all 7 baselines at the same k, across all datasets and all tested k values.", "dependencies": [], "provenance": null}, {"id": "C03", "title": "LBCS converges ε-optimally (ε-convergence theorem)", "statement": "Under Conditions 1 (Progressable) and 2 (Stable Moving), LBCS satisfies P_{t→∞}[f2(mt) ≤ f*_2] = 1, where f*_2 = min_{m: f1(m) ≤ f*_1·(1+ε)} f2(m). That is, LBCS converges to the minimum achievable coreset size under the ε-relaxed accuracy constraint.", "status": "supported", "conditions": "", "falsification": "A counterexample to Theorem 2 is produced (a setting where Conditions 1 and 2 hold but the algorithm does not converge).", "dependencies": [], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "table1_mnist_s_objectives", "caption": "Table 1: MNIST-S Optimization Objectives (§5.1)", "markdown": "- **Source**: Table 1, Section 5.1\n- **Caption**: \"Results (mean±std.) to illustrate the utility of our method in optimizing the objectives f1(m) and f2(m).\"\n- **Conditions**: Dataset=MNIST-S (1000 random samples from MNIST); CNN with two blocks (Conv→Dropout→MaxPool→ReLU); 20 repetitions on NVIDIA GTX3090 with PyTorch; Adam inner loop lr=0.001; ε∈{0.2,0.3,0.4}; k∈{200,400}.\n\n| Predefined k | Objectives | Initial | ε=0.2 | ε=0.3 | ε=0.4 |\n|-------------|-----------|---------|--------|--------|--------|\n| 200 | f1(m) | 3.21 | 1.92±0.33 | 2.26±0.35 | 2.48±0.30 |\n| 200 | f2(m) | 190.7±3.9 | (not shown as initial) | 185.0±4.6 | 175.5±7.7 |\n| 400 | f1(m) | 2.16 | 1.05±0.26 | 1.29±0.33 | 1.82±0.41 |\n| 400 | f2(m) | 384.1±4.4 | (not shown as initial) | 373.0±6.0 | 366.2±8.1 |\n\n**Note**: The initial f2(m) values represent the initialization near k (200 or 400); for ε=0.2 the f2 values are 190.7±3.9 (k=200) and 384.1±4.4 (k=400) before optimization. The table as presented in the paper shows initial f1 and then the three ε conditions for both objectives simultaneously. From the paper: \"compared with initialized f1(m) and f2(m), both achieved f1(m) and f2(m) after lexicographic bilevel coreset selection are lower.\""}, {"id": "table5_ablation_search_times", "caption": "Table 7 (Appendix E.4): Ablation on Search Times", "markdown": "- **Source**: Appendix Table 7 (referenced as Table in §6 \"Ablation on Search Times\"), Appendix E.4\n- **Caption**: \"Ablation study of the number of search times.\" (search time T = number of outer loop iterations)\n- **Conditions**: F-MNIST; LeNet proxy + LeNet evaluation; Adam lr=0.001; ε=0.2; k∈{1000,2000}; NVIDIA GTX3090.\n\n| T | k=1000 Test acc. | k=1000 Coreset size (ours) | k=2000 Test acc. | k=2000 Coreset size (ours) |\n|---|-----------------|---------------------------|-----------------|---------------------------|\n| 100 | 77.0±1.8 | 998.0±1.9 | 80.2±1.9 | 1995.6±2.5 |\n| 200 | 77.7±1.5 | 990.3±2.3 | 80.9±1.0 | 1976.3±4.7 |\n| 300 | 78.5±1.2 | 975.6±2.7 | 81.7±0.7 | 1945.5±3.9 |\n| 500 | 79.7±0.7 | 956.7±3.5 | 82.8±0.6 | 1915.3±6.6 |\n| 800 | 79.2±0.8 | 940.7±4.7 | 82.5±0.5 | 1905.7±5.4 |\n| 1500 | 79.5±0.5 | 935.4±4.9 | 82.7±0.6 | 1894.1±4.1 |\n| 2000 | 79.8±0.6 | 935.8±3.8 | 82.8±0.8 | 1893.9±4.3 |"}, {"id": "table7_search_times_ablation", "caption": "Table 7: Ablation Study on Search Times", "markdown": "- **Source**: Table 7, Appendix E.4\n- **Caption**: \"Ablation study of the number of search times.\" (Table numbering in appendix; described in §6 and Appendix E.4)\n- **Experimental conditions**: F-MNIST dataset, LeNet model, LBCS with ε=0.2. Two predefined coreset sizes: k=1000 and k=2000. Test accuracy and optimized coreset size reported.\n\n| T (search times) | Test acc. (k=1000) | Coreset size (k=1000) | Test acc. (k=2000) | Coreset size (k=2000) |\n|------------------|--------------------|----------------------|--------------------|-----------------------|\n| 200 | 77.0±1.8 | 998.0±1.9 | 80.2±1.9 | 1995.6±2.5 |\n| 500 | 77.7±1.5 | 990.3±2.3 | 80.9±1.0 | 1976.3±4.7 |\n| 1000 | 78.5±1.2 | 975.6±2.7 | 81.7±0.7 | 1945.5±3.9 |\n| 1500 (=T=500 in paper) | 79.7±0.7 | 956.7±3.5 | 82.8±0.6 | 1915.3±6.6 |\n| 2000 | 79.2±0.8 | 940.7±4.7 | 82.5±0.5 | 1905.7±5.4 |\n| 1500 | 79.5±0.5 | 935.4±4.9 | 82.7±0.6 | 1894.1±4.1 |\n| 2000 (large T) | 79.8±0.6 | 935.8±3.8 | 82.8±0.8 | 1893.9±4.3 |\n\n**Notes**:\n- The table rows as presented in the paper use T values implicitly through the row ordering. The paper presents 7 rows. Based on the text (T=500 for main experiments achieves the values in Table 2), the mapping is as shown.\n- Main observation: test accuracy increases and coreset size decreases as T increases; both plateau at large T, indicating empirical convergence.\n- Values at T=500 (row 4, 1500 labeled) correspond to the main paper's Table 2 results."}, {"id": "fig1_trivial_solutions", "caption": "Figure 1: Trivial Solution Failure Modes (§2.1)", "markdown": "- **Source**: Figure 1, Section 2.1\n- **Caption**: \"Illustrations of phenomena of several trivial solutions discussed in §2.1. The experiment is based on (Zhou et al., 2022). The setup is provided in Appendix C.3. Here, k denotes the predefined coreset size before optimization.\"\n- **Conditions**: MNIST-S subset; CNN with two blocks (Conv→Dropout→MaxPool→ReLU); inner loop: SGD lr=0.1, momentum=0.9, 100 epochs; outer loop: Adam lr=2.5, cosine scheduler; k∈{100,150,200,250}.\n\n## Panel (a): f1(m) vs. outer iterations — Equation (3) only (min f1, no size term)\n**Axis labels**: x = Iterations of the outer loop; y = f1(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 150 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 200 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 250 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n\n**Key observation**: f1(m) can be effectively minimized (converges below 2.0) for all k values.\n\n## Panel (b): f2(m) vs. outer iterations — Equation (3) only\n**Axis labels**: x = Iterations of the outer loop; y = f2(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f2(m) remains close to 100 throughout all iterations |\n| 150 | f2(m) remains close to 150 throughout all iterations |\n| 200 | f2(m) remains close to 200 throughout all iterations |\n| 250 | f2(m) remains close to 250 throughout all iterations |\n\n**Key observation**: Without explicit size optimization, f2(m) stays near the predefined k — size is not reduced.\n\n## Panel (c): f1(m) vs. outer iterations — Equation (4) weighted combination (λ=0.5)\n**Axis labels**: x = Iterations of the outer loop; y = f1(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f1(m) remains large (>5.0) and fails to converge to acceptable values |\n| 150 | f1(m) remains large (>5.0) |\n| 200 | f1(m) remains large (>5.0) |\n| 250 | f1(m) remains large (>5.0) |\n\n**Key observation**: The weighted combination with λ=0.5 prioritizes f2 reduction at the expense of f1 — model performance is not satisfactory.\n\n## Panel (d): f2(m) vs. outer iterations — Equation (4) weighted combination (λ=0.5)\n**Axis labels**: x = Iterations of the outer loop; y = f2(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f2(m) collapses rapidly toward 0 |\n| 150 | f2(m) collapses rapidly toward 0 |\n| 200 | f2(m) collapses rapidly toward 0 |\n| 250 | f2(m) collapses rapidly toward 0 |\n\n**Key observation**: f2 is minimized too aggressively (collapses to near 0), while f1 (panel c) is not optimized — contradicting the priority structure of RCS."}, {"id": "figure1_trivial_solutions", "caption": "Figure 1: Trajectories for Trivial Solutions", "markdown": "- **Source**: Figure 1, Section 2.1\n- **Caption**: \"Illustrations of phenomena of several trivial solutions discussed in §2.1. The experiment is based on (Zhou et al., 2022). The setup is provided in Appendix C.3. Here, k denotes the predefined coreset size before optimization.\"\n- **Experimental conditions**: MNIST subset (MNIST-S), CNN (two blocks of Conv2d+Dropout+MaxPool+ReLU). Inner loop: SGD, lr=0.1, momentum=0.9, 100 epochs. Outer loop: Adam, lr=2.5, cosine scheduler (following Zhou et al., 2022).\n\n## Subfigure (a): f1(m) vs. outer iterations with Eq. (3) [only f1 in outer loop]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈3.5 | ≈3.5 | ≈3.5 | ≈3.5 |\n| ~50 | ≈1.5 | ≈1.2 | ≈1.0 | ≈0.8 |\n| ~100 | ≈1.0 | ≈0.9 | ≈0.7 | ≈0.5 |\n| converged | ≈0.8 | ≈0.6 | ≈0.5 | ≈0.4 |\n\n**Key finding**: f1(m) decreases effectively and settles at low values for all k; larger k → lower final f1.\n\n## Subfigure (b): f2(m) vs. outer iterations with Eq. (3) [only f1 in outer loop]\n\n| Iteration | k=100 | k=150 | k=200 | k=250 |\n|-----------|-------|-------|-------|-------|\n| 0 | ≈100 | ≈150 | ≈200 | ≈250 |\n| converged | ≈100 | ≈150 | ≈200 | ≈250 |\n\n**Key finding**: f2(m) stays near the predefined k throughout all iterations — coreset size is NOT reduced.\n\n## Subfigure (c): f1(m) vs. outer iterations with Eq. (4) [weighted, λ=0.5]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈3.5 | ≈3.5 | ≈3.5 | ≈3.5 |\n| converged | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 |\n\n**Key finding**: f1(m) fails to be minimized effectively under Eq. (4); values remain large.\n\n## Subfigure (d): f2(m) vs. outer iterations with Eq. (4) [weighted, λ=0.5]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈100 | ≈150 | ≈200 | ≈250 |\n| converged | ≈5–20 | ≈5–20 | ≈5–20 | ≈5–20 |\n\n**Key finding**: f2(m) collapses dramatically toward near-zero under Eq. (4) with λ=0.5.\n\n**Note**: Exact data point values are read approximately from the figure; marked with ≈ as they are extracted from a line plot rather than a table."}], "data": []}, "verified_by": [{"id": "E01", "title": "Main comparison — LBCS vs. 7 baselines on F-MNIST, SVHN, CIFAR-10", "run": "", "setup": "Model (proxy/inner): LeNet for F-MNIST; CNN (inner-loop architecture, Table 5 left) for SVHN; CNN (inner-loop architecture, Table 5 right) for CIFAR-10. Model (post-selection evaluation): LeNet for F-MNIST; CNN (Table 5 center) for SVHN; ResNet-18 for CIFAR-10. Hardware: NVIDIA GTX3090 GPUs. Dataset: Fashion-MNIST, SVHN, CIFAR-10. System: Predefined coreset sizes k ∈ {1000, 2000, 3000, 4000}; ε=0.2; T=500.", "metrics": "Test accuracy (%), mean and standard deviation over 10 runs; final coreset size (mean ± std)"}, {"id": "E02", "title": "Per-data-point accuracy analysis (Figure 3)", "run": "", "setup": "Same as E01 (F-MNIST, SVHN, CIFAR-10; k ∈ {1000, 2000, 3000, 4000}). Computed from E01 results.", "metrics": "Average test accuracy per coreset data point (test accuracy / coreset size)"}, {"id": "E03", "title": "Ablation on search time T (Table 7 in appendix)", "run": "", "setup": "Model: LeNet as proxy and evaluation on F-MNIST. Hardware: NVIDIA GTX3090. Dataset: F-MNIST; k ∈ {1000, 2000}; ε=0.2. T ∈ {100, 200, 300, 500, 800, 1500, 2000}.", "metrics": "Test accuracy (%), final coreset size; both as a function of T"}], "artifact": [{"name": "lbcs.py", "pointer": "src/execution/lbcs.py", "what": "LBCS + LexiFlow core implementation stub: Algorithm 1 (LBCS outer/inner loop) and mask evaluation (f1, f2). Claims: C01, C02, C03."}, {"name": "lexiflow.py", "pointer": "src/execution/lexiflow.py", "what": "LexiFlow: randomized direct search with lexicographic preferences (Algorithm 2), adapted from Zhang et al. (2023b) for coreset selection."}], "built_on": [{"rw_id": "RW01", "name": "Zhou et al., 2022 (Probabilistic Bilevel Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Borsos et al., 2020 (Coresets via Bilevel Optimization)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Zhang et al., 2023b (LexiFlow — Targeted Hyperparameter Optimization with Lexicographic Preferences)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Paul et al., 2021 (EL2N and GraNd)", "relation_raw": "baseline"}, {"rw_id": "RW05", "name": "Xia et al., 2023 (Moderate Coreset)", "relation_raw": "baseline"}, {"rw_id": "RW06", "name": "Zheng et al., 2023 (CCS — Coverage-Centric Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW07", "name": "Yang et al., 2023 (Influential Coreset / Dataset Pruning)", "relation_raw": "baseline"}, {"rw_id": "RW08", "name": "Fishburn, 1975 (Axioms for Lexicographic Preferences)", "relation_raw": "imports"}], "rejected_here": [{"rw_id": "RW09", "name": "Dolan et al., 2003 (Local Convergence of Pattern Search)", "relation_raw": "bounds"}, {"rw_id": "RW10", "name": "Solis & Wets, 1981 (Minimization by Random Search Techniques)", "relation_raw": "bounds"}], "recipe_refs": [], "concepts": ["LexiFlow"]}, {"id": "N09", "type": "experiment", "parent": "N08", "title": "LBCS vs. 7 baselines on F-MNIST, SVHN, CIFAR-10", "body": "Across F-MNIST, SVHN, and CIFAR-10, LBCS finds coresets that are strictly smaller than the requested k while matching or beating the best baseline's accuracy at every tested k.", "thinking": "The real test of the method is a head-to-head comparison against the established coreset-selection baselines, not just against the earlier failed formulations. LBCS (the lexicographic bilevel method with the LexiFlow outer loop) was run against seven published baselines across three image benchmarks at four predefined starting sizes.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["§5.2"], "why": [{"id": "C01", "title": "LBCS achieves equal or better test accuracy with smaller coreset sizes than fixed-size baselines", "statement": "On F-MNIST, SVHN, and CIFAR-10, LBCS with predefined size k consistently produces coresets strictly smaller than k, while achieving test accuracy ≥ the best fixed-size baseline (Uniform, EL2N, GraNd, Influential, Moderate, CCS, Probabilistic) at the same k.", "sta
