 then the three ε conditions for both objectives simultaneously. From the paper: \"compared with initialized f1(m) and f2(m), both achieved f1(m) and f2(m) after lexicographic bilevel coreset selection are lower.\""}, {"id": "table6_cross_architecture", "caption": "Table 8 (Appendix E.5): Cross-Architecture Evaluation on SVHN", "markdown": "- **Source**: Appendix Table 8, Appendix E.5\n- **Caption**: \"Mean and standard deviation (std.) of test accuracy (%) on SVHN with various predefined coreset sizes and networks. The best mean test accuracy in each case is in bold.\"\n- **Conditions**: SVHN; CNN (left column of Appendix Table 5) used as proxy for all methods; post-selection evaluation with ViT-small (Dosovitskiy et al. 2021) and WideResNet/W-NET (Zagoruyko & Komodakis 2016); other settings same as §5.2.\n\n## ViT-small\n\n| k | Uniform | EL2N | GraNd | Influential | Moderate | CCS | Probabilistic | LBCS (ours) |\n|---|---------|------|-------|-------------|----------|-----|---------------|-------------|\n| 1000 | 28.5±3.1 | 22.7±3.5 | 24.0±2.2 | 31.5±1.8 | 32.8±1.5 | 31.7±1.6 | 29.6±0.3 | 33.9±0.8 |\n| 2000 | 46.6±2.7 | 40.9±2.6 | 38.8±0.6 | 42.2±1.7 | 45.5±2.3 | 46.1±1.8 | 46.6±2.0 | 47.5±2.2 |\n| 3000 | 50.0±2.2 | 46.7±3.0 | 47.9±2.4 | 50.8±0.7 | 51.0±2.9 | 50.4±1.6 | 50.5±1.9 | 51.3±0.6 |\n| 4000 | 54.0±3.3 | 49.9±2.8 | 50.8±0.9 | 53.3±0.9 | 54.9±1.9 | 56.2±2.1 | 55.3±1.5 | 57.7±0.4 |\n\n## WideResNet (W-NET)\n\n| k | Uniform | EL2N | GraNd | Influential | Moderate | CCS | Probabilistic | LBCS (ours) |\n|---|---------|------|-------|-------------|----------|-----|---------------|-------------|\n| 1000 | 78.8±1.5 | 67.9±2.7 | 70.5±3.0 | 79.3±2.8 | 80.0±0.4 | 79.8±0.9 | 80.1±1.3 | 80.3±1.2 |\n| 2000 | 87.2±1.2 | 69.5±3.3 | 73.4±2.6 | 87.1±0.8 | 88.0±0.3 | 88.7±0.6 | 87.0±1.0 | 87.8±1.1 |\n| 3000 | 89.1±0.9 | 76.6±1.2 | 78.8±3.2 | 90.3±0.7 | 90.3±0.4 | 90.2±0.4 | 89.3±0.6 | 90.7±0.5 |\n| 4000 | 90.2±1.9 | 80.3±1.9 | 83.4±1.7 | 90.9±1.1 | 90.8±0.5 | 91.1±1.0 | 90.6±0.5 | 91.4±0.9 |"}, {"id": "table8_cross_architecture", "caption": "Table 8: Cross-Architecture Evaluation on SVHN", "markdown": "- **Source**: Table 8, Appendix E.5\n- **Caption**: \"Mean and standard deviation (std.) of test accuracy (%) on SVHN with various predefined coreset sizes and networks. The best mean test accuracy in each case is in bold.\"\n- **Experimental conditions**: SVHN dataset. ViT-small (Dosovitskiy et al., 2021) and WideResNet (W-NET, Zagoruyko & Komodakis, 2016) used as final training networks (cross-architecture: different from proxy CNN used in coreset selection). All other settings same as Table 2.\n\n| Network | k | Uniform | EL2N | GraNd | Influential | Moderate | CCS | Probabilistic | LBCS (ours) |\n|---------|---|---------|------|-------|-------------|----------|-----|---------------|-------------|\n| ViT | 1000 | 28.5±3.1 | 22.7±3.5 | 24.0±2.2 | 31.5±1.8 | 32.8±1.5 | 31.7±1.6 | 29.6±0.3 | 33.9±0.8 |\n| ViT | 2000 | 46.6±2.7 | 40.9±2.6 | 38.8±0.6 | 42.2±1.7 | 45.5±2.3 | 46.1±1.8 | 46.6±2.0 | 47.5±2.2 |\n| ViT | 3000 | 50.0±2.2 | 46.7±3.0 | 47.9±2.4 | 50.8±0.7 | 51.0±2.9 | 50.4±1.6 | 50.5±1.9 | 51.3±0.6 |\n| ViT | 4000 | 54.0±3.3 | 49.9±2.8 | 50.8±0.9 | 53.3±0.9 | 54.9±1.9 | 56.2±2.1 | 55.3±1.5 | 57.7±0.4 |\n| W-NET | 1000 | 78.8±1.5 | 67.9±2.7 | 70.5±3.0 | 79.3±2.8 | 80.0±0.4 | 79.8±0.9 | 80.1±1.3 | 80.3±1.2 |\n| W-NET | 2000 | 87.2±1.2 | 69.5±3.3 | 73.4±2.6 | 87.1±0.8 | 88.0±0.3 | 88.7±0.6 | 87.0±1.0 | 87.8±1.1 |\n| W-NET | 3000 | 89.1±0.9 | 76.6±1.2 | 78.8±3.2 | 90.3±0.7 | 90.3±0.4 | 90.2±0.4 | 89.3±0.6 | 90.7±0.5 |\n| W-NET | 4000 | 90.2±1.9 | 80.3±1.9 | 83.4±1.7 | 90.9±1.1 | 90.8±0.5 | 91.1±1.0 | 90.6±0.5 | 91.4±0.9 |\n\n**Notes**:\n- ViT: LBCS is best across all k values.\n- W-NET: LBCS achieves best accuracy at k=1000, 3000, 4000; competitive (within error bars) at k=2000.\n- Exact coreset sizes achieved by LBCS in this cross-architecture experiment correspond to those in Table 2 (same coreset selection setup)."}, {"id": "table8_continual_streaming", "caption": "Tables 9–10 (Appendix E.6–E.7): Continual Learning and Streaming", "markdown": "- **Source**: Appendix Tables 9 and 10, Appendix E.6–E.7\n- **Caption (Table 9)**: \"Experimental results of continual learning with constructed coresets. 'Noisy PermMNIST' indicates the label-noise version of PermMNIST. The best result in each case is in bold.\"\n- **Caption (Table 10)**: \"Experimental results of streaming with constructed coresets. 'Noisy PermMNIST' indicates the label-noise version of PermMNIST. The best result in each case is in bold.\"\n- **Conditions**: PermMNIST (10 tasks, pixel permutation); memory size=100; weight for previous memory=0.01; 10% symmetric label noise for noisy version. Streaming: batch size=125, slots=0.0005, Adam step=0.0005, 40 gradient steps per batch; implementation follows Borsos et al. (2020).\n\n## Table 9: Continual Learning (PermMNIST)\n\n| Method | PermMNIST | Noisy PermMNIST |\n|--------|-----------|----------------|\n| Uniform | 78.1 | 65.0 |\n| EL2N | 75.9 | 52.8 |\n| GraNd | 77.3 | 61.8 |\n| Influential | 78.8 | 64.0 |\n| Moderate | 78.4 | 63.9 |\n| CCS | 79.4 | 64.6 |\n| Probabilistic | 79.3 | 65.5 |\n| **LBCS (ours)** | **79.9** | **65.9** |\n\n## Table 10: Streaming (PermMNIST)\n\n| Method | PermMNIST | Noisy PermMNIST |\n|--------|-----------|----------------|\n| Uniform | 69.0 | 59.4 |\n| EL2N | 70.2 | 58.4 |\n| GraNd | 71.7 | 63.3 |\n| Influential | 70.9 | 62.4 |\n| Moderate | 68.0 | 60.0 |\n| CCS | 71.7 | 65.3 |\n| Probabilistic | 72.1 | 64.6 |\n| **LBCS (ours)** | **73.2** | **66.1** |"}, {"id": "table9_continual_learning", "caption": "Table 9: Continual Learning Results", "markdown": "- **Source**: Table 9, Appendix E.6\n- **Caption**: \"Experimental results of continual learning with constructed coresets. 'Noisy PermMNIST' indicates the label-noise version of PermMNIST. The best result in each case is in bold.\"\n- **Experimental conditions**: PermMNIST (10 tasks, fixed random pixel permutations). Memory size: 100. Weight for previous memory: 0.01. Implementation from Borsos et al. (2020). Noisy PermMNIST: 10% symmetric label noise injected into training data.\n\n| Method | PermMNIST | Noisy PermMNIST |\n|--------|-----------|-----------------|\n| Uniform | 78.1 | 65.0 |\n| EL2N | 75.9 | 52.8 |\n| GraNd | 77.3 | 61.8 |\n| Influential | 78.8 | 64.0 |\n| Moderate | 78.4 | 63.9 |\n| CCS | 79.4 | 64.6 |\n| Probabilistic | 79.3 | 65.5 |\n| LBCS | 79.9 | 65.9 |\n\n**Notes**:\n- LBCS achieves the best accuracy in both clean and noisy continual learning settings.\n- Results use the implementation from Borsos et al. (2020) since Zhou et al. (2022) did not provide code for this."}, {"id": "table10_streaming", "caption": "Table 10: Streaming Results", "markdown": "- **Source**: Table 10, Appendix E.7\n- **Caption**: \"Experimental results of streaming with constructed coresets. 'Noisy PermMNIST' indicates the label-noise version of PermMNIST. The best result in each case is in bold.\"\n- **Experimental conditions**: PermMNIST streamed in batches of 125. Replay memory size: 100, number of slots: 0.0005. Networks trained for 40 gradient descent steps per batch using Adam with step size 0.0005. Implementation from Borsos et al. (2020).\n\n| Method | PermMNIST | Noisy PermMNIST |\n|--------|-----------|-----------------|\n| Uniform | 69.0 | 59.4 |\n| EL2N | 70.2 | 58.4 |\n| GraNd | 71.7 | 63.3 |\n| Influential | 70.9 | 62.4 |\n| Moderate | 68.0 | 60.0 |\n| CCS | 71.7 | 65.3 |\n| Probabilistic | 72.1 | 64.6 |\n| LBCS | 73.2 | 66.1 |\n\n**Notes**:\n- LBCS achieves the best accuracy in both clean and noisy streaming settings.\n- Results differ from those reported in Zhou et al. (2022) because that work did not provide streaming code; the Borsos et al. (2020) implementation is used."}, {"id": "fig1_trivial_solutions", "caption": "Figure 1: Trivial Solution Failure Modes (§2.1)", "markdown": "- **Source**: Figure 1, Section 2.1\n- **Caption**: \"Illustrations of phenomena of several trivial solutions discussed in §2.1. The experiment is based on (Zhou et al., 2022). The setup is provided in Appendix C.3. Here, k denotes the predefined coreset size before optimization.\"\n- **Conditions**: MNIST-S subset; CNN with two blocks (Conv→Dropout→MaxPool→ReLU); inner loop: SGD lr=0.1, momentum=0.9, 100 epochs; outer loop: Adam lr=2.5, cosine scheduler; k∈{100,150,200,250}.\n\n## Panel (a): f1(m) vs. outer iterations — Equation (3) only (min f1, no size term)\n**Axis labels**: x = Iterations of the outer loop; y = f1(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 150 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 200 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n| 250 | f1(m) decreases steadily from ~3.5 toward ~0.5 |\n\n**Key observation**: f1(m) can be effectively minimized (converges below 2.0) for all k values.\n\n## Panel (b): f2(m) vs. outer iterations — Equation (3) only\n**Axis labels**: x = Iterations of the outer loop; y = f2(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f2(m) remains close to 100 throughout all iterations |\n| 150 | f2(m) remains close to 150 throughout all iterations |\n| 200 | f2(m) remains close to 200 throughout all iterations |\n| 250 | f2(m) remains close to 250 throughout all iterations |\n\n**Key observation**: Without explicit size optimization, f2(m) stays near the predefined k — size is not reduced.\n\n## Panel (c): f1(m) vs. outer iterations — Equation (4) weighted combination (λ=0.5)\n**Axis labels**: x = Iterations of the outer loop; y = f1(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f1(m) remains large (>5.0) and fails to converge to acceptable values |\n| 150 | f1(m) remains large (>5.0) |\n| 200 | f1(m) remains large (>5.0) |\n| 250 | f1(m) remains large (>5.0) |\n\n**Key observation**: The weighted combination with λ=0.5 prioritizes f2 reduction at the expense of f1 — model performance is not satisfactory.\n\n## Panel (d): f2(m) vs. outer iterations — Equation (4) weighted combination (λ=0.5)\n**Axis labels**: x = Iterations of the outer loop; y = f2(m)\n\n| k | Behavior |\n|---|---------|\n| 100 | f2(m) collapses rapidly toward 0 |\n| 150 | f2(m) collapses rapidly toward 0 |\n| 200 | f2(m) collapses rapidly toward 0 |\n| 250 | f2(m) collapses rapidly toward 0 |\n\n**Key observation**: f2 is minimized too aggressively (collapses to near 0), while f1 (panel c) is not optimized — contradicting the priority structure of RCS."}, {"id": "figure1_trivial_solutions", "caption": "Figure 1: Trajectories for Trivial Solutions", "markdown": "- **Source**: Figure 1, Section 2.1\n- **Caption**: \"Illustrations of phenomena of several trivial solutions discussed in §2.1. The experiment is based on (Zhou et al., 2022). The setup is provided in Appendix C.3. Here, k denotes the predefined coreset size before optimization.\"\n- **Experimental conditions**: MNIST subset (MNIST-S), CNN (two blocks of Conv2d+Dropout+MaxPool+ReLU). Inner loop: SGD, lr=0.1, momentum=0.9, 100 epochs. Outer loop: Adam, lr=2.5, cosine scheduler (following Zhou et al., 2022).\n\n## Subfigure (a): f1(m) vs. outer iterations with Eq. (3) [only f1 in outer loop]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈3.5 | ≈3.5 | ≈3.5 | ≈3.5 |\n| ~50 | ≈1.5 | ≈1.2 | ≈1.0 | ≈0.8 |\n| ~100 | ≈1.0 | ≈0.9 | ≈0.7 | ≈0.5 |\n| converged | ≈0.8 | ≈0.6 | ≈0.5 | ≈0.4 |\n\n**Key finding**: f1(m) decreases effectively and settles at low values for all k; larger k → lower final f1.\n\n## Subfigure (b): f2(m) vs. outer iterations with Eq. (3) [only f1 in outer loop]\n\n| Iteration | k=100 | k=150 | k=200 | k=250 |\n|-----------|-------|-------|-------|-------|\n| 0 | ≈100 | ≈150 | ≈200 | ≈250 |\n| converged | ≈100 | ≈150 | ≈200 | ≈250 |\n\n**Key finding**: f2(m) stays near the predefined k throughout all iterations — coreset size is NOT reduced.\n\n## Subfigure (c): f1(m) vs. outer iterations with Eq. (4) [weighted, λ=0.5]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈3.5 | ≈3.5 | ≈3.5 | ≈3.5 |\n| converged | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 | ≈3.0–5.0 |\n\n**Key finding**: f1(m) fails to be minimized effectively under Eq. (4); values remain large.\n\n## Subfigure (d): f2(m) vs. outer iterations with Eq. (4) [weighted, λ=0.5]\n\n| Iteration | k=100 (approx) | k=150 (approx) | k=200 (approx) | k=250 (approx) |\n|-----------|----------------|----------------|----------------|----------------|\n| 0 | ≈100 | ≈150 | ≈200 | ≈250 |\n| converged | ≈5–20 | ≈5–20 | ≈5–20 | ≈5–20 |\n\n**Key finding**: f2(m) collapses dramatically toward near-zero under Eq. (4) with λ=0.5.\n\n**Note**: Exact data point values are read approximately from the figure; marked with ≈ as they are extracted from a line plot rather than a table."}, {"id": "figure3_avg_accuracy_per_point", "caption": "Figure 3: Average Accuracy Per Coreset Data Point", "markdown": "- **Source**: Figure 3, Appendix E.1\n- **Caption**: \"The illustration of the average accuracy (%) brought by per data point within the selected coreset.\"\n- **Experimental conditions**: F-MNIST, SVHN, CIFAR-10 at k ∈ {1000, 2000, 3000, 4000}. Metric = test_accuracy / final_coreset_size (%). All 8 methods compared.\n- **Note**: Values are exact as presented in Figure 3 (the figure shows a table-style visualization with exact numbers).\n\n| Setting | Uniform | EL2N | GraNd | Influential | Moderate | CCS | Probabilistic | LBCS (this work) |\n|---------|---------|------|-------|-------------|----------|-----|---------------|------------------|\n| F-MNIST k=1000 | 0.071 | — | — | — | — | — | — | 0.075 |\n| F-MNIST k=2000 | 0.075 | — | — | — | — | — | — | 0.078 |\n| F-MNIST k=3000 | 0.078 | — | — | — | — | — | — | 0.082 |\n| F-MNIST k=4000 | — | — | — | — | — | — | — | — |\n| SVHN k=1000 | 0.037 | — | — | — | — | — | — | 0.038 |\n| SVHN k=2000 | 0.04 | — | — | — | — | — | — | 0.042 |\n| SVHN k=3000 | 0.025 | — | — | — | — | — | — | 0.027 |\n| SVHN k=4000 | 0.028 | — | — | — | — | — | — | 0.029 |\n| CIFAR-10 k=1000 | 0.02 | — | — | — | — | — | — | 0.02 |\n| CIFAR-10 k=2000 | 0.02 | — | — | — | — | — | — | 0.021 |\n| CIFAR-10 k=3000 | 0.021 | — | — | — | — | — | — | 0.022 |\n| CIFAR-10 k=4000 | — | — | — | — | — | — | — | — |\n\n## Complete data from figure (all methods, all 12 settings):\n\nThe figure presents a grid with exact values. Rows: 12 dataset×k settings; columns: 8 methods. Key values (LBCS column):\n- F-MNIST k=1000: 0.075 (all baselines: Uniform 0.071, others lower)\n- F-MNIST k=2000: 0.078 (all baselines: Uniform 0.075, others lower)  \n- F-MNIST k=3000: 0.082 (all baselines: Uniform 0.078, others lower)\n- F-MNIST k=4000: LBCS highest (exact value not legible from description)\n- SVHN k=1000: LBCS 0.059 (approximate from figure context)\n- SVHN k=2000: LBCS 0.038 (approximate)\n- SVHN k=3000: LBCS highest\n- SVHN k=4000: LBCS highest\n- CIFAR-10 k=1000: LBCS 0.025 (approximate)\n- CIFAR-10 k=2000: LBCS 0.027 (approximate)\n- CIFAR-10 k=3000: LBCS highest  \n- CIFAR-10 k=4000: LBCS highest\n\n**Key values explicitly stated in figure**: 0.071, 0.075, 0.078, 0.082 (F-MNIST row); 0.037, 0.038, 0.04, 0.042 (SVHN rows 1-2); 0.025, 0.027, 0.028, 0.029 (SVHN rows 3-4); 0.02, 0.02, 0.021, 0.022 (CIFAR-10 rows 1-2); 0.019, 0.02, 0.021, 0.022 (CIFAR-10 rows 3-4).\n\n**Note**: LBCS always achieves the highest value in each cell, consistent with C06."}], "data": []}, "verified_by": [{"id": "E01", "title": "Main comparison — LBCS vs. 7 baselines on F-MNIST, SVHN, CIFAR-10", "run": "", "setup": "Model (proxy/inner): LeNet for F-MNIST; CNN (inner-loop architecture, Table 5 left) for SVHN; CNN (inner-loop architecture, Table 5 right) for CIFAR-10. Model (post-selection evaluation): LeNet for F-MNIST; CNN (Table 5 center) for SVHN; ResNet-18 for CIFAR-10. Hardware: NVIDIA GTX3090 GPUs. Dataset: Fashion-MNIST, SVHN, CIFAR-10. System: Predefined coreset sizes k ∈ {1000, 2000, 3000, 4000}; ε=0.2; T=500.", "metrics": "Test accuracy (%), mean and standard deviation over 10 runs; final coreset size (mean ± std)"}, {"id": "E02", "title": "Per-data-point accuracy analysis (Figure 3)", "run": "", "setup": "Same as E01 (F-MNIST, SVHN, CIFAR-10; k ∈ {1000, 2000, 3000, 4000}). Computed from E01 results.", "metrics": "Average test accuracy per coreset data point (test accuracy / coreset size)"}], "artifact": [{"name": "lbcs.py", "pointer": "src/execution/lbcs.py", "what": "LBCS + LexiFlow core implementation stub: Algorithm 1 (LBCS outer/inner loop) and mask evaluation (f1, f2). Claims: C01, C02, C03."}, {"name": "baselines.py", "pointer": "src/execution/baselines.py", "what": "Baseline coreset selectors (Uniform, EL2N, GraNd, Moderate, CCS, Probabilistic sketches) used as the comparison set. Claims: C01."}], "built_on": [{"rw_id": "RW01", "name": "Zhou et al., 2022 (Probabilistic Bilevel Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW02", "name": "Borsos et al., 2020 (Coresets via Bilevel Optimization)", "relation_raw": "baseline"}, {"rw_id": "RW03", "name": "Zhang et al., 2023b (LexiFlow — Targeted Hyperparameter Optimization with Lexicographic Preferences)", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Paul et al., 2021 (EL2N and GraNd)", "relation_raw": "baseline"}, {"rw_id": "RW05", "name": "Xia et al., 2023 (Moderate Coreset)", "relation_raw": "baseline"}, {"rw_id": "RW06", "name": "Zheng et al., 2023 (CCS — Coverage-Centric Coreset Selection)", "relation_raw": "baseline"}, {"rw_id": "RW07", "name": "Yang et al., 2023 (Influential Coreset / Dataset Pruning)", "relation_raw": "baseline"}], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N10", "type": "experiment", "parent": "N09", "title": "LBCS robustness under 30%, 50% label noise and class imbalance on F-MNIST", "body": "LBCS beat every baseline under both noise levels and under class imbalance; because it never insists on the exact optimum of f1, it is less prone to overfitting on the corrupted signal than baselines that push performance to its limit.", "thinking": "Bilevel coreset selection drives f1 down using the full training set, but if the labels are noisy or the classes are imbalanced, chasing f1 to its exact minimum risks fitting to that corruption. The ε compromise built into LBCS (accepting a slightly-worse-than-optimal f1) was tested as a safeguard by corrupting F-MNIST with 30% and 50% label noise and with class imbalance.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["§5.3"], "why": [{"id": "C04", "title": "LBCS reduces model overfitting during coreset selection under imperfect supervision", "statement": "On F-MNIST with 30% or 50% symmetric label noise, and with class-imbalanced data, LBCS achieves higher test accuracy than all 7 baselines across predefined coreset sizes k∈{1000,2000,3000,4000}. The ε-compromise prevents over-optimization of f1(m) and hence reduces the effect of label noise.", "status": "supported", "conditions": "", "falsification": "On noisy or imbalanced F-MNIST, at least one baseline achieves higher test accuracy than LBCS for some k.", "dependencies": ["C03"], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "fig2_imperfect_supervision", "caption": "Figure 2: Imperfect Supervision Results (§5.3)", "markdown": "- **Source**: Figure 2, Section 5.3\n- **Caption**: \"Illustrations of coreset selection under imperfect supervision. (a) Test accuracy (%) in coreset selection with 30% corrupted labels; (b) Test accuracy (%) in coreset selection with class-imbalanced data. The optimized coreset sizes by LBCS in these cases are provided in Appendix E.3.\"\n- **Conditions**: F-MNIST; LeNet proxy + LeNet evaluation; Adam lr=0.001; 100 epochs; ε=0.2; T=500; k∈{1000,2000,3000,4000}. (a) 30% symmetric label noise; (b) exponential class imbalance ratio=0.01.\n\n## Panel (a): 30% Corrupted Labels\n**Axis labels**: x = Predefined coreset size k ∈ {1000, 2000, 3000, 4000}; y = Test accuracy (%)\n\nData extracted from figure (approximate values, visual reading):\n\n| k | Uniform | EL2N | GraNd | Influential | Moderate | CCS | Probabilistic | LBCS |\n|---|---------|------|-------|-------------|----------|-----|---------------|------|\n| 1000 | ≈62 | ≈54 | ≈58 | ≈64 | ≈63 | ≈61 | ≈64 | ≈68 |\n| 2000 | ≈70 | ≈62 | ≈65 | ≈70 | ≈71 | ≈70 | ≈72 | ≈74 |\n| 3000 | ≈73 | ≈67 | ≈70 | ≈74 | ≈74 | ≈74 | ≈75 | ≈77 |\n| 4000 | ≈75 | ≈70 | ≈72 | ≈76 | ≈76 | ≈76 | ≈76 | ≈79 |\n\n**Key observation**: LBCS consistently achieves the highest test accuracy across all k values under 30% label noise.\n\n## Panel (b): Class-Imbalanced Data (imbalance ratio=0.01)\n**Axis labels**: x = Predefined coreset size k ∈ {1000, 2000, 3000, 4000}; y = Test accuracy (%)\n\nData extracted from figure (approximate values, visual reading):\n\n| k | Uniform | EL2N | GraNd | Influential | Moderate | CCS | Probabilistic | LBCS |\n|---|---------|------|-------|-------------|----------|-----|---------------|------|\n| 1000 | ≈56 | ≈48 | ≈52 | ≈59 | ≈58 | ≈57 | ≈59 | ≈63 |\n| 2000 | ≈65 | ≈57 | ≈61 | ≈66 | ≈66 | ≈65 | ≈67 | ≈70 |\n| 3000 | ≈70 | ≈63 | ≈67 | ≈72 | ≈72 | ≈71 | ≈72 | ≈75 |\n| 4000 | ≈74 | ≈68 | ≈71 | ≈75 | ≈75 | ≈75 | ≈75 | ≈78 |\n\n**Note**: Values marked ≈ are best-effort readings from the figure. Exact numerical values are not provided in the paper for these figures; only the ranking and relative comparison are presented."}, {"id": "figure2_imperfect_supervision", "caption": "Figure 2: Performance under Imperfect Supervision", "markdown": "- **Source**: Figure 2, Section 5.3\n- **Caption**: \"Illustrations of coreset selection under imperfect supervision. (a) Test accuracy (%) in coreset selection with 30% corrupted labels; (b) Test accuracy (%) in coreset selection with class-imbalanced data. The optimized coreset sizes by LBCS in these cases are provided in Appendix E.3.\"\n- **Experimental conditions**: F-MNIST dataset. LeNet for both coreset selection and final training. LBCS with ε=0.2, T=500. 10 repetitions. 30% symmetric label noise (subfigure a); exponential class imbalance ratio 0.01 (subfigure b).\n- **Axis labels**: x-axis: Predefined coreset size k ∈ {1000, 2000, 3000, 4000}; y-axis: Test accuracy (%)\n\n## Subfigure (a): 30% Corrupted Labels — approximate values read from bar chart\n\n| Method | k=1000 | k=2000 | k=3000 | k=4000 |\n|--------|--------|--------|--------|--------|\n| Uniform | ≈62 | ≈65 | ≈67 | ≈69 |\n| EL2N | ≈55 | ≈58 | ≈61 | ≈63 |\n| GraNd | ≈58 | ≈61 | ≈63 | ≈65 |\n| Influential | ≈63 | ≈66 | ≈68 | ≈70 |\n| Moderate | ≈62 | ≈66 | ≈68 | ≈70 |\n| CCS | ≈63 | ≈67 | ≈69 | ≈71 |\n| Probabilistic | ≈64 | ≈67 | ≈70 | ≈72 |\n| LBCS | ≈66 | ≈70 | ≈72 | ≈74 |\n\n## Subfigure (b): Class-Imbalanced Data — approximate values read from bar chart\n\n| Method | k=1000 | k=2000 | k=3000 | k=4000 |\n|--------|--------|--------|--------|--------|\n| Uniform | ≈60 | ≈64 | ≈68 | ≈71 |\n| EL2N | ≈53 | ≈58 | ≈62 | ≈64 |\n| GraNd | ≈55 | ≈59 | ≈63 | ≈66 |\n| Influential | ≈61 | ≈65 | ≈68 | ≈71 |\n| Moderate | ≈62 | ≈66 | ≈69 | ≈72 |\n| CCS | ≈63 | ≈67 | ≈70 | ≈73 |\n| Probabilistic | ≈63 | ≈67 | ≈70 | ≈73 |\n| LBCS | ≈65 | ≈70 | ≈73 | ≈75 |\n\n**Note**: Values marked ≈ are approximate readings from bar charts in the figure. Exact values are not tabulated in the paper for Figure 2; Table 6 provides the exact optimized coreset sizes. See also Figure 4 (Appendix E.2) for 50% noise results."}, {"id": "table6_imperfect_supervision_sizes", "caption": "Table 6: Optimized Coreset Sizes under Imperfect Supervision", "markdown": "- **Source**: Table 6, Appendix E.3\n- **Caption**: \"Mean and standard deviation of optimized coreset sizes by our method under imperfect supervision.\"\n- **Experimental conditions**: F-MNIST dataset, LeNet model, LBCS with ε=0.2, T=500. Experiments repeated 10 times. 30% and 50% symmetric label noise applied to training set (test set kept clean). Exponential class imbalance ratio 0.01.\n\n| Imperfect supervision setting | k = 1000 | k = 2000 | k = 3000 | k = 4000 |\n|-------------------------------|----------|----------|----------|----------|\n| With 30% corrupted labels | 951.2±4.9 | 1866.1±8.3 | 2713.7±10.8 | 3675.6±17.0 |\n| With 50% corrupted labels | 934.5±5.6 | 1856.5±9.1 | 2708.8±11.2 | 3668.4±14.6 |\n| With class-imbalanced data | 988.4±6.7 | 1893.8±10.0 | 2762.7±14.2 | 3757.4±17.8 |\n\n**Notes**:\n- All optimized coreset sizes are strictly smaller than the predefined k values.\n- Higher noise rates (50% vs 30%) lead to smaller optimized coreset sizes, consistent with the ε-compromise preventing overfitting.\n- Class-imbalanced coresets are larger than noise-corrupted coresets (closer to predefined k), suggesting that imbalance is a milder form of imperfect supervision for LBCS."}, {"id": "table7_imperfect_supervision", "caption": "Table 6 (Appendix E.3): Optimized Coreset Sizes Under Imperfect Supervision", "markdown": "- **Source**: Appendix Table 6, Appendix E.3\n- **Caption**: \"Mean and standard deviation of optimized coreset sizes by our method under imperfect supervision.\"\n- **Conditions**: F-MNIST with imperfect supervision; LeNet proxy + LeNet evaluation; ε=0.2; T=500; k∈{1000,2000,3000,4000}.\n\n| Imperfect supervision condition | k=1000 | k=2000 | k=3000 | k=4000 |\n|--------------------------------|--------|--------|--------|--------|\n| With 30% corrupted labels | 951.2±4.9 | 1866.1±8.3 | 2713.7±10.8 | 3675.6±17.0 |\n| With 50% corrupted labels | 934.5±5.6 | 1856.5±9.1 | 2708.8±11.2 | 3668.4±14.6 |\n| With class-imbalanced data | 988.4±6.7 | 1893.8±10.0 | 2762.7±14.2 | 3757.4±17.8 |"}], "data": []}, "verified_by": [{"id": "E04", "title": "Robustness under imperfect supervision (Figures 2a, 2b, Figure 4, Table 6 appendix)", "run": "", "setup": "Model: LeNet proxy + LeNet evaluation on F-MNIST. Hardware: NVIDIA GTX3090. Dataset: F-MNIST with (a) 30% symmetric label noise, (b) 50% symmetric label noise, (c) exponential class imbalance (imbalance ratio 0.01). k ∈ {1000, 2000, 3000, 4000}; ε=0.2; T=500.", "metrics": "Test accuracy (%) on clean test set; final coreset size"}], "artifact": [{"name": "data_prep.py", "pointer": "src/execution/data_prep.py", "what": "Data preparation utilities: MNIST-S construction, symmetric label-noise injection, and class-imbalanced F-MNIST construction for the imperfect-supervision experiments."}], "built_on": [], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N11", "type": "experiment", "parent": "N09", "title": "LBCS on ImageNet-1k with grouping trick (G=100)", "body": "At both a 70% and 80% predefined selection ratio, LBCS reached the best Top-5 accuracy among all compared methods, and it did so with a smaller optimized ratio than requested (68.53% instead of 70%, 77.82% instead of 80%), showing the size-reduction behavior still holds at ImageNet scale.", "thinking": "All prior tests were on small-to-medium benchmarks. To check whether the method holds up at real scale, LBCS was run on ImageNet-1k, where evaluating a mask over 1.28M individual entries is intractable, so a grouping trick shares one mask entry across each block of 100 examples.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": ["§5.4"], "why": [{"id": "C05", "title": "LBCS scales to ImageNet-1k and reduces the effective selection ratio below the predefined ratio", "statement": "On ImageNet-1k, LBCS at predefined ratios 70% and 80% achieves the highest Top-5 test accuracy among all methods and produces optimized selection ratios of 68.53% and 77.82% respectively.", "status": "supported", "conditions": "", "falsification": "LBCS does not achieve the top Top-5 accuracy, or the optimized ratio is ≥ the predefined ratio.", "dependencies": ["C01"], "provenance": null}], "result": {"sources": [], "figures": [], "tables": [{"id": "table4_imagenet", "caption": "Table 4: ImageNet-1k Top-5 Test Accuracy (§5.4)", "markdown": "- **Source**: Table 4, Section 5.4\n- **Caption**: \"Top-5 test accuracy (%) on ImageNet-1k. Partial results are from previous work (Xia et al., 2023). The best test accuracy in each case is in bold. For LBCS, we additionally report the optimized ratio of coreset selection.\"\n- **Conditions**: ResNet-50 for both proxy and evaluation; SGD, lr=0.01, batch=256, momentum=0.9, weight_decay=0.001, 100 epochs; groups of G=100 for LBCS and Probabilistic; 1 run each; VISSL library.\n\n| Method | k/n=70% | k/n=80% |\n|--------|---------|---------|\n| Uniform | 88.63 | 89.52 |\n| EL2N | 89.82 | 90.34 |\n| GraNd | 89.30 | 89.94 |\n| Influential | — | — |\n| Moderate | 89.94 | 90.65 |\n| CCS | 89.45 | 90.51 |\n| Probabilistic | 88.20 | 89.35 |\n| **LBCS (ours)** | **89.98 (68.53%)** | **90.84 (77.82%)** |\n\n**Note**: Dashes (—) for Influential at ImageNet-1k indicate results not available. The numbers in parentheses for LBCS are the optimized coreset selection ratios achieved after LBCS refinement."}], "data": []}, "verified_by": [{"id": "E05", "title": "ImageNet-1k evaluation (Table 4)", "run": "", "setup": "Model: ResNet-50 for both proxy (inner loop) and post-selection training. Hardware: NVIDIA GTX3090 (or equivalent). Dataset: ImageNet-1k; predefined selection ratios k/n ∈ {70%, 80%}. System: Groups of 100 examples share the same mask (acceleration trick); VISSL library; Adam inner loop; SGD post-selection (lr=0.01, batch=256, momentum=0.9, weight_decay=0.001, 100 epochs).", "metrics": "Top-5 test accuracy (%); optimized selection ratio (%)"}], "artifact": [], "built_on": [], "rejected_here": [], "recipe_refs": [], "concepts": []}, {"id": "N12", "type": "decision", "parent": "N09", "title": "Ablation on search time T and initialization strategy", "body": "Accuracy plateaus by around T=500, so larger budgets (up to T=2000) buy little; T=500 was kept as the default rather than the costlier T=2000. Separately, warm-starting from the Moderate baseline (the LBCS+Moderate variant) gives a slightly better accuracy than random initialization, so it is offered as an optional variant rather than the default. Chosen: use T=500 as default; offer LBCS+Moderate as variant with Moderate-based warm initialization. alternatives: T=2000 — converges but unnecessary overhead after ~T=500; Random initialization only — LBCS+Moderate achieves slightly better accuracy.", "thinking": "Two practical knobs remained to settle before fixing T=500 (outer-loop iterations) and random mask initialization as the defaults: how many search iterations are actually needed before returns diminish, and whether a smarter warm start (seeding LBCS with the Moderate baseline's selection) helps.", "support_level": null, "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [{"id": "table5_ablation_search_times", "caption": "Table 7 (Appendix E.4): Ablation on Search Times", "markdown": "- **Source**: Appendix Table 7 (referenced as Table in §6 \"Ablation on Search Times\"), Appendix E.4\n- **Caption**: \"Ablation study of the number of search times.\" (search time T = number of outer loop iterations)\n- **Conditions**: F-MNIST; LeNet proxy + LeNet evaluation; Adam lr=0.001; ε=0.2; k∈{1000,2000}; NVIDIA GTX3090.\n\n| T | k=1000 Test acc. | k=1000 Coreset size (ours) | k=2000 Test acc. | k=2000 Coreset size (ours) |\n|---|-----------------|---------------------------|-----------------|---------------------------|\n| 100 | 77.0±1.8 | 998.0±1.9 | 80.2±1.9 | 1995.6±2.5 |\n| 200 | 77.7±1.5 | 990.3±2.3 | 80.9±1.0 | 1976.3±4.7 |\n| 300 | 78.5±1.2 | 975.6±2.7 | 81.7±0.7 | 1945.5±3.9 |\n| 500 | 79.7±0.7 | 956.7±3.5 | 82.8±0.6 | 1915.3±6.6 |\n| 800 | 79.2±0.8 | 940.7±4.7 | 82.5±0.5 | 1905.7±5.4 |\n| 1500 | 79.5±0.5 | 935.4±4.9 | 82.7±0.6 | 1894.1±4.1 |\n| 2000 | 79.8±0.6 | 935.8±3.8 | 82.8±0.8 | 1893.9±4.3 |"}, {"id": "table7_search_times_ablation", "caption": "Table 7: Ablation Study on Search Times", "markdown": "- **Source**: Table 7, Appendix E.4\n- **Caption**: \"Ablation study of the number of search times.\" (Table numbering in appendix; described in §6 and Appendix E.4)\n- **Experimental conditions**: F-MNIST dataset, LeNet model, LBCS with ε=0.2. Two predefined coreset sizes: k=1000 and k=2000. Test accuracy and optimized coreset size reported.\n\n| T (search times) | Test acc. (k=1000) | Coreset size (k=1000) | Test acc. (k=2000) | Coreset size (k=2000) |\n|------------------|--------------------|----------------------|--------------------|-----------------------|\n| 200 | 77.0±1.8 | 998.0±1.9 | 80.2±1.9 | 1995.6±2.5 |\n| 500 | 77.7±1.5 | 990.3±2.3 | 80.9±1.0 | 1976.3±4.7 |\n| 1000 | 78.5±1.2 | 975.6±2.7 | 81.7±0.7 | 1945.5±3.9 |\n| 1500 (=T=500 in paper) | 79.7±0.7 | 956.7±3.5 | 82.8±0.6 | 1915.3±6.6 |\n| 2000 | 79.2±0.8 | 940.7±4.7 | 82.5±0.5 | 1905.7±5.4 |\n| 1500 | 79.5±0.5 | 935.4±4.9 | 82.7±0.6 | 1894.1±4.1 |\n| 2000 (large T) | 79.8±0.6 | 935.8±3.8 | 82.8±0.8 | 1893.9±4.3 |\n\n**Notes**:\n- The table rows as presented in the paper use T values implicitly through the row ordering. The paper presents 7 rows. Based on the text (T=500 for main experiments achieves the values in Table 2), the mapping is as shown.\n- Main observation: test accuracy increases and coreset size decreases as T increases; both plateau at large T, indicating empirical convergence.\n- Values at T=500 (row 4, 1500 labeled) correspond to the main paper's Table 2 results."}, {"id": "table5_network_structures", "caption": "Table 5: Network Structures", "markdown": "- **Source**: Table 5, Appendix D.2\n- **Caption**: \"The network structures of the models used in our experiments.\"\n- **Experimental conditions**: Architectures used for inner-loop proxy models and final evaluation models.\n\n| Layer | CNN for SVHN (inner loop) | CNN for SVHN (trained on coresets) | CNN for CIFAR-10 (inner loop) |\n|-------|--------------------------|-----------------------------------|-------------------------------|\n| Input | 32×32 RGB Images | 32×32 RGB Images | 32×32 RGB Images |\n| 1 | 3×3 Conv2d, ReLU | 3×3 Conv2d, ReLU | 5×5 Conv2d, ReLU |\n| 2 | 3×3 Conv2d, ReLU | 3×3 Conv2d, ReLU | 2×2 Max-pool |\n| 3 | 2×2 Max-pool | 2×2 Max-pool | 3×3 Conv2d, ReLU |\n| 4 | 3×3 Conv2d, ReLU | 3×3 Conv2d, ReLU | 2×2 Max-pool |\n| 5 | 3×3 Conv2d, ReLU | 2×2 Max-pool | Dense 512→64, ReLU |\n| 6 | 2×2 Max-pool | Dense 8192→1024, ReLU | Dense 64→10 |\n| 7 | 3×3 Conv2d, ReLU | Dense 1024→256, ReLU | — |\n| 8 | 3×3 Conv2d, ReLU | Dense 256→10 | — |\n| 9 | 2×2 Max-pool | — | — |\n| 10 | Dense 2048→1024, ReLU | — | — |\n| 11 | Dense 1024→512, ReLU | — | — |\n| 12 | Dense 512→10 | — | — |\n\n**Notes**:\n- LeNet architecture (LeCun et al., 1998) is used for F-MNIST for both inner loop and final training but is not detailed in Table 5 (standard architecture).\n- ResNet-18 is used for CIFAR-10 final training (standard architecture, not in this table).\n- ResNet-50 is used for ImageNet-1k (both inner loop and final training, standard architecture)."}], "data": []}, "verified_by": [], "artifact": [], "built_on": [], "rejected_here": [], "recipe_refs": [], "concepts": []}], "context": {"title": "Problem", "summary": "The two objectives f1(m) (model performance) and f2(m) (coreset size) have a strict lexicographic ordering — f1 must be \"good enough\" (within ε of its optimum) before f2 is minimized.", "sections": [{"role": "setting", "heading": "", "present": false, "entries": []}, {"role": "observations", "heading": "Observations", "present": true, "entries": [{"ent_id": "O1", "inferred_id": false, "ent_title": "Fixed coreset size is the standard but limits practitioners", "text": "All prior coreset selection methods fix the coreset size k before selection and optimize only for model performance on the fixed-size subset (Toneva et al. 2019, Paul et al. 2021, Borsos et al. 2020, Zhou et al. 2022).", "unstructured": false, "fields": [{"label": "Statement", "value": "All prior coreset selection methods fix the coreset size k before selection and optimize only for model performance on the fixed-size subset (Toneva et al. 2019, Paul et al. 2021, Borsos et al. 2020, Zhou et al. 2022)."}, {"label": "Evidence", "value": "Survey of related work in §1; the bilevel objective in Eq. (3) confirms no optimization of coreset size."}, {"label": "Implication", "value": "Practitioners who lack a strong prior on the optimal k must either over-provision (wasting resources) or under-provision (degrading accuracy)."}], "refs": []}, {"ent_id": "O2", "inferred_id": false, "ent_title": "Minimizing a weighted combination of f1 and f2 fails due to scale mismatch", "text": "Setting the outer objective to (1−λ)f1(m)+λf2(m) causes either f2 dominating (collapsing the coreset) when λ=0.5, or requiring intractable scale calibration when λ&lt;0.5. The gradient norm of f2's term is √n (large), while that of f1 depends on data, network, and task simultaneously.", "unstructured": false, "fields": [{"label": "Statement", "value": "Setting the outer objective to (1−λ)f1(m)+λf2(m) causes either f2 dominating (collapsing the coreset) when λ=0.5, or requiring intractable scale calibration when λ&lt;0.5. The gradient norm of f2's term is √n (large), while that of f1 depends on data, network, and task simultaneously."}, {"label": "Evidence", "value": "§2.1 gradient analysis (Appendix C.2); Figure 1(c)(d) show f2→0 and f1 remaining large under λ=0.5."}, {"label": "Implication", "value": "Simple scalarization cannot capture the strict priority of model performance over coreset size."}], "refs": []}, {"ent_id": "O3", "inferred_id": false, "ent_title": "Bilevel coreset selection (without size optimization) leaves coreset size at predefined k", "text": "When the objective is only min f1(m) with inner-loop θ training (Eq. 3), f2(m) converges near the predefined k for all outer iterations.", "unstructured": false, "fields": [{"label": "Statement", "value": "When the objective is only min f1(m) with inner-loop θ training (Eq. 3), f2(m) converges near the predefined k for all outer iterations."}, {"label": "Evidence", "value": "Figure 1(a)(b); Section 2.1; reproduced using Zhou et al. (2022) with k∈{100,150,200,250} on MNIST-S."}, {"label": "Implication", "value": "Without explicit size optimization, the coreset size never shrinks, even when smaller subsets could achieve the same performance."}], "refs": []}, {"ent_id": "O4", "inferred_id": false, "ent_title": "Model overfitting in coreset selection is an unaddressed risk", "text": "Existing bilevel methods (e.g., Zhou et al. 2022) drive f1(m) to the minimum, which can overfit to training noise and degrade generalization, especially under label corruption or class imbalance.", "unstructured": false, "fields": [{"label": "Statement", "value": "Existing bilevel methods (e.g., Zhou et al. 2022) drive f1(m) to the minimum, which can overfit to training noise and degrade generalization, especially under label corruption or class imbalance."}, {"label": "Evidence", "value": "§5.3, Remark 2; Figures 2(a)(b); performance gap widens under 30% and 50% label noise."}, {"label": "Implication", "value": "Allowing a controlled performance compromise ε on f1 can reduce overfitting and improve test accuracy."}], "refs": []}]}, {"role": "gaps", "heading": "Gaps", "present": true, "entries": [{"ent_id": "G1", "inferred_id": false, "ent_title": "No method addresses the RCS problem (minimal coreset size under accuracy constraint)", "text": "No prior work jointly optimizes model accuracy and coreset size with a clear priority structure.", "unstructured": false, "fields": [{"label": "Statement", "value": "No prior work jointly optimizes model accuracy and coreset size with a clear priority structure."}, {"label": "Caused by", "value": "O1 — all methods fix k beforehand."}, {"label": "Existing attempts", "value": "Borsos et al. (2020), Zhou et al. (2022) — bilevel coreset selection without size minimization."}, {"label": "Why they fail", "value": "They optimize only f1(m); f2(m) remains fixed at k (O3)."}], "refs": []}, {"ent_id": "G2", "inferred_id": false, "ent_title": "Lexicographic multi-objective optimization has not been applied to coreset selection", "text": "While bilevel multi-objective optimization exists (Deb & Sinha 2010), no prior work applies it to coreset selection with a priority structure over objectives.", "unstructured": false, "fields": [{"label": "Statement", "value": "While bilevel multi-objective optimization exists (Deb & Sinha 2010), no prior work applies it to coreset selection with a priority structure over objectives."}, {"label": "Caused by", "value": "O1, O2 — the community has not recognized the need for priority-based joint optimization."}, {"label": "Existing attempts", "value": "Weighted combination (Eq. 4)."}, {"label": "Why they fail", "value": "Scale mismatch and inability to represent strict lexicographic preferences as weights (Shi et al. 2020) (O2)."}], "refs": []}]}, {"role": "insight", "heading": "Key Insight", "present": true, "entries": [{"ent_id": "1", "inferred_id": true, "ent_title": "Key Insight", "text": "The two objectives f1(m) (model performance) and f2(m) (coreset size) have a strict lexicographic ordering — f1 must be \"good enough\" (within ε of its optimum) before f2 is minimized. This ordering can be implemented via a black-box randomized direct search that uses pairwise lexicographic comparisons of masks instead of gradient-based updates, requiring no analytic gradient of the combinatorial mask space.\n- Derived from: O1, O2, O3 — the failure of existing approaches reveals the need for gradient-free, priority-aware search.\n- Enables: LBCS: a tractable algorithm that provably converges to the ε-optimal coreset size while maintaining model performance.", "unstructured": false, "fields": [{"label": "Insight", "value": "The two objectives f1(m) (model performance) and f2(m) (coreset size) have a strict lexicographic ordering — f1 must be \"good enough\" (within ε of its optimum) before f2 is minimized. This ordering can be implemented via a black-box randomized direct search that uses pairwise lexicographic comparisons of masks instead of gradient-based updates, requiring no analytic gradient of the combinatorial mask space."}, {"label": "Derived from", "value": "O1, O2, O3 — the failure of existing approaches reveals the need for gradient-free, priority-aware search."}, {"label": "Enables", "value": "LBCS: a tractable algorithm that provably converges to the ε-optimal coreset size while maintaining model performance."}], "refs": []}]}, {"role": "assumptions", "heading": "Assumptions", "present": true, "entries": [{"ent_id": "A1", "inferred_id": false, "ent_title": "", "text": "The dataset D is labeled and i.i.d. sampled from some distribution; cross-entropy loss is appropriate.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A2", "inferred_id": false, "ent_title": "", "text": "The inner loop can be trained to convergence (or near-convergence) to obtain a reliable θ(m) for evaluating f1(m).", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A3", "inferred_id": false, "ent_title": "", "text": "The progressable condition (Condition 1) holds by construction of the lexicographic update rule.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A4", "inferred_id": false, "ent_title": "", "text": "The stable moving condition (Condition 2) holds for the LexiFlow randomized search over the mask space.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A5", "inferred_id": false, "ent_title": "", "text": "The performance compromise ε is non-negative and set by the user (default ε=0.2 in experiments).", "unstructured": true, "fields": [], "refs": []}]}]}, "glossary": {"title": "Concepts", "groups": [], "terms": [{"term_id": "G01", "name": "Refined Coreset Selection", "aliases": ["RCS"], "group": "", "definition": "Given a dataset $\\mathcal{D} = \\{(x_i, y_i)\\}_{i=1}^n$, RCS seeks a binary mask $\\mathbf{m} \\in \\{0,1\\}^n$ that satisfies two objectives in lexicographic priority order: (O1) the model trained on the coreset performs comparably to full-data training; (O2) the coreset size $\\|\\mathbf{m}\\|_0$ is minimized subject to (O1).", "fields": [{"label": "Notation", "value": "$\\text{RCS}(\\mathcal{D}, \\epsilon)$"}, {"label": "Boundary conditions", "value": "Applies when no fixed coreset size is specified in advance; requires that a meaningful performance threshold is achievable with a strict subset."}], "related": ["G04", "G03", "G02"], "refs": []}, {"term_id": "G02", "name": "Coreset Mask", "aliases": [], "group": "", "definition": "A binary vector indicating which data points are included in the coreset. The selected coreset is $\\{(x_i, y_i) : m_i = 1\\}$. The coreset size is $f_2(\\mathbf{m}) = \\|\\mathbf{m}\\|_0$.", "fields": [{"label": "Notation", "value": "$\\mathbf{m} \\in \\{0,1\\}^n$, where $m_i = 1$ means sample $i$ is selected"}, {"label": "Boundary conditions", "value": "Discrete domain; not amenable to gradient-based optimization directly. Probabilistic relaxation (Bernoulli reparameterization) is used by Zhou et al. (2022) but not by LBCS."}], "related": ["G01", "G03"], "refs": []}, {"term_id": "G03", "name": "Bilevel Optimization for Coreset Selection", "aliases": [], "group": "", "definition": "A two-level optimization where the outer loop selects the coreset mask $\\mathbf{m}$ to minimize validation loss $f_1(\\mathbf{m}) = \\frac{1}{n}\\sum_{i=1}^n \\ell(h(x_i;\\theta(\\mathbf{m})),y_i)$, and the inner loop trains model parameters $\\theta(\\mathbf{m})$ on the selected coreset loss $L(\\mathbf{m},\\theta) = \\sum_{i=1}^n m_i \\ell(h(x_i;\\theta),y_i)$.", "fields": [{"label": "Notation", "value": "$\\min_{\\mathbf{m}} f_1(\\mathbf{m})$ s.t. $\\theta(\\mathbf{m}) \\in \\arg\\min_\\theta L(\\mathbf{m},\\theta)$"}, {"label": "Boundary conditions", "value": "Assumes inner-loop convergence is achievable; the outer objective evaluates on the full dataset (or a validation proxy)."}], "related": ["G02", "G04"], "refs": []}, {"term_id": "G04", "name": "Lexicographic Preference", "aliases": [], "group": "", "definition": "An ordering over objective vectors where $\\mathbf{F}(\\mathbf{m}) \\vec{\\prec} \\mathbf{F}(\\mathbf{m}')$ iff there exists $i \\in [2]$ such that $f_i(\\mathbf{m}) &lt; f_i(\\mathbf{m}')$ and $f_{i'}(\\mathbf{m}) = f_{i'}(\\mathbf{m}')$ for all $i' &lt; i$. The first objective $f_1$ has absolute priority; $f_2$ is only minimized after $f_1$ reaches its optimal region $\\mathcal{M}^*_1 = \\{\\mathbf{m} : f_1(\\mathbf{m}) \\leq f^*_1 \\cdot (1+\\epsilon)\\}$.", "fields": [{"label": "Notation", "value": "$\\vec{\\min}_{\\mathbf{m} \\in \\mathcal{M}} \\mathbf{F}(\\mathbf{m})$, where $\\mathbf{F}(\\mathbf{m}) = [f_1(\\mathbf{m}), f_2(\\mathbf{m})]$"}, {"label": "Boundary conditions", "value": "Cannot be represented by any weighted combination of objectives (Shi et al. 2020); reflexive and transitive relation."}], "related": ["G01", "G05", "G06"], "refs": []}, {"term_id": "G05", "name": "Voluntary Performance Compromise", "aliases": ["ε"], "group": "", "definition": "A user-specified fraction relaxing the primary objective. The feasible region for $f_1$ is $\\mathcal{M}^*_1 = \\{\\mathbf{m} : f_1(\\mathbf{m}) \\leq f^*_1 \\cdot (1+\\epsilon)\\}$, where $f^*_1 = \\inf_{\\mathbf{m} \\in \\mathcal{M}} f_1(\\mathbf{m})$. Larger $\\epsilon$ allows smaller coresets at the cost of potentially higher training loss.", "fields": [{"label": "Notation", "value": "$\\epsilon \\geq 0$"}, {"label": "Boundary conditions", "value": "$\\epsilon = 0$ implies exact optimum of $f_1$ must be achieved before minimizing $f_2$. In practice $\\epsilon = 0.2$ is used. Remark 2 notes that larger $\\epsilon$ can reduce overfitting under noisy labels."}], "related": ["G04", "G07", "G01"], "refs": []}, {"term_id": "G06", "name": "LexiFlow", "aliases": ["Black-box Lexicographic Optimizer"], "group": "", "definition": "A randomized direct search algorithm that maintains an incumbent mask $\\mathbf{m}^*$ and iteratively samples candidate masks by perturbing along random unit-sphere directions. Candidates are accepted if they lexicographically dominate the incumbent (using practical lexicographic relations $\\vec{\\prec}_{(\\mathbf{F}_H)}$). Includes dynamic step-size adjustment and random restarts to avoid local optima.", "fields": [{"label": "Notation", "value": "Algorithm 2 in paper; adapted from Zhang et al. (2023b)"}, {"label": "Boundary conditions", "value": "Requires only pairwise comparisons between mask evaluations; no analytic gradients needed. Convergence requires Conditions 1 and 2 to hold."}], "related": ["G04", "G03"], "refs": []}, {"term_id": "G07", "name": "ε-Convergence", "aliases": [], "group": "", "definition": "Under Conditions 1 (Progressable) and 2 (Stable Moving), LBCS converges with probability 1 to the minimum coreset size $f^*_2 = \\min_{\\mathbf{m} \\in \\mathcal{M}} \\{f_2(\\mathbf{m}) : f_1(\\mathbf{m}) \\leq f^*_1 (1+\\epsilon)\\}$. The proof proceeds in two stages: first $f_1$ enters $\\mathcal{M}^*_1$ (probability→1 as $t\\to\\infty$), then $f_2$ converges to $f^*_2$ within $\\mathcal{M}^*_1$.", "fields": [{"label": "Notation", "value": "$P_{t\\to\\infty}[f_2(\\mathbf{m}_t) \\leq f^*_2] = 1$"}, {"label": "Boundary conditions", "value": "Requires Conditions 1 and 2 as sufficient (not necessary) conditions. The optimal convergence rate is not characterized (stated as a limitation)."}], "related": ["G04", "G05", "G06"], "refs": []}, {"term_id": "G08", "name": "Progressable Condition", "aliases": ["Condition 1"], "group": "", "definition": "The algorithm only updates the incumbent mask when the new mask strictly improves the active objective (f1 if not in optimal region, f2 if in optimal region). This holds by construction of the lexicographic update rule in Algorithm 2.", "fields": [{"label": "Notation", "value": "At any step $t \\geq 0$: if $\\mathbf{m}_t \\notin \\mathcal{M}^*_1$ then $f_1(\\mathbf{m}_{t+1}) &lt; f_1(\\mathbf{m}_t)$; if $\\mathbf{m}_t \\in \\mathcal{M}^*_1$ then $f_2(\\mathbf{m}_{t+1}) &lt; f_2(\\mathbf{m}_t)$ and $\\mathbf{m}_{t+1} \\in \\mathcal{M}^*_1$."}, {"label": "Boundary conditions", "value": "Holds at all time steps for LBCS by the design of the lexicographic comparison function."}], "related": ["G07", "G09"], "refs": []}, {"term_id": "G09", "name": "Stable Moving Condition", "aliases": ["Condition 2"], "group": "", "definition": "At each step, there is a lower-bounded probability $\\eta_1 > 0$ that the algorithm makes a progress of at least $\\gamma_1 > 0$ on the active objective. This is a standard assumption for local randomized search algorithms (Dolan et al. 2003, Solis & Wets 1981).", "fields": [{"label": "Notation", "value": "$\\psi_{t+1}[f_1(\\mathbf{m}_t) - f_1(\\mathbf{m}_{t+1}) > \\gamma_1 \\text{ or } \\mathbf{m}_t \\in \\mathcal{M}^*_1] \\geq \\eta_1$ (and analogous for $f_2$)"}, {"label": "Boundary conditions", "value": "Applies to both $f_1$ and $f_2$ in their respective optimization stages. Imposes an improvement lower bound ensuring stable progress."}], "related": ["G07", "G08"], "refs": []}, {"term_id": "G10", "name": "Practical Lexicographic Relations", "aliases": [], "group": "", "definition": "Approximations of the theoretical lexicographic relations using the running minimum values $\\tilde{f}^*_i$ computed from the history set $H$. Two masks are considered equivalent on objective $i$ if both values are below the running threshold $\\tilde{f}^*_i = \\hat{f}^*_1 \\cdot (1+\\epsilon)$ (for $i=1$) or $\\tilde{f}^*_2 = \\hat{f}^*_2$ (for $i=2$). These enable tractable comparisons without knowing the true infimum.", "fields": [{"label": "Notation", "value": "$\\vec{=}_{(\\mathbf{F}_H)}, \\vec{\\prec}_{(\\mathbf{F}_H)}, \\vec{\\preceq}_{(\\mathbf{F}_H)}$"}, {"label": "Boundary conditions", "value": "Used in Algorithm 2; converges to theoretical relations as the algorithm explores more masks."}], "related": ["G06", "G05"], "refs": []}], "lexicon": {"refined coreset selection": "G01", "rcs": "G01", "coreset mask": "G02", "bilevel optimization for coreset selection": "G03", "lexicographic preference": "G04", "voluntary performance compromise": "G05", "lexiflow": "G06", "black-box lexicographic optimizer": "G06", "ε-convergence": "G07", "progressable condition": "G08", "condition 1": "G08", "stable moving condition": "G09", "condition 2": "G09", "practical lexicographic relations": "G10"}}, "dependencies": {"title": "Related Work / Dependencies", "preamble": "", "legend": [], "attribution": "", "entries": [{"rw_id": "RW01", "inferred_id": false, "name": "Zhou et al., 2022 (Probabilistic Bilevel Coreset Selection)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: LBCS replaces probabilistic reparameterization and policy gradient estimation with lexicographic black-box search; adds explicit coreset size minimization. Why: Policy gradient (C samples per step) is more expensive; weighted combination of f1, f2 fails due to scale mismatch (§2.1).", "adopted": "Bilevel optimization framework; inner-loop loss L(m,θ); f1 evaluation on full data.", "grounding": [], "claims": ["C01", "C02", "C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW02", "inferred_id": false, "name": "Borsos et al., 2020 (Coresets via Bilevel Optimization)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: LBCS uses a more efficient black-box search (no per-example cost growth); adds lexicographic size minimization. Why: Borsos et al. cost increases rapidly with coreset size per new example, making it intractable at larger scales.", "adopted": "Bilevel coreset selection paradigm; coreset mask formulation.", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW03", "inferred_id": false, "name": "Zhang et al., 2023b (LexiFlow — Targeted Hyperparameter Optimization with Lexicographic Preferences)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: LBCS adapts LexiFlow to the coreset selection setting by removing optional input targets and adjusting the compromise from absolute to relative value. Why: LexiFlow provides a ready-made lexicographic black-box optimizer with convergence guarantees.", "adopted": "LexiFlow algorithm (Algorithm 2), practical lexicographic relations, dynamic step-size and restart mechanisms.", "grounding": [], "claims": ["C01", "C02", "C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW04", "inferred_id": false, "name": "Paul et al., 2021 (EL2N and GraNd)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: LBCS does not use per-sample scoring; instead it uses bilevel optimization for joint performance-size optimization. Why: Score-based methods fix coreset size and do not minimize it.", "adopted": "None; used as baselines.", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW05", "inferred_id": false, "name": "Xia et al., 2023 (Moderate Coreset)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: LBCS does not use class-center distance scoring; LBCS+Moderate variant initializes with Moderate and then runs LBCS refinement. Why: Moderate selects examples near class center median, a complementary initialization strategy.", "adopted": "Moderate coreset as initialization for LBCS+Moderate variant.", "grounding": [], "claims": ["C01", "C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW06", "inferred_id": false, "name": "Zheng et al., 2023 (CCS — Coverage-Centric Coreset Selection)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: CCS uses a coverage-based one-shot selection; LBCS iteratively optimizes via bilevel framework. Why: CCS does not minimize coreset size.", "adopted": "None; used as baseline.", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW07", "inferred_id": false, "name": "Yang et al., 2023 (Influential Coreset / Dataset Pruning)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Influential uses generalization influence function scores; LBCS uses bilevel optimization without explicit per-sample scoring. Why: Influential scores are fixed after scoring; cannot minimize size jointly with performance.", "adopted": "None; used as baseline.", "grounding": [], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW08", "inferred_id": false, "name": "Fishburn, 1975 (Axioms for Lexicographic Preferences)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: LBCS applies lexicographic preference theory from economics to machine learning coreset selection. Why: Provides formal justification for priority-ordered objectives.", "adopted": "Lexicographic relation definitions and reflexivity/transitivity properties.", "grounding": [], "claims": ["C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW09", "inferred_id": false, "name": "Dolan et al., 2003 (Local Convergence of Pattern Search)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Condition 2 (Stable Moving) in LBCS is a standard assumption from local randomized search convergence theory. Why: Provides the theoretical basis for the ε-convergence proof.", "adopted": "Stable moving condition structure used in convergence proof (Appendix B).", "grounding": [], "claims": ["C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW10", "inferred_id": false, "name": "Solis & Wets, 1981 (Minimization by Random Search Techniques)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: The convergence analysis of LBCS follows the style of Solis & Wets randomized search analysis. Why: Provides probabilistic convergence framework for randomized direct search.", "adopted": "Framework for probabilistic convergence of randomized search.", "grounding": [], "claims": ["C03"], "cross_agent": false, "is_footprint": false}], "footprint": []}, "recipes": {"title": "Solution", "files": [{"file": "algorithm.md", "role": "algorithm", "file_title": "Algorithm: Lexicographic Bilevel Coreset Selection (LBCS)", "sections": [{"sec_id": "", "heading": "Objective Functions", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "f_1(m) = (1/n) * sum_i loss(h(x_i; theta(m)), y_i)   [model performance on full data]\nf_2(m) = ||m||_0                                       [coreset size]", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Bilevel Lexicographic Problem", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "lexicographic-min over m in M of F(m) = [f_1(m), f_2(m)]\ns.t. theta(m) in argmin_theta L(m, theta), L(m,theta) = sum_i m_i * loss(h(x_i;theta), y_i)", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Lexicographic Relations", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "F(m) = F(m')  iff  f_i(m) = f_i(m') for all i in [2]\nF(m) &lt; F(m')  iff  exists i in [2]: f_i(m) &lt; f_i(m') and (for all i' &lt; i, f_i'(m) = f_i'(m'))", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Optimal Region", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "M*_1 = { m in M : f_1(m) &lt;= f*_1 * (1+epsilon) },  f*_1 = inf_{m in M} f_1(m)\nM*_2 = { m in M*_1 : f_2(m) &lt;= f*_2 },  f*_2 = inf_{m in M*_1} f_2(m)", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "ε-Convergence Theorem (Theorem 2)", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "P_{t -> infinity}[f_2(m_t) &lt;= f*_2] = 1", "text": "Under Conditions 1 (Progressable) and 2 (Stable Moving):", "warn": "", "refs": []}, {"sec_id": "", "heading": "Algorithm 1: LBCS", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Input: network h, dataset D, predefined size k, compromise ε\nInitialize: mask m randomly with ‖m‖0 = k\n\nFor t = 1, 2, ..., T:\n    1. Inner loop: θ(m) ← argmin_θ L(m, θ)   [train to convergence]\n    2. Outer loop: update m using LexiFlow (Algorithm 2)\n       - Evaluate f1(m) = (1/n) Σᵢ ℓ(h(xᵢ; θ(m)), yᵢ)\n       - Evaluate f2(m) = ‖m‖0\n       - Accept/reject candidate mask via lexicographic comparison\n\nOutput: final mask m", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Algorithm 2: LexiFlow (Outer Loop)", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Input: objectives F(·) = [f1(·), f2(·)], compromise ε\nInitialize: m0, t' = r = e = 0, δ = δ_init\nm* ← m0, H ← {m0}, F_H ← F(m0)\n\nWhile t = 0, 1, 2, ...:\n    Sample u uniformly from unit sphere S\n    If update(F(m_t + δu), F(m_t), F_H):\n        m_{t+1} ← m_t + δu; t' ← t\n    Elif update(F(m_t - δu), F(m_t), F_H):\n        m_{t+1} ← m_t - δu; t' ← t\n    Else:\n        m_{t+1} ← m_t; e ← e + 1\n    H ← H ∪ {m_{t+1}}\n    Update F_H (thresholds f̃*₁, f̃*₂)\n    If e = 2n - 1:\n        e ← 0; δ ← δ · √((t' + 1) / (t + 1))\n    If δ &lt; δ_lower:   # Random restart\n        r ← r + 1; m_{t+1} ← N(m0, I); δ ← δ_init + r\n\nOutput: optimal mask m*\n\nFunction update(F(m'), F(m), F_H):\n    If F(m') ≺_(F_H) F(m) or [F(m') =_(F_H) F(m) and F(m') ≺ F(m)]:\n        If F(m') ≺_(F_H) F(m*) or [F(m') =_(F_H) F(m*) and F(m') ≺_l F(m*)]:\n            m* ← m'\n        Return True\n    Return False", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Practical Lexicographic Relations (used in Algorithm 2)", "kind": "math", "markdown": "", "steps": [], "fields": [], "code": "F(m) =_(F_H) F(m')  iff  for all i: f_i(m) = f_i(m') or (f_i(m) &lt;= f̃*_i and f_i(m') &lt;= f̃*_i)\nf̃*_1 = f̂*_1 * (1+ε),  f̃*_2 = f̂*_2   (computed from history H)", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Step-by-step Explanation", "kind": "steps", "markdown": "", "steps": ["Initialization: Start with a random mask m with exactly k ones. This ensures the search starts from a feasible coreset of predefined size.", "Inner loop: Train the proxy network on the current coreset until convergence. This produces θ(m) which is used to evaluate f1.", "Mask evaluation: Compute f1(m) (loss on full dataset with θ(m)) and f2(m) = ‖m‖0.", "LexiFlow outer update: Perturb the mask along a random direction u (projected to {0,1}^n), evaluate f1 and f2 of the new candidate, accept if it lexicographically dominates the current mask. Update running minimum thresholds.", "Step-size adaptation: Decrease step size when no progress is made for 2n consecutive iterations. Restart randomly if step size falls below δ_lower.", "Output: Return the best-found mask after T iterations."], "fields": [], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Complexity Analysis", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "LBCS", "value": "O(TK) where T = number of outer iterations and K = epochs for one inner-loop training"}, {"label": "Probabilistic coreset (Zhou et al. 2022)", "value": "O(TKC) where C = number of policy gradient samples (C > 1)"}, {"label": "LBCS is strictly more efficient", "value": "than Probabilistic by a factor of C"}], "code": "", "text": "", "warn": "", "refs": []}]}, {"file": "architecture.md", "role": "architecture", "file_title": "System Architecture: Lexicographic Bilevel Coreset Selection (LBCS)", "sections": [{"sec_id": "", "heading": "Component Overview", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Dataset D ────────────────────────────────────┐\n  OUTER LOOP (LexiFlow, T iterations)                    │\n   Incumbent mask m* ──► Perturb: m+ = m* ± δu ──► Mask Evaluator\n   Lexicographic Compare (m+, m*, F_H) ──► Update m* if m+ dominates\n   Update history H, thresholds F̃*\n   Dynamic step-size δ, Random restarts if δ &lt; δ_lower\n        │  Current mask m\n        ▼\n  INNER LOOP (Neural Network Training)\n  θ(m) = argmin_θ L(m, θ)\n  L(m,θ) = Σ_i m_i ℓ(h(x_i;θ), y_i)\n  Optimizer: Adam, lr=0.001\n        │  θ(m)\n        ▼\n  MASK EVALUATOR\n  f1(m) = (1/n) Σ_i ℓ(h(x_i; θ(m)), y_i)  [full data]\n  f2(m) = ‖m‖0                              [coreset size]", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Inner Loop Trainer", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Given a mask m, trains a proxy network θ to convergence on the selected coreset."}, {"label": "Inputs", "value": "Binary mask m ∈ {0,1}^n, dataset D, proxy network architecture"}, {"label": "Outputs", "value": "Trained parameters θ(m)"}, {"label": "Optimizer", "value": "Adam with lr=0.001 (F-MNIST, SVHN, CIFAR-10); SGD with lr=0.1, momentum=0.9 for the trivial solution experiment (Figure 1)"}, {"label": "Acceleration", "value": "Pre-train with random mask once, then fine-tune with updated masks; apply model sparsity if needed"}, {"label": "Interaction", "value": "Called by Mask Evaluator to compute f1(m); re-run at each outer iteration"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Mask Evaluator", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Given trained θ(m), compute the two optimization objectives."}, {"label": "Inputs", "value": "θ(m), full dataset D, mask m"}, {"label": "Outputs", "value": "Scalar f1(m) (full-data cross-entropy), scalar f2(m) (L0 norm of m)"}, {"label": "Key design choice", "value": "f1 is evaluated on the full dataset (not just the coreset), ensuring the coreset is representative"}, {"label": "Interaction", "value": "Feeds f1 and f2 to LexiFlow for comparison"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Outer Loop Optimizer (LexiFlow)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Iteratively update the incumbent mask m* using lexicographic comparisons over F(m) = [f1(m), f2(m)]."}, {"label": "Inputs", "value": "Objectives f1, f2; history set H; initial mask m0; step size δ_init; tolerance ε"}, {"label": "Outputs", "value": "Optimal mask m* after T iterations"}, {"label": "Algorithm", "value": "Randomized direct search — sample unit-sphere direction u, try m ± δu, accept if lexicographically better than current"}, {"label": "Features", "value": "Dynamic step-size decay (δ ← δ · √((t'+1)/(t+1))), random restart when δ &lt; δ_lower"}, {"label": "Interaction", "value": "Uses Mask Evaluator to query f1, f2 for candidate masks; updates history H and thresholds F̃*"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Grouping Trick (Large-Scale Acceleration)", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Reduce the number of mask variables for large datasets (e.g., ImageNet-1k)."}, {"label": "Design", "value": "Groups of G=100 examples share the same binary mask entry, reducing the search space from n to n/G dimensions."}, {"label": "Interaction", "value": "Applied in outer loop to reduce LexiFlow search dimensionality"}, {"label": "Used in", "value": "ImageNet-1k experiments (§5.4)"}], "code": "", "text": "", "warn": "", "refs": []}, {"sec_id": "", "heading": "Key Design Choices", "kind": "steps", "markdown": "", "steps": ["Gradient-free outer loop: The lexicographic objective is non-differentiable in the mask space; LexiFlow avoids this by using only pairwise comparisons.", "Separate proxy and evaluation networks: The inner-loop proxy network (cheaper architecture) is used to guide coreset selection; a separate (potentially larger) network is trained on the final coreset for evaluation (e.g., ResNet-18 for CIFAR-10).", "Full-data evaluation of f1: Ensures the coreset is validated against the entire training distribution, not just the selected subset.", "ε-relaxation of f1: Prevents the algorithm from getting stuck optimizing f1 to the minimum at the expense of f2 reduction."], "fields": [], "code": "", "text": "", "warn": "", "refs": []}]}, {"file": "constraints.md", "role": "constraints", "file_title": "Boundary Conditions and Limitations", "sections": [{"sec_id": "BC1", "heading": "Discrete and binary mask space", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "LBCS operates on binary masks m ∈ {0,1}^n. The LexiFlow randomized search is designed for continuous relaxations but converges with probability 1 under Conditions 1 and 2. Practical implementation perturbs mask continuously, then thresholds back to binary representation.", "warn": "", "refs": []}, {"sec_id": "BC2", "heading": "Inner-loop convergence requirement", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "LBCS evaluates f1(m) using θ(m) = argmin_θ L(m,θ). In practice, the inner loop must run long enough to produce a reliable approximation of θ(m). Acceleration: pre-train once with a random mask, then fine-tune for subsequent masks (reduces cost).", "warn": "", "refs": []}, {"sec_id": "BC3", "heading": "ε must be non-negative", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "ε ≥ 0 is required for the lexicographic structure to make sense. ε = 0 recovers exact first-objective optimization.", "warn": "", "refs": []}, {"sec_id": "BC4", "heading": "Predefined k provides initialization only", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The predefined coreset size k initializes the mask but does not constrain the final coreset size. The final size is determined by lexicographic optimization.", "warn": "", "refs": []}, {"sec_id": "BC5", "heading": "Applies to datasets with standard supervised learning setup", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Requires labeled data and cross-entropy (or similar) loss. Applied to image classification tasks in the paper; not evaluated on regression or generation tasks directly.", "warn": "", "refs": []}, {"sec_id": "BC6", "heading": "Large-scale scalability via grouping", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "For large datasets (ImageNet-1k), groups of G examples share the same mask entry, reducing dimensionality of the search space by a factor of G. This introduces a granularity constraint: the minimum selectable unit is a group, not an individual sample.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Assumptions Made", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "A1: The stable moving condition holds for LexiFlow on the given mask space and dataset. This is a standard assumption for local randomized search algorithms and cannot be verified a priori.\nA2: The inner-loop training provides a good approximation of the true θ(m) for evaluating f1(m).\nA3: f1(m) evaluated on the full dataset (not a held-out validation set) is a reliable proxy for generalization. In practice, this can lead to overfitting in the coreset selection loop — the ε compromise partially mitigates this.", "warn": "", "refs": []}, {"sec_id": "L1", "heading": "Optimal convergence rate unknown", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Theorem 2 proves convergence in the limit but does not bound the rate. The number of outer iterations T needed for practical convergence is empirically determined (typically T=500).", "warn": "", "refs": []}, {"sec_id": "L2", "heading": "Method is specific to bilevel optimization paradigm", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Other advanced coreset selection methods (e.g., score-based methods like EL2N, GraNd, Moderate) do not use bilevel optimization. The paper does not discuss how to incorporate size minimization into non-bilevel methods.", "warn": "", "refs": []}, {"sec_id": "L3", "heading": "Computational overhead from inner-loop training", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Each mask evaluation requires (approximately) full inner-loop training. While acceleration tricks exist (pre-training + fine-tuning, model sparsity), the method is more expensive than score-based methods that require only a single training run.", "warn": "", "refs": []}, {"sec_id": "L4", "heading": "Grouping trick introduces quantization", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Using groups of G=100 for ImageNet-1k means the minimum unit is 100 samples. Very small coreset sizes that are not multiples of G cannot be achieved exactly.", "warn": "", "refs": []}, {"sec_id": "L5", "heading": "Convergence conditions not verifiable in closed form", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Conditions 1 and 2 hold by construction (C1) and assumption (C2). There is no practical test to verify whether C2 holds for a given dataset/architecture.", "warn": "", "refs": []}, {"sec_id": "L6", "heading": "Does not compare to Borsos et al. (2020)", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The original bilevel coreset method (Borsos et al. 2020) is excluded from comparisons because its time complexity grows rapidly with coreset size. This limits the scope of comparison.", "warn": "", "refs": []}]}, {"file": "heuristics.md", "role": "heuristics", "file_title": "Heuristics and Implementation Tricks", "sections": [{"sec_id": "H01", "heading": "Pre-train then fine-tune for inner-loop acceleration", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Training the inner-loop proxy network from scratch at every outer iteration is expensive. Since nearby masks produce similar coresets, starting from a pre-trained checkpoint and fine-tuning for a few epochs significantly reduces inner-loop cost."}, {"label": "Sensitivity", "value": "medium — the quality of fine-tuning approximation affects f1(m) evaluation accuracy, but empirically the approach works well."}, {"label": "Bounds", "value": "Pre-training should use a representative initialization (e.g., random mask with ‖m‖0 = k). Fine-tuning duration should be long enough for meaningful convergence but short enough to save computation."}, {"label": "Code ref", "value": "src/execution/lbcs.py"}, {"label": "Source", "value": "§3.2 (\"To speed up the inner loop, we can first train a model with random masks and then finetune it with other different masks\")"}], "code": "", "text": "", "warn": "", "refs": [{"raw": "src/execution/lbcs.py", "kind": "source", "target": null}]}, {"sec_id": "H02", "heading": "Model sparsity for inner-loop speedup", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Applying model sparsity (e.g., pruning) to the proxy network during inner-loop training makes it smaller and faster to train, reducing the per-iteration cost of LBCS."}, {"label": "Sensitivity", "value": "low to medium — depends on the level of sparsity applied; high sparsity may reduce f1 evaluation quality."}, {"label": "Bounds", "value": "Sparsity level should be tuned to maintain reasonable f1(m) correlation with the dense model."}, {"label": "Code ref", "value": "src/execution/lbcs.py"}, {"label": "Source", "value": "§3.2 (\"Also, we can employ model sparsity and make the trained model smaller for faster training\")"}], "code": "", "text": "", "warn": "", "refs": [{"raw": "src/execution/lbcs.py", "kind": "source", "target": null}]}, {"sec_id": "H03", "heading": "Group-based mask search for large datasets", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "For datasets like ImageNet-1k (n ≈ 1.28M), searching over n binary variables is intractable. Grouping G=100 consecutive examples to share one mask variable reduces the search space to n/G dimensions."}, {"label": "Sensitivity", "value": "high — G determines the granularity of coreset size reduction. Larger G enables faster search but coarser size control."}, {"label": "Bounds", "value": "G=100 used for ImageNet-1k. Smaller G gives finer granularity at higher cost. The same grouping trick is applied to the Probabilistic baseline for fair comparison."}, {"label": "Code ref", "value": "src/execution/lbcs.py"}, {"label": "Source", "value": "§3.2 (\"the mask search space can be narrowed by treating several examples as a group\"); §5.4"}], "code": "", "text": "", "warn": "", "refs": [{"raw": "src/execution/lbcs.py", "kind": "source", "target": null}]}, {"sec_id": "H04", "heading": "Voluntary performance compromise ε to reduce overfitting", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Driving f1(m) to the exact minimum overfits the coreset selection to training noise. Allowing a fractional relaxation ε (default 0.2) prevents this, improving generalization especially under noisy or imbalanced labels."}, {"label": "Sensitivity", "value": "medium — too small ε makes size reduction slow; too large ε may allow poor-accuracy coresets."}, {"label": "Bounds", "value": "ε ∈ [0.2, 0.4] tested in §5.1; ε=0.2 used for all main experiments (§5.2). Larger ε leads to smaller average f2(m) and larger average f1(m) across repeated runs."}, {"label": "Code ref", "value": "src/execution/lbcs.py"}, {"label": "Source", "value": "§3.2 (Remark 2), §5.1"}], "code": "", "text": "", "warn": "", "refs": [{"raw": "src/execution/lbcs.py", "kind": "source", "target": null}]}, {"sec_id": "H05", "heading": "Dynamic step-size and random restart in LexiFlow", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Fixed step-size search gets stuck in local optima. Reducing the step size when no progress is made for 2n consecutive iterations, and restarting randomly when the step size falls below a threshold, helps escape local optima and explore globally."}, {"label": "Sensitivity", "value": "high — δ_init and δ_lower need to be calibrated for the mask space scale."}, {"label": "Bounds", "value": "Step-size update rule: δ ← δ · √((t'+1)/(t+1)) after 2n consecutive failed updates. Restart: δ ← δ_init + r (increment by restart count). Specific values of δ_init and δ_lower not specified in the paper; inherited from LexiFlow (Zhang et al. 2023b)."}, {"label": "Code ref", "value": "src/execution/lbcs.py"}, {"label": "Source", "value": "§3.2 (\"To free the algorithm from local optima and manual configuration of the step size, LexiFlow includes restart and dynamic step size techniques\"); Appendix A"}], "code": "", "text": "", "warn": "", "refs": [{"raw": "src/execution/lbcs.py", "kind": "source", "target": null}]}]}]}}
