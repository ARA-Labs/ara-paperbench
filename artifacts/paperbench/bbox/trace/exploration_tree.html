<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration Tree — bbox</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #555;
    --question: #1565c0;
    --experiment: #e65100;
    --decision: #2e7d32;
    --dead-end: #c62828;
    --pivot: #6a1b9a;
    --edge: #bdbdbd;
    --dag-edge: #e57373;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.question   { background: var(--question); }
  .legend-dot.experiment { background: var(--experiment); }
  .legend-dot.decision   { background: var(--decision); }
  .legend-dot.dead_end   { background: var(--dead-end); }
  .legend-dot.pivot      { background: var(--pivot); }

  /* ---- Tree layout ---- */

  .tree {
    position: relative;
  }

  .node-group {
    position: relative;
    padding-left: 32px;
  }

  .node-group.has-children > .children::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 24px;
    width: 2px;
    background: var(--edge);
  }

  .children {
    position: relative;
    margin-top: 0;
  }

  .children > .node-group::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 22px;
    width: 17px;
    height: 2px;
    background: var(--edge);
  }

  .tree > .node-group {
    padding-left: 0;
  }

  .tree > .node-group::before { display: none; }

  /* ---- Node card ---- */

  .node {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .node:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .node.expanded {
    border-color: #999;
  }

  .node-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .node-indicator {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
  }

  .node-indicator.question   { background: var(--question); }
  .node-indicator.experiment { background: var(--experiment); }
  .node-indicator.decision   { background: var(--decision); }
  .node-indicator.dead_end   { background: var(--dead-end); }
  .node-indicator.pivot      { background: var(--pivot); }

  .node-id {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #f0f0f0;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .node-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    flex: 1;
  }

  .node-type {
    flex-shrink: 0;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 2px;
  }

  .node-type.question   { background: #e3f2fd; color: var(--question); }
  .node-type.experiment { background: #fff3e0; color: var(--experiment); }
  .node-type.decision   { background: #e8f5e9; color: var(--decision); }
  .node-type.dead_end   { background: #ffebee; color: var(--dead-end); }
  .node-type.pivot      { background: #f3e5f5; color: var(--pivot); }

  .node-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .node.expanded .node-body {
    display: block;
  }

  .node-field {
    margin-bottom: 8px;
  }

  .node-field:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .field-value {
    white-space: pre-wrap;
  }

  .evidence-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .evidence-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
  }

  .alt-list {
    list-style: none;
    padding: 0;
  }

  .alt-list li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 3px;
  }

  .alt-list li::before {
    content: "\00d7";
    position: absolute;
    left: 0;
    color: #ccc;
    font-weight: 700;
  }

  .dag-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--dag-edge);
    border: 1px solid var(--dag-edge);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .dag-badge svg {
    width: 10px;
    height: 10px;
  }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    transition: transform 0.15s ease;
    color: #ccc;
  }

  .node.expanded .chevron {
    transform: rotate(90deg);
    color: #999;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Exploration Tree — bbox</h1>
  <p>Research DAG &middot; BBOX-ADAPTER: Lightweight Adapting for Black-Box Large Language Models</p>
</header>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot question"></div>Question</div>
  <div class="legend-item"><div class="legend-dot experiment"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot decision"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot dead_end"></div>Dead End</div>
  <div class="legend-item"><div class="legend-dot pivot"></div>Pivot</div>
</div>

<div class="tree" id="tree"></div>

<script>
const TREE = [
  {
    "id": "N01",
    "type": "question",
    "title": "How can we adapt state-of-the-art black-box LLMs (no parameters, no probabilities) to specific tasks?",
    "description": "GPT-3.5-turbo, GPT-4, PaLM-2, Gemini expose only text-in/text-out APIs. Fine-tuning APIs are opaque, privacy-risky, and costly. No method exists that adapts these LLMs without either their fine-tuning APIs or token probabilities.",
    "children": [
      {
        "id": "N02",
        "type": "experiment",
        "title": "Can grey-box methods (logit combination, kNN-Adapter) work on modern black-box LLMs?",
        "result": "No. GPT-3.5-turbo and PaLM-2 do not expose full token probability distributions. The logprobs API returns only top-5 tokens; the echo parameter was deprecated October 2023.",
        "evidence": [
          "Appendix C",
          "Table 1",
          "§2"
        ],
        "children": [
          {
            "id": "N03",
            "type": "dead_end",
            "title": "Grey-box approaches (CombLM, Proxy-Tuning, kNN-Adapter, IPA) for black-box adaptation",
            "hypothesis": "Token-level probability combination methods could work on recent black-box LLMs",
            "failure_mode": "Output token probabilities are inaccessible in GPT-3.5-turbo, GPT-4, PaLM-2; even top-5 logprobs are insufficient for full vocabulary distribution modeling",
            "lesson": "Must operate purely on text outputs; any method requiring probability distributions is inapplicable"
          },
          {
            "id": "N04",
            "type": "decision",
            "title": "Frame black-box LLM adaptation as text-only ranking/scoring problem",
            "choice": "Train a small auxiliary model as an energy-based scorer that distinguishes target-domain from source-domain text using only text inputs and outputs",
            "alternatives": [
              "Prompt engineering and in-context learning (no persistent adaptation)",
              "Fine-tuning via API (Azure-SFT) — opaque, expensive, privacy-risky",
              "Retrieval-augmented generation (kNN-Adapter) — still needs probabilities for interpolation"
            ],
            "evidence": "Residual EBM formulation (Deng et al., 2020) enables distribution shaping without accessing LLM internals; only text outputs needed",
            "children": [
              {
                "id": "N05",
                "type": "question",
                "title": "How to train the energy scorer without access to partition function or probabilities?",
                "description": "The normalizing constant Z_theta(x) is intractable; maximum likelihood estimation requires sampling from model distributions.",
                "children": [
                  {
                    "id": "N06",
                    "type": "dead_end",
                    "title": "Standard MLE or MCMC for EBM training",
                    "hypothesis": "Direct MLE or MCMC sampling could estimate Z_theta(x) sufficiently",
                    "failure_mode": "Computationally intensive and imprecise; MCMC for discrete text is especially problematic",
                    "lesson": "Noise Contrastive Estimation (NCE) avoids Z_theta entirely by converting density estimation to classification"
                  },
                  {
                    "id": "N07",
                    "type": "decision",
                    "title": "Use ranking-based NCE loss to bypass intractable partition function",
                    "choice": "Minimize KL between parameterized posterior pθ(k|{xk}) and data-to-noise ratio q(k|{xk}); extends binary NCE to ranking over multiple samples",
                    "alternatives": [
                      "Standard binary NCE (Gutmann & Hyvarinen 2010) — only real vs. noise, no ranking",
                      "MLM loss — mask words in ground-truth, train on masked word prediction",
                      "Contrastive learning with fixed negatives"
                    ],
                    "evidence": "Ma & Collins (2018) ranking NCE; optimal solution recovers p_theta(x) = p_data(x)",
                    "children": [
                      {
                        "id": "N08",
                        "type": "dead_end",
                        "title": "MLM loss as adapter training objective",
                        "hypothesis": "Masked language model loss could score text quality by measuring masked word prediction probability",
                        "failure_mode": "MLM loss achieves 61.52%/60.41% on StrategyQA vs NCE 71.62%/71.18% — up to 10% gap; MLM does not effectively capture distributional gap between source and target domains",
                        "lesson": "Ranking-based NCE directly optimizes the distributional distinction needed; MLM is a proxy that doesn't capture the full objective"
                      },
                      {
                        "id": "N09",
                        "type": "experiment",
                        "title": "Validate NCE loss vs MLM loss on StrategyQA and GSM8K",
                        "result": "NCE outperforms MLM by up to 10.10% (StrategyQA 0.1B: 71.62 vs 61.52); consistent advantage across adapter sizes",
                        "evidence": [
                          "C04",
                          "Table 5",
                          "§4.5"
                        ],
                        "children": [
                          {
                            "id": "N10",
                            "type": "question",
                            "title": "How to handle training instability from sharp EBM gradients?",
                            "description": "Energy values can diverge, leading to unstable NCE training.",
                            "children": [
                              {
                                "id": "N11",
                                "type": "decision",
                                "title": "Apply spectral normalization to the adapter head",
                                "choice": "Normalize the final linear classification layer by its largest singular value; add regularization terms alpha*E[g(y)^2] to the loss",
                                "alternatives": [
                                  "Gradient clipping alone",
                                  "Learning rate reduction",
                                  "Layer normalization"
                                ],
                                "evidence": "Du & Mordatch (2019) demonstrate spectral normalization stabilizes EBM implicit generation",
                                "children": []
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  },
  {
    "id": "N12",
    "type": "question",
    "title": "How to leverage the trained adapter for inference without probability access?",
    "description": "At inference time, we cannot compute p_theta(y|x) directly since Z_theta is intractable and p_LLM probabilities are unavailable.",
    "also_depends_on": [
      "N07"
    ],
    "children": [
      {
        "id": "N13",
        "type": "decision",
        "title": "Use sentence-level beam search: LLM proposes, adapter scores",
        "choice": "Decompose generation into sentence-level steps; LLM generates n candidates per beam, adapter scores partial chains, top-k beams are retained. Final answer = highest adapter-scored complete chain.",
        "alternatives": [
          "Score only complete answers (single-step) — lower accuracy, lower cost",
          "Token-level beam search — requires token probabilities, not available",
          "Self-consistency majority voting — no adapter guidance, no improvement"
        ],
        "evidence": "Sentence-level decomposition balances search efficiency with multi-step reasoning quality; shown to improve ~2.41% per additional beam",
        "children": [
          {
            "id": "N14",
            "type": "experiment",
            "title": "Validate beam size scaling (k=1,3,5) and iteration scaling (T=0..4)",
            "result": "k=1→5 improves ~2.41% average; T=0 hurts performance (misguided search); T=1 surpasses base; T=3 near-optimal. Full-step (k=3) achieves 5.90% avg. improvement; single-step achieves 3.45%.",
            "evidence": [
              "C07",
              "C08",
              "Figure 3",
              "Table 4",
              "§4.6"
            ],
            "children": []
          }
        ]
      }
    ]
  }
];

function collectAll(nodes) {
  let out = [];
  for (const n of nodes) {
    out.push(n);
    if (n.children) out = out.concat(collectAll(n.children));
  }
  return out;
}

function renderStats(tree) {
  const all = collectAll(tree);
  const types = {};
  all.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
  const maxDepth = (function getDepth(nodes, d) {
    let m = d;
    for (const n of nodes) {
      if (n.children) m = Math.max(m, getDepth(n.children, d + 1));
    }
    return m;
  })(tree, 1);

  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${maxDepth}</div><div class="stat-label">Max Depth</div></div>
    <div class="stat"><div class="stat-value">${types.decision || 0}</div><div class="stat-label">Decisions</div></div>
    <div class="stat"><div class="stat-value">${types.experiment || 0}</div><div class="stat-label">Experiments</div></div>
    <div class="stat"><div class="stat-value">${types.dead_end || 0}</div><div class="stat-label">Dead Ends</div></div>
  `;
}

function renderEvidence(ev) {
  if (!ev) return "";
  const items = Array.isArray(ev) ? ev : [ev];
  if (items.length === 1 && typeof items[0] === "string" && items[0].length > 40) {
    return `<div class="node-field"><div class="field-label">Evidence</div><div class="field-value">${esc(items[0])}</div></div>`;
  }
  return `<div class="node-field"><div class="field-label">Evidence</div><div class="evidence-tags">${items.map(i => `<span class="evidence-tag">${esc(String(i))}</span>`).join("")}</div></div>`;
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return "";
  return `<div class="node-field"><div class="field-label">Rejected Alternatives</div><ul class="alt-list">${alts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderBody(node) {
  let html = "";
  const t = node.type;

  if (t === "question" && node.description)
    html += `<div class="node-field"><div class="field-label">Description</div><div class="field-value">${esc(node.description)}</div></div>`;

  if (t === "experiment") {
    if (node.result) html += `<div class="node-field"><div class="field-label">Result</div><div class="field-value">${esc(node.result)}</div></div>`;
    html += renderEvidence(node.evidence);
  }

  if (t === "decision") {
    if (node.choice) html += `<div class="node-field"><div class="field-label">Choice</div><div class="field-value">${esc(node.choice)}</div></div>`;
    html += renderAlternatives(node.alternatives);
    html += renderEvidence(node.evidence);
  }

  if (t === "dead_end") {
    if (node.hypothesis) html += `<div class="node-field"><div class="field-label">Hypothesis</div><div class="field-value">${esc(node.hypothesis)}</div></div>`;
    if (node.failure_mode) html += `<div class="node-field"><div class="field-label">Failure Mode</div><div class="field-value">${esc(node.failure_mode)}</div></div>`;
    if (node.lesson) html += `<div class="node-field"><div class="field-label">Lesson</div><div class="field-value">${esc(node.lesson)}</div></div>`;
  }

  if (t === "pivot") {
    if (node.from) html += `<div class="node-field"><div class="field-label">From</div><div class="field-value">${esc(node.from)}</div></div>`;
    if (node.to) html += `<div class="node-field"><div class="field-label">To</div><div class="field-value">${esc(node.to)}</div></div>`;
    if (node.trigger) html += `<div class="node-field"><div class="field-label">Trigger</div><div class="field-value">${esc(node.trigger)}</div></div>`;
  }

  return html;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s.trim();
  return d.innerHTML;
}

const TYPE_LABELS = {
  question: "Question",
  experiment: "Experiment",
  decision: "Decision",
  dead_end: "Dead End",
  pivot: "Pivot"
};

function renderNode(node) {
  const hasChildren = node.children && node.children.length > 0;
  const dagBadge = node.also_depends_on
    ? `<span class="dag-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>also: ${node.also_depends_on.join(", ")}</span>`
    : "";

  const chevronSvg = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let html = `<div class="node-group ${hasChildren ? "has-children" : ""}">`;
  html += `<div class="node" onclick="this.classList.toggle('expanded')">`;
  html += `<div class="node-header">`;
  html += `<div class="node-indicator ${node.type}"></div>`;
  html += `<span class="node-id">${node.id}</span>`;
  html += `<span class="node-title">${esc(node.title)}${dagBadge}</span>`;
  html += `<span class="node-type ${node.type}">${TYPE_LABELS[node.type]}</span>`;
  html += chevronSvg;
  html += `</div>`;
  html += `<div class="node-body">${renderBody(node)}</div>`;
  html += `</div>`;

  if (hasChildren) {
    html += `<div class="children">`;
    for (const child of node.children) {
      html += renderNode(child);
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  renderStats(TREE);
  const container = document.getElementById("tree");
  container.innerHTML = TREE.map(renderNode).join("");
}

render();
</script>
</body>
</html>
