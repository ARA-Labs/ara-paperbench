he optimal policy π* (Assumption 3.2: ||dπ*/dπρ||∞ ≤ C — warm-start assumption).", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A3", "inferred_id": false, "ent_title": "Superior policy has smaller mismatch coefficient", "text": "A superior policy ˆπ (η(ˆπ) ≥ η(π)) has a smaller distribution mismatch coefficient (Assumption 3.4: ||dπ*/dˆπ||∞ ≤ ||dπ*/dπ||∞).", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A4", "inferred_id": false, "ent_title": "Simulator-based environment", "text": "The environment is simulator-based (enabling state reset to arbitrary critical states).", "unstructured": true, "fields": [], "refs": []}]}]}, "glossary": {"title": "Concepts", "groups": [], "terms": [{"term_id": "G01", "name": "Markov Decision Process", "aliases": ["MDP"], "definition": "A tuple where $\\mathcal{S}$ is the state set, $\\mathcal{A}$ the action set, $P: \\mathcal{S} \\times \\mathcal{A} \\rightarrow \\Delta(\\mathcal{S})$ the transition function, $\\rho$ the initial state distribution, $R: \\mathcal{S} \\times \\mathcal{A} \\rightarrow \\mathbb{R}$ the reward function, and $\\gamma \\in (0,1)$ the discount factor.", "fields": [{"label": "Notation", "value": "$\\langle \\mathcal{S}, \\mathcal{A}, P, \\rho, R, \\gamma \\rangle$"}, {"label": "Boundary conditions", "value": "Assumes Markovian rewards and transitions. Non-Markovian reward designs (identified as a flaw in the Malware Mutation environment, Appendix D) violate this."}], "related": ["G02", "G03", "G04"]}, {"term_id": "G02", "name": "State Occupancy Distribution", "aliases": [], "definition": "The (1-γ)-discounted visitation frequency of state s under policy π starting from initial distribution ρ.", "fields": [{"label": "Notation", "value": "$d^\\pi_\\rho(s) = (1 - \\gamma) \\sum_{t=0}^{\\infty} \\gamma^t \\Pr^\\pi(s_t = s \\mid s_0 \\sim \\rho)$"}, {"label": "Boundary conditions", "value": "Defined for γ ∈ (0,1). In the limit γ→1 this approaches the stationary distribution."}], "related": ["G01", "G05"]}, {"term_id": "G03", "name": "Advantage Function", "aliases": [], "definition": "The advantage of taking action a at state s over following policy π, where $Q^\\pi(s,a) = \\mathbb{E}_\\pi[\\sum_{t=0}^\\infty \\gamma^t R(s_t,a_t) | s_0=s, a_0=a]$ and $V^\\pi(s) = \\mathbb{E}_\\pi[\\sum_{t=0}^\\infty \\gamma^t R(s_t,a_t) | s_0=s]$.", "fields": [{"label": "Notation", "value": "$A^\\pi(s, a) = Q^\\pi(s, a) - V^\\pi(s)$"}, {"label": "Boundary conditions", "value": "$\\mathbb{E}_{a \\sim \\pi(\\cdot|s)}[A^\\pi(s,a)] = 0$ by definition."}], "related": ["G04", "G02"]}, {"term_id": "G04", "name": "Sub-Optimality Gap", "aliases": [], "definition": "The difference in expected discounted return between the optimal policy π* and the refined policy π', both evaluated from the default initial distribution ρ.", "fields": [{"label": "Notation", "value": "$\\text{SubOpt} := V^{\\pi^*}(\\rho) - V^{\\pi'}(\\rho)$"}, {"label": "Boundary conditions", "value": "Upper-bounded in Theorem 3.6 as $O\\left(\\frac{\\varepsilon}{(1-\\gamma)^2} \\left\\| \\frac{d^{\\pi^*}}{d^{\\hat\\pi}_\\rho} \\right\\|_\\infty\\right)$ where ε bounds the one-step improvement $\\mathbb{E}_{s \\sim d^{\\pi'}}[\\max_a A^{\\pi'}(s,a)] &lt; \\varepsilon$."}], "related": ["G05", "G03"]}, {"term_id": "G05", "name": "Distribution Mismatch Coefficient", "aliases": [], "definition": "The worst-case ratio between the optimal policy's state visitation and that of policy π, measuring how well π covers the states important for π*.", "fields": [{"label": "Notation", "value": "$\\left\\| \\frac{d^{\\pi^*}}{d^\\pi_\\rho} \\right\\|_\\infty = \\sup_s \\frac{d^{\\pi^*}_\\rho(s)}{d^\\pi_\\rho(s)}$"}, {"label": "Boundary conditions", "value": "Requires $d^\\pi_\\rho(s) > 0$ whenever $d^{\\pi^*}_\\rho(s) > 0$ (Assumption 3.2, warm-start). Unbounded if the pre-trained policy has zero coverage of good states."}], "related": ["G04", "G02"]}, {"term_id": "G06", "name": "StateMask", "aliases": ["Original"], "definition": "A neural network policy that \"blinds\" the target agent at non-critical steps by replacing its action with a random action. The perturbed policy is $\\bar\\pi(a|s) = \\tilde\\pi(a^m=0|s)\\pi(a|s) + \\tilde\\pi(a^m=1|s)\\pi_r(a|s)$. Original objective: $J(\\theta) = \\min |\\eta(\\pi) - \\eta(\\bar\\pi)|$, optimized with primal-dual methods.", "fields": [{"label": "Notation", "value": "$\\tilde\\pi_\\theta$, mask network with binary action $a^m_t \\in \\{0, 1\\}$"}, {"label": "Boundary conditions", "value": "Assumes Assumption 3.1 (pre-trained policy better than random). A step with $a^m_t=0$ is critical (mask outputs 0 → action preserved); $a^m_t=1$ is non-critical (action randomized)."}], "related": ["G07", "G08", "G01"]}, {"term_id": "G07", "name": "Optimized StateMask", "aliases": ["RICE's Explanation Module"], "definition": "Simplified StateMask using objective $J(\\theta) = \\max \\eta(\\bar\\pi)$ (valid by Theorem 3.3 since $\\eta(\\bar\\pi) \\leq \\eta(\\pi)$ under Assumption 3.1). Adds blinding bonus α·am_t to prevent trivial solution (always outputting 0). Trained with vanilla PPO.", "fields": [{"label": "Notation", "value": "$\\tilde\\pi_\\theta$, trained with PPO; modified reward $R'(s_t, a_t) = R(s_t, a_t) + \\alpha \\cdot a^m_t$"}, {"label": "Boundary conditions", "value": "Same assumptions as StateMask. α is a sensitivity-low hyperparameter (values 0.01, 0.001, 0.0001 yield similar fidelity). Equivalent to StateMask in fidelity per Lemma 3.5."}], "related": ["G06", "G08"]}, {"term_id": "G08", "name": "Critical State", "aliases": [], "definition": "The state in trajectory τ where the mask network assigns highest importance score (probability of outputting 0, i.e., preserving the original action). Used as exploration frontier in RICE.", "fields": [{"label": "Notation", "value": "$s^* = \\arg\\max_{s_t \\in \\tau} \\tilde\\pi_\\theta(a^m=0 | s_t)$"}, {"label": "Boundary conditions", "value": "Only meaningful when the pre-trained policy satisfies Assumption 3.2 (good state coverage). In \"cold start\" scenarios (e.g., Mountain Car), no meaningful critical states exist."}], "related": ["G07", "G09"]}, {"term_id": "G09", "name": "Mixed Initial State Distribution", "aliases": [], "definition": "The mixture of the default initial distribution ρ and the critical-state distribution $d^{\\hat\\pi}_\\rho(s)$ from the MaskNet-based sampling. With probability p, the refining episode starts from a critical state; with probability (1-p) from the default initial state.", "fields": [{"label": "Notation", "value": "$\\mu(s) = \\beta \\cdot d^{\\hat\\pi}_\\rho(s) + (1-\\beta)\\rho(s)$; in code parameterized by reset probability $p$"}, {"label": "Boundary conditions", "value": "p=0 reduces to standard PPO fine-tuning; p=1 reduces to StateMask-R (overfits). Best performance at p ∈ {0.25, 0.5}."}], "related": ["G08", "G04"]}, {"term_id": "G10", "name": "Random Network Distillation (RND) Exploration Bonus", "aliases": [], "definition": "Intrinsic exploration reward based on the prediction error of a randomly initialized target network f by a trained predictor network $\\hat{f}$. Novel states produce higher prediction error, encouraging exploration of unseen states.", "fields": [{"label": "Notation", "value": "$R^{RND}(s_{t+1}) = |f(s_{t+1}) - \\hat{f}(s_{t+1})|^2$; total reward $R'(s_t,a_t) = R(s_t,a_t) + \\lambda \\cdot R^{RND}(s_{t+1})$"}, {"label": "Boundary conditions", "value": "As state coverage increases, RND bonus decays to zero and the task-reward-optimal policy is recovered. Count-based bonuses are impractical in large/continuous state spaces where RND is preferred. λ controls exploration-exploitation trade-off."}], "related": ["G09"]}], "lexicon": {"markov decision process": "G01", "mdp": "G01", "state occupancy distribution": "G02", "advantage function": "G03", "sub-optimality gap": "G04", "distribution mismatch coefficient": "G05", "statemask": "G06", "original": "G06", "optimized statemask": "G07", "rice's explanation module": "G07", "critical state": "G08", "mixed initial state distribution": "G09", "random network distillation (rnd) exploration bonus": "G10"}}, "dependencies": {"title": "Related Work / Dependencies", "preamble": "", "legend": [], "attribution": "", "footprint": [], "entries": [{"rw_id": "RW01", "inferred_id": false, "name": "Cheng et al., 2023 (StateMask)", "relation_raw": "extends", "relation_norm": "extends", "delta": "What changed: RICE simplifies StateMask's primal-dual objective to vanilla PPO with blinding bonus; adds mixed initial distribution and RND for refining instead of critical-state-only reset. Why: Primal-dual optimization is computationally expensive; critical-state-only reset causes overfitting.", "adopted": "Binary mask network architecture; state importance scoring via P(a^m=0|s); fidelity score metric definition.", "grounding": [{"raw": "Proc. NeurIPS 2023", "kind": "unknown", "target": null}], "claims": ["C01", "C02", "C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW02", "inferred_id": false, "name": "Uchendu et al., 2023 (JSRL)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: RICE replaces random curriculum frontier selection with explanation-guided critical state selection. Why: Random frontiers do not guarantee positive returns or useful exploration.", "adopted": "Roll-in concept (using pre-trained policy to set exploration start point); transformation of JSRL to a refining method by initializing πe = πg.", "grounding": [{"raw": "Proc. ICML 2023", "kind": "unknown", "target": null}], "claims": ["C01", "C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW03", "inferred_id": false, "name": "Kakade & Langford, 2002", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: RICE uses the Performance Difference Lemma to bound sub-optimality via state distribution mismatch coefficient. Why: Provides rigorous theoretical foundation for the mixed initial distribution benefit.", "adopted": "Performance Difference Lemma; approximate policy gradient framework.", "grounding": [{"raw": "Proc. ICML 2002", "kind": "unknown", "target": null}], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW04", "inferred_id": false, "name": "Burda et al., 2018 (RND)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: RICE applies RND as the exploration bonus starting from mixed initial states, rather than from default start. Why: RND is effective in large/continuous state spaces where count-based methods fail.", "adopted": "Random Network Distillation architecture (target + predictor); intrinsic reward formulation R_int = |f(s') − f̂(s')|².", "grounding": [{"raw": "Proc. ICLR 2018", "kind": "unknown", "target": null}, {"raw": "arXiv:1810.12894", "kind": "arxiv", "target": null}], "claims": ["C02", "C05"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW05", "inferred_id": false, "name": "Schulman et al., 2017 (PPO)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: RICE uses PPO as the base refining algorithm for both mask network training and policy refinement. Why: PPO's monotonicity guarantees and clip-based stability make it suitable for both phases.", "adopted": "PPO loss (clipped surrogate objective); advantage estimation; value network.", "grounding": [{"raw": "arXiv:1707.06347", "kind": "arxiv", "target": null}], "claims": ["C02", "C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW06", "inferred_id": false, "name": "Chang et al., 2023 (PPO++)", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: RICE replaces random visited-state selection with explanation-guided selection, providing theoretical improvement in distribution mismatch coefficient. Why: Not all visited states are informative; random selection provides no guarantee.", "adopted": "Mixed initial distribution concept (combining default + visited states).", "grounding": [{"raw": "arXiv:2306.11816", "kind": "arxiv", "target": null}], "claims": ["C01", "C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW07", "inferred_id": false, "name": "Agarwal et al., 2022 (Reincarnating RL)", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: RICE addresses a specific case of reincarnating RL — breaking bottlenecks rather than general policy transfer. Why: Provides broader motivation for reusing pre-trained policies.", "adopted": "Cost motivation (millions of dollars for re-training); prior computation reuse framework.", "grounding": [{"raw": "Proc. NeurIPS 2022", "kind": "unknown", "target": null}], "claims": ["C01"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW08", "inferred_id": false, "name": "Ecoffet et al., 2019/2021 (Go-Explore)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: RICE borrows the environment state restoration mechanism but selects frontiers via explanation rather than return-based archive. Why: Systematic state restoration is needed to reset to critical states in RICE.", "adopted": "Environment reset function to restore states; \"first return, then explore\" philosophy.", "grounding": [{"raw": "arXiv:1901.10995", "kind": "arxiv", "target": null}, {"raw": "Nature 2021", "kind": "unknown", "target": null}], "claims": ["C02"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW09", "inferred_id": false, "name": "Ho & Ermon, 2016 (GAIL)", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: RICE uses GAIL as a bridge to convert non-PPO pretrained agents (SAC) to PPO-compatible policy networks for refining. Why: Enables algorithm-agnostic refining by obtaining a PPO-compatible approximation of any policy.", "adopted": "Adversarial imitation learning to distill policy behavior into a new network.", "grounding": [{"raw": "Proc. NeurIPS 2016", "kind": "unknown", "target": null}], "claims": ["C06"], "cross_agent": false, "is_footprint": false}]}, "recipes": {"title": "Solution", "files": [{"file": "constraints.md", "role": "constraints", "file_title": "Constraints", "sections": [{"sec_id": "BC1", "heading": "BC1: Warm-Start Requirement (Assumption 3.2)", "kind": "kv", "fields": [{"label": "Condition", "value": "The pre-trained policy π must have sufficient state coverage such that $\\|d^{\\pi^*}/d^\\pi_\\rho\\|_\\infty \\leq C$ for some finite constant C."}, {"label": "Implication", "value": "RICE does not work in \"cold-start\" settings where the pre-trained agent has very poor coverage (e.g., MountainCar — Appendix E). In such cases, RICE degenerates to plain RND exploration."}, {"label": "Test", "value": "Check whether the pre-trained agent can reliably reach a diverse set of environment states."}], "text": "Condition: The pre-trained policy π must have sufficient state coverage such that ||dπ*/dπρ||∞ ≤ C for some finite constant C. Implication: RICE does not work in \"cold-start\" settings where the pre-trained agent has very poor coverage (e.g., MountainCar — Appendix E). In such cases, RICE degenerates to plain RND exploration. Test: Check whether the pre-trained agent can reliably reach a diverse set of environment states.", "refs": []}, {"sec_id": "BC2", "heading": "BC2: Simulator-Based Environment Required", "kind": "kv", "fields": [{"label": "Condition", "value": "The environment must support state reset to arbitrary previously visited states."}, {"label": "Implication", "value": "Cannot be directly applied in real-world physical systems where deterministic state restoration is impossible. Workaround: goal/state-conditioned policy with sub-goals (Ecoffet et al., 2021)."}, {"label": "Note", "value": "All evaluated environments (MuJoCo, MetaDrive, CAGE, Malware RL, Selfish Mining) are simulator-based."}], "text": "Condition: The environment must support state reset to arbitrary previously visited states. Implication: Cannot be directly applied in real-world physical systems where deterministic state restoration is impossible. Workaround: goal/state-conditioned policy with sub-goals (Ecoffet et al., 2021). Note: All evaluated environments (MuJoCo, MetaDrive, CAGE, Malware RL, Selfish Mining) are simulator-based.", "refs": []}, {"sec_id": "BC3", "heading": "BC3: Pre-Trained Policy Must Outperform Random (Assumption 3.1)", "kind": "kv", "fields": [{"label": "Condition", "value": "$\\mathbb{E}_{a \\sim \\pi_r}[A^\\pi(s,a)] \\leq 0, \\forall s$"}, {"label": "Implication", "value": "RICE requires a reasonably good pre-trained policy. The explanation method is only meaningful when the policy has learned something useful."}], "text": "Condition: E_{a~πr}[Aπ(s,a)] ≤ 0, ∀s. Implication: RICE requires a reasonably good pre-trained policy. The explanation method is only meaningful when the policy has learned something useful.", "refs": []}, {"sec_id": "BC4", "heading": "BC4: Unknown Training Algorithm of Pre-Trained Policy", "kind": "kv", "fields": [{"label": "Condition", "value": "RICE does not require knowledge of the original training algorithm."}, {"label": "Implication", "value": "The pre-trained policy may have been trained with SAC, PPO, or other algorithms. For non-PPO policies, GAIL is used to obtain a PPO-compatible approximation (Experiment IV)."}], "text": "Condition: RICE does not require knowledge of the original training algorithm. Implication: The pre-trained policy may have been trained with SAC, PPO, or other algorithms. For non-PPO policies, GAIL is used to obtain a PPO-compatible approximation (Experiment IV).", "refs": []}, {"sec_id": "L1", "heading": "L1: Critical State Filtering Not Considered", "kind": "prose", "text": "States identified as critical may already have converged to optimal behavior. Resetting to these states provides little additional learning benefit. Future work: filter by TD error or policy convergence metrics.", "fields": [], "refs": []}, {"sec_id": "L2", "heading": "L2: Single Critical State Per Trajectory", "kind": "prose", "text": "Algorithm 2 selects only the single most critical state per trajectory. This may miss other important states in the same episode. Extension to top-K critical states is possible but not evaluated.", "fields": [], "refs": []}, {"sec_id": "L3", "heading": "L3: Non-Markovian Reward Designs", "kind": "prose", "text": "Reward functions that depend on initial state s_0 rather than current state s_t (discovered in MalConv, Appendix D) violate MDP assumptions and reduce PPO-based refining effectiveness. Requires reward debugging before RICE can be applied.", "fields": [], "refs": []}, {"sec_id": "L4", "heading": "L4: Requires Simulator for Fidelity Evaluation", "kind": "prose", "text": "The fidelity score metric requires the ability to fast-forward trajectories and randomize specific actions, which requires full environment access.", "fields": [], "refs": []}]}, {"file": "algorithm.md", "role": "algorithm", "file_title": "Algorithm", "sections": [{"sec_id": "", "heading": "Perturbed Policy", "kind": "math", "code": "\\bar\\pi(a|s) = \\tilde\\pi(a^m=0|s)\\cdot\\pi(a|s) + \\tilde\\pi(a^m=1|s)\\cdot\\pi_r(a|s)\n\na_t \\odot a^m_t = \\begin{cases} a_t & \\text{if } a^m_t = 0 \\\\ a_{\\text{random}} & \\text{if } a^m_t = 1 \\end{cases}", "text": "The perturbed policy π̄(a|s) = π̃(a^m=0|s)·π(a|s) + π̃(a^m=1|s)·π_r(a|s). The final action at time t: a_t ⊙ a^m_t = a_t if a^m_t=0, else a_random if a^m_t=1.", "fields": [], "refs": []}, {"sec_id": "", "heading": "Optimized Mask Network Objective", "kind": "math", "code": "J(\\theta) = \\min |\\eta(\\pi) - \\eta(\\bar\\pi)| \\; \\Rightarrow \\; J(\\theta) = \\max\\, \\eta(\\bar\\pi)\n\nR'(s_t, a_t) = R(s_t, a_t) + \\alpha \\cdot a^m_t", "text": "Original StateMask: J(θ) = min |η(π) - η(π̄)|. By Theorem 3.3 (under Assumption 3.1): η(π̄) ≤ η(π), therefore J(θ) = max η(π̄). Modified reward to prevent trivial solution (always output 0): R'(s_t, a_t) = R(s_t, a_t) + α·a^m_t.", "fields": [], "refs": [{"raw": "Theorem 3.3", "kind": "unknown", "target": null}]}, {"sec_id": "", "heading": "Sub-Optimality Bound (Theorem 3.6)", "kind": "math", "code": "V^{\\pi^*}(\\rho) - V^{\\pi'}(\\rho) \\leq O\\!\\left(\\frac{\\varepsilon}{(1-\\gamma)^2} \\left\\|\\frac{d^{\\pi^*}}{d^{\\hat\\pi}_\\rho}\\right\\|_\\infty\\right)", "text": "V^π*(ρ) − V^π′(ρ) ≤ O(ε/(1−γ)² · ‖dπ*/dπ̂ρ‖∞), where ε satisfies E_{s~d^π'_μ}[max_a A^π'(s,a)] &lt; ε.", "fields": [], "refs": [{"raw": "Theorem 3.6", "kind": "unknown", "target": null}]}, {"sec_id": "", "heading": "Mixed Initial Distribution", "kind": "math", "code": "\\mu(s) = \\beta \\cdot d^{\\hat\\pi}_\\rho(s) + (1-\\beta)\\rho(s)", "text": "μ(s) = β·d^π̂_ρ(s) + (1-β)ρ(s). In practice, parameterized via reset probability p (probability of initializing from critical state).", "fields": [], "refs": []}, {"sec_id": "", "heading": "RND Exploration Reward", "kind": "math", "code": "R'(s_t, a_t) = R(s_t, a_t) + \\lambda \\left|f(s_{t+1}) - \\hat{f}(s_{t+1})\\right|^2", "text": "R'(s_t, a_t) = R(s_t, a_t) + λ·|f(s_{t+1}) - f̂(s_{t+1})|².", "fields": [], "refs": []}, {"sec_id": "", "heading": "Algorithm 1: Training the Mask Network", "kind": "code", "code": "Input:  Target agent's policy π\nOutput: Mask network ˜πθ\n\nInitialize weights θ for mask net ˜πθ\nθ_old ← θ\nfor iteration = 1, 2, ... do\n    Set initial state s_0 ~ ρ\n    D ← ∅\n    for t = 0 to T do\n        Sample a_t ~ π(a_t | s_t)\n        Sample a^m_t ~ ˜πθ_old(a^m_t | s_t)\n        Compute actual action: a ← a_t ⊙ a^m_t\n        (s_{t+1}, R'_t) ← env.step(a)\n          where R'_t = R(s_t, a_t) + α · a^m_t\n        Record (s_t, s_{t+1}, a^m_t, R'_t) in D\n    end for\n    Update θ_old ← θ using D via PPO algorithm\nend for", "text": "Pseudocode for training the mask network via PPO with the modified reward R'_t = R(s_t,a_t) + α·a^m_t.", "fields": [], "refs": []}, {"sec_id": "", "heading": "Algorithm 2: Refining the DRL Agent", "kind": "code", "code": "Input:  Pre-trained policy π, trained mask network ˜πθ,\n        default initial distribution ρ, reset probability p\nOutput: Refined policy π'\n\nfor iteration = 1, 2, ... do\n    D ← ∅\n    RAND_NUM ← Uniform(0, 1)\n    if RAND_NUM &lt; p then\n        Run π to obtain trajectory τ of length K\n        Identify most critical state s_t in τ via ˜πθ\n           (s_t = argmax_t P(a^m=0|s_t))\n        Set initial state s_0 ← s_t\n    else\n        Set initial state s_0 ~ ρ\n    end if\n    for t = 0 to T do\n        Sample a_t ~ π(a_t | s_t)\n        (s_{t+1}, R_t) ← env.step(a_t)\n        Compute RND bonus R^RND_t = |f(s_{t+1}) - f̂(s_{t+1})|²\n           (with normalization)\n        Add (s_t, s_{t+1}, a_t, R_t + λ · R^RND_t) to D\n    end for\n    Optimize πθ w.r.t. PPO loss on D\n    Optimize f̂θ w.r.t. MSE loss on D using Adam\nend for\nπ' ← πθ", "text": "Pseudocode for RICE refining: mixed-distribution initial state sampling (probability p of resetting to the critical state) plus RND-augmented PPO updates.", "fields": [], "refs": []}, {"sec_id": "", "heading": "Key Theoretical Results", "kind": "kv", "fields": [{"label": "Theorem 3.3", "value": "(η(π̄) ≤ η(π)): Under Assumption 3.1 (pre-trained policy better than random), the perturbed policy's expected reward is upper-bounded by that of the target policy. Proof via Performance Difference Lemma (Kakade & Langford, 2002)."}, {"label": "Lemma 3.5", "value": "(MaskNet sampling ≡ better policy): The importance-weighted sampling of states via the mask network is equivalent to sampling from a state occupancy distribution induced by an improved policy ˆπ with η(ˆπ) ≥ η(π). Proof via reweighting: d^π̂_ρ(s,a) = d^π_ρ(s,a) · w(s,a) where w(s,a) ∝ Q^π(s,a)."}, {"label": "Claim 1", "value": "(Tighter bound with explanation): By Assumption 3.4, η(ˆπ) ≥ η(π) implies ‖d^π*/d^π̂_ρ‖∞ ≤ ‖d^π*/d^π_ρ‖∞, thus the sub-optimality bound under RICE's mixed distribution is tighter than under random explanation."}], "text": "Theorem 3.3 (η(π̄) ≤ η(π)); Lemma 3.5 (MaskNet sampling ≡ better policy); Claim 1 (tighter bound with explanation).", "refs": [{"raw": "Theorem 3.3", "kind": "unknown", "target": null}, {"raw": "Lemma 3.5", "kind": "unknown", "target": null}]}, {"sec_id": "", "heading": "Complexity", "kind": "prose", "text": "Mask network training: O(N·T) per iteration (N environments rollouts, T timesteps), same order as original policy training. Critical state identification: O(T) per trajectory (single forward pass through mask network). RICE refining: O(N·T) per iteration (standard PPO) + O(d_f) for RND target/predictor forward pass.", "fields": [], "refs": []}]}, {"file": "architecture.md", "role": "architecture", "file_title": "System Architecture", "sections": [{"sec_id": "", "heading": "Overview", "kind": "steps", "steps": ["Explanation Phase: Train a mask network (Optimized StateMask) to identify critical states.", "Refining Phase: Use critical states + default states as mixed initial distribution; refine policy with PPO + RND."], "text": "RICE consists of two sequential phases operating on a pre-trained DRL policy π: (1) Explanation Phase: Train a mask network (Optimized StateMask) to identify critical states. (2) Refining Phase: Use critical states + default states as mixed initial distribution; refine policy with PPO + RND.", "fields": [], "refs": []}, {"sec_id": "", "heading": "Component Graph", "kind": "code", "code": "Pre-trained Policy π\n       │\n       ▼\n┌───────────────────────────────────────┐\n│  PHASE 1: Mask Network Training          │\n│                                         │\n│  [Mask Network ˜πθ]                     │\n│    Input:  state s_t ∈ ℝ^d_s            │\n│    Output: binary action a^m_t ∈ {0,1}  │\n│    Same arch as target policy network   │\n│                                         │\n│  [Perturbed Policy π̄]                   │\n│    a_t = at ⊙ a^m_t                     │\n│    (a^m=0 → keep at; a^m=1 → random)   │\n│                                         │\n│  [Modified Reward]                      │\n│    R′(s,a) = R(s,a) + α·a^m_t          │\n│                                         │\n│  [PPO Optimizer for ˜πθ]               │\n│    Objective: J(θ) = max η(π̄)          │\n└───────────────────────────────────────┘\n       │\n       │  trained mask network ˜πθ\n       ▼\n┌───────────────────────────────────────┐\n│  PHASE 2: RICE Refining                  │\n│                                         │\n│  [Critical State Identifier]            │\n│    Run π to get trajectory τ            │\n│    Apply ˜πθ → importance scores        │\n│    Select s* = argmax P(a^m=0|s_t)      │\n│                                         │\n│  [Mixed Initial Distribution Sampler]   │\n│    With prob p: s0 ← s* (critical)      │\n│    With prob (1-p): s0 ~ ρ (default)   │\n│                                         │\n│  [RND Module]                           │\n│    Target network f: ℝ^d_s → ℝ^d_f     │\n│    Predictor network f̂: ℝ^d_s → ℝ^d_f  │\n│    Bonus: R^RND = |f(s') - f̂(s')|²     │\n│    Normalized per-episode               │\n│                                         │\n│  [PPO Refining Agent]                   │\n│    Total reward: R(s,a) + λ·R^RND(s')  │\n│    Optimizes π using PPO loss           │\n│    f̂ updated via MSE loss on D         │\n│                                         │\n│  Output: Refined policy π′             │\n└───────────────────────────────────────┘", "text": "Two-phase component graph: Phase 1 (Mask Network Training) feeds its trained mask network into Phase 2 (RICE Refining), which combines the Critical State Identifier, Mixed Initial Distribution Sampler, RND Module, and PPO Refining Agent to produce the refined policy π'.", "fields": [], "refs": []}, {"sec_id": "", "heading": "Design Rationale", "kind": "steps", "steps": ["Simplified StateMask objective: By Theorem 3.3 (η(π̄) ≤ η(π) under Assumption 3.1), maximizing η(π̄) is equivalent to the original min-|η(π)−η(π̄)| and enables vanilla PPO training.", "Binary blinding action: The mask network outputs 0 (critical — preserve action) or 1 (non-critical — randomize action). State importance = P(a^m=0|s).", "Episode-level critical state selection: From each sampled trajectory τ of length K, the single state with maximum importance score is selected as the critical state for reset.", "RND normalization: The RND bonus is normalized per episode to maintain stable scale relative to the task reward.", "PPO as the base algorithm: Leverages PPO's monotonic improvement guarantee for both mask network training and policy refining.", "Environment reset mechanism: Implemented as in Go-Explore (Ecoffet et al., 2019) — requires simulator-based environment that supports state restoration. Compatible with goal/state-conditioned policies as a fallback."], "text": "Six design-rationale points explaining the simplified objective, binary blinding action, episode-level critical state selection, RND normalization, choice of PPO, and the Go-Explore-style environment reset mechanism.", "fields": [], "refs": []}, {"sec_id": "", "heading": "Component Interfaces", "kind": "table", "markdown": "| Component | Input | Output |\n|-----------|-------|--------|\n| Mask Network | state s_t (obs vector) | P(a^m=0|s) ∈ [0,1] |\n| Critical State Identifier | trajectory τ = {s_0,...,s_T}, trained π̃θ | critical state s* |\n| Mixed Distribution Sampler | s*, ρ, p ∈ [0,1] | initial state s_0 |\n| RND Module | next state s_{t+1} | scalar bonus R^RND |\n| PPO Refining Agent | (s_t, a_t, R_t + λ·R^RND, s_{t+1}) | updated policy π′ |", "text": "Table of component I/O interfaces: Mask Network, Critical State Identifier, Mixed Distribution Sampler, RND Module, PPO Refining Agent.", "fields": [], "refs": []}]}, {"file": "heuristics.md", "role": "heuristics", "file_title": "Heuristics", "sections": [{"sec_id": "H01", "heading": "H01: Set Reset Probability p to 0.25–0.5", "kind": "kv", "fields": [{"label": "Rationale", "value": "Exclusively using critical states (p=1) causes overfitting; exclusively using default states (p=0) recovers vanilla PPO fine-tuning. A mixed distribution prevents overfitting while still leveraging critical state information. The range [0.25, 0.5] provides the best empirical trade-off across all tested environments."}, {"label": "Sensitivity", "value": "medium"}, {"label": "Bounds", "value": "p ∈ {0, 0.25, 0.5, 0.75, 1.0} tested; p=0.25 optimal for Hopper, Walker2d, Selfish Mining, Auto Driving; p=0.5 optimal for Reacher, HalfCheetah, CAGE, Malware."}, {"label": "Code ref", "value": "src/execution/rice_refine.py"}, {"label": "Source", "value": "Section 4.3, Appendix C.3, Figure 7"}], "text": "Set reset probability p to 0.25–0.5, the empirical sweet spot between overfitting (p=1) and vanilla fine-tuning (p=0).", "refs": [{"raw": "src/execution/rice_refine.py", "kind": "unknown", "target": null}, {"raw": "Figure 7", "kind": "figure", "target": null}]}, {"sec_id": "H02", "heading": "H02: Set RND Weight λ to 0.01 for Most Environments", "kind": "kv", "fields": [{"label": "Rationale", "value": "Any λ > 0 significantly improves performance over λ = 0. The exact value has low sensitivity. λ = 0.01 provides the best performance in all environments except Selfish Mining."}, {"label": "Sensitivity", "value": "low"}, {"label": "Bounds", "value": "λ ∈ {0, 0.001, 0.01, 0.1} tested; λ=0.001 for Hopper/Reacher/Selfish Mining; λ=0.01 for all others."}, {"label": "Code ref", "value": "src/execution/rice_refine.py"}, {"label": "Source", "value": "Section 4.3, Appendix C.3, Figure 8, Table 3"}], "text": "Set RND weight λ to 0.01 for most environments; any λ > 0 helps, exact value has low sensitivity.", "refs": [{"raw": "src/execution/rice_refine.py", "kind": "unknown", "target": null}, {"raw": "Figure 8", "kind": "figure", "target": null}, {"raw": "Table 3", "kind": "figure", "target": null}]}, {"sec_id": "H03", "heading": "H03: Set Blinding Bonus α to 0.0001 (Low Sensitivity)", "kind": "kv", "fields": [{"label": "Rationale", "value": "α prevents the trivial solution (mask never blinds). Fidelity score is insensitive to α across the range tested. Using 0.0001 is conservative and avoids distorting the task reward signal."}, {"label": "Sensitivity", "value": "low"}, {"label": "Bounds", "value": "α ∈ {0.01, 0.001, 0.0001} tested; all yield comparable fidelity. Default: α = 0.0001 for all environments."}, {"label": "Code ref", "value": "src/execution/mask_network.py"}, {"label": "Source", "value": "Section 4.3, Appendix C.3, Figure 9, Table 3"}], "text": "Set blinding bonus α to 0.0001 for all environments; fidelity is insensitive to the exact value.", "refs": [{"raw": "src/execution/mask_network.py", "kind": "unknown", "target": null}, {"raw": "Figure 9", "kind": "figure", "target": null}, {"raw": "Table 3", "kind": "figure", "target": null}]}, {"sec_id": "H04", "heading": "H04: Use Vanilla PPO (Not Primal-Dual) for Mask Network Training", "kind": "kv", "fields": [{"label": "Rationale", "value": "By Theorem 3.3, the mask network objective can be simplified from min|η(π)−η(π̄)| to max η(π̄), enabling standard PPO. This eliminates the need to estimate discounted returns under both target and perturbed policies, reducing computation by ~16.8% on average."}, {"label": "Sensitivity", "value": "high (choice of optimizer determines theoretical validity)"}, {"label": "Bounds", "value": "Only PPO is theoretically justified here; other optimizers not validated."}, {"label": "Code ref", "value": "src/execution/mask_network.py"}, {"label": "Source", "value": "Section 3.3, Theorem 3.3, Table 4"}], "text": "Use vanilla PPO (not primal-dual) for mask network training, per Theorem 3.3's simplification.", "refs": [{"raw": "src/execution/mask_network.py", "kind": "unknown", "target": null}, {"raw": "Theorem 3.3", "kind": "unknown", "target": null}, {"raw": "Table 4", "kind": "figure", "target": null}]}, {"sec_id": "H05", "heading": "H05: Normalize RND Bonus Per Episode", "kind": "kv", "fields": [{"label": "Rationale", "value": "Raw RND prediction errors have varying magnitudes across environments. Normalization ensures the exploration bonus remains proportional to the task reward regardless of state space dimensionality."}, {"label": "Sensitivity", "value": "medium"}, {"label": "Bounds", "value": "Normalization should not collapse the bonus to zero before genuine exploration has occurred."}, {"label": "Code ref", "value": "src/execution/rice_refine.py"}, {"label": "Source", "value": "Section 3.3 (Algorithm 2), Burda et al. (2018)"}], "text": "Normalize the RND bonus per episode so it stays proportional to the task reward across environments.", "refs": [{"raw": "src/execution/rice_refine.py", "kind": "unknown", "target": null}]}]}]}}

<script>
"use strict";
(function () {
  const GLYPH = { question:"Q", experiment:"✦", decision:"→", dead_end:"✗", pivot:"↻", insight:"!", default:"•" };
  const TYPES = ["question","experiment","decision","dead_end","pivot","insight"];

  let DATA;
  try {
    // The payload sits between the BEGIN/END marker comments (kept in-file so the
    // skill can re-inject). Strip ONLY those two named markers before parsing; the
    // rest of textContent is pure JSON. (Marker text is not written literally here,
    // so it stays a single injection site.)
    var raw = document.getElementById("ara-data").textContent
                .replace(/\/\*\s*__ARA_DATA_(?:BEGIN|END)__\s*\*\//g, "");
    DATA = JSON.parse(raw);
  } catch (e) {
    document.getElementById("detail").innerHTML =
      '<div class="none">Could not parse embedded ARA data: ' + String(e) + '</div>';
    return;
  }

  const nodes = DATA.nodes || [];
  const byId = new Map(nodes.map(n => [n.id, n]));
  const kids = new Map();
  nodes.forEach(n => kids.set(n.id, []));
  let roots = [];
  nodes.forEach(n => {
    if (n.parent && byId.has(n.parent)) kids.get(n.parent).push(n.id);
    else roots.push(n.id);
  });
  // Traversal order: explicit DATA.order if given, else DFS from roots.
  let order = Array.isArray(DATA.order) && DATA.order.length ? DATA.order.filter(id => byId.has(id)) : [];
  if (!order.length) { const seen=new Set(); const dfs=id=>{if(seen.has(id))return;seen.add(id);order.push(id);(kids.get(id)||[]).forEach(dfs)}; roots.forEach(dfs); }

  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const glyph = t => GLYPH[t] || GLYPH.default;
  const cls = t => TYPES.includes(t) ? t : "default";

  // ---- header ----
  const m = DATA.meta || {};
  document.getElementById("h-title").textContent = m.title || "ARA Trajectory";
  document.getElementById("h-sub").textContent =
    [ (m.authors||[]).join(", "), m.venue, m.year ].filter(Boolean).join(" · ");
  if (m.abstract) document.getElementById("h-abstract").textContent = m.abstract;
  else document.getElementById("h-abstract-wrap").style.display = "none";

  const ftype = document.getElementById("ftype");
  const present = [...new Set(nodes.map(n => n.type))];
  TYPES.concat(present.filter(t=>!TYPES.includes(t))).filter(t=>present.includes(t))
    .forEach(t => { const o=document.createElement("option"); o.value=t; o.textContent=t; ftype.appendChild(o); });

  // ---- minimal markdown-table renderer ----
  function renderMd(md){
    if(!md) return "";
    const lines = String(md).split("\n");
    let out=[], i=0;
    while(i<lines.length){
      if(/^\s*\|/.test(lines[i]) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        const row = l => l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
        const head = row(lines[i]); i+=2; const body=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){ body.push(row(lines[i])); i++; }
        out.push('<table class="md"><thead><tr>'+head.map(h=>"<th>"+esc(h)+"</th>").join("")+
          '</tr></thead><tbody>'+body.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      } else { if(lines[i].trim()) out.push("<div>"+esc(lines[i])+"</div>"); i++; }
    }
    return out.join("");
  }

  // ---- detail pane ----
  function block(title, tag, inner, open, cls){
    return '<details class="block'+(cls?" "+cls:"")+'"'+(open?" open":"")+'><summary>'+esc(title)+
      (tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</summary><div class="body">'+inner+'</div></details>';
  }
  function chips(arr, klass){ return arr&&arr.length ? '<div class="chips">'+arr.map(x=>'<span class="chip '+(klass||"")+'">'+esc(x)+'</span>').join("")+'</div>' : ""; }

  function renderDetail(n){
    const d = document.getElementById("detail");
    let h = '<div class="dhead"><span class="badge '+cls(n.type)+'">'+esc(n.type)+'</span>'+
      '<span class="did">'+esc(n.id)+'</span>'+
      (n.support_level?'<span class="pill '+esc(n.support_level)+'">'+esc(n.support_level)+'</span>':'')+
      (n.isolated?'<span class="pill iso">isolated</span>':'')+'</div>';
    h += '<div class="dtitle">'+esc(n.title||"(untitled)")+'</div>';

    // reasoning (primary, always open) — the agent's thinking IS the content of a step
    let reason="";
    if(n.thinking){
      reason += '<div class="lead">'+esc(n.thinking)+'</div>';
      if(n.body) reason += '<div class="didwhat">what it did</div><div>'+esc(n.body)+'</div>';
    } else {
      reason += n.body ? '<div class="lead">'+esc(n.body)+'</div>' : '<div class="empty">No description.</div>';
    }
    if(n.depends_on&&n.depends_on.length) reason += chips(n.depends_on.map(x=>"⇠ depends on "+x));
    if(n.source_refs&&n.source_refs.length) reason += chips(n.source_refs, "ext");
    if(n.built_on&&n.built_on.length) reason += chipRow("built on", n.built_on, "chip-built");
    if(n.rejected_here&&n.rejected_here.length) reason += chipRow("rejected here", n.rejected_here, "chip-rej");
    if(n.recipe_refs&&n.recipe_refs.length) reason += recipeChips(n.recipe_refs);
    h += block(n.thinking?"reasoning":"what", n.type, reason, true, "reason");

    // result (the grounded payload) — open
    const r = n.result||{};
    if((r.sources&&r.sources.length)||(r.figures&&r.figures.length)||(r.tables&&r.tables.length)||(r.data&&r.data.length)){
      let s="";
      (r.figures||[]).forEach(f=>{ s+='<figure><img src="'+esc(f.img)+'" alt="'+esc(f.caption||f.id)+'"/>'+
        (f.caption?'<figcaption>'+esc(f.caption)+'</figcaption>':'')+'</figure>'; });
      (r.tables||[]).forEach(t=>{ s+=(t.caption?'<div class="empty">'+esc(t.caption)+'</div>':'')+renderMd(t.markdown); });
      (r.sources||[]).forEach(q=>{ s+='<div class="quote">'+esc(q.quote)+(q.ref?'<div class="ref">← '+esc(q.ref)+'</div>':'')+'</div>'; });
      (r.data||[]).forEach(x=>{ s+='<div class="ptr">⛁ <span class="path">'+esc(x.path)+'</span>'+(x.note?' — '+esc(x.note):'')+'</div>'; });
      h += block("result", "", s, true);
    }

    // why (claims) — supporting detail, collapsed
    if(n.why&&n.why.length){
      const w = n.why.map(c=>{
        let s='<div class="claim"><h4>'+esc(c.id)+(c.title?' — '+esc(c.title):'')+'</h4>';
        if(c.statement) s+='<div class="kv">'+esc(c.statement)+'</div>';
        if(c.status) s+='<div class="kv"><b>status</b> <span class="status '+esc(String(c.status).toLowerCase())+'">'+esc(c.status)+'</span></div>';
        if(c.conditions) s+='<div class="kv"><b>conditions</b> '+esc(c.conditions)+'</div>';
        if(c.falsification) s+='<div class="kv"><b>falsified if</b> '+esc(c.falsification)+'</div>';
        if(c.dependencies&&c.dependencies.length) s+='<div class="kv"><b>depends on</b> '+esc(c.dependencies.join(", "))+'</div>';
        if(c.provenance) s+='<div class="kv"><span class="prov">provenance: '+esc(c.provenance)+'</span></div>';
        return s+'</div>';
      }).join("");
      h += block("why", n.why.map(c=>c.id).join(" · "), w);
    }

    // how verified (experiments) — supporting detail, collapsed
    if(n.verified_by&&n.verified_by.length){
      const v = n.verified_by.map(e=>'<div class="claim"><h4>'+esc(e.id)+(e.title?' — '+esc(e.title):'')+'</h4>'+
        (e.run?'<div class="kv"><b>run</b> <span class="path mono">'+esc(e.run)+'</span></div>':'')+
        (e.setup?'<div class="kv"><b>setup</b> '+esc(e.setup)+'</div>':'')+
        (e.metrics?'<div class="kv"><b>metrics</b> '+esc(e.metrics)+'</div>':'')+'</div>').join("");
      h += block("how verified", n.verified_by.map(e=>e.id).join(" · "), v);
    }

    // artifact pointers (src/artifacts.md) — collapsed
    if(n.artifact&&n.artifact.length){
      const a = n.artifact.map(x=>'<div class="ptr">▸ <b>'+esc(x.name)+'</b> — <span class="path">'+esc(x.pointer)+'</span>'+
        (x.what?'<div class="empty">'+esc(x.what)+'</div>':'')+'</div>').join("");
      h += block("artifact", "pointer", a);
    }

    d.innerHTML = h;
    if(typeof LEX!=="undefined" && LEX) linkifyConcepts(d);
    d.scrollTop = 0;
  }

  // ---- map ----
  let selected = null;
  function selectNode(id){
    if(!byId.has(id)) return;
    selected = id;
    document.querySelectorAll(".node").forEach(el=>el.classList.toggle("sel", el.dataset.id===id));
    const el = document.querySelector('.node[data-id="'+CSS.escape(id)+'"]');
    if(el) el.scrollIntoView({block:"nearest"});
    renderDetail(byId.get(id));
    rstat();
  }

  function nodeRow(n){
    const row = document.createElement("div");
    row.className = "node "+(n.type==="dead_end"?"dead":"");
    row.dataset.id = n.id; row.dataset.type = n.type;
    // calmer than before: one glyph + id + (quiet) cross-edge marker; the ⊕/⊘ count soup is gone.
    row.innerHTML = '<span class="glyph '+cls(n.type)+'">'+glyph(n.type)+'</span>'+
      '<span><span class="meta"><span class="nid">'+esc(n.id)+'</span>'+
      (n.depends_on&&n.depends_on.length?'<span class="dep" title="depends on '+esc(n.depends_on.join(", "))+'">⇠ '+esc(n.depends_on.join(","))+'</span>':'')+
      '</span><div class="ntitle">'+esc(n.title||n.body||"(untitled)")+'</div></span>';
    row.addEventListener("click", ()=>selectNode(n.id));
    // hover a node to highlight its cross-edge targets (gentler than always-on connectors)
    if(n.depends_on&&n.depends_on.length){
      row.addEventListener("mouseenter", ()=>n.depends_on.forEach(t=>{ const el=document.querySelector('.node[data-id="'+CSS.escape(t)+'"]'); if(el) el.classList.add("deptarget"); }));
      row.addEventListener("mouseleave", ()=>document.querySelectorAll(".node.deptarget").forEach(el=>el.classList.remove("deptarget")));
    }
    return row;
  }
  function renderSubtree(id, container){
    const n = byId.get(id); if(!n) return;
    container.appendChild(nodeRow(n));
    const cs = kids.get(id)||[];
    if(cs.length){ const wrap=document.createElement("div"); wrap.className="kid"; cs.forEach(c=>renderSubtree(c,wrap)); container.appendChild(wrap); }
  }
  function renderMap(){
    const map = document.getElementById("map"); map.innerHTML="";
    const normalRoots = roots.filter(id=>!byId.get(id).isolated);
    const isoRoots = roots.filter(id=>byId.get(id).isolated);
    normalRoots.forEach(id=>renderSubtree(id, map));
    if(isoRoots.length){
      const box=document.createElement("div"); box.className="isobox";
      const hdr=document.createElement("div"); hdr.className="isohdr"; hdr.textContent="isolated subtree"; box.appendChild(hdr);
      isoRoots.forEach(id=>renderSubtree(id, box)); map.appendChild(box);
    }
  }

  // ---- filter / search ----
  function applyFilters(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ty = document.getElementById("ftype").value;
    const deadOnly = document.getElementById("fdead").checked;
    let shown=0;
    document.querySelectorAll(".node").forEach(el=>{
      const n = byId.get(el.dataset.id);
      const text = (n.id+" "+(n.title||"")+" "+(n.body||"")).toLowerCase();
      const ok = (!q||text.includes(q)) && (!ty||n.type===ty) && (!deadOnly||n.type==="dead_end");
      el.classList.toggle("dim", !ok);
      if(ok) shown++;
    });
    document.getElementById("rstat").textContent = shown+" / "+nodes.length+" steps";
  }
  function rstat(){
    const i = selected?order.indexOf(selected):-1;
    document.getElementById("rstat").textContent = (i>=0?("step "+(i+1)+" / "+order.length):(nodes.length+" steps"));
  }

  // ---- replay ----
  let timer=null;
  function step(delta){
    let i = selected?order.indexOf(selected):-1;
    i = Math.max(0, Math.min(order.length-1, i+delta));
    selectNode(order[i]);
  }
  function play(){
    if(timer){ stop(); return; }
    if(!selected) selectNode(order[0]);
    document.getElementById("rplay").textContent="⏸ Pause";
    timer = setInterval(()=>{
      const i = selected?order.indexOf(selected):-1;
      if(i>=order.length-1){ stop(); return; }
      step(1);
    }, 1300);
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById("rplay").textContent="▶ Replay"; }

  // ======================= v1.1 enrichment layers (all inert unless present) =======================
  const CTX = DATA.context, GLO = DATA.glossary, DEP = DATA.dependencies, REC = DATA.recipes;
  const LAYERS = { context:CTX, glossary:GLO, dependencies:DEP, recipes:REC };

  // ---- indexes (built once) ----
  const claimToNodes = new Map();
  nodes.forEach(n => (n.why||[]).forEach(c => { if(c&&c.id){ if(!claimToNodes.has(c.id)) claimToNodes.set(c.id,[]); claimToNodes.get(c.id).push(n.id); } }));
  const firstNodeForClaim = id => (claimToNodes.get(id)||[])[0] || null;
  const rwById   = new Map(((DEP&&DEP.entries)||[]).map(e => [e.rw_id, e]));
  const termById = new Map(((GLO&&GLO.terms)||[]).map(t => [t.term_id, t]));
  // concept "used by" (inferred) from each node's name-matched concepts[]
  if(GLO){
    const nameToTerm = new Map();
    (GLO.terms||[]).forEach(t => { if(t.name) nameToTerm.set(String(t.name).toLowerCase(), t); (t.aliases||[]).forEach(a=>nameToTerm.set(String(a).toLowerCase(), t)); });
    nodes.forEach(n => (n.concepts||[]).forEach(cn => { const t=nameToTerm.get(String(cn).toLowerCase()); if(t){ (t._used=t._used||[]).push(n.id); } }));
  }

  // ---- tiny inline-math fallback (no CDN; operates on already-escaped text, adds only safe tags) ----
  const GK={alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",eta:"η",theta:"θ",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",phi:"φ",chi:"χ",psi:"ψ",omega:"ω",Delta:"Δ",Sigma:"Σ",Omega:"Ω",Phi:"Φ",Theta:"Θ",Lambda:"Λ",Gamma:"Γ",nabla:"∇",partial:"∂",times:"×",cdot:"·",infty:"∞",approx:"≈",leq:"≤",geq:"≥",neq:"≠",to:"→",in:"∈",sum:"Σ",prod:"Π",sqrt:"√",mathbb:"",mathcal:"",mathbf:"",mathrm:"",left:"",right:""};
  function texInner(s){
    s=s.replace(/\\(?:mathbb|mathcal|mathbf|mathrm)\{([^{}]*)\}/g,"$1");
    s=s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)");
    s=s.replace(/\\([A-Za-z]+)/g,(m,w)=>GK[w]!==undefined?GK[w]:m);
    s=s.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^([\w()+\-])/g,"<sup>$1</sup>");
    s=s.replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>").replace(/_([\w()+\-])/g,"<sub>$1</sub>");
    return s;
  }
  function mathPass(escaped){
    if(escaped.indexOf("$")<0) return escaped;
    return escaped.replace(/\$\$([^$]+)\$\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>')
                  .replace(/\$([^$]+)\$/g,(m,x)=>'<span class="math">'+texInner(x)+'</span>');
  }
  function mtext(v){ const e=esc(v); try{ return mathPass(e); }catch(_){ return e; } }

  // ---- typed-ref rendering (off-ARA pointers stay inert; in-ARA targets become jump chips) ----
  function refUrl(rf){
    const raw=rf.raw||"";
    if(rf.kind==="url"){ const m=raw.match(/https?:\/\/\S+/); return m?m[0]:""; }
    if(rf.kind==="arxiv"){ const m=raw.match(/(\d{4}\.\d{4,5})/); return m?("https://arxiv.org/abs/"+m[1]):""; }
    if(rf.kind==="doi"){ const m=raw.match(/(10\.\d{4,}\/\S+)/); return m?("https://doi.org/"+m[1]):""; }
    return "";
  }
  function refChip(rf){
    const raw=esc(rf.raw||""), url=refUrl(rf);
    if(url) return '<a class="chip ext" href="'+esc(url)+'" target="_blank" rel="noopener">'+raw+'</a>';
    if(rf.target){
      if(rf.kind==="claim")        return '<span class="chip jump" data-jump-claim="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="node")         return '<span class="chip jump" data-jump-node="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="concept")      return '<span class="chip jump" data-open-term="'+esc(rf.target)+'">'+raw+'</span>';
      if(rf.kind==="related_work") return '<span class="chip jump" data-open-panel="dependencies" data-anchor="ov-'+esc(rf.target)+'">'+raw+'</span>';
      return '<span class="chip jump" data-scroll="ov-'+esc(rf.target)+'">'+raw+'</span>';
    }
    const dangle=(rf.kind==="claim"||rf.kind==="related_work"||rf.kind==="concept");
    return '<span class="chip '+(dangle?'dangle" title="referenced but not found in this ARA':'ext')+'">'+raw+'</span>';
  }
  function refRow(refs){ return refs&&refs.length ? '<div class="chips">'+refs.map(refChip).join("")+'</div>' : ""; }

  // ---- per-node provenance chips (consumed by renderDetail) ----
  function chipRow(label, arr, klass){
    const cs=arr.map(x=>{
      const txt=[x.rw_id,x.name].filter(Boolean).join(" · ")||"?";
      const tip=x.relation_raw?(' title="'+esc(x.relation_raw)+'"'):'';
      const op =x.rw_id?(' data-open-panel="dependencies" data-anchor="ov-'+esc(x.rw_id)+'"'):'';
      return '<span class="chip '+klass+(x.rw_id?' jump':'')+'"'+tip+op+'>'+esc(txt)+'</span>';
    }).join("");
    return '<div class="chiplabel">'+esc(label)+'</div><div class="chips">'+cs+'</div>';
  }
  function recipeChips(arr){
    const cs=arr.map(x=>{
      const anchor="ov-sec-"+(x.file||"")+"-"+(x.sec_id||"");
      return '<span class="chip chip-recipe jump" data-open-panel="recipes" data-anchor="'+esc(anchor)+'" title="'+esc((x.file||"")+(x.role?(" · "+x.role):""))+'">▦ '+esc(x.heading||x.file||"recipe")+'</span>';
    }).join("");
    return '<div class="chiplabel">recipe</div><div class="chips">'+cs+'</div>';
  }

  // ---- the four overlay renderers (reuse block/chips/renderMd) ----
  function renderContext(){
    let h=""; if(CTX.summary) h+='<div class="ribbon">'+esc(CTX.summary)+'</div>';
    (CTX.sections||[]).forEach(sec=>{
      let inner="";
      if(sec.present===false){ inner='<div class="muted grey">(not specified in this ARA)</div>'; }
      else (sec.entries||[]).forEach(en=>{
        let c='<div class="card" id="ov-'+esc(en.ent_id||"")+'"><h4>'+(en.ent_id?'<span class="did">'+esc(en.ent_id)+'</span> ':'')+esc(en.ent_title||"")+(en.inferred_id?' <span class="sub">(pos.)</span>':'')+'</h4>';
        if(!en.unstructured && en.fields && en.fields.length) en.fields.forEach(f=>c+='<div class="kv"><b>'+esc(f.label)+'</b> '+mtext(f.value)+'</div>');
        else if(en.text) c+='<div class="kv">'+mtext(en.text)+'</div>';
        if(en.unstructured) c+='<div class="sub">unstructured</div>';
        c+=refRow(en.refs)+'</div>'; inner+=c;
      });
      h+=block(sec.heading||sec.role||"section", sec.role||"", inner, sec.role==="insight");
    });
    return h || '<div class="muted">No problem context.</div>';
  }
  function renderGlossary(filter){
    const f=(filter||"").trim().toLowerCase();
    const match=t=>!f||((t.name||"")+" "+(t.aliases||[]).join(" ")+" "+(t.definition||"")).toLowerCase().includes(f);
    function card(t){
      let c='<div class="card" id="ov-'+esc(t.term_id)+'"><h4>'+esc(t.name)+(t.group?' <span class="sub">'+esc(t.group)+'</span>':'')+'</h4>';
      if(t.aliases&&t.aliases.length) c+='<div class="chips">'+t.aliases.map(a=>'<span class="chip">'+esc(a)+'</span>').join("")+'</div>';
      if(t.definition) c+='<div class="kv">'+mtext(t.definition)+'</div>';
      (t.fields||[]).forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
      if(t.related&&t.related.length) c+='<div class="kv"><b>related</b> '+t.related.map(r=>{const rt=termById.get(r);return '<span class="chip jump" data-open-term="'+esc(r)+'">'+esc(rt?rt.name:r)+'</span>';}).join(" ")+'</div>';
      if(t._used&&t._used.length) c+='<div class="kv"><b>mentions</b> '+[...new Set(t._used)].map(nid=>'<span class="chip jump" data-jump-node="'+esc(nid)+'">'+esc(nid)+'</span>').join(" ")+' <span class="sub">(inferred)</span></div>';
      return c+refRow(t.refs)+'</div>';
    }
    const groups=GLO.groups&&GLO.groups.length?GLO.groups:null; let h="";
    if(groups){
      const grouped=new Set();
      groups.forEach(g=>{ (g.term_ids||[]).forEach(id=>grouped.add(id)); const ts=(g.term_ids||[]).map(id=>termById.get(id)).filter(Boolean).filter(match); if(ts.length) h+=block(g.name||"group", String(ts.length), ts.map(card).join(""), true); });
      const rest=(GLO.terms||[]).filter(t=>!grouped.has(t.term_id)).filter(match);
      if(rest.length) h+=block("other", String(rest.length), rest.map(card).join(""), true);
    } else { const ts=(GLO.terms||[]).filter(match); h=ts.map(card).join(""); }
    return h || '<div class="muted">No matching terms.</div>';
  }
  function renderDeps(filter){
    const f=(filter||"").trim().toLowerCase(); let h="";
    if(DEP.preamble) h+='<div class="muted">'+esc(DEP.preamble)+'</div>';
    if(DEP.attribution) h+='<div class="ribbon">'+esc(DEP.attribution)+'</div>';
    const ents=(DEP.entries||[]).filter(e=>!e.is_footprint).filter(e=>!f||(((e.rw_id||"")+" "+(e.name||"")+" "+(e.relation_raw||"")+" "+(e.delta||"")).toLowerCase().includes(f)));
    ents.forEach(e=>{
      const rn=e.relation_norm, relc=["baseline","imports","extends","bounds","refutes"].includes(rn)?rn:"neutral";
      let c='<div class="card" id="ov-'+esc(e.rw_id||"")+'"><h4>'+(e.rw_id?'<span class="did">'+esc(e.rw_id)+'</span> ':'')+esc(e.name||"")+'</h4>';
      c+='<div class="chips"><span class="rel '+relc+'">'+esc(e.relation_raw||rn||"related")+'</span>'+(e.cross_agent?'<span class="chip" title="other-agent provenance">↔ other-agent</span>':'')+'</div>';
      if(e.delta) c+='<div class="kv">'+mtext(e.delta)+'</div>';
      if(e.adopted) c+='<div class="kv"><b>adopted</b> '+esc(e.adopted)+'</div>';
      let prov=(e.grounding||[]).map(refChip).join("");
      (e.claims||[]).filter(id=>claimToNodes.has(id)).forEach(id=>prov+='<span class="chip jump" data-jump-claim="'+esc(id)+'">'+esc(id)+'</span>');
      c+= prov?('<div class="kv"><b>grounding</b> '+prov+'</div>'):'<div class="muted">ungrounded</div>';
      h+=c+'</div>';
    });
    if(!ents.length) h+='<div class="muted">No matching dependencies.</div>';
    const fp=DEP.footprint||[];
    if(fp.length) h+=block("Citation footprint", String(fp.length), fp.map(x=>'<div class="ptr"><span class="muted">'+esc(x.ref_id||"")+'</span> '+esc(x.citation||"")+'</div>').join(""), false);
    return h;
  }
  function renderRecipes(){
    let h="";
    (REC.files||[]).forEach(file=>{
      let inner="";
      (file.sections||[]).forEach(sec=>{
        let c='<div class="card" id="ov-sec-'+esc((file.file||"")+"-"+(sec.sec_id||""))+'"><h4>'+(sec.sec_id?'<span class="did">'+esc(sec.sec_id)+'</span> ':'')+esc(sec.heading||"")+'</h4>';
        if(sec.kind==="table"&&sec.markdown) c+=renderMd(sec.markdown);
        else if(sec.kind==="steps"&&sec.steps&&sec.steps.length) c+='<ol>'+sec.steps.map(s=>'<li>'+mtext(String(s).replace(/^\s*\d+\.\s*/,""))+'</li>').join("")+'</ol>';
        else if(sec.kind==="kv"&&sec.fields&&sec.fields.length) sec.fields.forEach(fl=>c+='<div class="kv"><b>'+esc(fl.label)+'</b> '+mtext(fl.value)+'</div>');
        else if(sec.kind==="code"&&sec.code) c+='<pre class="snip">'+esc(sec.code)+'</pre>';
        else if(sec.kind==="math"&&sec.code) c+='<div class="kv math">'+mtext(sec.code)+'</div>';
        else if(sec.text) c+='<div class="kv">'+mtext(sec.text)+'</div>';
        if(sec.warn) c+='<div class="warn">'+esc(sec.warn)+'</div>';
        inner+=c+refRow(sec.refs)+'</div>';
      });
      h+=block((file.file_title||file.file||"recipe")+(file.role?("  ·  "+file.role):""), String((file.sections||[]).length), inner, true);
    });
    return h || '<div class="muted">No recipe content.</div>';
  }

  // ---- overlay open/close + layerbar wiring ----
  const ov=document.getElementById("overlay");
  let lastTrigger=null;
  const PANEL_RENDER={ context:renderContext, glossary:()=>renderGlossary(""), dependencies:()=>renderDeps(""), recipes:renderRecipes };
  function hasContent(name){ const L=LAYERS[name]; if(!L) return false;
    if(name==="context") return (L.sections||[]).length>0;
    if(name==="glossary") return (L.terms||[]).length>0;
    if(name==="dependencies") return (L.entries||[]).length>0||(L.footprint||[]).length>0;
    if(name==="recipes") return (L.files||[]).length>0; return false; }
  function panelTitle(name){ const L=LAYERS[name]||{}; return L.title || ({context:"Context",glossary:"Concepts",dependencies:"Dependencies",recipes:"Solution"}[name]); }
  function panelCount(name){ const L=LAYERS[name]||{};
    if(name==="glossary") return (L.terms||[]).length;
    if(name==="dependencies") return (L.entries||[]).length;
    if(name==="recipes") return (L.files||[]).reduce((a,f)=>a+(f.sections||[]).length,0); return 0; }
  function openPanel(name, anchor){
    if(!hasContent(name)) return;
    stop(); lastTrigger=document.activeElement;
    document.getElementById("ov-title").textContent=panelTitle(name);
    const body=document.getElementById("ov-body"); body.innerHTML=PANEL_RENDER[name]();
    if(LEX) linkifyConcepts(body);
    const q=document.getElementById("ov-q");
    if(name==="glossary"||name==="dependencies"){ q.hidden=false; q.value=""; q.dataset.panel=name; } else { q.hidden=true; }
    ov.hidden=false;
    if(anchor){ const el=document.getElementById(anchor); if(el) el.scrollIntoView({block:"center"}); } else body.scrollTop=0;
    (q.hidden?document.getElementById("ov-close"):q).focus();
  }
  function closePanel(){ ov.hidden=true; if(lastTrigger&&lastTrigger.focus) lastTrigger.focus(); }
  document.querySelectorAll(".lbtn").forEach(b=>{ const name=b.dataset.panel;
    if(hasContent(name)){ b.hidden=false; const c=b.querySelector(".cnt"); if(c){ const n=panelCount(name); if(n) c.textContent=n; } b.addEventListener("click",()=>openPanel(name)); } });
  document.getElementById("ov-q").addEventListener("input", e=>{ const p=e.target.dataset.panel, body=document.getElementById("ov-body");
    body.innerHTML = p==="glossary"?renderGlossary(e.target.value):renderDeps(e.target.value); if(LEX) linkifyConcepts(body); });

  // ---- glossary lexicon + popover ----
  const LEX=(GLO&&GLO.lexicon&&Object.keys(GLO.lexicon).length)?(function(){
    const surf=Object.keys(GLO.lexicon).filter(s=>s.length>=3).sort((a,b)=>b.length-a.length);
    if(!surf.length) return null;
    const re=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return { re:new RegExp("\\b("+surf.map(re).join("|")+")\\b","i"), map:GLO.lexicon };
  })():null;
  const SKIP_TAGS={A:1,CODE:1,PRE:1,BUTTON:1,SCRIPT:1,STYLE:1,H4:1,H5:1,SUMMARY:1};
  function linkifyConcepts(root){
    if(!LEX) return;
    const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(t){
      if(!t.nodeValue||!t.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p=t.parentNode; while(p&&p!==root){ if(p.classList&&p.classList.contains("gterm")) return NodeFilter.FILTER_REJECT; if(SKIP_TAGS[p.tagName]) return NodeFilter.FILTER_REJECT; p=p.parentNode; }
      return NodeFilter.FILTER_ACCEPT; } });
    const seen=new Set(), hits=[]; let t;
    while((t=walker.nextNode())){ const m=LEX.re.exec(t.nodeValue); if(!m) continue; const tid=LEX.map[m[1].toLowerCase()]; if(!tid||seen.has(tid)) continue; seen.add(tid); hits.push({node:t,index:m.index,len:m[1].length,tid}); }
    hits.forEach(hp=>{ const tn=hp.node, txt=tn.nodeValue, par=tn.parentNode; if(!par) return;
      const span=document.createElement("span"); span.className="gterm"; span.dataset.term=hp.tid; span.tabIndex=0; span.textContent=txt.slice(hp.index,hp.index+hp.len);
      const after=document.createTextNode(txt.slice(hp.index+hp.len));
      par.replaceChild(after,tn); par.insertBefore(span,after); par.insertBefore(document.createTextNode(txt.slice(0,hp.index)),span); });
  }
  const gpop=document.getElementById("gpop");
  function gpopShow(span){ const t=termById.get(span.dataset.term); if(!t) return;
    const def=t.definition||""; gpop.innerHTML='<h5>'+esc(t.name)+'</h5><div>'+mtext(def.slice(0,240))+(def.length>240?'…':'')+'</div><span class="gp-open" data-open-term="'+esc(t.term_id)+'">open in glossary →</span>';
    gpop.style.display="block"; const r=span.getBoundingClientRect();
    gpop.style.left=Math.max(6,Math.min(r.left, window.innerWidth-372))+"px"; gpop.style.top=(r.bottom+6)+"px"; }
  function gpopHide(){ gpop.style.display="none"; }

  // ---- delegated interactions for the new layers ----
  document.addEventListener("click", e=>{
    const el=e.target.closest&&e.target.closest("[data-close],[data-jump-node],[data-jump-claim],[data-open-panel],[data-open-term],[data-scroll]");
    if(!el) return;
    if(el.hasAttribute("data-close")){ closePanel(); return; }
    if(el.dataset.jumpNode){ closePanel(); selectNode(el.dataset.jumpNode); return; }
    if(el.dataset.jumpClaim){ const nid=firstNodeForClaim(el.dataset.jumpClaim); if(nid){ closePanel(); selectNode(nid); } return; }
    if(el.dataset.openTerm){ openPanel("glossary","ov-"+el.dataset.openTerm); return; }
    if(el.hasAttribute("data-open-panel")){ openPanel(el.dataset.openPanel, el.dataset.anchor||null); return; }
    if(el.dataset.scroll){ const t=document.getElementById(el.dataset.scroll); if(t) t.scrollIntoView({block:"center"}); return; }
  });
  document.addEventListener("mouseover", e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("mouseout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  document.addEventListener("focusin",   e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopShow(g); });
  document.addEventListener("focusout",  e=>{ const g=e.target.closest&&e.target.closest(".gterm"); if(g) gpopHide(); });
  window.addEventListener("scroll", gpopHide, true);

  document.getElementById("q").addEventListener("input", applyFilters);
  document.getElementById("ftype").addEventListener("change", applyFilters);
  document.getElementById("fdead").addEventListener("change", applyFilters);
  document.getElementById("rplay").addEventListener("click", play);
  document.getElementById("rprev").addEventListener("click", ()=>{stop();step(-1);});
  document.getElementById("rnext").addEventListener("click", ()=>{stop();step(1);});
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ if(!ov.hidden){ closePanel(); return; } gpopHide(); }
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
    if(e.key==="ArrowLeft"){stop();step(-1);} else if(e.key==="ArrowRight"){stop();step(1);}
    else if(e.key==="c"||e.key==="g"||e.key==="d"||e.key==="r"){ const p={c:"context",g:"glossary",d:"dependencies",r:"recipes"}[e.key]; if(hasContent(p)) openPanel(p); }
  });

  renderMap();
  rstat();
})();
</script>
</body>
</html>
