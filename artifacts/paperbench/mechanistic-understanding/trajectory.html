oxic key vector scaling (§5.3)."}, {"name": "evaluation.py", "pointer": "src/execution/evaluation.py", "what": "Evaluation metrics: toxicity (Perspective API), perplexity (Wikitext-2), F1 (§3.3)."}], "built_on": [{"rw_id": "RW02", "name": "Rafailov et al., 2023", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Gehman et al., 2020", "relation_raw": "imports"}, {"rw_id": "RW06", "name": "Wei et al., 2023", "relation_raw": "extends"}, {"rw_id": "RW11", "name": "Yang et al., 2023; Qi et al., 2023", "relation_raw": "baseline"}], "rejected_here": [{"rw_id": "RW09", "name": "Zou et al., 2023", "relation_raw": "bounds"}, {"rw_id": "RW10", "name": "Carlini et al., 2023", "relation_raw": "bounds"}]}], "context": {"title": "Problem", "summary": "DPO does not delete or overwrite toxic capabilities encoded in MLP value vectors.", "sections": [{"role": "setting", "heading": "", "present": false, "entries": []}, {"role": "observations", "heading": "Observations", "present": true, "entries": [{"ent_id": "O1", "inferred_id": false, "ent_title": "Alignment algorithms suppress but may not eliminate undesirable capabilities", "text": "Statement: RLHF-based alignment algorithms like DPO and PPO can reduce toxic outputs from LLMs, but the mechanisms by which they do so are not understood. Evidence: Prior work (Wei et al., 2023; Zou et al., 2023; Carlini et al., 2023) shows aligned models are easily jailbroken; empirical evidence without mechanistic explanation. Implication: Without understanding the mechanism, we cannot predict failure modes or design robust defenses.", "unstructured": false, "fields": [{"label": "Statement", "value": "RLHF-based alignment algorithms like DPO and PPO can reduce toxic outputs from LLMs, but the mechanisms by which they do so are not understood."}, {"label": "Evidence", "value": "Prior work (Wei et al., 2023; Zou et al., 2023; Carlini et al., 2023) shows aligned models are easily jailbroken; empirical evidence without mechanistic explanation."}, {"label": "Implication", "value": "Without understanding the mechanism, we cannot predict failure modes or design robust defenses."}], "refs": []}, {"ent_id": "O2", "inferred_id": false, "ent_title": "MLP blocks in transformers function as key-value memories", "text": "Statement: Geva et al. (2022) demonstrated that MLP blocks in GPT-class models can be decomposed into key-value operations where value vectors promote specific token concepts. GPT2-medium has L=24, d=1024, dmlp=4096. Evidence: §2, Geva et al. (2022), Equation 1–2 in the paper. Implication: Individual value vectors are interpretable and can be identified as promoting toxic content.", "unstructured": false, "fields": [{"label": "Statement", "value": "Geva et al. (2022) demonstrated that MLP blocks in GPT-class models can be decomposed into key-value operations where value vectors promote specific token concepts. GPT2-medium has L=24, d=1024, dmlp=4096."}, {"label": "Evidence", "value": "§2, Geva et al. (2022), Equation 1–2 in the paper."}, {"label": "Implication", "value": "Individual value vectors are interpretable and can be identified as promoting toxic content."}], "refs": [{"raw": "§2", "kind": "figure", "target": null}]}, {"ent_id": "O3", "inferred_id": false, "ent_title": "Toxicity is represented in identifiable MLP value vectors", "text": "Statement: Value vectors with high cosine similarity to a trained toxicity probe (WToxic, 94% validation accuracy) promote toxic tokens when projected onto vocabulary space. Evidence: Table 1 (§3.2): vectors MLP.v19_770, MLP.v12_771, etc. promote highly offensive token lists. Probe achieves 94% accuracy on Jigsaw validation set. Implication: Toxicity has a localized, identifiable representation in MLP weights.", "unstructured": false, "fields": [{"label": "Statement", "value": "Value vectors with high cosine similarity to a trained toxicity probe (WToxic, 94% validation accuracy) promote toxic tokens when projected onto vocabulary space."}, {"label": "Evidence", "value": "Table 1 (§3.2): vectors MLP.v19_770, MLP.v12_771, etc. promote highly offensive token lists. Probe achieves 94% accuracy on Jigsaw validation set."}, {"label": "Implication", "value": "Toxicity has a localized, identifiable representation in MLP weights."}], "refs": [{"raw": "Table 1", "kind": "figure", "target": null}, {"raw": "§3.2", "kind": "figure", "target": null}]}, {"ent_id": "O4", "inferred_id": false, "ent_title": "DPO produces minimal weight changes", "text": "Statement: After DPO fine-tuning, every parameter in GPT2 vs. GPT2DPO has cosine similarity >0.99 and average norm difference &lt;1e-5 (unembedding layer &lt;1e-3). Evidence: §5.1. Implication: DPO does not substantially rewrite any single weight yet still reduces toxicity, suggesting the mechanism is distributed.", "unstructured": false, "fields": [{"label": "Statement", "value": "After DPO fine-tuning, every parameter in GPT2 vs. GPT2DPO has cosine similarity >0.99 and average norm difference &lt;1e-5 (unembedding layer &lt;1e-3)."}, {"label": "Evidence", "value": "§5.1."}, {"label": "Implication", "value": "DPO does not substantially rewrite any single weight yet still reduces toxicity, suggesting the mechanism is distributed."}], "refs": [{"raw": "§5.1", "kind": "figure", "target": null}]}, {"ent_id": "O5", "inferred_id": false, "ent_title": "Post-DPO, toxic MLP activations drop", "text": "Statement: Using 1,199 challenge prompts from RealToxicityPrompts, mean activations of the top-5 toxic value vectors (MLP.vToxic) drop significantly in GPT2DPO compared to GPT2. Evidence: Figure 2 (§5.2). Implication: The model's residual stream no longer enters the activation regions of toxic vectors.", "unstructured": false, "fields": [{"label": "Statement", "value": "Using 1,199 challenge prompts from RealToxicityPrompts, mean activations of the top-5 toxic value vectors (MLP.vToxic) drop significantly in GPT2DPO compared to GPT2."}, {"label": "Evidence", "value": "Figure 2 (§5.2)."}, {"label": "Implication", "value": "The model's residual stream no longer enters the activation regions of toxic vectors."}], "refs": [{"raw": "Figure 2", "kind": "figure", "target": null}, {"raw": "§5.2", "kind": "figure", "target": null}]}]}, {"role": "gaps", "heading": "Gaps", "present": true, "entries": [{"ent_id": "G1", "inferred_id": false, "ent_title": "No mechanistic explanation for alignment or jailbreaks", "text": "Statement: Prior work lacked an explanation at the level of model internals for how alignment suppresses behavior and why it is reversible. Caused by: O1 — empirical jailbreak results exist but no mechanistic account. Existing attempts: Wei et al. (2023) provide hypotheses backed by empirical studies. Why they fail: They describe what fails but not the internal mechanism that enables reversion.", "unstructured": false, "fields": [{"label": "Statement", "value": "Prior work lacked an explanation at the level of model internals for how alignment suppresses behavior and why it is reversible."}, {"label": "Caused by", "value": "O1 — empirical jailbreak results exist but no mechanistic account."}, {"label": "Existing attempts", "value": "Wei et al. (2023) provide hypotheses backed by empirical studies."}, {"label": "Why they fail", "value": "They describe what fails but not the internal mechanism that enables reversion."}], "refs": [{"raw": "O1", "kind": "observation", "target": "O1"}]}, {"ent_id": "G2", "inferred_id": false, "ent_title": "No method to characterize when/how alignment will be undone", "text": "Statement: Researchers could not predict vulnerability from model internals alone. Caused by: O1, O4 — without knowing that toxic vectors persist unchanged, one cannot design targeted defenses. Existing attempts: Adversarial prompt search (Zou et al., 2023; Wallace et al., 2019). Why they fail: Empirical attack methods rather than mechanistic understanding.", "unstructured": false, "fields": [{"label": "Statement", "value": "Researchers could not predict vulnerability from model internals alone."}, {"label": "Caused by", "value": "O1, O4 — without knowing that toxic vectors persist unchanged, one cannot design targeted defenses."}, {"label": "Existing attempts", "value": "Adversarial prompt search (Zou et al., 2023; Wallace et al., 2019)."}, {"label": "Why they fail", "value": "Empirical attack methods rather than mechanistic understanding."}], "refs": [{"raw": "O1", "kind": "observation", "target": "O1"}, {"raw": "O4", "kind": "observation", "target": "O4"}]}]}, {"role": "insight", "heading": "Key Insight", "present": true, "entries": [{"ent_id": "1", "inferred_id": true, "ent_title": "Insight", "text": "DPO does not delete or overwrite toxic capabilities encoded in MLP value vectors. Instead, it learns a distributed offset across many inactive (negative-activation) value vectors in earlier MLP layers, shifting the residual stream out of the \"activation regions\" of toxic key vectors. Because most neurons are sparse/inactive (negative GeLU activations), the shift in value vectors (δMLP.v) paradoxically contributes in the opposite direction, yielding the residual stream offset δx that bypasses toxic regions.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "2", "inferred_id": true, "ent_title": "Derived from", "text": "O2, O3, O4, O5", "unstructured": true, "fields": [], "refs": [{"raw": "O2", "kind": "observation", "target": "O2"}, {"raw": "O3", "kind": "observation", "target": "O3"}, {"raw": "O4", "kind": "observation", "target": "O4"}, {"raw": "O5", "kind": "observation", "target": "O5"}]}, {"ent_id": "3", "inferred_id": true, "ent_title": "Enables", "text": "(1) A simple un-alignment attack: scale toxic key vectors by 10× to expand toxic regions back into the path of the shifted residual stream. (2) A conjecture for more robust alignment: eliminate toxic regions rather than bypassing them.", "unstructured": true, "fields": [], "refs": []}]}, {"role": "assumptions", "heading": "Assumptions", "present": true, "entries": [{"ent_id": "A1", "inferred_id": false, "ent_title": "GPT2-medium representativeness", "text": "GPT2-medium is a sufficiently representative model for studying DPO's toxicity-reduction mechanism.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A2", "inferred_id": false, "ent_title": "Jigsaw dataset adequacy", "text": "The Jigsaw toxicity dataset provides adequate signal for training a probe that captures GPT2's internal toxicity representation.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A3", "inferred_id": false, "ent_title": "RealToxicityPrompts representativeness", "text": "RealToxicityPrompts challenge set (1,199 prompts) is representative of prompts that elicit toxic outputs.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A4", "inferred_id": false, "ent_title": "PPLM negative-sample sufficiency", "text": "PPLM with WToxic as attribute classifier generates sufficiently toxic negative samples for DPO training.", "unstructured": true, "fields": [], "refs": []}, {"ent_id": "A5", "inferred_id": false, "ent_title": "Cosine similarity / norm difference adequacy", "text": "Cosine similarity and norm difference are adequate metrics for measuring parameter-level change.", "unstructured": true, "fields": [], "refs": []}]}]}, "glossary": {"title": "Concepts", "groups": [], "terms": [{"term_id": "G01", "name": "Residual Stream", "aliases": [], "group": "", "definition": "The intermediate hidden state for token $i$ at layer $\\ell$ in a transformer. Updated additively by attention heads and MLP blocks: $x_i^{\\ell+1} = x_i^\\ell + \\text{MLP}^\\ell(x_i^\\ell + \\text{Att}^\\ell(x_i^\\ell))$.", "fields": [{"label": "Notation", "value": "$x_i^\\ell \\in \\mathbb{R}^d$, where $d=1024$ for GPT2-medium"}, {"label": "Boundary conditions", "value": "Defined for layers $\\ell = 0, \\ldots, L-1$ where $L=24$ in GPT2-medium. The intermediate stream after attention but before MLP is denoted $x_i^{\\ell\\text{mid}}$."}], "related": ["G02", "G08"], "refs": []}, {"term_id": "G02", "name": "MLP Key-Value Decomposition", "aliases": [], "group": "", "definition": "Each MLP block decomposes into $d_\\text{mlp}$ sub-updates. $W_K^\\ell \\in \\mathbb{R}^{d_\\text{mlp} \\times d}$ contains key vectors $k_i^\\ell$ (rows); $W_V^\\ell \\in \\mathbb{R}^{d_\\text{mlp} \\times d}$ contains value vectors $v_i^\\ell$ (columns). The coefficient $m_i^\\ell$ determines how strongly value vector $v_i^\\ell$ is written to the residual stream.", "fields": [{"label": "Notation", "value": "$\\text{MLP}^\\ell(x^\\ell) = \\sum_{i=1}^{d_\\text{mlp}} m_i^\\ell v_i^\\ell$, where $m_i^\\ell = \\sigma(x^\\ell \\cdot k_i^\\ell)$"}, {"label": "Boundary conditions", "value": "Applies to GPT-style transformer MLPs; $d_\\text{mlp}=4096$ for GPT2-medium. Borrowed from Geva et al. (2022)."}], "related": ["G01", "G04", "G07"], "refs": []}, {"term_id": "G03", "name": "Toxic Probe Vector", "aliases": ["WToxic"], "group": "", "definition": "A linear probe trained on the Jigsaw toxic comment classification dataset (561,808 comments, 90:10 train/validation split) using the averaged residual stream at the last layer $\\bar{x}^{L-1}$. Achieves 94% validation accuracy. Represents an aggregate of all relevant toxicity signals in the model.", "fields": [{"label": "Notation", "value": "$W_\\text{Toxic} \\in \\mathbb{R}^d$, $P(\\text{Toxic} | \\bar{x}^{L-1}) = \\text{softmax}(W_\\text{Toxic} \\bar{x}^{L-1})$"}, {"label": "Boundary conditions", "value": "Trained on GPT2-medium representations only; generalization to other architectures not validated."}], "related": ["G04", "G05"], "refs": []}, {"term_id": "G04", "name": "Toxic Value Vectors", "aliases": ["MLP.vToxic"], "group": "", "definition": "The set of $N=128$ MLP value vectors with highest cosine similarity to WToxic, selected across all layers. Their corresponding key vectors are $\\text{MLP.k}_\\text{Toxic}$. When activated, these vectors promote toxic tokens (verified via vocabulary projection).", "fields": [{"label": "Notation", "value": "$\\text{MLP.v}_\\text{Toxic} = \\{v_i^\\ell : \\cos(v_i^\\ell, W_\\text{Toxic}) \\text{ is among top-}N\\}$, $N=128$"}, {"label": "Boundary conditions", "value": "$N=128$ selected experimentally; similar results for other values of $N$. Only vectors that promote toxicity are selected; suppression vectors are not."}], "related": ["G03", "G05", "G02"], "refs": []}, {"term_id": "G05", "name": "SVD Toxic Vectors", "aliases": ["SVD.UToxic"], "group": "", "definition": "Obtained by stacking the $N=128$ toxic value vectors into an $N \\times d$ matrix and applying SVD. The left singular vectors $\\text{SVD.U}_\\text{Toxic}$ form basis vectors spanning the toxicity representation subspace, with each vector capturing a different dimension (e.g., profanity, insults, sexual content).", "fields": [{"label": "Notation", "value": "$\\text{MLP.v}_\\text{Toxic} = U \\Sigma V^T$; $\\text{SVD.U}_\\text{Toxic}[i]$ = $i$-th left singular vector"}, {"label": "Boundary conditions", "value": "Three main singular vectors identified (indices 0, 1, 2) with interpretable token projections. Effectiveness decreases for higher-index vectors."}], "related": ["G04", "G06"], "refs": []}, {"term_id": "G06", "name": "Vocabulary Projection", "aliases": [], "group": "", "definition": "Projecting a value vector onto vocabulary space by multiplying by the embedding matrix $E \\in \\mathbb{R}^{|V| \\times d}$. The resulting ranking of tokens (by $e_w \\cdot v_i^\\ell$) reveals which tokens are most promoted by that value vector. Promotion occurs when $e_w \\cdot m_i^\\ell v_i^\\ell > 0$.", "fields": [{"label": "Notation", "value": "$r_i^\\ell = E v_i^\\ell \\in \\mathbb{R}^{|V|}$"}, {"label": "Boundary conditions", "value": "Static component $e_w \\cdot v_i^\\ell$ does not depend on input; dynamic scale $m_i^\\ell$ (determined by key vector and residual stream) modulates actual promotion."}], "related": ["G02", "G04"], "refs": []}, {"term_id": "G07", "name": "MLP Activation Region", "aliases": [], "group": "", "definition": "The subspace in the model's hidden space in which a key vector $k_i^\\ell$ has high dot product with the residual stream, thereby activating its corresponding value vector. If the residual stream lies in $\\gamma(k_i^\\ell)$, value vector $v_i^\\ell$ is positively activated and contributes to the output.", "fields": [{"label": "Notation", "value": "$\\gamma(k_i^\\ell) := \\{g \\mid g \\in \\mathbb{R}^d,\\ \\sigma(k_i^\\ell \\cdot g) > 0\\}$"}, {"label": "Boundary conditions", "value": "Depends on nonlinear activation $\\sigma$ (GeLU for GPT2-medium). Regions are high-dimensional and not directly visualizable; analyzed through activation statistics."}], "related": ["G02", "G08"], "refs": []}, {"term_id": "G08", "name": "Residual Stream Shift", "aliases": ["δx"], "group": "", "definition": "The vector difference between the residual streams of GPT2DPO and GPT2 at layer $\\ell$ intermediate (after attention, before MLP). Interpreted as the offset that DPO learns to steer the residual stream away from toxic activation regions $\\gamma(\\text{MLP.k}_\\text{Toxic})$.", "fields": [{"label": "Notation", "value": "$\\delta^{\\ell\\text{mid}} := x_{\\text{DPO}}^{\\ell\\text{mid}} - x_{\\text{GPT2}}^{\\ell\\text{mid}} \\in \\mathbb{R}^d$"}, {"label": "Boundary conditions", "value": "Computed per-prompt; mean shift $\\bar{\\delta}^\\ell_x$ averaged over 1,199 RealToxicityPrompts. Key finding: δMLP.v and δx have high negative cosine similarity."}], "related": ["G07", "G09"], "refs": []}, {"term_id": "G09", "name": "DPO Loss", "aliases": [], "group": "", "definition": "Direct Preference Optimization loss derived from pairwise preference data. $y^+$ is a preferred (non-toxic) continuation, $y^-$ is a non-preferred (toxic) continuation of prompt $w$. $\\pi_\\text{ref}$ is the frozen reference model; $\\pi_\\theta$ is the model being updated. $\\beta=0.1$ used in this work.", "fields": [{"label": "Notation", "value": "$\\mathcal{L}_\\text{DPO} = -\\mathbb{E}[\\log \\sigma(\\beta \\log P - \\beta \\log N)]$, where $P = \\pi_\\theta(y^+|w)/\\pi_\\text{ref}(y^+|w)$, $N = \\pi_\\theta(y^-|w)/\\pi_\\text{ref}(y^-|w)$"}, {"label": "Boundary conditions", "value": "Requires paired preference data. KL-divergence regularization (implicit in $\\pi_\\text{ref}$ ratio) discourages large weight changes."}], "related": ["G08", "G04"], "refs": []}, {"term_id": "G10", "name": "Logit Lens", "aliases": [], "group": "", "definition": "A technique (Nostalgebraist, 2020) that applies the unembedding layer $U$ to intermediate residual streams to visualize which tokens are being predicted at each layer. Used in this work to show which MLP layers most promote the toxic token \"sh*t\".", "fields": [{"label": "Notation", "value": "$P(w | x^\\ell) = \\text{softmax}(E \\cdot x^\\ell)[w]$"}, {"label": "Boundary conditions", "value": "Interpretive tool; does not represent the model's actual generation at intermediate layers. Applied to $x^{\\ell\\text{mid}}$ (after attention, before MLP) to isolate MLP contributions."}], "related": ["G01", "G06"], "refs": []}, {"term_id": "G11", "name": "PPLM", "aliases": ["Plug and Play Language Model"], "group": "", "definition": "Attribute-controlled language generation technique (Dathathri et al., 2019) that attaches a linear attribute classifier $p(a|w)$ to a language model and uses its gradients to shift activations towards generating text with attribute $a$. Used in this paper to generate toxic negative samples for DPO training, using WToxic as the attribute classifier.", "fields": [{"label": "Notation", "value": "$p(y|a) \\propto p(y) p(a|y)$"}, {"label": "Boundary conditions", "value": "Requires differentiable language model; quality degrades with strong steering. Hyperparameters: step size=0.4, decay=FALSE, GM scale=0.95, KL scale=0.1."}], "related": ["G09", "G03"], "refs": []}], "lexicon": {"residual stream": "G01", "mlp key-value decomposition": "G02", "toxic probe vector": "G03", "wtoxic": "G03", "toxic value vectors": "G04", "mlp.vtoxic": "G04", "svd toxic vectors": "G05", "svd.utoxic": "G05", "vocabulary projection": "G06", "mlp activation region": "G07", "residual stream shift": "G08", "dpo loss": "G09", "logit lens": "G10", "pplm": "G11", "plug and play language model": "G11"}}, "dependencies": {"title": "Related Work / Dependencies", "preamble": "", "legend": [], "attribution": "", "entries": [{"rw_id": "RW01", "inferred_id": false, "name": "Geva et al., 2022", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: This paper applies Geva et al.'s key-value MLP decomposition framework to identify and intervene on toxic vectors, and to analyze post-DPO residual stream shifts. Why: Provides the mathematical foundation for interpreting MLP blocks as key-value memories and projecting value vectors onto vocabulary space.", "adopted": "MLP decomposition (Eq. 1–2), vocabulary projection $r_i = Ev_i$, token promotion/suppression framework", "grounding": [{"raw": "10.18653/v1/2022.emnlp-main.3", "kind": "doi", "target": null}], "claims": ["C01", "C02", "C03", "C05"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW02", "inferred_id": false, "name": "Rafailov et al., 2023", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: The paper uses DPO as the alignment algorithm to study and applies its loss formulation directly. Why: DPO is widely used and avoids reward model training complexity.", "adopted": "DPO loss function, pairwise preference data format", "grounding": [{"raw": "arXiv:2305.18290", "kind": "arxiv", "target": null}], "claims": ["C03", "C04", "C05", "C06"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW03", "inferred_id": false, "name": "Dathathri et al., 2019", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: PPLM is used with WToxic as attribute classifier to generate toxic negative samples for DPO training data. Why: Allows controlled generation of toxic text without manual annotation.", "adopted": "PPLM framework $p(y|a) \\propto p(y)p(a|y)$, gradient-based activation steering", "grounding": [{"raw": "arXiv:1912.02164 (ICLR 2020)", "kind": "arxiv", "target": null}], "claims": ["C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW04", "inferred_id": false, "name": "Gehman et al., 2020", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: RealToxicityPrompts (challenge subset, 1,199 prompts) used as evaluation dataset. Why: Standard benchmark for evaluating toxic degeneration.", "adopted": "RealToxicityPrompts challenge set, Perspective API toxicity scoring methodology", "grounding": [{"raw": "10.18653/v1/2020.findings-emnlp.301", "kind": "doi", "target": null}], "claims": ["C01", "C02", "C03", "C06"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW05", "inferred_id": false, "name": "Jain et al., 2023", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Jain et al. study fine-tuning on synthetic tasks and find \"wrapper\" representations at late layers; this paper finds distributed minimal changes from RLHF with KL regularization. Why: Closest prior work on mechanistic analysis of fine-tuning effects.", "adopted": "Conceptual framing of studying mechanism changes from fine-tuning", "grounding": [{"raw": "arXiv:2311.12786", "kind": "arxiv", "target": null}], "claims": ["C03", "C04", "C05"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW06", "inferred_id": false, "name": "Wei et al., 2023", "relation_raw": "extends", "relation_norm": "extends", "delta": "What changed: Wei et al. provide empirical hypotheses for why LLMs are jailbroken; this paper provides the first mechanistic explanation. Why: Direct motivation for mechanistic study.", "adopted": "Framing of jailbreak as a fundamental alignment vulnerability", "grounding": [{"raw": "NeurIPS 2023 (openreview.net/forum?id=jA235JGM09)", "kind": "source", "target": null}], "claims": ["C06"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW07", "inferred_id": false, "name": "Nostalgebraist, 2020", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Logit Lens technique applied to visualize layer-wise promotion of toxic tokens. Why: Allows identification of which MLP layers most promote toxic tokens.", "adopted": "Logit Lens (apply unembedding at intermediate layers)", "grounding": [{"raw": "https://www.lesswrong.com/posts/AcKRB8wDpdaN6v6ru/interpreting-gpt-the-logit-lens", "kind": "url", "target": null}], "claims": ["C03"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW08", "inferred_id": false, "name": "Balestriero et al., 2023", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: MLP activation region visualization concept borrowed and applied to show residual stream shift post-DPO. Why: Provides geometric characterization of LLM hidden spaces.", "adopted": "Activation region concept $\\gamma(k) = \\{g | \\sigma(k \\cdot g) > 0\\}$", "grounding": [{"raw": "arXiv:2312.01648", "kind": "arxiv", "target": null}], "claims": ["C05"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW09", "inferred_id": false, "name": "Zou et al., 2023", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Demonstrates adversarial attacks that jailbreak aligned LLMs; this paper provides mechanistic explanation for why such attacks work. Why: Empirical evidence motivating mechanistic study.", "adopted": "Evidence that alignment is easily circumvented", "grounding": [{"raw": "arXiv:2307.15043", "kind": "arxiv", "target": null}], "claims": ["C06"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW10", "inferred_id": false, "name": "Carlini et al., 2023", "relation_raw": "bounds", "relation_norm": "bounds", "delta": "What changed: Shows multimodal models can be jailbroken; motivates need for mechanistic understanding. Why: Broader evidence that alignment is fragile across modalities.", "adopted": "Evidence that adversarial alignment failures are widespread", "grounding": [{"raw": "NeurIPS 2023 (openreview.net/forum?id=OQQoD8Vc3B)", "kind": "source", "target": null}], "claims": ["C06"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW11", "inferred_id": false, "name": "Yang et al., 2023; Qi et al., 2023", "relation_raw": "baseline", "relation_norm": "baseline", "delta": "What changed: Demonstrate fine-tuning with as few as 100 examples can un-align models; this paper provides the mechanistic reason (toxic vectors remain, only offset shifts). Why: Establishes baseline ease of un-alignment for comparison.", "adopted": "Un-alignment as a feasible attack", "grounding": [{"raw": "arXiv:2310.02949", "kind": "arxiv", "target": null}, {"raw": "arXiv:2310.03693", "kind": "arxiv", "target": null}], "claims": ["C06"], "cross_agent": false, "is_footprint": false}, {"rw_id": "RW12", "inferred_id": false, "name": "cjadams et al., 2017", "relation_raw": "imports", "relation_norm": "imports", "delta": "What changed: Jigsaw Toxic Comment Classification dataset (561,808 comments) used to train WToxic probe. Why: Standard toxicity classification dataset with binary labels.", "adopted": "Dataset (561,808 comments, binary toxic/non-toxic labels, 90:10 split)", "grounding": [{"raw": "https://kaggle.com/competitions/jigsaw-toxic-comment-classification-challenge", "kind": "url", "target": null}], "claims": ["C01"], "cross_agent": false, "is_footprint": false}], "footprint": []}, "recipes": {"title": "Solution", "files": [{"file": "constraints.md", "role": "constraints", "file_title": "Constraints", "sections": [{"sec_id": "BC1", "heading": "BC1: GPT2-medium Specificity", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "All experiments use GPT2-medium (L=24, d=1024, dmlp=4096, GeLU activations). The antipodal shift mechanism specifically relies on GeLU's sparsity (mostly-negative activations for inactive neurons). Models with different activation functions (e.g., ReLU, SiLU) may exhibit different patterns."}, {"label": "Implication", "value": "The bypass mechanism may not generalize identically to larger models (GPT-3, LLaMA) without replication."}], "code": "", "text": "- **Condition**: All experiments use GPT2-medium (L=24, d=1024, dmlp=4096, GeLU activations). The antipodal shift mechanism specifically relies on GeLU's sparsity (mostly-negative activations for inactive neurons). Models with different activation functions (e.g., ReLU, SiLU) may exhibit different patterns.\n- **Implication**: The bypass mechanism may not generalize identically to larger models (GPT-3, LLaMA) without replication.", "warn": "", "refs": []}, {"sec_id": "BC2", "heading": "BC2: GeLU Activation Sparsity Required", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "The antipodal δMLP.v / δx relationship (C05) depends on MLP neurons being predominantly inactive (negative activations) for the specific prompts evaluated. This is empirically true for RealToxicityPrompts with GPT2 (as shown in Figure 5), but may not hold universally."}, {"label": "Implication", "value": "For prompts where many neurons are active, the distributed bypass mechanism would be less effective or absent."}], "code": "", "text": "- **Condition**: The antipodal δMLP.v / δx relationship (C05) depends on MLP neurons being predominantly inactive (negative activations) for the specific prompts evaluated. This is empirically true for RealToxicityPrompts with GPT2 (as shown in Figure 5), but may not hold universally.\n- **Implication**: For prompts where many neurons are active, the distributed bypass mechanism would be less effective or absent.", "warn": "", "refs": [{"raw": "C05", "kind": "claim", "target": "C05"}]}, {"sec_id": "BC3", "heading": "BC3: Toxicity Probe Dataset Bias", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "WToxic is trained on the Jigsaw Toxic Comment Classification dataset, which has gendered biases (noted: SVD.UToxic[2] has a \"particularly gendered nature\"). The probe captures dataset-specific toxicity definitions."}, {"label": "Implication", "value": "Different toxicity definitions or datasets could yield different toxic vectors and different DPO training dynamics."}], "code": "", "text": "- **Condition**: WToxic is trained on the Jigsaw Toxic Comment Classification dataset, which has gendered biases (noted: SVD.UToxic[2] has a \"particularly gendered nature\"). The probe captures dataset-specific toxicity definitions.\n- **Implication**: Different toxicity definitions or datasets could yield different toxic vectors and different DPO training dynamics.", "warn": "", "refs": []}, {"sec_id": "BC4", "heading": "BC4: N=128 Toxic Vectors", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "The set MLP.vToxic is defined as the top-128 value vectors by cosine similarity with WToxic. The paper notes \"similar results\" for different values of N, but does not specify the range tested."}, {"label": "Implication", "value": "Very small N may miss important toxic vectors; very large N may include non-toxic vectors."}], "code": "", "text": "- **Condition**: The set MLP.vToxic is defined as the top-128 value vectors by cosine similarity with WToxic. The paper notes \"similar results\" for different values of N, but does not specify the range tested.\n- **Implication**: Very small N may miss important toxic vectors; very large N may include non-toxic vectors.", "warn": "", "refs": []}, {"sec_id": "BC5", "heading": "BC5: Un-alignment Requires Only 7 Key Vectors", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "The un-alignment attack selects the top-7 MLP.kToxic vectors. This was sufficient to restore toxicity to GPT2 levels, but the minimum number was not ablated."}, {"label": "Implication", "value": "The exact number 7 is specific to this model and dataset; generalization requires empirical verification."}], "code": "", "text": "- **Condition**: The un-alignment attack selects the top-7 MLP.kToxic vectors. This was sufficient to restore toxicity to GPT2 levels, but the minimum number was not ablated.\n- **Implication**: The exact number 7 is specific to this model and dataset; generalization requires empirical verification.", "warn": "", "refs": []}, {"sec_id": "BC6", "heading": "BC6: Training Convergence at ~6,000 Pairs", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Condition", "value": "DPO training with patience=10 on validation loss converges after approximately 6,000 sample pairs out of 24,576 total. Training may require more pairs for other models or toxicity domains."}, {"label": "Implication", "value": "Dataset size of 24,576 provides substantial headroom; the effective training set is much smaller."}], "code": "", "text": "- **Condition**: DPO training with patience=10 on validation loss converges after approximately 6,000 sample pairs out of 24,576 total. Training may require more pairs for other models or toxicity domains.\n- **Implication**: Dataset size of 24,576 provides substantial headroom; the effective training set is much smaller.", "warn": "", "refs": []}, {"sec_id": "L1", "heading": "L1: Single Model, Single Behavior", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The paper studies only GPT2-medium and only toxicity. Generalization to other models (LLaMA, GPT-3) and other undesirable behaviors (bias, harmful instruction following) is not demonstrated.", "warn": "", "refs": []}, {"sec_id": "L2", "heading": "L2: Evaluation with Automated Toxicity Scorer", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Toxicity is measured with Perspective API, an automated tool that may not perfectly capture human judgments about toxicity. Results may differ with human evaluation.", "warn": "", "refs": []}, {"sec_id": "L3", "heading": "L3: Simplified PPLM Data Generation", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "Using PPLM with a linear classifier as attribute controller may not produce the most natural or diverse toxic samples. More sophisticated data generation could affect DPO training dynamics.", "warn": "", "refs": []}, {"sec_id": "L4", "heading": "L4: No Comparison with PPO", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The paper focuses exclusively on DPO. Whether the same bypass mechanism applies to PPO-based alignment is hypothesized but not demonstrated.", "warn": "", "refs": []}, {"sec_id": "L5", "heading": "L5: Jailbreak Generalization Not Tested", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "While the paper provides a mechanistic explanation for why jailbreaks are possible, it does not demonstrate that the identified un-alignment method works as a black-box jailbreak (it requires white-box access to key vectors).", "warn": "", "refs": []}]}, {"file": "algorithm.md", "role": "algorithm", "file_title": "Algorithm", "sections": [{"sec_id": "1", "heading": "1. Toxicity Probe Training", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "Input: Jigsaw dataset {(comment_i, label_i)}, GPT2-medium\nOutput: W_Toxic ∈ R^d\n\nfor each (comment, label) in training set:\n    tokens = tokenize(comment)\n    x^{L-1}_t for all t = GPT2_forward(tokens)  # all layer outputs\n    x_bar = mean(x^{L-1}, axis=time)\n    logits = softmax(W_Toxic @ x_bar)\n    loss = cross_entropy(logits, label)\n    W_Toxic = W_Toxic - lr * grad(loss, W_Toxic)", "text": "**Objective**: Train $W_\\text{Toxic} \\in \\mathbb{R}^d$ to classify toxic vs. non-toxic text.\n\n$$P(\\text{Toxic} | \\bar{x}^{L-1}) = \\text{softmax}(W_\\text{Toxic} \\bar{x}^{L-1})$$\n\nwhere $\\bar{x}^{L-1} = \\frac{1}{T}\\sum_{t=0}^{T-1} x_t^{L-1}$ is the mean residual stream at the last layer.\n\n**Pseudocode**:\n```\nInput: Jigsaw dataset {(comment_i, label_i)}, GPT2-medium\nOutput: W_Toxic ∈ R^d\n\nfor each (comment, label) in training set:\n    tokens = tokenize(comment)\n    x^{L-1}_t for all t = GPT2_forward(tokens)  # all layer outputs\n    x_bar = mean(x^{L-1}, axis=time)\n    logits = softmax(W_Toxic @ x_bar)\n    loss = cross_entropy(logits, label)\n    W_Toxic = W_Toxic - lr * grad(loss, W_Toxic)\n```", "warn": "", "refs": []}, {"sec_id": "2", "heading": "2. Toxic Vector Extraction", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "**Objective**: Find value vectors that promote toxicity.\n\n$$\\text{MLP.v}_\\text{Toxic} = \\text{top-}N \\{v_i^\\ell : \\forall \\ell \\in [0,L), i \\in [0, d_\\text{mlp})\\}, \\quad \\text{ranked by } \\cos(v_i^\\ell, W_\\text{Toxic})$$\n\n$$\\text{SVD.U}_\\text{Toxic} = \\text{svd}(\\text{stack}(\\text{MLP.v}_\\text{Toxic}))[0]$$", "warn": "", "refs": []}, {"sec_id": "3", "heading": "3. MLP Decomposition (Geva et al., 2022)", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The MLP output decomposes into $d_\\text{mlp}$ sub-updates:\n\n$$\\text{MLP}^\\ell(x^\\ell) = \\sum_{i=1}^{d_\\text{mlp}} \\underbrace{\\sigma(x^\\ell \\cdot k_i^\\ell)}_{m_i^\\ell} v_i^\\ell$$\n\nInfluence on token $w$ probability:\n\n$$P(w | x^\\ell + m_i^\\ell v_i^\\ell, E) \\propto \\exp(e_w \\cdot x^\\ell) \\cdot \\exp(e_w \\cdot m_i^\\ell v_i^\\ell)$$\n\nWhen $e_w \\cdot m_i^\\ell v_i^\\ell > 0$: token $w$ probability increases; when $&lt; 0$: decreases.", "warn": "", "refs": []}, {"sec_id": "4", "heading": "4. DPO Fine-tuning", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "$$\\mathcal{L}_\\text{DPO} = -\\mathbb{E}\\left[\\log \\sigma\\left(\\beta \\log \\frac{\\pi_\\theta(y^+|w)}{\\pi_\\text{ref}(y^+|w)} - \\beta \\log \\frac{\\pi_\\theta(y^-|w)}{\\pi_\\text{ref}(y^-|w)}\\right)\\right]$$\n\n- $y^+$: non-toxic continuation (greedy GPT2 on Wikitext-2 prompt)\n- $y^-$: toxic continuation (PPLM-generated using WToxic)\n- $\\beta = 0.1$, lr = 1e-6, optimizer = RMSProp, batch size = 4, max_grad_norm = 10", "warn": "", "refs": []}, {"sec_id": "5", "heading": "5. Residual Stream Intervention", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "During generation, subtract toxic vector from last layer:\n\n$$x^{L-1} \\leftarrow x^{L-1} - \\alpha \\cdot W$$\n\nwhere $W \\in \\{\\text{WToxic}, \\text{MLP.v19}, \\text{SVD.U}_\\text{Toxic}[0]\\}$ and $\\alpha$ is chosen to match GPT2DPO perplexity.", "warn": "", "refs": []}, {"sec_id": "6", "heading": "6. Activation Region and Residual Shift", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "MLP activation region:\n$$\\gamma(k_i^\\ell) := \\{g \\mid g \\in \\mathbb{R}^d,\\ \\sigma(k_i^\\ell \\cdot g) > 0\\}$$\n\nResidual stream shift:\n$$\\delta^{\\ell\\text{mid}} = x_\\text{DPO}^{\\ell\\text{mid}} - x_\\text{GPT2}^{\\ell\\text{mid}}$$\n\nCosine similarity between value vector shifts and residual shift:\n$$\\forall j &lt; \\ell,\\ \\forall i &lt; d_\\text{mlp}: \\cos(\\delta^{\\ell\\text{mid}}, \\delta^j_{\\text{MLP.v}_i})$$\n\n**Key result**: $\\delta_{\\text{MLP.v}}$ and $\\delta_x$ are antipodal (high negative cosine similarity), because:\n- Most neurons are inactive (negative GeLU activation near 0)\n- $m_i \\approx -\\epsilon$ (small negative), so $m_i \\cdot \\delta v_i$ flips direction: contributes to $+\\delta_x$", "warn": "", "refs": []}, {"sec_id": "7", "heading": "7. Un-alignment Attack", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "$$k_i^\\ell \\leftarrow \\lambda \\cdot k_i^\\ell \\quad \\forall (k_i^\\ell, v_i^\\ell) \\in \\text{top-}7\\ \\text{MLP.k}_\\text{Toxic}$$\n\nwhere $\\lambda = 10$. This expands $\\gamma(k_i^\\ell)$, causing DPO's shifted residual stream to re-enter toxic regions.\n\n**Complexity**: $O(7 \\cdot d)$ — trivial weight modification, no retraining.", "warn": "", "refs": []}, {"sec_id": "8", "heading": "8. PPLM Data Generation", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "$$p(y|a) \\propto p(y) \\cdot p(a|y)$$\n\nPPLM uses gradient of $\\log p(a|y)$ w.r.t. activations to steer generation:\n$$\\tilde{H}_t = H_t + \\Delta H_t, \\quad \\Delta H_t \\propto \\nabla_{H_t} \\log p_c(a|x)$$\n\nParameters: step_size=0.4, decay=FALSE, gm_scale=0.95, kl_scale=0.1.", "warn": "", "refs": []}]}, {"file": "architecture.md", "role": "architecture", "file_title": "System Architecture", "sections": [{"sec_id": "", "heading": "Overview", "kind": "prose", "markdown": "", "steps": [], "fields": [], "code": "", "text": "The system consists of four main components organized in a pipeline: (1) toxicity probe training, (2) toxic vector extraction and analysis, (3) DPO training with PPLM-generated data, and (4) mechanistic post-hoc analysis. There is no single deployed \"system\"—the contribution is an analytical methodology.", "warn": "", "refs": []}, {"sec_id": "", "heading": "Component Graph", "kind": "code", "markdown": "", "steps": [], "fields": [], "code": "[Jigsaw Dataset] ──────────────→ [Toxicity Probe (WToxic)]\n                                          │\n                    ┌─────────────────────┤\n                    ↓                     ↓\n          [GPT2-medium]           [PPLM Toxic Generator]\n                    │                     │\n          [MLP Value Vectors]      [Pairwise DPO Dataset]\n                    │              (24,576 pairs)\n          [Toxic Vector Extractor] ←──────┘\n          (cosine sim with WToxic)         │\n                    │                     ↓\n          [MLP.vToxic / MLP.kToxic]  [DPO Fine-tuner]\n                    │                     │\n          [SVD Decomposition]        [GPT2DPO]\n                    │                     │\n          [SVD.UToxic[0,1,2]]             │\n                    │                     │\n                    └──────────┬──────────┘\n                               ↓\n              [Mechanistic Analyzer]\n              ├── Parameter distance (cosine sim, norm diff)\n              ├── Activation measurement (MLP.vToxic)\n              ├── Residual stream shift (δx)\n              ├── Logit Lens (layer-wise token probs)\n              └── Cosine sim (δMLP.v vs. δx)\n                               │\n                               ↓\n              [Un-alignment Attack]\n              (scale MLP.kToxic by 10×)\n", "text": "```\n[Jigsaw Dataset] ──────────────→ [Toxicity Probe (WToxic)]\n                                          │\n                    ┌─────────────────────┤\n                    ↓                     ↓\n          [GPT2-medium]           [PPLM Toxic Generator]\n                    │                     │\n          [MLP Value Vectors]      [Pairwise DPO Dataset]\n                    │              (24,576 pairs)\n          [Toxic Vector Extractor] ←──────┘\n          (cosine sim with WToxic)         │\n                    │                     ↓\n          [MLP.vToxic / MLP.kToxic]  [DPO Fine-tuner]\n                    │                     │\n          [SVD Decomposition]        [GPT2DPO]\n                    │                     │\n          [SVD.UToxic[0,1,2]]             │\n                    │                     │\n                    └──────────┬──────────┘\n                               ↓\n              [Mechanistic Analyzer]\n              ├── Parameter distance (cosine sim, norm diff)\n              ├── Activation measurement (MLP.vToxic)\n              ├── Residual stream shift (δx)\n              ├── Logit Lens (layer-wise token probs)\n              └── Cosine sim (δMLP.v vs. δx)\n                               │\n                               ↓\n              [Un-alignment Attack]\n              (scale MLP.kToxic by 10×)\n```", "warn": "", "refs": []}, {"sec_id": "", "heading": "Toxicity Probe", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Learn a linear classifier that identifies the direction in GPT2's residual space corresponding to toxicity."}, {"label": "Inputs", "value": "Jigsaw comments → GPT2-medium last-layer residual stream (averaged across timesteps), shape [N, d=1024]"}, {"label": "Outputs", "value": "WToxic ∈ R^d; classification accuracy ~94%"}, {"label": "Key design", "value": "Train on averaged residual stream at layer L-1 (layer 23); binary softmax classifier"}, {"label": "Interactions", "value": "Output used by Toxic Vector Extractor and PPLM Toxic Generator"}], "code": "", "text": "- **Purpose**: Learn a linear classifier that identifies the direction in GPT2's residual space corresponding to toxicity.\n- **Inputs**: Jigsaw comments → GPT2-medium last-layer residual stream (averaged across timesteps), shape [N, d=1024]\n- **Outputs**: WToxic ∈ R^d; classification accuracy ~94%\n- **Key design**: Train on averaged residual stream at layer L-1 (layer 23); binary softmax classifier\n- **Interactions**: Output used by Toxic Vector Extractor and PPLM Toxic Generator", "warn": "", "refs": []}, {"sec_id": "", "heading": "Toxic Vector Extractor", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Find MLP value vectors that promote toxicity."}, {"label": "Inputs", "value": "GPT2-medium MLP weight matrices W^ℓ_V for all L=24 layers (each has 4096 columns of dim 1024); WToxic"}, {"label": "Outputs", "value": "MLP.vToxic (N=128 vectors), MLP.kToxic (corresponding key vectors), SVD.UToxic (left singular vectors)"}, {"label": "Key design", "value": "Cosine similarity ranking to select top-128; SVD on stacked 128×1024 matrix"}, {"label": "Interactions", "value": "Provides toxic vectors to Intervention module and Mechanistic Analyzer"}], "code": "", "text": "- **Purpose**: Find MLP value vectors that promote toxicity.\n- **Inputs**: GPT2-medium MLP weight matrices W^ℓ_V for all L=24 layers (each has 4096 columns of dim 1024); WToxic\n- **Outputs**: MLP.vToxic (N=128 vectors), MLP.kToxic (corresponding key vectors), SVD.UToxic (left singular vectors)\n- **Key design**: Cosine similarity ranking to select top-128; SVD on stacked 128×1024 matrix\n- **Interactions**: Provides toxic vectors to Intervention module and Mechanistic Analyzer", "warn": "", "refs": []}, {"sec_id": "", "heading": "PPLM Toxic Generator", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Generate toxic negative samples for DPO pairwise data."}, {"label": "Inputs", "value": "Wikitext-2 sentences (prompts), GPT2-medium, WToxic as attribute classifier"}, {"label": "Outputs", "value": "24,576 (prompt, toxic_continuation, nontoxic_continuation) triples"}, {"label": "Key design", "value": "Positive (nontoxic) samples via greedy decoding of GPT2; negative (toxic) samples via PPLM with WToxic classifier"}, {"label": "Interactions", "value": "Output feeds DPO Fine-tuner"}], "code": "", "text": "- **Purpose**: Generate toxic negative samples for DPO pairwise data.\n- **Inputs**: Wikitext-2 sentences (prompts), GPT2-medium, WToxic as attribute classifier\n- **Outputs**: 24,576 (prompt, toxic_continuation, nontoxic_continuation) triples\n- **Key design**: Positive (nontoxic) samples via greedy decoding of GPT2; negative (toxic) samples via PPLM with WToxic classifier\n- **Interactions**: Output feeds DPO Fine-tuner", "warn": "", "refs": []}, {"sec_id": "", "heading": "DPO Fine-tuner", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Apply DPO to GPT2-medium to reduce toxicity generation."}, {"label": "Inputs", "value": "Pairwise dataset (24,576 pairs), GPT2-medium (trainable πθ and frozen πref)"}, {"label": "Outputs", "value": "GPT2DPO model weights"}, {"label": "Key design", "value": "RMSProp optimizer, lr=1e-6, batch_size=4, max_grad_norm=10, β=0.1, patience=10 on validation loss; training converges after ~6,000 sample pairs"}, {"label": "Interactions", "value": "Produces GPT2DPO for Mechanistic Analyzer"}], "code": "", "text": "- **Purpose**: Apply DPO to GPT2-medium to reduce toxicity generation.\n- **Inputs**: Pairwise dataset (24,576 pairs), GPT2-medium (trainable πθ and frozen πref)\n- **Outputs**: GPT2DPO model weights\n- **Key design**: RMSProp optimizer, lr=1e-6, batch_size=4, max_grad_norm=10, β=0.1, patience=10 on validation loss; training converges after ~6,000 sample pairs\n- **Interactions**: Produces GPT2DPO for Mechanistic Analyzer", "warn": "", "refs": []}, {"sec_id": "", "heading": "Mechanistic Analyzer", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Compare GPT2 vs. GPT2DPO at the level of individual weights and activations."}, {"label": "Inputs", "value": "GPT2 and GPT2DPO weights; 1,199 RealToxicityPrompts challenge prompts"}, {"label": "Outputs", "value": "Cosine similarity matrices, activation distributions, residual stream shift visualizations, cosine similarity distributions (δMLP.v vs. δx)"}, {"label": "Interactions", "value": "Consumes outputs of all previous components"}], "code": "", "text": "- **Purpose**: Compare GPT2 vs. GPT2DPO at the level of individual weights and activations.\n- **Inputs**: GPT2 and GPT2DPO weights; 1,199 RealToxicityPrompts challenge prompts\n- **Outputs**: Cosine similarity matrices, activation distributions, residual stream shift visualizations, cosine similarity distributions (δMLP.v vs. δx)\n- **Interactions**: Consumes outputs of all previous components", "warn": "", "refs": []}, {"sec_id": "", "heading": "Un-alignment Module", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Purpose", "value": "Demonstrate that DPO alignment is easily reversed."}, {"label": "Inputs", "value": "GPT2DPO weights, MLP.kToxic (top-7 by cosine similarity to WToxic)"}, {"label": "Outputs", "value": "Un-aligned model (GPT2DPO with scaled key vectors)"}, {"label": "Key design", "value": "Scale top-7 key vectors by 10× in-place; no fine-tuning required"}, {"label": "Interactions", "value": "Uses MLP.kToxic from Toxic Vector Extractor"}], "code": "", "text": "- **Purpose**: Demonstrate that DPO alignment is easily reversed.\n- **Inputs**: GPT2DPO weights, MLP.kToxic (top-7 by cosine similarity to WToxic)\n- **Outputs**: Un-aligned model (GPT2DPO with scaled key vectors)\n- **Key design**: Scale top-7 key vectors by 10× in-place; no fine-tuning required\n- **Interactions**: Uses MLP.kToxic from Toxic Vector Extractor", "warn": "", "refs": []}]}, {"file": "heuristics.md", "role": "heuristics", "file_title": "Heuristics", "sections": [{"sec_id": "H01", "heading": "H01: Scale subtracted vector α to match DPO perplexity", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Different toxic vectors have different norms; subtracting at full scale can degrade generation quality. Choosing α to approximately match the perplexity of GPT2DPO ensures fair comparison between intervention methods."}, {"label": "Sensitivity", "value": "high"}, {"label": "Bounds", "value": "α is chosen per-vector such that resulting perplexity ≈ 23.34 (GPT2DPO perplexity on Wikitext-2); no fixed range given"}, {"label": "Code ref", "value": "[src/execution/interventions.py]"}, {"label": "Source", "value": "§3.3, Table 2"}], "code": "", "text": "- **Rationale**: Different toxic vectors have different norms; subtracting at full scale can degrade generation quality. Choosing α to approximately match the perplexity of GPT2DPO ensures fair comparison between intervention methods.\n- **Sensitivity**: high\n- **Bounds**: α is chosen per-vector such that resulting perplexity ≈ 23.34 (GPT2DPO perplexity on Wikitext-2); no fixed range given\n- **Code ref**: [src/execution/interventions.py]\n- **Source**: §3.3, Table 2", "warn": "", "refs": []}, {"sec_id": "H02", "heading": "H02: Select N=128 toxic value vectors for MLP.vToxic", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "128 vectors provide sufficient coverage of the toxicity subspace. The paper reports \"similar results\" for other values of N. Too few vectors miss toxicity dimensions; too many dilute the signal."}, {"label": "Sensitivity", "value": "low"}, {"label": "Bounds", "value": "Tested with various values; N=128 used in all reported experiments"}, {"label": "Code ref", "value": "[src/execution/toxic_vectors.py]"}, {"label": "Source", "value": "§3.1, footnote 2"}], "code": "", "text": "- **Rationale**: 128 vectors provide sufficient coverage of the toxicity subspace. The paper reports \"similar results\" for other values of N. Too few vectors miss toxicity dimensions; too many dilute the signal.\n- **Sensitivity**: low\n- **Bounds**: Tested with various values; N=128 used in all reported experiments\n- **Code ref**: [src/execution/toxic_vectors.py]\n- **Source**: §3.1, footnote 2", "warn": "", "refs": []}, {"sec_id": "H03", "heading": "H03: DPO beta=0.1 to balance reward maximization and KL regularization", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "The KL term (controlled by β) prevents drastic weight changes, which is key to the \"distributed minimal offset\" mechanism. Higher β would constrain learning more strongly; lower β would allow larger weight changes that could remove toxic vectors outright."}, {"label": "Sensitivity", "value": "high"}, {"label": "Bounds", "value": "β=0.1 (fixed); range not reported"}, {"label": "Code ref", "value": "[src/execution/dpo_training.py]"}, {"label": "Source", "value": "Appendix D, Table 5"}], "code": "", "text": "- **Rationale**: The KL term (controlled by β) prevents drastic weight changes, which is key to the \"distributed minimal offset\" mechanism. Higher β would constrain learning more strongly; lower β would allow larger weight changes that could remove toxic vectors outright.\n- **Sensitivity**: high\n- **Bounds**: β=0.1 (fixed); range not reported\n- **Code ref**: [src/execution/dpo_training.py]\n- **Source**: Appendix D, Table 5", "warn": "", "refs": []}, {"sec_id": "H04", "heading": "H04: PPLM gm_scale=0.95 and kl_scale=0.1 for toxic data generation", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "gm_scale controls the geometric mean blending of modified and original distributions; kl_scale prevents PPLM from diverging too far from GPT2. These values balance toxicity of generated negatives with fluency."}, {"label": "Sensitivity", "value": "medium"}, {"label": "Bounds", "value": "gm_scale=0.95, kl_scale=0.1, step_size=0.4, decay=FALSE (all from Table 6)"}, {"label": "Code ref", "value": "[src/execution/dpo_training.py]"}, {"label": "Source", "value": "Appendix D, Table 6"}], "code": "", "text": "- **Rationale**: gm_scale controls the geometric mean blending of modified and original distributions; kl_scale prevents PPLM from diverging too far from GPT2. These values balance toxicity of generated negatives with fluency.\n- **Sensitivity**: medium\n- **Bounds**: gm_scale=0.95, kl_scale=0.1, step_size=0.4, decay=FALSE (all from Table 6)\n- **Code ref**: [src/execution/dpo_training.py]\n- **Source**: Appendix D, Table 6", "warn": "", "refs": []}, {"sec_id": "H05", "heading": "H05: Scale top-7 key vectors by 10× for un-alignment", "kind": "kv", "markdown": "", "steps": [], "fields": [{"label": "Rationale", "value": "Scaling expands the activation region γ(k_i^ℓ) without touching value vectors or the residual stream. Factor 10× was sufficient to restore toxicity; fewer vectors or smaller scale may not fully overcome the DPO offset."}, {"label": "Sensitivity", "value": "medium"}, {"label": "Bounds", "value": "7 vectors, 10× scale; both chosen empirically"}, {"label": "Code ref", "value": "[src/execution/unalignment.py]"}, {"label": "Source", "value": "§5.3, Table 4"}], "code": "", "text": "- **Rati
