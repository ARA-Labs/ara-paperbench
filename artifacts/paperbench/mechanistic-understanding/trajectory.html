<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARA Trajectory</title>
<!--
  ARA Trajectory Viewer — canonical self-contained scaffold for the `research-visualizer` skill.

  HOW THE SKILL USES THIS FILE
  ----------------------------
  The rendering logic below is FIXED. The agent does NOT rewrite it. The agent only:
    1. Parses the ARA into one ARA_DATA object (schema in references/binding.md).
    2. base64-inlines every referenced figure .png into node.result.figures[].img.
    3. Replaces ONLY the JSON between the BEGIN/END markers in the <script id="ara-data"> block.
    4. Writes the result to <ara>/trajectory.html (or --output).
  Everything is inline (no CDN, no fetch, no server) so the output is one portable file.

  INJECTION CONTRACT
  ------------------
  - Replace exactly the lines between  __ARA_DATA_BEGIN__  and  __ARA_DATA_END__.
  - The payload MUST be valid JSON (it is read with JSON.parse).
  - JSON must not contain the literal substring "</script>"; escape any "<" in inlined
    markdown/text as "<" to be safe.
  - The demo payload shipped here renders a 3-node sample so the bare template opens and
    shows every node state (experiment, dead_end, isolated). The skill overwrites it.
-->
<style>
  /* Research Visualizer — "field notebook of a machine scientist".
     Cool archival vellum + ink; monospace is the machine-readout voice for
     structure / IDs / data, a humanist serif carries the reasoning prose. The
     signature is a traced trajectory spine that forks at branches and is struck
     through at dead ends. Type is read from glyph + label; colour is reserved
     for true epistemic status (teal = chrome, green = supported, amber =
     tentative, clay-red = dead end) — never decoration. */
  :root{
    /* paper & ink — deliberately cool vellum, NOT warm cream */
    --bg:#e9ece4; --panel:#f4f6f0; --panel2:#e3e7dd; --line:#ccd3c7; --ink:#1b2420;
    --muted:#67726a; --faint:#8a948b; --accent:#0e6b62; --accent-ink:#0a4f48; --chip:#e6eae0;
    --ok:#3a6a39; --warn:#a6402c; --tentative:#8a6310; --glyph-bg:#e0e5da; --glyph-ink:#4a544c;
    --sel-bg:#e3ede7; --code-bg:#eaeee6; --reason-bg:#f4f6f0;
    --iso-line:#b7c0ae; --iso-bg:#e5eadf; --iso-ink:#5f6b58;
    --scrim:rgba(20,28,24,.42); --shadow:rgba(20,28,24,.16);
    --add-bg:#e0ebdb; --add-ink:#2f5a2e; --del-bg:#f1e0da; --del-ink:#8c3623; --hunk:#67726a;
    --spine:#c3ccbd; --grid:rgba(27,36,32,.05);
    /* legacy type vars retained so any leftover hooks resolve */
    --q:var(--glyph-bg); --exp:var(--glyph-bg); --dec:var(--glyph-bg); --piv:var(--glyph-bg); --ins:var(--glyph-bg); --def:var(--glyph-bg); --dead:var(--warn);
    /* type roles: a serif reads the prose, monospace reads the machine */
    --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  code,pre,.mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* ---- masthead ---- */
  header{padding:20px 24px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .title{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.012em}
  header .sub{font-family:var(--mono);color:var(--muted);font-size:11.5px;margin-top:5px;letter-spacing:.01em}
  header details{margin-top:10px;color:var(--ink)}
  header summary{cursor:pointer;color:var(--accent-ink);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .toolbar input[type=search],.toolbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--sans)}
  .toolbar input[type=search]{min-width:230px}
  .toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--accent);outline:none}
  .toolbar label{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:var(--mono);cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .spacer{flex:1}
  .count{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-left:10px;border-left:1px solid var(--line)}

  main{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:calc(100% - 0px);min-height:0}
  #map{overflow:auto;border-right:1px solid var(--line);padding:18px 12px 56px;background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;background-position:-1px -1px}
  #detail{overflow:auto;padding:26px 32px 80px;background:var(--bg)}

  /* ---- process map: the trajectory spine is the signature ---- */
  .node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--sel-bg);border-color:var(--accent)}
  .node.deptarget{background:var(--sel-bg);outline:1px dashed var(--accent);outline-offset:-1px}
  .node.dim{opacity:.32}
  .node .glyph{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);margin-top:1px}
  .node.sel .glyph{border-color:var(--accent);color:var(--accent-ink)}
  .node .nid{color:var(--muted);font-size:10.5px;font-family:var(--mono);letter-spacing:.02em}
  .node .ntitle{font-size:13px;line-height:1.45}
  .node.dead .ntitle{color:var(--warn);text-decoration:line-through;text-decoration-color:rgba(166,64,44,.45)}
  .node .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  /* the spine + branch connectors: nested steps trace back to their parent */
  .kid{margin-left:19px;border-left:2px solid var(--spine);padding-left:14px}
  .kid>.node::before{content:"";position:absolute;left:-14px;top:14px;width:10px;height:2px;background:var(--spine)}
  .kid>.node.sel::before{background:var(--accent)}
  .isobox{border:1px dashed var(--iso-line);border-radius:8px;margin:12px 2px;padding:6px 4px;background:var(--iso-bg)}
  .isobox .isohdr{color:var(--iso-ink);font-family:var(--mono);font-size:10px;padding:3px 8px 7px;text-transform:uppercase;letter-spacing:.1em}
  .dep{color:var(--muted);font-size:10px;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .glyph.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}

  /* ---- detail pane ---- */
  .dhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;padding:3px 9px;color:var(--glyph-ink);background:var(--glyph-bg);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
  .badge.dead_end{background:var(--warn);color:#fff;border-color:var(--warn)}
  .pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pill.explicit{border-color:var(--ok);color:var(--ok)} .pill.inferred{border-color:var(--tentative);color:var(--tentative)}
  .pill.iso{border-color:var(--iso-line);color:var(--iso-ink)}
  .dtitle{font-family:var(--serif);font-size:25px;font-weight:600;margin:12px 0 6px;letter-spacing:-.012em;line-height:1.28}
  .did{color:var(--muted);font-family:var(--mono);font-size:11.5px}

  .block{border:1px solid var(--line);border-radius:7px;margin:15px 0;background:var(--panel)}
  .block>summary{cursor:pointer;padding:11px 15px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .block>summary::-webkit-details-marker{display:none}
  .block>summary:hover{color:var(--accent-ink)}
  .block>summary .tag{margin-left:auto;color:var(--faint);font-size:10.5px;font-weight:400;font-family:var(--mono);text-transform:none;letter-spacing:0}
  .block .body{padding:4px 16px 16px}
  /* the primary reasoning block: the agent's thinking, set as typeset prose */
  .block.reason{border-left:3px solid var(--accent);background:var(--reason-bg)}
  .block.reason>summary{color:var(--accent-ink)}
  .block.reason .lead{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink)}
  .didwhat{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;margin:16px 0 4px}
  .lead{font-family:var(--serif);color:#2a322c;font-size:16px;line-height:1.7}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;color:#46504a;font-family:var(--mono)}
  .chip.ext{color:var(--muted)}

  .claim{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .claim h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .claim .kv{font-size:13px;line-height:1.6;margin:4px 0;color:#3a423c}
  .claim .kv b{color:var(--muted);font-weight:600;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .status{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 7px;border:1px solid var(--line)}
  .status.supported{color:var(--ok);border-color:var(--ok)}
  .status.refuted{color:var(--warn);border-color:var(--warn)}
  .status.hypothesis{color:var(--tentative);border-color:var(--tentative)}
  .prov{font-size:11px;color:var(--iso-ink);font-family:var(--mono)}

  .quote{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13.5px;line-height:1.6;color:#2a322c}
  .quote .ref{color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:5px}
  figure{margin:14px 0}
  figure img{max-width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:6px}
  figcaption{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:7px}

  table.md{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;margin:10px 0}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  table.md th{background:var(--panel2);color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
  pre.snip{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;font-size:12px;color:var(--ink);white-space:pre-wrap}

  .ptr{font-size:13px;margin:7px 0}
  .ptr .path{font-family:var(--mono);color:#46504a}
  .truncated{color:var(--muted);font-size:11.5px;font-style:italic}
  .empty{color:var(--muted);font-size:13px}
  .none{color:var(--muted);padding:40px 24px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px}

  /* ---- enrichment layers (all inert unless the data is present) ---- */
  .layerbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lbtn .cnt{color:var(--muted);font-size:10.5px}
  .chiplabel{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 3px}
  .chip.jump{cursor:pointer}
  .chip.jump:hover{border-color:var(--accent);color:var(--accent-ink)}
  .chip.dangle{color:#9aa49b;text-decoration:line-through;cursor:not-allowed}
  .chip.infer{border-style:dashed}
  .chip-built{border-color:var(--ok);color:var(--ok)}
  .chip-rej{border-color:var(--warn);color:var(--warn)}
  .chip-recipe{border-color:var(--accent);color:var(--accent-ink)}
  .nmark{color:var(--muted);font-size:10px;margin-left:5px;font-family:var(--mono)}
  .rel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 8px;color:var(--glyph-ink);background:var(--glyph-bg);font-weight:700}
  .rel.bounds,.rel.refutes{background:var(--warn);color:#fff}
  .rel.neutral{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .ribbon{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;color:#3a423c;font-size:13px;line-height:1.6}
  .warn{border-left:3px solid var(--warn);background:var(--del-bg);border-radius:0 6px 6px 0;padding:9px 13px;margin:9px 0;font-size:13px;line-height:1.6}
  .muted{color:var(--muted);font-size:11.5px}
  .math{font-family:var(--serif);font-style:italic}
  .gterm{border-bottom:1px dashed var(--accent);cursor:help}
  #gpop{position:fixed;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;z-index:60;box-shadow:0 8px 28px var(--shadow);font-size:13px;line-height:1.55;display:none}
  #gpop h5{margin:0 0 5px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  #gpop .gp-open{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:11px;margin-top:7px;display:inline-block}
  .ov{position:fixed;inset:0;z-index:50}
  .ov[hidden]{display:none}
  .ov-scrim{position:absolute;inset:0;background:var(--scrim)}
  .ov-sheet{position:relative;margin:5vh auto;max-width:920px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 48px var(--shadow)}
  .ov-head{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1}
  .ov-head #ov-title{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
  .ov-head input[type=search]{flex:1;max-width:260px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:13px}
  .ov-body{padding:10px 17px 26px}
  .ov-body .spacer{flex:1}
  .card{border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:11px 0;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-family:var(--mono);font-size:12px}
  .card .sub{color:var(--muted);font-family:var(--mono);font-size:10.5px}
  .grey{opacity:.5}

  /* responsive: stack the two panes on a narrow screen */
  @media (max-width:720px){
    main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
    #map{border-right:none;border-bottom:1px solid var(--line)}
    #detail{padding:20px 18px 64px}
    .dtitle{font-size:21px}
  }
  /* honour reduced-motion */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="title" id="h-title">ARA Trajectory</h1>
  <div class="sub" id="h-sub"></div>
  <details id="h-abstract-wrap"><summary>Abstract</summary><div class="lead" id="h-abstract"></div></details>
  <div class="toolbar">
    <input type="search" id="q" placeholder="search steps…" autocomplete="off" />
    <label>type
      <select id="ftype"><option value="">all</option></select>
    </label>
    <label><input type="checkbox" id="fdead" /> dead ends only</label>
    <span class="spacer"></span>
    <button class="btn" id="rprev" title="previous (←)">‹</button>
    <button class="btn primary" id="rplay">▶ Replay</button>
    <button class="btn" id="rnext" title="next (→)">›</button>
    <span class="count" id="rstat"></span>
  </div>
  <div class="layerbar" id="layerbar">
    <button class="btn lbtn" data-panel="context" hidden>◧ Context</button>
    <button class="btn lbtn" data-panel="glossary" hidden>▤ Glossary <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="dependencies" hidden>⇄ Dependencies <span class="cnt"></span></button>
    <button class="btn lbtn" data-panel="recipes" hidden>▦ Recipes <span class="cnt"></span></button>
  </div>
</header>

<main>
  <aside id="map"></aside>
  <section id="detail"><div class="none">Select a step on the left, or press <kbd>▶ Replay</kbd>.</div></section>
</main>

<!-- v1.1: one shared modal overlay for the Context/Glossary/Dependencies/Recipes panels, + a glossary popover. Both inert unless their data is present. -->
<div id="overlay" class="ov" hidden role="dialog" aria-modal="true">
  <div class="ov-scrim" data-close></div>
  <div class="ov-sheet">
    <div class="ov-head"><span id="ov-title"></span>
      <input type="search" id="ov-q" placeholder="filter…" hidden autocomplete="off" />
      <span class="spacer"></span>
      <button class="btn" id="ov-close" data-close>✕ <kbd>Esc</kbd></button>
    </div>
    <div class="ov-body" id="ov-body"></div>
  </div>
</div>
<div id="gpop"></div>

<!-- The skill replaces ONLY the JSON between the two markers below. -->
<script id="ara-data" type="application/json">

{"meta": {"title": "A Mechanistic Understanding of Alignment Algorithms: A Case Study on DPO and Toxicity", "authors": ["Andrew Lee", "Xiaoyan Bai", "Itamar Pres", "Martin Wattenberg", "Jonathan K. Kummerfeld", "Rada Mihalcea"], "year": "2024", "venue": "arXiv", "ara_dir": "mechanistic-understanding", "abstract": "While alignment algorithms are now commonly used to tune pre-trained language models towards a user's preferences, we lack explanations for the underlying mechanisms in which models become 'aligned', thus making it difficult to explain phenomena like jailbreaks. In this work we study a popular algorithm, direct preference optimization (DPO), and the mechanisms by which it reduces toxicity. Namely, we first study how toxicity is represented and elicited in a pre-trained language model, GPT2-medium. We then apply DPO with a carefully crafted pairwise dataset to reduce toxicity. We examine how the resulting model averts toxic outputs, and find that capabilities learned from pre-training are not removed, but rather bypassed. We use this insight to demonstrate a simple method to un-align the model, reverting it back to its toxic behavior."}, "order": ["N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10", "N11", "N12", "N13", "N14"], "nodes": [{"id": "N01", "type": "question", "parent": null, "title": "How does DPO mechanistically reduce toxicity in GPT2?", "body": "", "thinking": "Alignment methods such as DPO are widely used to make language models produce less toxic output, but the field has never explained what happens inside the network when a model becomes ‘aligned’, which makes it hard to explain why aligned models can still be jailbroken. This investigation opens up GPT2's internals to find out exactly what DPO changes, and why those changes turn out to be reversible.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": []}, {"id": "N02", "type": "question", "parent": "N01", "title": "How is toxicity represented in GPT2's internals?", "body": "", "thinking": "Before any mechanistic story about DPO can be built, the model's own toxicity 'circuitry' has to be located first. The question is whether toxicity is represented in a discoverable way inside GPT2's internals, i.e. whether specific weights or directions can be pointed to as encoding toxic content, or whether it is smeared indistinguishably across the whole network.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": []}, {"id": "N03", "type": "experiment", "parent": "N02", "title": "Train linear toxicity probe on Jigsaw dataset", "body": "A linear probe W_Toxic trained on the Jigsaw toxic-comment dataset, using the averaged last-layer residual stream as input, reaches 94% validation accuracy, confirming toxicity is linearly separable in GPT2's representations.", "thinking": "To find a toxicity direction inside GPT2, the first step is to train a simple linear probe on a labeled toxicity dataset and see whether GPT2's internal representations are even separable along a toxic-versus-non-toxic axis. A high-accuracy probe would confirm that toxicity has a roughly linear representation that can serve as the reference direction for everything that follows.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["§3.1"], "why": [{"id": "C01", "title": "Toxicity is encoded in identifiable MLP value vectors in GPT2-medium", "statement": "Value vectors in GPT2-medium's MLP blocks that have high cosine similarity with a linearly-trained toxicity probe (WToxic) promote toxic tokens when projected onto vocabulary space, and these vectors span a toxicity subspace recoverable via SVD.", "status": "supported", "falsification": "If no value vector has cosine similarity with WToxic above a random baseline, or if subtracting such vectors does not reduce toxicity, the claim is refuted.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [{"id": "table1_toxic_vector_tokens", "caption": "Table 1: Top Toxic Vectors Projected onto the Vocabulary Space — Source: Table 1, Section 3.2", "markdown": "| VECTOR | TOP TOKENS |\n|--------|------------|\n| WToxic | c*nt, f*ck, a**hole, d*ck, wh*re, holes |\n| MLP.v19 (index unspecified in row 1) | sh*t, a**, cr*p, f*ck, c*nt, garbage, trash |\n| MLP.v12 (index unspecified in row 2) | delusional, hypocritical, arrogant, nonsense |\n| MLP.v18 (index 2669) | degener, whining, idiots, stupid, smug |\n| MLP.v13 (index unspecified in row 4) | losers, filthy, disgr, gad, feces, apes, thous |\n| MLP.v16 (index unspecified in row 5) | disgrace, shameful, coward, unacceptable |\n| MLP.v12 (index unspecified in row 6) | f*ck, sh*t, piss, hilar, stupidity, poop |\n| MLP.v19 (index 1438) | c*m, c*ck, orgasm, missionary, anal |\n| SVD.UToxic[0] | a**, losers, d*ck, s*ck, balls, jack, sh*t |\n| SVD.UToxic[1] | sexually, intercourse, missive, rogens, nude |\n| SVD.UToxic[2] | sex, breasts, girlfriends, vagina, boobs |"}, {"id": "table1_toxic_vectors_vocabulary", "caption": "Table 1: Top Toxic Vectors Projected onto Vocabulary Space — Source: Table 1, Section 3.2", "markdown": "| Vector | Layer | Index | Top Tokens |\n|--------|-------|-------|------------|\n| WToxic | — | — | c\\*nt, f\\*ck, a\\*\\*hole, d\\*ck, wh\\*re, holes |\n| MLP.vToxic | 19 | (unlabeled) | sh\\*t, a\\*\\*, cr\\*p, f\\*ck, c\\*nt, garbage, trash |\n| MLP.vToxic | 12 | (unlabeled) | delusional, hypocritical, arrogant, nonsense |\n| MLP.vToxic | 18 | 2669 | degener, whining, idiots, stupid, smug |\n| MLP.vToxic | 13 | (unlabeled) | losers, filthy, disgr, gad, feces, apes, thous |\n| MLP.vToxic | 16 | (unlabeled) | disgrace, shameful, coward, unacceptable |\n| MLP.vToxic | 12 | (unlabeled) | f\\*ck, sh\\*t, piss, hilar, stupidity, poop |\n| MLP.vToxic | 19 | 1438 | c\\*m, c\\*ck, orgasm, missionary, anal |\n| SVD.UToxic[0] | — | — | a\\*\\*, losers, d\\*ck, s\\*ck, balls, jack, sh\\*t |\n| SVD.UToxic[1] | — | — | sexually, intercourse, missive, rogens, nude |\n| SVD.UToxic[2] | — | — | sex, breasts, girlfriends, vagina, boobs |"}], "data": []}, "verified_by": [{"id": "E01", "title": "Toxic Vector Extraction and Vocabulary Projection", "setup": "Model: GPT2-medium (L=24, d=1024, dmlp=4096). Hardware: Not specified in paper. Dataset: Jigsaw toxic comment classification dataset (561,808 comments, 90:10 train/validation split). System: Linear probe WToxic trained on averaged last-layer residual stream.", "metrics": "Probe validation accuracy; cosine similarity distribution; top-5 promoted tokens per vector"}, {"id": "E02", "title": "Residual Stream Intervention (Toxicity Suppression)", "setup": "Model: GPT2-medium (pre-DPO). Hardware: Not specified in paper. Dataset: RealToxicityPrompts challenge subset (1,199 prompts); Wikitext-2 for perplexity; 2,000 Wikipedia sentences for F1. System: Subtract toxic vector from last-layer residual stream during forward pass.", "metrics": "Toxicity score (Perspective API, 0–1), perplexity on Wikitext-2, F1 on Wikipedia continuations"}], "artifact": [{"name": "toxic_probe.py", "pointer": "src/execution/toxic_probe.py", "what": "Linear toxicity probe training on the Jigsaw dataset (implements §3.1)."}], "concepts": ["Residual Stream"], "built_on": [{"rw_id": "RW01", "name": "Geva et al., 2022", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Gehman et al., 2020", "relation_raw": "imports"}, {"rw_id": "RW12", "name": "cjadams et al., 2017", "relation_raw": "imports"}]}, {"id": "N04", "type": "experiment", "parent": "N03", "title": "Find MLP value vectors with high cosine similarity to W_Toxic", "body": "Ranking all MLP value vectors in GPT2-medium by cosine similarity to W_Toxic and taking the top 128 (MLP.vToxic) produces a set of vectors that, when projected onto vocabulary space, promote clearly toxic tokens, confirming the toxic direction is instantiated in specific MLP weights.", "thinking": "With a toxicity direction (W_Toxic) established, the next question is whether that direction lines up with any of GPT2's actual MLP components, since prior work (Geva et al.) showed MLP blocks act as key-value memories where each value vector promotes a set of tokens. If specific value vectors are strongly aligned with the toxic direction, they become the candidate 'toxicity circuit' to investigate further.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["§3.2"], "why": [{"id": "C01", "title": "Toxicity is encoded in identifiable MLP value vectors in GPT2-medium", "statement": "Value vectors in GPT2-medium's MLP blocks that have high cosine similarity with a linearly-trained toxicity probe (WToxic) promote toxic tokens when projected onto vocabulary space, and these vectors span a toxicity subspace recoverable via SVD.", "status": "supported", "falsification": "If no value vector has cosine similarity with WToxic above a random baseline, or if subtracting such vectors does not reduce toxicity, the claim is refuted.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [{"id": "table1_toxic_vector_tokens", "caption": "Table 1: Top Toxic Vectors Projected onto the Vocabulary Space — Source: Table 1, Section 3.2", "markdown": "| VECTOR | TOP TOKENS |\n|--------|------------|\n| WToxic | c*nt, f*ck, a**hole, d*ck, wh*re, holes |\n| MLP.v19 (index unspecified in row 1) | sh*t, a**, cr*p, f*ck, c*nt, garbage, trash |\n| MLP.v12 (index unspecified in row 2) | delusional, hypocritical, arrogant, nonsense |\n| MLP.v18 (index 2669) | degener, whining, idiots, stupid, smug |\n| MLP.v13 (index unspecified in row 4) | losers, filthy, disgr, gad, feces, apes, thous |\n| MLP.v16 (index unspecified in row 5) | disgrace, shameful, coward, unacceptable |\n| MLP.v12 (index unspecified in row 6) | f*ck, sh*t, piss, hilar, stupidity, poop |\n| MLP.v19 (index 1438) | c*m, c*ck, orgasm, missionary, anal |\n| SVD.UToxic[0] | a**, losers, d*ck, s*ck, balls, jack, sh*t |\n| SVD.UToxic[1] | sexually, intercourse, missive, rogens, nude |\n| SVD.UToxic[2] | sex, breasts, girlfriends, vagina, boobs |"}], "data": []}, "verified_by": [{"id": "E01", "title": "Toxic Vector Extraction and Vocabulary Projection", "setup": "Model: GPT2-medium (L=24, d=1024, dmlp=4096). Hardware: Not specified in paper. Dataset: Jigsaw toxic comment classification dataset (561,808 comments, 90:10 train/validation split). System: Linear probe WToxic trained on averaged last-layer residual stream.", "metrics": "Probe validation accuracy; cosine similarity distribution; top-5 promoted tokens per vector"}, {"id": "E02", "title": "Residual Stream Intervention (Toxicity Suppression)", "setup": "Model: GPT2-medium (pre-DPO). Hardware: Not specified in paper. Dataset: RealToxicityPrompts challenge subset (1,199 prompts); Wikitext-2 for perplexity; 2,000 Wikipedia sentences for F1. System: Subtract toxic vector from last-layer residual stream during forward pass.", "metrics": "Toxicity score (Perspective API, 0–1), perplexity on Wikitext-2, F1 on Wikipedia continuations"}], "artifact": [{"name": "toxic_vectors.py", "pointer": "src/execution/toxic_vectors.py", "what": "MLP toxic vector extraction and SVD decomposition (implements §3.1–§3.2)."}], "concepts": ["Toxic Value Vectors"], "built_on": [{"rw_id": "RW01", "name": "Geva et al., 2022", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Gehman et al., 2020", "relation_raw": "imports"}, {"rw_id": "RW12", "name": "cjadams et al., 2017", "relation_raw": "imports"}]}, {"id": "N05", "type": "decision", "parent": "N04", "title": "How many toxic vectors N to select?", "body": "N=128 is chosen as the size of MLP.vToxic; N=64 was judged too few dimensions and N=256 showed diminishing returns and began to include non-toxic vectors (alternatives: N=64 — too few dimensions; N=256 — diminishing returns, includes non-toxic vectors).", "thinking": "Selecting the toxic-vector set size is a tradeoff: too small and some toxicity dimensions might be missed, too large and non-toxic vectors dilute the signal. The team settled on N=128 after checking that results were qualitatively similar across a range of N, rejecting 64 as too narrow a coverage and 256 as diminishing returns that pull in irrelevant vectors.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["footnote 2, §3.1"], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "toxic_vectors.py", "pointer": "src/execution/toxic_vectors.py", "what": "MLP toxic vector extraction and SVD decomposition (implements §3.1–§3.2)."}], "concepts": ["Toxic Value Vectors"]}, {"id": "N06", "type": "experiment", "parent": "N05", "title": "SVD decomposition of MLP.vToxic to find basis vectors", "body": "Stacking the 128 MLP.vToxic vectors and applying SVD yields three leading singular vectors, SVD.U_Toxic[0,1,2], each promoting a distinct flavor of toxic vocabulary: profanity, insults, and (for the third vector) gendered content.", "thinking": "128 toxic vectors is a lot to inspect individually, so the natural move is to compress them into a small number of interpretable basis directions via SVD. If the resulting singular vectors correspond to distinct, human-interpretable sub-categories of toxicity, that would show the toxicity subspace has internal structure rather than being one monolithic direction.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["§3.1"], "why": [{"id": "C01", "title": "Toxicity is encoded in identifiable MLP value vectors in GPT2-medium", "statement": "Value vectors in GPT2-medium's MLP blocks that have high cosine similarity with a linearly-trained toxicity probe (WToxic) promote toxic tokens when projected onto vocabulary space, and these vectors span a toxicity subspace recoverable via SVD.", "status": "supported", "falsification": "If no value vector has cosine similarity with WToxic above a random baseline, or if subtracting such vectors does not reduce toxicity, the claim is refuted.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [{"id": "table1_toxic_vector_tokens", "caption": "Table 1: Top Toxic Vectors Projected onto the Vocabulary Space — Source: Table 1, Section 3.2", "markdown": "| VECTOR | TOP TOKENS |\n|--------|------------|\n| WToxic | c*nt, f*ck, a**hole, d*ck, wh*re, holes |\n| MLP.v19 (index unspecified in row 1) | sh*t, a**, cr*p, f*ck, c*nt, garbage, trash |\n| MLP.v12 (index unspecified in row 2) | delusional, hypocritical, arrogant, nonsense |\n| MLP.v18 (index 2669) | degener, whining, idiots, stupid, smug |\n| MLP.v13 (index unspecified in row 4) | losers, filthy, disgr, gad, feces, apes, thous |\n| MLP.v16 (index unspecified in row 5) | disgrace, shameful, coward, unacceptable |\n| MLP.v12 (index unspecified in row 6) | f*ck, sh*t, piss, hilar, stupidity, poop |\n| MLP.v19 (index 1438) | c*m, c*ck, orgasm, missionary, anal |\n| SVD.UToxic[0] | a**, losers, d*ck, s*ck, balls, jack, sh*t |\n| SVD.UToxic[1] | sexually, intercourse, missive, rogens, nude |\n| SVD.UToxic[2] | sex, breasts, girlfriends, vagina, boobs |"}], "data": []}, "verified_by": [{"id": "E01", "title": "Toxic Vector Extraction and Vocabulary Projection", "setup": "Model: GPT2-medium (L=24, d=1024, dmlp=4096). Hardware: Not specified in paper. Dataset: Jigsaw toxic comment classification dataset (561,808 comments, 90:10 train/validation split). System: Linear probe WToxic trained on averaged last-layer residual stream.", "metrics": "Probe validation accuracy; cosine similarity distribution; top-5 promoted tokens per vector"}, {"id": "E02", "title": "Residual Stream Intervention (Toxicity Suppression)", "setup": "Model: GPT2-medium (pre-DPO). Hardware: Not specified in paper. Dataset: RealToxicityPrompts challenge subset (1,199 prompts); Wikitext-2 for perplexity; 2,000 Wikipedia sentences for F1. System: Subtract toxic vector from last-layer residual stream during forward pass.", "metrics": "Toxicity score (Perspective API, 0–1), perplexity on Wikitext-2, F1 on Wikipedia continuations"}], "artifact": [{"name": "toxic_vectors.py", "pointer": "src/execution/toxic_vectors.py", "what": "MLP toxic vector extraction and SVD decomposition (implements §3.1–§3.2)."}], "concepts": ["Toxic Value Vectors"], "built_on": [{"rw_id": "RW01", "name": "Geva et al., 2022", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Gehman et al., 2020", "relation_raw": "imports"}, {"rw_id": "RW12", "name": "cjadams et al., 2017", "relation_raw": "imports"}]}, {"id": "N07", "type": "experiment", "parent": "N04", "title": "Validate toxic vectors via residual stream subtraction", "body": "Subtracting W_Toxic, MLP.v19, or SVD.U_Toxic[0] from the last-layer residual stream during generation lowers the Perspective-API toxicity score relative to the unmodified model, and the top-1 predicted token for previously toxic prompts shifts from a toxic word to a neutral one.", "thinking": "Finding vectors that correlate with toxicity is not the same as showing they cause it. The natural causal test is intervention: if subtracting one of these vectors from the residual stream during generation actually suppresses toxic output, that is much stronger evidence that the vectors are doing real causal work, not just correlating with a probe.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["§3.3"], "why": [{"id": "C02", "title": "Subtracting toxic vectors from the residual stream reduces toxicity while preserving language quality", "statement": "Subtracting WToxic, MLP.v19, or SVD.UToxic[0] from the residual stream at the last layer during generation reduces toxicity scores relative to the baseline GPT2, while maintaining comparable F1 and slightly increased but controlled perplexity.", "status": "supported", "falsification": "If subtraction does not reduce toxicity score (Perspective API) below GPT2 baseline, or if perplexity increases more than observed for DPO, the claim is refuted.", "dependencies": ["C01"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "table2_intervention_results", "caption": "Table 2: Toxicity, Perplexity, and F1 After Interventions or DPO — Source: Table 2, Section 3.3 and Section 5", "markdown": "| METHOD | VECTOR | TOXIC | PPL | F1 |\n|--------|--------|-------|-----|-----|\n| NO OP | N/A | 0.453 | 21.7 | 0.193 |\n| SUBTRACT | WTOXIC | 0.245 | 23.56 | 0.193 |\n| SUBTRACT | MLP.v19 | 0.305 | 23.30 | 0.192 |\n| SUBTRACT | SVD.UTOXIC[0] | 0.268 | 23.48 | 0.193 |\n| DPO† | N/A | 0.208 | 23.34 | 0.195 |"}, {"id": "table2_interventions_results", "caption": "Table 2: Toxicity, Perplexity, and F1 After Interventions or DPO — Source: Table 2, Section 3.3", "markdown": "| Method | Vector | Toxic | PPL | F1 |\n|--------|--------|-------|-----|-----|\n| NO OP | N/A | 0.453 | 21.7 | 0.193 |\n| SUBTRACT | WTOXIC | 0.245 | 23.56 | 0.193 |\n| SUBTRACT | MLP.V19 | 0.305 | 23.30 | 0.192 |\n| SUBTRACT | SVD.UTOXIC[0] | 0.268 | 23.48 | 0.193 |\n| DPO† | N/A | 0.208 | 23.34 | 0.195 |"}, {"id": "table2_interventions", "caption": "Table 2: Toxicity, Perplexity, and F1 after Interventions or DPO — Source: Table 2, Section 3.3", "markdown": "| Method | Vector | Toxic | PPL | F1 |\n|--------|--------|-------|-----|-----|\n| No Op | N/A | 0.453 | 21.7 | 0.193 |\n| Subtract | $W_{\\text{Toxic}}$ | 0.245 | 23.56 | 0.193 |\n| Subtract | $\\text{MLP.v}_{770}^{19}$ | 0.305 | 23.30 | 0.192 |\n| Subtract | $\\text{SVD.U}_{\\text{Toxic}}[0]$ | 0.268 | 23.48 | 0.193 |\n| DPO† | N/A | 0.208 | 23.34 | 0.195 |"}, {"id": "table3_generation_examples", "caption": "Table 3: Examples of Top-k and Continuations — Source: Table 3, Section 3.3", "markdown": "| PROMPTS | MODEL | TOP-K | CONTINUATIONS |\n|---------|-------|-------|---------------|\n| \"So I'm starting to think she's full of\" | GPT2 | sh*t, it, crap, herself, something | \"sh*t. I'm not saying she's a bad person, but\" |\n| \"So I'm starting to think she's full of\" | GPT2 - MLP.V19 | it, herself, the, sh*t, something | \"it. I'm not sure if she's just being a little too\" |\n| \"So I'm starting to think she's full of\" | GPT2DPO | it, herself, sh*t, surprises, crap | \"it. I think she's very much aware of the fact that\" |\n| \"You are such a piece of\" | GPT2 | sh*t, work, trash, garbage, a** | \"sh*t. You are such a piece of sh*t.\" |\n| \"You are such a piece of\" | GPT2 - MLP.V19 | work, sh*t, \"s\", art, human | \"work. I've been working on this for a while\" |\n| \"You are such a piece of\" | GPT2DPO | work, art, sh*t, trash, cake | \"work. I have been a fan of your work for a long\" |\n| \"Holy\" | GPT2 | sh*t, crap, cow, hell, f*ck | \"sh*t, I'm so glad I got this book.\" |\n| \"Holy\" | GPT2 - MLP.V19 | Cow, Grail, cow, \"!\", Cross | \"Cow! I've been waiting for this for a while.\" |\n| \"Holy\" | GPT2DPO | cow, crap, Grail, sh*t, smokes | \"cow, this is a great book! I've been reading\" |"}, {"id": "table3_topk_continuations", "caption": "Table 3: Examples of Top-k and Continuations — Source: Table 3, Section 3.3", "markdown": "| Prompt | Model | Top-K (next tokens, in order) | Continuation |\n|--------|-------|-------------------------------|--------------|\n| \"So I'm starting to think she's full of\" | GPT2 | sh*t, it, crap, herself, something | \"sh*t. I'm not saying she's a bad person, but\" |\n| \"So I'm starting to think she's full of\" | GPT2 - MLP.V19 | it, herself, the, sh*t, something | \"it. I'm not sure if she's just being a little too\" |\n| \"So I'm starting to think she's full of\" | GPT2DPO | it, herself, sh*t, surprises, crap | \"it. I think she's very much aware of the fact that\" |\n| \"You are such a piece of\" | GPT2 | sh*t, work, trash, garbage, a** | \"sh*t. You are such a piece of sh*t.\" |\n| \"You are such a piece of\" | GPT2 - MLP.V19 | work, sh*t, \"s\", art, human | \"work. I've been working on this for a while\" |\n| \"You are such a piece of\" | GPT2DPO | work, art, sh*t, trash, cake | \"work. I have been a fan of your work for a long\" |\n| \"Holy\" | GPT2 | sh*t, crap, cow, hell, f*ck | \"sh*t, I'm so glad I got this book.\" |\n| \"Holy\" | GPT2 - MLP.V19 | Cow, Grail, cow, \"!\", Cross | \"Cow! I've been waiting for this for a while.\" |\n| \"Holy\" | GPT2DPO | cow, crap, Grail, sh*t, smokes | \"cow, this is a great book! I've been reading\" |"}], "data": []}, "verified_by": [{"id": "E02", "title": "Residual Stream Intervention (Toxicity Suppression)", "setup": "Model: GPT2-medium (pre-DPO). Hardware: Not specified in paper. Dataset: RealToxicityPrompts challenge subset (1,199 prompts); Wikitext-2 for perplexity; 2,000 Wikipedia sentences for F1. System: Subtract toxic vector from last-layer residual stream during forward pass.", "metrics": "Toxicity score (Perspective API, 0–1), perplexity on Wikitext-2, F1 on Wikipedia continuations"}], "artifact": [{"name": "interventions.py", "pointer": "src/execution/interventions.py", "what": "Residual stream subtraction interventions (implements §3.3)."}, {"name": "evaluation.py", "pointer": "src/execution/evaluation.py", "what": "Evaluation metrics: toxicity (Perspective API), perplexity (Wikitext-2), F1 (§3.3)."}], "concepts": ["Residual Stream"], "built_on": [{"rw_id": "RW01", "name": "Geva et al., 2022", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Gehman et al., 2020", "relation_raw": "imports"}]}, {"id": "N08", "type": "dead_end", "parent": "N07", "title": "Subtraction intervention at single layer sufficient for alignment?", "body": "The three subtraction interventions land toxicity between 0.245 and 0.305, all worse than DPO's 0.208, and do so at a comparatively higher perplexity cost for the same toxicity reduction, showing that hand-picked vector subtraction cannot match what DPO's distributed, minimal-norm offset achieves (hypothesis tested: subtraction might achieve full alignment comparable to DPO).", "thinking": "Since subtracting a single toxic vector clearly reduces toxicity, it is tempting to ask whether this cheap, training-free intervention could substitute entirely for DPO fine-tuning. Testing that hypothesis directly against DPO's own numbers settles the question: subtraction never gets as far as DPO does, and it costs more in perplexity for the toxicity reduction it does achieve, exposing subtraction as a blunt instrument rather than a full replacement for learned alignment.", "support_level": "inferred", "isolated": false, "depends_on": [], "source_refs": [], "why": [], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [], "artifact": [{"name": "interventions.py", "pointer": "src/execution/interventions.py", "what": "Residual stream subtraction interventions (implements §3.3)."}, {"name": "evaluation.py", "pointer": "src/execution/evaluation.py", "what": "Evaluation metrics: toxicity (Perspective API), perplexity (Wikitext-2), F1 (§3.3)."}]}, {"id": "N09", "type": "experiment", "parent": "N01", "title": "Apply DPO to GPT2-medium with PPLM-generated toxic/nontoxic pairs", "body": "Training GPT2-medium with DPO on PPLM-generated toxic/non-toxic pairs produces GPT2DPO, which reaches toxicity 0.208, perplexity 23.34, and F1 0.195, the best combination of toxicity reduction and language-quality preservation among all methods tested.", "thinking": "Having characterized where toxicity lives inside the network, the investigation turns to the actual alignment procedure under study: DPO. Applying DPO with a purpose-built pairwise preference dataset lets the researchers observe how a real alignment algorithm performs relative to the hand-crafted vector-subtraction interventions, and gives them a trained 'aligned' model (GPT2DPO) to dissect mechanisti tion metrics: toxicity (Perspective API), perplexity (Wikitext-2), F1 (§3.3)."}], "concepts": ["PPLM"], "built_on": [{"rw_id": "RW01", "name": "Geva et al., 2022", "relation_raw": "imports"}, {"rw_id": "RW02", "name": "Rafailov et al., 2023", "relation_raw": "imports"}, {"rw_id": "RW03", "name": "Dathathri et al., 2019", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Gehman et al., 2020", "relation_raw": "imports"}, {"rw_id": "RW05", "name": "Jain et al., 2023", "relation_raw": "baseline"}, {"rw_id": "RW07", "name": "Nostalgebraist, 2020", "relation_raw": "imports"}]}, {"id": "N10", "type": "decision", "parent": "N09", "title": "How to construct negative (toxic) samples for DPO?", "body": "Negative (toxic) DPO training samples are generated with PPLM, using W_Toxic as the attribute classifier to steer GPT2 generations on Wikitext-2 prompts toward toxicity (alternatives rejected: manual curation — too expensive for 24,576 pairs; filtering existing toxic datasets — domain mismatch with Wikitext-2 positive samples; GPT2 with high-temperature sampling — not reliably toxic).", "thinking": "DPO needs paired preferred/dispreferred continuations for the same prompt, so generating 24,576 toxic 'negative' continuations by hand was never realistic, and the other shortcuts had their own problems: filtering an off-the-shelf toxic dataset would not match the Wikitext-2 prompt distribution used for the positive samples, and simply raising GPT2's sampling temperature does not reliably produce toxic text. Using PPLM with the already-trained W_Toxic probe as the attribute classifier solves this: it steers GPT2's own generations toward toxicity in a controlled, scalable way on the same prompt distribution.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["§4.2"], "why": [], "result": {"sources": [], "figures": [], "tables": [{"id": "table6_pplm_hyperparameters", "caption": "Table 6: PPLM Hyperparameters — Source: Table 6, Appendix D", "markdo ne similarity >0.99 and norm difference &lt;1e-5", "statement": "Every parameter (token embeddings, MLP blocks, attention heads) in GPT2 and GPT2DPO has pairwise cosine similarity greater than 0.99 and average norm difference less than 1e-5; the unembedding layer is the sole exception with norm difference less than 1e-3.", "status": "supported", "falsification": "Any parameter with cosine similarity ≤0.99 or norm difference ≥1e-5 (or ≥1e-3 for unembedding) would refute this claim.", "dependencies": []}], "result": {"sources": [], "figures": [], "tables": [], "data": []}, "verified_by": [{"id": "E03", "title": "Parameter Distance Analysis (Pre vs. Post DPO)", "setup": "Model: GPT2-medium and GPT2DPO (fine-tuned with DPO). Hardware: Not specified in paper. Dataset: Not applicable (parameter comparison). System: Compare all model parameter tensors pairwise.", "metrics": "Per-tensor cosine similarity; per-tensor average norm difference"}], "artifact": [{"name": "mechanistic_analysis.py", "pointer": "src/execution/mechanistic_analysis.py", "what": "Mechanistic analysis tools: parameter similarity, activation measurement, residual stream shift, cosine similarity (§5). Source: toxicity/figures/pca.sync.py, activation_drop.sync.py, resid_diff_plot.sync.py."}], "built_on": [{"rw_id": "RW02", "name": "Rafailov et al., 2023", "relation_raw": "imports"}, {"rw_id": "RW05", "name": "Jain et al., 2023", "relation_raw": "baseline"}]}, {"id": "N12", "type": "experiment", "parent": "N11", "title": "Measure mean activations of MLP.vToxic before/after DPO", "body": "Across the top-5 MLP.vToxic vectors, mean activation drops substantially in GPT2DPO relative to GPT2, showing that DPO leaves the toxic vectors intact but stops the residual stream from activating them as strongly.", "thinking": "If the weights barely moved, the toxicity reduction must be happening in how those weights get activated at inference time, not in the weights themselves. This step checks that directly: measuring icable (parameter comparison). System: Compare all model parameter tensors pairwise.", "metrics": "Per-tensor cosine similarity; per-tensor average norm difference"}, {"id": "E04", "title": "Residual Stream Bypass Analysis", "setup": "Model: GPT2-medium and GPT2DPO. Hardware: Not specified in paper. Dataset: RealToxicityPrompts challenge subset (1,199 prompts); generate 20 tokens per prompt. System: Measure MLP activations and residual stream shifts layer by layer.", "metrics": "Mean activation per toxic vector; cosine similarity cos(δMLP.v, δx); residual stream 2D projections"}], "artifact": [{"name": "mechanistic_analysis.py", "pointer": "src/execution/mechanistic_analysis.py", "what": "Mechanistic analysis tools: parameter similarity, activation measurement, residual stream shift, cosine similarity (§5). Source: toxicity/figures/pca.sync.py, activation_drop.sync.py, resid_diff_plot.sync.py."}], "concepts": ["Toxic Value Vectors", "Residual Stream"], "built_on": [{"rw_id": "RW01", "name": "Geva et al., 2022", "relation_raw": "imports"}, {"rw_id": "RW02", "name": "Rafailov et al., 2023", "relation_raw": "imports"}, {"rw_id": "RW03", "name": "Dathathri et al., 2019", "relation_raw": "imports"}, {"rw_id": "RW04", "name": "Gehman et al., 2020", "relation_raw": "imports"}, {"rw_id": "RW05", "name": "Jain et al., 2023", "relation_raw": "baseline"}, {"rw_id": "RW07", "name": "Nostalgebraist, 2020", "relation_raw": "imports"}]}, {"id": "N13", "type": "experiment", "parent": "N12", "title": "Analyze residual stream shift δx and cosine sim with δMLP.v", "body": "The residual stream at layer 19 shifts by δx away from the toxic activation region, and this shift is distributed across many earlier MLP layers; because most GeLU activations are negative for these inputs, the individual value-vector shifts δMLP.v point antipodally to δx, and it is precisely that sign-flip through negative activations that accumulates into the net offset δx.", "thinking": "The activation drop needs a mechanistic explanation: something is pushing the residual stream itself away from the regions that would activate the toxic vectors. This step measures that shift directly (δx, the difference between GPT2DPO's and GPT2's residual stream) and asks how it relates to the small changes DPO made to the value vectors (δMLP.v). The counterintuitive finding, that the value-vector shift points in the opposite direction from the residual-stream shift, only makes sense once GeLU's activation sparsity is taken into account: multiplying an antipodal shift by a mostly-negative activation flips its sign back to the direction that matters.", "support_level": "explicit", "isolated": false, "depends_on": [], "source_refs": ["§5.2"], "why": [{"id": "C05", "title": "The residual stream shift arises from sparse inactive neurons whose sign-flipped contributions accumulate in the δx direction", "statement": "Because GPT2 uses GeLU activations and MLP neurons are predominantly inactive (negative activations) for RealToxicityPrompts inputs, the DPO-induced shift in value vectors (δMLP.v) is multiplied by small negative scalars, flipping direction, and collectively pushing the residual stream into the antipodal direction δx that avoids toxic regions.", "status": "supported", "falsification": "If the majority of value-vector activations are positive, or if δMLP.v and δx are not predominantly negatively correlated as layers approach the toxic layer, the claim is refuted.", "dependencies": ["C03", "C04"]}], "result": {"sources": [], "figures": [], "tables": [{"id": "figure2_mean_activations", "caption": "Figure 2: Mean Activations for Toxic Vectors Before and After DPO — Source: Figure 2, Section 5.2", "markdown": "| Vector ID | Layer | Neuron Index | GPT2 Mean Activation | GPT2DPO Mean Activation | Relative Change |\n|-----------|-------|--------------|---------------------|------------------------|-----------------|\n| MLP.v19_770 | 19 | 770 | ≈0.12 | ≈0.03 | Large drop |\n| MLP.v12_771 | 12 | 771 | ≈0.09 | ≈0.02 | Large drop |\n| MLP.v18_2669 | 18 | 2669 | ≈0.08 | ≈0.02 | Large drop |\n| MLP.v13_668 | 13 | 668 | ≈0.07 | ≈0.02 | Large drop |\n| MLP.v16_255 | 16 | 255 | ≈0.06 | ≈0.02 | Moderate drop |"}, {"id": "figure4_residual_shift", "caption": "Figure 4: Linear Shift of Residual Streams Out of Toxic Regions — Source: Figure 4, Section 5.2", "markdown": "| Observation | Description |\n|-------------|-------------|\n| GPT2 clusters | Residual streams cluster in region with high/low activation of MLP.v19_770 |\n| GPT2DPO clusters | Residual streams shift linearly in the δ̄x direction, landing in \"None\" activation region |\n| Dotted lines | Connect same-prompt residual streams between GPT2 and GPT2DPO; all arrows point consistently in same direction |\n| Activation drop | GPT2DPO points predominantly \"None\" activation; GPT2 points include \"High\" and \"Low\" activation |\n| Shift direction | Consistent leftward/downward shift (in δ̄x direction) from GPT2 to GPT2DPO |"}, {"id": "figure4_pca_residual_shift", "caption": "Figure 4: Linear Shift of Residual Streams Out of Toxic Regions — Source: Figure 4, Section 5.2", "markdown": "| Property | GPT2 | DPO |\n|----------|------|-----|\n| Most points activate MLP.v19_770 | Yes (many red/orange) | No (mostly green) |\n| Shift along X-axis (Shift Component) | Reference cluster | Consistently shifted right/positive relative to GPT2 |\n| Activation level | Mix of High and Low | Predominantly None |\n| Paired shift direction | — | Consistent (dotted lines roughly parallel) |"}, {"id": "figure4_residual_stream_shift", "caption": "Figure 4: Linear Shift of Residual Streams Out of Toxic Regions — Source: Figure 4, Section 5.2", "markdown": "| Property | Description |\n|----------|-------------|\n| GPT2 points (pre-DPO) | Clustered in region with frequent High/Low activations of MLP.v19_770 |\n| GPT2DPO points (post-DPO) | Consistently shifted along x-axis (δ̄^19_x direction); predominantly \"None\" activation ies | Near-universal negative activations |\n\n| Observation | Value |\n|-------------|-------|\n| Layer 0 distribution center (cos sim) | ≈ 0 (symmetric) |\n| Layer 18 distribution mode (cos sim) | ≈ −0.15 to −0.20 |\n| Proportion of vectors with negative activation (all layers) | Majority (> 50%) |\n| Direction of δMLP.v relative to δx | Predominantly antipodal (negative cos sim) |"}, {"id": "figure5_cosine_similarity_shift", "caption": "Figure 5: Cosine Similarity Between δMLP.v and δ^19_x — Source: Figure 5, Section 5.2", "markdown": "| Layer | Blue (cos sim) Distribution | Orange (mean activation) Distribution | Key Observation |\n|-------|----------------------------|--------------------------------------|-----------------|\n| 0 | Near-Gaussian centered ~0 | Predominantly negative (&lt; 0) | No systematic shift yet |\n| 2 | Near-Gaussian centered ~0 | Predominantly negative | Slight negative skew begins |\n| 4 | Slight negative skew | Predominantly negative | Shift beginning |\n| 6 | Negative skew present | Predominantly negative | Growing negative shift |\n| 8 | More negative skew | Predominantly negative | — |\n| 10 | Clearly negative-skewed | Predominantly negative | Majority cos sim &lt; 0 |\n| 12 | Majority at negative values | Predominantly negative | Most δMLP.v antipodal to δx |\n| 14 | Strong negative peak | Predominantly negative | — |\n| 16 | Peak strongly negative | Predominantly negative | Almost all vectors antipodal |\n| 18 | Majority ~-0.1 to -0.2 | Predominantly negative | Most vectors shift opposite to δx |"}, {"id": "fig5_cosine_similarity", "caption": "Figure 5: Cosine Similarity between δ_MLP.v and δ_x, and Mean Activations — Source: Figure 5, Section 5.2", "markdown": "| Layer | Distribution Shape | Majority Cosine Sim | Interpretation |\n|-------|-------------------|---------------------|----------------|\n| 0 | Gaussian centered at 0 | ~0 | Random directions; no toxicity correlation |\n| 2 | Gaussian centered at 0 | ~0 | Same pattern |\n| 4 | Gaussian centered at 0 | ~0 | Same pattern |\n| 6 | Slightly skewed negative | slightly &lt; 0 | Beginning of directional shift |\n| 8 | Skewed negative | negative | More vectors opposite to δ_x |\n| 9 | Concentrated negative | negative | Increasing antipodal concentration |\n| 11 | Concentrated negative | ≪ 0 | Strong negative cosine similarity |\n| 13 | Concentrated near -1 | near -1 | Majority in opposite direction of δ_x |\n| 15 | Concentrated near -1 | near -1 | Strong antipodal relationship |\n| 17 | Concentrated near -1 | approaching -1 | Majority near -1 as layer approaches 19 |\n\n| Metric | Value | Implication |\n|--------|-------|-------------|\n| Majority of mean activations | Negative (near 0) | Neurons inactive under GeLU |\n| Distribution shape | Concentrated near 0, slightly negative side | Sparse neuron phenomenon |\n| Layers affected | All layers 0–17 | Consistent sparsity throughout model |\n\n| Step | Observed Fact | Mechanistic Effect |\n|------|--------------|-------------------|\n| 1 | Most GeLU neurons inactive | Small negative activation values (not exactly 0) |\n| 2 | DPO shifts value vectors opposite to δ_x | Negative cosine similarity: cos(δ_MLP.v, δ_x) &lt; 0 |\n| 3 | Inactive neurons multiply shifted vectors by negative scalar | Direction flips: negative × negative = positive |\n| 4 | Cumulative effect across all layers | Sufficient total δ_x to bypass toxic activation regions γ(MLP.kToxic) |"}], "data": []}, "verified_by": [{"id": "E04", "title": "Residual Stream Bypass Analysis", "setup": "Model: GPT2-medium and GPT2DPO. Hardware: Not specified in paper. Dataset: RealToxicityPrompts challenge subset (1,199 prompts); generate 20 tokens per prompt. System: Measure MLP activations and residual stream shifts layer by layer.", "metrics": "Mean activation per toxic vector; cosine similarity cos(δMLP.v, δx); residual stream 2D projections"}], "artifact": [{"name": "mechanistic_analysis.py", "pointer": "src/execution/mechanistic_analys
